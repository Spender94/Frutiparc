<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini-Fever</title>
<!--
  Mini-Fever — portage natif JS d'un jeu qui n'est JAMAIS SORTI, calé sur ce que
  le SWF de développement MONTRE quand on l'ouvre (il tourne sous Ruffle, et il
  a servi de référence image par image) :

    · une page BLANCHE (l'embed d'époque : bgcolor #ffffff, 300×300) ;
    · AUCUN menu, aucun écran-titre — la première épreuve démarre seule ;
    · les épreuves s'enchaînent, la difficulté monte de dix par épreuve
      (le mode « fever » : Manager.init() y saute directement) ;
    · la barre de temps du SWF (mcTimerBar), à gauche, à 50 % d'alpha,
      qui se vide par le bas ;
    · perdre une épreuve = l'écran gameOver du SWF ; un clic relance.

  L'arcade des sources (base/Arcade.mt : on choisit son palier, les vies) reste
  jouable — c'est elle qui classe et qui remplit l'album — mais elle se choisit
  SOUS la scène, dans la page : la scène de 240 × 240 reste celle du Flash.

  ?sid= pour la persistance plateforme.
-->
<style>
  /* La page de l'embed d'époque : blanche, le jeu au milieu, rien d'autre. */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ffffff;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #aire {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #stage { display: block; cursor: pointer; background: #ffffff; }

  /* Sous la scène : le choix du mode et l'état — la seule chose qui n'existait
     pas dans le SWF, tenue HORS du cadre de jeu pour cette raison. */
  #bandeau {
    flex: 0 0 auto; width: 100%; max-width: 520px; box-sizing: border-box;
    padding: 10px 14px 14px; text-align: center;
    font-size: 11px; color: #999; line-height: 2;
  }
  #modes a {
    color: #777; text-decoration: none; margin: 0 7px;
    padding: 2px 6px; border-radius: 3px; cursor: pointer;
  }
  #modes a.actif { background: #eee; color: #333; }
  #etat { color: #bbb; }
  #bareme { color: #ccc; font-size: 10px; line-height: 1.5; margin-top: 2px; }
</style>
</head>
<body>
<div id="tout">
  <div id="aire"><canvas id="stage" width="240" height="240"></canvas></div>
  <div id="bandeau">
    <div id="modes"></div>
    <div id="etat">chargement…</div>
    <!-- La règle du classement, écrite là où on choisit sa difficulté : un
         seul tableau pour tous les modes, et le palier fait le multiplicateur. -->
    <div id="bareme">arcade : 10 pts par épreuve remportée, × 2 en normal, × 3 en difficile, × 4 en infernal — un seul classement</div>
  </div>
</div>

<script src="/minifever/engine.js"></script>
<script src="/minifever/client.js"></script>
<script src="/minifever/jeux.js"></script>
<script>
(function () {
'use strict';

const E = window.MinifeverEngine;
const C = window.MinifeverClient;
const { JEUX } = window.MinifeverJeux;

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const sid = params.get('sid') || '';

const canvas = $('stage');
let client = null;
let socle = null;
let modeChoisi = 'fever';           // le SWF s'ouvre sur fever : lui aussi
let enCours = null;                 // la clef de l'épreuve à l'écran
const gagnees = new Set();          // celles remportées dans la partie : les pictos

/*
 * Les modes, sous la scène. « fever » est celui du SWF — il démarre seul,
 * comme l'original. Les paliers d'arcade viennent de base/Arcade.mt.
 */
const MODES = [{ id: 'fever', nom: 'fever' }]
  .concat(E.PALIERS.filter((p) => p.nom).map((p, i) => ({ id: 'arcade' + i, nom: p.nom, palier: i })));

function construireModes() {
  const hote = $('modes');
  hote.innerHTML = '';
  for (const m of MODES) {
    const a = document.createElement('a');
    a.textContent = m.nom;
    a.className = (m.id === modeChoisi) ? 'actif' : '';
    a.addEventListener('click', () => { modeChoisi = m.id; construireModes(); jouer(); });
    hote.appendChild(a);
  }
}

/*
 * Le voyant « en partie » — la même icône que le bureau pose à côté du
 * pseudo (les cerises, greffées à main.swf). On prévient au départ d'une
 * partie, on éteint à l'écran de fin ; la fermeture de l'onglet éteint par
 * sendBeacon, et la déconnexion du chat éteint de toute façon côté serveur.
 */
function direEnPartie(on) {
  if (!sid) return;
  const corps = JSON.stringify({ sid, jeu: 'minifever', on: on ? '1' : '0' });
  if (!on && navigator.sendBeacon) {
    navigator.sendBeacon('/api/light/jeu-en-cours', new Blob([corps], { type: 'application/json' }));
    return;
  }
  fetch('/api/light/jeu-en-cours', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corps,
  }).catch(() => {});
}
window.addEventListener('pagehide', () => direEnPartie(false));

function jouer() {
  gagnees.clear();
  enCours = null;
  const m = MODES.find((x) => x.id === modeChoisi) || MODES[0];
  socle = client.nouvellePartie(
    m.id === 'fever' ? E.Fever : E.Arcade,
    JEUX,
    m.id === 'fever' ? {} : { palier: m.palier });
  client.demarrer();
  direEnPartie(true);
  majEtat();
}

function majEtat(texte) {
  if (texte !== undefined) { $('etat').textContent = texte; return; }
  if (!socle) { $('etat').textContent = ''; return; }
  if (modeChoisi === 'fever') {
    $('etat').textContent = 'épreuve ' + Math.max(1, socle.niveau);
  } else {
    const p = socle.info;
    $('etat').textContent = p.nom + ' · épreuve ' + (socle.niveau + 1) + '/' + p.lvl
      + ' · ' + socle.vies + ' vie' + (socle.vies > 1 ? 's' : '');
  }
}

/*
 * La fin d'une chaîne fever : l'écran gameOver est DANS la scène (le clip du
 * SWF) ; le bandeau dit juste le compte, et l'appui relance — GameOver.mt.
 */
function finFever(d) {
  majEtat((d.niveau - 1) + ' épreuve' + (d.niveau > 2 ? 's' : '') + ' remportée'
    + (d.niveau > 2 ? 's' : '') + ' — cliquer pour rejouer');
}

/* La fin d'une partie d'arcade : le score part à la plateforme. */
function finArcade(d) {
  majEtat(d.gagnee
    ? 'mode ' + d.nom + ' terminé ! — cliquer sur un mode pour rejouer'
    : d.niveau + '/' + d.objectif + ' épreuves — choisir un mode pour rejouer');
  if (!sid) return;
  fetch('/api/minifever/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sid, palier: d.palier, niveau: d.niveau, jouees: d.jouees,
      gagnee: d.gagnee, gagnees: [...gagnees] }),
  }).then((r) => r.json()).then((r) => {
    if (r && r.ok && r.score > 0) {
      $('etat').textContent += ' · ' + r.score + ' pts'
        + (d.palier > 0 ? ' (×' + (1 + d.palier) + ')' : '');
    }
    if (r && r.pictos && r.pictos.length) {
      $('etat').textContent += ' · picto : ' + r.pictos.join(', ');
    }
  }).catch(() => {});
}

/* ── Le chargement, puis la première épreuve — toute seule, comme le SWF. ── */
C.charger('/minifever/sprites/', (c) => {
  $('etat').textContent = 'chargement… ' + Math.round(c * 100) + ' %';
}).then(() => {
  client = new C.Client({
    canvas,
    surEvenement: (nom, d) => {
      if (nom === 'jeu') enCours = d.cle;
      else if (nom === 'resultat' && d.gagne && enCours) gagnees.add(enCours);
      if (nom === 'finPartie') {
        direEnPartie(false);
        if (modeChoisi === 'fever') finFever(d); else finArcade(d);
        return;
      }
      if (nom === 'rejouer') { jouer(); return; }
      majEtat();
    },
  });
  construireModes();
  jouer();
}).catch((e) => {
  $('etat').textContent = 'chargement impossible : ' + e.message;
});

})();
</script>
</body>
</html>
