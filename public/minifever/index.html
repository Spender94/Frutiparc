<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini-Fever</title>
<!--
  Mini-Fever — portage natif JS d'un jeu qui n'est JAMAIS SORTI, calé sur ce que
  le SWF de développement MONTRE quand on l'ouvre (il tourne sous Ruffle, et il
  a servi de référence image par image) :

    · la scène BLANCHE de l'embed d'époque (bgcolor #ffffff, 300×300), posée
      sur le vert de la plateforme comme Mini-Wave et Minipixiz ;
    · l'ÉCRAN D'ACCUEIL officiel des sources (Menu.mt, jamais compilé dans le
      SWF de dev — lui sautait droit au fever) : le titre sur ressort, ses
      bulles, puis les cases de mode qui glissent — fever, arcade et ses
      paliers ; Time et Train, jamais compilés, restent verrouillés ;
    · les épreuves s'enchaînent, la difficulté du fever monte de dix par
      épreuve ; la barre de temps du SWF (mcTimerBar), à gauche, à 50 %
      d'alpha, qui se vide par le bas ;
    · perdre une épreuve = l'écran gameOver du SWF ; un clic relance.

  L'arcade des sources (base/Arcade.mt : on choisit son palier, les vies) est
  celle qui classe et remplit l'album ; le bandeau sous la scène reste un
  RACCOURCI vers chaque mode — la scène de 240 × 240 reste celle du Flash.

  ?sid= pour la persistance plateforme.
-->
<style>
  /* La page : le VERT de la plateforme, comme Mini-Wave et Minipixiz — la
     SCÈNE, elle, reste blanche (le bgcolor de l'embed d'époque). */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ADE76B;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;    /* ni tiré-pour-rafraîchir, ni rebond */
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  /* La scène prend TOUTE la place qui reste — sur téléphone, toute la
     largeur. `flex-basis: 0` : la hauteur de l'aire vient du partage, pas de
     la taille de la toile, sinon les deux se poursuivraient d'une image à
     l'autre (la toile grandit, l'aire grandit, la toile grandit…). */
  #aire {
    flex: 1 1 0; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* La PROTECTION DU GESTE est posée sur la toile ELLE-MÊME, pas seulement
     sur la page : touch-action ne s'hérite pas, et c'est l'élément touché que
     le navigateur consulte d'abord. Sans ça, certains navigateurs confisquent
     le traîner en route (pointercancel : « c'est un défilement ») — le doigt
     continue, le jeu ne le voit plus. Les épreuves qui se jouent en glissant
     (pointillés, assiette, marmite…) mouraient au milieu du geste. */
  #aire { touch-action: none; }
  #stage {
    display: block; cursor: pointer; background: #ffffff;
    touch-action: none;
    -webkit-touch-callout: none;  /* iOS : pas de menu d'appui long */
  }

  /* Sous la scène : le choix du mode et l'état — la seule chose qui n'existait
     pas dans le SWF, tenue HORS du cadre de jeu pour cette raison. */
  #bandeau {
    flex: 0 0 auto; width: 100%; max-width: 520px; box-sizing: border-box;
    padding: 10px 14px 14px; text-align: center;
    font-size: 11px; color: #999; line-height: 2;
  }
  #modes a {
    color: #4b7a26; text-decoration: none; margin: 0 7px;
    padding: 2px 6px; border-radius: 3px; cursor: pointer;
  }
  #modes a.actif { background: #7cbf3a; color: #fff; }
  #etat { color: #3f6620; }
  #bareme { color: #5d8f33; font-size: 10px; line-height: 1.5; margin-top: 2px; }
</style>
</head>
<body>
<div id="tout">
  <div id="aire"><canvas id="stage" width="240" height="240"></canvas></div>
  <div id="bandeau">
    <div id="modes"></div>
    <div id="etat">chargement…</div>
    <!-- La règle du classement, écrite là où on choisit sa difficulté : un
         seul tableau pour tous les modes, et le palier fait le multiplicateur. -->
    <div id="bareme">arcade : 10 pts par épreuve remportée, × 2 en normal, × 3 en difficile, × 4 en infernal — un seul classement</div>
  </div>
</div>

<script src="/minifever/engine.js"></script>
<script src="/minifever/client.js"></script>
<script src="/minifever/jeux.js"></script>
<script>
(function () {
'use strict';

const E = window.MinifeverEngine;
const C = window.MinifeverClient;
const { JEUX } = window.MinifeverJeux;

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const sid = params.get('sid') || '';

const canvas = $('stage');
let client = null;
let socle = null;
let modeChoisi = 'menu';            // l'écran d'accueil officiel, d'abord
let enCours = null;                 // la clef de l'épreuve à l'écran
const gagnees = new Set();          // celles remportées dans la partie : les pictos

/*
 * Les modes, sous la scène — un raccourci : le VRAI choix se fait sur l'écran
 * d'accueil (Menu.mt reconstruit — le SWF de dev, lui, sautait droit au mode
 * fever, menu jamais compilé). Les paliers d'arcade viennent de base/Arcade.mt.
 */
const MODES = [{ id: 'menu', nom: 'menu' }, { id: 'fever', nom: 'fever' }]
  .concat(E.PALIERS.filter((p) => p.nom).map((p, i) => ({ id: 'arcade' + i, nom: p.nom, palier: i })));

function construireModes() {
  const hote = $('modes');
  hote.innerHTML = '';
  for (const m of MODES) {
    const a = document.createElement('a');
    a.textContent = m.nom;
    a.className = (m.id === modeChoisi) ? 'actif' : '';
    a.addEventListener('click', () => { modeChoisi = m.id; construireModes(); jouer(); });
    hote.appendChild(a);
  }
}

/*
 * Le voyant « en partie » — la même icône que le bureau pose à côté du
 * pseudo (les cerises, greffées à main.swf). On prévient au départ d'une
 * partie, on éteint à l'écran de fin ; la fermeture de l'onglet éteint par
 * sendBeacon, et la déconnexion du chat éteint de toute façon côté serveur.
 */
function direEnPartie(on) {
  if (!sid) return;
  const corps = JSON.stringify({ sid, jeu: 'minifever', on: on ? '1' : '0' });
  if (!on && navigator.sendBeacon) {
    navigator.sendBeacon('/api/light/jeu-en-cours', new Blob([corps], { type: 'application/json' }));
    return;
  }
  fetch('/api/light/jeu-en-cours', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corps,
  }).catch(() => {});
}
window.addEventListener('pagehide', () => direEnPartie(false));

function jouer() {
  gagnees.clear();
  enCours = null;
  const m = MODES.find((x) => x.id === modeChoisi) || MODES[0];
  if (m.id === 'menu') {
    // L'écran d'accueil : pas une partie — le voyant reste éteint.
    socle = client.nouvellePartie(E.Menu, JEUX);
    client.demarrer();
    direEnPartie(false);
    majEtat();
    return;
  }
  socle = client.nouvellePartie(
    m.id === 'fever' ? E.Fever : E.Arcade,
    JEUX,
    m.id === 'fever' ? {} : { palier: m.palier });
  client.demarrer();
  direEnPartie(true);
  majEtat();
}

function majEtat(texte) {
  if (texte !== undefined) { $('etat').textContent = texte; return; }
  if (!socle) { $('etat').textContent = ''; return; }
  if (modeChoisi === 'menu') { $('etat').textContent = 'choisis ton mode'; return; }
  if (modeChoisi === 'fever') {
    $('etat').textContent = 'épreuve ' + Math.max(1, socle.niveau);
  } else {
    const p = socle.info;
    $('etat').textContent = p.nom + ' · épreuve ' + (socle.niveau + 1) + '/' + p.lvl
      + ' · ' + socle.vies + ' vie' + (socle.vies > 1 ? 's' : '');
  }
}

/*
 * La fin d'une chaîne fever : l'écran gameOver est DANS la scène (le clip du
 * SWF) ; le bandeau dit juste le compte, et l'appui relance — GameOver.mt.
 */
function finFever(d) {
  majEtat((d.niveau - 1) + ' épreuve' + (d.niveau > 2 ? 's' : '') + ' remportée'
    + (d.niveau > 2 ? 's' : '') + ' — cliquer pour rejouer');
}

/* La fin d'une partie d'arcade : le score part à la plateforme. */
function finArcade(d) {
  majEtat(d.gagnee
    ? 'mode ' + d.nom + ' terminé ! — cliquer sur un mode pour rejouer'
    : d.niveau + '/' + d.objectif + ' épreuves — choisir un mode pour rejouer');
  if (!sid) return;
  fetch('/api/minifever/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sid, palier: d.palier, niveau: d.niveau, jouees: d.jouees,
      gagnee: d.gagnee, gagnees: [...gagnees] }),
  }).then((r) => r.json()).then((r) => {
    if (r && r.ok && r.score > 0) {
      $('etat').textContent += ' · ' + r.score + ' pts'
        + (d.palier > 0 ? ' (×' + (1 + d.palier) + ')' : '');
    }
    if (r && r.pictos && r.pictos.length) {
      $('etat').textContent += ' · picto : ' + r.pictos.join(', ');
    }
  }).catch(() => {});
}

/* ── Le chargement, puis la première épreuve — toute seule, comme le SWF. ── */
C.charger('/minifever/sprites/', (c) => {
  $('etat').textContent = 'chargement… ' + Math.round(c * 100) + ' %';
}).then(() => {
  // Les pictos des épreuves — ceux que la console montre pendant le tirage.
  // Ils ne bloquent PAS le départ : la partie commence, et la console retombe
  // sur le décor du jeu pour les quelques images où ils manquent encore.
  C.chargerPictos(JEUX, '/minifever/pictos/').catch(() => {});
  return null;
}).then(() => {
  client = new C.Client({
    canvas,
    surEvenement: (nom, d) => {
      // L'écran d'accueil a tranché : le mode part.
      if (nom === 'mode') {
        modeChoisi = d.mode === 'fever' ? 'fever' : 'arcade' + d.palier;
        construireModes();
        jouer();
        return;
      }
      if (nom === 'jeu') enCours = d.cle;
      else if (nom === 'resultat' && d.gagne && enCours) gagnees.add(enCours);
      if (nom === 'finPartie') {
        direEnPartie(false);
        if (modeChoisi === 'fever') finFever(d); else finArcade(d);
        return;
      }
      if (nom === 'rejouer') { jouer(); return; }
      majEtat();
    },
  });
  construireModes();
  jouer();
}).catch((e) => {
  $('etat').textContent = 'chargement impossible : ' + e.message;
});

})();
</script>
</body>
</html>
