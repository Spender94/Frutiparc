<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini-Fever</title>
<!--
  Mini-Fever — portage natif JS d'un jeu qui n'est JAMAIS SORTI, calé sur ce que
  le SWF de développement MONTRE quand on l'ouvre (il tourne sous Ruffle, et il
  a servi de référence image par image) :

    · la scène BLANCHE de l'embed d'époque (bgcolor #ffffff, 300×300), posée
      sur le vert de la plateforme comme Mini-Wave et Minipixiz ;
    · l'ÉCRAN D'ACCUEIL officiel des sources (Menu.mt, jamais compilé dans le
      SWF de dev — lui sautait droit au fever) : le titre sur ressort, ses
      bulles, puis les cases de mode qui glissent — fever, arcade et ses
      paliers ; Time et Train, jamais compilés, restent verrouillés ;
    · les épreuves s'enchaînent, la difficulté du fever monte de dix par
      épreuve ; la barre de temps du SWF (mcTimerBar), à gauche, à 50 %
      d'alpha, qui se vide par le bas ;
    · perdre une épreuve = l'écran gameOver du SWF ; un clic relance.

  L'arcade des sources (base/Arcade.mt : on choisit son palier, les vies) est
  celle qui classe et remplit l'album ; le bandeau sous la scène reste un
  RACCOURCI vers chaque mode — la scène de 240 × 240 reste celle du Flash.

  ?sid= pour la persistance plateforme.
-->
<style>
  /* La page : le VERT de la plateforme, comme Mini-Wave et Minipixiz — la
     SCÈNE, elle, reste blanche (le bgcolor de l'embed d'époque). */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ADE76B;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;    /* ni tiré-pour-rafraîchir, ni rebond */
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  /* La scène prend TOUTE la place qui reste — sur téléphone, toute la
     largeur. `flex-basis: 0` : la hauteur de l'aire vient du partage, pas de
     la taille de la toile, sinon les deux se poursuivraient d'une image à
     l'autre (la toile grandit, l'aire grandit, la toile grandit…). */
  #aire {
    flex: 1 1 0; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* La PROTECTION DU GESTE est posée sur la toile ELLE-MÊME, pas seulement
     sur la page : touch-action ne s'hérite pas, et c'est l'élément touché que
     le navigateur consulte d'abord. Sans ça, certains navigateurs confisquent
     le traîner en route (pointercancel : « c'est un défilement ») — le doigt
     continue, le jeu ne le voit plus. Les épreuves qui se jouent en glissant
     (pointillés, assiette, marmite…) mouraient au milieu du geste. */
  #aire { touch-action: none; }
  #stage {
    display: block; cursor: pointer; background: #ffffff;
    touch-action: none;
    -webkit-touch-callout: none;  /* iOS : pas de menu d'appui long */
  }

  /* Sous la scène : le choix du mode et l'état — la seule chose qui n'existait
     pas dans le SWF, tenue HORS du cadre de jeu pour cette raison. */
  #bandeau {
    flex: 0 0 auto; width: 100%; max-width: 520px; box-sizing: border-box;
    padding: 10px 14px 14px; text-align: center;
    font-size: 11px; color: #999; line-height: 2;
  }
  #modes a {
    color: #4b7a26; text-decoration: none; margin: 0 7px;
    padding: 2px 6px; border-radius: 3px; cursor: pointer;
  }
  #modes a.actif { background: #7cbf3a; color: #fff; }
  #etat { color: #3f6620; }
  #bareme { color: #5d8f33; font-size: 10px; line-height: 1.5; margin-top: 2px; }
</style>
<script src="/js/sid-discret.js"></script>
<!-- Les langues du parc (voir /js/i18n.js) : en anglais, le vocabulaire
     commun, les widgets partagés et le dictionnaire du jeu
     (/minifever/lang/en.js) arrivent pendant l'analyse de la page ; en
     français, rien n'est chargé — le français est écrit ici même. -->
<script src="/js/i18n.js"></script>
<script>FPI18n.charger(['commun', 'widgets', '/minifever/lang/{lang}.js']);</script>
<script src="/js/invite.js"></script>
</head>
<body>
<div id="tout">
  <div id="aire"><canvas id="stage" width="240" height="240"></canvas></div>
  <div id="bandeau">
    <div id="modes"></div>
    <div id="etat" data-i18n="minifever.chargement">chargement…</div>
    <!-- La règle du classement, écrite là où on choisit sa difficulté : un
         seul tableau pour tous les modes, et le palier fait le multiplicateur. -->
    <div id="bareme" data-i18n="minifever.baremeDefaut">arcade : 10 pts par épreuve remportée, × 2 en normal, × 3 en difficile, × 4 en infernal — un seul classement</div>
  </div>
</div>

<script src="/js/garde-entrees.js"></script>
<script src="/minifever/engine.js"></script>
<script src="/minifever/client.js"></script>
<script src="/minifever/jeux.js"></script>
<script src="/js/journal-partie.js"></script>
<script src="/minifever/rejeu.js"></script>
<script>
(function () {
'use strict';

const E = window.MinifeverEngine;
const C = window.MinifeverClient;
const { JEUX } = window.MinifeverJeux;
const J = window.JournalPartie || {};

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

/*
 * LES LANGUES (/js/i18n.js, chargé dans le <head>) : le français reste écrit
 * ici, argument de repli de T() ; l'anglais vit dans /minifever/lang/en.js.
 * Les deux textes du bandeau marqués data-i18n passent d'un coup ; en
 * français, appliquer() ne touche à rien. Le nom d'un palier se traduit à
 * l'affichage : engine.js garde le sien (le serveur le lit aussi).
 */
FPI18n.appliquer(document);
const nomPalier = (i, fr) => T('minifever.palier' + i, fr);
/*
 * LE MODE INVITÉ (?invite=1, /js/invite.js) : un visiteur sans compte, lancé
 * depuis l'accueil. Mini-Fever n'a rien à débloquer ; l'invité joue donc sans
 * sid — jamais, même écrit à la main dans l'adresse —, à la règle du jour
 * (le barème public), et la fin de partie pose le panneau d'inscription à la
 * place du « connecte-toi pour enregistrer tes scores ».
 */
const invite = !!(window.FPInvite && FPInvite.actif);
const sid = invite ? '' : ((window.FPSid && FPSid.sid) || params.get('sid') || '');
let bareme = null;                  // le barème du jour (/api/minifever/bareme)

// Les appuis simulés par un script sont refusés et signalés (garde-entrees.js).
if (window.GardeEntrees) window.GardeEntrees.surveiller({ jeu: 'minifever', sid });

const canvas = $('stage');
let client = null;
let socle = null;
let modeChoisi = 'menu';            // l'écran d'accueil officiel, d'abord
let enCours = null;                 // la clef de l'épreuve à l'écran
let demandes = 0;                   // la dernière demande de partie (cf. jouer)

/*
 * Les modes, sous la scène — un raccourci : le VRAI choix se fait sur l'écran
 * d'accueil (Menu.mt reconstruit — le SWF de dev, lui, sautait droit au mode
 * fever, menu jamais compilé). Les paliers d'arcade viennent de base/Arcade.mt.
 */
const MODES = [{ id: 'menu', nom: T('minifever.modeMenu', 'menu') }, { id: 'fever', nom: 'fever' }]
  .concat(E.PALIERS.filter((p) => p.nom).map((p, i) => ({ id: 'arcade' + i, nom: nomPalier(i, p.nom), palier: i })));

function construireModes() {
  const hote = $('modes');
  hote.innerHTML = '';
  for (const m of MODES) {
    const a = document.createElement('a');
    a.textContent = m.nom;
    a.className = (m.id === modeChoisi) ? 'actif' : '';
    a.addEventListener('click', () => { modeChoisi = m.id; construireModes(); jouer(); });
    hote.appendChild(a);
  }
}

/*
 * Le voyant « en partie » — la même icône que le bureau pose à côté du
 * pseudo (les cerises, greffées à main.swf). On prévient au départ d'une
 * partie, on éteint à l'écran de fin ; la fermeture de l'onglet éteint par
 * sendBeacon, et la déconnexion du chat éteint de toute façon côté serveur.
 */
function direEnPartie(on) {
  if (!sid) return;
  const corps = JSON.stringify({ sid, jeu: 'minifever', on: on ? '1' : '0' });
  if (!on && navigator.sendBeacon) {
    navigator.sendBeacon('/api/light/jeu-en-cours', new Blob([corps], { type: 'application/json' }));
    return;
  }
  fetch('/api/light/jeu-en-cours', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corps,
  }).catch(() => {});
}
window.addEventListener('pagehide', () => direEnPartie(false));

/*
 * L'ARCADE SE PROUVE (rejeu.js, et antitricheLight.js côté serveur). Avant la
 * première épreuve, on demande au serveur la graine de la partie et le jeton
 * qui la scelle (trois secondes au plus) ; l'enregistreur se branche sur le
 * socle AVANT son départ, et le journal part avec le bilan en fin de partie.
 * Sans session ou sans réponse, la partie se joue sur une graine locale —
 * elle ne se classera pas, et le bandeau le dira.
 */
function demanderPartie(palier) {
  if (!sid) return Promise.resolve(null);
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const minuteur = setTimeout(() => { if (ctrl) ctrl.abort(); }, 3000);
  return fetch('/api/minifever/partie', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sid, palier }), signal: ctrl ? ctrl.signal : undefined,
  })
    .then((r) => r.json())
    .then((j) => (j && j.ok && j.jeton ? { id: j.id, graine: Number(j.graine) >>> 0, jeton: j.jeton, regle: j.regle || {} } : null))
    .catch(() => null)
    .then((p) => { clearTimeout(minuteur); return p; });
}

function jouer() {
  enCours = null;
  const n = ++demandes;
  const m = MODES.find((x) => x.id === modeChoisi) || MODES[0];
  if (m.id === 'menu') {
    // L'écran d'accueil : pas une partie — le voyant reste éteint.
    socle = client.nouvellePartie(E.Menu, JEUX);
    client.demarrer();
    direEnPartie(false);
    majEtat();
    return;
  }
  if (m.id === 'fever') {
    socle = client.nouvellePartie(E.Fever, JEUX, {});
    client.demarrer();
    direEnPartie(true);
    majEtat();
    return;
  }
  majEtat(T('minifever.preparation', 'préparation de la partie…'));
  demanderPartie(m.palier).then((partie) => {
    if (n !== demandes) return;       // le joueur a choisi autre chose entre-temps
    const verif = { partie, enregistreur: null };
    const graine = partie ? partie.graine : (Math.floor(Math.random() * 4294967296) >>> 0);
    // Le socle s'enregistre dès sa construction : `nouvellePartie` le
    // démarre aussitôt, et la première épreuve se tire au démarrage.
    class ArcadeVerifiee extends E.Arcade {
      constructor(o) {
        super(o);
        verif.enregistreur = window.MinifeverRejeu.brancher(this, graine);
      }
    }
    // La règle du jour donnée avec le jeton : sans plafond depuis le barème
    // de novembre 2026 (l'objectif atteint, on joue jusqu'à la dernière vie).
    // L'invité n'a pas de jeton : il prend la règle du barème public, celle
    // que jouent les membres aujourd'hui.
    const sansPlafond = !!(partie && partie.regle && partie.regle.sansPlafond)
      || (invite && !!(bareme && bareme.sansPlafond));
    socle = client.nouvellePartie(ArcadeVerifiee, JEUX, { palier: m.palier, sansPlafond });
    socle.verif = verif;
    // LES BATTEMENTS (journal-partie.js) : les images journalisées, toutes
    // épreuves bout à bout ; « console » entre deux épreuves (le journal ne
    // la garde pas, le serveur la reconstitue), « pause » quand la partie
    // est figée. Ils s'arrêtent seuls si le joueur relance une partie.
    const cette = socle;
    if (partie && partie.id && J.battements) {
      verif.battements = J.battements({
        sid, id: partie.id, jeton: partie.jeton,
        etat: () => (socle !== cette || !verif.enregistreur ? null : {
          pas: verif.enregistreur.images,
          pause: client.enPause || document.hidden,
          console: !verif.enregistreur.enEpreuve,
        }),
      });
    }
    client.demarrer();
    direEnPartie(true);
    majEtat();
  });
}

function majEtat(texte) {
  if (texte !== undefined) { $('etat').textContent = texte; return; }
  if (!socle) { $('etat').textContent = ''; return; }
  if (modeChoisi === 'menu') { $('etat').textContent = T('minifever.choisisMode', 'choisis ton mode'); return; }
  if (modeChoisi === 'fever') {
    $('etat').textContent = T('minifever.epreuveN', 'épreuve {n}', { n: Math.max(1, socle.niveau) });
  } else {
    const p = socle.info;
    const vies = T.n('minifever.vies', socle.vies, { one: '{n} vie', other: '{n} vies' });
    $('etat').textContent = socle.gagnee
      ? T('minifever.etatAuDela', '{palier} · épreuve {n} (mode terminé, on continue !) · {vies}', { palier: nomPalier(socle.palier, p.nom), n: socle.niveau + 1, vies })
      : T('minifever.etatArcade', '{palier} · épreuve {n}/{lvl} · {vies}', { palier: nomPalier(socle.palier, p.nom), n: socle.niveau + 1, lvl: p.lvl, vies });
  }
}

/*
 * La fin d'une chaîne fever : l'écran gameOver est DANS la scène (le clip du
 * SWF) ; le bandeau dit juste le compte, et l'appui relance — GameOver.mt.
 * Le fever ne classe pas (le barème sous la scène le dit) : on le redit là
 * où le joueur cherche son score.
 */
function finFever(d) {
  majEtat(T.n('minifever.finFever', d.niveau - 1, {
    one: '{n} épreuve remportée (hors classement) — cliquer pour rejouer',
    other: '{n} épreuves remportées (hors classement) — cliquer pour rejouer',
  }));
  // Hors classement, mais pas hors quêtes : la chaîne compte pour Gromelin.
  if (sid && d.niveau > 1) {
    fetch('/api/quetes/mode', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid, jeu: 'minifever', mode: 'fever', v: d.niveau - 1 }) }).catch(() => {});
  }
}

/*
 * LA FIN D'UNE PARTIE D'ARCADE : le score part à la plateforme, ET ON DIT CE
 * QU'IL EN ADVIENT.
 *
 * Il partait en silence. Un refus du serveur, une session expirée, un serveur
 * injoignable (mise en ligne, réseau coupé) laissaient le bandeau sur « mode
 * facile terminé ! » et rien au classement — « mes scores ne s'enregistrent
 * pas », sans que personne puisse dire pourquoi. Et une partie acceptée mais
 * moindre que le record du jour passait pour perdue, alors que le classement
 * garde simplement le meilleur. Chaque issue a maintenant sa phrase ; un
 * serveur injoignable se réessaie une minute durant avant qu'on le déclare
 * perdu, le temps d'une mise en ligne.
 */
const ENVOI_ESSAIS = 12;              // toutes les cinq secondes : une minute
const ENVOI_DELAI = 5000;
// Les CODES du serveur, et la phrase que le client choisit pour chacun.
const MOTIFS = {
  session: T('minifever.motifSession', 'ta session a expiré — reconnecte-toi, puis rejoue'),
  reseau: T('minifever.motifReseau', 'le serveur n\'a pas répondu'),
  partie: T('minifever.motifRefus', 'le serveur a refusé cette partie'),
  niveau: T('minifever.motifRefus', 'le serveur a refusé cette partie'),
  palier: T('minifever.motifPalier', 'ce palier n\'est pas classé'),
  partie_refusee: T('minifever.motifRejeu', 'le serveur n\'a pas retrouvé cette partie en la rejouant'),
  partie_non_verifiee: T('minifever.motifNonVerifiee', 'partie jouée sans le serveur : non classée'),
  jeton: T('minifever.motifJeton', 'jeton de partie refusé'),
  jeton_deja_rendu: T('minifever.motifDejaRendu', 'cette partie a déjà été rendue'),
};
function finArcade(d) {
  const nom = nomPalier(d.palier, d.nom);
  majEtat(d.sansPlafond
    ? (d.gagnee
      ? T('minifever.finAuDela', '{n} épreuves — mode {palier} terminé, et au-delà ! — choisir un mode pour rejouer', { n: d.niveau, palier: nom })
      : T('minifever.finSansPlafond', '{n} épreuves/{objectif} — choisir un mode pour rejouer', { n: d.niveau, objectif: d.objectif }))
    : d.gagnee
      ? T('minifever.finGagnee', 'mode {palier} terminé ! — cliquer sur un mode pour rejouer', { palier: nom })
      : T('minifever.finPerdue', '{n}/{objectif} épreuves — choisir un mode pour rejouer', { n: d.niveau, objectif: d.objectif }));
  const base = $('etat').textContent;
  const cette = socle;                // si le joueur a relancé, on se tait
  // Le dernier battement part juste avant la fin.
  const v0 = (cette && cette.verif) || {};
  const finBattements = v0.battements ? v0.battements.finir() : Promise.resolve();
  v0.battements = null;
  const dire = (t) => { if (socle === cette) $('etat').textContent = base + ' · ' + t; };
  if (invite) { panneauInvite(cette, scoreInvite(d)); return; }
  if (!sid) { dire(T('minifever.connecteToi', 'connecte-toi pour enregistrer tes scores')); return; }
  if (!(d.niveau > 0)) { dire(T('minifever.rienAClasser', 'aucune épreuve remportée : rien à classer')); return; }
  const verif = (cette && cette.verif) || {};
  const nonEnregistre = (motif) => T('minifever.nonEnregistre', 'score NON enregistré : {motif}', { motif });
  if (!verif.partie || !verif.enregistreur) { dire(nonEnregistre(MOTIFS.partie_non_verifiee)); return; }
  const corps = JSON.stringify({ sid, palier: d.palier, niveau: d.niveau, jouees: d.jouees,
    gagnee: d.gagnee, jeton: verif.partie.jeton, journal: verif.enregistreur.journal() });
  let essais = 0;
  const envoyer = () => {
    essais++;
    fetch('/api/minifever/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corps })
      // Le corps se lit même quand le statut n'est pas 200 : c'est là que le
      // serveur explique. Il ne reste « reseau » que si rien n'est lisible.
      .then((r) => r.json().catch(() => null).then((j) => (j && typeof j === 'object' ? j : { ok: false, error: 'reseau' })))
      .catch(() => ({ ok: false, error: 'reseau' }))
      .then((r) => {
        if (r.error === 'reseau' && essais < ENVOI_ESSAIS) {
          dire(T('minifever.enAttente', 'score en attente : serveur injoignable, nouvel essai dans quelques secondes…'));
          setTimeout(envoyer, ENVOI_DELAI);
          return;
        }
        if (!r.ok) { dire(nonEnregistre(MOTIFS[r.error] || MOTIFS.reseau)); return; }
        const mult = Number(r.mult) || (1 + d.palier);
        let t = r.score + ' pts' + (mult > 1 ? ' (×' + mult + ')' : '');
        if (r.classe) t += T('minifever.auClassement', ' — au classement du jour');
        else if (r.record > 0) t += T('minifever.meilleurReste', ' — ton meilleur du jour reste {record} : le classement garde le meilleur', { record: r.record });
        if (r.pictos && r.pictos.length) t += T('minifever.picto', ' · picto : {pictos}', { pictos: r.pictos.join(', ') });
        dire(t);
      });
  };
  finBattements.then(envoyer);
}

/*
 * L'INVITÉ, EN FIN DE PARTIE : le panneau « Tu veux enregistrer tes scores ?
 * Inscris-toi ! » (/js/invite.js), une fois par partie, par-dessus la scène
 * de fin — « Rejouer » relance le même mode.
 *
 * L'arcade s'arrête net sur sa console (le bandeau dit « choisir un mode ») :
 * le panneau vient un instant après, que l'on voie la fin ; si le joueur a
 * déjà relancé, il ne vient pas. Le fever, lui, attend un appui sur son
 * écran gameOver : le panneau se pose à cet appui (`rejouer`), à la place de
 * la relance.
 *
 * Le score de l'arcade se compte comme le serveur le compterait (10 points
 * par épreuve remportée, × le multiplicateur du palier au barème du jour), et
 * s'écrit comme le bandeau l'écrit à un membre : « 120 pts (×3) ».
 */
const DELAI_PANNEAU_INVITE = 1200;
function scoreInvite(d) {
  const mult = (bareme && Number(bareme.mult[d.palier])) || (1 + (Number(d.palier) || 0));
  const pts = (Number(d.niveau) || 0) * 10 * mult;
  return { score: pts + ' pts' + (mult > 1 ? ' (×' + mult + ')' : ''), libelle: 'Ton score', libelleEn: 'Your score' };
}
function panneauInvite(cette, opts) {
  setTimeout(() => {
    if (socle !== cette || !window.FPInvite) return;   // le joueur a relancé : on se tait
    window.FPInvite.finDePartie(Object.assign({ surRejouer: () => { if (socle === cette) jouer(); } }, opts));
  }, DELAI_PANNEAU_INVITE);
}

/* ── Le barème du jour, sous la scène (il a changé en novembre 2026). ── */
fetch('/api/minifever/bareme').then((r) => r.json()).then((b) => {
  if (!b || !b.ok || !Array.isArray(b.mult)) return;
  bareme = b;
  const m = { normal: b.mult[1], difficile: b.mult[2], infernal: b.mult[3] };
  $('bareme').textContent = b.sansPlafond
    ? T('minifever.baremeSansPlafond', 'arcade : 10 pts par épreuve remportée, × {normal} en normal, × {difficile} en difficile, × {infernal} en infernal — sans plafond : on joue jusqu\'à la dernière vie — un seul classement', m)
    : T('minifever.bareme', 'arcade : 10 pts par épreuve remportée, × {normal} en normal, × {difficile} en difficile, × {infernal} en infernal — un seul classement', m);
}).catch(() => {});

/* ── Le chargement, puis la première épreuve — toute seule, comme le SWF. ── */
C.charger('/minifever/sprites/', (c) => {
  $('etat').textContent = T('minifever.chargementPct', 'chargement… {pct} %', { pct: Math.round(c * 100) });
}).then(() => {
  // Les pictos des épreuves — ceux que la console montre pendant le tirage.
  // Ils ne bloquent PAS le départ : la partie commence, et la console retombe
  // sur le décor du jeu pour les quelques images où ils manquent encore.
  C.chargerPictos(JEUX, '/minifever/pictos/').catch(() => {});
  return null;
}).then(() => {
  client = new C.Client({
    canvas,
    surEvenement: (nom, d) => {
      // L'écran d'accueil a tranché : le mode part.
      if (nom === 'mode') {
        modeChoisi = d.mode === 'fever' ? 'fever' : 'arcade' + d.palier;
        construireModes();
        jouer();
        return;
      }
      if (nom === 'jeu') enCours = d.cle;
      if (nom === 'finPartie') {
        direEnPartie(false);
        if (modeChoisi === 'fever') finFever(d); else finArcade(d);
        return;
      }
      if (nom === 'rejouer') {
        // L'invité : l'appui qui relançait pose d'abord le panneau d'inscription.
        if (invite && socle && !socle.inviteVu && window.FPInvite) {
          socle.inviteVu = true;
          const cette = socle, n = Math.max(0, (Number(d.niveau) || 0) - 1);
          if (window.FPInvite.finDePartie({ score: String(n), libelle: 'Épreuves remportées', libelleEn: 'Rounds won',
            surRejouer: () => { if (socle === cette) jouer(); } })) return;
        }
        jouer(); return;
      }
      majEtat();
    },
  });
  construireModes();
  jouer();
  // La poignée des tests de bout en bout (comme window.__frutisnake) : le
  // client, et la partie à l'écran.
  window.__minifever = { client, get socle() { return socle; } };
}).catch((e) => {
  $('etat').textContent = T('minifever.chargementImpossible', 'chargement impossible : {erreur}', { erreur: e.message });
});

})();
</script>
<!-- Le disque sorti de la Frusion referme cette fenêtre (voir le fichier). -->
<script src="/js/eject-watch.js" data-jeu="minifever"></script>
