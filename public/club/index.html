<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Club Frutiparc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #ADE76B;
    color: #335511;
    padding: 12px;
  }
  .club-shell {
    background: #fff;
    border-radius: 7px;
    overflow: hidden;
    padding: 6px;
    border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF;
  }
  a { color: #2C4A0F; text-decoration: none; }
  a:hover { text-decoration: underline; color: #2C4A0F; }

  /* Header (white zone with icon + coral title — phpBB subSilver style) */
  .club-header {
    background: #fff;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .club-header .bc-icon {
    font-size: 16px;
    line-height: 1;
    vertical-align: middle;
  }
  .club-header .title-link {
    color: #E3756A;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
  }

  /* Tab bar — coral header strip */
  .tabs {
    display: flex;
    gap: 0;
    background: #E3756A;
    height: 25px;
    align-items: stretch;
    border-radius: 7px 7px 0 0;
    overflow: hidden;
  }
  .tab {
    flex: 1;
    background: transparent;
    color: #fff;
    border: none;
    cursor: pointer;
    font-family: Arial, Verdana, sans-serif;
    font-weight: bold;
    font-size: 12px;
    padding: 0 12px;
  }
  .tab:hover { background: #d2645a; }
  .tab.active {
    background: #fff;
    color: #E3756A;
  }

  .panel {
    background: #fff;
  }
  .panel.hidden { display: none; }

  /* Toolbar above content (catLeft green) */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #ADE76B;
    padding: 6px 10px;
    height: 28px;
    color: #2C4A0F;
    font-size: 11px;
    font-weight: bold;
  }
  .toolbar label {
    color: #2C4A0F;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .summary {
    color: #2C4A0F;
    font-size: 11px;
    font-weight: bold;
    margin-left: auto;
  }

  /* Buttons mirror the forum's act-btn / btn styles */
  .btn {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    background: #E3756A;
    line-height: 1.4;
  }
  .btn:hover { background: #d2645a; color: #fff; text-decoration: none; }

  select {
    padding: 1px 4px;
    border: none;
    background: #C3EF93;
    color: #2C4A0F;
    font-family: Verdana, sans-serif;
    font-size: 10px;
  }

  /* Medalists table — column header in coral, rows alternating green */
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: #E3756A;
    color: #fff;
    padding: 5px 8px;
    text-align: left;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    font-weight: bold;
    height: 25px;
  }
  thead th.num { text-align: center; width: 70px; }
  tbody td {
    padding: 7px 10px;
    background: #D6F7B5;
    font-size: 11px;
    color: #335511;
    border-bottom: 1px solid #fff;
  }
  tbody tr:nth-child(even) td { background: #C3EF93; }
  td.num { text-align: center; font-weight: bold; }
  td.gold   { color: #b58900; }
  td.silver { color: #808080; }
  td.bronze { color: #a0522d; }
  td.rank-cell {
    text-align: center;
    font-weight: bold;
    color: #2C4A0F;
    width: 60px;
  }
  td.rank-cell.r1 { color: #b58900; }
  td.rank-cell.r2 { color: #808080; }
  td.rank-cell.r3 { color: #a0522d; }
  .username { font-weight: bold; color: #2C4A0F; }

  /* Records grid */
  .records-area { padding: 8px; background: #fff; }
  .group-title {
    color: #fff;
    background: #E3756A;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, Verdana, sans-serif;
    padding: 5px 10px;
    margin: 10px 0 8px 0;
    height: 25px;
    display: flex;
    align-items: center;
    border-radius: 4px;
  }
  .group-title:first-child { margin-top: 0; }
  .ranking-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
  }
  .ranking-card {
    background: #D6F7B5;
    border: 1px solid #8bc55a;
    border-radius: 4px;
    overflow: hidden;
  }
  .ranking-card h3 {
    margin: 0;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    background: #ADE76B;
    color: #2C4A0F;
    padding: 5px 8px;
    border-bottom: 1px solid #8bc55a;
  }
  .bkiwi-track-select {
    font-size: 11px;
    font-family: Arial, Verdana, sans-serif;
    margin-left: 4px;
    padding: 1px 2px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    background: #D6F7B5;
    color: #2C4A0F;
    cursor: pointer;
  }
  .ranking-card .empty {
    color: #5a8030;
    font-style: italic;
    font-size: 11px;
    padding: 8px 10px;
    background: #D6F7B5;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 10px;
    font-size: 11px;
    background: #D6F7B5;
  }
  .score-row:nth-child(even) { background: #C3EF93; }
  .score-row .pos {
    width: 22px;
    color: #2C4A0F;
    font-weight: bold;
  }
  .score-row.r1 .pos { color: #b58900; }
  .score-row.r2 .pos { color: #808080; }
  .score-row.r3 .pos { color: #a0522d; }
  .score-row .pname {
    flex: 1;
    color: #2C4A0F;
    font-weight: bold;
  }
  .score-row .pscore {
    color: #335511;
    font-family: "Courier New", monospace;
    font-weight: bold;
  }

  .loading, .empty {
    text-align: center;
    padding: 24px;
    color: #335511;
    font-style: italic;
    background: #fff;
  }

  /* Consecration ranking */
  .conse-info {
    background: #ADE76B;
    color: #2C4A0F;
    padding: 6px 10px;
    margin-bottom: 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
  }
  .conse-score {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 140px;
  }
  .conse-pct-val {
    font-weight: bold;
    color: #2C4A0F;
    font-family: "Courier New", monospace;
  }
  .conse-bar-mini {
    width: 140px;
    height: 8px;
    background: #fff;
    border: 1px solid #8bc55a;
    border-radius: 4px;
    overflow: hidden;
  }
  .conse-fill-mini {
    height: 100%;
    background: linear-gradient(to right, #8fc63f, #E3756A);
    transition: width 0.3s;
  }
  .conse-detail {
    font-size: 10px;
    color: #5a8030;
    line-height: 1.5;
  }

  /* Footer matches forum-footer */
  .club-footer {
    text-align: center;
    padding: 8px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    color: #2C4A0F;
    background: #CCF599;
    margin-top: 10px;
    border-radius: 7px;
  }
  .club-footer a { color: #444; text-decoration: underline; }
</style>
</head>
<body>

<div class="club-shell">
  <div class="club-header">
    <span class="bc-icon">🏆</span>
    <a class="title-link" href="#" onclick="return false">Club Frutiparc</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="medalists">Top médaillés</button>
    <button class="tab" data-tab="records">Records par jeu</button>
    <button class="tab" data-tab="consecration">Consécration</button>
  </div>

  <div id="panel-medalists" class="panel">
    <div class="toolbar">
      <button class="btn" onclick="loadMedalists()">Actualiser</button>
      <span id="medalist-summary" class="summary"></span>
    </div>
    <div id="medalists-content" class="loading">Chargement…</div>
  </div>

  <div id="panel-records" class="panel hidden">
    <div class="toolbar">
      <button class="btn" onclick="loadRecords()">Actualiser</button>
      <label>Affichage&nbsp;:
        <select id="record-filter" onchange="renderRecords()">
          <option value="all">Tous les classements</option>
          <option value="C">Challenge (Classique)</option>
          <option value="L">Championnat</option>
        </select>
      </label>
      <label>Top&nbsp;:
        <select id="record-limit" onchange="loadRecords()">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </label>
    </div>
    <div id="records-content" class="loading">Chargement…</div>
  </div>

  <div id="panel-consecration" class="panel hidden">
    <div class="toolbar">
      <button class="btn" onclick="loadConsecration()">Actualiser</button>
      <label>Top&nbsp;:
        <select id="conse-limit" onchange="loadConsecration()">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </label>
      <span id="conse-summary" class="summary"></span>
    </div>
    <div id="consecration-content" class="loading">Chargement…</div>
  </div>
</div>
<div class="club-footer">
  Club Frutiparc &copy; <a href="https://www.motiontwin.com">Motion Twin</a>
</div>

<script>
  let recordsData = null;
  let consecrationData = null;

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.getAttribute('data-tab');
      document.getElementById('panel-medalists').classList.toggle('hidden', tab !== 'medalists');
      document.getElementById('panel-records').classList.toggle('hidden', tab !== 'records');
      document.getElementById('panel-consecration').classList.toggle('hidden', tab !== 'consecration');
      if (tab === 'records' && !recordsData) loadRecords();
      if (tab === 'consecration' && !consecrationData) loadConsecration();
    });
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  async function loadMedalists() {
    const root = document.getElementById('medalists-content');
    root.className = 'loading';
    root.textContent = 'Chargement…';
    try {
      const r = await fetch('/api/club/medalists');
      const data = await r.json();
      const list = data.medalists || [];
      document.getElementById('medalist-summary').textContent =
        list.length + ' joueur' + (list.length > 1 ? 's' : '') +
        ' • ' + (data.totalMedals || 0) + ' médaille' + ((data.totalMedals || 0) > 1 ? 's' : '') + ' attribuée' + ((data.totalMedals || 0) > 1 ? 's' : '');

      if (!list.length) {
        root.className = 'loading';
        root.textContent = 'Aucune médaille attribuée pour le moment.';
        return;
      }
      root.className = '';
      let html = '<table><thead><tr>'
        + '<th class="num">#</th>'
        + '<th>Joueur</th>'
        + '<th class="num">🥇 Or</th>'
        + '<th class="num">🥈 Argent</th>'
        + '<th class="num">🥉 Bronze</th>'
        + '<th class="num">Total</th>'
        + '</tr></thead><tbody>';
      list.forEach((m, i) => {
        const rk = i + 1;
        const rkClass = rk <= 3 ? 'rank-cell r' + rk : 'rank-cell';
        html += '<tr>'
          + '<td class="' + rkClass + '">' + rk + '</td>'
          + '<td><span class="username">' + escapeHtml(m.user) + '</span></td>'
          + '<td class="num gold">' + m.gold + '</td>'
          + '<td class="num silver">' + m.silver + '</td>'
          + '<td class="num bronze">' + m.bronze + '</td>'
          + '<td class="num">' + m.total + '</td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      root.innerHTML = html;
    } catch (e) {
      root.className = 'loading';
      root.textContent = 'Erreur de chargement: ' + e.message;
    }
  }

  function formatScore(score, ranking) {
    if (!Number.isFinite(score)) return String(score);
    if (ranking.game === 'bkiwi') {
      const total = Number(score);
      const minutes = Math.floor(total / 60000);
      const seconds = Math.floor((total % 60000) / 1000);
      const cs = Math.floor((total % 1000) / 10);
      const pad = n => (n < 10 ? '0' + n : '' + n);
      return minutes + ':' + pad(seconds) + '.' + pad(cs);
    }
    return Number(score).toLocaleString('fr-FR');
  }

  async function loadRecords() {
    const root = document.getElementById('records-content');
    root.className = 'loading';
    root.textContent = 'Chargement…';
    const limit = document.getElementById('record-limit').value || 10;
    try {
      const r = await fetch('/api/club/records?limit=' + limit);
      recordsData = await r.json();
      renderRecords();
    } catch (e) {
      root.className = 'loading';
      root.textContent = 'Erreur de chargement: ' + e.message;
    }
  }

  var bkiwiSelectedTrack = { C: 0, L: 0 };

  function renderScoreRows(rk) {
    if (!rk.scores || !rk.scores.length) {
      return '<div class="empty">Aucun score enregistré</div>';
    }
    var html = '';
    rk.scores.forEach(function(s, i) {
      var pos = i + 1;
      var cls = pos <= 3 ? ('score-row r' + pos) : 'score-row';
      html += '<div class="' + cls + '">'
        + '<span class="pos">' + pos + '.</span>'
        + '<span class="pname">' + escapeHtml(s.user) + '</span>'
        + '<span class="pscore">' + escapeHtml(formatScore(s.score, rk)) + '</span>'
        + '</div>';
    });
    return html;
  }

  function switchBkiwiTrack(type, track) {
    bkiwiSelectedTrack[type] = track;
    var container = document.getElementById('bkiwi-scores-' + type);
    if (!container || !recordsData) return;
    var rankings = recordsData.rankings || [];
    var suffix = type === 'L' ? '_challenge' : '_classic';
    var rk = rankings.find(function(r) { return r.id === 'bkiwi_track' + track + suffix; });
    container.innerHTML = rk ? renderScoreRows(rk) : '<div class="empty">Aucun score enregistré</div>';
  }

  function renderBkiwiCard(bkiwiRankings, type) {
    var selected = bkiwiSelectedTrack[type] || 0;
    var suffix = type === 'L' ? '_challenge' : '_classic';
    var current = bkiwiRankings.find(function(r) { return r.bkiwiTrack === selected; });
    var html = '<div class="ranking-card">';
    html += '<h3>Burning Kiwi <select class="bkiwi-track-select" onchange="switchBkiwiTrack(\'' + type + '\', Number(this.value))">';
    bkiwiRankings.slice().sort(function(a,b) { return a.bkiwiTrack - b.bkiwiTrack; }).forEach(function(rk) {
      var sel = rk.bkiwiTrack === selected ? ' selected' : '';
      var label = rk.name.replace('Burning Kiwi - ', '');
      html += '<option value="' + rk.bkiwiTrack + '"' + sel + '>' + escapeHtml(label) + '</option>';
    });
    html += '</select></h3>';
    html += '<div id="bkiwi-scores-' + type + '">';
    html += current ? renderScoreRows(current) : '<div class="empty">Aucun score enregistré</div>';
    html += '</div></div>';
    return html;
  }

  function renderRecords() {
    if (!recordsData) return;
    var root = document.getElementById('records-content');
    var filter = document.getElementById('record-filter').value;
    var rankings = (recordsData.rankings || []).filter(function(rk) {
      if (filter === 'all') return true;
      return rk.type === filter;
    });
    if (!rankings.length) {
      root.className = 'loading';
      root.textContent = 'Aucun classement à afficher.';
      return;
    }
    root.className = 'records-area';

    var groups = { C: [], L: [] };
    rankings.forEach(function(rk) {
      if (groups[rk.type]) groups[rk.type].push(rk);
      else { groups.other = groups.other || []; groups.other.push(rk); }
    });
    var groupLabels = { C: 'Challenge (Classique)', L: 'Championnat', other: 'Autres' };

    var html = '';
    for (var ki = 0; ki < 3; ki++) {
      var key = ['C', 'L', 'other'][ki];
      var arr = groups[key];
      if (!arr || !arr.length) continue;
      if (filter === 'all') {
        html += '<div class="group-title">' + groupLabels[key] + '</div>';
      }
      html += '<div class="ranking-list">';
      var bkiwiGroup = arr.filter(function(rk) { return rk.bkiwiTrack !== undefined; });
      var otherRankings = arr.filter(function(rk) { return rk.bkiwiTrack === undefined; });
      if (bkiwiGroup.length) {
        html += renderBkiwiCard(bkiwiGroup, key);
      }
      otherRankings.forEach(function(rk) {
        html += '<div class="ranking-card">';
        html += '<h3>' + escapeHtml(rk.name) + '</h3>';
        html += renderScoreRows(rk);
        html += '</div>';
      });
      html += '</div>';
    }
    root.innerHTML = html;
  }

  async function loadConsecration() {
    const root = document.getElementById('consecration-content');
    root.className = 'loading';
    root.textContent = 'Chargement…';
    const limit = document.getElementById('conse-limit').value || 50;
    try {
      const r = await fetch('/api/club/consecration?limit=' + limit);
      consecrationData = await r.json();
      renderConsecration();
    } catch (e) {
      root.className = 'loading';
      root.textContent = 'Erreur de chargement: ' + e.message;
    }
  }

  function renderConsecration() {
    const root = document.getElementById('consecration-content');
    const players = (consecrationData && consecrationData.players) || [];
    const summary = document.getElementById('conse-summary');
    summary.textContent = (consecrationData && consecrationData.totalPlayers != null)
      ? (consecrationData.totalPlayers + ' joueur' + (consecrationData.totalPlayers > 1 ? 's' : ''))
      : '';

    if (!players.length) {
      root.className = 'loading';
      root.textContent = 'Aucun joueur à classer pour le moment.';
      return;
    }
    const perGameMax = players[0].perGameMax || 0;
    const enabledCount = players[0].enabledCount || 0;
    let html = '<div class="conse-info">'
      + enabledCount + ' jeu' + (enabledCount > 1 ? 'x' : '') + ' pris en compte — '
      + 'chaque jeu finalisé vaut ' + perGameMax.toFixed(2) + ' % du score total.'
      + '</div>';
    html += '<table><thead><tr>'
      + '<th class="num">#</th>'
      + '<th>Joueur</th>'
      + '<th>Score</th>'
      + '<th>Détail par jeu</th>'
      + '</tr></thead><tbody>';
    players.forEach((p, i) => {
      const rk = i + 1;
      const rkClass = rk <= 3 ? 'rank-cell r' + rk : 'rank-cell';
      const pct = Number(p.overall) || 0;
      const detail = (p.games || []).map(g => {
        const label = g.mode === 'completion'
          ? (g.unlocked ? 'joué' : '—')
          : (g.unlocked + '/' + g.total);
        return escapeHtml(g.name) + ' ' + label;
      }).join(' · ');
      html += '<tr>'
        + '<td class="' + rkClass + '">' + rk + '</td>'
        + '<td><span class="username">' + escapeHtml(p.user) + '</span></td>'
        + '<td><div class="conse-score">'
        +   '<span class="conse-pct-val">' + pct.toFixed(2) + ' %</span>'
        +   '<div class="conse-bar-mini"><div class="conse-fill-mini" style="width:' + Math.min(pct, 100) + '%"></div></div>'
        + '</div></td>'
        + '<td class="conse-detail">' + detail + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    root.className = 'records-area';
    root.innerHTML = html;
  }

  loadMedalists();
</script>
</body>
</html>
