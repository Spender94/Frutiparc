<!DOCTYPE html>
<html lang="fr">
<!-- Le Club — le livre des records et des médailles.

     Trois onglets : le tableau des médaillés, les records par jeu, et la FICHE
     d'un joueur. Cette dernière reprend la page des médaillés d'Aidofrutiz
     (medailles.php?p=<pseudo>) : « X a obtenu N médailles », un tableau par
     date, un tableau par jeu. On lui ajoute ce qu'elle n'avait pas — la bouille
     du joueur, et ses records.

     La CONSÉCRATION n'a plus d'onglet : elle a sa ligne au tableau des scores
     de /light, la répéter ici n'apprenait rien. -->
<head>
<meta charset="UTF-8">
<title>Club Frutiparc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #ADE76B;
    color: #335511;
    padding: 12px;
  }
  .club-shell {
    background: #fff;
    border-radius: 7px;
    overflow: hidden;
    padding: 6px;
    border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF;
  }
  a { color: #2C4A0F; text-decoration: none; }
  a:hover { text-decoration: underline; color: #2C4A0F; }

  /* Header (white zone with icon + coral title — phpBB subSilver style) */
  .club-header {
    background: #fff;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .club-header .bc-icon {
    font-size: 16px;
    line-height: 1;
    vertical-align: middle;
  }
  .club-header .title-link {
    color: #E3756A;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
  }

  /* Tab bar — coral header strip */
  .tabs {
    display: flex;
    gap: 0;
    background: #E3756A;
    height: 25px;
    align-items: stretch;
    border-radius: 7px 7px 0 0;
    overflow: hidden;
  }
  .tab {
    flex: 1;
    background: transparent;
    color: #fff;
    border: none;
    cursor: pointer;
    font-family: Arial, Verdana, sans-serif;
    font-weight: bold;
    font-size: 12px;
    padding: 0 12px;
  }
  .tab:hover { background: #d2645a; }
  .tab.active {
    background: #fff;
    color: #E3756A;
  }

  .panel {
    background: #fff;
  }
  .panel.hidden { display: none; }

  /* Toolbar above content (catLeft green) */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #ADE76B;
    padding: 6px 10px;
    min-height: 28px;
    color: #2C4A0F;
    font-size: 11px;
    font-weight: bold;
  }
  .toolbar label {
    color: #2C4A0F;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .summary {
    color: #2C4A0F;
    font-size: 11px;
    font-weight: bold;
    margin-left: auto;
  }

  /* Buttons mirror the forum's act-btn / btn styles */
  .btn {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    background: #E3756A;
    line-height: 1.4;
  }
  .btn:hover { background: #d2645a; color: #fff; text-decoration: none; }

  select {
    padding: 1px 4px;
    border: none;
    background: #C3EF93;
    color: #2C4A0F;
    font-family: Verdana, sans-serif;
    font-size: 10px;
  }
  input[type="search"], input[type="text"] {
    padding: 2px 6px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    background: #fff;
    color: #2C4A0F;
    font-family: Verdana, sans-serif;
    font-size: 11px;
    width: 160px;
  }

  /* Medalists table — column header in coral, rows alternating green */
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: #E3756A;
    color: #fff;
    padding: 5px 8px;
    text-align: left;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    font-weight: bold;
    height: 25px;
  }
  thead th.num { text-align: center; width: 70px; }
  tbody td {
    padding: 7px 10px;
    background: #D6F7B5;
    font-size: 11px;
    color: #335511;
    border-bottom: 1px solid #fff;
  }
  tbody tr:nth-child(even) td { background: #C3EF93; }
  td.num { text-align: center; font-weight: bold; }
  td.gold   { color: #b58900; }
  td.silver { color: #808080; }
  td.bronze { color: #a0522d; }
  td.rank-cell {
    text-align: center;
    font-weight: bold;
    color: #2C4A0F;
    width: 60px;
  }
  td.rank-cell.r1 { color: #b58900; }
  td.rank-cell.r2 { color: #808080; }
  td.rank-cell.r3 { color: #a0522d; }
  .username { font-weight: bold; color: #2C4A0F; }
  /* Un pseudo cliquable ouvre sa fiche — au tableau des médaillés comme dans
     chaque carte de record. */
  a.username { cursor: pointer; }
  a.username:hover { text-decoration: underline; }

  /* Records grid */
  .records-area { padding: 8px; background: #fff; }
  .group-title {
    color: #fff;
    background: #E3756A;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, Verdana, sans-serif;
    padding: 5px 10px;
    margin: 10px 0 8px 0;
    min-height: 25px;
    display: flex;
    align-items: center;
    border-radius: 4px;
  }
  .group-title:first-child { margin-top: 0; }
  .ranking-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
  }
  .ranking-card {
    background: #D6F7B5;
    border: 1px solid #8bc55a;
    border-radius: 4px;
    overflow: hidden;
  }
  .ranking-card h3 {
    margin: 0;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    background: #ADE76B;
    color: #2C4A0F;
    padding: 5px 8px;
    border-bottom: 1px solid #8bc55a;
  }
  .bkiwi-track-select {
    font-size: 11px;
    font-family: Arial, Verdana, sans-serif;
    margin-left: 4px;
    padding: 1px 2px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    background: #D6F7B5;
    color: #2C4A0F;
    cursor: pointer;
  }
  .ranking-card .empty {
    color: #5a8030;
    font-style: italic;
    font-size: 11px;
    padding: 8px 10px;
    background: #D6F7B5;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    font-size: 11px;
    background: #D6F7B5;
  }
  .score-row:nth-child(even) { background: #C3EF93; }
  .score-row .pos {
    width: 22px;
    color: #2C4A0F;
    font-weight: bold;
  }
  .score-row.r1 .pos { color: #b58900; }
  .score-row.r2 .pos { color: #808080; }
  .score-row.r3 .pos { color: #a0522d; }
  .score-row .pname {
    flex: 1;
    color: #2C4A0F;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .score-row .pscore {
    color: #335511;
    font-family: "Courier New", monospace;
    font-weight: bold;
  }

  .loading, .empty {
    text-align: center;
    padding: 24px;
    color: #335511;
    font-style: italic;
    background: #fff;
  }

  /* ── La FICHE d'un joueur ──────────────────────────────────────────────
     Aidofrutiz centrait tout sur un fond vert clair : on garde ce parti, avec
     la bouille et le pseudo en tête de page. */
  .fiche { padding: 10px 8px 16px; background: #fff; }
  .fiche-tete {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #CCF599;
    border: 1px solid #8bc55a;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  /* La bouille : même vignette que le forum (cache PNG, détourée du vert de
     capture pour se poser sur n'importe quel fond). */
  .fiche-bouille {
    width: 76px;
    height: 76px;
    flex: 0 0 76px;
    background: #fff;
    border: 1px solid #8A888D;
    border-radius: 6px;
    overflow: hidden;
  }
  .fiche-ident { min-width: 0; }
  .fiche-nom {
    font-family: Arial, Verdana, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: #2C4A0F;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .fiche-ligne { color: #335511; font-size: 11px; line-height: 1.7; }
  .fiche-ligne b { color: #2C4A0F; }
  .fiche-metaux { font-weight: bold; }
  .fiche-metaux .m-or { color: #b58900; }
  .fiche-metaux .m-ar { color: #808080; }
  .fiche-metaux .m-br { color: #a0522d; }

  .fiche-bloc { margin-bottom: 14px; }
  .fiche-bloc:last-child { margin-bottom: 0; }
  .fiche-titre {
    color: #fff;
    background: #E3756A;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, Verdana, sans-serif;
    padding: 5px 10px;
    min-height: 25px;
    display: flex;
    align-items: center;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  /* Les deux tableaux de médailles sont étroits : centrés, comme sur la page
     d'origine, plutôt qu'étirés sur toute la largeur. */
  .fiche-tableau { max-width: 420px; margin: 0 auto; }
  .fiche-tableau td:first-child { font-weight: bold; }
  .fiche-vide {
    text-align: center;
    padding: 14px;
    color: #5a8030;
    font-style: italic;
    background: #D6F7B5;
    border: 1px solid #8bc55a;
    border-radius: 4px;
  }
  /* Un record : le classement, le score, et la place tenue. */
  .rec-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 10px;
    background: #D6F7B5;
    font-size: 11px;
  }
  .rec-row:nth-child(even) { background: #C3EF93; }
  .rec-row .rname { flex: 1; color: #2C4A0F; font-weight: bold; }
  .rec-row .rscore {
    color: #335511;
    font-family: "Courier New", monospace;
    font-weight: bold;
  }
  .rec-row .rpos {
    min-width: 78px;
    text-align: right;
    color: #5a8030;
    font-weight: bold;
  }
  .rec-row .rpos.r1 { color: #b58900; }
  .rec-row .rpos.r2 { color: #808080; }
  .rec-row .rpos.r3 { color: #a0522d; }

  /* Footer matches forum-footer */
  .club-footer {
    text-align: center;
    padding: 8px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    color: #2C4A0F;
    background: #CCF599;
    margin-top: 10px;
    border-radius: 7px;
  }
  .club-footer a { color: #444; text-decoration: underline; }
</style>
</head>
<body>

<div class="club-shell">
  <div class="club-header">
    <span class="bc-icon">🏆</span>
    <a class="title-link" href="#" onclick="return false">Club Frutiparc</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="medalists">Top médaillés</button>
    <button class="tab" data-tab="records">Records par jeu</button>
    <button class="tab" data-tab="fiche">Fiche joueur</button>
  </div>

  <div id="panel-medalists" class="panel">
    <div class="toolbar">
      <button class="btn" onclick="loadMedalists()">Actualiser</button>
      <span id="medalist-summary" class="summary"></span>
    </div>
    <div id="medalists-content" class="loading">Chargement…</div>
  </div>

  <div id="panel-records" class="panel hidden">
    <div class="toolbar">
      <button class="btn" onclick="loadRecords()">Actualiser</button>
      <label>Affichage&nbsp;:
        <select id="record-filter" onchange="renderRecords()">
          <option value="all">Tous les classements</option>
          <option value="C">Challenge (Classique)</option>
          <option value="L">Championnat</option>
        </select>
      </label>
      <label>Top&nbsp;:
        <select id="record-limit" onchange="loadRecords()">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </label>
    </div>
    <div id="records-content" class="loading">Chargement…</div>
  </div>

  <div id="panel-fiche" class="panel hidden">
    <div class="toolbar">
      <label>Pseudo&nbsp;:
        <input type="search" id="fiche-pseudo" list="fiche-joueurs" placeholder="un Frutiz…"
               autocomplete="off" onkeydown="if(event.key==='Enter'){chercherFiche();return false;}">
        <datalist id="fiche-joueurs"></datalist>
      </label>
      <button class="btn" onclick="chercherFiche()">Voir la fiche</button>
      <span id="fiche-summary" class="summary"></span>
    </div>
    <div id="fiche-content" class="loading">
      Cherchez un Frutiz par son pseudo — ou cliquez un nom dans les deux autres onglets.
    </div>
  </div>
</div>
<div class="club-footer">
  Club Frutiparc &copy; <a href="https://www.motiontwin.com">Motion Twin</a>
</div>

<!-- Vignettes de bouilles : une <img> sur le cache PNG du serveur, pas une
     instance Ruffle de plus. Le même rendu que le forum. -->
<script src="/js/bouille-thumb.js"></script>
<script>
  let recordsData = null;
  let joueursCharges = false;

  function activerOnglet(tab) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
    document.getElementById('panel-medalists').classList.toggle('hidden', tab !== 'medalists');
    document.getElementById('panel-records').classList.toggle('hidden', tab !== 'records');
    document.getElementById('panel-fiche').classList.toggle('hidden', tab !== 'fiche');
    if (tab === 'records' && !recordsData) loadRecords();
    if (tab === 'fiche') chargerListeJoueurs();
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => activerOnglet(btn.getAttribute('data-tab')));
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Un pseudo pour un attribut onclick : les apostrophes sont déjà en &#39;
  // après escapeHtml, il reste à protéger l'antislash.
  function pseudoAttr(u) { return escapeHtml(String(u).replace(/\\/g, '\\\\')); }
  function lienJoueur(u) {
    return '<a class="username" href="#" onclick="ouvrirFiche(\'' + pseudoAttr(u) + '\');return false;">'
      + escapeHtml(u) + '</a>';
  }

  async function loadMedalists() {
    const root = document.getElementById('medalists-content');
    root.className = 'loading';
    root.textContent = 'Chargement…';
    try {
      const r = await fetch('/api/club/medalists');
      const data = await r.json();
      const list = data.medalists || [];
      document.getElementById('medalist-summary').textContent =
        list.length + ' joueur' + (list.length > 1 ? 's' : '') +
        ' • ' + (data.totalMedals || 0) + ' médaille' + ((data.totalMedals || 0) > 1 ? 's' : '') + ' attribuée' + ((data.totalMedals || 0) > 1 ? 's' : '');

      if (!list.length) {
        root.className = 'loading';
        root.textContent = 'Aucune médaille attribuée pour le moment.';
        return;
      }
      root.className = '';
      let html = '<table><thead><tr>'
        + '<th class="num">#</th>'
        + '<th>Joueur</th>'
        + '<th class="num">🥇 Or</th>'
        + '<th class="num">🥈 Argent</th>'
        + '<th class="num">🥉 Bronze</th>'
        + '<th class="num">Total</th>'
        + '</tr></thead><tbody>';
      list.forEach((m, i) => {
        const rk = i + 1;
        const rkClass = rk <= 3 ? 'rank-cell r' + rk : 'rank-cell';
        html += '<tr>'
          + '<td class="' + rkClass + '">' + rk + '</td>'
          + '<td>' + lienJoueur(m.user) + '</td>'
          + '<td class="num gold">' + m.gold + '</td>'
          + '<td class="num silver">' + m.silver + '</td>'
          + '<td class="num bronze">' + m.bronze + '</td>'
          + '<td class="num">' + m.total + '</td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      root.innerHTML = html;
    } catch (e) {
      root.className = 'loading';
      root.textContent = 'Erreur de chargement: ' + e.message;
    }
  }

  function formatScore(score, ranking) {
    if (!Number.isFinite(score)) return String(score);
    if (ranking.game === 'bkiwi') {
      const total = Number(score);
      const minutes = Math.floor(total / 60000);
      const seconds = Math.floor((total % 60000) / 1000);
      const cs = Math.floor((total % 1000) / 10);
      const pad = n => (n < 10 ? '0' + n : '' + n);
      return minutes + ':' + pad(seconds) + '.' + pad(cs);
    }
    return Number(score).toLocaleString('fr-FR');
  }

  async function loadRecords() {
    const root = document.getElementById('records-content');
    root.className = 'loading';
    root.textContent = 'Chargement…';
    const limit = document.getElementById('record-limit').value || 10;
    try {
      const r = await fetch('/api/club/records?limit=' + limit);
      recordsData = await r.json();
      renderRecords();
    } catch (e) {
      root.className = 'loading';
      root.textContent = 'Erreur de chargement: ' + e.message;
    }
  }

  var bkiwiSelectedTrack = { C: 0, L: 0 };

  function renderScoreRows(rk) {
    if (!rk.scores || !rk.scores.length) {
      return '<div class="empty">Aucun score enregistré</div>';
    }
    var html = '';
    rk.scores.forEach(function(s, i) {
      var pos = i + 1;
      var cls = pos <= 3 ? ('score-row r' + pos) : 'score-row';
      html += '<div class="' + cls + '">'
        + '<span class="pos">' + pos + '.</span>'
        + '<span class="pname">' + lienJoueur(s.user) + '</span>'
        + '<span class="pscore">' + escapeHtml(formatScore(s.score, rk)) + '</span>'
        + '</div>';
    });
    return html;
  }

  // Burning Kiwi : on affiche TOUJOURS les données du « Championnat » (le défi du
  // jour par circuit, fiables), y compris dans la section « Challenge (Classique) ».
  // Les records classiques (_classic) sont pollués par un mauvais mapping de
  // circuit historique ; le challenge (_challenge) route de façon déterministe et
  // reste juste. Choix validé côté prod (les autres jeux gardent leur classique).
  function bkiwiRankingFor(track) {
    var rankings = (recordsData && recordsData.rankings) || [];
    return rankings.find(function(r) { return r.id === 'bkiwi_track' + track + '_challenge'; });
  }

  function switchBkiwiTrack(type, track) {
    bkiwiSelectedTrack[type] = track;
    var container = document.getElementById('bkiwi-scores-' + type);
    if (!container || !recordsData) return;
    var rk = bkiwiRankingFor(track);
    container.innerHTML = rk ? renderScoreRows(rk) : '<div class="empty">Aucun score enregistré</div>';
  }

  function renderBkiwiCard(bkiwiRankings, type) {
    var selected = bkiwiSelectedTrack[type] || 0;
    var current = bkiwiRankingFor(selected);
    var html = '<div class="ranking-card">';
    html += '<h3>Burning Kiwi <select class="bkiwi-track-select" onchange="switchBkiwiTrack(\'' + type + '\', Number(this.value))">';
    bkiwiRankings.slice().sort(function(a,b) { return a.bkiwiTrack - b.bkiwiTrack; }).forEach(function(rk) {
      var sel = rk.bkiwiTrack === selected ? ' selected' : '';
      var label = rk.name.replace('Burning Kiwi - ', '');
      html += '<option value="' + rk.bkiwiTrack + '"' + sel + '>' + escapeHtml(label) + '</option>';
    });
    html += '</select></h3>';
    html += '<div id="bkiwi-scores-' + type + '">';
    html += current ? renderScoreRows(current) : '<div class="empty">Aucun score enregistré</div>';
    html += '</div></div>';
    return html;
  }

  function renderRecords() {
    if (!recordsData) return;
    var root = document.getElementById('records-content');
    var filter = document.getElementById('record-filter').value;
    var rankings = (recordsData.rankings || []).filter(function(rk) {
      if (filter === 'all') return true;
      return rk.type === filter;
    });
    if (!rankings.length) {
      root.className = 'loading';
      root.textContent = 'Aucun classement à afficher.';
      return;
    }
    root.className = 'records-area';

    var groups = { C: [], L: [] };
    rankings.forEach(function(rk) {
      if (groups[rk.type]) groups[rk.type].push(rk);
      else { groups.other = groups.other || []; groups.other.push(rk); }
    });
    var groupLabels = { C: 'Challenge (Classique)', L: 'Championnat', other: 'Autres' };

    var html = '';
    // BKiwi n'affiche qu'UNE carte (données Championnat), pas une par section :
    // sinon la même grille apparaîtrait sous « Challenge (Classique) » ET
    // « Championnat ». On la rend dans la 1re section affichée qui a des rangs
    // BKiwi (C en vue « tous » ou « Challenge » ; L si on filtre « Championnat »).
    var bkiwiRendered = false;
    for (var ki = 0; ki < 3; ki++) {
      var key = ['C', 'L', 'other'][ki];
      var arr = groups[key];
      if (!arr || !arr.length) continue;
      if (filter === 'all') {
        html += '<div class="group-title">' + groupLabels[key] + '</div>';
      }
      html += '<div class="ranking-list">';
      var bkiwiGroup = arr.filter(function(rk) { return rk.bkiwiTrack !== undefined; });
      var otherRankings = arr.filter(function(rk) { return rk.bkiwiTrack === undefined; });
      if (bkiwiGroup.length && !bkiwiRendered) {
        html += renderBkiwiCard(bkiwiGroup, key);
        bkiwiRendered = true;
      }
      otherRankings.forEach(function(rk) {
        html += '<div class="ranking-card">';
        html += '<h3>' + escapeHtml(rk.name) + '</h3>';
        html += renderScoreRows(rk);
        html += '</div>';
      });
      html += '</div>';
    }
    root.innerHTML = html;
  }

  // ── La fiche d'un joueur ────────────────────────────────────────────────

  async function chargerListeJoueurs() {
    if (joueursCharges) return;
    joueursCharges = true;
    try {
      const r = await fetch('/api/club/players');
      const d = await r.json();
      document.getElementById('fiche-joueurs').innerHTML =
        (d.joueurs || []).map(u => '<option value="' + escapeHtml(u) + '"></option>').join('');
    } catch (e) { /* la recherche libre marche quand même */ }
  }

  function chercherFiche() {
    const v = (document.getElementById('fiche-pseudo').value || '').trim();
    if (v) ouvrirFiche(v);
  }

  function ouvrirFiche(pseudo) {
    activerOnglet('fiche');
    document.getElementById('fiche-pseudo').value = pseudo;
    chargerFiche(pseudo);
  }

  function tableauMedailles(lignes, entete) {
    if (!lignes.length) return '';
    let html = '<div class="fiche-tableau"><table><thead><tr>'
      + '<th>' + entete + '</th>'
      + '<th class="num">🥇 Or</th>'
      + '<th class="num">🥈 Argent</th>'
      + '<th class="num">🥉 Bronze</th>'
      + '<th class="num">Total</th>'
      + '</tr></thead><tbody>';
    lignes.forEach(l => {
      html += '<tr>'
        + '<td>' + escapeHtml(l.libelle) + '</td>'
        + '<td class="num gold">' + l.or + '</td>'
        + '<td class="num silver">' + l.argent + '</td>'
        + '<td class="num bronze">' + l.bronze + '</td>'
        + '<td class="num">' + l.total + '</td>'
        + '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  async function chargerFiche(pseudo) {
    const root = document.getElementById('fiche-content');
    const resume = document.getElementById('fiche-summary');
    root.className = 'loading';
    root.textContent = 'Chargement…';
    resume.textContent = '';
    let d;
    try {
      const r = await fetch('/api/club/player?u=' + encodeURIComponent(pseudo));
      d = await r.json();
    } catch (e) {
      root.className = 'loading';
      root.textContent = 'Erreur de chargement: ' + e.message;
      return;
    }
    if (!d || !d.ok) {
      root.className = 'loading';
      root.textContent = 'Aucun Frutiz nommé « ' + pseudo +' » n’a de médaille ni de record.';
      return;
    }

    const m = d.medailles || { or: 0, argent: 0, bronze: 0, total: 0 };
    const bouille = window.FPBouilleThumb
      ? FPBouilleThumb.imgHtml(d.bouille, 0, { detourer: true })
      : '';

    let html = '<div class="fiche-tete">'
      + '<div class="fiche-bouille">' + bouille + '</div>'
      + '<div class="fiche-ident">'
      +   '<div class="fiche-nom">' + escapeHtml(d.user) + '</div>'
      +   '<div class="fiche-ligne">'
      +     (m.total
              ? '<b>' + escapeHtml(d.user) + '</b> a obtenu <b>' + m.total + '</b> médaille'
                + (m.total > 1 ? 's' : '')
                + (m.rang ? ' — ' + m.rang + '<sup>' + (m.rang === 1 ? 're' : 'e') + '</sup> au tableau des médaillés' : '')
              : '<b>' + escapeHtml(d.user) + '</b> n’a pas encore de médaille.')
      +   '</div>'
      +   (m.total
            ? '<div class="fiche-ligne fiche-metaux">'
              + '<span class="m-or">🥇 ' + m.or + '</span> &nbsp; '
              + '<span class="m-ar">🥈 ' + m.argent + '</span> &nbsp; '
              + '<span class="m-br">🥉 ' + m.bronze + '</span>'
              + '</div>'
            : '')
      + '</div></div>';

    const parMois = (d.medaillesParMois || []).map(l => Object.assign({ libelle: l.mois }, l));
    const parJeu = (d.medaillesParJeu || []).map(l => Object.assign({ libelle: l.nom }, l));

    if (parMois.length) {
      html += '<div class="fiche-bloc"><div class="fiche-titre">Médailles classées par date</div>'
        + tableauMedailles(parMois, 'Mois') + '</div>';
      html += '<div class="fiche-bloc"><div class="fiche-titre">Médailles classées par jeu</div>'
        + tableauMedailles(parJeu, 'Jeu') + '</div>';
    }

    // Les records, groupés par jeu — MotionBall en est absent : son score
    // empile le boss atteint, le temps et un pourcentage, il ne veut rien dire
    // hors de son propre tableau (le serveur l'écarte, cf. /api/club/player).
    html += '<div class="fiche-bloc"><div class="fiche-titre">Records par jeu</div>';
    const recs = d.records || [];
    if (!recs.length) {
      html += '<div class="fiche-vide">Aucun record enregistré pour l’instant.</div>';
    } else {
      const parJeuRec = [];
      recs.forEach(r => {
        let g = parJeuRec.find(x => x.jeu === r.jeu);
        if (!g) { g = { jeu: r.jeu, nom: r.jeuNom, lignes: [] }; parJeuRec.push(g); }
        g.lignes.push(r);
      });
      html += '<div class="ranking-list">';
      parJeuRec.forEach(g => {
        html += '<div class="ranking-card"><h3>' + escapeHtml(g.nom) + '</h3>';
        g.lignes.forEach(r => {
          // Le nom du classement perd son préfixe de jeu : la carte le porte
          // déjà. Un jeu à classement unique (MiniPixiz, MiniWave, Mini-Fever)
          // n'a pas de mode à nommer — sa ligne ne porte alors que le score et
          // la place, plutôt que de répéter le titre de la carte.
          const court = r.nom.indexOf(' - ') > 0 ? r.nom.split(' - ').slice(1).join(' - ') : '';
          const posCls = r.rang <= 3 ? 'rpos r' + r.rang : 'rpos';
          html += '<div class="rec-row">'
            + '<span class="rname">' + escapeHtml(court) + '</span>'
            + '<span class="rscore">' + escapeHtml(r.label) + '</span>'
            + '<span class="' + posCls + '">n&deg;&nbsp;' + r.rang + ' / ' + r.sur + '</span>'
            + '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    resume.textContent = recs.length
      ? recs.length + ' record' + (recs.length > 1 ? 's' : '')
      : '';
    root.className = 'fiche';
    root.innerHTML = html;
  }

  // On arrive parfois DROIT sur une fiche : /club/?p=anthonybdx — c'est
  // l'adresse qu'avait la page des médaillés d'Aidofrutiz, et celle que les
  // autres écrans peuvent pointer.
  (function () {
    const p = new URLSearchParams(location.search).get('p');
    loadMedalists();
    if (p) ouvrirFiche(p);
  })();
</script>
