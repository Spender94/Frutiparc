<!DOCTYPE html>
<html lang="fr">
<!-- Le Club — le livre des records et des médailles.

     Trois onglets : le tableau des médaillés, les records par jeu, et la FICHE
     d'un joueur. Cette dernière reprend la page des médaillés d'Aidofrutiz
     (medailles.php?p=<pseudo>) : « X a obtenu N médailles », un tableau par
     date, un tableau par jeu. On lui ajoute ce qu'elle n'avait pas — la bouille
     du joueur, et ses records.

     La CONSÉCRATION n'a plus d'onglet : elle a sa ligne au tableau des scores
     de /light, la répéter ici n'apprenait rien. -->
<head>
<meta charset="UTF-8">
<title>Club Frutiparc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Les langues du parc (voir /js/i18n.js) : en anglais, le dictionnaire du
     club arrive pendant l'analyse de la page ; en français, rien. -->
<script src="/js/i18n.js"></script>
<script>FPI18n.charger(['commun', 'club']);</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #ADE76B;
    color: #335511;
    padding: 12px;
  }
  .club-shell {
    background: #fff;
    border-radius: 7px;
    overflow: hidden;
    padding: 6px;
    border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF;
  }
  a { color: #2C4A0F; text-decoration: none; }
  a:hover { text-decoration: underline; color: #2C4A0F; }

  /* Header (white zone with icon + coral title — phpBB subSilver style) */
  .club-header {
    background: #fff;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .club-header .bc-icon {
    font-size: 16px;
    line-height: 1;
    vertical-align: middle;
  }
  .club-header .title-link {
    color: #E3756A;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
  }

  /* Tab bar — coral header strip */
  .tabs {
    display: flex;
    gap: 0;
    background: #E3756A;
    height: 25px;
    align-items: stretch;
    border-radius: 7px 7px 0 0;
    overflow: hidden;
  }
  .tab {
    flex: 1;
    background: transparent;
    color: #fff;
    border: none;
    cursor: pointer;
    font-family: Arial, Verdana, sans-serif;
    font-weight: bold;
    font-size: 12px;
    padding: 0 12px;
  }
  .tab:hover { background: #d2645a; }
  .tab.active {
    background: #fff;
    color: #E3756A;
  }

  .panel {
    background: #fff;
  }
  .panel.hidden { display: none; }

  /* Toolbar above content (catLeft green) */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #ADE76B;
    padding: 6px 10px;
    min-height: 28px;
    color: #2C4A0F;
    font-size: 11px;
    font-weight: bold;
  }
  .toolbar label {
    color: #2C4A0F;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .summary {
    color: #2C4A0F;
    font-size: 11px;
    font-weight: bold;
    margin-left: auto;
  }

  /* Buttons mirror the forum's act-btn / btn styles */
  .btn {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    background: #E3756A;
    line-height: 1.4;
  }
  .btn:hover { background: #d2645a; color: #fff; text-decoration: none; }

  select {
    padding: 1px 4px;
    border: none;
    background: #C3EF93;
    color: #2C4A0F;
    font-family: Verdana, sans-serif;
    font-size: 10px;
  }
  input[type="search"], input[type="text"] {
    padding: 2px 6px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    background: #fff;
    color: #2C4A0F;
    font-family: Verdana, sans-serif;
    font-size: 11px;
    width: 160px;
  }

  /* Medalists table — column header in coral, rows alternating green */
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: #E3756A;
    color: #fff;
    padding: 5px 8px;
    text-align: left;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    font-weight: bold;
    height: 25px;
  }
  /* `nowrap` : le jeton de médaille et son mot tiennent sur une ligne — sans
     lui, « Argent » et « Bronze » passaient sous leur médaille. */
  thead th.num { text-align: center; width: 70px; white-space: nowrap; }
  tbody td {
    padding: 7px 10px;
    background: #D6F7B5;
    font-size: 11px;
    color: #335511;
    border-bottom: 1px solid #fff;
  }
  tbody tr:nth-child(even) td { background: #C3EF93; }
  td.num { text-align: center; font-weight: bold; }
  td.gold   { color: #b58900; }
  td.silver { color: #808080; }
  td.bronze { color: #a0522d; }
  td.rank-cell {
    text-align: center;
    font-weight: bold;
    color: #2C4A0F;
    width: 60px;
  }
  td.rank-cell.r1 { color: #b58900; }
  td.rank-cell.r2 { color: #808080; }
  td.rank-cell.r3 { color: #a0522d; }
  .username { font-weight: bold; color: #2C4A0F; }
  /* Le JETON de médaille — le dessin d'awards.swf, sans la vignette du jeu
     (scripts/extract-medailles-vierges.js). En vecteur : net à quatorze pixels
     dans un en-tête comme à vingt sur une fiche. */
  .med { vertical-align: -3px; margin-right: 2px; }
  /* Un pseudo cliquable ouvre sa fiche — au tableau des médaillés comme dans
     chaque carte de record. */
  a.username { cursor: pointer; }
  a.username:hover { text-decoration: underline; }

  /* Consécration : le pourcentage et sa jauge, puis une colonne par jeu
     compté (« 9/22 », en or quand l'album est complet) et le total. Le
     tableau est large — neuf jeux — : il défile dans son cadre sur petit
     écran plutôt que de déborder de la page. */
  .conse-info {
    background: #ADE76B;
    color: #2C4A0F;
    padding: 6px 10px;
    margin-bottom: 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
  }
  .conse-score { display: flex; flex-direction: column; gap: 3px; min-width: 90px; }
  .conse-pct-val { font-weight: bold; color: #2C4A0F; font-family: "Courier New", monospace; }
  .conse-bar-mini {
    width: 90px;
    height: 8px;
    background: #fff;
    border: 1px solid #8bc55a;
    border-radius: 4px;
    overflow: hidden;
  }
  .conse-fill-mini { height: 100%; background: linear-gradient(to right, #8fc63f, #E3756A); }
  .conse-defile { overflow-x: auto; }
  .conse-table thead th.jeu { text-align: center; width: auto; padding: 5px 4px; font-size: 10px; white-space: nowrap; }
  .conse-table tbody td.jeu { text-align: center; padding: 7px 4px; white-space: nowrap; font-family: "Courier New", monospace; }
  .conse-table td.jeu.complet { color: #b58900; font-weight: bold; }
  .conse-table th.total, .conse-table td.total { border-left: 2px solid #fff; font-weight: bold; }

  /* Records grid */
  .records-area { padding: 8px; background: #fff; }
  .group-title {
    color: #fff;
    background: #E3756A;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, Verdana, sans-serif;
    padding: 5px 10px;
    margin: 10px 0 8px 0;
    min-height: 25px;
    display: flex;
    align-items: center;
    border-radius: 4px;
  }
  .group-title:first-child { margin-top: 0; }
  .ranking-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
  }
  .ranking-card {
    background: #D6F7B5;
    border: 1px solid #8bc55a;
    border-radius: 4px;
    overflow: hidden;
  }
  .ranking-card h3 {
    margin: 0;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    background: #ADE76B;
    color: #2C4A0F;
    padding: 5px 8px;
    border-bottom: 1px solid #8bc55a;
  }
  .bkiwi-track-select {
    font-size: 11px;
    font-family: Arial, Verdana, sans-serif;
    margin-left: 4px;
    padding: 1px 2px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    background: #D6F7B5;
    color: #2C4A0F;
    cursor: pointer;
  }
  .ranking-card .empty {
    color: #5a8030;
    font-style: italic;
    font-size: 11px;
    padding: 8px 10px;
    background: #D6F7B5;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    font-size: 11px;
    background: #D6F7B5;
  }
  .score-row:nth-child(even) { background: #C3EF93; }
  .score-row .pos {
    width: 22px;
    color: #2C4A0F;
    font-weight: bold;
  }
  .score-row.r1 .pos { color: #b58900; }
  .score-row.r2 .pos { color: #808080; }
  .score-row.r3 .pos { color: #a0522d; }
  .score-row .pname {
    flex: 1;
    color: #2C4A0F;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .score-row .pscore {
    color: #335511;
    font-family: "Courier New", monospace;
    font-weight: bold;
  }

  .loading, .empty {
    text-align: center;
    padding: 24px;
    color: #335511;
    font-style: italic;
    background: #fff;
  }

  /* ── La FICHE d'un joueur ──────────────────────────────────────────────
     Aidofrutiz centrait tout sur un fond vert clair : on garde ce parti, avec
     la bouille et le pseudo en tête de page. */
  .fiche { padding: 10px 8px 16px; background: #fff; }
  .fiche-tete {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #CCF599;
    border: 1px solid #8bc55a;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  /* La bouille : un canevas du moteur JS, dessiné sur fond transparent — elle
     se pose donc sur n'importe quel fond sans rien à détourer. */
  .fiche-bouille {
    width: 76px;
    height: 76px;
    flex: 0 0 76px;
    background: #fff;
    border: 1px solid #8A888D;
    border-radius: 6px;
    overflow: hidden;
  }
  .fiche-ident { min-width: 0; }
  .fiche-nom {
    font-family: Arial, Verdana, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: #2C4A0F;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .fiche-ligne { color: #335511; font-size: 11px; line-height: 1.7; }
  .fiche-ligne b { color: #2C4A0F; }
  .fiche-metaux { font-weight: bold; font-size: 13px; }
  .fiche-metaux .med { vertical-align: -5px; margin-right: 3px; }
  .fiche-metaux .m-or { color: #b58900; }
  .fiche-metaux .m-ar { color: #808080; }
  .fiche-metaux .m-br { color: #a0522d; }

  .fiche-bloc { margin-bottom: 14px; }
  .fiche-bloc:last-child { margin-bottom: 0; }
  .fiche-titre {
    color: #fff;
    background: #E3756A;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, Verdana, sans-serif;
    padding: 5px 10px;
    min-height: 25px;
    display: flex;
    align-items: center;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  /* Les deux tableaux de médailles sont étroits : centrés, comme sur la page
     d'origine, plutôt qu'étirés sur toute la largeur. */
  .fiche-tableau { max-width: 420px; margin: 0 auto; }
  .fiche-tableau td:first-child { font-weight: bold; }
  .fiche-vide {
    text-align: center;
    padding: 14px;
    color: #5a8030;
    font-style: italic;
    background: #D6F7B5;
    border: 1px solid #8bc55a;
    border-radius: 4px;
  }
  /* Un record : le classement, le score, et la place tenue. */
  .rec-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 10px;
    background: #D6F7B5;
    font-size: 11px;
  }
  .rec-row:nth-child(even) { background: #C3EF93; }
  .rec-row .rname { flex: 1; color: #2C4A0F; font-weight: bold; }
  .rec-row .rscore {
    color: #335511;
    font-family: "Courier New", monospace;
    font-weight: bold;
  }
  .rec-row .rpos {
    min-width: 78px;
    text-align: right;
    color: #5a8030;
    font-weight: bold;
  }
  .rec-row .rpos.r1 { color: #b58900; }
  .rec-row .rpos.r2 { color: #808080; }
  .rec-row .rpos.r3 { color: #a0522d; }

  /* Footer matches forum-footer */
  .club-footer {
    text-align: center;
    padding: 8px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    color: #2C4A0F;
    background: #CCF599;
    margin-top: 10px;
    border-radius: 7px;
  }
  .club-footer a { color: #444; text-decoration: underline; }
</style>
</head>
<body>

<div class="club-shell">
  <div class="club-header">
    <span class="bc-icon">🏆</span>
    <a class="title-link" href="#" onclick="return false" data-i18n="club.titre">Club Frutiparc</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="medalists" data-i18n="club.ongletMedailles">Top médaillés</button>
    <button class="tab" data-tab="records" data-i18n="club.ongletRecords">Records par jeu</button>
    <button class="tab" data-tab="consecration" data-i18n="club.consecration">Consécration</button>
    <button class="tab" data-tab="fiche" data-i18n="club.ongletFiche">Fiche joueur</button>
  </div>

  <div id="panel-medalists" class="panel">
    <div class="toolbar">
      <button class="btn" onclick="loadMedalists()" data-i18n="club.actualiser">Actualiser</button>
      <!-- Le sélecteur de jeu : « Tous les jeux » d'abord, puis ceux qui ont
           réellement distribué des médailles (le serveur les énumère).
           Les libellés sont dans un <span> : data-i18n remplace le texte de
           son élément, et la liste ne doit pas partir avec. -->
      <label><span data-i18n="club.jeuDeuxPoints">Jeu&nbsp;:</span>
        <select id="medalist-game" onchange="loadMedalists()">
          <option value="all" data-i18n="club.tousLesJeux">Tous les jeux</option>
        </select>
      </label>
      <span id="medalist-summary" class="summary"></span>
    </div>
    <div id="medalists-content" class="loading" data-i18n="club.chargement">Chargement…</div>
  </div>

  <div id="panel-records" class="panel hidden">
    <div class="toolbar">
      <button class="btn" onclick="loadRecords()" data-i18n="club.actualiser">Actualiser</button>
      <label><span data-i18n="club.affichageDeuxPoints">Affichage&nbsp;:</span>
        <select id="record-filter" onchange="renderRecords()">
          <option value="all" data-i18n="club.tousLesClassements">Tous les classements</option>
          <option value="C" data-i18n="club.challengeClassique">Challenge (Classique)</option>
          <option value="L" data-i18n="club.championnat">Championnat</option>
        </select>
      </label>
      <label><span data-i18n="club.topDeuxPoints">Top&nbsp;:</span>
        <select id="record-limit" onchange="loadRecords()">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </label>
    </div>
    <div id="records-content" class="loading" data-i18n="club.chargement">Chargement…</div>
  </div>

  <!-- La consécration : le pourcentage de chacun, ET d'où il vient — les
       pictos gagnés dans chaque jeu compté, et leur total. -->
  <div id="panel-consecration" class="panel hidden">
    <div class="toolbar">
      <button class="btn" onclick="loadConsecration()" data-i18n="club.actualiser">Actualiser</button>
      <label><span data-i18n="club.topDeuxPoints">Top&nbsp;:</span>
        <select id="conse-limit" onchange="loadConsecration()">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </label>
      <span id="conse-summary" class="summary"></span>
    </div>
    <div id="consecration-content" class="loading" data-i18n="club.chargement">Chargement…</div>
  </div>

  <div id="panel-fiche" class="panel hidden">
    <div class="toolbar">
      <label><span data-i18n="club.pseudoDeuxPoints">Pseudo&nbsp;:</span>
        <input type="search" id="fiche-pseudo" list="fiche-joueurs" placeholder="un Frutiz…"
               autocomplete="off" onkeydown="if(event.key==='Enter'){chercherFiche();return false;}"
               data-i18n-attr="placeholder:club.unFrutiz">
        <datalist id="fiche-joueurs"></datalist>
      </label>
      <button class="btn" onclick="chercherFiche()" data-i18n="club.voirFiche">Voir la fiche</button>
      <span id="fiche-summary" class="summary"></span>
    </div>
    <div id="fiche-content" class="loading" data-i18n="club.ficheAide">
      Cherchez un Frutiz par son pseudo — ou cliquez un nom dans les deux autres onglets.
    </div>
  </div>
</div>
<div class="club-footer" data-i18n-html="club.piedDePage">
  Club Frutiparc &copy; <a href="https://www.motiontwin.com">Motion Twin</a>
</div>

<!-- Vignettes de bouilles : une <img> sur le cache PNG du serveur, pas une
     instance Ruffle de plus. Le même rendu que le forum. -->
<!-- Le moteur de bouilles en JavaScript : la tête d'une fiche était une
     capture PNG du serveur, qu'il fallait avoir réchauffée par Ruffle. -->
<script src="/js/bouille-swf.js"></script>
<script src="/js/bouille-avm.js"></script>
<script src="/js/bouille-moteur.js"></script>
<script src="/js/bouille-variante.js"></script>
<script src="/js/bouille-vignette.js"></script>
<script>
  // Les textes écrits en dur dans la page (data-i18n…) et son titre, dans la
  // langue du joueur — avant le premier chargement.
  FPI18n.appliquer(document);
  document.title = T('club.titre', document.title);

  let recordsData = null;
  let consecrationData = null;
  let joueursCharges = false;

  function activerOnglet(tab) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
    document.getElementById('panel-medalists').classList.toggle('hidden', tab !== 'medalists');
    document.getElementById('panel-records').classList.toggle('hidden', tab !== 'records');
    document.getElementById('panel-consecration').classList.toggle('hidden', tab !== 'consecration');
    document.getElementById('panel-fiche').classList.toggle('hidden', tab !== 'fiche');
    if (tab === 'records' && !recordsData) loadRecords();
    if (tab === 'consecration' && !consecrationData) loadConsecration();
    if (tab === 'fiche') chargerListeJoueurs();
  }

  async function loadConsecration() {
    const root = document.getElementById('consecration-content');
    root.className = 'loading';
    root.textContent = T('club.chargement', 'Chargement…');
    const limit = document.getElementById('conse-limit').value || 50;
    try {
      const r = await fetch('/api/club/consecration?limit=' + limit);
      consecrationData = await r.json();
      renderConsecration();
    } catch (e) {
      root.className = 'loading';
      root.textContent = erreurChargement(e);
    }
  }

  // « Erreur de chargement: … » — le détail est celui du navigateur.
  function erreurChargement(e) {
    return T('club.erreurChargement', 'Erreur de chargement: {detail}', { detail: e.message });
  }

  /*
   * LE CLASSEMENT DE CONSÉCRATION, AVEC LE COMPTE DES PICTOS.
   *
   * Le pourcentage seul ne disait pas d'où il venait, et l'onglet avait
   * disparu au profit de la fiche. Il revient avec, pour chaque joueur, les
   * pictos gagnés dans chaque jeu compté (« 9/22 »), et leur total — un album
   * complet s'écrit en or. Un jeu compté « à la finition » (mode completion,
   * s'il s'en présente) s'écrit ✓ ou —. Les jeux hors calcul (Mini-Fever, les
   * pictos inédits) n'y figurent pas : ils ne pèsent pas sur le pourcentage.
   */
  function renderConsecration() {
    const root = document.getElementById('consecration-content');
    const players = (consecrationData && consecrationData.players) || [];
    const summary = document.getElementById('conse-summary');
    const n = consecrationData && consecrationData.totalPlayers;
    summary.textContent = n != null
      ? T.n('club.joueursConsacres', n, { one: '{n} joueur consacré', other: '{n} joueurs consacrés' }) : '';
    if (!players.length) {
      root.className = 'loading';
      root.textContent = T('club.aucunJoueur', 'Aucun joueur à classer pour le moment.');
      return;
    }
    const jeux = players[0].games || [];
    const perGameMax = players[0].perGameMax || 0;
    const compte = (g) => (g.mode === 'completion' ? (g.unlocked ? '✓' : '—') : (g.unlocked + '/' + g.total));
    const totaux = (p) => (p.games || []).reduce((t, g) => {
      if (g.mode !== 'completion') { t.gagnes += g.unlocked; t.total += g.total; }
      return t;
    }, { gagnes: 0, total: 0 });
    let html = '<div class="conse-info">'
      + T.n('club.conseInfo', jeux.length, {
        one: '{n} jeu pris en compte — un album complet vaut {pct} % ; Mini-Fever et les pictos inédits restent hors calcul.',
        other: '{n} jeux pris en compte — un album complet vaut {pct} % ; Mini-Fever et les pictos inédits restent hors calcul.',
      }, { pct: perGameMax.toFixed(2) })
      + '</div>';
    html += '<div class="conse-defile"><table class="conse-table"><thead><tr>'
      + '<th class="num">#</th>'
      + '<th>' + T('club.joueur', 'Joueur') + '</th>'
      + '<th>' + T('club.consecration', 'Consécration') + '</th>'
      + jeux.map((g) => '<th class="jeu">' + escapeHtml(g.name) + '</th>').join('')
      + '<th class="jeu total">Pictos</th>'
      + '</tr></thead><tbody>';
    players.forEach((p, i) => {
      const rk = i + 1;
      const rkClass = rk <= 3 ? 'rank-cell r' + rk : 'rank-cell';
      const pct = Number(p.overall) || 0;
      const t = totaux(p);
      html += '<tr>'
        + '<td class="' + rkClass + '">' + rk + '</td>'
        + '<td>' + lienJoueur(p.user) + '</td>'
        + '<td><div class="conse-score">'
        +   '<span class="conse-pct-val">' + T('club.pourcent', '{n} %', { n: pct.toFixed(2) }) + '</span>'
        +   '<div class="conse-bar-mini"><div class="conse-fill-mini" style="width:' + Math.min(pct, 100) + '%"></div></div>'
        + '</div></td>'
        + (p.games || []).map((g) => '<td class="jeu' + (g.total > 0 && g.unlocked >= g.total ? ' complet' : '') + '">' + compte(g) + '</td>').join('')
        + '<td class="jeu total">' + t.gagnes + '/' + t.total + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
    root.className = '';
    root.innerHTML = html;
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => activerOnglet(btn.getAttribute('data-tab')));
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Les MÉDAILLES du bureau, pas celles de la police système : le jeton
  // d'awards.swf — disque dégradé, double anneau — dont on a retiré la vignette
  // du jeu pour n'en garder que le métal.
  var MEDAILLE = { or: '/fb/medal_gold.svg', argent: '/fb/medal_silver.svg', bronze: '/fb/medal_bronze.svg' };
  var MEDAILLE_NOM = { or: 'Or', argent: 'Argent', bronze: 'Bronze' };
  // Le nom du métal dans la langue du joueur (club.or, club.argent, club.bronze).
  function nomMetal(metal) { return T('club.' + metal, MEDAILLE_NOM[metal]); }
  function jeton(metal, taille) {
    var t = taille || 14;
    return '<img class="med" src="' + MEDAILLE[metal] + '" width="' + t + '" height="' + t
      + '" alt="' + nomMetal(metal) + '">';
  }
  // Les trois en-têtes de colonne, communs au tableau des médaillés et aux deux
  // tableaux de la fiche.
  function enTetesMetaux() {
    return ['or', 'argent', 'bronze']
      .map(function (m) { return '<th class="num">' + jeton(m) + nomMetal(m) + '</th>'; })
      .join('');
  }
  // Un pseudo pour un attribut onclick : les apostrophes sont déjà en &#39;
  // après escapeHtml, il reste à protéger l'antislash.
  function pseudoAttr(u) { return escapeHtml(String(u).replace(/\\/g, '\\\\')); }
  function lienJoueur(u) {
    return '<a class="username" href="#" onclick="ouvrirFiche(\'' + pseudoAttr(u) + '\');return false;">'
      + escapeHtml(u) + '</a>';
  }

  /*
   * LE SÉLECTEUR DE JEU. Le serveur énumère les jeux QUI ONT MÉDAILLÉ : on
   * remplit la liste avec ce qu'il rend, en gardant le choix courant. Un jeu
   * qui s'y met un jour paraîtra tout seul ; un jeu sans médaille n'encombre
   * pas la liste.
   */
  function majSelecteurJeux(games, choix) {
    const sel = document.getElementById('medalist-game');
    if (!sel) return;
    const total = (games || []).reduce((n, g) => n + g.total, 0);
    let html = '<option value="all">' + T('club.tousLesJeuxN', 'Tous les jeux ({n})', { n: total }) + '</option>';
    (games || []).forEach(function (g) {
      html += '<option value="' + escapeHtml(g.id) + '">'
        + escapeHtml(g.nom) + ' (' + g.total + ')</option>';
    });
    sel.innerHTML = html;
    sel.value = (games || []).some(function (g) { return g.id === choix; }) ? choix : 'all';
  }

  async function loadMedalists() {
    const root = document.getElementById('medalists-content');
    const sel = document.getElementById('medalist-game');
    const jeu = (sel && sel.value) || 'all';
    root.className = 'loading';
    root.textContent = T('club.chargement', 'Chargement…');
    try {
      const r = await fetch('/api/club/medalists?game=' + encodeURIComponent(jeu));
      const data = await r.json();
      const list = data.medalists || [];
      majSelecteurJeux(data.games, data.game || 'all');
      const nomJeu = (data.games || []).find(function (g) { return g.id === data.game; });
      // Deux comptes indépendants, séparés d'un point : les joueurs, puis les
      // médailles (sur un jeu, quand on en a choisi un).
      const medailles = data.totalMedals || 0;
      document.getElementById('medalist-summary').textContent =
        T.n('club.nbJoueurs', list.length, { one: '{n} joueur', other: '{n} joueurs' }) + ' • '
        + (nomJeu
          ? T.n('club.medaillesAttribueesSur', medailles,
            { one: '{n} médaille attribuée sur {jeu}', other: '{n} médailles attribuées sur {jeu}' }, { jeu: nomJeu.nom })
          : T.n('club.medaillesAttribuees', medailles, { one: '{n} médaille attribuée', other: '{n} médailles attribuées' }));

      if (!list.length) {
        root.className = 'loading';
        root.textContent = nomJeu
          ? T('club.aucuneMedailleSur', 'Aucune médaille attribuée sur {jeu} pour le moment.', { jeu: nomJeu.nom })
          : T('club.aucuneMedaille', 'Aucune médaille attribuée pour le moment.');
        return;
      }
      root.className = '';
      let html = '<table><thead><tr>'
        + '<th class="num">#</th>'
        + '<th>' + T('club.joueur', 'Joueur') + '</th>'
        + enTetesMetaux()
        + '<th class="num">Total</th>'
        + '</tr></thead><tbody>';
      list.forEach((m, i) => {
        const rk = i + 1;
        const rkClass = rk <= 3 ? 'rank-cell r' + rk : 'rank-cell';
        html += '<tr>'
          + '<td class="' + rkClass + '">' + rk + '</td>'
          + '<td>' + lienJoueur(m.user) + '</td>'
          + '<td class="num gold">' + m.gold + '</td>'
          + '<td class="num silver">' + m.silver + '</td>'
          + '<td class="num bronze">' + m.bronze + '</td>'
          + '<td class="num">' + m.total + '</td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      root.innerHTML = html;
    } catch (e) {
      root.className = 'loading';
      root.textContent = erreurChargement(e);
    }
  }

  function formatScore(score, ranking) {
    if (!Number.isFinite(score)) return String(score);
    if (ranking.game === 'bkiwi') {
      const total = Number(score);
      const minutes = Math.floor(total / 60000);
      const seconds = Math.floor((total % 60000) / 1000);
      const cs = Math.floor((total % 1000) / 10);
      const pad = n => (n < 10 ? '0' + n : '' + n);
      return minutes + ':' + pad(seconds) + '.' + pad(cs);
    }
    return T.nombre(Number(score));
  }

  async function loadRecords() {
    const root = document.getElementById('records-content');
    root.className = 'loading';
    root.textContent = T('club.chargement', 'Chargement…');
    const limit = document.getElementById('record-limit').value || 10;
    try {
      const r = await fetch('/api/club/records?limit=' + limit);
      recordsData = await r.json();
      renderRecords();
    } catch (e) {
      root.className = 'loading';
      root.textContent = erreurChargement(e);
    }
  }

  var bkiwiSelectedTrack = { C: 0, L: 0 };

  function renderScoreRows(rk) {
    if (!rk.scores || !rk.scores.length) {
      return '<div class="empty">' + T('club.aucunScore', 'Aucun score enregistré') + '</div>';
    }
    var html = '';
    rk.scores.forEach(function(s, i) {
      var pos = i + 1;
      var cls = pos <= 3 ? ('score-row r' + pos) : 'score-row';
      html += '<div class="' + cls + '">'
        + '<span class="pos">' + pos + '.</span>'
        + '<span class="pname">' + lienJoueur(s.user) + '</span>'
        + '<span class="pscore">' + escapeHtml(formatScore(s.score, rk)) + '</span>'
        + '</div>';
    });
    return html;
  }

  // Burning Kiwi : on affiche TOUJOURS les données du « Championnat » (le défi du
  // jour par circuit, fiables), y compris dans la section « Challenge (Classique) ».
  // Les records classiques (_classic) sont pollués par un mauvais mapping de
  // circuit historique ; le challenge (_challenge) route de façon déterministe et
  // reste juste. Choix validé côté prod (les autres jeux gardent leur classique).
  function bkiwiRankingFor(track) {
    var rankings = (recordsData && recordsData.rankings) || [];
    return rankings.find(function(r) { return r.id === 'bkiwi_track' + track + '_challenge'; });
  }

  function switchBkiwiTrack(type, track) {
    bkiwiSelectedTrack[type] = track;
    var container = document.getElementById('bkiwi-scores-' + type);
    if (!container || !recordsData) return;
    var rk = bkiwiRankingFor(track);
    container.innerHTML = rk ? renderScoreRows(rk) : '<div class="empty">' + T('club.aucunScore', 'Aucun score enregistré') + '</div>';
  }

  function renderBkiwiCard(bkiwiRankings, type) {
    var selected = bkiwiSelectedTrack[type] || 0;
    var current = bkiwiRankingFor(selected);
    var html = '<div class="ranking-card">';
    html += '<h3>Burning Kiwi <select class="bkiwi-track-select" onchange="switchBkiwiTrack(\'' + type + '\', Number(this.value))">';
    bkiwiRankings.slice().sort(function(a,b) { return a.bkiwiTrack - b.bkiwiTrack; }).forEach(function(rk) {
      var sel = rk.bkiwiTrack === selected ? ' selected' : '';
      var label = rk.name.replace('Burning Kiwi - ', '');
      html += '<option value="' + rk.bkiwiTrack + '"' + sel + '>' + escapeHtml(label) + '</option>';
    });
    html += '</select></h3>';
    html += '<div id="bkiwi-scores-' + type + '">';
    html += current ? renderScoreRows(current) : '<div class="empty">' + T('club.aucunScore', 'Aucun score enregistré') + '</div>';
    html += '</div></div>';
    return html;
  }

  function renderRecords() {
    if (!recordsData) return;
    var root = document.getElementById('records-content');
    var filter = document.getElementById('record-filter').value;
    var rankings = (recordsData.rankings || []).filter(function(rk) {
      if (filter === 'all') return true;
      return rk.type === filter;
    });
    if (!rankings.length) {
      root.className = 'loading';
      root.textContent = T('club.aucunClassement', 'Aucun classement à afficher.');
      return;
    }
    root.className = 'records-area';

    var groups = { C: [], L: [] };
    rankings.forEach(function(rk) {
      if (groups[rk.type]) groups[rk.type].push(rk);
      else { groups.other = groups.other || []; groups.other.push(rk); }
    });
    var groupLabels = {
      C: T('club.challengeClassique', 'Challenge (Classique)'),
      L: T('club.championnat', 'Championnat'),
      other: T('club.autres', 'Autres'),
    };

    var html = '';
    // BKiwi n'affiche qu'UNE carte (données Championnat), pas une par section :
    // sinon la même grille apparaîtrait sous « Challenge (Classique) » ET
    // « Championnat ». On la rend dans la 1re section affichée qui a des rangs
    // BKiwi (C en vue « tous » ou « Challenge » ; L si on filtre « Championnat »).
    var bkiwiRendered = false;
    for (var ki = 0; ki < 3; ki++) {
      var key = ['C', 'L', 'other'][ki];
      var arr = groups[key];
      if (!arr || !arr.length) continue;
      if (filter === 'all') {
        html += '<div class="group-title">' + groupLabels[key] + '</div>';
      }
      html += '<div class="ranking-list">';
      var bkiwiGroup = arr.filter(function(rk) { return rk.bkiwiTrack !== undefined; });
      var otherRankings = arr.filter(function(rk) { return rk.bkiwiTrack === undefined; });
      if (bkiwiGroup.length && !bkiwiRendered) {
        html += renderBkiwiCard(bkiwiGroup, key);
        bkiwiRendered = true;
      }
      otherRankings.forEach(function(rk) {
        html += '<div class="ranking-card">';
        html += '<h3>' + escapeHtml(rk.name) + '</h3>';
        html += renderScoreRows(rk);
        html += '</div>';
      });
      html += '</div>';
    }
    root.innerHTML = html;
  }

  // ── La fiche d'un joueur ────────────────────────────────────────────────

  async function chargerListeJoueurs() {
    if (joueursCharges) return;
    joueursCharges = true;
    try {
      const r = await fetch('/api/club/players');
      const d = await r.json();
      document.getElementById('fiche-joueurs').innerHTML =
        (d.joueurs || []).map(u => '<option value="' + escapeHtml(u) + '"></option>').join('');
    } catch (e) { /* la recherche libre marche quand même */ }
  }

  function chercherFiche() {
    const v = (document.getElementById('fiche-pseudo').value || '').trim();
    if (v) ouvrirFiche(v);
  }

  function ouvrirFiche(pseudo) {
    activerOnglet('fiche');
    document.getElementById('fiche-pseudo').value = pseudo;
    chargerFiche(pseudo);
  }

  function tableauMedailles(lignes, entete) {
    if (!lignes.length) return '';
    let html = '<div class="fiche-tableau"><table><thead><tr>'
      + '<th>' + entete + '</th>'
      + enTetesMetaux()
      + '<th class="num">Total</th>'
      + '</tr></thead><tbody>';
    lignes.forEach(l => {
      html += '<tr>'
        + '<td>' + escapeHtml(l.libelle) + '</td>'
        + '<td class="num gold">' + l.or + '</td>'
        + '<td class="num silver">' + l.argent + '</td>'
        + '<td class="num bronze">' + l.bronze + '</td>'
        + '<td class="num">' + l.total + '</td>'
        + '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  async function chargerFiche(pseudo) {
    const root = document.getElementById('fiche-content');
    const resume = document.getElementById('fiche-summary');
    root.className = 'loading';
    root.textContent = T('club.chargement', 'Chargement…');
    resume.textContent = '';
    let d;
    try {
      const r = await fetch('/api/club/player?u=' + encodeURIComponent(pseudo));
      d = await r.json();
    } catch (e) {
      root.className = 'loading';
      root.textContent = erreurChargement(e);
      return;
    }
    if (!d || !d.ok) {
      root.className = 'loading';
      root.textContent = T('club.ficheIntrouvable', 'Aucun Frutiz nommé « {pseudo} » n’a de médaille ni de record.', { pseudo: pseudo });
      return;
    }

    const m = d.medailles || { or: 0, argent: 0, bronze: 0, total: 0 };
    const bouille = FPBouilleVignette.html(d.bouille);
    const nom = '<b>' + escapeHtml(d.user) + '</b>';
    // Le rang au tableau, en ordinal : « 1<sup>re</sup> », « 3<sup>e</sup> » —
    // en anglais, une fonction du dictionnaire (1st, 2nd, 3rd, 4th, 11th…).
    const rang = m.rang ? T('club.rangOrdinal', '{n}<sup>' + (m.rang === 1 ? 're' : 'e') + '</sup>', { n: m.rang }) : '';

    let html = '<div class="fiche-tete">'
      + '<div class="fiche-bouille">' + bouille + '</div>'
      + '<div class="fiche-ident">'
      +   '<div class="fiche-nom">' + escapeHtml(d.user) + '</div>'
      +   '<div class="fiche-ligne">'
      +     (!m.total ? T('club.pasDeMedaille', '{nom} n’a pas encore de médaille.', { nom: nom })
            : rang ? T.n('club.aObtenuRang', m.total, {
              one: '{nom} a obtenu <b>{n}</b> médaille — {rang} au tableau des médaillés',
              other: '{nom} a obtenu <b>{n}</b> médailles — {rang} au tableau des médaillés',
            }, { nom: nom, rang: rang })
            : T.n('club.aObtenu', m.total, { one: '{nom} a obtenu <b>{n}</b> médaille', other: '{nom} a obtenu <b>{n}</b> médailles' }, { nom: nom }))
      +   '</div>'
      +   (m.total
            ? '<div class="fiche-ligne fiche-metaux">'
              + '<span class="m-or">' + jeton('or', 20) + m.or + '</span> &nbsp; '
              + '<span class="m-ar">' + jeton('argent', 20) + m.argent + '</span> &nbsp; '
              + '<span class="m-br">' + jeton('bronze', 20) + m.bronze + '</span>'
              + '</div>'
            : '')
      + '</div></div>';

    // Le mois : le serveur l'écrit en français (« Mars 2026 ») et donne aussi
    // son code (`cle`, AAAA-MM) — c'est de lui que l'anglais tire le sien.
    const parMois = (d.medaillesParMois || []).map(l => Object.assign({ libelle: T('club.moisAnnee', l.mois, { cle: l.cle }) }, l));
    const parJeu = (d.medaillesParJeu || []).map(l => Object.assign({ libelle: l.nom }, l));

    if (parMois.length) {
      html += '<div class="fiche-bloc"><div class="fiche-titre">' + T('club.medaillesParDate', 'Médailles classées par date') + '</div>'
        + tableauMedailles(parMois, T('club.mois', 'Mois')) + '</div>';
      html += '<div class="fiche-bloc"><div class="fiche-titre">' + T('club.medaillesParJeu', 'Médailles classées par jeu') + '</div>'
        + tableauMedailles(parJeu, T('club.jeu', 'Jeu')) + '</div>';
    }

    // Les records, groupés par jeu — MotionBall en est absent : son score
    // empile le boss atteint, le temps et un pourcentage, il ne veut rien dire
    // hors de son propre tableau (le serveur l'écarte, cf. /api/club/player).
    html += '<div class="fiche-bloc"><div class="fiche-titre">' + T('club.ongletRecords', 'Records par jeu') + '</div>';
    const recs = d.records || [];
    if (!recs.length) {
      html += '<div class="fiche-vide">' + T('club.aucunRecord', 'Aucun record enregistré pour l’instant.') + '</div>';
    } else {
      const parJeuRec = [];
      recs.forEach(r => {
        let g = parJeuRec.find(x => x.jeu === r.jeu);
        if (!g) { g = { jeu: r.jeu, nom: r.jeuNom, lignes: [] }; parJeuRec.push(g); }
        g.lignes.push(r);
      });
      html += '<div class="ranking-list">';
      parJeuRec.forEach(g => {
        html += '<div class="ranking-card"><h3>' + escapeHtml(g.nom) + '</h3>';
        g.lignes.forEach(r => {
          // Le nom du classement perd son préfixe de jeu : la carte le porte
          // déjà. Un jeu à classement unique (MiniPixiz, MiniWave, Mini-Fever)
          // n'a pas de mode à nommer — sa ligne ne porte alors que le score et
          // la place, plutôt que de répéter le titre de la carte.
          const court = r.nom.indexOf(' - ') > 0 ? r.nom.split(' - ').slice(1).join(' - ') : '';
          const posCls = r.rang <= 3 ? 'rpos r' + r.rang : 'rpos';
          html += '<div class="rec-row">'
            + '<span class="rname">' + escapeHtml(court) + '</span>'
            + '<span class="rscore">' + escapeHtml(r.label) + '</span>'
            + '<span class="' + posCls + '">' + T('club.rangSur', 'n&deg;&nbsp;{rang} / {sur}', { rang: r.rang, sur: r.sur }) + '</span>'
            + '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    resume.textContent = recs.length
      ? T.n('club.nbRecords', recs.length, { one: '{n} record', other: '{n} records' })
      : '';
    root.className = 'fiche';
    root.innerHTML = html;
    FPBouilleVignette.brancher(root);
  }

  // On arrive parfois DROIT sur une fiche : /club/?p=anthonybdx — c'est
  // l'adresse qu'avait la page des médaillés d'Aidofrutiz, et celle que les
  // autres écrans peuvent pointer.
  (function () {
    const p = new URLSearchParams(location.search).get('p');
    loadMedalists();
    if (p) ouvrirFiche(p);
  })();
</script>
