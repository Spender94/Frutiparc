<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frutiparc - Connexion</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2f4f12; font-family: Verdana, sans-serif; color: #fff; }
    .card { width: min(420px, 92vw); background: #335511; border: 1px solid #95cf54; border-radius: 12px; padding: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 6px; color: #c6f48f; font-size: 1.5rem; }
    p { margin: 0 0 16px; color: #b5df82; font-size: .92rem; }
    label { display: block; margin: 10px 0 6px; color: #e7ffd0; font-size: .9rem; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #97c962; background: #1f3509; color: #fff; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
    #login-btn { background: #9fe058; color: #27420b; }
    #register-btn { background: #4f7a1f; color: #e8ffd2; }
    #status { margin-top: 12px; min-height: 20px; font-size: .9rem; color: #ffe6a1; }
    a { color: #d8ffab; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Connexion Frutiparc</h1>
    <p>Compte simple (username + password) pour tester rapidement.</p>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" placeholder="ex: kiwi_93" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••" />

    <div class="row">
      <button id="login-btn" type="button">Se connecter</button>
      <button id="register-btn" type="button">Créer un compte</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <p style="margin-top:14px"><a href="/">← Retour accueil</a></p>
  </main>

  <script>
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const statusEl = document.getElementById('status');

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.style.color = isError ? '#ffc5c5' : '#d5ffb4';
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok) {
        const message = data && data.message ? data.message : `Erreur (${res.status})`;
        throw new Error(message);
      }
      return data;
    }

    async function register() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      setStatus('Création du compte...');
      try {
        await postJson('/api/auth/register', { username, password });
        setStatus('Compte créé. Tu peux maintenant te connecter.');
      } catch (err) {
        setStatus(err.message || 'Impossible de créer le compte.', true);
      }
    }

    async function login() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      setStatus('Connexion...');
      try {
        const data = await postJson('/api/auth/login', { username, password });
        setStatus('Connecté, redirection...');
        window.location.href = data.redirect || '/legacy';
      } catch (err) {
        setStatus(err.message || 'Connexion échouée.', true);
      }
    }

    document.getElementById('register-btn').addEventListener('click', register);
    document.getElementById('login-btn').addEventListener('click', login);
    passwordEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
