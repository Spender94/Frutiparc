<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#afe868" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/snake2vk/manifest.webmanifest" />
    <script>
      // Téléphone ou tablette : page plein écran dès le chargement (le toucher la confirme ensuite).
      if (matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('mobile');
      // Hébergé par une plateforme (la page reçoit ?sid=) : le jeu prend toute la fenêtre, sans cadre ni mentions.
      if (new URLSearchParams(location.search).has('sid')) {
        document.documentElement.classList.add('embed');
        document.addEventListener('DOMContentLoaded', () => document.querySelector('footer')?.remove());
      }
    </script>
    <title>Frutisnake 3</title>
    <link rel="icon" href="/snake2vk/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/snake2vk/favicon-192.png" />
    <link rel="apple-touch-icon" href="/snake2vk/apple-touch-icon.png" />
    <style>:root{--frutiparc:#afe868;--ink:#1f3a05}html,body{height:100%;margin:0}body{box-sizing:border-box;background:var(--frutiparc);color:var(--ink);flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:16px;font-family:Verdana,sans-serif;display:flex}#game{aspect-ratio:700/480;border-radius:14px;width:min(100%,145.833vh - 218.75px,940px);overflow:hidden;box-shadow:0 0 0 4px #fff,0 10px 30px #1f3a0573}#game canvas{display:block;width:100%!important;height:100%!important}footer{text-align:center;max-width:min(100%,560px);margin-top:10px;line-height:1.5}footer p{margin:0}footer .credit{font-size:13px}footer .note{opacity:.7;margin-top:3px;font-size:11px}footer a{color:inherit}:root{--sat:env(safe-area-inset-top);--sar:env(safe-area-inset-right);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left)}html.mobile,html.mobile body{overscroll-behavior:none;overflow:hidden}html.mobile body{background:var(--page,#83ca22);gap:0;padding:0}html.mobile #game{aspect-ratio:auto;width:100vw;height:100dvh;box-shadow:none;border-radius:0;position:fixed;inset:0}html.mobile footer{display:none}html.embed,html.embed body{overflow:hidden}html.embed body{background:var(--page,#83ca22);gap:0;padding:0}html.embed #game{aspect-ratio:auto;width:100vw;height:100dvh;box-shadow:none;border-radius:0;position:fixed;inset:0}html.embed footer{display:none}#game canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#rotate{display:none}@media (orientation:portrait){html.mobile #rotate{z-index:10;background:var(--page,var(--frutiparc));color:var(--page-ink,var(--ink));flex-direction:column;justify-content:center;align-items:center;gap:22px;font-size:20px;font-weight:700;display:flex;position:fixed;inset:0}}#rotate .phone{border:5px solid;border-radius:12px;width:54px;height:92px;animation:2.2s ease-in-out infinite turn}@keyframes turn{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}to{transform:rotate(0)}}</style>
