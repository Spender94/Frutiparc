<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Burning Kiwi</title>
<!--
  Burning Kiwi — portage natif JS du jeu de course Flash de 2004 (350×350,
  40 images par seconde), fidèle aux sources AS2 (Games/burningKiwi/inc/).
  Les dessins sont les formes vectorielles du SWF rejouées sur un canvas par
  le lecteur de liste d'affichage de Kaluga (/kaluga/moteur/), les sons ses
  MP3, les fontes ses fontes embarquées, les scénarios de ses clips ceux du
  fichier d'origine, les circuits ceux des track0N.swf. La physique des
  voitures (mainGame.as, gameData.as) est transcrite à l'identique, timer de
  secours compris : les sensations sont celles du disque.

  Au clavier : les touches du jeu (par défaut ↑ accélérer, Ctrl freiner,
  ← → tourner, espace nitro/valider), P pause, échap.

  ?sid= pour la persistance Frutiparc (fruticard : coupes, écuries, records
  par circuit ; préférences ; modes ; score au classement du circuit).
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #aire { flex: 1 1 0; min-height: 0; min-width: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: auto; outline: none; }
  /* ── Le pilotage au doigt ──
     Pas de manette : la piste elle-même est la commande. On touche la piste
     là où l'on veut aller, la voiture s'y dirige et accélère tant que le
     doigt est posé. Un second doigt posé freine tant qu'il reste là ; un
     double-tap met la nitro. Reste une pastille de pause et, au premier
     départ, le mode d'emploi. L'écran entier est pour la course. */
  #vise {
    position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border: 3px solid rgba(255, 236, 170, .9); border-radius: 50%;
    box-shadow: 0 0 12px rgba(255, 200, 80, .6), inset 0 0 8px rgba(255, 200, 80, .35);
    pointer-events: none; display: none; z-index: 3;
  }
  #vise::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; }
  #vise.frein { border-color: #ff7a5c; box-shadow: 0 0 12px rgba(255, 90, 60, .7); }
  #b-pause {
    position: absolute; top: 8px; left: 8px; z-index: 4; display: none;
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7);
    background: rgba(60, 20, 10, .55); color: #fff; font: bold 15px Verdana, sans-serif;
    align-items: center; justify-content: center; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  @media (pointer: coarse) { #b-pause { display: flex; } }
  #b-pause.presse { background: rgba(240, 129, 61, .85); }
  #mode-emploi {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); z-index: 4;
    width: min(88%, 360px); padding: 10px 14px; box-sizing: border-box; border-radius: 12px;
    background: rgba(28, 10, 44, .88); color: #fff; font: 13px/1.5 Verdana, sans-serif; text-align: center;
    display: none; pointer-events: none;
  }
  #mode-emploi b { color: #ffd27a; }
  #mode-emploi.visible { display: block; animation: me-fondu 6s forwards; }
  @keyframes me-fondu { 0% { opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  #chargement {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: bold 14px Verdana, sans-serif; text-shadow: 0 1px 0 rgba(0,0,0,.2);
    pointer-events: none;
  }
  /* Le salon du mode en ligne (multi.js) : un panneau posé sur la scène. */
  #aire { position: relative; }   /* la pastille de visée, la pause, le mode d'emploi s'y posent */
  #bk-multi {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 8px;
    margin: auto; width: min(100%, 420px); max-height: 100%; overflow: auto; box-sizing: border-box;
    padding: 10px 12px; background: rgba(28, 10, 44, .94); color: #fff;
    font: 12px/1.45 Verdana, Arial, sans-serif; border: 3px solid #c9531b; border-radius: 12px;
  }
  #bk-multi .bkm-tete { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
  #bk-multi .bkm-etat { font-size: 11px; color: #d8b7ff; font-weight: normal; }
  #bk-multi .bkm-section { background: rgba(255, 255, 255, .07); border-radius: 8px; padding: 6px 8px; }
  #bk-multi .bkm-titre { font-weight: bold; color: #ffd27a; margin-bottom: 4px; }
  #bk-multi .bkm-petit { margin-top: 8px; font-size: 11px; }
  #bk-multi .bkm-ligne { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.08); }
  #bk-multi .bkm-ligne:first-of-type { border-top: 0; }
  #bk-multi .bkm-ligne i { color: #d8b7ff; font-style: normal; font-size: 11px; }
  #bk-multi .bkm-vide, #bk-multi .bkm-noms, #bk-multi .bkm-note { color: #cbb6e0; font-size: 11px; }
  #bk-multi .bkm-note { text-align: center; }
  #bk-multi .bkm-erreur { background: #8a2010; border-radius: 6px; padding: 4px 8px; font-weight: bold; }
  #bk-multi .bkm-pret { font-size: 11px; color: #cbb6e0; }
  #bk-multi .bkm-pret.oui { color: #9cff8a; font-weight: bold; }
  #bk-multi .bkm-piste { margin: 2px 0 6px; }
  #bk-multi select { font: inherit; padding: 2px 4px; border-radius: 6px; }
  #bk-multi .bkm-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #bk-multi .bkm-btn {
    flex: 1 1 auto; min-height: 36px; border: 2px solid #fff; border-radius: 10px; cursor: pointer;
    background: #c9531b; color: #fff; font: bold 12px Verdana, Arial, sans-serif; padding: 4px 10px;
  }
  #bk-multi .bkm-btn.bkm-grand { flex-basis: 100%; min-height: 42px; font-size: 14px; }
  #bk-multi .bkm-btn.bkm-sombre { background: #5a2d7a; }
  #bk-multi .bkm-btn.bkm-oui { background: #2d7a3e; }
  #bk-multi .bkm-btn[disabled] { opacity: .45; cursor: default; }
  #bk-multi .bkm-btn:not([disabled]):active { background: #f0813d; }
</style>
</head>
<body>
<div id="tout">
  <div id="aire"><canvas id="scene" width="350" height="350" tabindex="0"></canvas><div id="bk-multi"></div></div>
  <div id="vise"></div>
  <div id="b-pause" data-touche="80">II</div>
  <div id="mode-emploi"><b>Touche la piste</b> là où tu veux aller : la voiture y file et accélère tant que ton doigt est posé.<br><b>Second doigt posé</b> : frein, tant qu'il reste là. <b>Double-tap</b> : nitro.</div>
</div>
<div id="chargement">Chargement de Burning Kiwi…</div>

<script src="/kaluga/moteur/formes.js"></script>
<script src="/kaluga/moteur/flash.js"></script>
<script src="/kaluga/moteur/texte.js"></script>
<script src="/kaluga/moteur/son.js"></script>
<script src="/kaluga/moteur/chargeur.js"></script>
<script src="/bkiwi/jeu/scripts-images.js"></script>
<script src="/bkiwi/jeu/fantome.js"></script>
<script src="/bkiwi/jeu/biblio.js"></script>
<script src="/bkiwi/jeu/donnees.js"></script>
<script src="/bkiwi/jeu/moteur.js"></script>
<script src="/bkiwi/jeu/menu.js"></script>
<script src="/bkiwi/jeu/final.js"></script>
<script src="/bkiwi/plateforme.js"></script>
<!-- Le mode en ligne : le fil WebSocket partagé avec le Battle de Frutisnake
     (balise <kw>), et le salon, la course, les voitures des autres. -->
<script src="/snake3/reseau.js"></script>
<script src="/bkiwi/multi.js"></script>
<script src="/bkiwi/jeu/cadence.js"></script>
<script src="/bkiwi/jeu/principal.js"></script>
<!-- Le disque sorti de la Frusion ferme le jeu, et le battement tient le
     voyant « joue à Burning Kiwi » (data-jeu = swfName du disque, GAME_DISCS). -->
<script src="/js/eject-watch.js" data-jeu="bkiwi"></script>
<!-- Combien de courses classées reste-t-il aujourd'hui ? Burning Kiwi est
     rationné comme Kaluga, MotionBall 2, Frutisnake et Swapou (server.js,
     FD_LIMITED_GAMES) : passé le quota, on continue de courir mais le temps
     n'entre plus au Challenge — le menu bascule alors sur les « essais ».
     Rien ne le disait ici : le bandeau l'affiche en permanence, comme sur les
     jeux Flash (game-popup.html) et sur Swapou. -->
<script src="/js/fd-badge.js" data-jeu="bkiwi"></script>
<script>
(function () {
  'use strict';
  const K = window.KalugaMoteur;
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('scene');
  const L = 350, H = 350;

  // Le canvas prend la place que #aire lui laisse, en gardant 350×350.
  function adapter() {
    const aire = document.getElementById('aire');
    const l = aire.clientWidth, h = aire.clientHeight;
    const ech = Math.max(0.1, Math.min(l / L, h / H));
    canvas.style.width = Math.floor(L * ech) + 'px';
    canvas.style.height = Math.floor(H * ech) + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // La définition est plafonnée à 1,6 million de pixels : chaque image
    // redessine toute la scène en vectoriel, et en plein écran sur un écran
    // dense on tirait jusqu'à dix fois la scène d'origine (voir mb2/index.html).
    const plafond = Math.sqrt(1.6e6 / (L * H));
    const px = Math.max(1, Math.min(plafond, Math.round(L * ech * dpr) / L));
    canvas.width = Math.round(L * px);
    canvas.height = Math.round(H * px);
    if (K.scene) K.scene.echelleCanvas = px;
  }
  window.addEventListener('resize', adapter);

  // Les commandes au doigt. Chaque geste vaut une touche du clavier — celle
  // que le joueur a réglée pour cette commande (controls[0..4] : accélérer,
  // freiner, gauche, droite, nitro), lue au moment de l'appui.
  const codeCommande = function (i) {
    const M = window.BkiwiJeu && window.BkiwiJeu.M;
    const c = M && M.controls ? M.controls[i] : undefined;
    return c !== undefined ? c : [38, 17, 37, 39, 32][i];
  };
  // La pause : une pastille, en haut à gauche de la piste.
  (function () {
    const b = document.getElementById('b-pause');
    let code = null;
    const poser = function (v, ev) {
      ev.preventDefault(); ev.stopPropagation();
      b.classList.toggle('presse', v);
      if (v) { code = Number(b.dataset.touche); K.Key.presser(code); }
      else if (code !== null) { K.Key.relacher(code); code = null; }
    };
    b.addEventListener('pointerdown', function (ev) { poser(true, ev); });
    b.addEventListener('pointerup', function (ev) { poser(false, ev); });
    b.addEventListener('pointercancel', function (ev) { poser(false, ev); });
  })();

  /*
   * LA PISTE EST LA COMMANDE.
   *
   * Une rangée de boutons sous la piste, c'était six cibles minuscules à
   * viser sans les regarder, pendant que la voiture file. Ici on regarde la
   * piste, et on la touche LÀ OÙ L'ON VEUT ALLER : à chaque pas du jeu, on
   * compare le cap de la voiture à la direction du doigt (la voiture est au
   * milieu de l'écran, la caméra la suit), et l'on tient la touche gauche ou
   * droite jusqu'à ce qu'elle pointe dessus ; le doigt posé, c'est
   * l'accélérateur — relevé, la voiture roule sur son erre. Un second doigt
   * posé pendant qu'on pilote, c'est le frein, tant qu'il reste posé (on
   * continue de viser avec le premier : on freine en braquant). Un double-tap
   * met la nitro. (Le frein « doigt sur la voiture » d'avant demandait de
   * viser une cible de vingt pixels qui bouge : très dur à prendre.)
   *
   * Pendant le décompte, le doigt posé fait monter la fausse vitesse du super
   * départ, comme la touche d'accélération. Les menus ne sont pas touchés :
   * on ne pilote qu'en course, et seulement au toucher (à la souris, on a le
   * clavier).
   */
  const aire = document.getElementById('aire');
  const vise = document.getElementById('vise');
  const DOIGT_TOLERANCE = 10;   // degrés : en deçà, tout droit
  const DOIGT_ARRIERE = 100;    // degrés : au-delà, on tourne sans accélérer
  let doigt = null;             // { id, x, y } en pixels de scène
  let frein = null;             // l'identifiant du second doigt, posé
  let dernierTap = 0;
  const tenues = {};            // code → true (ce que le pilotage tient enfoncé)
  const tenir = function (i, v) {
    const code = codeCommande(i);
    if (v && !tenues[code]) { tenues[code] = true; K.Key.presser(code); }
    else if (!v && tenues[code]) { delete tenues[code]; K.Key.relacher(code); }
  };
  const lacherPilotage = function () {
    for (const code of Object.keys(tenues)) { delete tenues[code]; K.Key.relacher(Number(code)); }
    doigt = null; frein = null;
    vise.style.display = 'none';
    vise.classList.remove('frein');
  };
  const nitro = function () {
    const code = codeCommande(4);
    K.Key.presser(code);
    setTimeout(function () { K.Key.relacher(code); }, 120);
  };
  const enCourse = function () {
    const M = window.BkiwiJeu && window.BkiwiJeu.M;
    return !!(M && M.vs && M.vs.mainPhase === 1 && M.carPJ && M.track);
  };
  const positionScene = function (ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * L / r.width, y: (ev.clientY - r.top) * H / r.height };
  };
  const poserVise = function (ev) {
    const r = aire.getBoundingClientRect();
    vise.style.left = (ev.clientX - r.left) + 'px';
    vise.style.top = (ev.clientY - r.top) + 'px';
    vise.style.display = 'block';
  };
  // À chaque pas du jeu : le cap vers le doigt.
  const piloter = function () {
    if (!doigt) return;
    if (!enCourse()) { lacherPilotage(); return; }
    const M = window.BkiwiJeu.M, car = M.carPJ;
    if (M.gamePaused && M.starting) { tenir(0, true); return; }   // le décompte : le super départ
    if (M.gamePaused || car.finished) { lacherPilotage(); return; }
    // La voiture sur l'écran : le circuit est décalé par la caméra.
    const cx = M.track._x + car._x, cy = M.track._y + car._y;
    const dx = doigt.x - cx, dy = doigt.y - cy;
    let ecart = Math.atan2(dy, dx) * 180 / Math.PI - car._rotation;
    while (ecart > 180) ecart -= 360;
    while (ecart < -180) ecart += 360;
    tenir(2, ecart < -DOIGT_TOLERANCE);
    tenir(3, ecart > DOIGT_TOLERANCE);
    // Le second doigt posé : le frein, et plus de gaz.
    const freine = frein !== null;
    tenir(1, freine);
    tenir(0, !freine && Math.abs(ecart) < DOIGT_ARRIERE);
    vise.classList.toggle('frein', freine);
  };
  aire.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse' || !enCourse()) return;
    if (doigt !== null) {   // le second doigt : le frein, tant qu'il est posé
      if (ev.pointerId !== doigt.id && frein === null) { frein = ev.pointerId; piloter(); }
      return;
    }
    const t = performance.now();
    if (t - dernierTap < 320) { nitro(); dernierTap = 0; } else dernierTap = t;
    const p = positionScene(ev);
    doigt = { id: ev.pointerId, x: p.x, y: p.y };
    poserVise(ev);
    piloter();
  });
  aire.addEventListener('pointermove', function (ev) {
    if (!doigt || ev.pointerId !== doigt.id) return;
    const p = positionScene(ev);
    doigt.x = p.x; doigt.y = p.y;
    poserVise(ev);
  });
  const finDoigt = function (ev) {
    if (doigt && ev.pointerId === doigt.id) lacherPilotage();
    else if (frein !== null && ev.pointerId === frein) { frein = null; piloter(); }
  };
  aire.addEventListener('pointerup', finDoigt);
  aire.addEventListener('pointercancel', finDoigt);
  window.addEventListener('pointerup', finDoigt);
  // Le pilotage se recalcule devant chaque pas du jeu, après le chargement
  // de la scène (demarrerBurningKiwi pose K.scene).
  const brancherPilotage = function (scene) {
    const tick0 = scene.tick;
    scene.tick = function () { piloter(); return tick0.apply(this, arguments); };
  };
  // Le mode d'emploi, au premier départ sur un écran tactile (une fois par appareil).
  const modeEmploi = function () {
    if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) return;
    let vu = false;
    try { vu = localStorage.getItem('bkiwi-doigt') === '1'; } catch (e) { /* stockage fermé */ }
    if (vu) return;
    const me = document.getElementById('mode-emploi');
    me.classList.add('visible');
    try { localStorage.setItem('bkiwi-doigt', '1'); } catch (e) { /* tant pis */ }
    setTimeout(function () { me.classList.remove('visible'); }, 6200);
  };
  let dejaEnCourse = false;
  setInterval(function () {
    const c = enCourse();
    if (c && !dejaEnCourse) modeEmploi();
    dejaEnCourse = c;
  }, 500);

  // Quitter l'onglet du light, c'est lâcher les commandes (le contrat
  // `__relacherCommandes` de light.html).
  const lacherTout = function () {
    lacherPilotage();
    K.Key.toutRelacher();
    document.getElementById('b-pause').classList.remove('presse');
  };
  window.__relacherCommandes = lacherTout;
  document.addEventListener('visibilitychange', function () { if (document.hidden) lacherTout(); });
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      adapter();
      const b = canvas.getBoundingClientRect();
      if (!b.width || !b.height) lacherTout();
    }).observe(document.getElementById('aire'));
  }

  // Le salon du mode en ligne : une seule écoute pour ses boutons et sa liste.
  const salon = document.getElementById('bk-multi');
  salon.addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-act]');
    if (b && b.tagName !== 'SELECT' && window.BkiwiJeu && window.BkiwiJeu.multi) window.BkiwiJeu.multi.action(b);
  });
  salon.addEventListener('change', function (ev) {
    const b = ev.target.closest('select[data-act]');
    if (b && window.BkiwiJeu && window.BkiwiJeu.multi) window.BkiwiJeu.multi.action(b);
  });

  adapter();
  window.demarrerBurningKiwi({ canvas, sid: params.get('sid') || '' }).then(function (r) {
    window.__bkiwi = r;
    brancherPilotage(r.scene);
    document.getElementById('chargement').remove();
    adapter();
    canvas.focus();
  }).catch(function (e) {
    document.getElementById('chargement').textContent = 'Burning Kiwi n\'a pas pu démarrer : ' + (e && e.message ? e.message : e);
    console.error(e);
  });
})();
</script>
</body>
</html>
