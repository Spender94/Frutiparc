<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Burning Kiwi</title>
<!--
  Burning Kiwi — portage natif JS du jeu de course Flash de 2004 (350×350,
  40 images par seconde), fidèle aux sources AS2 (Games/burningKiwi/inc/).
  Les dessins sont les formes vectorielles du SWF rejouées sur un canvas par
  le lecteur de liste d'affichage de Kaluga (/kaluga/moteur/), les sons ses
  MP3, les fontes ses fontes embarquées, les scénarios de ses clips ceux du
  fichier d'origine, les circuits ceux des track0N.swf. La physique des
  voitures (mainGame.as, gameData.as) est transcrite à l'identique, timer de
  secours compris : les sensations sont celles du disque.

  Au clavier : les touches du jeu (par défaut ↑ accélérer, Ctrl freiner,
  ← → tourner, espace nitro/valider), P pause, échap.

  ?sid= pour la persistance Frutiparc (fruticard : coupes, écuries, records
  par circuit ; préférences ; modes ; score au classement du circuit).
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #aire { flex: 1 1 0; min-height: 0; min-width: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: auto; outline: none; }
  /* ── Le pilotage au doigt ──
     Comme à Miniwave : pas une rangée de boutons, une BANDE où le pouce
     PILOTE. Posé, il accélère ; glissé à gauche ou à droite du milieu, il
     tourne ; relevé, la voiture roule sur son erre. À côté, deux boutons qui
     comptent en course, nitro et frein, et la pause. */
  #commandes { display: none; width: 100%; box-sizing: border-box; padding: 0 8px 8px; gap: 10px; align-items: stretch; }
  @media (pointer: coarse) { #commandes { display: flex; } }
  #pave {
    flex: 1 1 auto; min-width: 0; height: clamp(86px, 15vh, 130px);
    position: relative; border-radius: 18px;
    background: linear-gradient(180deg, #5a2414, #3a150c);
    box-shadow: inset 0 0 0 2px rgba(255, 205, 150, .28);
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    transition: box-shadow .08s;
  }
  #pave.on { box-shadow: inset 0 0 0 2px rgba(255, 221, 120, .85); background: linear-gradient(180deg, #6e2c17, #46190d); }
  #pave .mode-emploi { color: #e6bf9c; font-size: 11px; line-height: 1.5; text-align: center; pointer-events: none; padding: 0 44px; }
  #pave.on .mode-emploi { opacity: .3; }
  #pave .fleche { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, .35); font-size: 30px; font-weight: bold; pointer-events: none; }
  #pave .fleche.g { left: 14px; }
  #pave .fleche.d { right: 14px; }
  #pave.gauche .fleche.g, #pave.droite .fleche.d { color: #fff; text-shadow: 0 0 10px #ffd27a; }
  .boutons { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; width: 96px; }
  .btn {
    flex: 1 1 0; min-width: 0; min-height: 34px;
    border: 3px solid #fff; border-radius: 14px;
    background: #c9531b; color: #fff;
    font: bold 17px Verdana, sans-serif;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .18);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .btn:active, .btn.presse { background: #f0813d; }
  #b-pause { flex: 0 0 30px; min-height: 30px; font-size: 12px; background: #8a3610; }
  @media (orientation: landscape) {
    #tout { flex-direction: row; gap: 6px; }
    #aire { width: auto; height: 100%; order: 5; }
    #pave { order: 0; flex: 0 0 auto; width: clamp(120px, 22vw, 180px); height: 100%; margin: 0 0 0 6px; }
    #pave .mode-emploi { padding: 0 32px; }
    .boutons { order: 9; height: 100%; justify-content: center; width: 72px; margin-right: 6px; }
    .btn { flex: 0 0 auto; height: clamp(44px, 16vh, 64px); font-size: 15px; }
    #b-pause { height: 32px; }
  }
  @media (orientation: landscape) and (pointer: coarse) { #commandes { display: contents; } }
  #chargement {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: bold 14px Verdana, sans-serif; text-shadow: 0 1px 0 rgba(0,0,0,.2);
    pointer-events: none;
  }
  /* Le salon du mode en ligne (multi.js) : un panneau posé sur la scène. */
  #aire { position: relative; }
  #bk-multi {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 8px;
    margin: auto; width: min(100%, 420px); max-height: 100%; overflow: auto; box-sizing: border-box;
    padding: 10px 12px; background: rgba(28, 10, 44, .94); color: #fff;
    font: 12px/1.45 Verdana, Arial, sans-serif; border: 3px solid #c9531b; border-radius: 12px;
  }
  #bk-multi .bkm-tete { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
  #bk-multi .bkm-etat { font-size: 11px; color: #d8b7ff; font-weight: normal; }
  #bk-multi .bkm-section { background: rgba(255, 255, 255, .07); border-radius: 8px; padding: 6px 8px; }
  #bk-multi .bkm-titre { font-weight: bold; color: #ffd27a; margin-bottom: 4px; }
  #bk-multi .bkm-petit { margin-top: 8px; font-size: 11px; }
  #bk-multi .bkm-ligne { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.08); }
  #bk-multi .bkm-ligne:first-of-type { border-top: 0; }
  #bk-multi .bkm-ligne i { color: #d8b7ff; font-style: normal; font-size: 11px; }
  #bk-multi .bkm-vide, #bk-multi .bkm-noms, #bk-multi .bkm-note { color: #cbb6e0; font-size: 11px; }
  #bk-multi .bkm-note { text-align: center; }
  #bk-multi .bkm-erreur { background: #8a2010; border-radius: 6px; padding: 4px 8px; font-weight: bold; }
  #bk-multi .bkm-pret { font-size: 11px; color: #cbb6e0; }
  #bk-multi .bkm-pret.oui { color: #9cff8a; font-weight: bold; }
  #bk-multi .bkm-piste { margin: 2px 0 6px; }
  #bk-multi select { font: inherit; padding: 2px 4px; border-radius: 6px; }
  #bk-multi .bkm-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #bk-multi .bkm-btn {
    flex: 1 1 auto; min-height: 36px; border: 2px solid #fff; border-radius: 10px; cursor: pointer;
    background: #c9531b; color: #fff; font: bold 12px Verdana, Arial, sans-serif; padding: 4px 10px;
  }
  #bk-multi .bkm-btn.bkm-grand { flex-basis: 100%; min-height: 42px; font-size: 14px; }
  #bk-multi .bkm-btn.bkm-sombre { background: #5a2d7a; }
  #bk-multi .bkm-btn.bkm-oui { background: #2d7a3e; }
  #bk-multi .bkm-btn[disabled] { opacity: .45; cursor: default; }
  #bk-multi .bkm-btn:not([disabled]):active { background: #f0813d; }
</style>
</head>
<body>
<div id="tout">
  <div id="aire"><canvas id="scene" width="350" height="350" tabindex="0"></canvas><div id="bk-multi"></div></div>
  <div id="commandes">
    <div id="pave" aria-label="Zone de pilotage tactile">
      <span class="fleche g">&#8592;</span>
      <span class="mode-emploi">pose le pouce : la voiture accélère<br>glisse-le à gauche ou à droite pour tourner</span>
      <span class="fleche d">&#8594;</span>
    </div>
    <div class="boutons">
      <div class="btn" data-commande="4">nitro</div>
      <div class="btn" data-commande="1">frein</div>
      <div class="btn" id="b-pause" data-touche="80">pause</div>
    </div>
  </div>
</div>
<div id="chargement">Chargement de Burning Kiwi…</div>

<script src="/kaluga/moteur/formes.js"></script>
<script src="/kaluga/moteur/flash.js"></script>
<script src="/kaluga/moteur/texte.js"></script>
<script src="/kaluga/moteur/son.js"></script>
<script src="/kaluga/moteur/chargeur.js"></script>
<script src="/bkiwi/jeu/scripts-images.js"></script>
<script src="/bkiwi/jeu/fantome.js"></script>
<script src="/bkiwi/jeu/biblio.js"></script>
<script src="/bkiwi/jeu/donnees.js"></script>
<script src="/bkiwi/jeu/moteur.js"></script>
<script src="/bkiwi/jeu/menu.js"></script>
<script src="/bkiwi/jeu/final.js"></script>
<script src="/bkiwi/plateforme.js"></script>
<!-- Le mode en ligne : le fil WebSocket partagé avec le Battle de Frutisnake
     (balise <kw>), et le salon, la course, les voitures des autres. -->
<script src="/snake3/reseau.js"></script>
<script src="/bkiwi/multi.js"></script>
<script src="/bkiwi/jeu/cadence.js"></script>
<script src="/bkiwi/jeu/principal.js"></script>
<!-- Le disque sorti de la Frusion ferme le jeu, et le battement tient le
     voyant « joue à Burning Kiwi » (data-jeu = swfName du disque, GAME_DISCS). -->
<script src="/js/eject-watch.js" data-jeu="bkiwi"></script>
<!-- Combien de courses classées reste-t-il aujourd'hui ? Burning Kiwi est
     rationné comme Kaluga, MotionBall 2, Frutisnake et Swapou (server.js,
     FD_LIMITED_GAMES) : passé le quota, on continue de courir mais le temps
     n'entre plus au Challenge — le menu bascule alors sur les « essais ».
     Rien ne le disait ici : le bandeau l'affiche en permanence, comme sur les
     jeux Flash (game-popup.html) et sur Swapou. -->
<script src="/js/fd-badge.js" data-jeu="bkiwi"></script>
<script>
(function () {
  'use strict';
  const K = window.KalugaMoteur;
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('scene');
  const L = 350, H = 350;

  // Le canvas prend la place que #aire lui laisse, en gardant 350×350.
  function adapter() {
    const aire = document.getElementById('aire');
    const l = aire.clientWidth, h = aire.clientHeight;
    const ech = Math.max(0.1, Math.min(l / L, h / H));
    canvas.style.width = Math.floor(L * ech) + 'px';
    canvas.style.height = Math.floor(H * ech) + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // La définition est plafonnée à 1,6 million de pixels : chaque image
    // redessine toute la scène en vectoriel, et en plein écran sur un écran
    // dense on tirait jusqu'à dix fois la scène d'origine (voir mb2/index.html).
    const plafond = Math.sqrt(1.6e6 / (L * H));
    const px = Math.max(1, Math.min(plafond, Math.round(L * ech * dpr) / L));
    canvas.width = Math.round(L * px);
    canvas.height = Math.round(H * px);
    if (K.scene) K.scene.echelleCanvas = px;
  }
  window.addEventListener('resize', adapter);

  // Les commandes au doigt. Chaque geste vaut une touche du clavier — celle
  // que le joueur a réglée pour cette commande (controls[0..4] : accélérer,
  // freiner, gauche, droite, nitro), lue au moment de l'appui.
  const codeDe = function (b) {
    if (b.dataset.touche) return Number(b.dataset.touche);
    return codeCommande(Number(b.dataset.commande));
  };
  const codeCommande = function (i) {
    const M = window.BkiwiJeu && window.BkiwiJeu.M;
    const c = M && M.controls ? M.controls[i] : undefined;
    return c !== undefined ? c : [38, 17, 37, 39, 32][i];
  };
  document.querySelectorAll('#commandes .btn').forEach(function (b) {
    let code = null;
    const poser = function (v, ev) {
      ev.preventDefault();
      b.classList.toggle('presse', v);
      if (v) { code = codeDe(b); K.Key.presser(code); }
      else if (code !== null) { K.Key.relacher(code); code = null; }
    };
    b.addEventListener('pointerdown', function (ev) { poser(true, ev); });
    b.addEventListener('pointerup', function (ev) { poser(false, ev); });
    b.addEventListener('pointercancel', function (ev) { poser(false, ev); });
    b.addEventListener('pointerleave', function (ev) { if (b.classList.contains('presse')) poser(false, ev); });
    window.addEventListener('pointerup', function () { if (b.classList.contains('presse')) { b.classList.remove('presse'); if (code !== null) { K.Key.relacher(code); code = null; } } });
  });

  // LA BANDE DE PILOTAGE (comme à Miniwave). Le pouce posé accélère ; sa
  // position dans la largeur tourne : à gauche du tiers central, on braque à
  // gauche, à droite, à droite, au milieu on va tout droit. Relever le
  // pouce lâche tout. Un double-tap met la nitro (le bouton reste là aussi).
  // Un seul doigt pilote la bande : les autres sont pour les boutons.
  const pave = document.getElementById('pave');
  const ZONE = 0.17;   // la demi-largeur du « tout droit », en part de la bande
  let doigt = null, dernierAppui = 0;
  const pilote = { gaz: null, gauche: null, droite: null };   // les codes enfoncés
  const tenir = function (quoi, i, v) {
    if (v && pilote[quoi] === null) { pilote[quoi] = codeCommande(i); K.Key.presser(pilote[quoi]); }
    else if (!v && pilote[quoi] !== null) { K.Key.relacher(pilote[quoi]); pilote[quoi] = null; }
  };
  const braquer = function (clientX) {
    const r = pave.getBoundingClientRect();
    const k = r.width > 0 ? (clientX - r.left) / r.width - 0.5 : 0;
    const gauche = k < -ZONE, droite = k > ZONE;
    tenir('gauche', 2, gauche);
    tenir('droite', 3, droite);
    pave.classList.toggle('gauche', gauche);
    pave.classList.toggle('droite', droite);
  };
  const lacherPave = function () {
    doigt = null;
    tenir('gaz', 0, false); tenir('gauche', 2, false); tenir('droite', 3, false);
    pave.classList.remove('on', 'gauche', 'droite');
  };
  pave.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (doigt !== null) return;
    doigt = ev.pointerId;
    try { pave.setPointerCapture(ev.pointerId); } catch (e) { /* pas de capture : on suit quand même */ }
    pave.classList.add('on');
    tenir('gaz', 0, true);
    braquer(ev.clientX);
    const t = performance.now();
    if (t - dernierAppui < 320) {
      // Double-tap : une impulsion de nitro (le jeu ne lit l'appui qu'une image).
      const code = codeCommande(4);
      K.Key.presser(code);
      setTimeout(function () { K.Key.relacher(code); }, 120);
      dernierAppui = 0;
    } else dernierAppui = t;
  });
  pave.addEventListener('pointermove', function (ev) { if (ev.pointerId === doigt) braquer(ev.clientX); });
  pave.addEventListener('pointerup', function (ev) { if (ev.pointerId === doigt) lacherPave(); });
  pave.addEventListener('pointercancel', function (ev) { if (ev.pointerId === doigt) lacherPave(); });
  pave.addEventListener('lostpointercapture', function (ev) { if (ev.pointerId === doigt) lacherPave(); });

  // Quitter l'onglet du light, c'est lâcher les commandes (le contrat
  // `__relacherCommandes` de light.html).
  const lacherTout = function () {
    lacherPave();
    K.Key.toutRelacher();
    document.querySelectorAll('#commandes .btn.presse').forEach(function (b) { b.classList.remove('presse'); });
  };
  window.__relacherCommandes = lacherTout;
  document.addEventListener('visibilitychange', function () { if (document.hidden) lacherTout(); });
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      adapter();
      const b = canvas.getBoundingClientRect();
      if (!b.width || !b.height) lacherTout();
    }).observe(document.getElementById('aire'));
  }

  // Le salon du mode en ligne : une seule écoute pour ses boutons et sa liste.
  const salon = document.getElementById('bk-multi');
  salon.addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-act]');
    if (b && b.tagName !== 'SELECT' && window.BkiwiJeu && window.BkiwiJeu.multi) window.BkiwiJeu.multi.action(b);
  });
  salon.addEventListener('change', function (ev) {
    const b = ev.target.closest('select[data-act]');
    if (b && window.BkiwiJeu && window.BkiwiJeu.multi) window.BkiwiJeu.multi.action(b);
  });

  adapter();
  window.demarrerBurningKiwi({ canvas, sid: params.get('sid') || '' }).then(function (r) {
    window.__bkiwi = r;
    document.getElementById('chargement').remove();
    adapter();
    canvas.focus();
  }).catch(function (e) {
    document.getElementById('chargement').textContent = 'Burning Kiwi n\'a pas pu démarrer : ' + (e && e.message ? e.message : e);
    console.error(e);
  });
})();
</script>
</body>
</html>
