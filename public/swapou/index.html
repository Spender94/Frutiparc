<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Swapou 2</title>
<!--
  Swapou 2 — portage natif JS du jeu Flash d'origine (700×480 @40fps),
  fidèle au source AS2 (Games/swapou2/swapou2/*.as). Pensé pour mobile :
  - en portrait le canvas pivote de 90° (« paysage forcé » : on tient le
    téléphone à l'horizontale), ce qui maximise la taille de jeu ;
  - le canvas est rastérisé à la résolution physique (devicePixelRatio)
    pour un rendu net ;
  - tactile : l'appui montre le sélecteur de paire, le glissement l'ajuste,
    le relâcher effectue l'échange (la souris garde le clic immédiat).
  ?sid= pour la persistance plateforme (slots, scores, titems).
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #24330e;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed;
    left: 50%; top: 50%;
    width: 700px; height: 480px; /* taille CSS fixe : le buffer suit le DPR */
    transform-origin: 0 0;
    image-rendering: auto;
  }
  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #cfe8a0; font-family: Verdana, Arial, sans-serif;
    gap: 14px; z-index: 10;
  }
  #loader .bar {
    width: 240px; height: 12px;
    border: 2px solid #cfe8a0; border-radius: 7px;
    overflow: hidden;
  }
  #loader .bar > div {
    height: 100%; width: 0%;
    background: #9fce30;
    transition: width .15s;
  }
  #loader .t { font-size: 13px; letter-spacing: 1px; }
  /* invitation à tenir le téléphone à l'horizontale (mode portrait) */
  #rotate-hint {
    position: fixed; left: 50%; top: 14px;
    transform: translateX(-50%);
    background: rgba(20, 35, 8, 0.88);
    color: #e8f7c0; font-family: Verdana, Arial, sans-serif;
    font-size: 13px; padding: 9px 16px; border-radius: 18px;
    border: 1px solid #9fce30;
    display: none; z-index: 20; white-space: nowrap;
    transition: opacity .6s;
  }
  #rotate-hint .ph { display: inline-block; transform: rotate(90deg); }
</style>
</head>
<body>
<canvas id="stage" width="700" height="480"></canvas>
<div id="rotate-hint"><span class="ph">📱</span> Tournez votre téléphone</div>
<div id="loader">
  <div class="t">SWAPOU 2</div>
  <div class="bar"><div id="loadbar"></div></div>
  <div class="t" id="loadtxt">chargement…</div>
</div>

<script src="engine.js"></script>
<script src="assets.js"></script>
<script src="ui.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="screens.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('stage');
  var loader = document.getElementById('loader');
  var loadbar = document.getElementById('loadbar');
  var loadtxt = document.getElementById('loadtxt');
  var rotateHint = document.getElementById('rotate-hint');

  // sid : ?sid=… puis session /light en secours (même logique que Grapiz)
  var sid = new URLSearchParams(location.search).get('sid') || '';
  if (!sid) {
    try { sid = (JSON.parse(localStorage.getItem('fp_light_session') || '{}') || {}).sid || ''; } catch (e) {}
  }

  // ── mise à l'échelle : letterbox + rotation 90° en portrait ──
  var scale = 1;
  var rotated = false;
  var hintDismissed = false;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    rotated = h > w; // portrait → le jeu pivote (téléphone tenu en paysage)
    if (rotated) scale = Math.min(w / 480, h / 700);
    else scale = Math.min(w / 700, h / 480);

    // netteté : buffer canvas à la résolution physique réellement affichée
    var dpr = window.devicePixelRatio || 1;
    var k = Math.min(scale * dpr, 2.5); // plafonné (coût de remplissage)
    if (k < 0.5) k = 0.5;
    var bw = Math.round(700 * k), bh = Math.round(480 * k);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    SW.setCanvasScale(k);

    // le buffer est k× plus grand que les 700×480 CSS : on compense
    var s = scale / k;
    canvas.style.width = bw + 'px';
    canvas.style.height = bh + 'px';
    if (rotated)
      canvas.style.transform = 'rotate(90deg) scale(' + s + ') translate(' + (-350 * k) + 'px,' + (-240 * k) + 'px)';
    else
      canvas.style.transform = 'scale(' + s + ') translate(' + (-350 * k) + 'px,' + (-240 * k) + 'px)';

    rotateHint.style.display = (rotated && !hintDismissed) ? 'block' : 'none';
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();
  // l'indication disparaît d'elle-même au bout de quelques secondes
  setTimeout(function () { dismissHint(); }, 7000);
  function dismissHint() {
    if (hintDismissed) return;
    hintDismissed = true;
    rotateHint.style.opacity = '0';
    setTimeout(function () { rotateHint.style.display = 'none'; }, 700);
  }

  // écran (client) → coordonnées logiques 700×480, rotation comprise
  function toLogical(clientX, clientY) {
    var dx = clientX - window.innerWidth / 2;
    var dy = clientY - window.innerHeight / 2;
    if (rotated)
      return { x: 350 + dy / scale, y: 240 - dx / scale };
    return { x: 350 + dx / scale, y: 240 + dy / scale };
  }

  // ── entrées ──
  var lastTouchTs = 0; // ignore les événements souris synthétiques post-tactile

  canvas.addEventListener('mousemove', function (e) {
    if (Date.now() - lastTouchTs < 800) return;
    var p = toLogical(e.clientX, e.clientY);
    SW.handleMouseMove(p.x, p.y);
  });
  canvas.addEventListener('mousedown', function (e) {
    if (Date.now() - lastTouchTs < 800) return;
    var p = toLogical(e.clientX, e.clientY);
    SW.handleMouseDown(p.x, p.y);
    e.preventDefault();
  });

  // tactile : appui = aperçu du sélecteur, glissé = ajustement,
  // relâcher = action (échange / clic)
  window.addEventListener('touchstart', function (e) {
    lastTouchTs = Date.now();
    dismissHint();
    var t = e.changedTouches[0];
    var p = toLogical(t.clientX, t.clientY);
    SW.handleTouchStart(p.x, p.y);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', function (e) {
    lastTouchTs = Date.now();
    var t = e.changedTouches[0];
    var p = toLogical(t.clientX, t.clientY);
    SW.handleMouseMove(p.x, p.y);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', function (e) {
    lastTouchTs = Date.now();
    var t = e.changedTouches[0];
    var p = toLogical(t.clientX, t.clientY);
    SW.handleTouchEnd(p.x, p.y);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchcancel', function () {
    SW.mouse.touching = false;
    SW.mouse.outside = true;
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') SW.setEsc(true);
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'Escape') SW.setEsc(false);
  });
  // premier geste → déverrouille l'audio (politique mobile)
  window.addEventListener('pointerdown', function () { SwapouAssets.unlock(); }, { once: true });

  // ── chargement puis démarrage ──
  SwapouAssets.loadImages(function (n, total) {
    loadbar.style.width = Math.round(n * 100 / total) + '%';
    loadtxt.textContent = 'chargement… ' + n + '/' + total;
  }).then(function () {
    loader.style.display = 'none';
    SW.boot(canvas, sid);
  });
})();
</script>
</body>
</html>
