<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Swapou 2</title>
<!--
  Swapou 2 — portage natif JS du jeu Flash d'origine (700×480 @40fps),
  fidèle au source AS2 (Games/swapou2/swapou2/*.as). Pensé pour mobile :
  - en portrait le canvas pivote de 90° (« paysage forcé » : on tient le
    téléphone à l'horizontale), ce qui maximise la taille de jeu ;
  - le canvas est rastérisé à la résolution physique (devicePixelRatio)
    pour un rendu net ;
  - tactile : l'appui montre le sélecteur de paire, le glissement l'ajuste,
    le relâcher effectue l'échange (la souris garde le clic immédiat).
  ?sid= pour la persistance plateforme (slots, scores, titems).
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    /* Le fond de scène du SWF (SetBackgroundColor) : le vert du parc. */
    background: #ADE76B;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Les deux fontes EMBARQUÉES du SWF, sorties par
     scripts/extract-swapou-menu.js : « PT Banana Split » pour les libellés de
     boutons et de titres, « Impact » pour la barre d'aide. Ce sont des fontes
     de 2005, sans accentués — comme dans le jeu d'origine, qui écrit donc
     « Parametres de jeu ». */
  @font-face {
    font-family: "PT Banana Split";
    src: url("fontes/banana.woff") format("woff");
    font-display: block;
  }
  @font-face {
    font-family: "Impact SW";
    src: url("fontes/impact.woff") format("woff");
    font-display: block;
  }
  /* Les deux fontes de CHIFFRES de la partie (scripts/extract-swapou-jeu.js) :
     « cipher » pour le score sur le parchemin, « DooM » pour le compte de la
     chaîne dans l'étoile de combo, le score flottant et le compteur du
     blocage. Quatorze glyphes chacune — les chiffres et guère plus. */
  @font-face {
    font-family: "Cipher SW";
    src: url("fontes/cipher.woff") format("woff");
    font-display: block;
  }
  @font-face {
    font-family: "DooM SW";
    src: url("fontes/doom.woff") format("woff");
    font-display: block;
  }
  #stage {
    position: fixed;
    left: 50%; top: 50%;
    width: 700px; height: 480px; /* taille CSS fixe : le buffer suit le DPR */
    transform-origin: 0 0;
    image-rendering: auto;
  }
  /* L'attente se peint DANS le canevas (cf. « l'écran de chargement »
     ci-dessous) : c'est celui du SWF, au pixel près, et il se met à l'échelle
     et pivote avec le jeu. Rien à styler ici. */
  /* invitation à tenir le téléphone à l'horizontale (mode portrait) */
  #rotate-hint {
    position: fixed; left: 50%; top: 14px;
    transform: translateX(-50%);
    background: rgba(20, 35, 8, 0.88);
    color: #e8f7c0; font-family: Verdana, Arial, sans-serif;
    font-size: 13px; padding: 9px 16px; border-radius: 18px;
    border: 1px solid #9fce30;
    display: none; z-index: 20; white-space: nowrap;
    transition: opacity .6s;
  }
  #rotate-hint .ph { display: inline-block; transform: rotate(90deg); }
</style>
</head>
<body>
<canvas id="stage" width="700" height="480"></canvas>
<div id="rotate-hint"><span class="ph">📱</span> Tournez votre téléphone</div>

<script src="engine.js"></script>
<script src="assets.js"></script>
<script src="ui.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="screens.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('stage');
  var rotateHint = document.getElementById('rotate-hint');

  // sid : ?sid=… puis session /light en secours (même logique que Grapiz)
  var sid = new URLSearchParams(location.search).get('sid') || '';
  if (!sid) {
    try { sid = (JSON.parse(localStorage.getItem('fp_light_session') || '{}') || {}).sid || ''; } catch (e) {}
  }

  // ── mise à l'échelle : letterbox + rotation 90° en portrait ──
  var scale = 1;
  var rotated = false;
  var hintDismissed = false;
  var attente = null;   // l'écran de chargement, tant qu'il tient la scène
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    rotated = h > w; // portrait → le jeu pivote (téléphone tenu en paysage)
    if (rotated) scale = Math.min(w / 480, h / 700);
    else scale = Math.min(w / 700, h / 480);

    // netteté : buffer canvas à la résolution physique réellement affichée
    var dpr = window.devicePixelRatio || 1;
    var k = Math.min(scale * dpr, 2.5); // plafonné (coût de remplissage)
    if (k < 0.5) k = 0.5;
    var bw = Math.round(700 * k), bh = Math.round(480 * k);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    SW.setCanvasScale(k);

    // le buffer est k× plus grand que les 700×480 CSS : on compense
    var s = scale / k;
    canvas.style.width = bw + 'px';
    canvas.style.height = bh + 'px';
    if (rotated)
      canvas.style.transform = 'rotate(90deg) scale(' + s + ') translate(' + (-350 * k) + 'px,' + (-240 * k) + 'px)';
    else
      canvas.style.transform = 'scale(' + s + ') translate(' + (-350 * k) + 'px,' + (-240 * k) + 'px)';

    rotateHint.style.display = (rotated && !hintDismissed) ? 'block' : 'none';
    // Redimensionner un canevas l'EFFACE : tant que le jeu n'a pas démarré,
    // c'est à l'écran d'attente de se repeindre.
    if (attente) attente();
  }
  // Rotation de l'appareil : sur mobile, 'resize' / 'orientationchange' se
  // déclenchent souvent AVANT que innerWidth/innerHeight ne reflètent la
  // nouvelle orientation. Sans re-mesure différée, le canvas reste figé dans
  // l'ancienne rotation — le jeu apparaît « à la verticale » une fois le
  // téléphone tourné. On relance donc resize() plusieurs fois après l'évènement,
  // le temps que les dimensions se stabilisent.
  function resizeSoon() {
    resize();
    [60, 180, 360, 600].forEach(function (d) { setTimeout(resize, d); });
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resizeSoon);
  if (window.screen && screen.orientation && screen.orientation.addEventListener)
    screen.orientation.addEventListener('change', resizeSoon);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();
  // l'indication disparaît d'elle-même au bout de quelques secondes
  setTimeout(function () { dismissHint(); }, 7000);
  function dismissHint() {
    if (hintDismissed) return;
    hintDismissed = true;
    rotateHint.style.opacity = '0';
    setTimeout(function () { rotateHint.style.display = 'none'; }, 700);
  }

  // écran (client) → coordonnées logiques 700×480, rotation comprise
  function toLogical(clientX, clientY) {
    var dx = clientX - window.innerWidth / 2;
    var dy = clientY - window.innerHeight / 2;
    if (rotated)
      return { x: 350 + dy / scale, y: 240 - dx / scale };
    return { x: 350 + dx / scale, y: 240 + dy / scale };
  }

  // ── entrées ──
  var lastTouchTs = 0; // ignore les événements souris synthétiques post-tactile

  canvas.addEventListener('mousemove', function (e) {
    if (Date.now() - lastTouchTs < 800) return;
    var p = toLogical(e.clientX, e.clientY);
    SW.handleMouseMove(p.x, p.y);
  });
  canvas.addEventListener('mousedown', function (e) {
    if (Date.now() - lastTouchTs < 800) return;
    var p = toLogical(e.clientX, e.clientY);
    SW.handleMouseDown(p.x, p.y);
    e.preventDefault();
  });

  // tactile : appui = aperçu du sélecteur, glissé = ajustement,
  // relâcher = action (échange / clic)
  window.addEventListener('touchstart', function (e) {
    lastTouchTs = Date.now();
    dismissHint();
    var t = e.changedTouches[0];
    var p = toLogical(t.clientX, t.clientY);
    SW.handleTouchStart(p.x, p.y);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', function (e) {
    lastTouchTs = Date.now();
    var t = e.changedTouches[0];
    var p = toLogical(t.clientX, t.clientY);
    SW.handleMouseMove(p.x, p.y);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', function (e) {
    lastTouchTs = Date.now();
    var t = e.changedTouches[0];
    var p = toLogical(t.clientX, t.clientY);
    SW.handleTouchEnd(p.x, p.y);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchcancel', function () {
    SW.mouse.touching = false;
    SW.mouse.outside = true;
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') SW.setEsc(true);
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'Escape') SW.setEsc(false);
  });
  // premier geste → déverrouille l'audio (politique mobile)
  window.addEventListener('pointerdown', function () { SwapouAssets.unlock(); }, { once: true });

  /* ── L'ÉCRAN DE CHARGEMENT — celui du SWF, et rien d'autre ──────────────
   *
   * swapou.swf a quatre images à sa racine, et les deux premières SONT le
   * préchargeur : l'image 1 pose le clip `bg` (le fond vert à écailles,
   * bitmap #18 = images/bg.jpg, RÉPÉTÉ en largeur — la forme #19 est un
   * remplissage bitmap de type 0x40 sur 700 × 480) et un texte statique
   * (#24) ; l'image 2 boucle en arrière tant que `ifFrameLoaded` dit non,
   * puis saute à l'étiquette « main ».
   *
   * Le texte est « chargement... » — treize glyphes de la fonte 23,
   * « PT Banana Split », en blanc, hauteur 30. Il se pose à (19,1 ; 440,9),
   * la matrice du texte le décale de −12,85 et le premier enregistrement
   * porte un dy de 25 : la LIGNE DE BASE tombe donc en (6,25 ; 465,9).
   * Pas de barre, pas de pourcentage — le jeu d'origine n'en montrait aucun.
   *
   * On le peint sur le canevas du jeu, donc à la même échelle et dans la
   * même rotation : sur un téléphone tenu à la verticale, l'attente pivote
   * comme le jeu qu'elle annonce.
   */
  function ecranDeChargement() {
    var ctx = canvas.getContext('2d');
    var fond = new Image();
    var pret = false;
    fond.onload = function () { pret = true; peindre(); };
    fond.onerror = function () { peindre(); };
    fond.src = '/games/swapou2/images/bg.jpg';   // la base de SwapouAssets
    function peindre() {
      var k = SW.canvasScale;
      ctx.setTransform(k, 0, 0, k, 0, 0);
      ctx.fillStyle = '#ADE76B';              // SetBackgroundColor du fichier
      ctx.fillRect(0, 0, 700, 480);
      if (pret && fond.naturalWidth) {
        // Le remplissage RÉPÉTÉ de la forme #19 : la tuile fait 105 × 480 et
        // se pose à l'échelle 1, six fois et deux tiers.
        for (var x = 0; x < 700; x += fond.naturalWidth)
          ctx.drawImage(fond, x, 0, fond.naturalWidth, 480);
      }
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '30px "PT Banana Split", Verdana, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('chargement...', 6.25, 465.9);
    }
    peindre();
    return peindre;
  }
  attente = ecranDeChargement();
  // La fonte du texte d'attente : sans elle, `ctx.font` retombe en silence sur
  // la police de secours. On repeint dès qu'elle arrive.
  if (document.fonts && document.fonts.load) {
    document.fonts.load('30px "PT Banana Split"').then(function () {
      if (attente) attente();
    }).catch(function () {});
  }

  // ── chargement puis démarrage ──
  SwapouAssets.loadImages().then(function () {
    // Le canvas ne sait pas attendre une fonte : `ctx.font` retombe sans bruit
    // sur la police de secours si le WOFF n'est pas encore là. On les charge
    // donc explicitement — et on démarre quand même si ça échoue.
    if (!document.fonts || !document.fonts.load) return;
    return Promise.all([
      document.fonts.load('16px "PT Banana Split"'),
      document.fonts.load('16px "Impact SW"'),
      document.fonts.load('16px "Cipher SW"'),
      document.fonts.load('16px "DooM SW"'),
    ]).catch(function () {});
  }).then(function () {
    attente = null;
    SW.boot(canvas, sid);
  });
})();
</script>
<!-- Le compte des parties classées du jour, en haut à droite. -->
<script src="/js/fd-badge.js" data-jeu="swapou2"></script>
</body>
</html>
