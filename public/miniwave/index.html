<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Miniwave 2</title>
<!--
  Miniwave 2 — portage natif JS du jeu Flash d'origine (240×240 @40 i/s),
  fidèle aux sources AS2 (Games/miniWave2/class/miniwave).

  L'aire de jeu est CARRÉE et petite : contrairement à Swapou, pas besoin de
  forcer le paysage. On la centre, on l'agrandit d'un facteur entier (les
  dessins font 16 à 20 pixels ; un facteur fractionnaire les rendrait flous) et
  on garde le bas de l'écran pour la manette — le jeu d'origine se joue au
  clavier, il faut donc bien lui en donner un.

  ?sid= pour la persistance plateforme (slot, pictos, consécration).
-->
<style>
  /* Les polices du SWF, sorties telles quelles (scripts/extract-swf-font.js) :
     Jawbreaker pour le score et les encadrés, Arcade Classic pour les grands
     titres, la Verdana pixel 10 pour les petits textes. */
  @font-face {
    font-family: 'Jawbreaker';
    src: url('/miniwave/fontes/jawbreaker.woff') format('woff');
    font-display: block;
  }
  @font-face {
    font-family: 'ArcadeClassic';
    src: url('/miniwave/fontes/arcade.woff') format('woff');
    font-display: block;
  }
  @font-face {
    font-family: 'VerdanaPix';
    src: url('/miniwave/fontes/verdana10.woff') format('woff');
    font-display: block;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ADE76B;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  /* La zone de jeu prend TOUTE la largeur : c'est elle que le client mesure pour
     choisir son agrandissement. Sans width:100%, elle se serrerait autour du
     canvas — qui se dimensionne d'après elle — et le jeu resterait minuscule. */
  #aire {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 4px;
    box-shadow: 0 0 0 2px #1d2a48, 0 8px 30px rgba(0,0,0,.6);
  }

  /* ── La bande tactile ──
     Pas de boutons : le pouce posé sur la bande PILOTE — la position X du
     vaisseau est celle du doigt, le tir est continu tant qu'il est posé (la
     cadence reste celle du vaisseau), un double-tap lance la spéciale. */
  #manette {
    flex: 0 0 auto;
    display: flex; align-items: stretch; justify-content: center;
    padding: 0 12px 12px;
    width: 100%; max-width: 460px; box-sizing: border-box;
  }
  #pave-tactile {
    flex: 1 1 auto; height: 96px;
    border-radius: 16px;
    background: linear-gradient(180deg, #1d2a48, #16203a);
    box-shadow: inset 0 0 0 2px rgba(143,208,255,.18);
    display: flex; align-items: center; justify-content: center;
    cursor: crosshair; -webkit-tap-highlight-color: transparent;
    touch-action: none; user-select: none;
    transition: box-shadow .08s;
  }
  #pave-tactile.on { box-shadow: inset 0 0 0 2px rgba(191,241,141,.6); }
  #pave-tactile .mode-emploi {
    color: #6d7fa8; font-size: 11px; text-align: center; line-height: 1.6;
    pointer-events: none;
  }
  #pave-tactile.on .mode-emploi { opacity: .35; }

  /* Coupe-son, discret en haut à droite : on joue souvent en silence. */
  #muet {
    position: fixed; top: 10px; right: 10px; z-index: 4;
    border: 0; border-radius: 50%; width: 38px; height: 38px;
    background: rgba(29,42,72,.85); color: #cfe8a0; font-size: 17px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #muet.off { opacity: .55; }

  /* La pause, sous le coupe-son — P et Échap font pareil au clavier. Elle ne
     sert qu'en partie : le menu n'a rien à figer. */
  #pause {
    position: fixed; top: 54px; right: 10px; z-index: 4; display: none;
    border: 0; border-radius: 50%; width: 38px; height: 38px;
    background: rgba(29,42,72,.85); color: #cfe8a0; font-size: 15px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #pause.on { display: block; }
  #pause.pausee { background: rgba(75,122,38,.9); color: #fff; }

  /* L'écran de chargement du DISQUE d'origine (loader_miniwave.swf) : fond
     blanc, le cadre à tuiles du disque, le logo frusion au centre et le
     pourcentage. Composé sur une toile 800×600 comme la scène du SWF. */
  #chargement {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #ffffff;
  }
  #chargement canvas {
    width: min(100vw, calc(100vh * 800 / 600));
    height: auto; display: block;
  }

  /* Écran de fin : on rejoue d'un appui, sans passer par un menu. */
  #fin {
    position: fixed; inset: 0; z-index: 6; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(7,11,24,.86); color: #cfe8a0;
  }
  #fin.on { display: flex; }
  #fin .t { font: 24px 'Jawbreaker', Verdana, sans-serif; color: #ffd76a; }
  #fin .s { font-size: 14px; }
  #fin button {
    border: 0; border-radius: 14px; padding: 14px 28px;
    background: #2f4a1c; color: #bff18d; font: bold 15px inherit; cursor: pointer;
  }
  @media (min-width: 700px) and (pointer: fine) {
    /* Au clavier, la manette n'a plus lieu d'être — on rappelle les touches. */
    #manette { display: none; }
    #aide { color: #6d7fa8; font-size: 12px; padding-bottom: 14px; }
  }
  #aide { display: none; }
  @media (pointer: fine) { #aide { display: block; } }

  /* ── Clavier de Letter Invader ──
     Le mode se joue au clavier ; sur un téléphone il n'y en a pas. Trente-cinq
     touches (A-Z, 1-9) suffisent : le « 0 » et le « P » ne sortent jamais. */
  #clavier {
    flex: 0 0 auto; display: none; width: 100%; max-width: 460px;
    box-sizing: border-box; padding: 0 6px 8px;
    grid-template-columns: repeat(9, 1fr); gap: 3px;
  }
  #clavier.on { display: grid; }
  #clavier button {
    border: 0; border-radius: 6px; padding: 9px 0;
    background: #1d2a48; color: #cfe8a0;
    font: bold 14px Verdana, sans-serif; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #clavier button:active, #clavier button.on { background: #4b7a26; color: #fff; }

  /* Le bandeau d'avertissement du menu est dessiné sur le canevas ; il ne reste
     ici que la pastille de secours pour les messages hors jeu. */
  #message {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 9; background: rgba(22,32,58,.96); color: #cfe8a0;
    border-radius: 10px; padding: 10px 16px; font-size: 12px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 88vw; text-align: center;
  }
  #message.on { opacity: 1; }
</style>
</head>
<body>

<div id="tout">
  <div id="aire"><canvas id="stage" width="240" height="240"></canvas></div>
  <div id="manette" aria-label="Zone de pilotage tactile">
    <div id="pave-tactile">
      <span class="mode-emploi">glisse ton pouce — le vaisseau le suit et tire<br>double-tap : l'attaque spéciale</span>
    </div>
  </div>
  <div id="clavier"></div>
  <button type="button" id="muet" aria-label="Couper le son">🔊</button>
  <button type="button" id="pause" aria-label="Mettre en pause">⏸</button>
  <div id="aide">← → pour se déplacer · espace pour tirer · majuscule pour la bombe · P pour la pause</div>
</div>

<div id="message"></div>

<div id="chargement">
  <canvas id="chargement-toile" width="800" height="600"></canvas>
</div>

<div id="fin">
  <div class="t" id="fin-titre">GAME OVER</div>
  <div class="s" id="fin-score"></div>
  <div class="s" id="fin-pictos"></div>
  <div class="bas" style="max-width:300px">
    <button type="button" class="secondaire" id="fin-menu">Menu</button>
    <button type="button" id="rejouer">Rejouer</button>
  </div>
</div>

<script src="/miniwave/engine.js?v=fidele4"></script>
<script src="/miniwave/modes.js?v=fidele4"></script>
<script src="/miniwave/game.js?v=fidele4"></script>
<script src="/miniwave/sons.js?v=fidele4"></script>
<script src="/miniwave/plateforme.js?v=fidele4"></script>
<script src="/miniwave/menu.js?v=fidele4"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var sid = new URLSearchParams(location.search).get('sid') || '';
  var sons = new window.MiniwaveSons.Sons();
  var P = window.MiniwavePlateforme;
  var Menu = window.MiniwaveMenu;
  var plateforme = new P.Plateforme(sid);
  var client = null, niveaux = null, ui = null;
  // Ce qui a été lancé en dernier : sert au bouton « Rejouer ».
  var enCours = null;

  // ── L'écran de chargement du disque (loader_miniwave.swf) ──
  // Le cadre à tuiles, le logo frusion, le pourcentage — composés d'après
  // public/miniwave/loader/loader.json, sur la scène 800×600 du SWF.
  var chargeur = (function () {
    var toile = $('#chargement-toile');
    var ctx = toile.getContext('2d');
    var donnees = null, images = {}, prc = 0, erreur = null;
    function dessinerPieces(etat, tx, ty) {
      if (!etat) return;
      for (var i = 0; i < etat.pieces.length; i++) {
        var p = etat.pieces[i];
        var img = images[p.fichier];
        if (!img) continue;
        // La transformation de couleur du SWF : ici seul l'alpha compte (les
        // fondus de l'animation du logo).
        var alpha = 1;
        if (p.cx && p.cx.m) alpha = Math.max(0, Math.min(1, p.cx.m[3] / 256));
        if (alpha <= 0.01) continue;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(tx, ty);
        ctx.transform(p.m[0], p.m[1], p.m[2], p.m[3], p.m[4], p.m[5]);
        var ox = p.o ? p.o[0] : -p.w / 2;
        var oy = p.o ? p.o[1] : -p.h / 2;
        ctx.drawImage(img, ox, oy, p.w, p.h);
        ctx.restore();
      }
    }
    // Le cadre du disque : une guirlande de feston (les tuiles 12×12 du SWF —
    // la forme d'origine les répète le long d'une bordure de 610×410, qu'on
    // recompose ici tuile à tuile).
    function dessinerCadre(x, y, w, h) {
      var t = images['bitmap63.png'];
      var coin = images['bitmap62.png'];
      if (!t || !t.complete || !t.naturalWidth) return;
      var i;
      for (i = 12; i < w - 12; i += 12) {
        ctx.drawImage(t, x + i, y);                    // haut
        ctx.save();                                    // bas (feston retourné)
        ctx.translate(x + i + 6, y + h - 6);
        ctx.scale(1, -1);
        ctx.drawImage(t, -6, -6);
        ctx.restore();
      }
      for (i = 12; i < h - 12; i += 12) {
        ctx.save();                                    // gauche
        ctx.translate(x + 6, y + i + 6);
        ctx.rotate(-Math.PI / 2);
        ctx.drawImage(t, -6, -6);
        ctx.restore();
        ctx.save();                                    // droite
        ctx.translate(x + w - 6, y + i + 6);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(t, -6, -6);
        ctx.restore();
      }
      if (coin && coin.complete && coin.naturalWidth) {
        var coins = [[x, y, 1, 1], [x + w - 12, y, -1, 1], [x, y + h - 12, 1, -1], [x + w - 12, y + h - 12, -1, -1]];
        for (i = 0; i < coins.length; i++) {
          ctx.save();
          ctx.translate(coins[i][0] + 6, coins[i][1] + 6);
          ctx.scale(coins[i][2], coins[i][3]);
          ctx.drawImage(coin, -6, -6);
          ctx.restore();
        }
      }
    }
    function dessiner() {
      ctx.clearRect(0, 0, 800, 600);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 800, 600);
      if (donnees) {
        // Le cadre (610×410) centré ; le contenu du logo posé en 200,150 dans
        // l'aire 400×300 centrée, comme le plaçait le clip frusion.
        dessinerCadre(95, 95, 610, 410);
        dessinerPieces(donnees.logo && donnees.logo.etats[0], 400, 300);
      }
      ctx.font = '24px Jawbreaker, Verdana, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = erreur ? '#cc0000' : '#4a4a84';
      ctx.fillText(erreur || (Math.round(prc * 100) + '%'), 400, 470);
      if (erreur) {
        ctx.font = '10px VerdanaPix, Verdana, sans-serif';
        ctx.fillText('chargement impossible — recharge la page', 400, 492);
      }
      ctx.textAlign = 'left';
    }
    // Le manifeste et ses images, puis premier dessin. Un raté n'empêche pas
    // le jeu de charger : l'écran reste blanc avec le pourcentage.
    fetch('/miniwave/loader/loader.json').then(function (r) { return r.json(); }).then(function (j) {
      donnees = j;
      var fichiers = { 'bitmap62.png': 1, 'bitmap63.png': 1 };   // les tuiles du feston
      for (var k in j) for (var e = 0; e < j[k].etats.length; e++) {
        for (var i = 0; i < j[k].etats[e].pieces.length; i++) fichiers[j[k].etats[e].pieces[i].fichier] = 1;
      }
      var noms = Object.keys(fichiers);
      var faits = 0;
      noms.forEach(function (f) {
        var img = new Image();
        img.onload = img.onerror = function () { if (++faits === noms.length) dessiner(); };
        img.src = '/miniwave/loader/' + f;
        images[f] = img;
      });
    }).catch(function () {});
    if (document.fonts && document.fonts.load) {
      document.fonts.load('24px Jawbreaker').then(dessiner).catch(function () {});
    }
    dessiner();
    return {
      avancer: function (p) { prc = Math.max(prc, Math.min(1, p)); dessiner(); },
      echouer: function (msg) { erreur = msg; dessiner(); },
    };
  })();

  // Ce que la partie (ou un achat) vient d'ouvrir, dit au joueur.
  function resumePictos(r) {
    if (!r.enregistre) return sid ? 'Progression non enregistrée.' : 'Partie hors compte.';
    if (!r.gagnes.length) return 'Progression enregistrée.';
    var noms = r.gagnes.map(function (p) {
      if (p.genre === 'arcade') return 'picto Arcade';
      if (p.genre === 'letter') return 'picto Lettres';
      if (p.genre === 'mission') return 'picto Mission ' + (p.num + 1);
      if (p.genre === 'article') return 'picto ' + p.nom;
      if (p.genre === 'vaisseau') return 'picto ' + P.VAISSEAUX[p.num];
      var e = window.MiniwaveEngine.ENNEMIS[p.type];
      return 'picto ' + (e ? e.name : 'espèce ' + p.type);
    });
    return 'Débloqué : ' + noms.join(', ') + ' !';
  }

  // Les sons du menu, ceux du jeu d'origine.
  function sonMenu(quoi) {
    sons.ouvrir();
    sons.jouer({ page: 'sMenuPage', clic: 'sMenuBeep', achat: 'sMenuBeep',
      refus: 'sMenuBeepWrong' }[quoi] || 'sMenuBeep', window.MiniwaveSons.CANAL.menu);
  }

  // Le voyant « en partie » — la même icône que le bureau. Allumé au départ,
  // éteint à la fin de partie et au retour au menu ; la fermeture de l'onglet
  // éteint par sendBeacon, la déconnexion du chat éteint côté serveur.
  function direEnPartie(on) {
    if (!sid) return;
    var corps = JSON.stringify({ sid: sid, jeu: 'miniwave', on: on ? '1' : '0' });
    if (!on && navigator.sendBeacon) {
      navigator.sendBeacon('/api/light/jeu-en-cours', new Blob([corps], { type: 'application/json' }));
      return;
    }
    fetch('/api/light/jeu-en-cours', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corps,
    }).catch(function () {});
  }
  window.addEventListener('pagehide', function () { direEnPartie(false); });

  // ── Lancer une partie ──
  function lancer(l, escadron) {
    direEnPartie(true);
    enCours = { lancement: l, escadron: escadron };
    $('#fin').classList.remove('on');
    $('#pause').classList.add('on');
    var lettres = (l.mode === 'letter');
    $('#clavier').classList.toggle('on', lettres);
    $('#manette').style.display = lettres ? 'none' : '';
    client.nouvellePartie({
      mode: l.mode, niveaux: l.niveaux, vies: l.vies,
      ship: escadron[0] || 0, missionNum: l.missionNum, prime: l.prime, nom: l.nom,
      // Le compteur en jeu affiche portefeuille + récolte : le même nombre que
      // le bureau, dont Game.incCred crédite la fiche en direct.
      portefeuille: Number(plateforme.carte.$credit) || 0,
    });
    // page/SelectShip : l'escadron est une LISTE de vaisseaux, consommée dans
    // l'ordre. Le moteur en remplit une d'un seul type ; on pose la vraie.
    if (escadron.length) client.jeu.heroList = escadron.slice();
  }

  function ouvrirMenu() {
    direEnPartie(false);
    $('#fin').classList.remove('on');
    $('#clavier').classList.remove('on');
    $('#pause').classList.remove('on');
    if (client) client.pauser(false);
    $('#manette').style.display = 'none';
    ui.ouvrir('accueil');
  }

  // ── Le clavier de Letter Invader ──
  var TOUCHES = 'AZERTYUIOPQSDFGHJKLMWXCVBN123456789';
  (function construireClavier() {
    var cl = $('#clavier');
    TOUCHES.split('').forEach(function (ch) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        sons.ouvrir();
        if (client && client.jeu && client.jeu.frapper) client.jeu.frapper(ch.charCodeAt(0));
        b.classList.add('on');
        setTimeout(function () { b.classList.remove('on'); }, 90);
      });
      cl.appendChild(b);
    });
  })();

  window.addEventListener('keydown', function (ev) {
    if (!client || !client.jeu || !client.jeu.frapper) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (client.jeu.frapper(ev.keyCode)) ev.preventDefault();
  });

  ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { sons.ouvrir(); }, { once: false });
  });

  Promise.all([
    fetch('/miniwave/sprites/sprites.json?v=fidele4').then(function (r) { return r.json(); }),
    fetch('/miniwave/levels.json').then(function (r) { return r.json(); })
  ]).then(function (res) {
    var sprites = res[0];
    niveaux = res[1];
    // Les polices du SWF doivent être prêtes AVANT le premier dessin du menu,
    // sinon le canevas retombe sur Verdana le temps qu'elles arrivent.
    var polices = (document.fonts && document.fonts.load)
      ? Promise.all([
        document.fonts.load('24px Jawbreaker'),
        document.fonts.load('32px ArcadeClassic'),
        document.fonts.load('10px VerdanaPix'),
      ]).catch(function () {})
      : Promise.resolve();
    return Promise.all([
      window.MiniwaveClient.charger(sprites, function (p) {
        chargeur.avancer(p * 0.9);
      }),
      window.MiniwaveClient.chargerDecor(),
      sons.charger(),
      plateforme.charger(),
      polices
    ]).then(function () {
      chargeur.avancer(1);
      return sprites;
    });
  }).then(function (sprites) {
    $('#chargement').style.display = 'none';

    client = new window.MiniwaveClient.Client({
      canvas: $('#stage'),
      sprites: sprites,
      niveaux: niveaux.main[0].levels,
      // La pause fige aussi le son (la boucle de la soucoupe comprise), et le
      // bouton suit l'état — y compris quand la pause vient du clavier ou de
      // l'onglet qui passe derrière.
      surPause: function (pausee) {
        sons.suspendre(pausee);
        $('#pause').classList.toggle('pausee', pausee);
        $('#pause').textContent = pausee ? '▶' : '⏸';
      },
      surEvenement: function (nom, info) {
        sons.surEvenement(nom, info);
        if (nom !== 'finPartie') return;
        direEnPartie(false);
        var l = enCours ? enCours.lancement : {};
        $('#fin-titre').textContent = (info.raison === 'fin') ? 'BRAVO !' : 'GAME OVER';
        $('#fin-score').textContent = info.score + ' points · '
          + (l.mode === 'survival' ? ('palier ' + (info.level + 1)) : ('niveau ' + (info.level + 1)));
        $('#fin-pictos').textContent = '';
        $('#fin').classList.add('on');
        // La fiche part au serveur : les éliminations s'ajoutent à celles des
        // parties précédentes, les records montent, les crédits s'accumulent.
        // C'est de là que le serveur tire les pictos, puis la consécration.
        plateforme.enregistrer(Object.assign({}, info, {
          mode: l.mode || 'arcade', missionNum: l.missionNum, prime: l.prime,
          cons: (client.jeu.cons !== undefined) ? client.jeu.cons : client.jeu.getCons(),
        })).then(function (r) {
          $('#fin-pictos').textContent = resumePictos(r);
          window.__derniereSauvegarde = r;      // utile aux vérifications automatisées
        });
        if (window.parent !== window) {
          window.parent.postMessage({ miniwave: 'fin', score: info.score, level: info.level, sid: sid }, '*');
        }
      }
    });

    ui = new Menu.Interface({
      canvas: $('#stage'),
      sprites: sprites,
      poser: window.MiniwaveClient.poser,
      plateforme: plateforme,
      niveaux: niveaux,
      surChoix: lancer,
      surSon: sonMenu,
    });
    // Le menu occupe le même canevas que le jeu : c'est lui qui dessine quand il
    // est ouvert, et le jeu reprend la main dès qu'une partie commence.
    client.avant = ui;

    // Les appuis sur le canevas vont au menu, converti dans son repère 240×240.
    $('#stage').addEventListener('pointerdown', function (ev) {
      if (!ui.visible) return;
      var r = this.getBoundingClientRect();
      ui.auClic((ev.clientX - r.left) * 240 / r.width, (ev.clientY - r.top) * 240 / r.height);
      ev.preventDefault();
    });

    $('#muet').addEventListener('click', function () {
      var muet = this.classList.toggle('off');
      this.textContent = muet ? '🔇' : '🔊';
      sons.taire(muet);
      if (!muet) sons.ouvrir();
    });
    $('#pause').addEventListener('click', function () {
      client.pauser();
    });
    $('#rejouer').addEventListener('click', function () {
      if (enCours) lancer(enCours.lancement, enCours.escadron); else ouvrirMenu();
    });
    $('#fin-menu').addEventListener('click', ouvrirMenu);

    client.demarrer();
    ouvrirMenu();

    window.miniwaveClient = client;        // utile aux vérifications automatisées
    window.__plateforme = plateforme;
    window.__ui = ui;
    window.__sons = sons;
  }).catch(function (e) {
    chargeur.echouer(String(e && e.message || e));
  });
})();
</script>
</body>
</html>
