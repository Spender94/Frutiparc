<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Miniwave 2</title>
<!--
  Miniwave 2 — portage natif JS du jeu Flash d'origine (240×240 @40 i/s),
  fidèle aux sources AS2 (Games/miniWave2/class/miniwave).

  L'aire de jeu est CARRÉE et petite : contrairement à Swapou, pas besoin de
  forcer le paysage. On la centre, on l'agrandit d'un facteur entier (les
  dessins font 16 à 20 pixels ; un facteur fractionnaire les rendrait flous) et
  on garde le bas de l'écran pour la manette — le jeu d'origine se joue au
  clavier, il faut donc bien lui en donner un.

  ?sid= pour la persistance plateforme (slot, pictos, consécration).
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #070b18;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  /* La zone de jeu prend TOUTE la largeur : c'est elle que le client mesure pour
     choisir son agrandissement. Sans width:100%, elle se serrerait autour du
     canvas — qui se dimensionne d'après elle — et le jeu resterait minuscule. */
  #aire {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 4px;
    box-shadow: 0 0 0 2px #1d2a48, 0 8px 30px rgba(0,0,0,.6);
  }

  /* ── Manette ──
     Deux grandes zones de direction et un gros bouton de tir. Les cibles font
     au moins 64 px : on joue avec les pouces, en tenant le téléphone. */
  #manette {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 0 12px 12px;
    width: 100%; max-width: 460px; box-sizing: border-box;
  }
  #manette button {
    flex: 1 1 0; height: 72px; min-width: 64px;
    border: 0; border-radius: 16px;
    background: #1d2a48; color: #cfe8a0;
    font-size: 26px; font-weight: bold; font-family: inherit;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .08s, transform .08s;
  }
  #manette button.tir { flex: 1.4 1 0; background: #2f4a1c; color: #bff18d; font-size: 15px; letter-spacing: 1px; }
  /* La bombe ne sert qu'une fois par vaisseau : un bouton plus étroit, à part. */
  #manette button.bombe { flex: 0.7 1 0; min-width: 52px; background: #4a3a1c; font-size: 20px; }
  #manette button.bombe.on { background: #7a5f26; }
  #manette button.on { background: #3a5480; transform: scale(.96); }
  #manette button.tir.on { background: #4b7a26; }

  /* Coupe-son, discret en haut à droite : on joue souvent en silence. */
  #muet {
    position: fixed; top: 10px; right: 10px; z-index: 4;
    border: 0; border-radius: 50%; width: 38px; height: 38px;
    background: rgba(29,42,72,.85); color: #cfe8a0; font-size: 17px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #muet.off { opacity: .55; }

  #chargement {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #070b18; color: #cfe8a0; font-size: 13px; letter-spacing: 1px;
  }
  #chargement .barre { width: 200px; height: 10px; border: 2px solid #cfe8a0; border-radius: 6px; overflow: hidden; }
  #chargement .barre > div { height: 100%; width: 0; background: #9fce30; transition: width .12s; }

  /* Écran de fin : on rejoue d'un appui, sans passer par un menu. */
  #fin {
    position: fixed; inset: 0; z-index: 6; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(7,11,24,.86); color: #cfe8a0;
  }
  #fin.on { display: flex; }
  #fin .t { font-size: 20px; font-weight: bold; color: #ffd76a; }
  #fin .s { font-size: 14px; }
  #fin button {
    border: 0; border-radius: 14px; padding: 14px 28px;
    background: #2f4a1c; color: #bff18d; font: bold 15px inherit; cursor: pointer;
  }
  @media (min-width: 700px) and (pointer: fine) {
    /* Au clavier, la manette n'a plus lieu d'être — on rappelle les touches. */
    #manette { display: none; }
    #aide { color: #6d7fa8; font-size: 12px; padding-bottom: 14px; }
  }
  #aide { display: none; }
  @media (pointer: fine) { #aide { display: block; } }

  /* ── Clavier de Letter Invader ──
     Le mode se joue au clavier ; sur un téléphone il n'y en a pas. Trente-cinq
     touches (A-Z, 1-9) suffisent : le « 0 » et le « P » ne sortent jamais. */
  #clavier {
    flex: 0 0 auto; display: none; width: 100%; max-width: 460px;
    box-sizing: border-box; padding: 0 6px 8px;
    grid-template-columns: repeat(9, 1fr); gap: 3px;
  }
  #clavier.on { display: grid; }
  #clavier button {
    border: 0; border-radius: 6px; padding: 9px 0;
    background: #1d2a48; color: #cfe8a0;
    font: bold 14px Verdana, sans-serif; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #clavier button:active, #clavier button.on { background: #4b7a26; color: #fff; }

  /* ── Menu, choix et boutique ──
     Des panneaux HTML posés sur le canvas : un menu dessiné dans 240×240 serait
     illisible au doigt. */
  .ecran {
    position: fixed; inset: 0; z-index: 7; display: none;
    flex-direction: column; align-items: center;
    background: #070b18; color: #cfe8a0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  .ecran.on { display: flex; }
  .ecran h1 {
    font-size: 19px; letter-spacing: 3px; color: #ffd76a; margin: 22px 0 4px;
  }
  .ecran h2 { font-size: 14px; letter-spacing: 1px; margin: 18px 0 8px; color: #8fd0ff; }
  .ecran .sous { font-size: 11px; color: #6d7fa8; margin-bottom: 12px; text-align: center; }
  .ecran .liste { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 7px; }
  .ecran .item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 0; border-radius: 12px; padding: 12px 14px;
    background: #16203a; color: #cfe8a0; text-align: left;
    font: 14px Verdana, sans-serif; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ecran .item:active { background: #22314f; }
  .ecran .item .nom { flex: 1 1 auto; font-weight: bold; }
  .ecran .item .det { font-size: 10px; color: #7f93bd; font-weight: normal; display: block; margin-top: 3px; }
  .ecran .item.ferme { opacity: .45; cursor: default; }
  .ecran .item.ferme .det { color: #a08050; }
  .ecran .item .prix { font-size: 12px; color: #ffd76a; white-space: nowrap; }
  .ecran .item.vendu .prix { color: #7ed957; }
  .ecran .item.trop .prix { color: #ff8a5a; }
  .ecran .bas {
    width: 100%; max-width: 420px; display: flex; gap: 8px; margin: 16px 0 24px;
  }
  .ecran .bas button {
    flex: 1 1 0; border: 0; border-radius: 12px; padding: 13px;
    background: #2f4a1c; color: #bff18d; font: bold 14px Verdana, sans-serif; cursor: pointer;
  }
  .ecran .bas button.secondaire { background: #1d2a48; color: #8fd0ff; }
  #bourse {
    position: sticky; top: 0; align-self: stretch; z-index: 1;
    display: flex; justify-content: center; gap: 14px;
    background: #070b18; padding: 8px 0 6px; font-size: 12px;
  }
  #bourse b { color: #ffd76a; }
  #escadron-choix { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 6px 0 2px; }
  #escadron-choix span {
    border-radius: 6px; background: #16203a; padding: 5px 9px; font-size: 11px; color: #8fd0ff;
  }
  #message {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 9; background: rgba(22,32,58,.96); color: #cfe8a0;
    border-radius: 10px; padding: 10px 16px; font-size: 12px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 88vw; text-align: center;
  }
  #message.on { opacity: 1; }
</style>
</head>
<body>

<div id="tout">
  <div id="aire"><canvas id="stage" width="240" height="240"></canvas></div>
  <div id="manette">
    <button type="button" data-cmd="gauche" aria-label="Gauche">◀</button>
    <button type="button" class="tir" data-cmd="tir" aria-label="Tirer">TIR</button>
    <button type="button" class="bombe" data-cmd="bombe" aria-label="Bombe">💣</button>
    <button type="button" data-cmd="droite" aria-label="Droite">▶</button>
  </div>
  <div id="clavier"></div>
  <button type="button" id="muet" aria-label="Couper le son">🔊</button>
  <div id="aide">← → pour se déplacer · espace pour tirer · majuscule pour la bombe</div>
</div>

<!-- Accueil : les quatre rubriques de page/Main.as. -->
<div class="ecran" id="accueil">
  <h1>MINI-WAVE 2</h1>
  <div class="sous" id="accueil-grade"></div>
  <div class="liste" id="accueil-liste"></div>
  <div class="bas"><button type="button" class="secondaire" id="accueil-fermer">Retour au jeu</button></div>
</div>

<!-- Choix d'une mission ou d'un mode spécial. -->
<div class="ecran" id="choix">
  <h1 id="choix-titre">MISSIONS</h1>
  <div class="sous" id="choix-sous"></div>
  <div class="liste" id="choix-liste"></div>
  <div class="bas"><button type="button" class="secondaire" data-retour="accueil">Retour</button></div>
</div>

<!-- Composition de l'escadron (page/SelectShip.as) : on choisit shipMax
     vaisseaux, un par un, et on les perdra dans cet ordre. -->
<div class="ecran" id="escadron">
  <h1>ESCADRON</h1>
  <div class="sous" id="escadron-sous"></div>
  <div id="escadron-choix"></div>
  <div class="liste" id="escadron-liste"></div>
  <div class="bas">
    <button type="button" class="secondaire" data-retour="accueil">Retour</button>
    <button type="button" id="escadron-vite">Tout pareil</button>
  </div>
</div>

<!-- Le stand (page/Shop.as). -->
<div class="ecran" id="boutique">
  <h1>STAND</h1>
  <div id="bourse">Crédits : <b id="bourse-credit">0</b></div>
  <div class="liste" id="boutique-liste"></div>
  <div class="bas"><button type="button" class="secondaire" data-retour="accueil">Retour</button></div>
</div>

<div id="message"></div>

<div id="chargement">
  <div>MINIWAVE 2</div>
  <div class="barre"><div id="jauge"></div></div>
</div>

<div id="fin">
  <div class="t" id="fin-titre">GAME OVER</div>
  <div class="s" id="fin-score"></div>
  <div class="s" id="fin-pictos"></div>
  <div class="bas" style="max-width:300px">
    <button type="button" class="secondaire" id="fin-menu">Menu</button>
    <button type="button" id="rejouer">Rejouer</button>
  </div>
</div>

<script src="/miniwave/engine.js"></script>
<script src="/miniwave/modes.js"></script>
<script src="/miniwave/game.js"></script>
<script src="/miniwave/sons.js"></script>
<script src="/miniwave/plateforme.js"></script>
<script src="/miniwave/menu.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var sid = new URLSearchParams(location.search).get('sid') || '';
  var sons = new window.MiniwaveSons.Sons();
  var P = window.MiniwavePlateforme;
  var Menu = window.MiniwaveMenu;
  var plateforme = new P.Plateforme(sid);
  var client = null, niveaux = null;
  // Ce qu'on est en train de lancer : le mode choisi, puis l'escadron composé.
  var enCours = null;

  // ── Bandeau volant ──
  var messageT = null;
  function dire(texte) {
    var m = $('#message');
    m.textContent = texte;
    m.classList.add('on');
    clearTimeout(messageT);
    messageT = setTimeout(function () { m.classList.remove('on'); }, 2400);
  }

  // ── Écrans ──
  function montrer(nom) {
    $$('.ecran').forEach(function (e) { e.classList.toggle('on', e.id === nom); });
    if (nom) $('#fin').classList.remove('on');
  }
  function fermerEcrans() { $$('.ecran').forEach(function (e) { e.classList.remove('on'); }); }

  // Ce que la partie (ou un achat) vient d'ouvrir, dit au joueur.
  function resumePictos(r) {
    if (!r.enregistre) return sid ? 'Progression non enregistrée.' : 'Partie hors compte.';
    if (!r.gagnes.length) return 'Progression enregistrée.';
    var noms = r.gagnes.map(function (p) {
      if (p.genre === 'arcade') return 'picto Arcade';
      if (p.genre === 'letter') return 'picto Lettres';
      if (p.genre === 'mission') return 'picto Mission ' + (p.num + 1);
      if (p.genre === 'article') return 'picto ' + p.nom;
      if (p.genre === 'vaisseau') return 'picto ' + P.VAISSEAUX[p.num];
      var e = window.MiniwaveEngine.ENNEMIS[p.type];
      return 'picto ' + (e ? e.name : 'espèce ' + p.type);
    });
    return 'Débloqué : ' + noms.join(', ') + ' !';
  }

  // ── Accueil ──
  function ouvrirAccueil() {
    var c = plateforme.carte;
    $('#accueil-grade').textContent = P.GRADES[P.grade(c)] + ' · ' + c.$credit + ' crédits';
    var liste = $('#accueil-liste');
    liste.innerHTML = '';
    Menu.RUBRIQUES.forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.innerHTML = '<span class="nom">' + r.nom + '<span class="det">' + r.desc + '</span></span>';
      b.addEventListener('click', function () { choisirRubrique(r.id); });
      liste.appendChild(b);
    });
    montrer('accueil');
  }

  function choisirRubrique(id) {
    var e = Menu.entrees(plateforme.carte, niveaux);
    if (id === 'arcade') return preparer(e.arcade[0].lancement);
    if (id === 'stand') return ouvrirBoutique();
    ouvrirChoix(id === 'bonus' ? 'MISSIONS' : 'SPÉCIAL', id === 'bonus' ? e.bonus : e.special);
  }

  function ouvrirChoix(titre, entrees) {
    $('#choix-titre').textContent = titre;
    var ouverts = entrees.filter(function (x) { return x.ouvert; }).length;
    $('#choix-sous').textContent = ouverts
      ? ''
      : 'Rien d\'ouvert ici : ces modes s\'achètent au stand, avec les crédits ramassés en partie.';
    var liste = $('#choix-liste');
    liste.innerHTML = '';
    entrees.forEach(function (x) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item' + (x.ouvert ? '' : ' ferme');
      b.innerHTML = '<span class="nom">' + x.nom
        + '<span class="det">' + (x.ouvert ? x.detail : x.pourAcheter) + '</span></span>';
      if (x.ouvert) b.addEventListener('click', function () { preparer(x.lancement); });
      liste.appendChild(b);
    });
    montrer('choix');
  }

  // ── Composition de l'escadron ──
  // page/SelectShip.as : on choisit autant de vaisseaux que gameInfo.shipMax, un
  // par un. Les modes à une seule vie s'en passent — il n'y a rien à composer.
  function preparer(lancement) {
    enCours = { lancement: lancement, escadron: [] };
    var dispo = Menu.vaisseauxDisponibles(plateforme.carte);
    if (lancement.vies <= 1 || dispo.length === 1) {
      enCours.escadron = [];
      for (var i = 0; i < lancement.vies; i++) enCours.escadron.push(dispo[0] || 0);
      return demarrer();
    }
    dessinerEscadron(dispo);
    montrer('escadron');
  }

  function dessinerEscadron(dispo) {
    var l = enCours.lancement;
    $('#escadron-sous').textContent = l.nom + ' — choisis ' + l.vies
      + ' vaisseaux. Tu les perdras dans cet ordre.';
    var choix = $('#escadron-choix');
    choix.innerHTML = '';
    for (var i = 0; i < l.vies; i++) {
      var s = document.createElement('span');
      s.textContent = (i + 1) + '. '
        + (enCours.escadron[i] === undefined ? '—' : P.VAISSEAUX[enCours.escadron[i]]);
      choix.appendChild(s);
    }
    var liste = $('#escadron-liste');
    liste.innerHTML = '';
    dispo.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.innerHTML = '<span class="nom">' + P.VAISSEAUX[n] + '</span>';
      b.addEventListener('click', function () {
        enCours.escadron.push(n);
        if (enCours.escadron.length >= l.vies) return demarrer();
        dessinerEscadron(dispo);
      });
      liste.appendChild(b);
    });
  }

  $('#escadron-vite').addEventListener('click', function () {
    // Le raccourci : compléter avec le premier vaisseau disponible.
    var dispo = Menu.vaisseauxDisponibles(plateforme.carte);
    while (enCours.escadron.length < enCours.lancement.vies) enCours.escadron.push(dispo[0]);
    demarrer();
  });

  // ── La boutique ──
  function ouvrirBoutique() {
    dessinerBoutique();
    montrer('boutique');
  }
  function dessinerBoutique() {
    $('#bourse-credit').textContent = plateforme.carte.$credit;
    var liste = $('#boutique-liste');
    liste.innerHTML = '';
    Menu.rayon(plateforme.carte).forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item' + (a.achete ? ' vendu' : (a.abordable ? '' : ' trop'));
      b.innerHTML = '<span class="nom">' + a.nom + '<span class="det">' + a.ouvre + '</span></span>'
        + '<span class="prix">' + (a.achete ? 'acquis' : a.prix + ' ¤') + '</span>';
      if (!a.achete) {
        b.addEventListener('click', function () {
          plateforme.acheter(a.id).then(function (r) {
            if (!r.ok) {
              dire(r.raison === 'credit'
                ? ('Il te manque ' + r.manque + ' crédits.')
                : 'Article déjà acquis.');
              return;
            }
            dire(r.article.nom + ' acheté ! ' + resumePictos(r));
            dessinerBoutique();
          });
        });
      }
      liste.appendChild(b);
    });
  }

  // ── Le clavier de Letter Invader ──
  var TOUCHES = 'AZERTYUIOPQSDFGHJKLMWXCVBN123456789';
  (function construireClavier() {
    var cl = $('#clavier');
    TOUCHES.split('').forEach(function (ch) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        sons.ouvrir();
        if (client && client.jeu && client.jeu.frapper) client.jeu.frapper(ch.charCodeAt(0));
        b.classList.add('on');
        setTimeout(function () { b.classList.remove('on'); }, 90);
      });
      cl.appendChild(b);
    });
  })();

  // Au clavier physique, on parle directement au mode.
  window.addEventListener('keydown', function (ev) {
    if (!client || !client.jeu || !client.jeu.frapper) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (client.jeu.frapper(ev.keyCode)) ev.preventDefault();
  });

  // ── Lancer une partie ──
  function demarrer() {
    fermerEcrans();
    $('#fin').classList.remove('on');
    var l = enCours.lancement;
    var lettres = (l.mode === 'letter');
    $('#clavier').classList.toggle('on', lettres);
    $('#manette').style.display = lettres ? 'none' : '';
    client.nouvellePartie({
      mode: l.mode, niveaux: l.niveaux, vies: l.vies,
      ship: enCours.escadron[0] || 0, escadron: enCours.escadron,
      missionNum: l.missionNum, prime: l.prime, nom: l.nom,
    });
    // page/SelectShip : l'escadron est une LISTE de vaisseaux, consommée dans
    // l'ordre. Le moteur en remplit une d'un seul type ; on pose la vraie.
    if (enCours.escadron.length) client.jeu.heroList = enCours.escadron.slice();
    client.demarrer();
  }

  ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { sons.ouvrir(); }, { once: false });
  });

  Promise.all([
    fetch('/miniwave/sprites/sprites.json').then(function (r) { return r.json(); }),
    fetch('/miniwave/levels.json').then(function (r) { return r.json(); })
  ]).then(function (res) {
    var sprites = res[0];
    niveaux = res[1];
    return Promise.all([
      window.MiniwaveClient.charger(sprites, function (p) {
        $('#jauge').style.width = Math.round(p * 90) + '%';
      }),
      window.MiniwaveClient.chargerDecor(),
      sons.charger(),
      plateforme.charger()
    ]).then(function () {
      $('#jauge').style.width = '100%';
      return sprites;
    });
  }).then(function (sprites) {
    $('#chargement').style.display = 'none';

    client = new window.MiniwaveClient.Client({
      canvas: $('#stage'),
      sprites: sprites,
      niveaux: niveaux.main[0].levels,
      surEvenement: function (nom, info) {
        sons.surEvenement(nom, info);
        if (nom !== 'finPartie') return;
        var l = enCours ? enCours.lancement : {};
        $('#fin-titre').textContent = (info.raison === 'fin') ? 'BRAVO !' : 'GAME OVER';
        $('#fin-score').textContent = info.score + ' points · '
          + (l.mode === 'survival' ? ('palier ' + (info.level + 1)) : ('niveau ' + (info.level + 1)));
        $('#fin-pictos').textContent = '';
        $('#fin').classList.add('on');
        // La fiche part au serveur : les éliminations s'ajoutent à celles des
        // parties précédentes, les records montent, les crédits s'accumulent.
        // C'est de là que le serveur tire les pictos, puis la consécration.
        plateforme.enregistrer(Object.assign({}, info, {
          mode: l.mode || 'arcade', missionNum: l.missionNum, prime: l.prime,
          cons: (client.jeu.cons !== undefined) ? client.jeu.cons : client.jeu.getCons(),
        })).then(function (r) {
          $('#fin-pictos').textContent = resumePictos(r);
          window.__derniereSauvegarde = r;      // utile aux vérifications automatisées
        });
        if (window.parent !== window) {
          window.parent.postMessage({ miniwave: 'fin', score: info.score, level: info.level, sid: sid }, '*');
        }
      }
    });

    $('#muet').addEventListener('click', function () {
      var muet = this.classList.toggle('off');
      this.textContent = muet ? '🔇' : '🔊';
      sons.taire(muet);
      if (!muet) sons.ouvrir();
    });
    $('#rejouer').addEventListener('click', function () {
      if (enCours) demarrer(); else ouvrirAccueil();
    });
    $('#fin-menu').addEventListener('click', ouvrirAccueil);
    $('#accueil-fermer').addEventListener('click', function () {
      if (enCours) fermerEcrans(); else choisirRubrique('arcade');
    });
    $$('[data-retour]').forEach(function (b) {
      b.addEventListener('click', function () { ouvrirAccueil(); });
    });

    window.miniwaveClient = client;        // utile aux vérifications automatisées
    window.__plateforme = plateforme;
    window.__sons = sons;
    window.__menu = { ouvrirAccueil: ouvrirAccueil, ouvrirBoutique: ouvrirBoutique,
      choisirRubrique: choisirRubrique, preparer: preparer };
    ouvrirAccueil();
  }).catch(function (e) {
    $('#chargement').innerHTML = '<div>Chargement impossible</div><div style="font-size:11px">'
      + String(e && e.message || e) + '</div>';
  });
})();
</script>
</body>
</html>
