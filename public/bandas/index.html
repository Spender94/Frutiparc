<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutibandas</title>
<!--
  Client natif Frutibandas (modèle Grapiz). Trois écrans : sélection de mode,
  lobby (défis / chat / joueurs — repris du FrutiConnect d'origine), et la
  PAGE DE JEU 1050x728 qui utilise les assets préparés dans
  Games/frutibandas/anim (convertis par scripts/convert-bandas-assets.js).
  Protocole <bd> : voir public/bandas/server/net.js. Le plateau est REJOUÉ
  localement avec engine.js (mêmes règles que le serveur), les événements
  pilotent les animations comme BoardListener le faisait dans le SWF.
  Le gros nombre doré = série de victoires consécutives (mode challenge).
-->
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#fff; color:#333; font-family:Verdana,Geneva,sans-serif; }
  .screen { display:none; height:100%; }
  .screen.on { display:block; }
  #status { position:fixed; top:8px; left:10px; font-size:12px; color:#999; z-index:5; }
  .x { cursor:pointer; font-weight:bold; opacity:.85; } .x:hover { opacity:1; }

  /* ── Sélection de mode (même gabarit que Grapiz) ─────────────────────────── */
  #screen-mode.on { display:flex; }
  .mode-side { width:210px; flex:0 0 auto; padding:16px; }
  .fc-logo { display:grid; grid-template-columns:repeat(3,16px); grid-auto-rows:16px; gap:3px; }
  .fc-logo i { display:block; border-radius:2px; background:#e8e8e8; }
  .fc-name { font-size:11px; letter-spacing:1px; color:#bbb; font-weight:bold; margin:5px 0 18px; }
  .fruits-duo { width:150px; height:124px; display:flex; align-items:center; justify-content:center; gap:4px;
    background:repeating-linear-gradient(60deg,#f3f3f3,#f3f3f3 11px,#ececec 11px,#ececec 22px); border-radius:8px; }
  .fruits-duo img { width:58px; height:58px; object-fit:contain; }
  .bandas-v { writing-mode:vertical-rl; transform:rotate(180deg); font-size:64px; font-weight:bold; color:#e9e9e9; letter-spacing:-4px; margin-top:12px; user-select:none; }
  .mode-list { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .mode { width:470px; max-width:80vw; opacity:.7; }
  .mode.active { opacity:1; cursor:pointer; }
  .mode .mname { text-align:center; font-size:30px; font-weight:bold; letter-spacing:3px; color:#fff; -webkit-text-stroke:1px #c2c2c2; padding:11px; background:#d8d8d8; border-radius:4px; }
  .mode.active .mname { background:linear-gradient(#aac32f,#8ba731); -webkit-text-stroke:1px #74902a; text-shadow:0 1px 0 #74902a; }
  .mode .mstats { display:flex; margin-top:3px; font-size:13px; font-weight:bold; color:#fff; }
  .mode .mstats > div { flex:1; padding:6px 14px; display:flex; justify-content:space-between; background:#cfcfcf; }
  .mode .mstats > div:first-child { border-radius:0 0 0 4px; } .mode .mstats > div:last-child { border-radius:0 0 4px 0; }
  .mode.active .mstats .j { background:#8cc63f; } .mode.active .mstats .p { background:#f06d6d; }
  /* ── Le tournoi (format duel) ─────────────────────────────────────────────
     Un bandeau dans la barre du lobby du Championnat, et un tableau en
     surcouche. Les couleurs sont celles des panneaux du jeu. */
  #tournoi-bandeau { padding:7px 12px; background:#f6fbf2; border-bottom:2px solid #8cc63f; font-size:13px; color:#3d4a2a; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #tournoi-bandeau b { color:#5d7a1c; }
  #tournoi-bandeau .adv { background:#8cc63f; color:#fff; border-radius:10px; padding:1px 9px; font-weight:bold; }
  #tournoi-vue { position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; }
  #tournoi-vue.on { display:flex; }
  #tournoi-vue .boite { background:#fff; border-radius:10px; max-width:900px; width:100%; max-height:86vh; overflow:auto; box-shadow:0 8px 22px rgba(0,0,0,.45); }
  #tournoi-vue .tete { position:sticky; top:0; background:#8cc63f; color:#fff; padding:10px 14px; font-weight:bold; display:flex; align-items:center; }
  #tournoi-vue .tete .x { margin-left:auto; cursor:pointer; font-size:18px; line-height:1; }
  #tournoi-vue .corps { padding:14px; display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:#333; }
  #tournoi-vue h4 { margin:0 0 5px; color:#5d7a1c; font-size:14px; }
  #tournoi-vue table { border-collapse:collapse; }
  #tournoi-vue td, #tournoi-vue th { padding:3px 8px; border-bottom:1px solid #eee; text-align:left; }
  #tournoi-vue .moi { background:#f2f9e8; }
  #tournoi-vue .gagne { font-weight:bold; color:#2f8f2f; }
  #tournoi-vue .encours { color:#c98a00; font-size:12px; }
  @media (max-width: 760px) { #tournoi-vue .corps { flex-direction:column; gap:14px; } }

  /* Sa propre note, sous le bandeau du championnat : c'est l'enjeu de la salle.
     Le fond de la page est clair — on écrit donc en sombre, et le nombre
     reprend le vert des bandeaux actifs. */
  .mode .mnote { margin-top:6px; text-align:center; font-size:12px; font-weight:bold; color:#7a7a7a; letter-spacing:.5px; min-height:17px; }
  .mode .mnote b { font-size:16px; color:#74902a; }

  /* ── Lobby (3 panneaux : Défis / Chat / Joueurs — modèle Grapiz) ─────────── */
  #screen-lobby { padding:14px; background:#fff; }
  .lobby-window { max-width:900px; margin:0 auto; }
  .lobby-bar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .lobby-bar .title { font-weight:bold; color:#8ba731; letter-spacing:2px; font-size:15px; }
  .lobby-bar .sp { flex:1; }
  .lobby-bar button { font:inherit; font-weight:bold; border:0; border-radius:6px; padding:6px 12px; background:linear-gradient(#aac32f,#8ba731); color:#fff; cursor:pointer; }
  .lobby-bar .x { color:#bbb; font-size:16px; }
  .lobby-main { display:flex; gap:2px; height:406px; }
  .lpanel { display:flex; flex-direction:column; min-width:0; overflow:hidden; color:#fff; border:2px solid #fff; }
  .lpanel.green  { background:#A0B723; width:340px; flex:0 0 auto; }
  .lpanel.yellow { background:#F7A932; flex:1 1 auto; }
  .lpanel.pink   { background:#F0626E; width:214px; flex:0 0 auto; }
  .lpanel.collapsed { width:20px !important; flex:0 0 auto; cursor:pointer; }
  .lpanel:not(.collapsed) .lp-strip { display:none; }
  .lpanel.collapsed .lp-full { display:none; }
  .lp-strip { flex:1; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-weight:bold; font-size:15px; }
  .lp-full { flex:1; display:flex; flex-direction:column; min-height:0; }
  .lp-head { display:flex; align-items:stretch; gap:0; padding:0; font-weight:bold; font-size:13px; border-bottom:2px solid #fff; }
  .lp-head .lp-title { flex:1; display:flex; align-items:center; padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 1px #00000033; }
  .lp-head .lp-x { cursor:pointer; opacity:.9; font-size:14px; display:flex; align-items:center; padding:0 9px; border-left:2px solid #fff; } .lp-head .lp-x:hover { opacity:1; }
  .lp-body { flex:1; overflow-y:auto; padding:6px 8px; }
  .lp-foot { display:flex; align-items:center; gap:6px; padding:4px 6px; min-height:30px; border-top:2px solid #fff; }
  .lp-foot .arrow { cursor:pointer; font-weight:bold; opacity:.9; padding:0 4px; margin-left:auto; } .lp-foot .arrow:hover { opacity:1; }
  .sq { width:13px; height:13px; flex:0 0 auto; box-shadow:inset 0 0 0 2px #fff; }
  .SQ-idle { background:#F4AA34; } .SQ-waiting { background:#99B516; } .SQ-playing { background:#EF6270; }
  .defis-empty { font-size:12px; opacity:.9; padding:4px 2px; line-height:1.55; }
  .defis-status { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:bold; padding:6px 2px; }
  .btn-defier { font:inherit; font-weight:bold; border:0; border-radius:5px; padding:5px 12px; cursor:pointer; background:#fff; color:#6b7d10; box-shadow:0 1px 2px #00000033; }
  .btn-defier[disabled] { opacity:.6; cursor:default; color:#7a7a55; }
  .chat-log .ln { margin:1px 0; font-size:13px; line-height:1.45; text-shadow:0 1px 1px #00000026; }
  .chat-log .nk { font-weight:bold; }
  .lp-foot.chat-input { padding:4px; }
  .chat-input input { flex:1; border:0; border-radius:0; padding:6px 8px; font:inherit; background:transparent; color:#fff; }
  .chat-input input::placeholder { color:#ffffffb0; }
  .chat-input button { border:0; border-radius:4px; background:linear-gradient(#aac32f,#8ba731); color:#fff; font-weight:bold; padding:0 11px; cursor:pointer; font-size:15px; }
  .players-list { padding:0; }
  .pcount, .pli { display:flex; align-items:stretch; gap:0; padding:0; min-height:24px; font-weight:bold; font-size:13px; }
  .players-list .sq { width:26px; height:auto; align-self:stretch; border-right:2px solid #fff; border-bottom:2px solid #fff; box-shadow:none; }
  .pcount .nm, .pli .nm { flex:1; display:flex; align-items:center; padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 1px #0000002e; }
  .pli.can { cursor:pointer; } .pli.can:hover { background:#ffffff2e; }
  .pli.sel { background:#ffffff42; }
  .lobby-tabs { display:none; gap:4px; margin-bottom:6px; }
  .lobby-tabs button { flex:1; font:inherit; font-weight:bold; border:0; border-radius:0; padding:9px 4px; background:#e7e7e7; color:#7a7a7a; cursor:pointer; }
  .lobby-tabs button.on { background:linear-gradient(#aac32f,#8ba731); color:#fff; }

  /* ── Page de jeu (1050x728, assets préparés) ─────────────────────────────── */
  #screen-game { background:#5b6f1d; overflow:hidden; position:relative; }
  #page { position:absolute; width:1050px; height:728px; left:50%; top:0;
    transform-origin:top center; background:url(assets/page/game.png) 0 0/1050px 728px no-repeat;
    cursor:url(assets/mouse/normal.png) 2 2, auto; user-select:none; }
  #page .abs { position:absolute; }
  #page iframe.bouille, #page .bouille canvas { border:0; background:transparent; pointer-events:none; }
  #page div.bouille { overflow:hidden; }
  #page .bouille canvas { width:100%; height:100%; display:block; }
  .pname { font-weight:bold; color:#5b6f1d; font-size:14px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pclock { font-weight:bold; color:#7a8d2a; font-size:15px; text-align:center; font-variant-numeric:tabular-nums; }
  .pcountf { font-weight:bold; color:#5b6f1d; font-size:16px; }
  .pserie { font-weight:bold; color:#d59e00; font-size:13px; text-align:center; }
  .pside.active .pname { color:#e2590b; }
  .cardslot { width:90px; height:120px; display:flex; align-items:center; justify-content:center; }
  .cardslot img { width:89px; height:115px; display:block; }
  .cardslot.play { cursor:url(assets/mouse/hover.png) 2 2, pointer; }
  .cardslot.play:hover img { outline:2px solid #fff; outline-offset:-2px; border-radius:6px; }
  .cardslot .appear { animation:cardin .25s ease-out; }
  @keyframes cardin { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
  #bd-canvas.target { cursor:url(assets/mouse/viseur.png) 16 16, crosshair; }
  .barrow { cursor:url(assets/mouse/hover.png) 2 2, pointer; display:none; }
  .barrow.on { display:block; }
  #bd-chatbox { left:248px; top:568px; width:556px; height:104px; overflow-y:auto; font-size:12px; line-height:1.45; color:#5b6f1d; padding:2px 6px; }
  #bd-chatbox .nk { font-weight:bold; }
  #bd-chatbox .log { color:#9a8a30; }
  #bd-input { left:236px; top:684px; width:578px; height:25px; border:0; font:12px Verdana; color:#5b6f1d; padding:0 30px 0 12px;
    background:url(assets/page/chat_input.png) 0 0/578px 25px no-repeat; outline:none; }
  #bd-input:hover, #bd-input:focus { background-image:url(assets/page/chat_input_hover.png); }
  /* Boutons de la page (Son / Abandon) — style des boutons olive du jeu */
  .pgbtn-css { font:bold 13px Verdana; color:#fff; background:#75852A; border:0; border-radius:7px;
    padding:7px 16px; cursor:url(assets/mouse/hover.png) 2 2, pointer; box-shadow:inset 0 1px 0 #ffffff44, 0 1px 2px #00000033; }
  .pgbtn-css:hover { background:#8ba731; }
  /* Bannière de carte : bande inclinée (couleurs exactes des assets d'origine :
     rouge #db1f19 / vert #00b115) + nom FRANÇAIS en gras italique. */
  #bd-banner { left:0; top:250px; width:1050px; height:60px; display:none; pointer-events:none;
    align-items:center; justify-content:center;
    clip-path:polygon(49px 0, 100% 0, calc(100% - 49px) 100%, 0 100%); }
  #bd-banner.r { background:#db1f19; } #bd-banner.g { background:#00b115; }
  #bd-banner span { color:#fff; font:italic bold 36px Verdana; letter-spacing:2px; text-shadow:0 2px 3px #00000040; }
  /* Panneau de fin : style du panneau d'origine (dégradé vert pâle arrondi),
     textes d'origine en français. */
  #bd-end { display:none; left:191px; top:180px; width:667px; min-height:337px; text-align:center;
    background:linear-gradient(#e8edc4,#d6dd8e 55%,#e1e4a6); border:3px solid #fff; border-radius:18px;
    box-shadow:0 4px 18px #00000038; padding:22px 24px 90px; }
  #bd-end .endtitle { font:bold 30px Verdana; color:#75852A; margin-bottom:42px; }
  #bd-end .endtext { font:bold 17px Verdana; color:#5b6f1d; line-height:1.6; white-space:pre-line; }
  #bd-end .endsub { font:bold 13px Verdana; color:#9a8a30; margin-top:10px; }
  #bd-end img.okbtn { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); width:119px; height:52px; cursor:pointer; }
  #bd-info { display:none; left:236px; top:560px; width:578px; height:160px; background:#f4f8e3; border:2px solid #c4d36a; border-radius:8px; padding:8px 10px; z-index:4; }
  #bd-info img { float:left; width:89px; height:115px; margin-right:10px; }
  #bd-info .iname { font-weight:bold; color:#75812c; font-size:14px; margin-bottom:6px; }
  #bd-info .idesc { font-size:12px; color:#5b6f1d; line-height:1.5; }
  /* chatwrap : transparent sur bureau (les enfants se positionnent sur #page) */
  #chatwrap { display:contents; }
  /* éléments mobiles cachés sur bureau */
  #m-bar, #m-dpad, #m-hint, #m-sheet, #m-sheet-backdrop, #m-chatbtn { display:none; }

  /* ───────────────────────────────────────────────────────────────────────
     MOBILE (≤760px, version Light) : modes empilés, lobby en ONGLETS, et
     écran de jeu EMPILÉ : barre joueurs / plateau pleine largeur (glisser le
     doigt = bouger) / croix directionnelle / main de cartes (fiche de
     confirmation au toucher) / chat en surcouche.
     ─────────────────────────────────────────────────────────────────────── */
  @media (max-width:760px) {
    #screen-mode.on { flex-direction:column; }
    .mode-side { width:100%; display:flex; flex-direction:row; align-items:center; gap:14px; padding:10px 16px; }
    .fc-logo, .fc-name { display:none; }
    .fruits-duo { width:96px; height:80px; } .fruits-duo img { width:38px; height:38px; }
    .bandas-v { font-size:34px; margin:0; letter-spacing:-2px; }
    .mode-list { gap:12px; padding:8px 0 18px; justify-content:flex-start; }
    .mode { width:100%; max-width:none; }

    #screen-lobby { padding:6px; }
    .lobby-window { max-width:none; }
    .lobby-bar { margin-bottom:6px; }
    .lobby-tabs { display:flex; }
    .lobby-main { height:calc(100dvh - 116px); flex-direction:column; gap:0; }
    .lpanel, .lpanel.green, .lpanel.yellow, .lpanel.pink { width:100% !important; flex:1 1 auto; }
    .lpanel .lp-strip { display:none !important; }
    .lpanel.collapsed .lp-full { display:flex !important; }
    .lobby-main:not(.mt-defis) #panel-defis,
    .lobby-main:not(.mt-chat) #panel-chat,
    .lobby-main:not(.mt-players) #panel-players { display:none; }

    /* ── Écran de jeu empilé ── */
    #screen-game { overflow:auto; }
    #page { position:relative; left:0; transform:none !important; width:100vw; height:auto;
      min-height:100dvh; background:#92aa2e; display:flex; flex-direction:column;
      align-items:center; gap:8px; padding:8px 0 14px; cursor:auto; }
    /* tout repasse dans le flux (la règle bureau `#page .abs` est plus
       spécifique qu'un simple #id : on la neutralise ici) */
    #page .abs { position:static; }
    /* éléments bureau retirés du flux mobile */
    #pf0, #pf1, #pside0, #pside1, #pcount0, #pcount1, #pserie0, #pserie1,
    .barrow, #btn-sound, #btn-giveup, #bd-info { display:none !important; }

    #m-bar { display:flex; gap:8px; width:100%; padding:0 8px; order:1; }
    .mchip { flex:1; display:flex; flex-direction:row; align-items:center; gap:8px; background:#7e9427; border-radius:10px;
      padding:7px 10px; color:#fff; min-width:0; box-shadow:inset 0 1px 0 #ffffff2e; position:relative; }
    .mchip.active { background:#5b6f1d; box-shadow:0 0 0 2px #fff inset, 0 0 8px #ffffff66; }
    .mchip .msq { width:10px; height:10px; border-radius:2px; position:absolute; top:5px; left:5px; box-shadow:0 0 0 1px #00000033; }
    /* bouille du joueur (comme Grapiz) */
    .mchip .mav { flex:0 0 auto; width:42px; height:42px; border-radius:8px; overflow:hidden; background:#ffffff22; }
    .mchip .mav iframe, .mchip .mav canvas { width:100%; height:100%; border:0; display:block; pointer-events:none; background:transparent; }
    .mchip .minfo { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .mchip .mname { font-weight:bold; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mchip .mmeta { font-size:12px; opacity:.95; font-variant-numeric:tabular-nums; }
    /* vrais sprites du jeu (orange/banane) à la place des emojis 🍊/🍌, agrandis ×2 */
    .mchip .mmeta .m-fruit { height:32px; width:auto; vertical-align:middle; margin-right:3px; }
    .mchip .mserie { color:#ffe14d; font-weight:bold; }

    /* plateau réduit de 20% sur mobile (était min(100vw,70dvh)) — un poil moins zoomé */
    #bd-canvas { position:static; order:2; width:min(80vw, 56dvh); height:auto; touch-action:none; cursor:auto; }
    #m-hint { order:3; display:none; width:calc(100% - 16px); background:#5b6f1d; color:#fff;
      border-radius:9px; padding:9px 12px; font-size:13px; font-weight:bold;
      justify-content:space-between; align-items:center; gap:8px; }
    #m-hint.on { display:flex; }
    #m-hint button { font:bold 13px Verdana; color:#5b6f1d; background:#fff; border:0; border-radius:6px; padding:6px 12px; }

    #m-dpad { order:4; display:none; gap:8px; align-items:center; justify-content:center; width:100%; padding:0 8px; }
    #m-dpad.on { display:flex; }
    #m-dpad .mdir { width:52px; height:46px; font-size:20px; color:#fff; background:#75852A; border:0; border-radius:9px;
      box-shadow:inset 0 1px 0 #ffffff44, 0 2px 0 #5b6f1d; }
    #m-dpad .mdir:disabled { opacity:.45; }
    #m-dpad .mdir:active { transform:translateY(1px); }
    #m-dpad .pgbtn-css { padding:9px 10px; font-size:12px; }

    /* mains de cartes : la mienne en grand, l'adverse en petit (dos) */
    #slots0, #slots1 { position:static; display:flex; gap:6px; overflow-x:auto; max-width:100vw; padding:2px 8px; }
    #slots0 .cardslot, #slots1 .cardslot { position:static !important; width:auto; height:auto; flex:0 0 auto; }
    .slots-mine { order:5; min-height:88px; }
    .slots-mine .cardslot img { width:64px; height:83px; border-radius:5px; }
    .slots-theirs { order:6; min-height:42px; }
    .slots-theirs .cardslot img { width:28px; height:36px; border-radius:3px; }
    .cardslot:empty { display:none; }

    #chatwrap { display:none; position:fixed; left:0; right:0; bottom:0; top:auto; z-index:30;
      flex-direction:column; background:#f4f8e3; border-top:3px solid #aac32f;
      border-radius:14px 14px 0 0; box-shadow:0 -4px 18px #0000004d; max-height:46dvh; padding:8px; }
    body.chat-open #chatwrap { display:flex; }
    body.chat-open #m-chatbtn { background:#5b6f1d; }
    #chatwrap #bd-chatbox { position:static; flex:1; width:auto; height:auto; min-height:90px; overflow-y:auto; }
    #chatwrap #bd-input { position:static; width:100%; background:#fff; border:2px solid #c4d36a; border-radius:14px; height:34px; }
    #m-chatbtn { display:block; position:fixed; right:10px; bottom:12px; z-index:31; width:46px; height:46px;
      border-radius:50%; border:0; background:#75852A; font-size:20px; box-shadow:0 3px 9px #00000059; }

    #page #bd-banner { position:fixed; left:0; top:30dvh; width:100vw; height:48px;
      clip-path:polygon(26px 0, 100% 0, calc(100% - 26px) 100%, 0 100%); z-index:20; }
    #bd-banner span { font-size:22px; }
    #page #bd-end { position:fixed; left:50%; top:50%; width:min(92vw, 480px); min-height:0;
      transform:translate(-50%,-50%); padding:18px 16px 84px; z-index:25; }
    #bd-end .endtitle { font-size:22px; margin-bottom:18px; }
    #bd-end .endtext { font-size:15px; }

    #m-sheet-backdrop { position:fixed; inset:0; background:#00000066; z-index:40; }
    #m-sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; background:#f4f8e3;
      border-radius:16px 16px 0 0; box-shadow:0 -4px 18px #00000059; padding:14px;
      gap:12px; align-items:flex-start; }
    body.sheet-open #m-sheet { display:flex; }
    body.sheet-open #m-sheet-backdrop { display:block; }
    #m-sheet img { width:89px; height:115px; border-radius:6px; flex:0 0 auto; }
    #m-sheet .ms-body { flex:1; min-width:0; }
    #m-sheet .ms-name { font:bold 17px Verdana; color:#75812c; margin-bottom:6px; }
    #m-sheet .ms-desc { font-size:13px; color:#5b6f1d; line-height:1.5; min-height:40px; }
    #m-sheet .ms-actions { display:flex; gap:8px; margin-top:12px; }
    #m-sheet .ms-play { flex:1; font:bold 15px Verdana; color:#fff; background:#75852A; border:0; border-radius:9px; padding:11px; }
    #m-sheet .ms-close { font:bold 15px Verdana; color:#75852A; background:#fff; border:2px solid #c4d36a; border-radius:9px; padding:11px 14px; }
  }
</style>
</head>
<body>
  <div id="status">Connexion…</div>

  <div id="screen-connect" class="screen on"></div>

  <!-- Modes -->
  <div id="screen-mode" class="screen">
    <div class="mode-side">
      <div class="fc-logo"><i style="background:#f4554e"></i><i style="background:#8cc63f"></i><i></i><i></i><i style="background:#f5c518"></i><i style="background:#f4554e"></i></div>
      <div class="fc-name">FRUTICONNECT</div>
      <div class="fruits-duo"><img src="assets/page/orange.png" alt=""><img src="assets/page/banana.png" alt=""></div>
      <div class="bandas-v">FRUTIBANDAS</div>
    </div>
    <div class="mode-list">
      <div class="mode active" id="mode-champ" data-salle="champ"><div class="mname">CHAMPIONNAT</div><div class="mstats"><div class="j"><span>JOUEURS</span><span data-cpt="champ-j">0</span></div><div class="p"><span>PARTIES</span><span data-cpt="champ-p">0</span></div></div><div class="mnote" id="ma-note"></div></div>
      <div class="mode active" id="mode-amical" data-salle="amical"><div class="mname">MATCHES AMICAUX</div><div class="mstats"><div class="j"><span>JOUEURS</span><span data-cpt="amical-j">0</span></div><div class="p"><span>PARTIES</span><span data-cpt="amical-p">0</span></div></div></div>
      <div class="mode active" id="mode-chall" data-salle="chall"><div class="mname">CHALLENGE</div><div class="mstats"><div class="j"><span>JOUEURS</span><span data-cpt="chall-j" id="ch-j">0</span></div><div class="p"><span>PARTIES</span><span data-cpt="chall-p" id="ch-p">0</span></div></div></div>
    </div>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-window">
      <div class="lobby-bar">
        <span class="title" id="lobby-title">CHALLENGE</span>
        <span class="sp"></span>
        <button id="btn-tournoi" style="display:none">Tournoi</button>
        <button id="btn-create">Créer une partie</button>
        <span class="x" id="lobby-back" title="Retour">✕</span>
      </div>
      <!-- Le bandeau du tournoi : qui je dois jouer, et où il en est. Il
           n'apparaît qu'au Championnat, et seulement s'il y a un tournoi. -->
      <div id="tournoi-bandeau" style="display:none"></div>
      <div class="lobby-tabs">
        <button data-tab="players" class="on">Joueurs</button>
        <button data-tab="chat">Chat</button>
        <button data-tab="defis">Défis</button>
      </div>
      <div class="lobby-main">
        <div class="lpanel green collapsed" id="panel-defis">
          <div class="lp-strip" data-exp="defis" title="Déplier">»</div>
          <div class="lp-full">
            <div class="lp-head"><span class="lp-title" id="defis-title">Liste des défis</span><span class="lp-x" data-col="defis" title="Replier">✕</span></div>
            <div class="lp-body" id="defis-body"></div>
            <div class="lp-foot" id="defis-foot"></div>
          </div>
        </div>
        <div class="lpanel yellow" id="panel-chat">
          <div class="lp-strip" data-exp="chat" title="Déplier">»</div>
          <div class="lp-full">
            <div class="lp-head"><span class="lp-title">Chat</span><span class="lp-x" data-col="chat" title="Replier">✕</span></div>
            <div class="lp-body chat-log" id="lobby-chat"></div>
            <div class="lp-foot chat-input"><input id="lobby-say" placeholder="Écris un message…" maxlength="200"><button id="lobby-send">»</button></div>
          </div>
        </div>
        <div class="lpanel pink" id="panel-players">
          <div class="lp-strip" data-exp="players" title="Déplier">»</div>
          <div class="lp-full">
            <div class="lp-head"><span class="lp-title">liste des joueurs</span><span class="lp-x" data-col="players" title="Replier">✕</span></div>
            <div class="lp-body players-list" id="players"></div>
            <div class="lp-foot"><span class="arrow" data-col="players" title="Replier">»</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Partie : page 1050x728 (bureau) / pile verticale (mobile) -->
  <div id="screen-game" class="screen">
    <div id="page">
      <div class="bouille abs" id="pf0" style="left:23px;top:25px;width:125px;height:125px"></div>
      <div class="bouille abs" id="pf1" style="left:898px;top:25px;width:125px;height:125px"></div>
      <div class="pside abs" id="pside0" style="left:8px;top:155px;width:215px">
        <div class="pname" id="pname0"></div>
        <div class="pclock" id="pclock0">00:00</div>
      </div>
      <div class="pside abs" id="pside1" style="left:827px;top:155px;width:215px">
        <div class="pname" id="pname1"></div>
        <div class="pclock" id="pclock1">00:00</div>
      </div>
      <div class="pcountf abs" id="pcount0" style="left:160px;top:62px;width:60px;text-align:center"></div>
      <div class="pcountf abs" id="pcount1" style="left:815px;top:66px;width:60px;text-align:center"></div>
      <div class="pserie abs" id="pserie0" style="left:8px;top:128px;width:80px">★ 0</div>
      <div class="pserie abs" id="pserie1" style="left:962px;top:128px;width:80px">★ 0</div>

      <!-- Barre joueurs mobile (cachée sur bureau, remplie par gameview) -->
      <div id="m-bar">
        <div class="mchip" id="mchip0">
          <span class="msq" style="background:#e2421f"></span>
          <span class="mav" id="m-av0"></span>
          <span class="minfo">
            <span class="mname" id="m-name0"></span>
            <span class="mmeta"><img class="m-fruit" src="assets/page/orange.png" alt="oranges"><span id="m-count0"></span> · <span id="m-clock0">00:00</span> · <span class="mserie" id="m-serie0">★0</span></span>
          </span>
        </div>
        <div class="mchip" id="mchip1">
          <span class="msq" style="background:#3e9e16"></span>
          <span class="mav" id="m-av1"></span>
          <span class="minfo">
            <span class="mname" id="m-name1"></span>
            <span class="mmeta"><img class="m-fruit" src="assets/page/banana.png" alt="bananes"><span id="m-count1"></span> · <span id="m-clock1">00:00</span> · <span class="mserie" id="m-serie1">★0</span></span>
          </span>
        </div>
      </div>

      <canvas class="abs" id="bd-canvas" width="587" height="560" style="left:231px;top:0"></canvas>

      <!-- Bandeau d'aide mobile (visée d'une carte) -->
      <div id="m-hint"><span id="m-hint-txt"></span><button id="m-hint-cancel">Annuler</button></div>

      <!-- Croix directionnelle mobile + boutons -->
      <div id="m-dpad">
        <button class="pgbtn-css" id="m-sound">Son</button>
        <button class="mdir" data-d="3">◀</button>
        <button class="mdir" data-d="0">▲</button>
        <button class="mdir" data-d="2">▼</button>
        <button class="mdir" data-d="1">▶</button>
        <button class="pgbtn-css" id="m-giveup">Abandon</button>
      </div>

      <img class="abs barrow" id="arrow-up" src="assets/page/arrow_up.png" alt="">
      <img class="abs barrow" id="arrow-down" src="assets/page/arrow_down.png" alt="">
      <img class="abs barrow" id="arrow-left" src="assets/page/arrow_left.png" alt="">
      <img class="abs barrow" id="arrow-right" src="assets/page/arrow_right.png" alt="">
      <div class="abs" id="slots0"></div>
      <div class="abs" id="slots1"></div>
      <div id="chatwrap">
        <div class="abs" id="bd-chatbox"></div>
        <input class="abs" id="bd-input" placeholder="Discuter… (Entrée pour envoyer)" maxlength="200">
      </div>
      <button id="m-chatbtn" title="Chat">💬</button>
      <button class="abs pgbtn-css" id="btn-sound" style="left:14px;top:692px">Son</button>
      <button class="abs pgbtn-css" id="btn-giveup" style="left:947px;top:692px">Abandon</button>
      <!-- bannière d'annonce de carte : bande inclinée + nom français -->
      <div class="abs" id="bd-banner"><span id="bd-banner-txt"></span></div>
      <div class="abs" id="bd-info"></div>
      <!-- panneau de fin (style du jeu, textes d'origine en français) -->
      <div class="abs" id="bd-end">
        <div class="endtitle" id="bd-endtitle">Quitter la partie</div>
        <div class="endtext" id="bd-endtext"></div>
        <div class="endsub" id="bd-endsub"></div>
        <img class="okbtn" id="bd-ok" src="assets/common/ok.png" alt="OK">
      </div>

      <!-- Fiche carte mobile (bottom sheet) : infos + confirmation -->
      <div id="m-sheet-backdrop"></div>
      <div id="m-sheet">
        <img id="m-sheet-img" src="" alt="">
        <div class="ms-body">
          <div class="ms-name" id="m-sheet-name"></div>
          <div class="ms-desc" id="m-sheet-desc"></div>
          <div class="ms-actions">
            <button class="ms-play" id="m-sheet-play">Jouer</button>
            <button class="ms-close" id="m-sheet-close">Fermer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tournoi-vue"><div class="boite">
    <div class="tete"><span id="tournoi-titre">Tournoi</span><span class="x" id="tournoi-fermer" title="Fermer">✕</span></div>
    <div class="corps" id="tournoi-corps"></div>
  </div></div>

<!-- Le moteur de bouilles en JavaScript : les deux têtes du plateau (et les
     deux pastilles mobiles) étaient autant de lecteurs Flash. -->
<script src="/js/bouille-swf.js"></script>
<script src="/js/bouille-avm.js"></script>
<script src="/js/bouille-moteur.js"></script>
<script src="/js/bouille-vignette.js"></script>
<script src="engine.js"></script>
<script src="gameview.js"></script>
<script src="ui.js"></script>
<!-- Le disque sorti de la Frusion referme cette fenêtre (voir le fichier). -->
<script src="/js/eject-watch.js" data-jeu="bandas"></script>
</body>
</html>
