<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Frutiparc — Mobile</title>
<style>
  /* Frutiparc green palette — same family as forum / admin / Club. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #ADE76B;
    color: #2C4A0F;
    font-family: 'Verdana', Arial, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    /* Height is driven by JS from window.visualViewport (the area NOT covered by
       the mobile keyboard) via the --app-h custom property; the static values
       are fallbacks for browsers without visualViewport. overflow:hidden on
       html+body stops the whole page scrolling when the keyboard opens — only
       the #messages list scrolls. */
    height: 100vh;
    height: 100dvh;
    height: var(--app-h, 100dvh);
    overflow: hidden;
    position: fixed;
    left: 0; right: 0; top: 0;
  }
  a { color: #2f6b16; }
  button { font-family: inherit; cursor: pointer; }
  /* The post-login app area is white; only the central chat zone is green, so
     the header (top bar) and footer (composer) read as white, not green. */
  #app { background: #fff; }

  /* ── Single compact top bar ── */
  #topbar {
    background: #fff; border-bottom: 1px solid #DDDDDD;
    padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  /* Room selector: narrower now that it shares the bar with the three icon
     buttons (feutres / bouilles / liste). Verdana text in #D16767, rounded. */
  #topbar select {
    flex: 1 1 auto; min-width: 0; padding: 8px; font-size: 15px;
    border: 1px solid #f3b0b0; border-radius: 8px; background: #fff;
    color: #D16767; font-family: 'Verdana', Arial, sans-serif;
  }
  #topbar select option { color: #D16767; font-family: 'Verdana', Arial, sans-serif; }
  /* Brief asked for "alternance de #FEC9C9 et #FEC9C9" (same hex twice); we use a
     slightly lighter pink for the second band so the alternation is visible
     where the browser honours <option> colours (e.g. Android Chrome). */
  #topbar select option:nth-child(odd)  { background: #FEC9C9; }
  #topbar select option:nth-child(even) { background: #FFE4E4; }
  /* Buttons: pink (#FEABAB) with white glyphs/text (e.g. the hamburger ☰). */
  .icon-btn {
    background: #FEABAB; border: 0; border-radius: 7px;
    font-size: 17px; line-height: 1; padding: 7px 10px; color: #fff; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn img { width: 22px; height: 22px; display: block; object-fit: contain; }
  /* The three header icons (feutres / bouilles / liste) are shown as bare PNGs:
     no chip background or border, just the image. State lives on the image — a
     subtle lift when active, dimmed when the toggle is "off". */
  .icon-btn.bare { background: transparent; border: 0; padding: 3px; }
  .icon-btn.bare img { width: 28px; height: 28px; }
  .icon-btn.bare.on { transform: scale(1.08); filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .icon-btn.bare.off { opacity: .35; }
  #menu-btn { font-size: 18px; }

  /* ── Hamburger menu drawer ── */
  #menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 35; display: none; }
  #menu-backdrop.show { display: block; }
  #menu-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 74%; max-width: 290px; z-index: 36;
    background: #fff; border-right: 1px solid #DDDDDD; display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: 6px 0 18px rgba(44,74,15,.25);
  }
  #menu-drawer.open { transform: translateX(0); }
  /* Hamburger drawer in the same pink/white style: pink header (white text),
     white body with pink labels, grey #DDDDDD separators. */
  #menu-drawer .menu-head {
    background: #FEABAB; color: #fff; padding: 14px 16px; font-weight: bold;
    border-bottom: 1px solid #DDDDDD; display: flex; align-items: center; gap: 8px; font-size: 15px;
    text-shadow: 0 1px 1px rgba(196,80,64,.55);
  }
  #menu-drawer .menu-head .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0392b; display: inline-block; box-shadow: 0 0 0 1px #fff; }
  #menu-drawer .menu-head .dot.on { background: #2ecc40; }
  .menu-item {
    background: transparent; border: 0; border-bottom: 1px solid #DDDDDD;
    text-align: left; padding: 14px 16px; font-size: 15px; color: #D16767; font-weight: bold;
    display: flex; align-items: center; gap: 10px;
  }
  .menu-item.active { background: #FFE4E4; color: #D16767; }
  .menu-item.danger { color: #c05040; }
  /* All menu glyphs occupy the same 24px square box and are centered, so the
     favicon (16px), the forum ico (18px) and the inventory PNG (130px) all read
     as the same visual size regardless of their native dimensions. */
  .menu-item .menu-ico {
    width: 24px; height: 24px; object-fit: contain; flex-shrink: 0;
  }
  .menu-item .menu-ico-emoji {
    width: 24px; text-align: center; font-size: 19px; line-height: 24px; flex-shrink: 0;
  }
  .menu-spacer { flex: 1; }

  /* ── Bouille bottom sheet ── */
  #bouille-sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none;
  }
  #bouille-sheet-backdrop.show { display: block; }
  #bouille-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: #ffffff; border: 1px solid #6c6c6c;
    border-radius: 10px 10px 0 0; max-height: 76vh; display: flex; flex-direction: column;
    transform: translateY(110%); transition: transform .25s ease;
    box-shadow: 0 0 0 1px #DDDDDD, 0 -8px 24px rgba(44,74,15,.3);
  }
  #bouille-sheet.show { transform: translateY(0); }
  #bouille-sheet .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; font-weight: bold; color: #2C4A0F;
    border-bottom: 1px solid #DDDDDD;
  }
  #bouille-sheet .sheet-head button {
    background: transparent; border: 0; font-size: 18px; color: #2C4A0F;
  }
  /* Inventory body: a yellow card inset from the white sheet, framed by a
     yellow (#EAEA0E) border + a grey "sur-bordure". */
  #bouille-sheet .sheet-body {
    padding: 12px 14px; margin: 0 5px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #F8F866; border: 1px solid #EAEA0E; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD;
  }
  .sheet-preview { display: none; justify-content: center; margin-bottom: 10px; }
  #bouille-sheet-preview {
    width: 132px; height: 132px; background: #fff; border: 2px solid #DDDDDD;
    border-radius: 14px; overflow: hidden;
  }
  #bouille-sheet-preview iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .sheet-hint { font-size: 12px; color: #2f5510; margin-bottom: 8px; font-weight: bold; }
  /* Accessory grid: bouilles laid side by side on the yellow inventory card,
     with no per-item frame or background (cf. the boutique "Accessoires"). */
  .acc-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #F8F866; border-radius: 10px; padding: 0 10px 10px;
  }
  .acc-item {
    background: transparent; border: 0; border-radius: 8px;
    padding: 4px 2px; text-align: center; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .acc-item.sel .thumb { box-shadow: 0 0 0 2px #D16767; }
  .acc-item.sel .lbl { color: #D16767; }
  .acc-item .thumb {
    width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden;
    background: transparent; position: relative;
  }
  /* The Ruffle preview iframe must NOT eat the tap, otherwise the .acc-item
     click never fires and selection silently does nothing. pointer-events:none
     lets the tap fall through to the card. */
  .acc-item .thumb iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  /* Transparent overlay above the iframe guarantees the whole tile is tappable
     (belt-and-suspenders on browsers that still route touch to the iframe). */
  .acc-item .thumb::after { content: ""; position: absolute; inset: 0; }
  .acc-item .lbl {
    font-size: 10px; color: #2C4A0F; margin-top: 4px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Generic panel ── */
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }

  /* ── Login / accueil screen (inspired by the desktop home) ── */
  #login-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 22px 24px 28px; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #login-screen .lg-logo { width: 220px; max-width: 76%; height: auto; display: block; margin: 4px auto 2px; }
  #login-screen .card {
    background: #fff; border: 2px solid #2C4A0F; border-radius: 14px;
    padding: 18px 18px 20px; width: 100%; max-width: 340px;
    box-shadow: 0 10px 22px rgba(44,74,15,.22);
  }
  #login-screen .lg-fruits { display: block; margin: 0 auto 6px; max-width: 200px; max-height: 120px; width: auto; height: auto; object-fit: contain; }
  #login-screen .lg-intro {
    text-align: center; color: #2f5510; font-size: 12.5px; line-height: 1.45;
    font-weight: bold; margin: 0 0 12px;
  }
  label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; }
  label .opt { font-weight: normal; color: #8aa86a; font-size: 11px; }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; padding: 11px 10px; font-size: 16px;
    border: 1px solid #5a8a20; border-radius: 7px; background: #fbfff5; color: #2C4A0F;
  }
  .btn-primary {
    width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: bold;
    background: #2C4A0F; color: #CFF599; border: 0; border-radius: 8px;
  }
  .btn-primary:disabled { opacity: .6; }
  .btn-link {
    display: block; width: 100%; margin-top: 12px; padding: 8px; background: transparent;
    border: 0; color: #2f6b16; font-size: 13px; font-weight: bold; text-decoration: underline; cursor: pointer;
  }
  .err { color: #b23b2e; font-size: 12px; margin-top: 10px; text-align: center; min-height: 14px; }

  /* ── Chat ── */
  #chat-panel { }

  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; margin: 6px;
    background: #CCF599; -webkit-overflow-scrolling: touch;
    /* Inner green border + slight rounding, with a grey "sur-bordure" ring drawn
       just outside it (box-shadow follows the radius, unlike outline on old WebKit). */
    border: 1px solid #ADE76B; border-radius: 5px;
    box-shadow: 0 0 0 1px #DDDDDD;
  }
  /* Messages render as "[hh:mm:ss] pseudo : message" in Verdana, reusing the
     forum's post palette: dark-green author, slightly lighter green body. */
  .msg { margin: 3px 0; line-height: 1.4; word-wrap: break-word; font-family: 'Verdana', Arial, sans-serif; }
  .msg .time { color: #8aa770; font-size: 11px; margin-right: 4px; }
  .msg .from { font-weight: bold; color: #2C4A0F; }
  .msg .from.me { color: #E3756A; }
  .msg.system { color: #6b8a3f; font-style: italic; font-size: 12.5px; }
  .msg.admin { color: #b23b2e; }
  .msg .body { color: #335511; }
  .msg .body.emote { font-style: italic; color: #4f7b1f; }

  .compose {
    display: flex; gap: 7px; padding: 8px; background: #fff;
    border-top: 1px solid #DDDDDD; flex-shrink: 0;
  }
  .compose input {
    flex: 1; padding: 11px 12px; font-size: 16px; border: 1px solid #d9d9d9;
    border-radius: 20px; background: #fff; color: #2C4A0F;
  }
  .compose button {
    background: #FFAAAD; color: #660000; border: 1px solid #F48081; border-radius: 20px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 0 18px; font-size: 14px; font-weight: bold;
  }
  .compose button:disabled { opacity: .5; }

  /* Feutre swatch picker (horizontal scroll above the composer) */
  #pen-bar {
    display: none; gap: 7px; padding: 8px 10px; background: #fff;
    border-top: 1px solid #DDDDDD; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-shrink: 0; white-space: nowrap;
  }
  #pen-bar.show { display: flex; }
  .pen-swatch {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer;
  }
  .pen-swatch.sel { box-shadow: 0 0 0 2px #D16767; transform: scale(1.12); }
  .pen-swatch.none {
    background: #fff; color: #D16767; font-size: 14px; line-height: 26px;
    text-align: center; font-weight: bold;
  }

  /* Bouille reaction overlay — a live Ruffle bouille (vector = crisp), centered
     over the messages with NO card/background. It slides in from the left edge
     of the chat and slides back out to the left. pointer-events stay off so the
     chat underneath remains readable/scrollable. */
  #bouille-overlay {
    position: absolute; left: 0; top: 0; right: 0; bottom: 56px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; overflow: hidden;
  }
  #bouille-overlay-stage {
    width: 200px; height: 200px; max-width: 56vw; max-height: 56vw;
    /* Start fully off the left edge; .show brings it to center. */
    transform: translateX(-130vw);
    opacity: 0;
    transition: transform .5s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
    will-change: transform, opacity;
  }
  #bouille-overlay.show #bouille-overlay-stage { transform: translateX(0); opacity: 1; }
  #bouille-overlay.leaving #bouille-overlay-stage { transform: translateX(-130vw); opacity: 0; }
  #bouille-overlay-stage iframe {
    width: 100%; height: 100%; border: 0; background: transparent; display: block;
  }
  /* Small floating caption so you still know who reacts, but unobtrusive. */
  #bouille-overlay-name {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; font-weight: bold; color: #2C4A0F;
    background: rgba(255,255,255,.82); border: 1px solid #5a8a20;
    border-radius: 10px; padding: 2px 9px; max-width: 78vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .3s ease;
  }
  #bouille-overlay.show #bouille-overlay-name { opacity: 1; }

  /* User list drawer */
  #users-drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 72%; max-width: 280px;
    background: #fff; border-left: 1px solid #DDDDDD; z-index: 30;
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column; box-shadow: -6px 0 18px rgba(44,74,15,.25);
  }
  #users-drawer.open { transform: translateX(0); }
  #users-drawer h3 { margin: 0; padding: 12px 14px; background: #fff; color: #D16767; font-size: 14px; border-bottom: 1px solid #DDDDDD; }
  /* Connected-users list styled after the "score panel" mockup: a light-green
     card (soft green border, rounded top, inner white highlight + green glow)
     encapsulated in the white drawer; rows alternate two greens with big bold
     Verdana pseudos in deep indigo. */
  #users-drawer .list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin: 0 10px; padding: 0;
    background: #e8f8d1; border: 4px solid #bff18d; border-radius: 24px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.45), 0 0 4px rgba(126,220,80,.45);
  }
  /* Pink scroll buttons (bouton_up.png) above AND below the list, same width as
     the list. Tap to nudge, press-and-hold to keep scrolling; the art is
     symmetric so the same image serves the top and the bottom. */
  .users-scroll {
    flex-shrink: 0; display: block; width: auto; margin: 6px 10px;
    padding: 0; border: 0; background: transparent; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .users-scroll.up { margin-top: 10px; }
  .users-scroll.down { margin-bottom: 10px; }
  .users-scroll img { width: 100%; height: 30px; display: block; object-fit: fill; }
  .users-scroll:active img { filter: brightness(.95); }
  #users-drawer .u {
    min-height: 48px; padding: 6px 12px; background: #e8f8d1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #242169; font-family: 'Verdana', Arial, sans-serif; font-weight: 900;
    font-size: 22px; line-height: 1; letter-spacing: -.7px;
    text-shadow: 0 1px 0 rgba(255,255,255,.25);
  }
  #users-drawer .u:nth-child(odd) { background: #d6f7b5; }
  #users-drawer .u > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #users-drawer .u .badge {
    font-size: 10px; font-weight: bold; background: #242169; color: #fff;
    border-radius: 8px; padding: 1px 6px; letter-spacing: 0; text-shadow: none; flex-shrink: 0;
  }
  #drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 25; display: none; }
  #drawer-backdrop.show { display: block; }

  /* ── Forum panel ── */
  #forum-panel { align-items: center; justify-content: center; padding: 28px; text-align: center; gap: 14px; }
  #forum-panel .big {
    font-size: 16px; max-width: 300px; line-height: 1.5; color: #2f5510;
  }
  #forum-panel a.forum-link {
    display: inline-block; background: #2C4A0F; color: #CFF599; text-decoration: none;
    padding: 14px 22px; border-radius: 10px; font-weight: bold; font-size: 15px;
    box-shadow: 0 8px 18px rgba(44,74,15,.22);
  }

  .hidden { display: none !important; }
  .banner {
    background: #fff3cd; color: #7a5b00; border-bottom: 1px solid #e0c97a;
    font-size: 12px; padding: 7px 10px; text-align: center; flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- ───────── Login ───────── -->
<div id="login-screen">
  <img class="lg-logo" src="https://raw.githubusercontent.com/Spender94/Frutiparc/main/public/images/logo.gif" alt="Frutiparc" onerror="this.style.display='none'">
  <div class="card">
    <img class="lg-fruits" src="https://raw.githubusercontent.com/Spender94/Frutiparc/main/public/images/welcome.gif" alt="" onerror="this.style.display='none'">
    <div class="lg-intro">Des fruits, des jeux, du chat !<br>Rejoins l'univers fruité de Frutiparc.</div>

    <!-- Connexion -->
    <form id="login-form" autocomplete="on">
      <label for="li-user">Pseudo</label>
      <input type="text" id="li-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="li-pass">Code secret</label>
      <input type="password" id="li-pass" autocomplete="current-password">
      <button type="submit" class="btn-primary" id="li-btn">Se connecter</button>
      <div class="err" id="li-err"></div>
    </form>
    <button type="button" class="btn-link" id="show-register">S'inscrire gratuitement</button>

    <!-- Inscription (dès la page d'accueil) -->
    <form id="register-form" class="hidden" autocomplete="on">
      <label for="re-user">Pseudo</label>
      <input type="text" id="re-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" minlength="3" maxlength="20">
      <label for="re-pass">Code secret</label>
      <input type="password" id="re-pass" autocomplete="new-password" minlength="6" maxlength="80">
      <label for="re-email">E-mail <span class="opt">— pour récupérer ton code</span></label>
      <input type="email" id="re-email" autocomplete="email" maxlength="120" placeholder="(facultatif)">
      <button type="submit" class="btn-primary" id="re-btn">Créer mon compte</button>
      <div class="err" id="re-err"></div>
    </form>
    <button type="button" class="btn-link hidden" id="show-login">← J'ai déjà un compte</button>
  </div>
</div>

<!-- ───────── App (after login) ───────── -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <!-- Single compact top bar: hamburger · room selector · members.
       Everything else (account, navigation, quitter) lives in the menu drawer
       to keep vertical space for the conversation. -->
  <header id="topbar">
    <button class="icon-btn" id="menu-btn" title="Menu" aria-label="Menu">☰</button>
    <select id="room-select" aria-label="Salon"></select>
    <button class="icon-btn bare" id="pen-btn" title="Feutre" aria-label="Feutre">
      <img src="/fb/icone_feutres.png" alt="Feutre">
    </button>
    <button class="icon-btn bare" id="bouille-toggle" title="Masquer les bouilles" aria-label="Afficher ou masquer les bouilles" aria-pressed="true">
      <img src="/fb/icone_bouille.png" alt="Bouilles">
    </button>
    <button class="icon-btn bare" id="users-btn" title="Afficher / masquer les connectés" aria-label="Liste des connectés">
      <img src="/fb/icone_liste.png" alt="Connectés">
    </button>
  </header>

  <!-- Slide-in menu drawer (hamburger) -->
  <div id="menu-backdrop"></div>
  <nav id="menu-drawer">
    <div class="menu-head">
      <span class="dot" id="conn-dot"></span>
      <span id="who-name">—</span>
    </div>
    <button class="menu-item active" data-tab="chat">
      <img class="menu-ico" src="/fb/icone_salon.png" alt="" onerror="this.replaceWith(document.createTextNode('💬'))"> Salons
    </button>
    <button class="menu-item" data-tab="forum">
      <img class="menu-ico" src="/fb/icone_forum.png" alt="" onerror="this.replaceWith(document.createTextNode('📋'))"> Forum
    </button>
    <button class="menu-item" id="bouille-btn">
      <img class="menu-ico" src="/fb/inventaire.png" alt="" onerror="this.replaceWith(document.createTextNode('🎒'))"> Mon inventaire
    </button>
  </nav>

  <!-- Chat -->
  <section class="panel active" id="chat-panel" style="position:relative">
    <div id="messages"></div>

    <!-- Bouille overlay: live Ruffle bouille (transparent) reacting to chat,
         centered over the messages, sliding in/out from the left. -->
    <div id="bouille-overlay">
      <div id="bouille-overlay-stage"></div>
      <div id="bouille-overlay-name"></div>
    </div>

    <!-- Feutre (pen) swatch picker, toggled by the feutres icon in the header -->
    <div id="pen-bar"></div>

    <form class="compose" id="compose-form">
      <input type="text" id="compose-input" placeholder="Message…" autocomplete="off" maxlength="300" disabled>
      <button type="submit" id="compose-send" disabled>Envoyer</button>
    </form>

    <div id="drawer-backdrop"></div>
    <div id="users-drawer">
      <h3>Connectés <span id="drawer-count"></span></h3>
      <button class="users-scroll up" id="users-scroll-up" aria-label="Faire défiler vers le haut"><img src="/fb/bouton_up.png" alt=""></button>
      <div class="list" id="users-list"></div>
      <button class="users-scroll down" id="users-scroll-down" aria-label="Faire défiler vers le bas"><img src="/fb/bouton_up.png" alt=""></button>
    </div>
  </section>

  <!-- Forum -->
  <section class="panel" id="forum-panel">
    <div class="big">Le forum complet s'ouvre dans une page dédiée, adaptée au mobile.</div>
    <a class="forum-link" id="forum-link" href="#">Ouvrir le forum →</a>
  </section>

  <!-- Bouille / accessory picker (bottom sheet) -->
  <div id="bouille-sheet-backdrop"></div>
  <div id="bouille-sheet">
    <div class="sheet-head">
      <span>Ma bouille</span>
      <button id="bouille-sheet-close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-preview"><div id="bouille-sheet-preview"></div></div>
      <div class="sheet-hint" id="bouille-sheet-hint">Choisis un accessoire de ton inventaire :</div>
      <div id="bouille-acc-grid" class="acc-grid"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function $(s) { return document.querySelector(s); }
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  // Public salons (mirror server-side `channels`). bienvenue first as default.
  var ROOMS = [
    ["bienvenue", "Bienvenue"], ["pomme", "Pomme"], ["abricot", "Abricot"],
    ["poire", "Poire"], ["fraise", "Fraise"], ["citron", "Citron"],
    ["kiwi", "Kiwi"], ["raisin", "Raisin"], ["orange", "Orange"],
    ["cerise", "Cerise"], ["banane", "Banane"],
  ];
  var ROOM_LABELS = {};
  ROOMS.forEach(function (r) { ROOM_LABELS[r[0]] = r[1]; });
  // Display name for a room id; falls back to a capitalised id (e.g. private
  // "pm_a_b" rooms) so a raw id never shows in the UI.
  function roomLabel(id) {
    if (ROOM_LABELS[id]) return ROOM_LABELS[id];
    var s = String(id || "");
    if (s.indexOf("pm_") === 0 || s.indexOf("pm2_") === 0) return "Discussion privée";
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  var state = {
    sid: "",
    user: "",          // display name
    userLower: "",
    room: "",
    ws: null,
    connected: false,
    reconnectTimer: null,
    intentionalClose: false,
    usersByRoom: {},   // room -> Set of display names
    bouilleByUser: {}, // lowercased pseudo -> bouille state string "f"
    overlayTimer: null,
    pen: "",           // selected feutre index ("" = default colour)
    roomCounts: {},    // room id -> participant count (from channellist <q>)
    bouillesEnabled: true, // show the bouille reaction overlay (off = "light" mode)
  };

  var DEFAULT_BOUILLE = "000000010000000000000000";

  // (Re)build the room <option>s, appending the live participant count as
  // "Pomme (3)". A count of 0 shows no parenthesis. Preserves the current
  // selection. Called on startApp and whenever a channellist <q> arrives.
  function renderRoomOptions() {
    var sel = document.getElementById("room-select");
    if (!sel) return;
    var current = sel.value || (state && state.room) || ROOMS[0][0];
    sel.innerHTML = "";
    ROOMS.forEach(function (r) {
      var n = state.roomCounts[r[0]] || 0;
      var o = document.createElement("option");
      o.value = r[0];
      o.textContent = r[1] + (n > 0 ? " (" + n + ")" : "");
      sel.appendChild(o);
    });
    sel.value = current;
  }

  // ── XML helpers (CBee protocol) ──
  // For ATTRIBUTES (sid, room, pseudo): full escaping, incl. & and ".
  function xmlEscape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // For the message BODY: the server's parser reads element content literally
  // with /([^<]*)</ — it does NOT unescape entities and TRUNCATES at the first
  // "<". So a literal "<" can't survive (the Flash client has the same limit),
  // and pre-escaping to "&lt;" would be double-escaped on rebroadcast and shown
  // as the raw entity. We therefore map "<"/">" to the look-alike guillemets
  // ‹ › (not XML-special, visually near-identical). A literal "&" is safe: the
  // server re-escapes it to "&amp;" and our xmlUnescape restores it.
  function bodyEscape(s) {
    return String(s == null ? "" : s).replace(/</g, "‹").replace(/>/g, "›");
  }
  function xmlUnescape(s) {
    return String(s == null ? "" : s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'").replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  }
  function attr(xml, name) {
    var m = xml.match(new RegExp("\\b" + name + '="([^"]*)"'));
    return m ? m[1] : "";
  }
  function tagName(xml) {
    var m = xml.match(/^<(\w+)/);
    return m ? m[1] : "";
  }
  function bodyOf(xml) {
    // text between the first '>' and the matching '</'
    var m = xml.match(/^<[^>]*>([\s\S]*)<\/[^>]+>$/);
    return m ? m[1] : "";
  }

  // ── Login ──
  // ── Session persistence (survive F5 / rotation reloads) ──
  // The sid is the only thing needed to resume; we keep it in localStorage and
  // re-validate it on load via /api/forum/me (returns {user} if still valid).
  var SESS_KEY = "fp_light_session";
  function saveSession() {
    try { localStorage.setItem(SESS_KEY, JSON.stringify({ sid: state.sid, user: state.user })); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESS_KEY); } catch (e) {}
  }
  function tryResumeSession(cb) {
    // Prefer a sid already on state (set from ?sid= in the URL), else the one
    // saved in localStorage.
    var sid = state.sid;
    if (!sid) {
      var raw; try { raw = localStorage.getItem(SESS_KEY); } catch (e) { raw = null; }
      if (raw) { try { sid = (JSON.parse(raw) || {}).sid; } catch (e) {} }
    }
    if (!sid) { cb(false); return; }
    // Validate the sid server-side before skipping the login screen.
    fetch("/api/forum/me?sid=" + encodeURIComponent(sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.user) {
          state.sid = sid;
          state.user = d.user;
          state.userLower = String(d.user).toLowerCase();
          saveSession();
          startApp();
          cb(true);
        } else {
          clearSession();
          state.sid = "";
          cb(false);
        }
      })
      .catch(function () { cb(false); });
  }

  // Shared login: POST credentials then resume the app. Reused by the login
  // form AND by the registration flow (auto-login right after sign-up).
  function doLogin(user, pass, opts) {
    opts = opts || {};
    var errEl = opts.errEl, btn = opts.btn, label = opts.label || "Se connecter";
    if (errEl) errEl.textContent = "";
    if (!user || !pass) { if (errEl) errEl.textContent = "Pseudo et code secret requis."; return; }
    if (btn) { btn.disabled = true; btn.textContent = "Connexion…"; }
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (!res.ok || !res.d || !res.d.ok) {
          if (errEl) errEl.textContent = (res.d && res.d.message) || "Identifiants invalides.";
          return;
        }
        state.sid = res.d.sid;
        state.user = res.d.username || user;
        state.userLower = String(state.user).toLowerCase();
        saveSession();
        startApp();
      })
      .catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (errEl) errEl.textContent = "Erreur réseau. Réessaie.";
      });
  }

  var loginForm = $("#login-form");
  loginForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    doLogin($("#li-user").value.trim(), $("#li-pass").value, { errEl: $("#li-err"), btn: $("#li-btn"), label: "Se connecter" });
  });

  // ── Inscription depuis la page d'accueil ──
  var registerForm = $("#register-form");
  function setAuthMode(register) {
    loginForm.classList.toggle("hidden", register);
    $("#show-register").classList.toggle("hidden", register);
    registerForm.classList.toggle("hidden", !register);
    $("#show-login").classList.toggle("hidden", !register);
    $("#li-err").textContent = ""; $("#re-err").textContent = "";
  }
  $("#show-register").addEventListener("click", function () { setAuthMode(true); var u = $("#re-user"); if (u) u.focus(); });
  $("#show-login").addEventListener("click", function () { setAuthMode(false); var u = $("#li-user"); if (u) u.focus(); });
  registerForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var user = $("#re-user").value.trim();
    var pass = $("#re-pass").value;
    var email = $("#re-email").value.trim();
    var errEl = $("#re-err"); errEl.textContent = "";
    if (!user || !pass) { errEl.textContent = "Pseudo et code secret requis."; return; }
    var btn = $("#re-btn"); btn.disabled = true; btn.textContent = "Création…";
    var body = { username: user, password: pass };
    if (email) body.email = email;
    fetch("/api/auth/register", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d || !res.d.ok) {
          btn.disabled = false; btn.textContent = "Créer mon compte";
          errEl.textContent = (res.d && res.d.message) || "Inscription impossible.";
          return;
        }
        // Compte créé → on connecte directement avec les mêmes identifiants.
        doLogin(user, pass, { errEl: errEl, btn: btn, label: "Créer mon compte" });
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = "Créer mon compte";
        errEl.textContent = "Erreur réseau. Réessaie.";
      });
  });

  // ── App start ──
  function startApp() {
    $("#login-screen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    $("#who-name").textContent = state.user;
    $("#forum-link").href = "/fb/?sid=" + encodeURIComponent(state.sid) + "&from=light";

    // Build room selector (labels get a "(n)" participant count, see
    // renderRoomOptions / the channellist handler).
    renderRoomOptions();
    var sel = $("#room-select");
    sel.value = ROOMS[0][0];
    sel.addEventListener("change", function () { switchRoom(sel.value); });

    connectWs();
  }

  // ── Hamburger menu drawer ──
  function openMenu(open) {
    $("#menu-drawer").classList.toggle("open", open);
    $("#menu-backdrop").classList.toggle("show", open);
  }
  $("#menu-btn").addEventListener("click", function () { openMenu(true); });
  $("#menu-backdrop").addEventListener("click", function () { openMenu(false); });

  // ── Navigation (menu items with data-tab) ──
  Array.prototype.forEach.call(document.querySelectorAll(".menu-item[data-tab]"), function (b) {
    b.addEventListener("click", function () {
      var tab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll(".menu-item[data-tab]"), function (x) {
        x.classList.toggle("active", x === b);
      });
      $("#chat-panel").classList.toggle("active", tab === "chat");
      $("#forum-panel").classList.toggle("active", tab === "forum");
      openMenu(false);
    });
  });

  // ── Logout ── (the "Quitter" menu item was removed from the light client.)

  // ── WebSocket (CBee bridge at "/") ──
  function wsUrl() {
    var proto = window.location.protocol === "https:" ? "wss" : "ws";
    return proto + "://" + window.location.host + "/";
  }
  function setConnected(on) {
    state.connected = on;
    $("#conn-dot").classList.toggle("on", on);
    $("#compose-input").disabled = !on;
    $("#compose-send").disabled = !on;
  }
  function connectWs() {
    var ws;
    try { ws = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
    state.ws = ws;
    ws.onopen = function () {
      // Identify with our session, then join the default room.
      wsSend('<k l="' + xmlEscape(state.user) + '" s="' + xmlEscape(state.sid) + '" />');
    };
    ws.onmessage = function (ev) { onWsData(ev.data); };
    ws.onclose = function () {
      setConnected(false);
      if (!state.intentionalClose) { systemLine("Connexion perdue. Reconnexion…"); scheduleReconnect(); }
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function scheduleReconnect() {
    if (state.reconnectTimer) return;
    state.reconnectTimer = setTimeout(function () {
      state.reconnectTimer = null;
      connectWs();
    }, 2500);
  }
  function wsSend(xml) {
    try { if (state.ws && state.ws.readyState === 1) state.ws.send(xml); } catch (e) {}
  }

  // Ask the server for the public room list (participant counts). Cheap; we
  // poll it so the "(n)" stays roughly live without per-event chatter.
  function requestChannelList() { wsSend("<q />"); }
  var channelListTimer = null;
  function startChannelListPolling() {
    if (channelListTimer) return;
    channelListTimer = setInterval(function () {
      if (state.connected) requestChannelList();
    }, 15000);
  }

  // Incoming data may contain several \0-delimited frames.
  var rxBuffer = "";
  function onWsData(data) {
    if (typeof data !== "string") {
      // Blob/ArrayBuffer → decode then re-handle.
      if (data instanceof Blob) { data.text().then(onWsData); return; }
      try { data = new TextDecoder("utf-8").decode(data); } catch (e) { return; }
    }
    rxBuffer += data;
    var parts = rxBuffer.split("\0");
    rxBuffer = parts.pop();
    for (var i = 0; i < parts.length; i++) {
      var frame = parts[i].trim();
      if (frame) handleFrame(frame);
    }
  }

  function handleFrame(xml) {
    var tag = tagName(xml);
    switch (tag) {
      case "k": // ident response
        if (attr(xml, "k") === "401") { systemLine("Connexion refusée (session expirée)."); return; }
        setConnected(true);
        // ident OK → join the current/default room, then ask for the room list
        // (participant counts) and refresh it periodically.
        switchRoom($("#room-select").value || ROOMS[0][0]);
        requestChannelList();
        startChannelListPolling();
        break;

      case "o": // join confirmed: <o g="room" p="">...</o>
        // nothing extra; userlist follows
        break;

      case "q": { // channellist: <q><g g="pomme" n="3">…</g>…</q>
        var gre = /<g\b([^>]*)>/g, gm, changed = false;
        while ((gm = gre.exec(xml)) !== null) {
          var gattr = "<g " + gm[1] + ">";
          var gid = attr(gattr, "g");
          var gn = parseInt(attr(gattr, "n"), 10);
          if (gid) { state.roomCounts[gid] = Number.isFinite(gn) ? gn : 0; changed = true; }
        }
        if (changed) renderRoomOptions();
        break;
      }

      case "p": { // userlist for a room
        var room = attr(xml, "g");
        if (!room) break;
        var set = {};
        var re = /<u\b([^>]*)\/>/g, mm;
        var inner = xml.replace(/^<p[^>]*>/, "").replace(/<\/p>$/, "");
        while ((mm = re.exec(inner)) !== null) {
          var frag = "<u " + mm[1] + "/>";
          var uname = attr(frag, "u");
          if (uname) { set[uname] = true; rememberBouille(uname, attr(frag, "f")); }
        }
        state.usersByRoom[room] = set;
        if (room === state.room) renderUsers();
        break;
      }

      case "z": { // trace push: <z><u u=".." f="<bouille>" .../></z> — bouille data
        var zre = /<u\b([^>]*)\/>/g, zm;
        while ((zm = zre.exec(xml)) !== null) {
          var zf = "<u " + zm[1] + "/>";
          rememberBouille(attr(zf, "u"), attr(zf, "f"));
        }
        break;
      }

      case "v": { // userjoined: <v u="..." f="<bouille>" g="room" />
        var rj = attr(xml, "g"); var uj = attr(xml, "u");
        if (rj && uj) {
          rememberBouille(uj, attr(xml, "f"));
          if (!state.usersByRoom[rj]) state.usersByRoom[rj] = {};
          state.usersByRoom[rj][uj] = true;
          if (rj === state.room) { renderUsers(); systemLine(uj + " a rejoint le salon."); }
        }
        break;
      }

      case "u": { // userleaved: <u u="..." g="room" />
        var rl = attr(xml, "g"); var ul = attr(xml, "u");
        if (rl && state.usersByRoom[rl]) {
          delete state.usersByRoom[rl][ul];
          if (rl === state.room) { renderUsers(); systemLine(ul + " a quitté le salon."); }
        }
        break;
      }

      case "t": { // chat message: <t u="from" t="m" h="[hh:mm:ss] " ...>body</t>
        var from = attr(xml, "u");
        var ty = attr(xml, "t") || "m";
        var h = attr(xml, "h");
        var body = bodyOf(xml);
        // Image/gift frames carry a child node; show a placeholder rather than raw XML.
        if (ty === "i" || ty === "g" || /^</.test(body.trim())) {
          addMessage({ from: from, time: h, body: ty === "i" ? "[image]" : "[cadeau]", kind: "system" });
          break;
        }
        // Emote frame: the body is a bare bouille-anim index (e.g. "3" = mdr),
        // exactly how the desktop transmits an emote. Render the italic action
        // + the matching bouille animation — identical on both clients —
        // instead of showing the raw number. (Index 1 = "parle" is the plain
        // speak animation, not an emote, so it falls through to normal text.)
        var emoteIdx = body.trim();
        var emoteAnim = /^[0-9]+$/.test(emoteIdx) ? ANIM_BY_INDEX[emoteIdx] : null;
        if (emoteAnim && emoteAnim !== "parle") {
          addMessage({
            from: from, time: h,
            body: ANIM_LABEL[emoteAnim] || emoteAnim,
            kind: (from === "admin") ? "admin" : "normal", emote: true, pen: null,
          });
          if (from && from !== "admin") showBouilleOverlay(from, emoteAnim);
          break;
        }
        var text = xmlUnescape(body);
        var kind = (from === "admin") ? "admin" : "normal";
        var em = detectEmote(text);
        var penColor = penColorFor(attr(xml, "p"));
        // When the line is a recognised emote, display the action in italics
        // ("kasparov : éclate de rire") instead of the raw text, while still
        // animating the bouille. Otherwise show the message normally.
        addMessage({
          from: from, time: h,
          body: em.isEmote ? em.label : text,
          kind: kind, emote: em.isEmote, pen: em.isEmote ? null : penColor,
        });
        // Bouille overlay: show the speaker's avatar reacting to what they wrote.
        if (from && from !== "admin") showBouilleOverlay(from, em.anim);
        break;
      }

      case "an": { // topic change — show as a system line
        var t = bodyOf(xml);
        if (t) systemLine("Sujet : " + xmlUnescape(t));
        break;
      }

      case "bb": // onmute: <bb u=".." mu=".." />
        systemLine("Tu as été réduit au silence (totoché).");
        break;

      case "ah": { // onban: kicked/banned from a room
        var by = attr(xml, "by");
        systemLine("Tu as été exclu du salon" + (by ? " par " + by : "") + ".");
        // server removed us; refresh room membership
        break;
      }

      case "a": { // error: <a k="403" />
        var code = attr(xml, "k");
        if (code === "403") systemLine("Accès refusé (tu es peut-être banni de ce salon).");
        break;
      }

      default:
        // ping (e), trace (z), and others — ignore for the light client.
        break;
    }
  }

  // ── Room switching ──
  function switchRoom(room) {
    if (!room) return;
    if (state.room && state.room !== room) {
      wsSend('<y g="' + xmlEscape(state.room) + '" />'); // part previous
    }
    state.room = room;
    $("#room-select").value = room;
    clearMessages();
    systemLine("— Salon " + roomLabel(room) + " —");
    wsSend('<o g="' + xmlEscape(room) + '" />'); // join
    renderUsers();
  }

  // ── Messages UI ──
  var msgEl = $("#messages");
  function nearBottom() {
    return (msgEl.scrollHeight - msgEl.scrollTop - msgEl.clientHeight) < 60;
  }
  function scrollDown() { msgEl.scrollTop = msgEl.scrollHeight; }
  function clearMessages() { msgEl.innerHTML = ""; }
  function cleanTime(h) {
    // server sends "[hh:mm:ss] " — show the full "[hh:mm:ss]" form so a line
    // reads "[14:03:27] pseudo : message". Falls back to "[hh:mm]" if seconds
    // are missing.
    var m = String(h || "").match(/(\d{2}):(\d{2}):(\d{2})/);
    if (m) return "[" + m[1] + ":" + m[2] + ":" + m[3] + "]";
    var m2 = String(h || "").match(/(\d{2}):(\d{2})/);
    return m2 ? "[" + m2[1] + ":" + m2[2] + "]" : "";
  }
  function addMessage(o) {
    var stick = nearBottom();
    var row = el("div", "msg" + (o.kind === "system" ? " system" : o.kind === "admin" ? " admin" : ""));
    if (o.kind === "system") {
      row.textContent = o.body;
    } else {
      // A feutre colour (o.pen) tints the WHOLE line — "[hh:mm:ss] pseudo :
      // message" — not just the body. The pseudo stays bold (.from in CSS).
      var t = cleanTime(o.time);
      if (t) { var ts = el("span", "time"); ts.textContent = t; if (o.pen) ts.style.color = o.pen; row.appendChild(ts); }
      var fr = el("span", "from" + (String(o.from).toLowerCase() === state.userLower ? " me" : ""));
      fr.textContent = (o.from || "?") + " : ";
      if (o.pen) fr.style.color = o.pen;
      row.appendChild(fr);
      var bd = el("span", o.emote ? "body emote" : "body");
      if (o.pen) bd.style.color = o.pen;     // feutre colour
      bd.textContent = o.body;
      row.appendChild(bd);
    }
    msgEl.appendChild(row);
    // Cap DOM size for long sessions.
    while (msgEl.childNodes.length > 400) msgEl.removeChild(msgEl.firstChild);
    if (stick) scrollDown();
  }
  function systemLine(text) { addMessage({ kind: "system", body: text }); }

  // ── Compose ──
  $("#compose-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var inp = $("#compose-input");
    var text = inp.value;
    if (!text.trim() || !state.connected || !state.room) return;
    // Emotes ("mdr", "lol", ":p"…) are sent as a bare bouille-anim index — the
    // same wire form the desktop uses — so BOTH clients show the action + the
    // bouille animation (desktop no longer just sees the raw "mdr" text).
    // Everything else is a normal message (body via bodyEscape).
    var em = detectEmote(text);
    if (em.isEmote && ANIM_INDEX[em.anim]) {
      wsSend('<t g="' + xmlEscape(state.room) + '" t="m" p="">' + ANIM_INDEX[em.anim] + "</t>");
    } else {
      wsSend('<t g="' + xmlEscape(state.room) + '" t="m" p="' + xmlEscape(state.pen) + '">' + bodyEscape(text) + "</t>");
    }
    inp.value = "";
    inp.focus();
  });

  // ── Users drawer ──
  function renderUsers() {
    var set = state.usersByRoom[state.room] || {};
    var names = Object.keys(set).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    $("#drawer-count").textContent = "(" + names.length + ")";
    // Keep the selector's "(n)" for the current room fresh between polls.
    if (state.room) {
      var prev = state.roomCounts[state.room];
      state.roomCounts[state.room] = names.length;
      if (prev !== names.length) renderRoomOptions();
    }
    var list = $("#users-list");
    list.innerHTML = "";
    names.forEach(function (n) {
      var u = el("div", "u");
      var nm = el("span"); nm.textContent = n;
      u.appendChild(nm);
      if (n.toLowerCase() === state.userLower) {
        var b = el("span", "badge"); b.textContent = "toi"; u.appendChild(b);
      }
      list.appendChild(u);
    });
  }
  function openDrawer(open) {
    $("#users-drawer").classList.toggle("open", open);
    $("#drawer-backdrop").classList.toggle("show", open);
    $("#users-btn").classList.toggle("on", open);
  }
  // The "liste" icon toggles the connected-users drawer open/closed.
  $("#users-btn").addEventListener("click", function () {
    openDrawer(!$("#users-drawer").classList.contains("open"));
  });
  $("#drawer-backdrop").addEventListener("click", function () { openDrawer(false); });

  // Pink scroll buttons (top/bottom of the connected list): tap to nudge,
  // press-and-hold to keep scrolling.
  (function () {
    var list = $("#users-list");
    function bind(btn, dir) {
      if (!btn || !list) return;
      var timer = null;
      function step() { list.scrollTop += dir * 48; }
      function stop() { if (timer) { clearInterval(timer); timer = null; } }
      function start(ev) { ev.preventDefault(); step(); stop(); timer = setInterval(step, 90); }
      btn.addEventListener("mousedown", start);
      btn.addEventListener("touchstart", start, { passive: false });
      ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(function (e) { btn.addEventListener(e, stop); });
    }
    bind($("#users-scroll-up"), -1);
    bind($("#users-scroll-down"), 1);
  })();

  // ── Bouille display toggle (header) ──────────────────────────────────────
  // Some users want a very "light" experience with no bouille animations popping
  // over the chat. The icon toggles them on/off; the choice persists across loads
  // (localStorage). When turned off we also hide any overlay already on screen.
  var BOUILLE_PREF_KEY = "fp_light_bouilles";
  function applyBouillePref() {
    var btn = $("#bouille-toggle");
    if (btn) {
      btn.classList.toggle("off", !state.bouillesEnabled);
      btn.setAttribute("aria-pressed", state.bouillesEnabled ? "true" : "false");
      btn.title = state.bouillesEnabled ? "Masquer les bouilles" : "Afficher les bouilles";
    }
    if (!state.bouillesEnabled) hideBouilleOverlay();
  }
  try { if (localStorage.getItem(BOUILLE_PREF_KEY) === "0") state.bouillesEnabled = false; } catch (e) {}
  $("#bouille-toggle").addEventListener("click", function () {
    state.bouillesEnabled = !state.bouillesEnabled;
    try { localStorage.setItem(BOUILLE_PREF_KEY, state.bouillesEnabled ? "1" : "0"); } catch (e) {}
    applyBouillePref();
  });
  applyBouillePref();

  // ── Bouille overlay ──────────────────────────────────────────────────────
  // Remember each speaker's bouille state (carried by <p>/<v>/<z> frames), so
  // when they talk we can render the right avatar.
  function rememberBouille(pseudo, f) {
    if (!pseudo || !f) return;
    var clean = String(f).replace(/[^0-9A-Za-z]/g, "");
    if (clean.length >= 4) state.bouilleByUser[String(pseudo).toLowerCase()] = clean;
  }

  // Map a chat line to a bouille animation + a French label. Returns
  // { anim, label, isEmote }. isEmote is true for a reaction (rire, mdr, …) and
  // false for plain talking ("parle") — only reactions are shown in italics in
  // the chat ("kasparov : éclate de rire") while the bouille animates.
  var EMOTE_LABEL = {
    rire: "rigole", mdr: "éclate de rire", pleurer: "pleure",
    langue: "tire la langue", miam: "se régale", question: "s'interroge",
    rougir: "rougit", sifflote: "siffle", gum: "fait un chewing-gum",
  };
  function detectEmote(text) {
    var t = " " + String(text || "").toLowerCase() + " ";
    var anim = "parle";
    if (/\bm+d+r+\b|\bptdr\b|\blmao\b|\brofl\b|😂|🤣/.test(t)) anim = "mdr";
    else if (/\bl+o+l+\b|\bha+ha+\b|\bhe+he+\b|\beheh\b|😄|😁|😆|\bxd\b/.test(t)) anim = "rire";
    else if (/\bsnif\b|\bpleure?\b|\btriste\b|😢|😭|💧/.test(t)) anim = "pleurer";
    else if (/:p\b|:-p\b|😛|😜|🤪|\bnananère?\b/.test(t)) anim = "langue";
    else if (/\bmiam\b|\bmmh+\b|\bgloup\b|🤤|🍕|🍔|🍰/.test(t)) anim = "miam";
    else if (/\?\s*$|\bhein\b|\bquoi\b|\bpourquoi\b|❓|🤔/.test(t)) anim = "question";
    else if (/\brougi[rs]?\b|\bgêné?e?\b|\btimide\b|😳|☺️|🥰|❤️|<3/.test(t)) anim = "rougir";
    else if (/\bsiffl|🎵|🎶/.test(t)) anim = "sifflote";
    else if (/\bgum\b|\bchewing\b|\bbubble\b/.test(t)) anim = "gum";
    // Replace the chat text with the italic action ONLY when the message is
    // essentially just the trigger (e.g. "lol", "mdr", ":p", "miam !") — short
    // and made mostly of the emote token. A real sentence that happens to match
    // (e.g. "tu fais quoi demain ?") keeps its text; the bouille still animates.
    var compact = String(text || "").trim();
    var pure = anim !== "parle" && (compact.length <= 12 || /^[\s!?.…,;:)(-]*$/.test(
      compact.toLowerCase()
        .replace(/m+d+r+|ptdr|lmao|rofl|l+o+l+|ha+ha+|he+he+|eheh|xd|snif|pleure?|triste|miam|mmh+|gloup|hein|quoi|pourquoi|rougi[rs]?|gêné?e?|timide|siffl\w*|chewing[- ]?gum|gum|bubble|nananère?/g, "")
        .replace(/[:;x][-]?[pdo3)(]/g, "")
        .replace(/[😂🤣😄😁😆😢😭💧😛😜🤪🤤🍕🍔🍰❓🤔😳☺🥰❤🎵🎶]/gu, "")
    ));
    return { anim: anim, label: EMOTE_LABEL[anim] || null, isEmote: !!(pure && EMOTE_LABEL[anim]) };
  }

  // ── Feutres (chat pens) ──────────────────────────────────────────────────
  // The chat protocol carries a pen index in the message's p= attribute. By
  // default every user owns all 17 boutique feutres (indices 0..16). The label
  // order matches public/ft/pack-pen / the boutique FEUTRE list. Colours are the
  // standard "ISO" feutre palette; tweak FEUTRES if a shade needs to match the
  // Flash client exactly.
  var FEUTRES = [
    { i: 0,  name: "Orange",            color: "#E8732A" },
    { i: 1,  name: "Bleu",              color: "#2A6FE8" },
    { i: 2,  name: "Vert foncé",        color: "#1E6B2E" },
    { i: 3,  name: "Bordeaux",          color: "#8C1F2F" },
    { i: 4,  name: "Rose",              color: "#E84A9C" },
    { i: 5,  name: "Jaune",             color: "#E8C81E" },
    { i: 6,  name: "Vert clair",        color: "#6FBF3B" },
    { i: 7,  name: "Cyan",              color: "#1FA8C0" },
    { i: 8,  name: "Bleu foncé",        color: "#1E2F8C" },
    { i: 9,  name: "Marron",            color: "#8C5A2B" },
    { i: 10, name: "Marron foncé",      color: "#5A3A1E" },
    { i: 11, name: "Vert kaki",         color: "#7A7A3A" },
    { i: 12, name: "Bleu pétrole",      color: "#2A7A8C" },
    { i: 13, name: "Vert",              color: "#2E8C3A" },
    { i: 14, name: "Bleu pétrole foncé",color: "#1E4A55" },
    { i: 15, name: "Orange foncé",      color: "#B85518" },
    { i: 16, name: "Violet",            color: "#7A2AB8" },
  ];
  var FEUTRE_BY_INDEX = {};
  FEUTRES.forEach(function (f) { FEUTRE_BY_INDEX[f.i] = f.color; });
  // The user's currently selected pen index (default 0 = none/black-ish orange).
  // null = no pen (default site colour).
  function penColorFor(p) {
    var n = parseInt(p, 10);
    if (!Number.isFinite(n)) return null;
    return FEUTRE_BY_INDEX[n] || null;
  }

  // Build the feutre swatch row once (a "none" chip + the 17 colours). Tapping a
  // swatch sets state.pen and tints the composer text so the choice is obvious.
  function buildPenBar() {
    var bar = $("#pen-bar");
    if (!bar || bar.childNodes.length) return;
    var none = el("div", "pen-swatch none" + (state.pen === "" ? " sel" : ""));
    none.textContent = "✕"; none.title = "Aucun feutre";
    none.addEventListener("click", function () { selectPen(""); });
    bar.appendChild(none);
    FEUTRES.forEach(function (f) {
      var sw = el("div", "pen-swatch" + (String(state.pen) === String(f.i) ? " sel" : ""));
      sw.style.background = f.color; sw.title = f.name;
      sw.setAttribute("data-pen", f.i);
      sw.addEventListener("click", function () { selectPen(String(f.i)); });
      bar.appendChild(sw);
    });
  }
  function selectPen(idx) {
    state.pen = idx;
    Array.prototype.forEach.call(document.querySelectorAll("#pen-bar .pen-swatch"), function (sw) {
      var v = sw.getAttribute("data-pen");
      sw.classList.toggle("sel", (idx === "" && sw.classList.contains("none")) || (v != null && v === idx));
    });
    // Tint the input so you see your current feutre while typing.
    var inp = $("#compose-input");
    if (inp) inp.style.color = penColorFor(idx) || "#2C4A0F";
  }
  $("#pen-btn").addEventListener("click", function () {
    buildPenBar();
    var bar = $("#pen-bar");
    var open = bar.classList.toggle("show");
    this.classList.toggle("on", open);
    if (open && nearBottom()) scrollDown();
  });

  // anim id → playAnim index expected by bouille-preview.html (?anim=<index>).
  var ANIM_INDEX = { parle:1, rire:2, mdr:3, langue:4, rougir:5, regard:6,
    sifflote:7, gum:8, question:9, miam:10, pleurer:11 };
  var ANIM_LABEL = { parle:"parle", rire:"rigole", mdr:"éclate de rire",
    pleurer:"pleure", langue:"tire la langue", miam:"se régale",
    question:"s'interroge", rougir:"rougit", sifflote:"siffle",
    gum:"fait un chewing-gum", regard:"regarde" };
  // Reverse map (anim index -> name) for rendering emotes that travel as a bare
  // bouille-anim index in the chat body (the desktop's wire form).
  var ANIM_BY_INDEX = {};
  Object.keys(ANIM_INDEX).forEach(function (a) { ANIM_BY_INDEX[ANIM_INDEX[a]] = a; });

  // Live-Ruffle overlay: instead of a captured GIF (latency + raster pixelation)
  // we embed bouille-preview.html in a transparent iframe — Ruffle renders the
  // bouille as VECTORS (crisp at any size) and plays the animation directly,
  // exactly like the forum avatars. The iframe slides in from the left, holds,
  // then slides back out to the left.
  //
  // We keep ONE iframe and just reload its src per reaction; reusing it avoids a
  // fresh Ruffle/WASM boot on every message after the first.
  var overlayFrame = null;
  function overlayIframe() {
    if (overlayFrame) return overlayFrame;
    overlayFrame = document.createElement("iframe");
    overlayFrame.setAttribute("scrolling", "no");
    overlayFrame.setAttribute("aria-hidden", "true");
    // allow-scripts so Ruffle runs; allow-same-origin so it can fetch the SWF.
    overlayFrame.setAttribute("sandbox", "allow-scripts allow-same-origin");
    $("#bouille-overlay-stage").appendChild(overlayFrame);
    return overlayFrame;
  }
  function overlayUrl(pseudo, anim) {
    var f = state.bouilleByUser[String(pseudo).toLowerCase()] || DEFAULT_BOUILLE;
    var idx = ANIM_INDEX[anim] || 1; // default = parle
    return "/bouille-preview.html?s=" + encodeURIComponent(f)
      + "&e=0&anim=" + idx + "&bg=transparent";
  }

  var OVERLAY_HOLD_MS = 4200;
  function showBouilleOverlay(pseudo, anim) {
    if (!state.bouillesEnabled) return; // "light" mode: no bouille animations
    var box = $("#bouille-overlay");
    if (!box) return;
    var name = $("#bouille-overlay-name");
    name.textContent = pseudo + " " + (ANIM_LABEL[anim] || "parle");

    var frame = overlayIframe();
    // Reload the bouille (force even if the URL is identical, so a repeated emote
    // replays the animation from the start).
    var url = overlayUrl(pseudo, anim);
    frame.src = "about:blank";
    // next tick → real src, so the browser registers a navigation/replay.
    setTimeout(function () { frame.src = url; }, 20);

    box.classList.remove("leaving");
    // Force reflow so removing .show→adding works as a fresh slide-in even when
    // a previous overlay is still on screen.
    void box.offsetWidth;
    box.classList.add("show");

    if (state.overlayTimer) clearTimeout(state.overlayTimer);
    state.overlayTimer = setTimeout(hideBouilleOverlay, OVERLAY_HOLD_MS);
  }
  function hideBouilleOverlay() {
    var box = $("#bouille-overlay");
    if (!box) return;
    // Trigger the slide-out, then fully hide so the iframe stops compositing.
    box.classList.add("leaving");
    box.classList.remove("show");
    setTimeout(function () {
      box.classList.remove("leaving");
      if (overlayFrame) overlayFrame.src = "about:blank"; // stop Ruffle when idle
    }, 520);
  }

  // ── Bouille / accessory picker ───────────────────────────────────────────
  // Lets the user pick an accessory from their inventory (same model as the
  // forum): a bouille is 24 base62 chars; a normal accessory swaps the last 9
  // ("suffix") onto the user's base, while an "incarnation" (full value, family
  // ≥ 2) replaces the whole bouille. We persist the choice via /do/eb so it
  // sticks and everyone (incl. the reaction overlay) sees the new look.
  var myBase = DEFAULT_BOUILLE;           // the user's own bouille (family 00/01)
  var accList = [];                       // [{name, suffix, fullState?}]
  var accSel = { suffix: "000000000", fullState: null };

  function isIncarnation(v) {
    return typeof v === "string" && v.length === 24
      && v.substring(0, 2) !== "00" && v.substring(0, 2) !== "01";
  }
  function buildState(base, suffix9, fullState) {
    if (fullState) return String(fullState);
    var s = String(base || DEFAULT_BOUILLE); while (s.length < 24) s += "0";
    return s.substring(0, 15) + (suffix9 || s.substring(15, 24));
  }
  function previewIframe(state) {
    var s = String(state || DEFAULT_BOUILLE).replace(/[^0-9A-Za-z]/g, "");
    return '<iframe scrolling="no" sandbox="allow-scripts allow-same-origin" src="/bouille-preview.html?s='
      + encodeURIComponent(s) + '&bg=transparent"></iframe>';
  }

  function openBouilleSheet() {
    openMenu(false); // close the hamburger if it was open
    var bd = $("#bouille-sheet-backdrop"), sheet = $("#bouille-sheet");
    bd.classList.add("show"); sheet.classList.add("show");
    loadAccessories();
  }
  function closeBouilleSheet() {
    $("#bouille-sheet-backdrop").classList.remove("show");
    $("#bouille-sheet").classList.remove("show");
  }
  $("#bouille-btn").addEventListener("click", openBouilleSheet);
  $("#bouille-sheet-close").addEventListener("click", closeBouilleSheet);
  $("#bouille-sheet-backdrop").addEventListener("click", closeBouilleSheet);

  function loadAccessories() {
    fetch("/api/forum/me?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.bouille) {
          // Keep the user's BASE (own family) so suffix swaps work; if their
          // saved bouille is an incarnation we still expose it as the current.
          if (!isIncarnation(d.bouille)) myBase = d.bouille;
          state.bouilleByUser[state.userLower] = d.bouille;
        }
        accList = [];
        var seen = {};
        // Defaults (Normal, Bananocle, …) — suffix-only.
        (d && d.defaultAccessories || []).forEach(function (def) {
          var sfx = def.suffix || "000000000";
          if (seen[sfx]) return; seen[sfx] = true;
          accList.push({ name: def.name, suffix: sfx, fullState: null });
        });
        if (!seen["000000000"]) accList.unshift({ name: "Normal", suffix: "000000000", fullState: null });
        // Owned accessories (value = full 24-char bouille).
        (d && d.accessories || []).forEach(function (a) {
          if (!a.value || a.value.length !== 24) return;
          if (isIncarnation(a.value)) {
            var k = "inc:" + a.value;
            if (!seen[k]) { seen[k] = true; accList.push({ name: a.name, suffix: a.value.substring(15, 24), fullState: a.value }); }
          } else {
            var sfx2 = a.value.substring(15, 24);
            if (!seen[sfx2]) { seen[sfx2] = true; accList.push({ name: a.name, suffix: sfx2, fullState: null }); }
          }
        });
        // Mark the current selection from the saved bouille.
        var cur = state.bouilleByUser[state.userLower] || DEFAULT_BOUILLE;
        if (isIncarnation(cur)) accSel = { suffix: cur.substring(15, 24), fullState: cur };
        else accSel = { suffix: cur.substring(15, 24), fullState: null };
        renderAccGrid();
        updateSheetPreview();
      })
      .catch(function () {
        $("#bouille-acc-grid").innerHTML = '<div class="sheet-hint">Inventaire indisponible.</div>';
      });
  }

  function isAccSelected(ac) {
    return ac.fullState ? (ac.fullState === accSel.fullState)
                        : (!accSel.fullState && ac.suffix === accSel.suffix);
  }
  function renderAccGrid() {
    var grid = $("#bouille-acc-grid");
    grid.innerHTML = "";
    accList.forEach(function (ac, i) {
      var st = ac.fullState ? ac.fullState : buildState(myBase, ac.suffix, null);
      var item = el("div", "acc-item" + (isAccSelected(ac) ? " sel" : ""));
      item.innerHTML = '<div class="thumb">' + previewIframe(st) + '</div><div class="lbl">' + (ac.name || "Accessoire") + '</div>';
      item.addEventListener("click", function () { pickAccessory(i); });
      grid.appendChild(item);
    });
  }
  function updateSheetPreview() {
    var st = buildState(myBase, accSel.suffix, accSel.fullState);
    $("#bouille-sheet-preview").innerHTML = previewIframe(st);
  }
  function pickAccessory(i) {
    var ac = accList[i]; if (!ac) return;
    accSel = { suffix: ac.suffix, fullState: ac.fullState || null };
    var newState = buildState(myBase, accSel.suffix, accSel.fullState);
    // Update locally first so the UI reacts instantly.
    state.bouilleByUser[state.userLower] = newState;
    renderAccGrid();
    updateSheetPreview();
    var hint = $("#bouille-sheet-hint");
    if (hint) { hint.textContent = "✓ " + (ac.name || "Accessoire") + " appliqué !"; }
    // Persist over the open WebSocket via the fbouille command — the server
    // saves it AND broadcasts a trace so peers see the new bouille live. Falls
    // back to the HTTP editor endpoint if the socket isn't ready.
    if (state.ws && state.ws.readyState === 1) {
      wsSend('<ae f="' + xmlEscape(newState) + '" />');
    } else {
      fetch("/do/eb?sid=" + encodeURIComponent(state.sid) + "&b=" + encodeURIComponent(newState), { cache: "no-store" })
        .catch(function () {});
    }
  }

  // ── Mobile keyboard handling ─────────────────────────────────────────────
  // When the on-screen keyboard opens, the browser shrinks the "visual
  // viewport" (and often scrolls the whole page so the focused input is
  // visible, pushing the header/messages off-screen). We instead size the app
  // to window.visualViewport.height and pin it to the visible region, so the
  // header stays put, the messages list keeps the input just above the
  // keyboard, and nothing scrolls off the top. Falls back gracefully where
  // visualViewport is unavailable.
  var vv = window.visualViewport || null;
  function applyViewport() {
    var h = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight);
    document.documentElement.style.setProperty("--app-h", h + "px");
    // Pin the fixed body to the top of the visual viewport (handles the case
    // where the browser offsets the layout viewport under the keyboard).
    document.body.style.transform = vv ? ("translateY(" + Math.round(vv.offsetTop) + "px)") : "";
    // Keep the latest messages in view above the keyboard.
    if (nearBottom()) scrollDown();
  }
  if (vv) {
    vv.addEventListener("resize", applyViewport);
    vv.addEventListener("scroll", applyViewport);
  }
  window.addEventListener("resize", applyViewport);
  window.addEventListener("orientationchange", function () { setTimeout(applyViewport, 200); });
  applyViewport();

  // When the input gains focus (keyboard opening), snap to the bottom shortly
  // after so the composer + last messages sit right above the keyboard.
  (function () {
    var inp = document.getElementById("compose-input");
    if (inp) inp.addEventListener("focus", function () {
      setTimeout(function () { applyViewport(); scrollDown(); }, 300);
    });
  })();

  // On load, silently resume a stored session (so an F5 / rotation reload goes
  // straight back into the chat instead of asking to log in again). Also accept
  // a ?sid=… in the URL as a resume hint (e.g. arriving from another page).
  (function () {
    var urlSid = new URLSearchParams(window.location.search).get("sid");
    if (urlSid) {
      state.sid = urlSid; saveSession();
    }
    tryResumeSession(function (resumed) {
      if (!resumed) {
        var u = $("#li-user"); if (u) u.focus();
      }
    });
  })();
})();
</script>
</body>
</html>
