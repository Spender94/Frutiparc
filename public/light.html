<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Frutiparc — Mobile</title>
<style>
  /* Frutiparc green palette — same family as forum / admin / Club. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #ADE76B;
    color: #2C4A0F;
    font-family: 'Verdana', Arial, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    /* Height is driven by JS from window.visualViewport (the area NOT covered by
       the mobile keyboard) via the --app-h custom property; the static values
       are fallbacks for browsers without visualViewport. overflow:hidden on
       html+body stops the whole page scrolling when the keyboard opens — only
       the #messages list scrolls. */
    height: 100vh;
    height: 100dvh;
    height: var(--app-h, 100dvh);
    overflow: hidden;
    position: fixed;
    left: 0; right: 0; top: 0;
  }
  a { color: #2f6b16; }
  button { font-family: inherit; cursor: pointer; }
  /* The post-login app area is white; only the central chat zone is green, so
     the header (top bar) and footer (composer) read as white, not green. */
  #app { background: #fff; position: relative; }

  /* ── Single compact top bar ── */
  #topbar {
    background: #fff; border-bottom: 1px solid #DDDDDD;
    padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  /* Room selector: narrower now that it shares the bar with the three icon
     buttons (feutres / bouilles / liste). Verdana text in #D16767, rounded. */
  #topbar select {
    flex: 1 1 auto; min-width: 0; padding: 8px; font-size: 15px;
    border: 1px solid #f3b0b0; border-radius: 8px; background: #fff;
    color: #D16767; font-family: 'Verdana', Arial, sans-serif;
  }
  #topbar select option { color: #D16767; font-family: 'Verdana', Arial, sans-serif; }
  /* Brief asked for "alternance de #FEC9C9 et #FEC9C9" (same hex twice); we use a
     slightly lighter pink for the second band so the alternation is visible
     where the browser honours <option> colours (e.g. Android Chrome). */
  #topbar select option:nth-child(odd)  { background: #FEC9C9; }
  #topbar select option:nth-child(even) { background: #FFE4E4; }
  /* Buttons: pink (#FEABAB) with white glyphs/text (e.g. the hamburger ☰). */
  .icon-btn {
    background: #FEABAB; border: 0; border-radius: 7px;
    font-size: 17px; line-height: 1; padding: 7px 10px; color: #fff; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn img { width: 22px; height: 22px; display: block; object-fit: contain; }
  /* The three header icons (feutres / bouilles / liste) are shown as bare PNGs:
     no chip background or border, just the image. State lives on the image — a
     subtle lift when active, dimmed when the toggle is "off". */
  .icon-btn.bare { background: transparent; border: 0; padding: 3px; }
  .icon-btn.bare img { width: 40px; height: 40px; }
  .icon-btn.bare.on { transform: scale(1.08); filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .icon-btn.bare.off { opacity: .35; }
  #menu-btn { font-size: 18px; }

  /* (L'ancien tiroir hamburger #menu-drawer a été remplacé par le launcher
     plein écran #home-panel — voir la section « Accueil mobile » plus bas.) */

  /* ── Bottom sheets (inventaire + Mes disques partagent ce châssis) ── */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none;
  }
  .sheet-backdrop.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: #ffffff; border: 1px solid #6c6c6c;
    border-radius: 10px 10px 0 0; max-height: 76vh; display: flex; flex-direction: column;
    transform: translateY(110%); transition: transform .25s ease;
    box-shadow: 0 0 0 1px #DDDDDD, 0 -8px 24px rgba(44,74,15,.3);
  }
  .sheet.show { transform: translateY(0); }
  .sheet .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; font-weight: bold; color: #2C4A0F;
    border-bottom: 1px solid #DDDDDD;
  }
  .sheet .sheet-head button {
    background: transparent; border: 0; font-size: 18px; color: #2C4A0F;
  }
  /* Inventory body: a yellow card inset from the white sheet, framed by a
     yellow (#EAEA0E) border + a grey "sur-bordure". */
  .sheet .sheet-body {
    padding: 12px 14px; margin: 0 5px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #F8F866; border: 1px solid #EAEA0E; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD;
  }
  .sheet-preview { display: none; justify-content: center; margin-bottom: 10px; }
  #bouille-sheet-preview {
    width: 132px; height: 132px; background: #fff; border: 2px solid #DDDDDD;
    border-radius: 14px; overflow: hidden;
  }
  #bouille-sheet-preview iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .sheet-hint { font-size: 12px; color: #2f5510; margin-bottom: 8px; font-weight: bold; }
  /* Accessory grid: bouilles laid side by side on the yellow inventory card,
     with no per-item frame or background (cf. the boutique "Accessoires"). */
  .acc-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #F8F866; border-radius: 10px; padding: 0 10px 10px;
  }
  .acc-item {
    background: transparent; border: 0; border-radius: 8px;
    padding: 4px 2px; text-align: center; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .acc-item.sel .thumb { box-shadow: 0 0 0 2px #D16767; }
  .acc-item.sel .lbl { color: #D16767; }
  .acc-item .thumb {
    width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden;
    background: transparent; position: relative;
  }
  /* The Ruffle preview iframe must NOT eat the tap, otherwise the .acc-item
     click never fires and selection silently does nothing. pointer-events:none
     lets the tap fall through to the card. */
  .acc-item .thumb iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  /* Transparent overlay above the iframe guarantees the whole tile is tappable
     (belt-and-suspenders on browsers that still route touch to the iframe). */
  .acc-item .thumb::after { content: ""; position: absolute; inset: 0; }
  .acc-item .lbl {
    font-size: 10px; color: #2C4A0F; margin-top: 4px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Mes disques: same yellow inventory card as the accessory grid, but each tile
     is a static FrusionDisc PNG that launches its game on tap. */
  .fd-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    background: #F8F866; border-radius: 10px; padding: 6px 10px 12px;
  }
  .fd-item {
    background: transparent; border: 0; padding: 4px 2px; text-align: center;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  /* Disque réduit à 70 % de la cellule (−30 %), centré. */
  .fd-item .thumb {
    width: 70%; margin: 0 auto; aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
  }
  .fd-item .thumb img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(44,74,15,.4));
    transition: transform .1s ease;
  }
  .fd-item:active .thumb img { transform: scale(.92); }
  .fd-item .lbl {
    font-size: 11px; color: #2C4A0F; margin-top: 5px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Boutique ── solde kikooz + cartes d'accessoires (aperçu, prix, achat) */
  .shop-wallet {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; color: #6b4a00; font-weight: bold; margin-bottom: 10px;
    background: #FFF3B0; border: 1px solid #EAD93A; border-radius: 8px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 9px 12px;
  }
  .shop-wallet strong { color: #2C4A0F; font-size: 16px; }
  .shop-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    background: #F8F866; border-radius: 10px; padding: 6px 10px 12px;
  }
  .shop-item {
    background: #fff; border: 1px solid #EAD93A; border-radius: 8px;
    padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .shop-item .thumb {
    width: 86px; height: 86px; border-radius: 8px; overflow: hidden;
    background: #fff; border: 1px solid #EEE; position: relative;
  }
  .shop-item .thumb iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  .shop-name {
    font-size: 12px; font-weight: bold; color: #2C4A0F; text-align: center;
    line-height: 1.2; min-height: 28px; display: flex; align-items: center;
  }
  .shop-price { font-size: 12px; font-weight: bold; color: #b06a00; }
  .shop-buy {
    width: 100%; padding: 7px 0; border: 1px solid #F48081; border-radius: 8px;
    background: #FFAAAD; color: #660000; font-weight: bold; font-size: 13px;
    box-shadow: 0 0 0 1px #DDDDDD; cursor: pointer;
  }
  .shop-buy:active { background: #ff9699; }
  .shop-buy:disabled { opacity: .9; cursor: default; }
  .shop-buy.owned {
    background: #D6F7B5; border-color: #ADE76B; color: #2f6b16; box-shadow: none;
  }
  #shop-hint.ok { color: #2f6b16; }
  #shop-hint.err { color: #b23b2e; }

  /* ── "Ma Frutibouille" : éditeur de visage (auto-affiché si needsBouille) ──
     Look calqué sur l'editbouille de main.swf : cadre arrondi vert clair,
     onglet-titre, preview, lignes yeux/iris/cheveux/bouche + barres couleur
     encadrées de flèches roses, bouton "valider". Modal non fermable : le
     joueur doit valider (= mirror du forçage côté Flash). */
  #fb-editor-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
    display: none; z-index: 60;
  }
  #fb-editor-backdrop.show { display: block; }
  #fb-editor {
    position: fixed; z-index: 61; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.96);
    width: min(92vw, 320px); box-sizing: border-box;
    /* Sur petit écran, le contenu scrolle dans le cadre — le bouton
       « valider » reste toujours atteignable. */
    max-height: 92vh; max-height: 92dvh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff; border: 2px solid #aacf86; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    padding: 12px 14px 18px; display: none; opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
    font-family: Verdana, Geneva, sans-serif;
  }
  #fb-editor.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .fb-titletab {
    display: inline-flex; align-items: center; gap: 6px;
    color: #2f8f86; font-weight: bold; font-size: 13px; margin: 0 0 8px 2px;
  }
  .fb-titletab img { width: 18px; height: 18px; display: block; }
  .fb-preview {
    width: 132px; height: 132px; margin: 2px auto 6px; border-radius: 14px;
    overflow: hidden; background: #cfe6a3; border: 1px solid #aacf86;
  }
  .fb-preview iframe { width: 100%; height: 100%; border: 0; display: block; }
  .fb-rows { display: flex; flex-direction: column; gap: 9px; margin: 8px 2px 14px; }
  .fb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  /* Flèches = icônes fournies (normal + pressed au tap), au lieu des boutons CSS. */
  .fb-arrow {
    flex: 0 0 auto; width: 46px; height: 40px; padding: 0; border: 0; cursor: pointer;
    background: transparent no-repeat center / contain;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .fb-arrow.lft { background-image: url('/fb/icone_fleche_gauche.png'); }
  .fb-arrow.rgt { background-image: url('/fb/icone_fleche_droite.png'); }
  .fb-arrow.lft:active { background-image: url('/fb/icone_gauche_pressed.png'); }
  .fb-arrow.rgt:active { background-image: url('/fb/icone_fleche_droite_pressed.png'); }
  .fb-label { flex: 1 1 auto; text-align: center; color: #7b7b7b; font-size: 14px; }
  /* Barre couleur (peau / cheveux) : montre la vraie couleur ; ◄ ► font défiler. */
  .fb-bar { flex: 1 1 auto; height: 22px; border-radius: 9px; border: 1px solid rgba(0, 0, 0, .18); cursor: default; }
  .fb-valider {
    display: block; margin: 2px auto 0; padding: 7px 32px;
    border: 1px solid #e29b9b; border-radius: 16px; background: #f3a9a9;
    color: #b5455f; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .fb-valider:active { background: #ec9a9a; }

  /* ── Generic panel ── */
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }

  /* ── Login / accueil screen (inspired by the desktop home) ── */
  #login-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 22px 24px 28px; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #login-screen .lg-logo { width: 220px; max-width: 76%; height: auto; display: block; margin: 4px auto 2px; }
  #login-screen .card {
    background: #fff; border: 2px solid #2C4A0F; border-radius: 14px;
    padding: 18px 18px 20px; width: 100%; max-width: 340px;
    box-shadow: 0 10px 22px rgba(44,74,15,.22);
  }
  #login-screen .lg-fruits { display: block; margin: 0 auto 6px; max-width: 200px; max-height: 120px; width: auto; height: auto; object-fit: contain; }
  #login-screen .lg-intro {
    text-align: center; color: #2f5510; font-size: 12.5px; line-height: 1.45;
    font-weight: bold; margin: 0 0 12px;
  }
  label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; }
  label .opt { font-weight: normal; color: #8aa86a; font-size: 11px; }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; padding: 11px 10px; font-size: 16px;
    border: 1px solid #5a8a20; border-radius: 7px; background: #fbfff5; color: #2C4A0F;
  }
  .btn-primary {
    width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: bold;
    background: #2C4A0F; color: #CFF599; border: 0; border-radius: 8px;
  }
  .btn-primary:disabled { opacity: .6; }
  .btn-link {
    display: block; width: 100%; margin-top: 12px; padding: 8px; background: transparent;
    border: 0; color: #2f6b16; font-size: 13px; font-weight: bold; text-decoration: underline; cursor: pointer;
  }
  .err { color: #b23b2e; font-size: 12px; margin-top: 10px; text-align: center; min-height: 14px; }

  /* ── Chat ── */
  #chat-panel { }

  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; margin: 6px;
    background: #CCF599; -webkit-overflow-scrolling: touch;
    /* Inner green border + slight rounding, with a grey "sur-bordure" ring drawn
       just outside it (box-shadow follows the radius, unlike outline on old WebKit). */
    border: 1px solid #ADE76B; border-radius: 5px;
    box-shadow: 0 0 0 1px #DDDDDD;
  }
  /* Messages render as "[hh:mm:ss] pseudo : message" in Verdana, reusing the
     forum's post palette: dark-green author, slightly lighter green body. */
  .msg { margin: 3px 0; line-height: 1.4; word-wrap: break-word; font-family: 'Verdana', Arial, sans-serif; }
  .msg .time { color: #8aa770; font-size: 11px; margin-right: 4px; }
  .msg .from { font-weight: bold; color: #2C4A0F; }
  .msg .from.me { color: #E3756A; }
  .msg.system { color: #6b8a3f; font-style: italic; font-size: 12.5px; }
  /* Lien d'action dans une ligne système (« Lui écrire un courrier »). */
  .sys-lien {
    border: 0; background: transparent; padding: 0; font: inherit; font-style: italic;
    color: #3C7A0F; font-weight: bold; text-decoration: underline; cursor: pointer;
  }
  .msg.admin { color: #b23b2e; }
  .msg .body { color: #335511; }
  /* Cri modérateur ("!texte") — rouge vif gras, comme le desktop (#C10000). */
  .msg.shout, .msg.shout .body, .msg.shout .from, .msg.shout .time { color: #C10000; font-weight: bold; }
  /* Ligne animateur / mode bleu (t="c") — bleu gras, comme le desktop. */
  .msg.blue, .msg.blue .body, .msg.blue .from, .msg.blue .from.me, .msg.blue .time { color: #1A5FD0; font-weight: bold; }
  /* Emote line ("pseudo éclate de rire") — the whole row is italic, like desktop. */
  .msg.emote { font-style: italic; color: #4f7b1f; }
  .msg.emote .from { color: #4f7b1f; }
  .msg.emote .from.me { color: #E3756A; }
  .msg .body.emote { font-style: italic; color: #4f7b1f; }
  /* Quiz / "/image" pictures: shown INLINE in the chat body on mobile (the
     desktop SWF opens them in a separate window instead). */
  .msg.img-msg .img-wrap { margin-top: 4px; }
  .msg.img-msg .chat-img {
    display: block; max-width: 100%; height: auto;
    border-radius: 8px; border: 1px solid rgba(44,74,15,0.25); background: #fff;
  }
  .msg.img-msg .img-fail { font-size: 12px; color: #6b8a3f; font-style: italic; }

  .compose {
    display: flex; align-items: center; gap: 7px; padding: 8px; background: #fff;
    border-top: 1px solid #DDDDDD; flex-shrink: 0;
  }
  /* Soft "inset" input: light-grey field, darker top border + inner highlight. */
  .compose input {
    flex: 1; min-width: 0; height: 36px; box-sizing: border-box;
    padding: 0 12px; font-size: 16px; color: #333333;
    border-style: solid; border-width: 2px 1px 1px;
    border-color: #cccccc #f2f2f2 #f6f6f6; border-radius: 8px;
    background: #eeeeee; box-shadow: inset 0 1px 0 #e5e5e5;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .compose button {
    height: 36px; box-sizing: border-box; flex-shrink: 0;
    background: #FFAAAD; color: #660000; border: 1px solid #F48081; border-radius: 8px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 0 18px; font-size: 14px; font-weight: bold;
  }
  .compose button:disabled { opacity: .5; }

  /* Feutre swatch picker (horizontal scroll above the composer) */
  #pen-bar {
    display: none; gap: 7px; padding: 8px 10px; background: #fff;
    border-top: 1px solid #DDDDDD; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-shrink: 0; white-space: nowrap;
  }
  #pen-bar.show { display: flex; }
  .pen-swatch {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer;
  }
  .pen-swatch.sel { box-shadow: 0 0 0 2px #D16767; transform: scale(1.12); }
  .pen-swatch.none {
    background: #fff; color: #D16767; font-size: 14px; line-height: 26px;
    text-align: center; font-weight: bold;
  }
  /* Feutre multicolore : pastille et texte des messages en arc-en-ciel.
     Couleurs REPRISES des 17 feutres d'origine (penList) : orange sanguin, jaune
     maïs, vert pomme, bleu ciel, bleu, violet fondant, rose — mêmes teintes que le
     dégradé du bureau (MC_RAINBOW côté serveur). */
  .pen-swatch.mc {
    background: linear-gradient(90deg, #FF6600, #EBB601, #20D251, #47B9C9, #6666CC, #6E3C8D, #F986E2);
  }
  .mc-text {
    background: linear-gradient(90deg, #FF6600, #EBB601, #20D251, #47B9C9, #6666CC, #6E3C8D, #F986E2);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    font-weight: bold;
  }

  /* Accent helper bar (above the composer), same toggle pattern as #pen-bar */
  #accent-bar {
    display: none; gap: 5px; padding: 8px 10px; background: #fff;
    border-top: 1px solid #DDDDDD; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-shrink: 0; white-space: nowrap;
  }
  #accent-bar.show { display: flex; }
  .accent-key {
    min-width: 36px; height: 36px; flex-shrink: 0; padding: 0 6px;
    border: 1px solid #DDDDDD; border-radius: 8px; background: #f6f6f6;
    color: #333333; font-size: 18px; cursor: pointer; box-shadow: 0 1px 0 #e5e5e5;
  }
  .accent-key:active { background: #e7e7e7; }
  #accent-toggle {
    height: 36px; width: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0;
    background: #fff; color: #660000; border: 1px solid #F48081; border-radius: 8px;
    box-shadow: 0 0 0 1px #DDDDDD; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  #accent-toggle.on { background: #FFAAAD; }
  #accent-toggle:disabled { opacity: .5; }

  /* Bouille reaction overlay — a live Ruffle bouille (vector = crisp), centered
     over the messages with NO card/background. It slides in from the left edge
     of the chat and slides back out to the left. pointer-events stay off so the
     chat underneath remains readable/scrollable. */
  #bouille-overlay {
    position: absolute; left: 0; top: 0; right: 0; bottom: 56px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; overflow: hidden;
  }
  #bouille-overlay-stage {
    width: 200px; height: 200px; max-width: 56vw; max-height: 56vw;
    /* Start fully off the left edge; .show brings it to center. */
    transform: translateX(-130vw);
    opacity: 0;
    transition: transform .5s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
    will-change: transform, opacity;
  }
  #bouille-overlay.show #bouille-overlay-stage { transform: translateX(0); opacity: 1; }
  #bouille-overlay.leaving #bouille-overlay-stage { transform: translateX(-130vw); opacity: 0; }
  #bouille-overlay-stage iframe {
    width: 100%; height: 100%; border: 0; background: transparent; display: block;
  }
  /* Small floating caption so you still know who reacts, but unobtrusive. */
  #bouille-overlay-name {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; font-weight: bold; color: #2C4A0F;
    background: rgba(255,255,255,.82); border: 1px solid #5a8a20;
    border-radius: 10px; padding: 2px 9px; max-width: 78vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .3s ease;
  }
  #bouille-overlay.show #bouille-overlay-name { opacity: 1; }

  /* ── La FICHE d'un frutiz ──
     La fenêtre de main.swf (winFrutizInfo), redessinée sur l'intégration
     d'époque de Rémi : une CARTE blanche à liseré sombre, pas une fenêtre
     verte. En haut la plaque verte (bouille + écran de niveau) et le pseudo ;
     en dessous, dépliable par le bouton rose du bureau, le panneau vert clair
     des quatre onglets. Les dessins, eux, restent ceux de main.swf. */
  #fiche-backdrop {
    position: fixed; inset: 0; z-index: 70; display: none;
    align-items: center; justify-content: center;
    background: rgba(20, 32, 8, .45); padding: 16px;
  }
  #fiche-backdrop.show { display: flex; }
  #fiche {
    position: relative;
    width: min(340px, 94vw); max-height: 92vh; overflow-y: auto;
    background: #fff; border: 1.5px solid #545454; border-radius: 5px;
    /* L'ombre portée court sur TOUS les côtés — une lueur sombre centrée,
       et une seconde plus basse pour poser la carte sur le fond. */
    box-shadow: 0 0 16px rgba(0, 0, 0, .45), 0 4px 10px rgba(0, 0, 0, .3);
    padding: 6px;
  }
  /* Le haut : la plaque à gauche, le pseudo et les actions à droite. La croix
     et le bouton rose sont posés dans le coin, hors du flux. */
  .fiche-haut { display: flex; align-items: flex-start; gap: 9px; padding-right: 26px; }
  /* LA PLAQUE — un seul encart vert (#C8F39A) cerné de gris qui tient la
     bouille ET l'écran de niveau, comme sur l'intégration. */
  .fiche-plaque {
    flex: 0 0 auto; position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 5px;
    padding: 3px; background: #c8f39a;
    border: 1px solid #666; border-radius: 5px; box-shadow: 0 0 0 2px #ddd;
  }
  .fiche-plaque .reflet-niv {
    position: absolute; right: -3px; top: -3px; height: 62%; width: auto;
    z-index: 1; pointer-events: none; opacity: .8;
  }
  .fiche-plaque .fa-frame {
    position: relative; width: 52px; height: 52px; border-radius: 5px; overflow: hidden;
    z-index: 2;
  }
  .fiche-plaque .fa-frame .cadre { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .fiche-plaque .fa-frame .stage { position: absolute; inset: 5%; z-index: 2; border-radius: 4px; overflow: hidden; }
  .fiche-plaque .fa-frame .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; pointer-events: none; }
  .fiche-plaque .fa-frame .reflet { position: absolute; right: 5%; top: 5%; width: 46%; height: auto; z-index: 3; pointer-events: none; }
  .fiche-plaque .fa-jauge {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    align-items: center; gap: 3px; padding-right: 3px;
  }
  /* Les NEUF barres : le taux de complétion du niveau, découpé en neuf lignes
     qui se remplissent du bas vers le haut (UserMng.xpLevelCompletionRate). */
  .fiche-plaque .fa-progress { display: flex; flex-direction: column; gap: 1.5px; width: 30px; }
  .fiche-plaque .fa-progress i { display: block; height: 2px; background: #A3EB57; overflow: hidden; }
  .fiche-plaque .fa-progress i::before {
    content: ""; display: block; height: 100%; width: var(--f, 0%); background: #72A62C;
  }
  .fiche-plaque .fa-niv { display: flex; align-items: center; gap: 2px; line-height: 1; }
  .fiche-plaque .fa-niv img { height: 11px; width: auto; display: block; }
  .fiche-plaque .fa-niv b {
    font-family: 'DSEG7', 'Courier New', monospace; font-weight: bold;
    font-size: 11px; line-height: 1; color: #4E8030;
  }
  .fiche-droite { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .fiche-nom-ligne { display: flex; align-items: center; gap: 5px; }
  /* Le point de présence du bureau (clip status : vert présent, anneau éteint). */
  .fiche-nom-ligne .statut { width: 11px; height: 11px; object-fit: contain; flex: 0 0 auto; }
  .fiche-nom-ligne b {
    font-family: Verdana, Arial, sans-serif; font-size: 12.5px; color: #290D64;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fiche-meta { font-size: 11.5px; color: #444; margin-top: -2px; }
  /* La croix du bureau (butGroupWinTop) et, dessous, le bouton ROSE du mode
     avancé (butPushSmallPink + son triangle) — qui DÉPLIE la fiche, comme au
     bureau où il ouvre la partie détaillée. */
  #fiche-fermer, #fiche-avance {
    position: absolute; right: 5px; border: 0; background: transparent;
    cursor: pointer; padding: 0; z-index: 3;
  }
  #fiche-fermer { top: 4px; }
  #fiche-fermer img { width: 15px; height: 15px; display: block; }
  #fiche-avance {
    top: 30px; width: 24px; height: 24px;
    background: url('/fb/fiche/bouton_rose.png') no-repeat center / 100% 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #fiche-avance img { width: 13px; height: 13px; object-fit: contain; display: block; }
  .fiche-actions { display: flex; align-items: center; gap: 5px; margin-top: 7px; padding: 0 2px; }
  /* Les glyphes du bureau (la feuille `icon` du sprite 500), posés dans le
     halo gris clair de l'intégration plutôt que dans un cadre plein. */
  .fiche-actions button {
    width: 26px; height: 26px; padding: 0; cursor: pointer;
    background: #fff; border: 0; border-radius: 3px;
    box-shadow: 0 0 0 1.5px #DDDDDD;
    display: flex; align-items: center; justify-content: center;
  }
  .fiche-actions button img { width: 18px; height: 18px; object-fit: contain; display: block; }
  .fiche-actions button:active { filter: brightness(.92); }
  /* Pas encore porté sur mobile : présent, mais éteint — comme convenu. */
  .fiche-actions button:disabled { opacity: .42; cursor: default; }
  /* LA PARTIE DÉPLIÉE — le panneau vert clair de l'intégration. */
  .fiche-corps {
    margin-top: 8px; background: #E0F4C5;
    border: 2px solid #a7dc6b; border-radius: 2px; box-shadow: 0 0 0 2px #DDDDDD;
  }
  #fiche:not(.deploye) .fiche-corps { display: none; }
  .fiche-onglets { display: flex; justify-content: space-around; border-bottom: 2px solid #a7dc6b; }
  .fiche-onglets button {
    flex: 1 1 0; border: 0; background: transparent; font-weight: bold;
    font-family: Verdana, Arial, sans-serif; font-size: 11px; color: #446531;
    cursor: pointer; padding: 6px 0;
  }
  .fiche-onglets button.actif { color: #811C22; }
  .fiche-page { padding: 10px 12px 12px; min-height: 168px; }
  /* Le titre de section, centré entre deux filets — le « FrutiSigne » de
     l'intégration. */
  .fiche-titre {
    position: relative; text-align: center; font-weight: bold;
    font-family: Verdana, Arial, sans-serif; font-size: 12px; color: #446531;
    margin: 2px 0 10px;
  }
  .fiche-titre::before, .fiche-titre::after {
    content: ""; position: absolute; top: 50%; width: 26%; height: 1.5px; background: #a7dc6b;
  }
  .fiche-titre::before { left: 4px; }
  .fiche-titre::after { right: 4px; }
  /* Les trois signes : l'ascendant en petit de part et d'autre, le signe au
     centre — et le filet qui les sépare des lignes d'information. */
  .fiche-signes {
    display: flex; align-items: center; justify-content: space-around;
    margin: 0 8px 10px; padding: 0 46px 10px;
    border-bottom: 1.5px solid #a7dc6b;
  }
  .fiche-signes img.petit { width: 28px; height: 28px; object-fit: contain; }
  .fiche-signes img.grand { width: 52px; height: 52px; object-fit: contain; }
  .fiche-lignes { padding: 0 4px; }
  .fiche-ligne {
    display: flex; justify-content: space-between; gap: 12px; padding: 3px 0;
    font-family: Verdana, Arial, sans-serif; font-size: 11px;
  }
  .fiche-ligne .lib { color: #446531; }
  .fiche-ligne .val { color: #444; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .fiche-ligne .val a { color: #2f6b16; }
  /* L'onglet « perso » encadre ses lignes de deux séparateurs. */
  .fiche-lignes.encadre { padding: 4px; }
  .fiche-lignes.encadre::before, .fiche-lignes.encadre::after {
    content: ""; display: block; height: 2px; background: #a7dc6b; margin: 5px 0;
  }
  .fiche-com {
    font-family: Verdana, Arial, sans-serif; font-size: 11px; color: #444;
    white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; padding: 0 4px;
  }
  .fiche-vide {
    text-align: center; color: #446531; font-family: Verdana, Arial, sans-serif;
    font-size: 11px; padding: 26px 0;
  }
  /* Le pseudo d'un message se touche : il ouvre la fiche, comme au bureau. */
  #messages .from { cursor: pointer; }

  /* User list drawer */
  #users-drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 72%; max-width: 280px;
    background: #fff; border-left: 1px solid #DDDDDD; z-index: 30;
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column; box-shadow: -6px 0 18px rgba(44,74,15,.25);
  }
  #users-drawer.open { transform: translateX(0); }
  #users-drawer h3 { margin: 0; padding: 12px 14px; background: #fff; color: #D16767; font-size: 14px; border-bottom: 1px solid #DDDDDD; }
  /* Bascule « ce salon » / « tout le site ». Deux onglets pleine largeur : la
     cible tactile fait la moitié du tiroir, on ne peut pas la manquer. */
  #drawer-onglets { display: flex; background: #fff; border-bottom: 1px solid #DDDDDD; }
  .dr-onglet {
    flex: 1; padding: 9px 4px; border: 0; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: bold; color: #8aa06a;
    border-bottom: 3px solid transparent; -webkit-tap-highlight-color: transparent;
  }
  .dr-onglet.on { color: #D16767; border-bottom-color: #D16767; }
  .dr-onglet:active { background: #f4f9ec; }
  /* Sur « tout le site », chaque ligne porte en plus le salon où se trouve le
     joueur : le pseudo passe donc au-dessus, en colonne. */
  #users-drawer .u.avec-lieu { flex-direction: column; align-items: center; gap: 2px; justify-content: center; }
  #users-drawer .u .lieu {
    font-size: 11px; font-weight: bold; letter-spacing: 0; color: #6c8f3a;
    text-shadow: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* L'enveloppe « écrire en privé » se pose à droite ; en colonne, elle serait
     poussée sous le pseudo. On la remet dans le flux horizontal. */
  #users-drawer .u.avec-lieu .haut { display: flex; align-items: center; gap: 8px; max-width: 100%; }
  #users-drawer .u.avec-lieu.mp::after { position: absolute; right: 12px; top: 50%; margin-top: -9px; }
  #users-drawer .u.avec-lieu { position: relative; }
  #users-drawer .vide { padding: 16px 12px; text-align: center; color: #6c8f3a; font-size: 13px; }
  /* Connected-users list styled after the "score panel" mockup: a light-green
     card (soft green border, rounded top, inner white highlight + green glow)
     encapsulated in the white drawer; rows alternate two greens with big bold
     Verdana pseudos in deep indigo. */
  #users-drawer .list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin: 0 10px; padding: 0;
    background: #e8f8d1; border: 4px solid #bff18d; border-radius: 24px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.45), 0 0 4px rgba(126,220,80,.45);
  }
  /* Pink scroll buttons (bouton_up.png) above AND below the list, same width as
     the list. Tap to nudge, press-and-hold to keep scrolling; the art is
     symmetric so the same image serves the top and the bottom. */
  .users-scroll {
    flex-shrink: 0; display: block; width: auto; margin: 6px 10px;
    padding: 0; border: 0; background: transparent; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .users-scroll.up { margin-top: 10px; }
  .users-scroll.down { margin-bottom: 10px; }
  .users-scroll img { width: 100%; height: auto; display: block; }
  .users-scroll:active img { filter: brightness(.95); }
  #users-drawer .u {
    min-height: 48px; padding: 6px 12px; background: #e8f8d1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #242169; font-family: 'Verdana', Arial, sans-serif; font-weight: 900;
    font-size: 22px; line-height: 1; letter-spacing: -.7px;
    text-shadow: 0 1px 0 rgba(255,255,255,.25);
  }
  #users-drawer .u:nth-child(odd) { background: #d6f7b5; }
  #users-drawer .u > span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Le voyant de jeu — la même icône que le bureau pose à côté du pseudo. */
  #users-drawer .u .voyant { width: 22px; height: 22px; flex-shrink: 0; }
  #users-drawer .u .badge {
    font-size: 10px; font-weight: bold; background: #242169; color: #fff;
    border-radius: 8px; padding: 1px 6px; letter-spacing: 0; text-shadow: none; flex-shrink: 0;
  }
  /* Un pseudo sur lequel on peut appuyer pour écrire en privé. L'enveloppe dit
     ce que le simple texte ne disait pas : que la ligne est un bouton. */
  #users-drawer .u.mp { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #users-drawer .u.mp::after {
    content: "\2709"; font-size: 18px; font-weight: 400; color: #6c8f3a;
    flex-shrink: 0; line-height: 1;
  }
  #users-drawer .u.mp:active { background: #c7f09a; }
  /* Pastille « des messages privés non lus » sur l'icône des connectés : elle
     doit se voir même quand le tiroir et le sélecteur sont fermés. */
  #users-btn.a-lire { position: relative; }
  #users-btn.a-lire::after {
    content: ""; position: absolute; top: 2px; right: 2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #e63b3b; box-shadow: 0 0 0 2px #fff;
  }
  #drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 25; display: none; }
  #drawer-backdrop.show { display: block; }

  /* ── Forum panel ── */
  #forum-panel { padding: 0; }
  #forum-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #ADE76B;
  }
  #grapiz-panel { padding: 0; }
  #grapiz-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #FFFEE2;
  }
  #bandas-panel { padding: 0; }
  #bandas-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #92aa2e;
  }
  #swapou-panel { padding: 0; }
  #swapou-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #24330e;
  }
  #miniwave-panel { padding: 0; }
  #miniwave-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #150d24;
  }
  #minipixiz-panel { padding: 0; }
  #minipixiz-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
