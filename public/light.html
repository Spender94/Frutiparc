  }

  /* ── Scores du jour (Challenge) ──
     Barre de jeux (chips) corail collée en haut + tableau vert scrollable,
     dans la même palette que le chat. Lecture seule, rechargé à l'ouverture. */
  #scores-panel { padding: 0; background: #CCF599; }
  #scores-head {
    flex-shrink: 0; background: #FEABAB; border-bottom: 1px solid #DDDDDD;
    box-shadow: 0 1px 3px rgba(44,74,15,.18);
  }
  #scores-tabs {
    display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #scores-tabs::-webkit-scrollbar { display: none; }
  .scores-tab {
    flex: 0 0 auto; padding: 6px 13px; border: 0; border-radius: 14px;
    background: rgba(255,255,255,.35); color: #7a1f1f; font-weight: bold;
    font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .scores-tab.active {
    background: #fff; color: #D16767; box-shadow: 0 1px 2px rgba(44,74,15,.25);
  }
  #scores-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 10px 16px;
  }

  /* ── Messagerie ──
     Même grammaire visuelle que les scores (bandeau corail collé en haut,
     contenu vert scrollable), pour que le mobile reste d'un seul tenant. Les
     trois vues (liste / lecture / rédaction) occupent tour à tour la place. */
  #mail-panel { padding: 0; background: #CCF599; }
  #mail-head {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: #FEABAB; border-bottom: 1px solid #DDDDDD;
    box-shadow: 0 1px 3px rgba(44,74,15,.18);
  }
  #mail-tabs {
    display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #mail-tabs::-webkit-scrollbar { display: none; }
  .mail-tab {
    flex: 0 0 auto; padding: 6px 13px; border: 0; border-radius: 14px;
    background: rgba(255,255,255,.35); color: #7a1f1f; font-weight: bold;
    font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .mail-tab.active { background: #fff; color: #D16767; box-shadow: 0 1px 2px rgba(44,74,15,.25); }
  /* Compteur de non-lus accolé à l'onglet « Reçus ». */
  .mail-tab .n {
    display: inline-block; margin-left: 5px; min-width: 15px; padding: 0 4px;
    border-radius: 999px; background: #73b01e; color: #fff; font-size: 10.5px; line-height: 15px;
  }
  #mail-new {
    flex: 0 0 auto; border: 0; border-radius: 14px; padding: 6px 14px; cursor: pointer;
    color: #7a1f1f; font-weight: bold; font-size: 12.5px;
    background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.30));
    box-shadow: 0 1px 2px rgba(122,31,31,.22);
  }
  /* Une seule vue affichée à la fois. */
  .mail-vue { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
  .mail-vue.on { display: flex; }
  #mail-liste {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 10px 16px;
  }
  .mail-item {
    display: block; width: 100%; text-align: left; border: 1px solid #B7DD84;
    background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 7px;
    cursor: pointer; font: inherit; color: #2C4A0F;
  }
  .mail-item .l1 { display: flex; align-items: baseline; gap: 6px; }
  .mail-item .qui { font-weight: bold; color: #4B7A18; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-item .quand { flex: 0 0 auto; font-size: 10.5px; color: #7d9a5a; }
  .mail-item .obj { font-size: 13px; margin-top: 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .mail-item .apercu { font-size: 11.5px; color: #6d8a4c; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Non lu : liseré vert vif + objet en gras — repérable d'un coup d'œil. */
  .mail-item.neuf { border-color: #8CCB3F; box-shadow: inset 3px 0 0 #8CCB3F; }
  .mail-item.neuf .obj { font-weight: bold; }
  .mail-vide, .mail-charge {
    text-align: center; color: #4B7A18; font-size: 13px; padding: 26px 12px;
  }
  .mail-entete { flex-shrink: 0; padding: 10px 12px 8px; background: #E4F7C4;
    border-bottom: 1px solid #B7DD84; }
  .ml-sujet { font-weight: bold; color: #2C4A0F; font-size: 14px; word-break: break-word; }
  .ml-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px;
    font-size: 11.5px; color: #6d8a4c; }
  .mail-corps {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px; font-size: 13.5px; line-height: 1.45; color: #2C4A0F;
    white-space: pre-wrap; word-break: break-word;
  }
  .mail-actions {
    flex-shrink: 0; display: flex; gap: 8px; padding: 8px 10px;
    background: #fff; border-top: 1px solid #DDD;
  }
  .ma-btn {
    flex: 1 1 0; border: 0; border-radius: 12px; padding: 9px 6px; cursor: pointer;
    font-weight: bold; font-size: 13px; color: #7a1f1f;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 52%), linear-gradient(180deg, #FEB7B7, #F58E8E);
    box-shadow: 0 1px 2px rgba(122,31,31,.22), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .ma-btn.primaire {
    color: #2C4A0F;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 52%), linear-gradient(180deg, #B7E86B, #93CC3C);
    box-shadow: 0 1px 2px rgba(44,74,15,.22), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .ma-btn.danger { color: #fff; background: linear-gradient(180deg, #E8756B, #C94437); }
  .ma-btn[disabled] { opacity: .55; cursor: default; }
  .mail-form {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 12px 14px; display: flex; flex-direction: column;
  }
  .mail-form label { font-size: 11.5px; font-weight: bold; color: #4B7A18; margin: 6px 0 3px; }
  .mail-form input, .mail-form textarea {
    box-sizing: border-box; width: 100%; border: 1px solid #B7DD84; border-radius: 10px;
    padding: 9px 11px; font: inherit; font-size: 13.5px; color: #2C4A0F; background: #fff;
  }
  .mail-form textarea { resize: vertical; min-height: 110px; line-height: 1.4; }
  .mail-form input:focus, .mail-form textarea:focus {
    outline: none; border-color: #8CCB3F; box-shadow: 0 0 0 3px rgba(140,203,63,.28);
  }
  .mail-erreur { min-height: 16px; margin-top: 7px; font-size: 12px; color: #C0392B; }
  .mail-erreur.ok { color: #4B7A18; }
  /* ── Événements et Historique ──
     Calqués sur la fenêtre du bureau : barre de titre blanche avec l'icône de
     fenêtre, fond vert, et des cartes portant chacune le visuel de son type. En
     bas, le pageur — ses deux boutons sont ceux du SWF (le carré rose et le
     triangle de butPushSmallPink). Ni croix ni bouton de réduction : sur un
     téléphone, la rubrique EST l'écran, il n'y a rien à fermer. */
  #evt-panel { padding: 9px; background: #ADE76B; }
  .fenetre {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: #CCF599; border-radius: 10px; overflow: hidden;
    box-shadow: 0 3px 11px rgba(0,0,0,.42);
  }
  .fen-titre {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; background: #fff;
    font-weight: bold; font-size: 13px; color: #40305c;
  }
  .fen-ico { width: 15px; height: 15px; display: block; }
  #evt-liste {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 7px 7px 3px;
  }
  .evt-item {
    display: flex; gap: 7px; align-items: center;
    background: #DCF2B4; border: 1px solid #8CC63F; border-radius: 9px;
    padding: 5px 9px 5px 5px; margin-bottom: 6px;
  }
  /* Le visuel garde ses proportions d'origine (elles varient d'un type à
     l'autre) dans une case de taille fixe, pour que les textes s'alignent. */
  .evt-item .vis {
    flex: 0 0 52px; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .evt-item .vis img { max-width: 100%; max-height: 100%; display: block; }
  .evt-item .txt {
    flex: 1 1 auto; min-width: 0; font-size: 12.5px; line-height: 1.36;
    color: #2C4A0F; word-break: break-word;
  }
  .evt-item .quand { font-weight: bold; }
  /* Non consultée : le bureau met toute la ligne en gras, un cran plus grand. */
  .evt-item.neuf .txt { font-weight: bold; font-size: 13.5px; }
  .fen-pied {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 3px 7px 7px;
  }
  .fen-page {
    border: 0; background: transparent; padding: 0; cursor: pointer; line-height: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .fen-page img { width: 27px; height: 27px; display: block; }
  .fen-page:active img { transform: scale(.9); }
  .fen-page[disabled] { opacity: .35; cursor: default; }
  .fen-page[disabled]:active img { transform: none; }
  #evt-page { font-size: 12.5px; color: #2C4A0F; }
  .evt-vide, .evt-charge { text-align: center; color: #4B7A18; font-size: 13px; padding: 26px 12px; }

  /* Voyant de la messagerie sur le raccourci de l'accueil : l'icône change (le
     bac à courrier de main.swf remplace l'enveloppe) et un compteur s'y accroche. */

  /* Trombinoscope */
  #trombi-head {
    flex-shrink: 0; border-bottom: 1px solid #DDDDDD;
    /* Effet « bonbon » : voile blanc dégradé par-dessus le rose. */
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 46%), linear-gradient(180deg, #FEB7B7, #FD9C9C);
    box-shadow: 0 1px 3px rgba(44,74,15,.18); padding: 8px 10px;
  }
  #trombi-search {
    width: 100%; box-sizing: border-box; padding: 8px 12px; border: 0;
    border-radius: 14px; font-size: 13px; background: #fff; color: #333;
  }
  #trombi-letters {
    display: flex; gap: 4px; margin-top: 8px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #trombi-letters::-webkit-scrollbar { display: none; }
  .trombi-letter {
    flex: 0 0 auto; min-width: 26px; padding: 4px 7px; border: 0; border-radius: 12px;
    background: rgba(255,255,255,.45); color: #7a1f1f; font-weight: bold;
    font-size: 12px; cursor: pointer;
  }
  .trombi-letter.active { background: #fff; color: #D16767; box-shadow: 0 1px 2px rgba(44,74,15,.25); }
  #trombi-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px; display: grid; gap: 10px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  }
  /* Barre de défilement « gélule » rose : piste arrondie + pouce dégradé à reflet.
     Chromium/WebKit via ::-webkit-scrollbar ; Firefox via scrollbar-* (réservé par
     @supports, car le poser sur Chromium désactiverait les pseudos). */
  @supports not selector(::-webkit-scrollbar) {
    #trombi-body { scrollbar-width: thin; scrollbar-color: #E98A8A #FFE6E6; }
  }
  #trombi-body::-webkit-scrollbar { width: 14px; }
  #trombi-body::-webkit-scrollbar-track { background: #FFE6E6; border-radius: 999px; margin: 6px 3px; }
  #trombi-body::-webkit-scrollbar-thumb {
    border-radius: 999px; border: 3px solid transparent; background-clip: padding-box;
    background-image: linear-gradient(90deg, #DE7A7A 0%, #FFD4D4 48%, #F6B4B4 56%, #DE7A7A 100%);
    box-shadow: inset 0 0 0 1px rgba(214,103,103,.30);
  }
  #trombi-body::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(90deg, #D86A6A 0%, #FFE0E0 48%, #FBC2C2 56%, #D86A6A 100%); }
  #trombi-search:focus { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.65); }
  #trombi-pager {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 8px; background: #fff; border-top: 1px solid #eee;
  }
  #trombi-pager:empty { display: none; }
  .trombi-pgbtn {
    border: 0; color: #7a1f1f; font-weight: bold;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 52%), linear-gradient(180deg, #FEB7B7, #F58E8E);
    box-shadow: 0 1px 2px rgba(122,31,31,.22), inset 0 1px 0 rgba(255,255,255,.55);
    font-size: 16px; width: 36px; height: 30px; border-radius: 9px; cursor: pointer;
  }
  .trombi-pgbtn[disabled] { opacity: .4; cursor: default; }
  .trombi-pginfo { font-size: 12px; color: #7a1f1f; }
  /* Compteur en pastille « étiquette » blanche. */
  .trombi-badge {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    background: #fff; color: #D16767; font-weight: bold; font-size: 12px;
    box-shadow: 0 1px 2px rgba(122,31,31,.20);
  }
  .trombi-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #fff; border: 1px solid #f0dada; border-radius: 10px;
    padding: 8px 4px; text-align: center;
    transition: box-shadow .12s ease, transform .12s ease;
  }
  @media (hover: hover) {
    .trombi-card:hover { box-shadow: 0 5px 14px rgba(209,103,103,.28); transform: translateY(-2px); }
  }
  /* Vignette bouille = iframe Ruffle (même rendu que le forum), fond vert carte. */
  .trombi-card .tb { width: 72px; height: 72px; border: 1px solid #cfe0b3; border-radius: 8px; background: #E8F8D3; overflow: hidden; }
  .trombi-card .tb iframe, .trombi-card .tb img { width: 100%; height: 100%; border: 0; display: block; object-fit: contain; }
  .trombi-card .nm {
    font-size: 12px; font-weight: bold; color: #2C4A0F; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trombi-empty { grid-column: 1 / -1; text-align: center; color: #888; font-size: 13px; padding: 22px 10px; }
  .scores-cap {
    font-size: 11.5px; color: #2f5510; font-weight: bold; text-align: center;
    margin: 2px 0 8px;
  }
  /* Podium de la veille : bandeau clair en tête du tableau, médaillés côte à
     côte. Les visuels de médaille (≈100 px à la source) sont fortement réduits. */
  .podium {
    display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center;
    background: #E9F8CE; border: 1px solid #ADE76B; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 7px 10px 8px; margin-bottom: 10px;
  }
  .podium-title {
    width: 100%; text-align: center; font-size: 11px; font-weight: bold;
    color: #2f5510; margin-bottom: 3px;
  }
  .pod-item { display: inline-flex; align-items: center; gap: 5px; }
  .pod-medal { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
  .pod-name {
    font-size: 12px; font-weight: bold; color: #2C4A0F;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scores-list {
    list-style: none; margin: 0; padding: 0; overflow: hidden;
    border: 1px solid #ADE76B; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD; background: #D6F7B5;
  }
  .score-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    font-family: 'Verdana', Arial, sans-serif; font-size: 13px;
    background: #D6F7B5; border-bottom: 1px solid #fff;
  }
  .score-row:last-child { border-bottom: 0; }
  .score-row:nth-child(even) { background: #C3EF93; }
  .score-row .pos {
    flex: 0 0 auto; width: 26px; text-align: center; font-weight: bold;
    color: #2C4A0F; font-size: 14px;
  }
  .score-row.r1 .pos, .score-row.r2 .pos, .score-row.r3 .pos { font-size: 17px; }
  .score-row .pname {
    flex: 1 1 auto; min-width: 0; color: #2C4A0F; font-weight: bold;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .score-row .pscore {
    flex: 0 0 auto; color: #335511; font-weight: bold;
    font-family: "Courier New", monospace; font-size: 13px;
  }
  /* Ligne du joueur courant : ressort en corail clair avec un badge « toi ». */
  .score-row.me { background: #FFE4E4; }
  .score-row.me .pname { color: #D16767; }
  .score-row.me .pscore { color: #D16767; }
  .me-badge {
    flex: 0 0 auto; font-size: 9px; font-weight: bold; color: #fff;
    background: #E3756A; border-radius: 7px; padding: 1px 6px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .scores-loading, .scores-empty {
    text-align: center; padding: 30px 16px; color: #4f7b1f;
    font-style: italic; font-size: 13px; line-height: 1.6;
  }

  .hidden { display: none !important; }
  .banner {
    background: #fff3cd; color: #7a5b00; border-bottom: 1px solid #e0c97a;
    font-size: 12px; padding: 7px 10px; text-align: center; flex-shrink: 0;
  }

  /* ════════════════════ Accueil mobile (launcher plein écran) ════════════════
     Le « menu » du mode mobile : une main bar en haut (avatar Frutibouille +
     niveau/classement + emotes d'humeur + raccourcis) puis une grille pleine
     largeur des rubriques (Scores, Boutique, Mes disques, Salons, Inventaire,
     Forum). Remplace l'ancien tiroir hamburger (qui n'était pas full width). */
  /* Le menu est un TIROIR qui glisse depuis la gauche, PAR-DESSUS le contenu
     (chat/forum/jeux), qui reste visible derrière. Fermé : hors écran à gauche.
     Mobile : plein écran ; desktop : bande de 440px (cf. media query). */
  #home-panel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 100%; z-index: 40;
    display: flex; flex-direction: column;
    background: #ADE76B; overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateX(-100%); transition: transform .25s ease;
    box-shadow: 4px 0 18px rgba(0,0,0,.28);
  }
  #app.menu-open #home-panel { transform: translateX(0); }
  /* Capteur de clic « hors tiroir » (transparent → le contenu reste visible) :
     un clic ferme le tiroir. Couvert par le tiroir plein écran sur mobile. */
  #home-backdrop {
    position: absolute; inset: 0; z-index: 39; display: none; background: transparent;
  }
  #app.menu-open #home-backdrop { display: block; }

  /* Police « radio-réveil » (sept segments) pour le numéro de niveau. */
  @font-face {
    font-family: 'DSEG7';
    src: url('/fb/DSEG7Classic-Bold.woff2') format('woff2');
    font-weight: bold; font-style: normal; font-display: swap;
  }

  /* ── Main bar : bandeau clair plein largeur ── */
  .mainbar {
    background: #fbfdf3;
    box-shadow: 0 0 0 2px #d9d9d9, 0 0 0 3px #8a888d;
    padding: 9px 10px 10px; display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  /* Avatar (gauche) + colonne droite (encart niveau au-dessus, emotes en dessous).
     align-items:stretch ⇒ l'avatar prend toute la hauteur de la colonne droite,
     donc hauteur avatar = hauteur encart + hauteur emotes (demande explicite). */
  .mb-top { display: flex; align-items: stretch; gap: 8px; }

  /* Avatar (bouille Ruffle) dans le cadre vert glossy + reflet. Carré : sa largeur
     fixe = la hauteur de la colonne droite (110 = 72 encart + 4 + 34). Bords
     arrondis (cadre + scène clippés). */
  .mb-avatar { flex: 0 0 110px; position: relative; }
  /* Bordure 1px #8A888D + sur-bordure 2px #D9D9D9 autour de l'encart bouille. */
  .mb-avatar .frame {
    position: absolute; inset: 3px; border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px #8A888D, 0 0 0 3px #D9D9D9;
  }
  .mb-avatar .cadre, .mb-avatar .reflet { position: absolute; pointer-events: none; }
  .mb-avatar .cadre { inset: 0; width: 100%; height: 100%; z-index: 1; }
  /* Bouille agrandie : faible marge intérieure pour qu'elle remplisse le cadre. */
  .mb-avatar .stage {
    position: absolute; inset: 5%; z-index: 2; border-radius: 9px; overflow: hidden;
  }
  .mb-avatar .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  /* Reflet (brillance) dans le coin SUPÉRIEUR DROIT de l'encart bouille. */
  .mb-avatar .reflet { right: 5%; top: 5%; width: 46%; height: auto; z-index: 3; }

  /* Colonne droite : encart niveau (haut) + rangée d'emotes (bas). */
  .mb-right { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

  /* Encart « niveau / classement » : panneau vert glossy reconstruit en CSS
     (le SVG d'origine portait un trophée + séparateur gravés qui empêchaient ce
     nouvel agencement). 4 zones : barres de progression (haut-gauche), trophée +
     rang (haut-centre), « NIV » + niveau (bas-gauche), raccourcis (bas-droite). */
  .mb-encart {
    position: relative; flex: 0 0 72px; min-width: 0; border-radius: 6px; overflow: hidden;
    background: #c8f39a;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px #93c168,
                0 0 0 2px #dcdcdc, 0 1px 2px rgba(44,74,15,.22);
  }
  /* Reflet (brillance) dans le coin SUPÉRIEUR DROIT de l'encart niveau. Taillé
     sur la HAUTEUR pour ne pas déborder (l'encart est en overflow:hidden). */
  .reflet-niv {
    position: absolute; right: 2%; top: 3%; height: 62%; width: auto; z-index: 1;
    pointer-events: none;
  }
  /* Ligne de séparation sous la coupe (sépare rang ↔ raccourcis), comme le SVG
     d'origine : trait vert + léger filet blanc dessous, côté droit de l'encart. */
  .enc-divider {
    position: absolute; left: 26%; right: 4%; top: 47%; height: 1px; z-index: 1;
    background: #73b01e; box-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  /* Progression dans le niveau en cours : 9 barres courtes empilées. Chaque barre
     est UN segment du palier : elle se remplit ENTIÈREMENT (gauche → droite) avant
     que la suivante commence (cf. setHomeProgress). C'est le % de complétion de
     main.swf « découpé » en 9 lignes. */
  .enc-progress {
    position: absolute; left: 10px; top: 8px; width: 42px; height: 36px; z-index: 2;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .enc-progress i {
    display: block; height: 2px; background: #A3EB57; overflow: hidden;
  }
  .enc-progress i::before {
    content: ""; display: block; height: 100%; width: var(--f, 0%);
    background: #78B425; transition: width .35s ease;
  }
  /* Trophée + rang (classement général par XP, 1 = meilleur). Calés à gauche, là
     où commence la ligne de séparation. */
  .enc-trophy {
    position: absolute; left: 26%; top: 6px; height: 24px; z-index: 2;
    display: flex; align-items: center; gap: 3px;
  }
  .enc-trophy .tro { height: 23px; width: auto; display: block; filter: drop-shadow(0 1px 0 rgba(255,255,255,.45)); }
  .enc-trophy .val {
    font-family: 'DSEG7', 'Courier New', monospace;
    font-size: 21px; line-height: 1; color: #73b01e; text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  /* Niveau : icône « NIV » (agrandie) puis le numéro « radio-réveil » (DSEG7) à la
     suite, même taille — bas-gauche. */
  .enc-niv {
    position: absolute; left: 10px; bottom: 6px; z-index: 2;
    display: flex; flex-direction: row; align-items: center; gap: 2px; line-height: 1;
  }
  .enc-niv .niv-img { height: 22px; width: auto; display: block; }
  /* Numéro collé à « NIV » et de la MÊME couleur (#73b01e) pour lire « NIV 8 »
     comme un seul bloc de texte. */
  .enc-niv .lvl {
    font-family: 'DSEG7', 'Courier New', monospace; font-weight: bold;
    font-size: 11px; line-height: 1; color: #73b01e;
  }
  /* Raccourcis (mail, événement, historique…) — calés à gauche (début du divider),
     sous la ligne de séparation, resserrés. */
  .mb-shortcuts {
    position: absolute; left: 26%; bottom: 7px; z-index: 2;
    display: flex; align-items: center;
  }
  .sc-btn {
    flex: 0 0 auto; background: transparent; border: 0; padding: 0 1px; margin: 0;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sc-btn img { width: 27px; height: 27px; object-fit: contain; display: block; }
  .sc-btn:active img { transform: scale(.85); }
  /* Voyant : l'icône au repos et sa version allumée sont superposées, et
     alternent en opposition de phase — un vrai clignotement, pas un fondu
     (steps(1)), comme un témoin lumineux. Tant qu'il n'y a rien à signaler, la
     couche allumée reste invisible et rien ne bouge. */
  .sc-btn { position: relative; }
  .sc-btn .ico-alerte {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none;
  }
  .sc-btn:active .ico-alerte { transform: translate(-50%, -50%) scale(.85); }
  .sc-btn.clignote .ico-alerte { animation: sc-allume 1.2s steps(1) infinite; }
  .sc-btn.clignote .ico-repos  { animation: sc-eteint 1.2s steps(1) infinite; }
  @keyframes sc-allume { 0%, 50% { opacity: 0; } 50.01%, 100% { opacity: 1; } }
  @keyframes sc-eteint { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  /* Mouvement réduit : on ne clignote pas, on reste allumé. Le signal demeure. */
  @media (prefers-reduced-motion: reduce) {
    .sc-btn.clignote .ico-alerte { animation: none; opacity: 1; }
    .sc-btn.clignote .ico-repos  { animation: none; opacity: 0; }
  }

  /* ── Emotes (humeurs) : resserrées, SANS bordure ; au clic, la bouille change
     d'HUMEUR (freeze statique `e`, comme le forum — pas l'animation du chat).
     Rangée placée SOUS l'encart niveau. ── */
  .mb-emotes { flex: 0 0 34px; display: flex; align-items: stretch; }
  .em-btn {
    flex: 1 1 0; min-width: 0; margin: 0; padding: 1px;
    background: transparent; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .em-btn img { width: 100%; max-width: 32px; height: auto; display: block; pointer-events: none; }
  .em-btn:active img { transform: scale(.9); }
  .em-btn.active { background: rgba(227,117,106,.20); border-radius: 8px; }

  /* ── Grille des rubriques (plein largeur, 3 colonnes) ── */
  .home-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px;
    padding: 16px 12px 22px;
  }
  /* Bandeau récompense de connexion quotidienne (série de kikooz). */
  .daily-banner {
    margin: 6px 12px 0; padding: 10px 14px; border-radius: 14px;
    background: linear-gradient(135deg, #EAF7CE, #D3ED9E);
    border: 1px solid #B6D97E; box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px;
  }
  .daily-banner .db-flame { font-size: 22px; line-height: 1; }
  .daily-banner .db-main { font-size: 14px; color: #2C4A0F; }
  .daily-banner .db-main strong { color: #3E6A12; }
  .daily-banner .db-sub { flex-basis: 100%; font-size: 11px; color: #5a8a20; }
  .home-tile {
    background: transparent; border: 0; cursor: pointer; padding: 6px 2px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  .home-tile .ico {
    width: 55px; height: 48px; display: flex; align-items: center; justify-content: center;
  }
  .home-tile .ico img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(44,74,15,.35)); transition: transform .1s ease;
  }
  .home-tile:active .ico img { transform: scale(.9); }
  .home-tile .lbl { font-size: 14px; font-weight: bold; color: #2C4A0F; text-align: center; }
  .home-tile:active .lbl { text-decoration: underline; }
  /* Messages privés non lus : sans ce compteur sur l'accueil, un message reçu
     pendant qu'on est ailleurs dans l'appli restait totalement invisible — la
     pastille du bandeau de chat n'est affichée que DANS les salons. */
  .home-tile { position: relative; }
  .home-tile .mp-compte {
    position: absolute; top: 2px; right: 14px; min-width: 20px; height: 20px;
    padding: 0 5px; border-radius: 10px; background: #e63b3b; color: #fff;
    font: bold 12px/20px Verdana, Arial, sans-serif; text-align: center;
    box-shadow: 0 0 0 2px #fff; pointer-events: none;
  }

  /* ── Desktop / tablette (≥768px) : le tiroir s'ouvre en BANDE à gauche (440px)
     PAR-DESSUS le contenu, qui reste visible derrière (le capteur de clic est
     transparent). On le ferme via ‹, un clic à droite, ou en choisissant une
     rubrique. Sous 768px : tiroir plein écran (launcher), comme avant. ── */
  @media (min-width: 768px) {
    #home-panel { width: 440px; }
  }
</style>
<!-- Miniatures de bouilles rapides (cache PNG /bouille-img) pour le Bouilloscope. -->
<script src="/js/bouille-thumb.js"></script>
<!-- Palette de couleurs (sélecteur visuel de l'éditeur « Ma Frutibouille »). -->
<script src="/js/bouille-palette.js"></script>
</head>
<body>

<!-- ───────── Login ───────── -->
<div id="login-screen">
  <img class="lg-logo" src="https://raw.githubusercontent.com/Spender94/Frutiparc/main/public/images/logo.gif" alt="Frutiparc" onerror="this.style.display='none'">
  <div class="card">
    <img class="lg-fruits" src="https://raw.githubusercontent.com/Spender94/Frutiparc/main/public/images/welcome.gif" alt="" onerror="this.style.display='none'">
    <div class="lg-intro">Des fruits, des jeux, du chat !<br>Rejoins l'univers fruité de Frutiparc.</div>

    <!-- Connexion -->
    <form id="login-form" autocomplete="on">
      <label for="li-user">Pseudo</label>
      <input type="text" id="li-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="li-pass">Code secret</label>
      <input type="password" id="li-pass" autocomplete="current-password">
      <button type="submit" class="btn-primary" id="li-btn">Se connecter</button>
      <div class="err" id="li-err"></div>
    </form>
    <button type="button" class="btn-link" id="show-register">S'inscrire gratuitement</button>

    <!-- Inscription (dès la page d'accueil) -->
    <form id="register-form" class="hidden" autocomplete="on">
      <label for="re-user">Pseudo</label>
      <input type="text" id="re-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" minlength="3" maxlength="20">
      <label for="re-pass">Code secret</label>
      <input type="password" id="re-pass" autocomplete="new-password" minlength="6" maxlength="80">
      <label for="re-email">E-mail <span class="opt">— pour récupérer ton code</span></label>
      <input type="email" id="re-email" autocomplete="email" maxlength="120" placeholder="(facultatif)">
      <button type="submit" class="btn-primary" id="re-btn">Créer mon compte</button>
      <div class="err" id="re-err"></div>
    </form>
    <button type="button" class="btn-link hidden" id="show-login">← J'ai déjà un compte</button>
  </div>
</div>

<!-- ───────── App (after login) ───────── -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <!-- Single compact top bar: hamburger · room selector · members.
       Everything else (account, navigation, quitter) lives in the menu drawer
       to keep vertical space for the conversation. -->
  <header id="topbar">
    <button class="icon-btn" id="menu-btn" title="Accueil" aria-label="Retour à l'accueil">‹</button>
    <select id="room-select" aria-label="Salon"></select>
    <button class="icon-btn bare" id="pen-btn" title="Feutre" aria-label="Feutre">
      <img src="/fb/icone_feutres.png" alt="Feutre">
    </button>
    <button class="icon-btn bare" id="bouille-toggle" title="Masquer les bouilles" aria-label="Afficher ou masquer les bouilles" aria-pressed="true">
      <img src="/fb/icone_bouille.png" alt="Bouilles">
    </button>
    <button class="icon-btn bare" id="users-btn" title="Afficher / masquer les connectés" aria-label="Liste des connectés">
      <img src="/fb/icone_liste.png" alt="Connectés">
    </button>
  </header>

  <!-- Capteur de clic « hors tiroir » (transparent) : ferme le menu. -->
  <div id="home-backdrop"></div>

  <!-- ═══════════ Menu (tiroir) du mode mobile ═══════════════════════════════
       Tiroir qui glisse depuis la gauche par-dessus le contenu (qui reste visible
       derrière). Main bar (avatar + encart niveau/classement + emotes + raccourcis)
       puis grille des rubriques. Peuplé par renderHome() ; avatar/niveau/rang par
       loadHomeProfile(). Ouvert par défaut sur mobile, fermé (chat visible) sur PC. -->
  <section id="home-panel">
    <div class="mainbar">
      <div class="mb-top">
        <!-- Avatar Frutibouille (rendu Ruffle) — hauteur = encart + emotes -->
        <div class="mb-avatar">
          <div class="frame">
            <div class="stage" id="home-avatar"></div>
            <img class="cadre" src="/fb/cadre_bouille.svg" alt="">
            <img class="reflet" src="/fb/reflet_bouille.svg" alt="">
          </div>
        </div>
        <!-- Colonne droite : encart niveau (haut) + emotes (bas) -->
        <div class="mb-right">
          <div class="mb-encart">
            <!-- Reflet (brillance) coin supérieur droit -->
            <img class="reflet-niv" src="/fb/reflet_niveau.svg" alt="">
            <!-- Ligne de séparation sous la coupe (rang ↔ raccourcis) -->
            <div class="enc-divider"></div>
            <!-- Barres de progression (9) dans le niveau en cours (haut-gauche) -->
            <div class="enc-progress" id="home-progress"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <!-- Trophée + rang au classement général (haut-centre) -->
            <div class="enc-trophy" title="Rang au classement général">
              <img class="tro" src="/fb/trophee.svg" alt="">
              <span class="val" id="home-rank">—</span>
            </div>
            <!-- Niveau : icône « NIV » agrandie + numéro à la suite, même taille (bas-gauche) -->
            <div class="enc-niv">
              <img class="niv-img" src="/fb/Niveau.svg" alt="NIV">
              <span class="lvl" id="home-level">1</span>
            </div>
            <!-- Raccourcis (mail, événement, historique…) — bas-droite, sans action -->
            <div class="mb-shortcuts" id="home-shortcuts"></div>
          </div>
          <!-- Emotes : au clic, la bouille change d'humeur (freeze statique « forum ») -->
          <div class="mb-emotes" id="home-emotes"></div>
        </div>
      </div>
    </div>

    <!-- Bandeau « récompense de connexion quotidienne » : série + gain du jour.
         Renseigné par loadDailyStatus() → /api/daily-status. Masqué tant que la
         récompense du jour n'est pas versée (l'ident WS la déclenche au boot). -->
    <div class="daily-banner" id="daily-banner" style="display:none"></div>

    <!-- Grille des rubriques (plein largeur, 3 colonnes) -->
    <div class="home-grid" id="home-grid">
      <button class="home-tile" data-go="scores"><span class="ico"><img src="/fb/icone_scores.png" alt="" onerror="this.replaceWith(document.createTextNode('🏆'))"></span><span class="lbl">Scores</span></button>
      <button class="home-tile" data-go="shop"><span class="ico"><img src="/fb/icone_boutique.png" alt="" onerror="this.replaceWith(document.createTextNode('🛍️'))"></span><span class="lbl">Boutique</span></button>
      <button class="home-tile" data-go="disques"><span class="ico"><img src="/fb/icone_jeux.png" alt="" onerror="this.replaceWith(document.createTextNode('💿'))"></span><span class="lbl">Mes disques</span></button>
      <button class="home-tile" data-go="chat"><span class="ico"><img src="/fb/icone_salon.png" alt="" onerror="this.replaceWith(document.createTextNode('💬'))"></span><span class="lbl">Salons</span></button>
      <!-- Les trois rubriques à voyant. Leurs icônes sont celles du BUREAU
           (fileIcon.swf, sprite iconGFX) : l'enveloppe du dossier « mail » et la
           poire de « linkHisto », comme les tuiles voisines viennent de
           « linkScore », « linkShop » ou « inventory ». Le bureau n'a pas d'icône
           pour les événements : on prend celle de leur propre journal (le tam-tam
           de l'information, sprite icoSiteLog de main.swf).
           `data-ico` relie la tuile à son voyant : majVoyant() y accroche le
           compteur, et bascule l'icône du raccourci de l'encart niveau. -->
      <button class="home-tile" data-go="mail" data-ico="Mail"><span class="ico"><img src="/fb/icone_messagerie.svg" alt=""></span><span class="lbl">Messagerie</span></button>
      <button class="home-tile" data-go="evenements" data-ico="Warning"><span class="ico"><img src="/fb/icone_evenements.svg" alt=""></span><span class="lbl">Événements</span></button>
      <button class="home-tile" data-go="historique" data-ico="Historique"><span class="ico"><img src="/fb/icone_historique.svg" alt=""></span><span class="lbl">Historique</span></button>
      <button class="home-tile" data-go="inventaire"><span class="ico"><img src="/fb/inventaire.png" alt="" onerror="this.replaceWith(document.createTextNode('🎒'))"></span><span class="lbl">Inventaire</span></button>
      <button class="home-tile" data-go="forum"><span class="ico"><img src="/fb/icone_forum.png" alt="" onerror="this.replaceWith(document.createTextNode('📋'))"></span><span class="lbl">Forum</span></button>
      <button class="home-tile" data-go="trombi"><span class="ico"><img src="/fb/icone_bouilloscope.png" alt="" onerror="this.replaceWith(document.createTextNode('👥'))"></span><span class="lbl">Bouilloscope</span></button>
    </div>
  </section>

  <!-- Chat -->
  <section class="panel" id="chat-panel" style="position:relative">
    <div id="messages"></div>

    <!-- Bouille overlay: live Ruffle bouille (transparent) reacting to chat,
         centered over the messages, sliding in/out from the left. -->
    <div id="bouille-overlay">
      <div id="bouille-overlay-stage"></div>
      <div id="bouille-overlay-name"></div>
    </div>

    <!-- La FICHE d'un frutiz (winFrutizInfo du bureau). Ouverte en touchant un
         pseudo — dans un salon, la liste des connectés ou le trombinoscope. -->
    <div id="fiche-backdrop">
      <div id="fiche" class="deploye" role="dialog" aria-modal="true" aria-label="Fiche du frutiz">
        <button type="button" id="fiche-fermer" aria-label="Fermer"><img src="/fb/fiche/croix_fermer.png" alt="Fermer"></button>
        <!-- Le bouton ROSE du bureau (butPushSmallPink + son triangle) : au
             bureau il ouvre la partie détaillée, ici il déplie la fiche. -->
        <button type="button" id="fiche-avance" title="Afficher ou masquer le détail" aria-expanded="true"><img src="/fb/fiche/ico_avance.png" alt=""></button>
        <div class="fiche-haut">
          <!-- La plaque verte : la bouille et l'écran de niveau dans un seul
               encart, avec les dessins de la mainbar (cadre, reflets, NIV). -->
          <div class="fiche-plaque">
            <img class="reflet-niv" src="/fb/reflet_niveau.svg" alt="">
            <div class="fa-frame">
              <div class="stage" id="fiche-avatar"></div>
              <img class="cadre" src="/fb/cadre_bouille.svg" alt="">
              <img class="reflet" src="/fb/reflet_bouille.svg" alt="">
            </div>
            <div class="fa-jauge">
              <div class="fa-progress" id="fiche-barres"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="fa-niv"><img src="/fb/Niveau.svg" alt="NIV"><b id="fiche-niveau">1</b></div>
            </div>
          </div>
          <div class="fiche-droite">
            <div class="fiche-nom-ligne">
              <img class="statut" id="fiche-statut" src="/fb/fiche/statut_absent.png" alt=""><b id="fiche-pseudo">…</b>
            </div>
            <div class="fiche-meta" id="fiche-meta"></div>
          </div>
        </div>
        <!-- La rangée du bureau (box.Frutiz.getIconList), avec les VRAIS
             glyphes de main.swf — la feuille `icon` de butPushSmallWhite. On
             n'y met que les gestes QUI MARCHENT sur mobile : trois boutons
             éteints (Bouilloscope, contacts, liste noire) ne servaient qu'à
             prendre la place. Kick, ban et totoché ne se montrent qu'au staff
             qui peut s'en servir. -->
        <div class="fiche-actions">
          <button type="button" id="fiche-mp" title="Discuter en privé"><img src="/fb/fiche/ico_chat.png" alt=""></button>
          <button type="button" id="fiche-mail" title="Lui écrire un message"><img src="/fb/fiche/ico_mail.png" alt=""></button>
          <button type="button" id="fiche-kick" class="modo" title="Éjecter du salon" hidden><img src="/fb/fiche/ico_kick.png" alt=""></button>
          <button type="button" id="fiche-ban" class="modo" title="Bannir" hidden><img src="/fb/fiche/ico_ban.png" alt=""></button>
          <button type="button" id="fiche-totoche" class="modo" title="Totocher (rendre muet)" hidden><img src="/fb/fiche/ico_totoche.png" alt=""></button>
        </div>
        <div class="fiche-corps">
          <div class="fiche-onglets" id="fiche-onglets">
            <button type="button" data-onglet="frutiz" class="actif">Frutiz</button>
            <button type="button" data-onglet="perso">Perso</button>
            <button type="button" data-onglet="scores">Scores</button>
            <button type="button" data-onglet="bonus">Bonus</button>
          </div>
          <div class="fiche-page" id="fiche-page"></div>
        </div>
      </div>
    </div>

    <!-- Feutre (pen) swatch picker, toggled by the feutres icon in the header -->
    <div id="pen-bar"></div>

    <!-- Accent helper: taps insert French accents at the cursor, for keyboards
         that have no easy way to type them (e.g. Finnish). Toggled by the "é"
         button in the composer. -->
    <div id="accent-bar"></div>

    <form class="compose" id="compose-form">
      <button type="button" id="accent-toggle" title="Insérer un accent" aria-label="Insérer un accent" disabled>é</button>
      <input type="text" id="compose-input" placeholder="Message…" autocomplete="off" maxlength="300" disabled>
      <button type="submit" id="compose-send" disabled>Envoyer</button>
    </form>

    <div id="drawer-backdrop"></div>
    <div id="users-drawer">
      <h3>Connectés</h3>
      <!-- Le protocole ne connaît que « qui est dans CE salon ». Le second
           onglet interroge le serveur pour voir tout le site — et dit où
           chacun se trouve, pour qu'on sache où aller le retrouver. -->
      <div id="drawer-onglets">
        <button type="button" class="dr-onglet on" data-vue="salon">Ce salon</button>
        <button type="button" class="dr-onglet" data-vue="site">Tout le site</button>
      </div>
      <button class="users-scroll up" id="users-scroll-up" aria-label="Faire défiler vers le haut"><img src="/fb/bouton_up.png" alt=""></button>
      <div class="list" id="users-list"></div>
      <button class="users-scroll down" id="users-scroll-down" aria-label="Faire défiler vers le bas"><img src="/fb/bouton_up.png" alt=""></button>
    </div>
  </section>

  <!-- Forum — intégré dans une iframe pour ne JAMAIS couper le chat. Tant qu'on
       reste sur /light (l'iframe charge /fb à l'intérieur), la socket de chat de
       la page parente reste vivante. -->
  <section class="panel" id="forum-panel">
    <iframe id="forum-frame" title="Forum Frutiparc" referrerpolicy="no-referrer"></iframe>
  </section>

  <!-- Grapiz — jeu natif chargé en plein écran dans une iframe. On reste sur
       /light (la socket de chat parente n'est jamais coupée) ; Grapiz ouvre sa
       PROPRE socket via ?sid=, comme la popup desktop. -->
  <section class="panel" id="grapiz-panel">
    <iframe id="grapiz-frame" title="Grapiz" referrerpolicy="no-referrer"></iframe>
  </section>

  <!-- Frutibandas — jeu natif (version mobile) chargé dans une iframe. Comme
       Grapiz : on reste sur /light (socket de chat intacte), le jeu ouvre sa
       PROPRE socket via ?sid=. -->
  <section class="panel" id="bandas-panel">
    <iframe id="bandas-frame" title="Frutibandas" referrerpolicy="no-referrer"></iframe>
  </section>

  <!-- Swapou 2 — portage natif canvas chargé dans une iframe. Comme Grapiz :
       on reste sur /light (socket de chat intacte), le jeu lit ?sid= pour la
       persistance (scores, persos, titems). -->
  <section class="panel" id="swapou-panel">
    <iframe id="swapou-frame" title="Swapou 2" referrerpolicy="no-referrer"></iframe>
  </section>

  <!-- Mini-Wave 2 — portage natif canvas, même schéma que Swapou. Le jeu lit
       ?sid= pour charger la fiche du joueur (slot 0) et la réécrire en fin de
       partie : les fruits abattus s'accumulent, les pictos et la consécration
       suivent, exactement comme sur le bureau. -->
  <section class="panel" id="miniwave-panel">
    <iframe id="miniwave-frame" title="Mini-Wave 2" referrerpolicy="no-referrer"></iframe>
  </section>

  <!-- Minipixiz — portage natif canvas du puzzle. Le jeu lit ?sid= pour charger
       la fiche du joueur (slot 0) et la réécrire en fin de course : les objets
       ramassés entrent à l'album, et les pictos suivent. -->
  <section class="panel" id="minipixiz-panel">
    <iframe id="minipixiz-frame" title="Minipixiz" referrerpolicy="no-referrer"></iframe>
  </section>

  <!-- Scores du jour — classement « Challenge » du jour, en lecture seule.
       Panneau plein écran : barre de jeux (chips) collée en haut, tableau
       scrollable en dessous. Rechargé à chaque ouverture (les scores évoluent
       toute la journée), via /api/light/challenge. -->
  <section class="panel" id="scores-panel">
    <div id="scores-head"><div id="scores-tabs"></div></div>
    <div id="scores-body"></div>
  </section>

  <!-- Messagerie interne — la MÊME boîte que celle du bureau (user.mails côté
       serveur), en JSON. Trois vues empilées dans le même panneau : la liste du
       dossier courant, la lecture d'un courrier, la rédaction. Une seule est
       visible à la fois (classe .on), pour ne jamais quitter /light — la socket
       de chat reste vivante pendant qu'on écrit. -->
  <section class="panel" id="mail-panel">
    <div id="mail-head">
      <div id="mail-tabs">
        <button class="mail-tab active" data-folder="inbox" type="button">Reçus</button>
        <button class="mail-tab" data-folder="outbox" type="button">Envoyés</button>
        <button class="mail-tab" data-folder="blackbox" type="button">Indésirables</button>
      </div>
      <button id="mail-new" type="button">Écrire</button>
    </div>

    <!-- Vue liste -->
    <div class="mail-vue on" id="mail-vue-liste"><div id="mail-liste"></div></div>

    <!-- Vue lecture -->
    <div class="mail-vue" id="mail-vue-lecture">
      <div class="mail-entete">
        <div class="ml-sujet" id="mail-lu-sujet"></div>
        <div class="ml-meta"><span id="mail-lu-qui"></span><span id="mail-lu-date"></span></div>
      </div>
      <div class="mail-corps" id="mail-lu-corps"></div>
      <div class="mail-actions">
        <button type="button" class="ma-btn" id="mail-retour">‹ Retour</button>
        <button type="button" class="ma-btn primaire" id="mail-repondre">Répondre</button>
        <button type="button" class="ma-btn danger" id="mail-supprimer">Supprimer</button>
      </div>
    </div>

    <!-- Vue rédaction -->
    <div class="mail-vue" id="mail-vue-ecriture">
      <div class="mail-form">
        <label for="mail-a">À</label>
        <input type="text" id="mail-a" autocomplete="off" autocapitalize="none" autocorrect="off"
               spellcheck="false" placeholder="Pseudo du destinataire" maxlength="120">
        <label for="mail-sujet">Sujet</label>
        <input type="text" id="mail-sujet" autocomplete="off" placeholder="Sujet" maxlength="120">
        <label for="mail-texte">Message</label>
        <textarea id="mail-texte" rows="8" placeholder="Ton message…" maxlength="4000"></textarea>
        <div class="mail-erreur" id="mail-erreur"></div>
      </div>
      <div class="mail-actions">
        <button type="button" class="ma-btn" id="mail-annuler">‹ Annuler</button>
        <button type="button" class="ma-btn primaire" id="mail-envoyer">Envoyer</button>
      </div>
    </div>
  </section>

  <!-- Journaux — deux rubriques bâties sur le même gabarit, parce que le serveur
       leur donne la même forme :
         · Événements : les annonces du site (user.siteLog), que le bureau reçoit
           dans <sl> à l'ident et par la trame <bl> en direct ;
         · Historique : ce qui est arrivé au joueur (user.userLog), servi dans
           <ul> et poussé par la trame <aw>.
       Chaque type d'entrée porte son visuel d'origine, extrait du SWF. -->
  <section class="panel" id="evt-panel">
    <div class="fenetre">
      <div class="fen-titre">
        <img class="fen-ico" src="/fb/icone_fenetre.svg" alt="">
        <span id="evt-titre">Événements</span>
      </div>
      <div id="evt-liste"></div>
      <div class="fen-pied">
        <button type="button" class="fen-page" id="evt-prec" aria-label="Page précédente">
          <img src="/fb/fleche_gauche.svg" alt=""></button>
        <span id="evt-page"></span>
        <button type="button" class="fen-page" id="evt-suiv" aria-label="Page suivante">
          <img src="/fb/fleche_droite.svg" alt=""></button>
      </div>
    </div>
  </section>

  <!-- Trombinoscope — annuaire des Frutiz (pseudo + bouille), trié alpha par le
       serveur. Barre de recherche en tête, grille scrollable de bouilles. -->
  <section class="panel" id="trombi-panel">
    <div id="trombi-head">
      <input id="trombi-search" type="search" placeholder="Rechercher un Frutiz…" autocomplete="off">
      <div id="trombi-letters"></div>

  <!-- Bouille / accessory picker (bottom sheet) -->

  <!-- Mes disques (bottom sheet) — même habillage que l'inventaire d'accessoires,
       mais à la place des bouilles on présente les FrusionDisc des jeux jouables
       (Frutibandas, Grapiz, Swapou). Un clic sur un disque lance le jeu associé. -->
  <div id="disques-sheet-backdrop" class="sheet-backdrop"></div>
  <div id="disques-sheet" class="sheet">

      <span>Mes disques</span>

  <!-- Boutique (bottom sheet) — accessoires achetables + solde kikooz. Les fonds
       d'écran ne sont pas affichés (non exploitables sur mobile). L'achat débite
       les kikooz puis l'accessoire rejoint « Mon inventaire » pour être équipé. -->

  <div id="shop-sheet" class="sheet">

      <span>Boutique</span>
      <button id="shop-sheet-close">✕</button>

    <div class="sheet-body">
      <div class="shop-wallet" id="shop-wallet">…</div>
      <div class="sheet-hint" id="shop-hint">Accessoires disponibles :</div>
      <div id="shop-grid" class="shop-grid"></div>
    </div>
  </div>

  <!-- "Ma Frutibouille" : éditeur de visage (auto-affiché tant que needsBouille).
       Rows + valider sont construits/branchés en JS (openFbEditor). -->
  <div id="fb-editor-backdrop"></div>
  <div id="fb-editor" role="dialog" aria-modal="true" aria-label="Ma Frutibouille">
    <div class="fb-titletab"><img src="/fb/icone_bouille.png" alt="">Ma Frutibouille</div>
    <div class="fb-preview" id="fb-editor-preview"></div>
    <div class="fb-rows" id="fb-editor-rows"></div>
    <button class="fb-valider" id="fb-editor-valider" type="button">valider</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  function $(s) { return document.querySelector(s); }
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  // Public salons (mirror server-side `channels`), in display order. pomme
  // (Salon Anim's) is FIRST so it's the salon the mobile client joins by default.
  // The names below are just the initial labels: the live, admin-editable names
  // arrive via the channellist <q><desc> and override them (see the "q" handler),
  // so renaming a salon in /admin updates the mobile list automatically.
  var ROOMS = [
    ["pomme", "Salon Anim's"], ["abricot", "Temple du Grand Piquant"],
    ["poire", "Montagne des Loups-Garous"], ["fraise", "Fruti-Théâtre"],
    ["citron", "Marais d'Ornegon"], ["kiwi", "Laboratoire KiwiX"],
    ["raisin", "Plage Banana-Nuit"], ["orange", "Taverne Far-Zest"],
    ["cerise", "Île olympique de Môh"], ["banane", "Forêt Enchantée"],
    ["bienvenue", "Nuage d'Égerie"],
  ];
  var ROOM_LABELS = {};
  ROOMS.forEach(function (r) { ROOM_LABELS[r[0]] = r[1]; });
  // Display name for a room id: prefer the live admin label (from the
  // channellist), then the built-in label above, then a capitalised id (so a
  // private "pm_a_b" room never shows a raw id).
  function roomLabel(id) {
    if (state && state.roomLabels && state.roomLabels[id]) return state.roomLabels[id];
    if (ROOM_LABELS[id]) return ROOM_LABELS[id];
    var s = String(id || "");
    if (s.indexOf("pm_") === 0 || s.indexOf("pm2_") === 0) return "Discussion privée";
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  // Le salon où les ANIMATEURS ont les droits de modération (tête de liste,
  // « ! » rouge gras, /kick, /image) — aligné sur ANIM_CHANNEL côté serveur.
  var SALON_ANIM = "pomme";

  var state = {
    sid: "",
    user: "",          // display name
    userLower: "",
    room: "",
    ws: null,
    connected: false,
    reconnectTimer: null,
    intentionalClose: false,
    usersByRoom: {},   // room -> { pseudo: { staff } } (m="1" du salon)
    bouilleByUser: {},
    jeuByUser: {}, // lowercased pseudo -> bouille state string "f"
    overlayTimer: null,
    pen: "",           // selected feutre index ("" = default colour, "mc" = multicolore)
    ownedFeutres: [],  // feutres spéciaux possédés (ex. "mc") — profil serveur
    roomCounts: {},    // room id -> participant count (from channellist <q>)
    roomLabels: {},    // room id -> live admin label (from channellist <q><desc>)
    bouillesEnabled: true, // show the bouille reaction overlay (off = "light" mode)
    // ── Discussions privées ──
    // Le protocole les traite comme des salons, nommés "pm2_<a>__<b>". On garde
    // ici, par identifiant de salon, avec qui on parle, le mot de passe transmis
    // par le serveur et le nombre de messages pas encore lus. À la différence
    // des salons publics, on ne les QUITTE jamais : rester abonné est ce qui
    // permet de recevoir la suite de la conversation pendant qu'on lit ailleurs.
    prives: {},        // id de salon -> { avec: "Pseudo", pass: "", nonLus: 0 }
  };

  var DEFAULT_BOUILLE = "000000010000000000000000";

  // (Re)build the room <option>s, appending the live participant count as
  // "Pomme (3)". A count of 0 shows no parenthesis. Preserves the current
  // selection. Called on startApp and whenever a channellist <q> arrives.
  function renderRoomOptions() {
    var sel = document.getElementById("room-select");
    if (!sel) return;
    var current = sel.value || (state && state.room) || ROOMS[0][0];
    sel.innerHTML = "";
    var gSalons = document.createElement("optgroup");
    gSalons.label = "Salons";
    ROOMS.forEach(function (r) {
      var n = state.roomCounts[r[0]] || 0;
      var o = document.createElement("option");
      o.value = r[0];
      o.textContent = roomLabel(r[0]) + (n > 0 ? " (" + n + ")" : "");
      gSalons.appendChild(o);
    });
    sel.appendChild(gSalons);
    // Discussions privées ouvertes pendant la session, avec leur compte de
    // messages non lus — c'est le seul endroit où elles sont visibles, d'où le
    // badge : sans lui, un message reçu pendant qu'on est dans un salon passerait
    // inaperçu.
    var ids = Object.keys(state.prives);
    if (ids.length) {
      var gPrives = document.createElement("optgroup");
      gPrives.label = "Messages privés";
      ids.sort(function (a, b) {
        return state.prives[a].avec.toLowerCase().localeCompare(state.prives[b].avec.toLowerCase());
      }).forEach(function (id) {
        var c = state.prives[id];
        var o = document.createElement("option");
        o.value = id;
        o.textContent = c.avec + (c.nonLus > 0 ? " (" + c.nonLus + " nouveau" + (c.nonLus > 1 ? "x" : "") + ")" : "");
        gPrives.appendChild(o);
      });
      sel.appendChild(gPrives);
    }
    sel.value = current;
  }

  // ── Discussions privées ───────────────────────────────────────────────────
  // Un salon privé porte un identifiant "pm2_<a>__<b>" ; le serveur le crée à la
  // demande et y abonne les deux participants. Côté page, il suffit de le retenir
  // pour l'afficher dans le sélecteur et router ses messages.
  function estPrive(id) {
    return String(id || "").indexOf("pm_") === 0 || String(id || "").indexOf("pm2_") === 0;
  }
  function retenirPrive(id, avec, pass) {
    if (!id) return null;
    if (!state.prives[id]) state.prives[id] = { avec: avec || "?", pass: pass || "", nonLus: 0 };
    else {
      if (avec) state.prives[id].avec = avec;
      if (pass) state.prives[id].pass = pass;
    }
    renderRoomOptions();
    return state.prives[id];
  }
  // Ouvre (ou rouvre) une discussion avec un joueur. Le serveur répond par un
  // <r> qui porte l'identifiant du salon — c'est lui qui décide du nom, pas nous.
  function ouvrirPrive(pseudo) {
    var p = String(pseudo || "").trim();
    if (!p || p.toLowerCase() === state.userLower) return;
    wsSend('<r u="' + xmlEscape(p) + '" r="mp' + Date.now() + '" />');
  }

  // ── XML helpers (CBee protocol) ──
  // For ATTRIBUTES (sid, room, pseudo): full escaping, incl. & and ".
  function xmlEscape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // For the message BODY: escape "&", "<" and ">" as proper XML entities. The
  // server normalises every incoming body with escapeXml(unescapeXml(body))
  // before rebroadcasting — an idempotent single level of escaping — and BOTH
  // clients unescape on receive (Flash's htmlText, and our xmlUnescape here). So
  // "&lt;"/"&gt;" survive the round-trip and arrive as the literal "<"/">" on
  // every client, with NO double-escaping. (We previously swapped "<"/">" for
  // the look-alike guillemets ‹ › to dodge the server's content parser, which
  // truncates at a *literal* "<" — but entities contain no literal "<", so they
  // pass through cleanly and the real characters are preserved.)
  function bodyEscape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function xmlUnescape(s) {
    return String(s == null ? "" : s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'").replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  }
  function attr(xml, name) {
    var m = xml.match(new RegExp("\\b" + name + '="([^"]*)"'));
    return m ? m[1] : "";
  }
  function tagName(xml) {
    var m = xml.match(/^<(\w+)/);
    return m ? m[1] : "";
  }
  function bodyOf(xml) {
    // text between the first '>' and the matching '</'
    var m = xml.match(/^<[^>]*>([\s\S]*)<\/[^>]+>$/);
    return m ? m[1] : "";
  }
  // Many admin/system chat frames carry their text inside a CDATA section, often
  // wrapping a little HTML (e.g. "<![CDATA[<i>X a été totoché</i>]]>"). Peel the
  // CDATA wrapper so we can render the announcement instead of "[cadeau]".
  function stripCdata(s) {
    var m = String(s == null ? "" : s).match(/^\s*<!\[CDATA\[([\s\S]*?)\]\]>\s*$/);
    return m ? m[1] : s;
  }
  // Reduce the small HTML the server uses in admin announces (<i>, <b>,
  // <font color>) to readable plain text for the mobile chat line.
  function htmlToText(s) {
    return xmlUnescape(String(s == null ? "" : s).replace(/<br\s*\/?>/gi, " ").replace(/&nbsp;/gi, " ").replace(/<[^>]+>/g, "")).trim();
  }
  // Case-insensitive pseudo comparison (server sends display names; state.user
  // may differ only by case).
  function sameName(a, b) {
    return String(a == null ? "" : a).toLowerCase() === String(b == null ? "" : b).toLowerCase();
  }

  // ── Login ──
  // ── Session persistence (survive F5 / rotation reloads) ──
  // The sid is the only thing needed to resume; we keep it in localStorage and
  // re-validate it on load via /api/forum/me (returns {user} if still valid).
  var SESS_KEY = "fp_light_session";
  function saveSession() {
    try { localStorage.setItem(SESS_KEY, JSON.stringify({ sid: state.sid, user: state.user })); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESS_KEY); } catch (e) {}
  }
  function tryResumeSession(cb) {
    // Prefer a sid already on state (set from ?sid= in the URL), else the one
    // saved in localStorage.
    var sid = state.sid;
    if (!sid) {
      var raw; try { raw = localStorage.getItem(SESS_KEY); } catch (e) { raw = null; }
      if (raw) { try { sid = (JSON.parse(raw) || {}).sid; } catch (e) {} }
    }
    if (!sid) { cb(false); return; }
    // Validate the sid server-side before skipping the login screen.
    fetch("/api/forum/me?sid=" + encodeURIComponent(sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.user) {
          state.sid = sid;
          state.user = d.user;
          state.userLower = String(d.user).toLowerCase();
          saveSession();
          startApp();
          cb(true);
        } else {
          clearSession();
          state.sid = "";
          cb(false);
        }
      })
      .catch(function () { cb(false); });
  }

  // Shared login: POST credentials then resume the app. Reused by the login
  // form AND by the registration flow (auto-login right after sign-up).
  function doLogin(user, pass, opts) {
    opts = opts || {};
    var errEl = opts.errEl, btn = opts.btn, label = opts.label || "Se connecter";
    if (errEl) errEl.textContent = "";
    if (!user || !pass) { if (errEl) errEl.textContent = "Pseudo et code secret requis."; return; }
    if (btn) { btn.disabled = true; btn.textContent = "Connexion…"; }
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (!res.ok || !res.d || !res.d.ok) {
          if (errEl) errEl.textContent = (res.d && res.d.message) || "Identifiants invalides.";
          return;
        }
        state.sid = res.d.sid;
        state.user = res.d.username || user;
        state.userLower = String(state.user).toLowerCase();
        saveSession();
        startApp();
      })
      .catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (errEl) errEl.textContent = "Erreur réseau. Réessaie.";
      });
  }

  var loginForm = $("#login-form");
  loginForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    doLogin($("#li-user").value.trim(), $("#li-pass").value, { errEl: $("#li-err"), btn: $("#li-btn"), label: "Se connecter" });
  });

  // ── Inscription depuis la page d'accueil ──
  var registerForm = $("#register-form");
  function setAuthMode(register) {
    loginForm.classList.toggle("hidden", register);
    $("#show-register").classList.toggle("hidden", register);
    registerForm.classList.toggle("hidden", !register);
    $("#show-login").classList.toggle("hidden", !register);
    $("#li-err").textContent = ""; $("#re-err").textContent = "";
  }
  $("#show-register").addEventListener("click", function () { setAuthMode(true); var u = $("#re-user"); if (u) u.focus(); });
  $("#show-login").addEventListener("click", function () { setAuthMode(false); var u = $("#li-user"); if (u) u.focus(); });
  registerForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var user = $("#re-user").value.trim();
    var pass = $("#re-pass").value;
    var email = $("#re-email").value.trim();
    var errEl = $("#re-err"); errEl.textContent = "";
    if (!user || !pass) { errEl.textContent = "Pseudo et code secret requis."; return; }
    var btn = $("#re-btn"); btn.disabled = true; btn.textContent = "Création…";
    var body = { username: user, password: pass };
    if (email) body.email = email;
    fetch("/api/auth/register", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d || !res.d.ok) {
          btn.disabled = false; btn.textContent = "Créer mon compte";
          errEl.textContent = (res.d && res.d.message) || "Inscription impossible.";
          return;
        }
        // Compte créé → on connecte directement avec les mêmes identifiants.
        doLogin(user, pass, { errEl: errEl, btn: btn, label: "Créer mon compte" });
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = "Créer mon compte";
        errEl.textContent = "Erreur réseau. Réessaie.";
      });
  });

  // ── App start ──
  function startApp() {
    $("#login-screen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    var wn = $("#who-name"); if (wn) wn.textContent = state.user; // (plus de pseudo affiché sur l'accueil)

    // Build room selector (labels get a "(n)" participant count, see
    // renderRoomOptions / the channellist handler).
    renderRoomOptions();
    var sel = $("#room-select");
    sel.value = ROOMS[0][0];
    sel.addEventListener("change", function () { switchRoom(sel.value); });

    // On construit la main bar du menu (emotes + raccourcis) puis on charge le
    // profil (avatar, niveau, rang). Le chat (Salon) est le contenu par défaut,
    // toujours présent derrière. Mobile → on ouvre le tiroir (on atterrit sur le
    // menu) ; desktop → tiroir fermé (le chat est visible, le menu s'ouvre via ‹).
    renderHome();
    activateTab("chat");
    if (!isDesktop()) openMenu(true);
    loadHomeProfile();
    loadDailyStatus();

    connectWs();

    // Premier passage (ou redo admin) : proposer l'éditeur de Frutibouille tant
    // que la bouille n'est pas définie. Cf. maybeOpenFbEditor / needsBouille.
    maybeOpenFbEditor();
  }

  // ── Navigation : le MENU est un TIROIR (overlay) ──
  // Le contenu (chat/forum/jeux) est toujours présent en pleine largeur ; le menu
  // glisse PAR-DESSUS depuis la gauche (#app.menu-open). Mobile : tiroir plein
  // écran. Desktop/tablette : bande de 440px, le contenu reste visible derrière
  // (capteur de clic transparent). On ouvre/ferme via ‹, on ferme via un clic à
  // droite (#home-backdrop) ou en choisissant une rubrique.
  function isDesktop() {
    try { return window.matchMedia("(min-width: 768px)").matches; } catch (e) { return false; }
  }
  function openMenu(open) { $("#app").classList.toggle("menu-open", open !== false); }
  function closeMenu() { $("#app").classList.remove("menu-open"); }
  function toggleMenu() { $("#app").classList.toggle("menu-open"); }
  function goHome() { openMenu(true); } // compat : « accueil » = ouvrir le tiroir
  $("#menu-btn").addEventListener("click", toggleMenu);
  $("#home-backdrop").addEventListener("click", closeMenu);

  // ── Main bar de l'accueil : avatar, niveau, emotes (humeurs), raccourcis ──
  // Emotes → humeur de la bouille via le param `e` de bouille-preview (freeze
  // statique, EXACTEMENT comme le forum — pas l'animation transitoire du chat).
  // Les 7 icônes fournies couvrent les humeurs e=1..7 (cf. EXPRESSIONS du forum).
  var HOME_EMOTES = [
    { file: "emote_mechant", e: 1, name: "Colère" },
    { file: "emote_triste",  e: 2, name: "Triste" },
    { file: "emote_content", e: 3, name: "Sourire" },
    { file: "emote_ravi",    e: 4, name: "Joie" },
    { file: "emote_stoique", e: 5, name: "Déterminé" },
    { file: "emote_transi",  e: 6, name: "Embarrassé" },
    { file: "emote_fou",     e: 7, name: "Totoché" },
  ];
  // Raccourcis de l'encart niveau. `go` = rubrique ouverte au clic (les autres
  // restent inertes en attendant d'être branchées). `voyant` désigne l'icône de
  // remplacement quand il y a du neuf : pour la messagerie, c'est l'enveloppe
  // d'alerte rouge de main.swf (forme #373, celle de la barre de pictos
  // d'alerte), extraite du SWF d'origine — cf. scripts/extract-swf-shapes.js.
  // L'enveloppe verte au repos (Mail.svg) est la forme #420, celle de la bande
  // d'icônes de raccourcis (sprite #427).
  // `file` / `voyant` : l'icône du raccourci (bande digitalIcon du SWF) et sa
  // variante d'alerte. `tuile` / `tuileVoyant` : l'icône de la grille, prise au
  // jeu d'icônes du BUREAU (fileIcon.swf). Seule la messagerie a deux états côté
  // bureau — c'est une boîte aux lettres, avec son drapeau qui se lève.
  var HOME_SHORTCUTS = [
    { file: "Mail",       name: "Messagerie", go: "mail",       voyant: "MailRecu",         mot: "message",
      tuile: "icone_messagerie", tuileVoyant: "icone_messagerie_pleine" },
    { file: "Warning",    name: "Événements", go: "evenements", voyant: "WarningAlerte",    mot: "événement",
      tuile: "icone_evenements" },
    { file: "Historique", name: "Historique", go: "historique", voyant: "HistoriqueAlerte", mot: "événement",
      tuile: "icone_historique" },
    { file: "Aide",       name: "Aide" },
    { file: "Forum",      name: "Forum", go: "forum" },
    { file: "Jeux",       name: "Jeux", go: "disques" },
  ];
  function raccourci(fichier) {
    for (var i = 0; i < HOME_SHORTCUTS.length; i++)
      if (HOME_SHORTCUTS[i].file === fichier) return HOME_SHORTCUTS[i];
    return null;
  }
  // Voyant d'une rubrique : l'icône passe à sa variante d'alerte et un compteur
  // s'y accroche. Trois rubriques s'en servent (courrier, événements,
  // historique) et chacune apparaît à DEUX endroits — le raccourci de l'encart
  // niveau et la tuile de la grille. Une seule fonction les tient toutes, sinon
  // un endroit finirait par signaler ce que l'autre ignore.
  // Les voyants clignotent ENSEMBLE. Une animation CSS démarre au moment où la
  // classe est posée ; comme chaque compteur arrive de sa propre requête, les
  // trois partiraient décalés et le bandeau ressemblerait à une guirlande. Un
  // délai négatif recale chacun sur la même horloge.
  var CYCLE_VOYANT = 1200;                 // doit valoir la durée de @keyframes
  var departVoyants = Date.now();
  function caler(bouton) {
    var phase = -((Date.now() - departVoyants) % CYCLE_VOYANT) + "ms";
    Array.prototype.forEach.call(bouton.querySelectorAll("img"), function (i) {
      i.style.animationDelay = phase;
    });
  }
  function majVoyant(fichier, n) {
    var def = raccourci(fichier);
    if (!def) return;
    var cibles = document.querySelectorAll(
      '#home-shortcuts .sc-btn[data-sc="' + fichier + '"], .home-tile[data-ico="' + fichier + '"]');
    var titre = def.name + (n ? " — " + n + " " + (def.mot || "élément") + (n > 1 ? "s" : "")
      + " non lu" + (n > 1 ? "s" : "") : "");
    Array.prototype.forEach.call(cibles, function (e) {
      e.title = titre;
      if (e.classList.contains("home-tile")) {
        // La tuile porte l'icône du bureau, qui a parfois deux états (la boîte
        // aux lettres lève son drapeau). Rien d'autre : le bureau d'origine ne
        // pose aucune pastille sur ses icônes.
        var img = e.querySelector("img");
        var src = "/fb/" + ((n > 0 && def.tuileVoyant) ? def.tuileVoyant : def.tuile) + ".svg";
        if (img && def.tuile && img.getAttribute("src") !== src) img.setAttribute("src", src);
        return;
      }
      // Le raccourci clignote : les deux couches sont déjà en place, il suffit
      // de lancer ou d'arrêter l'alternance.
      var allume = n > 0 && !!def.voyant;
      if (allume) caler(e);
      e.classList.toggle("clignote", allume);
    });
  }
  var homeProfile = { bouille: DEFAULT_BOUILLE, level: 1, xp: 0, rank: null, kikooz: 0 };

  // Taux de complétion du niveau EN COURS — réplique EXACTE de main.swf
  // (frutiengine/UserMng.as : xpLevelCompletionRate) :
  //   level      = floor(sqrt(xp/10000)+1)
  //   levelToXp(L) = (L-1)² · 10000        (XP au début du palier L)
  //   rate       = (xp - levelToXp(level)) / (levelToXp(level+1) - levelToXp(level))
  // Les 9 barres se remplissent de gauche à droite à ce pourcentage (0..1).
  function levelProgress(xp, level) {
    var L = Math.max(1, Number(level) || 1);
    var lo = 10000 * Math.pow(L - 1, 2);
    var hi = 10000 * Math.pow(L, 2);
    if (hi <= lo) return 0;
    return Math.max(0, Math.min(1, ((Number(xp) || 0) - lo) / (hi - lo)));
  }
  function setHomeProgress(xp, level) {
    var cont = $("#home-progress");
    if (!cont) return;
    var r = levelProgress(xp, level);            // taux de complétion 0..1
    var bars = cont.querySelectorAll("i");
    var n = bars.length || 9;
    for (var i = 0; i < bars.length; i++) {
      // Remplissage du BAS vers le HAUT : la barre du bas (dernière du DOM) est la
      // 1re à se remplir, celle du haut la dernière. Segment s = n-1-i ⇒ la barre
      // se remplit ENTIÈREMENT (gauche → droite) avant que celle du dessus commence.
      // À 58 % / 9 barres : les 5 du bas pleines, la 6e à ~22 %, les 3 du haut vides.
      var f = Math.max(0, Math.min(1, r * n - (n - 1 - i)));
      bars[i].style.setProperty("--f", (f * 100).toFixed(1) + "%");
    }
  }
  var homeMood = 0;          // humeur courante affichée par l'avatar (0 = neutre)
  var homeAvatarUrl = "";    // URL Ruffle courante (évite les reboots inutiles)

  function setHomeAvatar(stateStr, mood) {
    var stage = $("#home-avatar"); if (!stage) return;
    var s = String(stateStr || DEFAULT_BOUILLE).replace(/[^0-9A-Za-z]/g, "");
    var q = "s=" + encodeURIComponent(s) + "&bg=transparent";
    if (mood && Number(mood) > 0) q += "&e=" + encodeURIComponent(Number(mood));
    var url = "/bouille-preview.html?" + q;
    if (url === homeAvatarUrl && stage.firstChild) return; // déjà à jour
    homeAvatarUrl = url;
    stage.innerHTML = '<iframe scrolling="no" aria-hidden="true" '
      + 'sandbox="allow-scripts allow-same-origin" src="' + url + '"></iframe>';
  }
  function refreshHomeAvatar() {
    // Bouille live (changement d'accessoire en session) sinon celle du profil.
    var b = (state.bouilleByUser && state.bouilleByUser[state.userLower])
      || homeProfile.bouille || DEFAULT_BOUILLE;
    setHomeAvatar(b, homeMood);
  }
  function setHomeMood(mood) {
    homeMood = Number(mood) || 0;
    Array.prototype.forEach.call(document.querySelectorAll("#home-emotes .em-btn"), function (b) {
      b.classList.toggle("active", Number(b.getAttribute("data-e")) === homeMood);
    });

  }
  function renderHome() {
    var em = $("#home-emotes");
    if (em && !em.childNodes.length) {
      HOME_EMOTES.forEach(function (it) {
        var b = el("button", "em-btn");
        b.type = "button"; b.title = it.name; b.setAttribute("data-e", it.e);
        b.innerHTML = '<img src="/fb/' + it.file + '.svg" alt="' + xmlEscape(it.name) + '">';
        // Recliquer la même humeur revient au neutre.

    var sc = $("#home-shortcuts");

      HOME_SHORTCUTS.forEach(function (it) {

        b.setAttribute("data-sc", it.file);
        // Deux couches : l'icône au repos, et la version allumée par-dessus. Le
        // clignotement n'est qu'une classe posée sur le bouton — aucun minuteur.
        b.innerHTML = '<img class="ico-repos" src="/fb/' + it.file + '.svg" alt="' + xmlEscape(it.name) + '">'
          + (it.voyant ? '<img class="ico-alerte" src="/fb/' + it.voyant + '.svg" alt="" aria-hidden="true">' : '');
        if (it.go) b.addEventListener("click", function () {
          if (it.go === "disques") return openDisquesSheet();
          activateTab(it.go);
        });
        sc.appendChild(b);
      });
      // Les icônes peuvent déjà avoir à signaler quelque chose (le profil a pu
      // répondre avant que la grille ne soit construite).
      majVoyant("Mail", mailNonLus);
      Object.keys(JOURNAUX).forEach(function (cle) {
        majVoyant(JOURNAUX[cle].raccourci, journalEtat[cle].nonLus);
      });
    }
  }
  function loadHomeProfile() {
    if (!state.sid) { setHomeAvatar(DEFAULT_BOUILLE, homeMood); return; }
    fetch("/api/light/profile?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && !d.error) {
          homeProfile.bouille = d.bouille || DEFAULT_BOUILLE;
          homeProfile.level = Number(d.level) || 1;
          homeProfile.xp = Number(d.xp) || 0;
          homeProfile.rank = (d.rank != null) ? Number(d.rank) : null;
          homeProfile.kikooz = Number(d.kikooz) || 0;
          setMailNonLus(d.mailUnread);                       // voyants messagerie…
          setJournalNonLus("evenements", d.eventsUnread);    // …événements…
          setJournalNonLus("historique", d.historyUnread);   // …et historique
          state.ownedFeutres = Array.isArray(d.ownedFeutres) ? d.ownedFeutres : [];
          if (d.bouille) state.bouilleByUser[state.userLower] = d.bouille;
          var lv = $("#home-level"); if (lv) lv.textContent = homeProfile.level;
          var rk = $("#home-rank"); if (rk) rk.textContent = (homeProfile.rank != null) ? homeProfile.rank : "—";
          setHomeProgress(homeProfile.xp, homeProfile.level);
        }
        refreshHomeAvatar();

      .catch(function () { refreshHomeAvatar(); });

  // Récompense de connexion quotidienne : bandeau « 🔥 Série de N jours · +X
  // kikooz aujourd'hui ». La récompense est versée côté serveur par l'ident WS
  // (au boot) ; on lit l'état ici pour l'afficher. Appelé au boot ET à la
  // réception de la réponse ident ("k") pour refléter le gain qui vient d'être
  // crédité.
  function renderDailyBanner(d) {
    var el = $("#daily-banner"); if (!el) return;
    if (!d || !d.ok || !d.claimedToday) { el.style.display = "none"; return; }

      '<span class="db-sub">Reviens demain pour ne pas perdre ta série !</span>';

  }
  function loadDailyStatus() {
    if (!state.sid) return;
    fetch("/api/daily-status?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        renderDailyBanner(d);
        if (d && d.ok && typeof d.kikooz === "number") homeProfile.kikooz = d.kikooz;
      })
