<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Frutiparc — Mobile</title>
<style>
  /* Frutiparc green palette — same family as forum / admin / Club. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #ADE76B;
    color: #2C4A0F;
    font-family: 'Verdana', Arial, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    /* Height is driven by JS from window.visualViewport (the area NOT covered by
       the mobile keyboard) via the --app-h custom property; the static values
       are fallbacks for browsers without visualViewport. overflow:hidden on
       html+body stops the whole page scrolling when the keyboard opens — only
       the #messages list scrolls. */
    height: 100vh;
    height: 100dvh;
    height: var(--app-h, 100dvh);
    overflow: hidden;
    position: fixed;
    left: 0; right: 0; top: 0;
  }
  a { color: #2f6b16; }
  button { font-family: inherit; cursor: pointer; }
  /* The post-login app area is white; only the central chat zone is green, so
     the header (top bar) and footer (composer) read as white, not green. */
  #app { background: #fff; position: relative; }

  /* ── Single compact top bar ── */
  #topbar {
    background: #fff; border-bottom: 1px solid #DDDDDD;
    padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  /* Room selector: narrower now that it shares the bar with the three icon
     buttons (feutres / bouilles / liste). Verdana text in #D16767, rounded. */
  #topbar select {
    flex: 1 1 auto; min-width: 0; padding: 8px; font-size: 15px;
    border: 1px solid #f3b0b0; border-radius: 8px; background: #fff;
    color: #D16767; font-family: 'Verdana', Arial, sans-serif;
  }
  #topbar select option { color: #D16767; font-family: 'Verdana', Arial, sans-serif; }
  /* Brief asked for "alternance de #FEC9C9 et #FEC9C9" (same hex twice); we use a
     slightly lighter pink for the second band so the alternation is visible
     where the browser honours <option> colours (e.g. Android Chrome). */
  #topbar select option:nth-child(odd)  { background: #FEC9C9; }
  #topbar select option:nth-child(even) { background: #FFE4E4; }
  /* Buttons: pink (#FEABAB) with white glyphs/text (e.g. the hamburger ☰). */
  .icon-btn {
    background: #FEABAB; border: 0; border-radius: 7px;
    font-size: 17px; line-height: 1; padding: 7px 10px; color: #fff; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn img { width: 22px; height: 22px; display: block; object-fit: contain; }
  /* The three header icons (feutres / bouilles / liste) are shown as bare PNGs:
     no chip background or border, just the image. State lives on the image — a
     subtle lift when active, dimmed when the toggle is "off". */
  .icon-btn.bare { background: transparent; border: 0; padding: 3px; }
  .icon-btn.bare img { width: 40px; height: 40px; }
  .icon-btn.bare.on { transform: scale(1.08); filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .icon-btn.bare.off { opacity: .35; }
  #menu-btn { font-size: 18px; }

  /* (L'ancien tiroir hamburger #menu-drawer a été remplacé par le launcher
     plein écran #home-panel — voir la section « Accueil mobile » plus bas.) */

  /* ── Bottom sheets (inventaire + Mes disques partagent ce châssis) ── */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none;
  }
  .sheet-backdrop.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: #ffffff; border: 1px solid #6c6c6c;
    border-radius: 10px 10px 0 0; max-height: 76vh; display: flex; flex-direction: column;
    transform: translateY(110%); transition: transform .25s ease;
    box-shadow: 0 0 0 1px #DDDDDD, 0 -8px 24px rgba(44,74,15,.3);
  }
  .sheet.show { transform: translateY(0); }
  .sheet .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; font-weight: bold; color: #2C4A0F;
    border-bottom: 1px solid #DDDDDD;
  }
  .sheet .sheet-head button {
    background: transparent; border: 0; font-size: 18px; color: #2C4A0F;
  }
  /* Inventory body: a yellow card inset from the white sheet, framed by a
     yellow (#EAEA0E) border + a grey "sur-bordure". */
  .sheet .sheet-body {
    padding: 12px 14px; margin: 0 5px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #F8F866; border: 1px solid #EAEA0E; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD;
  }
  .sheet-preview { display: none; justify-content: center; margin-bottom: 10px; }
  #bouille-sheet-preview {
    width: 132px; height: 132px; background: #fff; border: 2px solid #DDDDDD;
    border-radius: 14px; overflow: hidden;
  }
  #bouille-sheet-preview iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .sheet-hint { font-size: 12px; color: #2f5510; margin-bottom: 8px; font-weight: bold; }
  /* Accessory grid: bouilles laid side by side on the yellow inventory card,
     with no per-item frame or background (cf. the boutique "Accessoires"). */
  .acc-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #F8F866; border-radius: 10px; padding: 0 10px 10px;
  }
  .acc-item {
    background: transparent; border: 0; border-radius: 8px;
    padding: 4px 2px; text-align: center; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .acc-item.sel .thumb { box-shadow: 0 0 0 2px #D16767; }
  .acc-item.sel .lbl { color: #D16767; }
  .acc-item .thumb {
    width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden;
    background: transparent; position: relative;
  }
  /* The Ruffle preview iframe must NOT eat the tap, otherwise the .acc-item
     click never fires and selection silently does nothing. pointer-events:none
     lets the tap fall through to the card. */
  .acc-item .thumb iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  /* Transparent overlay above the iframe guarantees the whole tile is tappable
     (belt-and-suspenders on browsers that still route touch to the iframe). */
  .acc-item .thumb::after { content: ""; position: absolute; inset: 0; }
  .acc-item .lbl {
    font-size: 10px; color: #2C4A0F; margin-top: 4px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Mes disques: same yellow inventory card as the accessory grid, but each tile
     is a static FrusionDisc PNG that launches its game on tap. */
  .fd-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    background: #F8F866; border-radius: 10px; padding: 6px 10px 12px;
  }
  .fd-item {
    background: transparent; border: 0; padding: 4px 2px; text-align: center;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  /* Disque réduit à 70 % de la cellule (−30 %), centré. */
  .fd-item .thumb {
    width: 70%; margin: 0 auto; aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
  }
  .fd-item .thumb img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(44,74,15,.4));
    transition: transform .1s ease;
  }
  .fd-item:active .thumb img { transform: scale(.92); }
  .fd-item .lbl {
    font-size: 11px; color: #2C4A0F; margin-top: 5px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Boutique ── solde kikooz + cartes d'accessoires (aperçu, prix, achat) */
  .shop-wallet {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; color: #6b4a00; font-weight: bold; margin-bottom: 10px;
    background: #FFF3B0; border: 1px solid #EAD93A; border-radius: 8px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 9px 12px;
  }
  .shop-wallet strong { color: #2C4A0F; font-size: 16px; }
  .shop-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    background: #F8F866; border-radius: 10px; padding: 6px 10px 12px;
  }
  .shop-item {
    background: #fff; border: 1px solid #EAD93A; border-radius: 8px;
    padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .shop-item .thumb {
    width: 86px; height: 86px; border-radius: 8px; overflow: hidden;
    background: #fff; border: 1px solid #EEE; position: relative;
  }
  .shop-item .thumb iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  .shop-name {
    font-size: 12px; font-weight: bold; color: #2C4A0F; text-align: center;
    line-height: 1.2; min-height: 28px; display: flex; align-items: center;
  }
  .shop-price { font-size: 12px; font-weight: bold; color: #b06a00; }
  .shop-buy {
    width: 100%; padding: 7px 0; border: 1px solid #F48081; border-radius: 8px;
    background: #FFAAAD; color: #660000; font-weight: bold; font-size: 13px;
    box-shadow: 0 0 0 1px #DDDDDD; cursor: pointer;
  }
  .shop-buy:active { background: #ff9699; }
  .shop-buy:disabled { opacity: .9; cursor: default; }
  .shop-buy.owned {
    background: #D6F7B5; border-color: #ADE76B; color: #2f6b16; box-shadow: none;
  }
  #shop-hint.ok { color: #2f6b16; }
  #shop-hint.err { color: #b23b2e; }

  /* ── "Ma Frutibouille" : éditeur de visage (auto-affiché si needsBouille) ──
     Look calqué sur l'editbouille de main.swf : cadre arrondi vert clair,
     onglet-titre, preview, lignes yeux/iris/cheveux/bouche + barres couleur
     encadrées de flèches roses, bouton "valider". Modal non fermable : le
     joueur doit valider (= mirror du forçage côté Flash). */
  #fb-editor-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
    display: none; z-index: 60;
  }
  #fb-editor-backdrop.show { display: block; }
  #fb-editor {
    position: fixed; z-index: 61; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.96);
    width: min(92vw, 320px); box-sizing: border-box;
    background: #fff; border: 2px solid #aacf86; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    padding: 12px 14px 18px; display: none; opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
    font-family: Verdana, Geneva, sans-serif;
  }
  #fb-editor.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .fb-titletab {
    display: inline-flex; align-items: center; gap: 6px;
    color: #2f8f86; font-weight: bold; font-size: 13px; margin: 0 0 8px 2px;
  }
  .fb-titletab img { width: 18px; height: 18px; display: block; }
  .fb-preview {
    width: 132px; height: 132px; margin: 2px auto 6px; border-radius: 14px;
    overflow: hidden; background: #cfe6a3; border: 1px solid #aacf86;
  }
  .fb-preview iframe { width: 100%; height: 100%; border: 0; display: block; }
  .fb-rows { display: flex; flex-direction: column; gap: 9px; margin: 8px 2px 14px; }
  .fb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .fb-arrow {
    flex: 0 0 auto; width: 48px; height: 26px; padding: 0;
    border: 1px solid #e29b9b; border-radius: 9px; background: #f6bcbc;
    color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .fb-arrow:active { background: #efa6a6; }
  .fb-label { flex: 1 1 auto; text-align: center; color: #7b7b7b; font-size: 14px; }
  .fb-bar { flex: 1 1 auto; height: 18px; border-radius: 9px; border: 1px solid rgba(0, 0, 0, .14); }
  .fb-valider {
    display: block; margin: 2px auto 0; padding: 7px 32px;
    border: 1px solid #e29b9b; border-radius: 16px; background: #f3a9a9;
    color: #b5455f; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .fb-valider:active { background: #ec9a9a; }

  /* ── Generic panel ── */
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }

  /* ── Login / accueil screen (inspired by the desktop home) ── */
  #login-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 22px 24px 28px; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #login-screen .lg-logo { width: 220px; max-width: 76%; height: auto; display: block; margin: 4px auto 2px; }
  #login-screen .card {
    background: #fff; border: 2px solid #2C4A0F; border-radius: 14px;
    padding: 18px 18px 20px; width: 100%; max-width: 340px;
    box-shadow: 0 10px 22px rgba(44,74,15,.22);
  }
  #login-screen .lg-fruits { display: block; margin: 0 auto 6px; max-width: 200px; max-height: 120px; width: auto; height: auto; object-fit: contain; }
  #login-screen .lg-intro {
    text-align: center; color: #2f5510; font-size: 12.5px; line-height: 1.45;
    font-weight: bold; margin: 0 0 12px;
  }
  label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; }
  label .opt { font-weight: normal; color: #8aa86a; font-size: 11px; }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; padding: 11px 10px; font-size: 16px;
    border: 1px solid #5a8a20; border-radius: 7px; background: #fbfff5; color: #2C4A0F;
  }
  .btn-primary {
    width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: bold;
    background: #2C4A0F; color: #CFF599; border: 0; border-radius: 8px;
  }
  .btn-primary:disabled { opacity: .6; }
  .btn-link {
    display: block; width: 100%; margin-top: 12px; padding: 8px; background: transparent;
    border: 0; color: #2f6b16; font-size: 13px; font-weight: bold; text-decoration: underline; cursor: pointer;
  }
  .err { color: #b23b2e; font-size: 12px; margin-top: 10px; text-align: center; min-height: 14px; }

  /* ── Chat ── */
  #chat-panel { }

  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; margin: 6px;
    background: #CCF599; -webkit-overflow-scrolling: touch;
    /* Inner green border + slight rounding, with a grey "sur-bordure" ring drawn
       just outside it (box-shadow follows the radius, unlike outline on old WebKit). */
    border: 1px solid #ADE76B; border-radius: 5px;
    box-shadow: 0 0 0 1px #DDDDDD;
  }
  /* Messages render as "[hh:mm:ss] pseudo : message" in Verdana, reusing the
     forum's post palette: dark-green author, slightly lighter green body. */
  .msg { margin: 3px 0; line-height: 1.4; word-wrap: break-word; font-family: 'Verdana', Arial, sans-serif; }
  .msg .time { color: #8aa770; font-size: 11px; margin-right: 4px; }
  .msg .from { font-weight: bold; color: #2C4A0F; }
  .msg .from.me { color: #E3756A; }
  .msg.system { color: #6b8a3f; font-style: italic; font-size: 12.5px; }
  .msg.admin { color: #b23b2e; }
  .msg .body { color: #335511; }
  /* Cri modérateur ("!texte") — rouge vif gras, comme le desktop (#C10000). */
  .msg.shout, .msg.shout .body, .msg.shout .from, .msg.shout .time { color: #C10000; font-weight: bold; }
  /* Ligne animateur / mode bleu (t="c") — bleu gras, comme le desktop. */
  .msg.blue, .msg.blue .body, .msg.blue .from, .msg.blue .from.me, .msg.blue .time { color: #1A5FD0; font-weight: bold; }
  /* Emote line ("pseudo éclate de rire") — the whole row is italic, like desktop. */
  .msg.emote { font-style: italic; color: #4f7b1f; }
  .msg.emote .from { color: #4f7b1f; }
  .msg.emote .from.me { color: #E3756A; }
  .msg .body.emote { font-style: italic; color: #4f7b1f; }
  /* Quiz / "/image" pictures: shown INLINE in the chat body on mobile (the
     desktop SWF opens them in a separate window instead). */
  .msg.img-msg .img-wrap { margin-top: 4px; }
  .msg.img-msg .chat-img {
    display: block; max-width: 100%; height: auto;
    border-radius: 8px; border: 1px solid rgba(44,74,15,0.25); background: #fff;
  }
  .msg.img-msg .img-fail { font-size: 12px; color: #6b8a3f; font-style: italic; }

  .compose {
    display: flex; align-items: center; gap: 7px; padding: 8px; background: #fff;
    border-top: 1px solid #DDDDDD; flex-shrink: 0;
  }
  /* Soft "inset" input: light-grey field, darker top border + inner highlight. */
  .compose input {
    flex: 1; min-width: 0; height: 36px; box-sizing: border-box;
    padding: 0 12px; font-size: 16px; color: #333333;
    border-style: solid; border-width: 2px 1px 1px;
    border-color: #cccccc #f2f2f2 #f6f6f6; border-radius: 8px;
    background: #eeeeee; box-shadow: inset 0 1px 0 #e5e5e5;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .compose button {
    height: 36px; box-sizing: border-box; flex-shrink: 0;
    background: #FFAAAD; color: #660000; border: 1px solid #F48081; border-radius: 8px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 0 18px; font-size: 14px; font-weight: bold;
  }
  .compose button:disabled { opacity: .5; }

  /* Feutre swatch picker (horizontal scroll above the composer) */
  #pen-bar {
    display: none; gap: 7px; padding: 8px 10px; background: #fff;
    border-top: 1px solid #DDDDDD; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-shrink: 0; white-space: nowrap;
  }
  #pen-bar.show { display: flex; }
  .pen-swatch {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer;
  }
  .pen-swatch.sel { box-shadow: 0 0 0 2px #D16767; transform: scale(1.12); }
  .pen-swatch.none {
    background: #fff; color: #D16767; font-size: 14px; line-height: 26px;
    text-align: center; font-weight: bold;
  }

  /* Accent helper bar (above the composer), same toggle pattern as #pen-bar */
  #accent-bar {
    display: none; gap: 5px; padding: 8px 10px; background: #fff;
    border-top: 1px solid #DDDDDD; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-shrink: 0; white-space: nowrap;
  }
  #accent-bar.show { display: flex; }
  .accent-key {
    min-width: 36px; height: 36px; flex-shrink: 0; padding: 0 6px;
    border: 1px solid #DDDDDD; border-radius: 8px; background: #f6f6f6;
    color: #333333; font-size: 18px; cursor: pointer; box-shadow: 0 1px 0 #e5e5e5;
  }
  .accent-key:active { background: #e7e7e7; }
  #accent-toggle {
    height: 36px; width: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0;
    background: #fff; color: #660000; border: 1px solid #F48081; border-radius: 8px;
    box-shadow: 0 0 0 1px #DDDDDD; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  #accent-toggle.on { background: #FFAAAD; }
  #accent-toggle:disabled { opacity: .5; }

  /* Bouille reaction overlay — a live Ruffle bouille (vector = crisp), centered
     over the messages with NO card/background. It slides in from the left edge
     of the chat and slides back out to the left. pointer-events stay off so the
     chat underneath remains readable/scrollable. */
  #bouille-overlay {
    position: absolute; left: 0; top: 0; right: 0; bottom: 56px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; overflow: hidden;
  }
  #bouille-overlay-stage {
    width: 200px; height: 200px; max-width: 56vw; max-height: 56vw;
    /* Start fully off the left edge; .show brings it to center. */
    transform: translateX(-130vw);
    opacity: 0;
    transition: transform .5s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
    will-change: transform, opacity;
  }
  #bouille-overlay.show #bouille-overlay-stage { transform: translateX(0); opacity: 1; }
  #bouille-overlay.leaving #bouille-overlay-stage { transform: translateX(-130vw); opacity: 0; }
  #bouille-overlay-stage iframe {
    width: 100%; height: 100%; border: 0; background: transparent; display: block;
  }
  /* Small floating caption so you still know who reacts, but unobtrusive. */
  #bouille-overlay-name {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; font-weight: bold; color: #2C4A0F;
    background: rgba(255,255,255,.82); border: 1px solid #5a8a20;
    border-radius: 10px; padding: 2px 9px; max-width: 78vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .3s ease;
  }
  #bouille-overlay.show #bouille-overlay-name { opacity: 1; }

  /* User list drawer */
  #users-drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 72%; max-width: 280px;
    background: #fff; border-left: 1px solid #DDDDDD; z-index: 30;
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column; box-shadow: -6px 0 18px rgba(44,74,15,.25);
  }
  #users-drawer.open { transform: translateX(0); }
  #users-drawer h3 { margin: 0; padding: 12px 14px; background: #fff; color: #D16767; font-size: 14px; border-bottom: 1px solid #DDDDDD; }
  /* Connected-users list styled after the "score panel" mockup: a light-green
     card (soft green border, rounded top, inner white highlight + green glow)
     encapsulated in the white drawer; rows alternate two greens with big bold
     Verdana pseudos in deep indigo. */
  #users-drawer .list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin: 0 10px; padding: 0;
    background: #e8f8d1; border: 4px solid #bff18d; border-radius: 24px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.45), 0 0 4px rgba(126,220,80,.45);
  }
  /* Pink scroll buttons (bouton_up.png) above AND below the list, same width as
     the list. Tap to nudge, press-and-hold to keep scrolling; the art is
     symmetric so the same image serves the top and the bottom. */
  .users-scroll {
    flex-shrink: 0; display: block; width: auto; margin: 6px 10px;
    padding: 0; border: 0; background: transparent; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .users-scroll.up { margin-top: 10px; }
  .users-scroll.down { margin-bottom: 10px; }
  .users-scroll img { width: 100%; height: auto; display: block; }
  .users-scroll:active img { filter: brightness(.95); }
  #users-drawer .u {
    min-height: 48px; padding: 6px 12px; background: #e8f8d1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #242169; font-family: 'Verdana', Arial, sans-serif; font-weight: 900;
    font-size: 22px; line-height: 1; letter-spacing: -.7px;
    text-shadow: 0 1px 0 rgba(255,255,255,.25);
  }
  #users-drawer .u:nth-child(odd) { background: #d6f7b5; }
  #users-drawer .u > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #users-drawer .u .badge {
    font-size: 10px; font-weight: bold; background: #242169; color: #fff;
    border-radius: 8px; padding: 1px 6px; letter-spacing: 0; text-shadow: none; flex-shrink: 0;
  }
  #drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 25; display: none; }
  #drawer-backdrop.show { display: block; }

  /* ── Forum panel ── */
  #forum-panel { padding: 0; }
  #forum-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #ADE76B;
  }
  #grapiz-panel { padding: 0; }
  #grapiz-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #FFFEE2;
  }
  #bandas-panel { padding: 0; }
  #bandas-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #92aa2e;
  }
  #swapou-panel { padding: 0; }
  #swapou-frame {
    flex: 1 1 auto; width: 100%; min-height: 0; height: 100%;
    border: 0; display: block; background: #24330e;
  }

  /* ── Scores du jour (Challenge) ──
     Barre de jeux (chips) corail collée en haut + tableau vert scrollable,
     dans la même palette que le chat. Lecture seule, rechargé à l'ouverture. */
  #scores-panel { padding: 0; background: #CCF599; }
  #scores-head {
    flex-shrink: 0; background: #FEABAB; border-bottom: 1px solid #DDDDDD;
    box-shadow: 0 1px 3px rgba(44,74,15,.18);
  }
  #scores-tabs {
    display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #scores-tabs::-webkit-scrollbar { display: none; }
  .scores-tab {
    flex: 0 0 auto; padding: 6px 13px; border: 0; border-radius: 14px;
    background: rgba(255,255,255,.35); color: #7a1f1f; font-weight: bold;
    font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .scores-tab.active {
    background: #fff; color: #D16767; box-shadow: 0 1px 2px rgba(44,74,15,.25);
  }
  #scores-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 10px 16px;
  }
  /* Trombinoscope */
  #trombi-head {
    flex-shrink: 0; background: #FEABAB; border-bottom: 1px solid #DDDDDD;
    box-shadow: 0 1px 3px rgba(44,74,15,.18); padding: 8px 10px;
  }
  #trombi-search {
    width: 100%; box-sizing: border-box; padding: 8px 12px; border: 0;
    border-radius: 14px; font-size: 13px; background: #fff; color: #333;
  }
  #trombi-letters {
    display: flex; gap: 4px; margin-top: 8px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #trombi-letters::-webkit-scrollbar { display: none; }
  .trombi-letter {
    flex: 0 0 auto; min-width: 26px; padding: 4px 7px; border: 0; border-radius: 12px;
    background: rgba(255,255,255,.45); color: #7a1f1f; font-weight: bold;
    font-size: 12px; cursor: pointer;
  }
  .trombi-letter.active { background: #fff; color: #D16767; box-shadow: 0 1px 2px rgba(44,74,15,.25); }
  #trombi-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px; display: grid; gap: 10px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  }
  #trombi-pager {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 8px; background: #fff; border-top: 1px solid #eee;
  }
  #trombi-pager:empty { display: none; }
  .trombi-pgbtn {
    border: 0; background: #FEABAB; color: #7a1f1f; font-weight: bold;
    font-size: 16px; width: 36px; height: 30px; border-radius: 8px; cursor: pointer;
  }
  .trombi-pgbtn[disabled] { opacity: .4; cursor: default; }
  .trombi-pginfo { font-size: 12px; color: #555; }
  .trombi-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 8px 4px; text-align: center;
  }
  /* Vignette bouille = iframe Ruffle (même rendu que le forum), fond vert carte. */
  .trombi-card .tb { width: 72px; height: 72px; border: 1px solid #cfe0b3; border-radius: 6px; background: #E8F8D3; overflow: hidden; }
  .trombi-card .tb iframe { width: 100%; height: 100%; border: 0; display: block; }
  .trombi-card .nm {
    font-size: 12px; font-weight: bold; color: #2C4A0F; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trombi-empty { grid-column: 1 / -1; text-align: center; color: #888; font-size: 13px; padding: 22px 10px; }
  .scores-cap {
    font-size: 11.5px; color: #2f5510; font-weight: bold; text-align: center;
    margin: 2px 0 8px;
  }
  /* Podium de la veille : bandeau clair en tête du tableau, médaillés côte à
     côte. Les visuels de médaille (≈100 px à la source) sont fortement réduits. */
  .podium {
    display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center;
    background: #E9F8CE; border: 1px solid #ADE76B; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD; padding: 7px 10px 8px; margin-bottom: 10px;
  }
  .podium-title {
    width: 100%; text-align: center; font-size: 11px; font-weight: bold;
    color: #2f5510; margin-bottom: 3px;
  }
  .pod-item { display: inline-flex; align-items: center; gap: 5px; }
  .pod-medal { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
  .pod-name {
    font-size: 12px; font-weight: bold; color: #2C4A0F;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scores-list {
    list-style: none; margin: 0; padding: 0; overflow: hidden;
    border: 1px solid #ADE76B; border-radius: 6px;
    box-shadow: 0 0 0 1px #DDDDDD; background: #D6F7B5;
  }
  .score-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    font-family: 'Verdana', Arial, sans-serif; font-size: 13px;
    background: #D6F7B5; border-bottom: 1px solid #fff;
  }
  .score-row:last-child { border-bottom: 0; }
  .score-row:nth-child(even) { background: #C3EF93; }
  .score-row .pos {
    flex: 0 0 auto; width: 26px; text-align: center; font-weight: bold;
    color: #2C4A0F; font-size: 14px;
  }
  .score-row.r1 .pos, .score-row.r2 .pos, .score-row.r3 .pos { font-size: 17px; }
  .score-row .pname {
    flex: 1 1 auto; min-width: 0; color: #2C4A0F; font-weight: bold;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .score-row .pscore {
    flex: 0 0 auto; color: #335511; font-weight: bold;
    font-family: "Courier New", monospace; font-size: 13px;
  }
  /* Ligne du joueur courant : ressort en corail clair avec un badge « toi ». */
  .score-row.me { background: #FFE4E4; }
  .score-row.me .pname { color: #D16767; }
  .score-row.me .pscore { color: #D16767; }
  .me-badge {
    flex: 0 0 auto; font-size: 9px; font-weight: bold; color: #fff;
    background: #E3756A; border-radius: 7px; padding: 1px 6px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .scores-loading, .scores-empty {
    text-align: center; padding: 30px 16px; color: #4f7b1f;
    font-style: italic; font-size: 13px; line-height: 1.6;
  }

  .hidden { display: none !important; }
  .banner {
    background: #fff3cd; color: #7a5b00; border-bottom: 1px solid #e0c97a;
    font-size: 12px; padding: 7px 10px; text-align: center; flex-shrink: 0;
  }

  /* ════════════════════ Accueil mobile (launcher plein écran) ════════════════
     Le « menu » du mode mobile : une main bar en haut (avatar Frutibouille +
     niveau/classement + emotes d'humeur + raccourcis) puis une grille pleine
     largeur des rubriques (Scores, Boutique, Mes disques, Salons, Inventaire,
     Forum). Remplace l'ancien tiroir hamburger (qui n'était pas full width). */
  /* Le menu est un TIROIR qui glisse depuis la gauche, PAR-DESSUS le contenu
     (chat/forum/jeux), qui reste visible derrière. Fermé : hors écran à gauche.
     Mobile : plein écran ; desktop : bande de 440px (cf. media query). */
  #home-panel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 100%; z-index: 40;
    display: flex; flex-direction: column;
    background: #ADE76B; overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateX(-100%); transition: transform .25s ease;
    box-shadow: 4px 0 18px rgba(0,0,0,.28);
  }
  #app.menu-open #home-panel { transform: translateX(0); }
  /* Capteur de clic « hors tiroir » (transparent → le contenu reste visible) :
     un clic ferme le tiroir. Couvert par le tiroir plein écran sur mobile. */
  #home-backdrop {
    position: absolute; inset: 0; z-index: 39; display: none; background: transparent;
  }
  #app.menu-open #home-backdrop { display: block; }

  /* Police « radio-réveil » (sept segments) pour le numéro de niveau. */
  @font-face {
    font-family: 'DSEG7';
    src: url('/fb/DSEG7Classic-Bold.woff2') format('woff2');
    font-weight: bold; font-style: normal; font-display: swap;
  }

  /* ── Main bar : bandeau clair plein largeur ── */
  .mainbar {
    background: #fbfdf3;
    box-shadow: 0 0 0 2px #d9d9d9, 0 0 0 3px #8a888d;
    padding: 9px 10px 10px; display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  /* Avatar (gauche) + colonne droite (encart niveau au-dessus, emotes en dessous).
     align-items:stretch ⇒ l'avatar prend toute la hauteur de la colonne droite,
     donc hauteur avatar = hauteur encart + hauteur emotes (demande explicite). */
  .mb-top { display: flex; align-items: stretch; gap: 8px; }

  /* Avatar (bouille Ruffle) dans le cadre vert glossy + reflet. Carré : sa largeur
     fixe = la hauteur de la colonne droite (110 = 72 encart + 4 + 34). Bords
     arrondis (cadre + scène clippés). */
  .mb-avatar { flex: 0 0 110px; position: relative; }
  /* Bordure 1px #8A888D + sur-bordure 2px #D9D9D9 autour de l'encart bouille. */
  .mb-avatar .frame {
    position: absolute; inset: 3px; border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px #8A888D, 0 0 0 3px #D9D9D9;
  }
  .mb-avatar .cadre, .mb-avatar .reflet { position: absolute; pointer-events: none; }
  .mb-avatar .cadre { inset: 0; width: 100%; height: 100%; z-index: 1; }
  /* Bouille agrandie : faible marge intérieure pour qu'elle remplisse le cadre. */
  .mb-avatar .stage {
    position: absolute; inset: 5%; z-index: 2; border-radius: 9px; overflow: hidden;
  }
  .mb-avatar .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  /* Reflet (brillance) dans le coin SUPÉRIEUR DROIT de l'encart bouille. */
  .mb-avatar .reflet { right: 5%; top: 5%; width: 46%; height: auto; z-index: 3; }

  /* Colonne droite : encart niveau (haut) + rangée d'emotes (bas). */
  .mb-right { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

  /* Encart « niveau / classement » : panneau vert glossy reconstruit en CSS
     (le SVG d'origine portait un trophée + séparateur gravés qui empêchaient ce
     nouvel agencement). 4 zones : barres de progression (haut-gauche), trophée +
     rang (haut-centre), « NIV » + niveau (bas-gauche), raccourcis (bas-droite). */
  .mb-encart {
    position: relative; flex: 0 0 72px; min-width: 0; border-radius: 6px; overflow: hidden;
    background: #c8f39a;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px #93c168,
                0 0 0 2px #dcdcdc, 0 1px 2px rgba(44,74,15,.22);
  }
  /* Reflet (brillance) dans le coin SUPÉRIEUR DROIT de l'encart niveau. Taillé
     sur la HAUTEUR pour ne pas déborder (l'encart est en overflow:hidden). */
  .reflet-niv {
    position: absolute; right: 2%; top: 3%; height: 62%; width: auto; z-index: 1;
    pointer-events: none;
  }
  /* Ligne de séparation sous la coupe (sépare rang ↔ raccourcis), comme le SVG
     d'origine : trait vert + léger filet blanc dessous, côté droit de l'encart. */
  .enc-divider {
    position: absolute; left: 26%; right: 4%; top: 47%; height: 1px; z-index: 1;
    background: #73b01e; box-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  /* Progression dans le niveau en cours : 9 barres courtes empilées. Chaque barre
     est UN segment du palier : elle se remplit ENTIÈREMENT (gauche → droite) avant
     que la suivante commence (cf. setHomeProgress). C'est le % de complétion de
     main.swf « découpé » en 9 lignes. */
  .enc-progress {
    position: absolute; left: 10px; top: 8px; width: 42px; height: 36px; z-index: 2;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .enc-progress i {
    display: block; height: 2px; background: #A3EB57; overflow: hidden;
  }
  .enc-progress i::before {
    content: ""; display: block; height: 100%; width: var(--f, 0%);
    background: #78B425; transition: width .35s ease;
  }
  /* Trophée + rang (classement général par XP, 1 = meilleur). Calés à gauche, là
     où commence la ligne de séparation. */
  .enc-trophy {
    position: absolute; left: 26%; top: 6px; height: 24px; z-index: 2;
    display: flex; align-items: center; gap: 3px;
  }
  .enc-trophy .tro { height: 23px; width: auto; display: block; filter: drop-shadow(0 1px 0 rgba(255,255,255,.45)); }
  .enc-trophy .val {
    font-family: 'DSEG7', 'Courier New', monospace;
    font-size: 21px; line-height: 1; color: #73b01e; text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  /* Niveau : icône « NIV » (agrandie) puis le numéro « radio-réveil » (DSEG7) à la
     suite, même taille — bas-gauche. */
  .enc-niv {
    position: absolute; left: 10px; bottom: 6px; z-index: 2;
    display: flex; flex-direction: row; align-items: center; gap: 2px; line-height: 1;
  }
  .enc-niv .niv-img { height: 22px; width: auto; display: block; }
  /* Numéro collé à « NIV » et de la MÊME couleur (#73b01e) pour lire « NIV 8 »
     comme un seul bloc de texte. */
  .enc-niv .lvl {
    font-family: 'DSEG7', 'Courier New', monospace; font-weight: bold;
    font-size: 11px; line-height: 1; color: #73b01e;
  }
  /* Raccourcis (mail, événement, historique…) — calés à gauche (début du divider),
     sous la ligne de séparation, resserrés. */
  .mb-shortcuts {
    position: absolute; left: 26%; bottom: 7px; z-index: 2;
    display: flex; align-items: center;
  }
  .sc-btn {
    flex: 0 0 auto; background: transparent; border: 0; padding: 0 1px; margin: 0;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sc-btn img { width: 27px; height: 27px; object-fit: contain; display: block; }
  .sc-btn:active img { transform: scale(.85); }

  /* ── Emotes (humeurs) : resserrées, SANS bordure ; au clic, la bouille change
     d'HUMEUR (freeze statique `e`, comme le forum — pas l'animation du chat).
     Rangée placée SOUS l'encart niveau. ── */
  .mb-emotes { flex: 0 0 34px; display: flex; align-items: stretch; }
  .em-btn {
    flex: 1 1 0; min-width: 0; margin: 0; padding: 1px;
    background: transparent; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .em-btn img { width: 100%; max-width: 32px; height: auto; display: block; pointer-events: none; }
  .em-btn:active img { transform: scale(.9); }
  .em-btn.active { background: rgba(227,117,106,.20); border-radius: 8px; }

  /* ── Grille des rubriques (plein largeur, 3 colonnes) ── */
  .home-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px;
    padding: 16px 12px 22px;
  }
  .home-tile {
    background: transparent; border: 0; cursor: pointer; padding: 6px 2px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  .home-tile .ico {
    width: 55px; height: 48px; display: flex; align-items: center; justify-content: center;
  }
  .home-tile .ico img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(44,74,15,.35)); transition: transform .1s ease;
  }
  .home-tile:active .ico img { transform: scale(.9); }
  .home-tile .lbl { font-size: 14px; font-weight: bold; color: #2C4A0F; text-align: center; }
  .home-tile:active .lbl { text-decoration: underline; }

  /* ── Desktop / tablette (≥768px) : le tiroir s'ouvre en BANDE à gauche (440px)
     PAR-DESSUS le contenu, qui reste visible derrière (le capteur de clic est
     transparent). On le ferme via ‹, un clic à droite, ou en choisissant une
     rubrique. Sous 768px : tiroir plein écran (launcher), comme avant. ── */
  @media (min-width: 768px) {
    #home-panel { width: 440px; }
  }
</style>
</head>
<body>

<!-- ───────── Login ───────── -->
<div id="login-screen">
  <img class="lg-logo" src="https://raw.githubusercontent.com/Spender94/Frutiparc/main/public/images/logo.gif" alt="Frutiparc" onerror="this.style.display='none'">
  <div class="card">
    <img class="lg-fruits" src="https://raw.githubusercontent.com/Spender94/Frutiparc/main/public/images/welcome.gif" alt="" onerror="this.style.display='none'">
    <div class="lg-intro">Des fruits, des jeux, du chat !<br>Rejoins l'univers fruité de Frutiparc.</div>

    <!-- Connexion -->
    <form id="login-form" autocomplete="on">
      <label for="li-user">Pseudo</label>
      <input type="text" id="li-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="li-pass">Code secret</label>
      <input type="password" id="li-pass" autocomplete="current-password">
      <button type="submit" class="btn-primary" id="li-btn">Se connecter</button>
      <div class="err" id="li-err"></div>
    </form>
    <button type="button" class="btn-link" id="show-register">S'inscrire gratuitement</button>

    <!-- Inscription (dès la page d'accueil) -->
    <form id="register-form" class="hidden" autocomplete="on">
      <label for="re-user">Pseudo</label>
      <input type="text" id="re-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" minlength="3" maxlength="20">
      <label for="re-pass">Code secret</label>
      <input type="password" id="re-pass" autocomplete="new-password" minlength="6" maxlength="80">
      <label for="re-email">E-mail <span class="opt">— pour récupérer ton code</span></label>
      <input type="email" id="re-email" autocomplete="email" maxlength="120" placeholder="(facultatif)">
      <button type="submit" class="btn-primary" id="re-btn">Créer mon compte</button>
      <div class="err" id="re-err"></div>
    </form>
    <button type="button" class="btn-link hidden" id="show-login">← J'ai déjà un compte</button>
  </div>
</div>

<!-- ───────── App (after login) ───────── -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <!-- Single compact top bar: hamburger · room selector · members.
       Everything else (account, navigation, quitter) lives in the menu drawer
       to keep vertical space for the conversation. -->
  <header id="topbar">
    <button class="icon-btn" id="menu-btn" title="Accueil" aria-label="Retour à l'accueil">‹</button>
    <select id="room-select" aria-label="Salon"></select>
    <button class="icon-btn bare" id="pen-btn" title="Feutre" aria-label="Feutre">
      <img src="/fb/icone_feutres.png" alt="Feutre">
    </button>
    <button class="icon-btn bare" id="bouille-toggle" title="Masquer les bouilles" aria-label="Afficher ou masquer les bouilles" aria-pressed="true">
      <img src="/fb/icone_bouille.png" alt="Bouilles">
    </button>
    <button class="icon-btn bare" id="users-btn" title="Afficher / masquer les connectés" aria-label="Liste des connectés">
      <img src="/fb/icone_liste.png" alt="Connectés">
    </button>
  </header>

  <!-- Capteur de clic « hors tiroir » (transparent) : ferme le menu. -->

  <!-- ═══════════ Menu (tiroir) du mode mobile ═══════════════════════════════

  <!-- Forum — intégré dans une iframe pour ne JAMAIS couper le chat. Tant qu'on

  <!-- "Ma Frutibouille" : éditeur de visage (auto-affiché tant que needsBouille).
       Rows + valider sont construits/branchés en JS (openFbEditor). -->
  <div id="fb-editor-backdrop"></div>
  <div id="fb-editor" role="dialog" aria-modal="true" aria-label="Ma Frutibouille">
    <div class="fb-titletab"><img src="/fb/icone_bouille.png" alt="">Ma Frutibouille</div>
    <div class="fb-preview" id="fb-editor-preview"></div>

<script>
(function () {
  "use strict";
  function $(s) { return document.querySelector(s); }
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  // Public salons (mirror server-side `channels`), in display order. pomme
  // (Salon Anim's) is FIRST so it's the salon the mobile client joins by default.
  // The names below are just the initial labels: the live, admin-editable names
  // arrive via the channellist <q><desc> and override them (see the "q" handler),
  // so renaming a salon in /admin updates the mobile list automatically.
  var ROOMS = [
    ["pomme", "Salon Anim's"], ["abricot", "Temple du Grand Piquant"],
    ["poire", "Montagne des Loups-Garous"], ["fraise", "Fruti-Théâtre"],
    ["citron", "Marais d'Ornegon"], ["kiwi", "Laboratoire KiwiX"],
    ["raisin", "Plage Banana-Nuit"], ["orange", "Taverne Far-Zest"],
    ["cerise", "Île olympique de Môh"], ["banane", "Forêt Enchantée"],
    ["bienvenue", "Nuage d'Égerie"],
  ];
  var ROOM_LABELS = {};
  ROOMS.forEach(function (r) { ROOM_LABELS[r[0]] = r[1]; });
  // Display name for a room id: prefer the live admin label (from the
  // channellist), then the built-in label above, then a capitalised id (so a
  // private "pm_a_b" room never shows a raw id).
  function roomLabel(id) {
    if (state && state.roomLabels && state.roomLabels[id]) return state.roomLabels[id];
    if (ROOM_LABELS[id]) return ROOM_LABELS[id];
    var s = String(id || "");
    if (s.indexOf("pm_") === 0 || s.indexOf("pm2_") === 0) return "Discussion privée";
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  var state = {
    sid: "",
    user: "",          // display name
    userLower: "",
    room: "",
    ws: null,
    connected: false,
    reconnectTimer: null,
    intentionalClose: false,
    usersByRoom: {},   // room -> Set of display names
    bouilleByUser: {}, // lowercased pseudo -> bouille state string "f"
    overlayTimer: null,
    pen: "",           // selected feutre index ("" = default colour)
    roomCounts: {},    // room id -> participant count (from channellist <q>)
    roomLabels: {},    // room id -> live admin label (from channellist <q><desc>)
    bouillesEnabled: true, // show the bouille reaction overlay (off = "light" mode)
  };

  var DEFAULT_BOUILLE = "000000010000000000000000";

  // (Re)build the room <option>s, appending the live participant count as
  // "Pomme (3)". A count of 0 shows no parenthesis. Preserves the current
  // selection. Called on startApp and whenever a channellist <q> arrives.
  function renderRoomOptions() {
    var sel = document.getElementById("room-select");
    if (!sel) return;
    var current = sel.value || (state && state.room) || ROOMS[0][0];
    sel.innerHTML = "";
    ROOMS.forEach(function (r) {
      var n = state.roomCounts[r[0]] || 0;
      var o = document.createElement("option");
      o.value = r[0];
      o.textContent = roomLabel(r[0]) + (n > 0 ? " (" + n + ")" : "");
      sel.appendChild(o);
    });
    sel.value = current;
  }

  // ── XML helpers (CBee protocol) ──
  // For ATTRIBUTES (sid, room, pseudo): full escaping, incl. & and ".
  function xmlEscape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // For the message BODY: escape "&", "<" and ">" as proper XML entities. The
  // server normalises every incoming body with escapeXml(unescapeXml(body))
  // before rebroadcasting — an idempotent single level of escaping — and BOTH
  // clients unescape on receive (Flash's htmlText, and our xmlUnescape here). So
  // "&lt;"/"&gt;" survive the round-trip and arrive as the literal "<"/">" on
  // every client, with NO double-escaping. (We previously swapped "<"/">" for
  // the look-alike guillemets ‹ › to dodge the server's content parser, which
  // truncates at a *literal* "<" — but entities contain no literal "<", so they
  // pass through cleanly and the real characters are preserved.)
  function bodyEscape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function xmlUnescape(s) {
    return String(s == null ? "" : s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'").replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  }
  function attr(xml, name) {
    var m = xml.match(new RegExp("\\b" + name + '="([^"]*)"'));
    return m ? m[1] : "";
  }
  function tagName(xml) {
    var m = xml.match(/^<(\w+)/);
    return m ? m[1] : "";
  }
  function bodyOf(xml) {
    // text between the first '>' and the matching '</'
    var m = xml.match(/^<[^>]*>([\s\S]*)<\/[^>]+>$/);
    return m ? m[1] : "";
  }
  // Many admin/system chat frames carry their text inside a CDATA section, often
  // wrapping a little HTML (e.g. "<![CDATA[<i>X a été totoché</i>]]>"). Peel the
  // CDATA wrapper so we can render the announcement instead of "[cadeau]".
  function stripCdata(s) {
    var m = String(s == null ? "" : s).match(/^\s*<!\[CDATA\[([\s\S]*?)\]\]>\s*$/);
    return m ? m[1] : s;
  }
  // Reduce the small HTML the server uses in admin announces (<i>, <b>,
  // <font color>) to readable plain text for the mobile chat line.
  function htmlToText(s) {
    return xmlUnescape(String(s == null ? "" : s).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "")).trim();
  }
  // Case-insensitive pseudo comparison (server sends display names; state.user
  // may differ only by case).
  function sameName(a, b) {
    return String(a == null ? "" : a).toLowerCase() === String(b == null ? "" : b).toLowerCase();
  }

  // ── Login ──
  // ── Session persistence (survive F5 / rotation reloads) ──
  // The sid is the only thing needed to resume; we keep it in localStorage and
  // re-validate it on load via /api/forum/me (returns {user} if still valid).
  var SESS_KEY = "fp_light_session";
  function saveSession() {
    try { localStorage.setItem(SESS_KEY, JSON.stringify({ sid: state.sid, user: state.user })); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESS_KEY); } catch (e) {}
  }
  function tryResumeSession(cb) {
    // Prefer a sid already on state (set from ?sid= in the URL), else the one
    // saved in localStorage.
    var sid = state.sid;
    if (!sid) {
      var raw; try { raw = localStorage.getItem(SESS_KEY); } catch (e) { raw = null; }
      if (raw) { try { sid = (JSON.parse(raw) || {}).sid; } catch (e) {} }
    }
    if (!sid) { cb(false); return; }
    // Validate the sid server-side before skipping the login screen.
    fetch("/api/forum/me?sid=" + encodeURIComponent(sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.user) {
          state.sid = sid;
          state.user = d.user;
          state.userLower = String(d.user).toLowerCase();
          saveSession();
          startApp();
          cb(true);
        } else {
          clearSession();
          state.sid = "";
          cb(false);
        }
      })
      .catch(function () { cb(false); });
  }

  // Shared login: POST credentials then resume the app. Reused by the login
  // form AND by the registration flow (auto-login right after sign-up).
  function doLogin(user, pass, opts) {
    opts = opts || {};
    var errEl = opts.errEl, btn = opts.btn, label = opts.label || "Se connecter";
    if (errEl) errEl.textContent = "";
    if (!user || !pass) { if (errEl) errEl.textContent = "Pseudo et code secret requis."; return; }
    if (btn) { btn.disabled = true; btn.textContent = "Connexion…"; }
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (!res.ok || !res.d || !res.d.ok) {
          if (errEl) errEl.textContent = (res.d && res.d.message) || "Identifiants invalides.";
          return;
        }
        state.sid = res.d.sid;
        state.user = res.d.username || user;
        state.userLower = String(state.user).toLowerCase();
        saveSession();
        startApp();
      })
      .catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (errEl) errEl.textContent = "Erreur réseau. Réessaie.";
      });
  }

  var loginForm = $("#login-form");
  loginForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    doLogin($("#li-user").value.trim(), $("#li-pass").value, { errEl: $("#li-err"), btn: $("#li-btn"), label: "Se connecter" });
  });

  // ── Inscription depuis la page d'accueil ──
  var registerForm = $("#register-form");
  function setAuthMode(register) {
    loginForm.classList.toggle("hidden", register);
    $("#show-register").classList.toggle("hidden", register);
    registerForm.classList.toggle("hidden", !register);
    $("#show-login").classList.toggle("hidden", !register);
    $("#li-err").textContent = ""; $("#re-err").textContent = "";
  }
  $("#show-register").addEventListener("click", function () { setAuthMode(true); var u = $("#re-user"); if (u) u.focus(); });
  $("#show-login").addEventListener("click", function () { setAuthMode(false); var u = $("#li-user"); if (u) u.focus(); });
  registerForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var user = $("#re-user").value.trim();
    var pass = $("#re-pass").value;
    var email = $("#re-email").value.trim();
    var errEl = $("#re-err"); errEl.textContent = "";
    if (!user || !pass) { errEl.textContent = "Pseudo et code secret requis."; return; }
    var btn = $("#re-btn"); btn.disabled = true; btn.textContent = "Création…";
    var body = { username: user, password: pass };
    if (email) body.email = email;
    fetch("/api/auth/register", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d || !res.d.ok) {
          btn.disabled = false; btn.textContent = "Créer mon compte";
          errEl.textContent = (res.d && res.d.message) || "Inscription impossible.";
          return;
        }
        // Compte créé → on connecte directement avec les mêmes identifiants.
        doLogin(user, pass, { errEl: errEl, btn: btn, label: "Créer mon compte" });
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = "Créer mon compte";
        errEl.textContent = "Erreur réseau. Réessaie.";
      });
  });

  // ── App start ──
  function startApp() {
    $("#login-screen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    var wn = $("#who-name"); if (wn) wn.textContent = state.user; // (plus de pseudo affiché sur l'accueil)

    // Build room selector (labels get a "(n)" participant count, see
    // renderRoomOptions / the channellist handler).
    renderRoomOptions();
    var sel = $("#room-select");
    sel.value = ROOMS[0][0];
    sel.addEventListener("change", function () { switchRoom(sel.value); });

    // On construit la main bar du menu (emotes + raccourcis) puis on charge le
    // profil (avatar, niveau, rang). Le chat (Salon) est le contenu par défaut,
    // toujours présent derrière. Mobile → on ouvre le tiroir (on atterrit sur le
    // menu) ; desktop → tiroir fermé (le chat est visible, le menu s'ouvre via ‹).
    renderHome();
    activateTab("chat");
    if (!isDesktop()) openMenu(true);
    loadHomeProfile();

    connectWs();

    // Premier passage (ou redo admin) : proposer l'éditeur de Frutibouille tant
    // que la bouille n'est pas définie. Cf. maybeOpenFbEditor / needsBouille.
    maybeOpenFbEditor();
  }

  // ── Navigation : le MENU est un TIROIR (overlay) ──
  // Le contenu (chat/forum/jeux) est toujours présent en pleine largeur ; le menu
  // glisse PAR-DESSUS depuis la gauche (#app.menu-open). Mobile : tiroir plein
  // écran. Desktop/tablette : bande de 440px, le contenu reste visible derrière
  // (capteur de clic transparent). On ouvre/ferme via ‹, on ferme via un clic à
  // droite (#home-backdrop) ou en choisissant une rubrique.
  function isDesktop() {
    try { return window.matchMedia("(min-width: 768px)").matches; } catch (e) { return false; }
  }
  function openMenu(open) { $("#app").classList.toggle("menu-open", open !== false); }
  function closeMenu() { $("#app").classList.remove("menu-open"); }
  function toggleMenu() { $("#app").classList.toggle("menu-open"); }
  function goHome() { openMenu(true); } // compat : « accueil » = ouvrir le tiroir
  $("#menu-btn").addEventListener("click", toggleMenu);
  $("#home-backdrop").addEventListener("click", closeMenu);

  // ── Main bar de l'accueil : avatar, niveau, emotes (humeurs), raccourcis ──
  // Emotes → humeur de la bouille via le param `e` de bouille-preview (freeze
  // statique, EXACTEMENT comme le forum — pas l'animation transitoire du chat).
  // Les 7 icônes fournies couvrent les humeurs e=1..7 (cf. EXPRESSIONS du forum).
  var HOME_EMOTES = [
    { file: "emote_mechant", e: 1, name: "Colère" },
    { file: "emote_triste",  e: 2, name: "Triste" },
    { file: "emote_content", e: 3, name: "Sourire" },
    { file: "emote_ravi",    e: 4, name: "Joie" },
    { file: "emote_stoique", e: 5, name: "Déterminé" },
    { file: "emote_transi",  e: 6, name: "Embarrassé" },
    { file: "emote_fou",     e: 7, name: "Totoché" },
  ];
  // Raccourcis : sans action pour l'instant (à brancher plus tard).
  var HOME_SHORTCUTS = [
    { file: "Mail",       name: "Messagerie" },
    { file: "Warning",    name: "Événements" },
    { file: "Historique", name: "Historique" },
    { file: "Aide",       name: "Aide" },
    { file: "Forum",      name: "Forum" },
    { file: "Jeux",       name: "Jeux" },
  ];
  var homeProfile = { bouille: DEFAULT_BOUILLE, level: 1, xp: 0, rank: null, kikooz: 0 };

  // Taux de complétion du niveau EN COURS — réplique EXACTE de main.swf
  // (frutiengine/UserMng.as : xpLevelCompletionRate) :
  //   level      = floor(sqrt(xp/10000)+1)
  //   levelToXp(L) = (L-1)² · 10000        (XP au début du palier L)
  //   rate       = (xp - levelToXp(level)) / (levelToXp(level+1) - levelToXp(level))
  // Les 9 barres se remplissent de gauche à droite à ce pourcentage (0..1).
  function levelProgress(xp, level) {
    var L = Math.max(1, Number(level) || 1);
    var lo = 10000 * Math.pow(L - 1, 2);
    var hi = 10000 * Math.pow(L, 2);
    if (hi <= lo) return 0;
    return Math.max(0, Math.min(1, ((Number(xp) || 0) - lo) / (hi - lo)));
  }
  function setHomeProgress(xp, level) {
    var cont = $("#home-progress");
    if (!cont) return;
    var r = levelProgress(xp, level);            // taux de complétion 0..1
    var bars = cont.querySelectorAll("i");
    var n = bars.length || 9;
    for (var i = 0; i < bars.length; i++) {
      // Remplissage du BAS vers le HAUT : la barre du bas (dernière du DOM) est la
      // 1re à se remplir, celle du haut la dernière. Segment s = n-1-i ⇒ la barre
      // se remplit ENTIÈREMENT (gauche → droite) avant que celle du dessus commence.
      // À 58 % / 9 barres : les 5 du bas pleines, la 6e à ~22 %, les 3 du haut vides.
      var f = Math.max(0, Math.min(1, r * n - (n - 1 - i)));
      bars[i].style.setProperty("--f", (f * 100).toFixed(1) + "%");
    }
  }
  var homeMood = 0;          // humeur courante affichée par l'avatar (0 = neutre)
  var homeAvatarUrl = "";    // URL Ruffle courante (évite les reboots inutiles)

  function setHomeAvatar(stateStr, mood) {
    var stage = $("#home-avatar"); if (!stage) return;
    var s = String(stateStr || DEFAULT_BOUILLE).replace(/[^0-9A-Za-z]/g, "");
    var q = "s=" + encodeURIComponent(s) + "&bg=transparent";
    if (mood && Number(mood) > 0) q += "&e=" + encodeURIComponent(Number(mood));
    var url = "/bouille-preview.html?" + q;
    if (url === homeAvatarUrl && stage.firstChild) return; // déjà à jour
    homeAvatarUrl = url;
    stage.innerHTML = '<iframe scrolling="no" aria-hidden="true" '
      + 'sandbox="allow-scripts allow-same-origin" src="' + url + '"></iframe>';
  }
  function refreshHomeAvatar() {
    // Bouille live (changement d'accessoire en session) sinon celle du profil.
    var b = (state.bouilleByUser && state.bouilleByUser[state.userLower])
      || homeProfile.bouille || DEFAULT_BOUILLE;
    setHomeAvatar(b, homeMood);
  }
  function setHomeMood(mood) {
    homeMood = Number(mood) || 0;
    Array.prototype.forEach.call(document.querySelectorAll("#home-emotes .em-btn"), function (b) {
      b.classList.toggle("active", Number(b.getAttribute("data-e")) === homeMood);
    });
    refreshHomeAvatar();
  }
  function renderHome() {
    var em = $("#home-emotes");
    if (em && !em.childNodes.length) {
      HOME_EMOTES.forEach(function (it) {
        var b = el("button", "em-btn");
        b.type = "button"; b.title = it.name; b.setAttribute("data-e", it.e);
        b.innerHTML = '<img src="/fb/' + it.file + '.svg" alt="' + xmlEscape(it.name) + '">';
        // Recliquer la même humeur revient au neutre.
        b.addEventListener("click", function () { setHomeMood(homeMood === it.e ? 0 : it.e); });
        em.appendChild(b);
      });
    }
    var sc = $("#home-shortcuts");
    if (sc && !sc.childNodes.length) {
      HOME_SHORTCUTS.forEach(function (it) {
        var b = el("button", "sc-btn");
        b.type = "button"; b.title = it.name; b.setAttribute("aria-label", it.name);
        b.innerHTML = '<img src="/fb/' + it.file + '.svg" alt="' + xmlEscape(it.name) + '">';
        b.addEventListener("click", function () { /* TODO: brancher les raccourcis */ });
        sc.appendChild(b);
      });
    }
  }
  function loadHomeProfile() {
    if (!state.sid) { setHomeAvatar(DEFAULT_BOUILLE, homeMood); return; }
    fetch("/api/light/profile?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && !d.error) {
          homeProfile.bouille = d.bouille || DEFAULT_BOUILLE;
          homeProfile.level = Number(d.level) || 1;
          homeProfile.xp = Number(d.xp) || 0;
          homeProfile.rank = (d.rank != null) ? Number(d.rank) : null;
          homeProfile.kikooz = Number(d.kikooz) || 0;
          if (d.bouille) state.bouilleByUser[state.userLower] = d.bouille;
          var lv = $("#home-level"); if (lv) lv.textContent = homeProfile.level;
          var rk = $("#home-rank"); if (rk) rk.textContent = (homeProfile.rank != null) ? homeProfile.rank : "—";
          setHomeProgress(homeProfile.xp, homeProfile.level);
        }
        refreshHomeAvatar();
      })
      .catch(function () { refreshHomeAvatar(); });
  }

  // Clics sur la grille de l'accueil → navigation (panneaux ou feuilles).
  Array.prototype.forEach.call(document.querySelectorAll(".home-tile[data-go]"), function (b) {
    b.addEventListener("click", function () {
      var go = b.getAttribute("data-go");
      if (go === "shop") return openShopSheet();
      if (go === "disques") return openDisquesSheet();
      if (go === "inventaire") return openBouilleSheet();
      activateTab(go); // chat / forum / scores
    });
  });

  // ── Trombinoscope (annuaire des Frutiz) ──
  // Chargé une fois puis gardé en mémoire. Navigation par lettre + recherche +
  // pagination : avec plusieurs milliers de bouilles, on ne rend QUE la page
  // courante (≤ TROMBI_PAGE), pour borner le nombre de miniatures /bouille-img
  // chargées simultanément.
  var TROMBI_PAGE = 48;
  var trombiData = null, trombiLetters = [], trombiLetter = "Tous", trombiPage = 0;
  function trombiFirstLetter(name) {
    var c = String(name || "").trim().charAt(0).toUpperCase();
    try { c = c.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {}
    return /[A-Z]/.test(c) ? c : "#";
  }
  function loadTrombi() {
    if (trombiData) { renderTrombi(); return; }
    var body = $("#trombi-body");
    if (body) body.innerHTML = '<div class="trombi-empty">Chargement…</div>';
    fetch("/api/trombinoscope", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        trombiData = (d && d.entries) || [];
        var set = {};
        trombiData.forEach(function (e) { set[trombiFirstLetter(e.pseudo)] = 1; });
        trombiLetters = Object.keys(set).sort(function (a, b) { return a === "#" ? 1 : b === "#" ? -1 : a.localeCompare(b); });
        trombiLetter = "Tous"; trombiPage = 0;
        renderTrombiLetters(); renderTrombi();
      })
      .catch(function () { if (body) body.innerHTML = '<div class="trombi-empty">Impossible de charger le trombinoscope.</div>'; });
  }
  function trombiQuery() { var se = $("#trombi-search"); return ((se && se.value) || "").trim().toLowerCase(); }
  function trombiFiltered() {
    var q = trombiQuery();
    if (q) return (trombiData || []).filter(function (e) { return String(e.pseudo).toLowerCase().indexOf(q) !== -1; });
    if (trombiLetter && trombiLetter !== "Tous") return (trombiData || []).filter(function (e) { return trombiFirstLetter(e.pseudo) === trombiLetter; });
    return trombiData || [];
  }
  function renderTrombiLetters() {
    var bar = $("#trombi-letters"); if (!bar) return;
    var searching = !!trombiQuery();
    var chips = ["Tous"].concat(trombiLetters);
    bar.innerHTML = chips.map(function (L) {
      var active = !searching && L === trombiLetter;
      return '<button class="trombi-letter' + (active ? " active" : "") + '" data-l="' + xmlEscape(L) + '">' + xmlEscape(L) + '</button>';
    }).join("");
    Array.prototype.forEach.call(bar.querySelectorAll(".trombi-letter"), function (b) {
      b.addEventListener("click", function () {
        var se = $("#trombi-search"); if (se) se.value = "";
        trombiLetter = b.getAttribute("data-l"); trombiPage = 0;
        renderTrombiLetters(); renderTrombi();
      });
    });
  }
  function renderTrombi() {
    var body = $("#trombi-body"); if (!body) return;
    var list = trombiFiltered();
    var pages = Math.max(1, Math.ceil(list.length / TROMBI_PAGE));
    if (trombiPage >= pages) trombiPage = 0;
    var slice = list.slice(trombiPage * TROMBI_PAGE, (trombiPage + 1) * TROMBI_PAGE);
    if (!list.length) {
      body.innerHTML = '<div class="trombi-empty">' + ((trombiData && trombiData.length) ? "Aucun Frutiz ne correspond." : "Le trombinoscope est encore vide.") + '</div>';
    } else {
      // Bouille rendue par /bouille-preview.html en iframe paresseux — exactement
      // comme les avatars du forum (renderBouillAvatar). loading="lazy" => seules
      // les vignettes proches du viewport instancient Ruffle.
      body.innerHTML = slice.map(function (e) {
        return '<div class="trombi-card"><div class="tb"><iframe src="/bouille-preview.html?s=' + encodeURIComponent(e.bouille) + '" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe></div><span class="nm">' + xmlEscape(e.pseudo) + '</span></div>';
      }).join("");
    }
    body.scrollTop = 0;
    renderTrombiPager(list.length, pages);
  }
  function renderTrombiPager(total, pages) {
    var pg = $("#trombi-pager"); if (!pg) return;
    if (pages <= 1) { pg.innerHTML = total ? '<span class="trombi-pginfo">' + total + ' Frutiz</span>' : ""; return; }
    pg.innerHTML =
      '<button class="trombi-pgbtn" id="trombi-prev"' + (trombiPage <= 0 ? " disabled" : "") + '>‹</button>' +
      '<span class="trombi-pginfo">page ' + (trombiPage + 1) + '/' + pages + ' · ' + total + ' Frutiz</span>' +
      '<button class="trombi-pgbtn" id="trombi-next"' + (trombiPage >= pages - 1 ? " disabled" : "") + '>›</button>';
    var prev = $("#trombi-prev"), next = $("#trombi-next");
    if (prev) prev.addEventListener("click", function () { if (trombiPage > 0) { trombiPage--; renderTrombi(); } });
    if (next) next.addEventListener("click", function () { if (trombiPage < pages - 1) { trombiPage++; renderTrombi(); } });
  }
  var trombiSearchEl = $("#trombi-search");
  if (trombiSearchEl) trombiSearchEl.addEventListener("input", function () { trombiPage = 0; renderTrombiLetters(); renderTrombi(); });

  // ── Navigation entre panneaux ──
  // activateTab pilote l'affichage des panneaux. On l'appelle depuis la grille
  // d'accueil (Salons, Forum, Scores) ET depuis la feuille « Mes disques » (qui
  // lance grapiz / bandas / swapou). Le bouton ‹ de la top bar ramène à l'accueil.
  function activateTab(tab) {
    // Choisir une rubrique referme le tiroir (le contenu choisi occupe l'écran).
    closeMenu();
    $("#chat-panel").classList.toggle("active", tab === "chat");
    $("#forum-panel").classList.toggle("active", tab === "forum");
    $("#grapiz-panel").classList.toggle("active", tab === "grapiz");
    $("#bandas-panel").classList.toggle("active", tab === "bandas");
    $("#swapou-panel").classList.toggle("active", tab === "swapou");
    $("#scores-panel").classList.toggle("active", tab === "scores");
    $("#trombi-panel").classList.toggle("active", tab === "trombi");
    // Chargements paresseux (1re ouverture, gardés en mémoire ensuite). On reste
    // sur /light, donc la socket de chat de la page parente n'est jamais coupée
    // pendant qu'on consulte le forum / joue / regarde les scores.
    if (tab === "forum") {
      var fr = $("#forum-frame");
      if (fr && !fr.getAttribute("src") && state.sid) {
        fr.setAttribute("src", "/fb/?sid=" + encodeURIComponent(state.sid) + "&from=light");
      }
    }
    if (tab === "grapiz") {
      var gf = $("#grapiz-frame");
      if (gf && !gf.getAttribute("src") && state.sid) {
        gf.setAttribute("src", "/grapiz/?sid=" + encodeURIComponent(state.sid));
      }
    }
    if (tab === "bandas") {
      var bf = $("#bandas-frame");
      if (bf && !bf.getAttribute("src") && state.sid) {
        bf.setAttribute("src", "/bandas/?sid=" + encodeURIComponent(state.sid));
      }
    }
    if (tab === "swapou") {
      var sf = $("#swapou-frame");
      if (sf && !sf.getAttribute("src") && state.sid) {
        sf.setAttribute("src", "/swapou/?sid=" + encodeURIComponent(state.sid));
      }
    }
    // Les scores évoluent toute la journée : on rafraîchit à chaque ouverture.
    if (tab === "scores") loadChallengeScores();
    if (tab === "trombi") loadTrombi();
  }

  // ── Mes disques (feuille de lancement des jeux) ──
  // Reprend le look de l'inventaire d'accessoires : un FrusionDisc par jeu
  // jouable. Un clic ferme la feuille et bascule sur le panneau du jeu.
  var DISCS = [
    { tab: "bandas", img: "/fb/fd_bandas.png", name: "Frutibandas" },
    { tab: "grapiz", img: "/fb/fd_grapiz.png", name: "Grapiz" },
    { tab: "swapou", img: "/fb/fd_swapou.png", name: "Swapou" },
  ];
  function renderDiscs() {
    var grid = $("#disques-grid");
    if (!grid) return;
    grid.innerHTML = "";
    DISCS.forEach(function (d) {
      var item = el("div", "fd-item");
      item.innerHTML = '<div class="thumb"><img src="' + d.img + '" alt="' + xmlEscape(d.name)
        + '" onerror="this.replaceWith(document.createTextNode(\'💿\'))"></div>'
        + '<div class="lbl">' + xmlEscape(d.name) + '</div>';
      item.addEventListener("click", function () { closeDisquesSheet(); activateTab(d.tab); });
      grid.appendChild(item);
    });
  }
  function openDisquesSheet() {
    openMenu(false);
    renderDiscs();
    $("#disques-sheet-backdrop").classList.add("show");
    $("#disques-sheet").classList.add("show");
  }
  function closeDisquesSheet() {
    $("#disques-sheet-backdrop").classList.remove("show");
    $("#disques-sheet").classList.remove("show");
  }
  // Ouverture via la tuile « Mes disques » de l'accueil (cf. home-tile[data-go]).
  $("#disques-sheet-close").addEventListener("click", closeDisquesSheet);
  $("#disques-sheet-backdrop").addEventListener("click", closeDisquesSheet);

  // ── Boutique (achat d'accessoires) ──
  // Solde de kikooz + accessoires achetables (sans fonds d'écran). L'aperçu pose
  // l'accessoire sur la bouille du joueur (réutilise buildState/previewIframe).
  // L'achat débite les kikooz ; l'accessoire devient ensuite équipable dans
  // « Mon inventaire ».
  var shopItems = [];
  function setShopWallet(k) {
    var w = $("#shop-wallet");
    if (w) w.innerHTML = '🪙 <strong>' + (Number(k) || 0) + '</strong> kikooz';
  }
  function shopHint(msg, cls) {
    var h = $("#shop-hint");
    if (!h) return;
    h.className = "sheet-hint" + (cls ? " " + cls : "");
    h.textContent = msg;
  }
  function renderShop() {
    var grid = $("#shop-grid");
    if (!grid) return;
    grid.innerHTML = "";
    if (!shopItems.length) {
      grid.innerHTML = '<div class="sheet-hint">Aucun accessoire disponible pour le moment.</div>';
      return;
    }
    shopItems.forEach(function (it, i) {
      var st = buildState(myBase, it.suffix9, null);
      var item = el("div", "shop-item");
      item.innerHTML = '<div class="thumb">' + previewIframe(st) + '</div>'
        + '<div class="shop-name">' + xmlEscape(it.name) + '</div>'
        + '<div class="shop-price">' + (Number(it.price) || 0) + ' kikooz</div>'
        + (it.owned
            ? '<button class="shop-buy owned" disabled>Possédé</button>'
            : '<button class="shop-buy" data-i="' + i + '">Acheter</button>');
      grid.appendChild(item);
    });
    Array.prototype.forEach.call(grid.querySelectorAll(".shop-buy:not(.owned)"), function (b) {
      b.addEventListener("click", function () { buyShopItem(Number(b.getAttribute("data-i")), b); });
    });
  }
  function loadShop() {
    setShopWallet(0);
    shopHint("Accessoires disponibles :");
    $("#shop-grid").innerHTML = '<div class="sheet-hint">Chargement…</div>';
    fetch("/api/light/shop?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.bouille && !isIncarnation(d.bouille)) myBase = d.bouille;
        setShopWallet(d && d.kikooz);
        shopItems = (d && d.items) || [];
        renderShop();
      })
      .catch(function () {
        $("#shop-grid").innerHTML = '<div class="sheet-hint">Boutique indisponible.</div>';
      });
  }
  function buyShopItem(i, btn) {
    var it = shopItems[i];
    if (!it || it.owned) return;
    if (!window.confirm("Acheter « " + it.name + " » pour " + it.price + " kikooz ?")) return;
    btn.disabled = true; btn.textContent = "…";
    fetch("/api/light/shop/buy", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: state.sid, id: it.id }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          it.owned = true;
          setShopWallet(d.kikooz);
          renderShop();
          shopHint("✓ « " + it.name + " » acheté ! Retrouve-le dans « Mon inventaire ».", "ok");
        } else {
          if (d && d.kikooz !== undefined) setShopWallet(d.kikooz);
          renderShop();
          shopHint((d && d.error) || "Achat impossible.", "err");
        }
      })
      .catch(function () {
        renderShop();
        shopHint("Erreur réseau, réessaie.", "err");
      });
  }
  function openShopSheet() {
    openMenu(false);
    $("#shop-sheet-backdrop").classList.add("show");
    $("#shop-sheet").classList.add("show");
    loadShop();
  }
  function closeShopSheet() {
    $("#shop-sheet-backdrop").classList.remove("show");
    $("#shop-sheet").classList.remove("show");
  }
  // Ouverture via la tuile « Boutique » de l'accueil (cf. home-tile[data-go]).
  $("#shop-sheet-close").addEventListener("click", closeShopSheet);
  $("#shop-sheet-backdrop").addEventListener("click", closeShopSheet);

  // ── Scores du jour (Challenge) ──
  // Tableau en lecture seule alimenté par /api/light/challenge : un onglet (chip)
  // par jeu, le classement du jour en dessous. La ligne du joueur courant (isMe)
  // est mise en avant.
  var challengeScores = null;   // dernière réponse de l'API
  var scoresGameIdx = 0;        // jeu sélectionné dans la barre de chips
  function loadChallengeScores() {
    var body = $("#scores-body");
    if (body && !challengeScores) body.innerHTML = '<div class="scores-loading">Chargement…</div>';
    fetch("/api/light/challenge?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        challengeScores = d;
        if (scoresGameIdx >= (d.games || []).length) scoresGameIdx = 0;
        renderScoresTabs();
        renderScoresBody();
      })
      .catch(function () {
        if (body) body.innerHTML = '<div class="scores-empty">Scores indisponibles pour le moment.</div>';
      });
  }
  function renderScoresTabs() {
    var tabs = $("#scores-tabs");
    if (!tabs || !challengeScores) return;
    tabs.innerHTML = "";
    (challengeScores.games || []).forEach(function (g, i) {
      var b = el("button", "scores-tab" + (i === scoresGameIdx ? " active" : ""));
      b.textContent = g.name;
      b.addEventListener("click", function () {
        scoresGameIdx = i; renderScoresTabs(); renderScoresBody();
      });
      tabs.appendChild(b);
    });
  }
  // jeu (API) → suffixe des assets de médailles /fb/medal_{couleur}_{clé}.png
  var MEDAL_ASSET_KEY = {
    bandas: "bandas", grapiz: "grapiz", swapou2: "swapou",
    bkiwi: "bk", snake3: "snake", mb2: "mb2", kaluga: "kaluga",
  };
  // Bandeau « médaillés d'hier » en tête du tableau d'un jeu (vide si aucun).
  function podiumHtml(g) {
    if (!g.podium || !g.podium.length) return "";
    var ak = MEDAL_ASSET_KEY[g.game] || g.game;
    var h = '<div class="podium"><div class="podium-title">Médaillés d\'hier</div>';
    g.podium.forEach(function (p) {
      h += '<span class="pod-item">'
        + '<img class="pod-medal" src="/fb/medal_' + p.medal + '_' + ak + '.png" alt="'
        + xmlEscape(p.medal) + '" onerror="this.style.display=\'none\'">'
        + '<span class="pod-name">' + xmlEscape(p.user) + '</span></span>';
    });
    return h + '</div>';
  }
  function renderScoresBody() {
    var body = $("#scores-body");
    if (!body || !challengeScores) return;
    var g = (challengeScores.games || [])[scoresGameIdx];
    if (!g) { body.innerHTML = ""; return; }
    var html = podiumHtml(g); // podium de la veille en tête (le cas échéant)
    if (!g.scores || !g.scores.length) {
      html += '<div class="scores-empty">Aucun score pour « ' + xmlEscape(g.name) + ' » aujourd\'hui.<br>'
        + 'À toi de lancer la première partie&nbsp;!</div>';
    } else {
      var n = g.count || g.scores.length;
      html += '<div class="scores-cap">' + xmlEscape(g.name) + ' — '
        + n + ' joueur' + (n > 1 ? 's' : '') + ' aujourd\'hui</div><ol class="scores-list">';
      g.scores.forEach(function (s, i) {
        var pos = i + 1;
        var cls = "score-row" + (pos <= 3 ? " r" + pos : "") + (s.isMe ? " me" : "");
        html += '<li class="' + cls + '">'
          + '<span class="pos">' + pos + '</span>'
          + '<span class="pname">' + xmlEscape(s.user) + '</span>'
          + (s.isMe ? '<span class="me-badge">toi</span>' : '')
          + '<span class="pscore">' + xmlEscape(s.label) + '</span>'
          + '</li>';
      });
      html += '</ol>';
    }
    body.innerHTML = html;
    body.scrollTop = 0;
  }

  // ── Logout ── (the "Quitter" menu item was removed from the light client.)

  // ── WebSocket (CBee bridge at "/") ──
  function wsUrl() {
    var proto = window.location.protocol === "https:" ? "wss" : "ws";
    return proto + "://" + window.location.host + "/";
  }
  function setConnected(on) {
    state.connected = on;
    var cd = $("#conn-dot"); if (cd) cd.classList.toggle("on", on); // (voyant retiré de l'accueil)
    $("#compose-input").disabled = !on;
    $("#compose-send").disabled = !on;
    var at = $("#accent-toggle"); if (at) at.disabled = !on;
  }
  function connectWs() {
    var ws;
    try { ws = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
    state.ws = ws;
    ws.onopen = function () {
      // Identify with our session, then join the default room. lc="1" tells the
      // server we're the light client and want the recent-chat-history replay on
      // (re)join — so switching tabs on mobile no longer empties the salon.
      wsSend('<k l="' + xmlEscape(state.user) + '" s="' + xmlEscape(state.sid) + '" lc="1" />');
    };
    ws.onmessage = function (ev) { onWsData(ev.data); };
    ws.onclose = function () {
      setConnected(false);
