<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#84c640">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Frutiparc — Mobile</title>
<style>
  /* Frutiparc green palette — same family as forum / admin / Club. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #ADE76B;
    color: #2C4A0F;
    font-family: 'Verdana', Arial, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    /* Height is driven by JS from window.visualViewport (the area NOT covered by
       the mobile keyboard) via the --app-h custom property; the static values
       are fallbacks for browsers without visualViewport. overflow:hidden on
       html+body stops the whole page scrolling when the keyboard opens — only
       the #messages list scrolls. */
    height: 100vh;
    height: 100dvh;
    height: var(--app-h, 100dvh);
    overflow: hidden;
    position: fixed;
    left: 0; right: 0; top: 0;
  }
  a { color: #2f6b16; }
  button { font-family: inherit; cursor: pointer; }

  /* ── Single compact top bar ── */
  #topbar {
    background: #84c640; border-bottom: 2px solid #5a8a20;
    padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  #topbar select {
    flex: 1; min-width: 0; padding: 8px; font-size: 15px;
    border: 1px solid #5a8a20; border-radius: 6px; background: #fff; color: #2C4A0F;
  }
  #topbar .count { font-size: 12px; color: #2f5510; white-space: nowrap; }
  .icon-btn {
    background: #fff; border: 1px solid #2C4A0F; border-radius: 7px;
    font-size: 17px; line-height: 1; padding: 7px 10px; color: #2C4A0F; flex-shrink: 0;
  }
  #menu-btn { font-size: 18px; }

  /* ── Hamburger menu drawer ── */
  #menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 35; display: none; }
  #menu-backdrop.show { display: block; }
  #menu-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 74%; max-width: 290px; z-index: 36;
    background: #fff; border-right: 2px solid #2C4A0F; display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: 6px 0 18px rgba(44,74,15,.25);
  }
  #menu-drawer.open { transform: translateX(0); }
  #menu-drawer .menu-head {
    background: #84c640; color: #2C4A0F; padding: 14px 16px; font-weight: bold;
    border-bottom: 1px solid #5a8a20; display: flex; align-items: center; gap: 8px; font-size: 15px;
  }
  #menu-drawer .menu-head .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0392b; display: inline-block; }
  #menu-drawer .menu-head .dot.on { background: #2ecc40; }
  .menu-item {
    background: transparent; border: 0; border-bottom: 1px solid #eef6e0;
    text-align: left; padding: 14px 16px; font-size: 15px; color: #2C4A0F; font-weight: bold;
    display: flex; align-items: center; gap: 10px;
  }
  .menu-item.active { background: #eaf6d6; }
  .menu-item.danger { color: #b23b2e; }
  .menu-spacer { flex: 1; }

  /* ── Bouille bottom sheet ── */
  #bouille-sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none;
  }
  #bouille-sheet-backdrop.show { display: block; }
  #bouille-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: #ADE76B; border-top: 2px solid #2C4A0F;
    border-radius: 16px 16px 0 0; max-height: 76vh; display: flex; flex-direction: column;
    transform: translateY(110%); transition: transform .25s ease;
    box-shadow: 0 -8px 24px rgba(44,74,15,.3);
  }
  #bouille-sheet.show { transform: translateY(0); }
  #bouille-sheet .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; font-weight: bold; color: #2C4A0F;
    border-bottom: 1px solid #5a8a20;
  }
  #bouille-sheet .sheet-head button {
    background: transparent; border: 0; font-size: 18px; color: #2C4A0F;
  }
  #bouille-sheet .sheet-body { padding: 12px 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet-preview { display: flex; justify-content: center; margin-bottom: 10px; }
  #bouille-sheet-preview {
    width: 132px; height: 132px; background: #fff; border: 2px solid #2C4A0F;
    border-radius: 14px; overflow: hidden;
  }
  #bouille-sheet-preview iframe { width: 100%; height: 100%; border: 0; display: block; background: #E8F8D3; }
  .sheet-hint { font-size: 12px; color: #2f5510; margin-bottom: 8px; font-weight: bold; }
  .acc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .acc-item {
    background: #fff; border: 2px solid transparent; border-radius: 12px;
    padding: 6px; text-align: center; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .acc-item.sel { border-color: #2C4A0F; background: #eaf6d6; }
  .acc-item .thumb {
    width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden;
    background: #E8F8D3; position: relative;
  }
  /* The Ruffle preview iframe must NOT eat the tap, otherwise the .acc-item
     click never fires and selection silently does nothing. pointer-events:none
     lets the tap fall through to the card. */
  .acc-item .thumb iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  /* Transparent overlay above the iframe guarantees the whole tile is tappable
     (belt-and-suspenders on browsers that still route touch to the iframe). */
  .acc-item .thumb::after { content: ""; position: absolute; inset: 0; }
  .acc-item .lbl {
    font-size: 10px; color: #2C4A0F; margin-top: 4px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Generic panel ── */
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }

  /* ── Login screen ── */
  #login-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 14px;
  }
  #login-screen .card {
    background: #fff; border: 2px solid #2C4A0F; border-radius: 14px;
    padding: 22px 18px; width: 100%; max-width: 340px;
    box-shadow: 0 10px 22px rgba(44,74,15,.22);
  }
  #login-screen h2 { margin: 0 0 4px; font-size: 18px; text-align: center; }
  #login-screen .tag { text-align: center; color: #5a8a20; font-size: 11px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 10px; font-size: 16px;
    border: 1px solid #5a8a20; border-radius: 7px; background: #fbfff5; color: #2C4A0F;
  }
  .btn-primary {
    width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: bold;
    background: #2C4A0F; color: #CFF599; border: 0; border-radius: 8px;
  }
  .btn-primary:disabled { opacity: .6; }
  .err { color: #b23b2e; font-size: 12px; margin-top: 10px; text-align: center; min-height: 14px; }

  /* ── Chat ── */
  #chat-panel { }

  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px;
    background: #f3fbe6; -webkit-overflow-scrolling: touch;
  }
  .msg { margin: 3px 0; line-height: 1.4; word-wrap: break-word; }
  .msg .time { color: #8aa86a; font-size: 11px; margin-right: 4px; }
  .msg .from { font-weight: bold; color: #2f6b16; }
  .msg .from.me { color: #1b6ea8; }
  .msg.system { color: #6b8a3f; font-style: italic; font-size: 12.5px; }
  .msg.admin { color: #b23b2e; }
  .msg .body { color: #2C4A0F; }

  .compose {
    display: flex; gap: 7px; padding: 8px; background: #cdeb9d;
    border-top: 1px solid #5a8a20; flex-shrink: 0;
  }
  .compose input {
    flex: 1; padding: 11px 12px; font-size: 16px; border: 1px solid #5a8a20;
    border-radius: 20px; background: #fff; color: #2C4A0F;
  }
  .compose button {
    background: #2C4A0F; color: #CFF599; border: 0; border-radius: 20px;
    padding: 0 18px; font-size: 14px; font-weight: bold;
  }
  .compose button:disabled { opacity: .5; }

  /* Bouille reaction overlay — a live Ruffle bouille (vector = crisp), centered
     over the messages with NO card/background. It slides in from the left edge
     of the chat and slides back out to the left. pointer-events stay off so the
     chat underneath remains readable/scrollable. */
  #bouille-overlay {
    position: absolute; left: 0; top: 0; right: 0; bottom: 56px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; overflow: hidden;
  }
  #bouille-overlay-stage {
    width: 200px; height: 200px; max-width: 56vw; max-height: 56vw;
    /* Start fully off the left edge; .show brings it to center. */
    transform: translateX(-130vw);
    opacity: 0;
    transition: transform .5s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
    will-change: transform, opacity;
  }
  #bouille-overlay.show #bouille-overlay-stage { transform: translateX(0); opacity: 1; }
  #bouille-overlay.leaving #bouille-overlay-stage { transform: translateX(-130vw); opacity: 0; }
  #bouille-overlay-stage iframe {
    width: 100%; height: 100%; border: 0; background: transparent; display: block;
  }
  /* Small floating caption so you still know who reacts, but unobtrusive. */
  #bouille-overlay-name {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; font-weight: bold; color: #2C4A0F;
    background: rgba(255,255,255,.82); border: 1px solid #5a8a20;
    border-radius: 10px; padding: 2px 9px; max-width: 78vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .3s ease;
  }
  #bouille-overlay.show #bouille-overlay-name { opacity: 1; }

  /* User list drawer */
  #users-drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 72%; max-width: 280px;
    background: #fff; border-left: 2px solid #2C4A0F; z-index: 30;
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column; box-shadow: -6px 0 18px rgba(44,74,15,.25);
  }
  #users-drawer.open { transform: translateX(0); }
  #users-drawer h3 { margin: 0; padding: 12px 14px; background: #84c640; color: #2C4A0F; font-size: 14px; border-bottom: 1px solid #5a8a20; }
  #users-drawer .list { flex: 1; overflow-y: auto; padding: 6px 0; }
  #users-drawer .u { padding: 9px 14px; border-bottom: 1px solid #eef6e0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #users-drawer .u .badge { font-size: 9px; background: #2C4A0F; color: #CFF599; border-radius: 3px; padding: 1px 5px; }
  #drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 25; display: none; }
  #drawer-backdrop.show { display: block; }

  /* ── Forum panel ── */
  #forum-panel { align-items: center; justify-content: center; padding: 28px; text-align: center; gap: 14px; }
  #forum-panel .big {
    font-size: 16px; max-width: 300px; line-height: 1.5; color: #2f5510;
  }
  #forum-panel a.forum-link {
    display: inline-block; background: #2C4A0F; color: #CFF599; text-decoration: none;
    padding: 14px 22px; border-radius: 10px; font-weight: bold; font-size: 15px;
    box-shadow: 0 8px 18px rgba(44,74,15,.22);
  }

  .hidden { display: none !important; }
  .banner {
    background: #fff3cd; color: #7a5b00; border-bottom: 1px solid #e0c97a;
    font-size: 12px; padding: 7px 10px; text-align: center; flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- ───────── Login ───────── -->
<div id="login-screen">
  <div class="card">
    <h2>Frutiparc</h2>
    <div class="tag">version mobile · chat & forum</div>
    <form id="login-form" autocomplete="on">
      <label for="li-user">Pseudo</label>
      <input type="text" id="li-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="li-pass">Mot de passe</label>
      <input type="password" id="li-pass" autocomplete="current-password">
      <button type="submit" class="btn-primary" id="li-btn">Se connecter</button>
      <div class="err" id="li-err"></div>
    </form>
  </div>
</div>

<!-- ───────── App (after login) ───────── -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <!-- Single compact top bar: hamburger · room selector · members.
       Everything else (account, navigation, quitter) lives in the menu drawer
       to keep vertical space for the conversation. -->
  <header id="topbar">
    <button class="icon-btn" id="menu-btn" title="Menu" aria-label="Menu">☰</button>
    <select id="room-select" aria-label="Salon"></select>
    <span class="count" id="room-count">0</span>
    <button class="icon-btn" id="users-btn" title="Connectés">👥</button>
  </header>

  <!-- Slide-in menu drawer (hamburger) -->
  <div id="menu-backdrop"></div>
  <nav id="menu-drawer">
    <div class="menu-head">
      <span class="dot" id="conn-dot"></span>
      <span id="who-name">—</span>
    </div>
    <button class="menu-item active" data-tab="chat">💬 Salons</button>
    <button class="menu-item" data-tab="forum">📋 Forum</button>
    <button class="menu-item" id="bouille-btn">🙂 Ma bouille</button>
    <div class="menu-spacer"></div>
    <button class="menu-item danger" id="logout-btn">🚪 Quitter</button>
  </nav>

  <!-- Chat -->
  <section class="panel active" id="chat-panel" style="position:relative">
    <div id="messages"></div>

    <!-- Bouille overlay: live Ruffle bouille (transparent) reacting to chat,
         centered over the messages, sliding in/out from the left. -->
    <div id="bouille-overlay">
      <div id="bouille-overlay-stage"></div>
      <div id="bouille-overlay-name"></div>
    </div>

    <form class="compose" id="compose-form">
      <input type="text" id="compose-input" placeholder="Message…" autocomplete="off" maxlength="300" disabled>
      <button type="submit" id="compose-send" disabled>Envoyer</button>
    </form>

    <div id="drawer-backdrop"></div>
    <div id="users-drawer">
      <h3>Connectés <span id="drawer-count"></span></h3>
      <div class="list" id="users-list"></div>
    </div>
  </section>

  <!-- Forum -->
  <section class="panel" id="forum-panel">
    <div class="big">Le forum complet s'ouvre dans une page dédiée, adaptée au mobile.</div>
    <a class="forum-link" id="forum-link" href="#">Ouvrir le forum →</a>
  </section>

  <!-- Bouille / accessory picker (bottom sheet) -->
  <div id="bouille-sheet-backdrop"></div>
  <div id="bouille-sheet">
    <div class="sheet-head">
      <span>Ma bouille</span>
      <button id="bouille-sheet-close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-preview"><div id="bouille-sheet-preview"></div></div>
      <div class="sheet-hint" id="bouille-sheet-hint">Choisis un accessoire de ton inventaire :</div>
      <div id="bouille-acc-grid" class="acc-grid"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function $(s) { return document.querySelector(s); }
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  // Public salons (mirror server-side `channels`). bienvenue first as default.
  var ROOMS = [
    ["bienvenue", "Bienvenue"], ["pomme", "Pomme"], ["abricot", "Abricot"],
    ["poire", "Poire"], ["fraise", "Fraise"], ["citron", "Citron"],
    ["kiwi", "Kiwi"], ["raisin", "Raisin"], ["orange", "Orange"],
    ["cerise", "Cerise"], ["banane", "Banane"],
  ];

  var state = {
    sid: "",
    user: "",          // display name
    userLower: "",
    room: "",
    ws: null,
    connected: false,
    reconnectTimer: null,
    intentionalClose: false,
    usersByRoom: {},   // room -> Set of display names
    bouilleByUser: {}, // lowercased pseudo -> bouille state string "f"
    overlayTimer: null,
  };

  var DEFAULT_BOUILLE = "000000010000000000000000";

  // ── XML helpers (CBee protocol) ──
  // For ATTRIBUTES (sid, room, pseudo): full escaping, incl. & and ".
  function xmlEscape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // For the message BODY: the server's parser reads element content literally
  // with /([^<]*)</ — it does NOT unescape entities and TRUNCATES at the first
  // "<". So a literal "<" can't survive (the Flash client has the same limit),
  // and pre-escaping to "&lt;" would be double-escaped on rebroadcast and shown
  // as the raw entity. We therefore map "<"/">" to the look-alike guillemets
  // ‹ › (not XML-special, visually near-identical). A literal "&" is safe: the
  // server re-escapes it to "&amp;" and our xmlUnescape restores it.
  function bodyEscape(s) {
    return String(s == null ? "" : s).replace(/</g, "‹").replace(/>/g, "›");
  }
  function xmlUnescape(s) {
    return String(s == null ? "" : s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'").replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  }
  function attr(xml, name) {
    var m = xml.match(new RegExp("\\b" + name + '="([^"]*)"'));
    return m ? m[1] : "";
  }
  function tagName(xml) {
    var m = xml.match(/^<(\w+)/);
    return m ? m[1] : "";
  }
  function bodyOf(xml) {
    // text between the first '>' and the matching '</'
    var m = xml.match(/^<[^>]*>([\s\S]*)<\/[^>]+>$/);
    return m ? m[1] : "";
  }

  // ── Login ──
  var loginForm = $("#login-form");
  loginForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var user = $("#li-user").value.trim();
    var pass = $("#li-pass").value;
    var errEl = $("#li-err");
    errEl.textContent = "";
    if (!user || !pass) { errEl.textContent = "Pseudo et mot de passe requis."; return; }
    var btn = $("#li-btn");
    btn.disabled = true; btn.textContent = "Connexion…";
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        btn.disabled = false; btn.textContent = "Se connecter";
        if (!res.ok || !res.d || !res.d.ok) {
          errEl.textContent = (res.d && res.d.message) || "Identifiants invalides.";
          return;
        }
        state.sid = res.d.sid;
        state.user = res.d.username || user;
        state.userLower = String(state.user).toLowerCase();
        startApp();
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = "Se connecter";
        errEl.textContent = "Erreur réseau. Réessaie.";
      });
  });

  // ── App start ──
  function startApp() {
    $("#login-screen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    $("#who-name").textContent = state.user;
    $("#forum-link").href = "/fb/?sid=" + encodeURIComponent(state.sid);

    // Build room selector
    var sel = $("#room-select");
    sel.innerHTML = "";
    ROOMS.forEach(function (r) {
      var o = el("option"); o.value = r[0]; o.textContent = r[1]; sel.appendChild(o);
    });
    sel.value = ROOMS[0][0];
    sel.addEventListener("change", function () { switchRoom(sel.value); });

    connectWs();
  }

  // ── Hamburger menu drawer ──
  function openMenu(open) {
    $("#menu-drawer").classList.toggle("open", open);
    $("#menu-backdrop").classList.toggle("show", open);
  }
  $("#menu-btn").addEventListener("click", function () { openMenu(true); });
  $("#menu-backdrop").addEventListener("click", function () { openMenu(false); });

  // ── Navigation (menu items with data-tab) ──
  Array.prototype.forEach.call(document.querySelectorAll(".menu-item[data-tab]"), function (b) {
    b.addEventListener("click", function () {
      var tab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll(".menu-item[data-tab]"), function (x) {
        x.classList.toggle("active", x === b);
      });
      $("#chat-panel").classList.toggle("active", tab === "chat");
      $("#forum-panel").classList.toggle("active", tab === "forum");
      openMenu(false);
    });
  });

  // ── Logout ──
  $("#logout-btn").addEventListener("click", function () {
    state.intentionalClose = true;
    try { if (state.ws) state.ws.close(); } catch (e) {}
    window.location.href = "/light/logout?sid=" + encodeURIComponent(state.sid);
  });

  // ── WebSocket (CBee bridge at "/") ──
  function wsUrl() {
    var proto = window.location.protocol === "https:" ? "wss" : "ws";
    return proto + "://" + window.location.host + "/";
  }
  function setConnected(on) {
    state.connected = on;
    $("#conn-dot").classList.toggle("on", on);
    $("#compose-input").disabled = !on;
    $("#compose-send").disabled = !on;
  }
  function connectWs() {
    var ws;
    try { ws = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
    state.ws = ws;
    ws.onopen = function () {
      // Identify with our session, then join the default room.
      wsSend('<k l="' + xmlEscape(state.user) + '" s="' + xmlEscape(state.sid) + '" />');
    };
    ws.onmessage = function (ev) { onWsData(ev.data); };
    ws.onclose = function () {
      setConnected(false);
      if (!state.intentionalClose) { systemLine("Connexion perdue. Reconnexion…"); scheduleReconnect(); }
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function scheduleReconnect() {
    if (state.reconnectTimer) return;
    state.reconnectTimer = setTimeout(function () {
      state.reconnectTimer = null;
      connectWs();
    }, 2500);
  }
  function wsSend(xml) {
    try { if (state.ws && state.ws.readyState === 1) state.ws.send(xml); } catch (e) {}
  }

  // Incoming data may contain several \0-delimited frames.
  var rxBuffer = "";
  function onWsData(data) {
    if (typeof data !== "string") {
      // Blob/ArrayBuffer → decode then re-handle.
      if (data instanceof Blob) { data.text().then(onWsData); return; }
      try { data = new TextDecoder("utf-8").decode(data); } catch (e) { return; }
    }
    rxBuffer += data;
    var parts = rxBuffer.split("\0");
    rxBuffer = parts.pop();
    for (var i = 0; i < parts.length; i++) {
      var frame = parts[i].trim();
      if (frame) handleFrame(frame);
    }
  }

  function handleFrame(xml) {
    var tag = tagName(xml);
    switch (tag) {
      case "k": // ident response
        if (attr(xml, "k") === "401") { systemLine("Connexion refusée (session expirée)."); return; }
        setConnected(true);
        // ident OK → join the current/default room.
        switchRoom($("#room-select").value || ROOMS[0][0]);
        break;

      case "o": // join confirmed: <o g="room" p="">...</o>
        // nothing extra; userlist follows
        break;

      case "p": { // userlist for a room
        var room = attr(xml, "g");
        if (!room) break;
        var set = {};
        var re = /<u\b([^>]*)\/>/g, mm;
        var inner = xml.replace(/^<p[^>]*>/, "").replace(/<\/p>$/, "");
        while ((mm = re.exec(inner)) !== null) {
          var frag = "<u " + mm[1] + "/>";
          var uname = attr(frag, "u");
          if (uname) { set[uname] = true; rememberBouille(uname, attr(frag, "f")); }
        }
        state.usersByRoom[room] = set;
        if (room === state.room) renderUsers();
        break;
      }

      case "z": { // trace push: <z><u u=".." f="<bouille>" .../></z> — bouille data
        var zre = /<u\b([^>]*)\/>/g, zm;
        while ((zm = zre.exec(xml)) !== null) {
          var zf = "<u " + zm[1] + "/>";
          rememberBouille(attr(zf, "u"), attr(zf, "f"));
        }
        break;
      }

      case "v": { // userjoined: <v u="..." f="<bouille>" g="room" />
        var rj = attr(xml, "g"); var uj = attr(xml, "u");
        if (rj && uj) {
          rememberBouille(uj, attr(xml, "f"));
          if (!state.usersByRoom[rj]) state.usersByRoom[rj] = {};
          state.usersByRoom[rj][uj] = true;
          if (rj === state.room) { renderUsers(); systemLine(uj + " a rejoint le salon."); }
        }
        break;
      }

      case "u": { // userleaved: <u u="..." g="room" />
        var rl = attr(xml, "g"); var ul = attr(xml, "u");
        if (rl && state.usersByRoom[rl]) {
          delete state.usersByRoom[rl][ul];
          if (rl === state.room) { renderUsers(); systemLine(ul + " a quitté le salon."); }
        }
        break;
      }

      case "t": { // chat message: <t u="from" t="m" h="[hh:mm:ss] " ...>body</t>
        var from = attr(xml, "u");
        var ty = attr(xml, "t") || "m";
        var h = attr(xml, "h");
        var body = bodyOf(xml);
        // Image/gift frames carry a child node; show a placeholder rather than raw XML.
        if (ty === "i" || ty === "g" || /^</.test(body.trim())) {
          addMessage({ from: from, time: h, body: ty === "i" ? "[image]" : "[cadeau]", kind: "system" });
          break;
        }
        var text = xmlUnescape(body);
        var kind = (from === "admin") ? "admin" : "normal";
        addMessage({ from: from, time: h, body: text, kind: kind });
        // Bouille overlay: show the speaker's avatar reacting to what they wrote.
        if (from && from !== "admin") showBouilleOverlay(from, detectAnim(text));
        break;
      }

      case "an": { // topic change — show as a system line
        var t = bodyOf(xml);
        if (t) systemLine("Sujet : " + xmlUnescape(t));
        break;
      }

      case "bb": // onmute: <bb u=".." mu=".." />
        systemLine("Tu as été réduit au silence (totoché).");
        break;

      case "ah": { // onban: kicked/banned from a room
        var by = attr(xml, "by");
        systemLine("Tu as été exclu du salon" + (by ? " par " + by : "") + ".");
        // server removed us; refresh room membership
        break;
      }

      case "a": { // error: <a k="403" />
        var code = attr(xml, "k");
        if (code === "403") systemLine("Accès refusé (tu es peut-être banni de ce salon).");
        break;
      }

      default:
        // ping (e), trace (z), and others — ignore for the light client.
        break;
    }
  }

  // ── Room switching ──
  function switchRoom(room) {
    if (!room) return;
    if (state.room && state.room !== room) {
      wsSend('<y g="' + xmlEscape(state.room) + '" />'); // part previous
    }
    state.room = room;
    $("#room-select").value = room;
    clearMessages();
    var label = (ROOMS.filter(function (r) { return r[0] === room; })[0] || [room, room])[1];
    systemLine("— Salon " + label + " —");
    wsSend('<o g="' + xmlEscape(room) + '" />'); // join
    renderUsers();
  }

  // ── Messages UI ──
  var msgEl = $("#messages");
  function nearBottom() {
    return (msgEl.scrollHeight - msgEl.scrollTop - msgEl.clientHeight) < 60;
  }
  function scrollDown() { msgEl.scrollTop = msgEl.scrollHeight; }
  function clearMessages() { msgEl.innerHTML = ""; }
  function cleanTime(h) {
    // server sends "[hh:mm:ss] " — keep hh:mm only, compact.
    var m = String(h || "").match(/(\d{2}):(\d{2})/);
    return m ? (m[1] + ":" + m[2]) : "";
  }
  function addMessage(o) {
    var stick = nearBottom();
    var row = el("div", "msg" + (o.kind === "system" ? " system" : o.kind === "admin" ? " admin" : ""));
    if (o.kind === "system") {
      row.textContent = o.body;
    } else {
      var t = cleanTime(o.time);
      if (t) { var ts = el("span", "time"); ts.textContent = t; row.appendChild(ts); }
      var fr = el("span", "from" + (String(o.from).toLowerCase() === state.userLower ? " me" : ""));
      fr.textContent = (o.from || "?") + " : ";
      row.appendChild(fr);
      var bd = el("span", "body");
      bd.textContent = o.body;
      row.appendChild(bd);
    }
    msgEl.appendChild(row);
    // Cap DOM size for long sessions.
    while (msgEl.childNodes.length > 400) msgEl.removeChild(msgEl.firstChild);
    if (stick) scrollDown();
  }
  function systemLine(text) { addMessage({ kind: "system", body: text }); }

  // ── Compose ──
  $("#compose-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var inp = $("#compose-input");
    var text = inp.value;
    if (!text.trim() || !state.connected || !state.room) return;
    // Send as a normal message frame; the body uses bodyEscape (see helper).
    wsSend('<t g="' + xmlEscape(state.room) + '" t="m" p="">' + bodyEscape(text) + "</t>");
    inp.value = "";
    inp.focus();
  });

  // ── Users drawer ──
  function renderUsers() {
    var set = state.usersByRoom[state.room] || {};
    var names = Object.keys(set).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    $("#room-count").textContent = names.length + " 👤";
    $("#drawer-count").textContent = "(" + names.length + ")";
    var list = $("#users-list");
    list.innerHTML = "";
    names.forEach(function (n) {
      var u = el("div", "u");
      var nm = el("span"); nm.textContent = n;
      u.appendChild(nm);
      if (n.toLowerCase() === state.userLower) {
        var b = el("span", "badge"); b.textContent = "toi"; u.appendChild(b);
      }
      list.appendChild(u);
    });
  }
  function openDrawer(open) {
    $("#users-drawer").classList.toggle("open", open);
    $("#drawer-backdrop").classList.toggle("show", open);
  }
  $("#users-btn").addEventListener("click", function () { openDrawer(true); });
  $("#drawer-backdrop").addEventListener("click", function () { openDrawer(false); });

  // ── Bouille overlay ──────────────────────────────────────────────────────
  // Remember each speaker's bouille state (carried by <p>/<v>/<z> frames), so
  // when they talk we can render the right avatar.
  function rememberBouille(pseudo, f) {
    if (!pseudo || !f) return;
    var clean = String(f).replace(/[^0-9A-Za-z]/g, "");
    if (clean.length >= 4) state.bouilleByUser[String(pseudo).toLowerCase()] = clean;
  }

  // Map a chat line to a bouille animation id (subset accepted by /bouille-img:
  // parle, rire, mdr, langue, rougir, regard, sifflote, gum, question, miam,
  // pleurer). The default for any normal line is "parle" (talking).
  function detectAnim(text) {
    var t = " " + String(text || "").toLowerCase() + " ";
    if (/\bm+d+r+\b|\bptdr\b|\blmao\b|\brofl\b|😂|🤣/.test(t)) return "mdr";
    if (/\bl+o+l+\b|\bha+ha+\b|\bhe+he+\b|\beheh\b|😄|😁|😆|\bxd\b/.test(t)) return "rire";
    if (/\bsnif\b|\bpleure?\b|\btriste\b|😢|😭|💧/.test(t)) return "pleurer";
    if (/:p\b|:-p\b|😛|😜|🤪|\bnananère?\b/.test(t)) return "langue";
    if (/\bmiam\b|\bmmh+\b|\bgloup\b|🤤|🍕|🍔|🍰/.test(t)) return "miam";
    if (/\?\s*$|\bhein\b|\bquoi\b|\bpourquoi\b|❓|🤔/.test(t)) return "question";
    if (/\brougi[rs]?\b|\bgêné?e?\b|\btimide\b|😳|☺️|🥰|❤️|<3/.test(t)) return "rougir";
    if (/\bsiffl|🎵|🎶/.test(t)) return "sifflote";
    if (/\bgum\b|\bchewing\b|\bbubble\b/.test(t)) return "gum";
    return "parle";
  }

  // anim id → playAnim index expected by bouille-preview.html (?anim=<index>).
  var ANIM_INDEX = { parle:1, rire:2, mdr:3, langue:4, rougir:5, regard:6,
    sifflote:7, gum:8, question:9, miam:10, pleurer:11 };
  var ANIM_LABEL = { parle:"parle", rire:"rigole", mdr:"explose de rire",
    pleurer:"pleure", langue:"tire la langue", miam:"se régale",
    question:"s'interroge", rougir:"rougit", sifflote:"sifflote",
    gum:"fait un chewing-gum", regard:"regarde" };

  // Live-Ruffle overlay: instead of a captured GIF (latency + raster pixelation)
  // we embed bouille-preview.html in a transparent iframe — Ruffle renders the
  // bouille as VECTORS (crisp at any size) and plays the animation directly,
  // exactly like the forum avatars. The iframe slides in from the left, holds,
  // then slides back out to the left.
  //
  // We keep ONE iframe and just reload its src per reaction; reusing it avoids a
  // fresh Ruffle/WASM boot on every message after the first.
  var overlayFrame = null;
  function overlayIframe() {
    if (overlayFrame) return overlayFrame;
    overlayFrame = document.createElement("iframe");
    overlayFrame.setAttribute("scrolling", "no");
    overlayFrame.setAttribute("aria-hidden", "true");
    // allow-scripts so Ruffle runs; allow-same-origin so it can fetch the SWF.
    overlayFrame.setAttribute("sandbox", "allow-scripts allow-same-origin");
    $("#bouille-overlay-stage").appendChild(overlayFrame);
    return overlayFrame;
  }
  function overlayUrl(pseudo, anim) {
    var f = state.bouilleByUser[String(pseudo).toLowerCase()] || DEFAULT_BOUILLE;
    var idx = ANIM_INDEX[anim] || 1; // default = parle
    return "/bouille-preview.html?s=" + encodeURIComponent(f)
      + "&e=0&anim=" + idx + "&bg=transparent";
  }

  var OVERLAY_HOLD_MS = 4200;
  function showBouilleOverlay(pseudo, anim) {
    var box = $("#bouille-overlay");
    if (!box) return;
    var name = $("#bouille-overlay-name");
    name.textContent = pseudo + " " + (ANIM_LABEL[anim] || "parle");

    var frame = overlayIframe();
    // Reload the bouille (force even if the URL is identical, so a repeated emote
    // replays the animation from the start).
    var url = overlayUrl(pseudo, anim);
    frame.src = "about:blank";
    // next tick → real src, so the browser registers a navigation/replay.
    setTimeout(function () { frame.src = url; }, 20);

    box.classList.remove("leaving");
    // Force reflow so removing .show→adding works as a fresh slide-in even when
    // a previous overlay is still on screen.
    void box.offsetWidth;
    box.classList.add("show");

    if (state.overlayTimer) clearTimeout(state.overlayTimer);
    state.overlayTimer = setTimeout(hideBouilleOverlay, OVERLAY_HOLD_MS);
  }
  function hideBouilleOverlay() {
    var box = $("#bouille-overlay");
    if (!box) return;
    // Trigger the slide-out, then fully hide so the iframe stops compositing.
    box.classList.add("leaving");
    box.classList.remove("show");
    setTimeout(function () {
      box.classList.remove("leaving");
      if (overlayFrame) overlayFrame.src = "about:blank"; // stop Ruffle when idle
    }, 520);
  }

  // ── Bouille / accessory picker ───────────────────────────────────────────
  // Lets the user pick an accessory from their inventory (same model as the
  // forum): a bouille is 24 base62 chars; a normal accessory swaps the last 9
  // ("suffix") onto the user's base, while an "incarnation" (full value, family
  // ≥ 2) replaces the whole bouille. We persist the choice via /do/eb so it
  // sticks and everyone (incl. the reaction overlay) sees the new look.
  var myBase = DEFAULT_BOUILLE;           // the user's own bouille (family 00/01)
  var accList = [];                       // [{name, suffix, fullState?}]
  var accSel = { suffix: "000000000", fullState: null };

  function isIncarnation(v) {
    return typeof v === "string" && v.length === 24
      && v.substring(0, 2) !== "00" && v.substring(0, 2) !== "01";
  }
  function buildState(base, suffix9, fullState) {
    if (fullState) return String(fullState);
    var s = String(base || DEFAULT_BOUILLE); while (s.length < 24) s += "0";
    return s.substring(0, 15) + (suffix9 || s.substring(15, 24));
  }
  function previewIframe(state) {
    var s = String(state || DEFAULT_BOUILLE).replace(/[^0-9A-Za-z]/g, "");
    return '<iframe scrolling="no" sandbox="allow-scripts allow-same-origin" src="/bouille-preview.html?s='
      + encodeURIComponent(s) + '"></iframe>';
  }

  function openBouilleSheet() {
    openMenu(false); // close the hamburger if it was open
    var bd = $("#bouille-sheet-backdrop"), sheet = $("#bouille-sheet");
    bd.classList.add("show"); sheet.classList.add("show");
    loadAccessories();
  }
  function closeBouilleSheet() {
    $("#bouille-sheet-backdrop").classList.remove("show");
    $("#bouille-sheet").classList.remove("show");
  }
  $("#bouille-btn").addEventListener("click", openBouilleSheet);
  $("#bouille-sheet-close").addEventListener("click", closeBouilleSheet);
  $("#bouille-sheet-backdrop").addEventListener("click", closeBouilleSheet);

  function loadAccessories() {
    fetch("/api/forum/me?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.bouille) {
          // Keep the user's BASE (own family) so suffix swaps work; if their
          // saved bouille is an incarnation we still expose it as the current.
          if (!isIncarnation(d.bouille)) myBase = d.bouille;
          state.bouilleByUser[state.userLower] = d.bouille;
        }
        accList = [];
        var seen = {};
        // Defaults (Normal, Bananocle, …) — suffix-only.
        (d && d.defaultAccessories || []).forEach(function (def) {
          var sfx = def.suffix || "000000000";
          if (seen[sfx]) return; seen[sfx] = true;
          accList.push({ name: def.name, suffix: sfx, fullState: null });
        });
        if (!seen["000000000"]) accList.unshift({ name: "Normal", suffix: "000000000", fullState: null });
        // Owned accessories (value = full 24-char bouille).
        (d && d.accessories || []).forEach(function (a) {
          if (!a.value || a.value.length !== 24) return;
          if (isIncarnation(a.value)) {
            var k = "inc:" + a.value;
            if (!seen[k]) { seen[k] = true; accList.push({ name: a.name, suffix: a.value.substring(15, 24), fullState: a.value }); }
          } else {
            var sfx2 = a.value.substring(15, 24);
            if (!seen[sfx2]) { seen[sfx2] = true; accList.push({ name: a.name, suffix: sfx2, fullState: null }); }
          }
        });
        // Mark the current selection from the saved bouille.
        var cur = state.bouilleByUser[state.userLower] || DEFAULT_BOUILLE;
        if (isIncarnation(cur)) accSel = { suffix: cur.substring(15, 24), fullState: cur };
        else accSel = { suffix: cur.substring(15, 24), fullState: null };
        renderAccGrid();
        updateSheetPreview();
      })
      .catch(function () {
        $("#bouille-acc-grid").innerHTML = '<div class="sheet-hint">Inventaire indisponible.</div>';
      });
  }

  function isAccSelected(ac) {
    return ac.fullState ? (ac.fullState === accSel.fullState)
                        : (!accSel.fullState && ac.suffix === accSel.suffix);
  }
  function renderAccGrid() {
    var grid = $("#bouille-acc-grid");
    grid.innerHTML = "";
    accList.forEach(function (ac, i) {
      var st = ac.fullState ? ac.fullState : buildState(myBase, ac.suffix, null);
      var item = el("div", "acc-item" + (isAccSelected(ac) ? " sel" : ""));
      item.innerHTML = '<div class="thumb">' + previewIframe(st) + '</div><div class="lbl">' + (ac.name || "Accessoire") + '</div>';
      item.addEventListener("click", function () { pickAccessory(i); });
      grid.appendChild(item);
    });
  }
  function updateSheetPreview() {
    var st = buildState(myBase, accSel.suffix, accSel.fullState);
    $("#bouille-sheet-preview").innerHTML = previewIframe(st);
  }
  function pickAccessory(i) {
    var ac = accList[i]; if (!ac) return;
    accSel = { suffix: ac.suffix, fullState: ac.fullState || null };
    var newState = buildState(myBase, accSel.suffix, accSel.fullState);
    // Update locally first so the UI reacts instantly.
    state.bouilleByUser[state.userLower] = newState;
    renderAccGrid();
    updateSheetPreview();
    var hint = $("#bouille-sheet-hint");
    if (hint) { hint.textContent = "✓ " + (ac.name || "Accessoire") + " appliqué !"; }
    // Persist over the open WebSocket via the fbouille command — the server
    // saves it AND broadcasts a trace so peers see the new bouille live. Falls
    // back to the HTTP editor endpoint if the socket isn't ready.
    if (state.ws && state.ws.readyState === 1) {
      wsSend('<ae f="' + xmlEscape(newState) + '" />');
    } else {
      fetch("/do/eb?sid=" + encodeURIComponent(state.sid) + "&b=" + encodeURIComponent(newState), { cache: "no-store" })
        .catch(function () {});
    }
  }

  // ── Mobile keyboard handling ─────────────────────────────────────────────
  // When the on-screen keyboard opens, the browser shrinks the "visual
  // viewport" (and often scrolls the whole page so the focused input is
  // visible, pushing the header/messages off-screen). We instead size the app
  // to window.visualViewport.height and pin it to the visible region, so the
  // header stays put, the messages list keeps the input just above the
  // keyboard, and nothing scrolls off the top. Falls back gracefully where
  // visualViewport is unavailable.
  var vv = window.visualViewport || null;
  function applyViewport() {
    var h = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight);
    document.documentElement.style.setProperty("--app-h", h + "px");
    // Pin the fixed body to the top of the visual viewport (handles the case
    // where the browser offsets the layout viewport under the keyboard).
    document.body.style.transform = vv ? ("translateY(" + Math.round(vv.offsetTop) + "px)") : "";
    // Keep the latest messages in view above the keyboard.
    if (nearBottom()) scrollDown();
  }
  if (vv) {
    vv.addEventListener("resize", applyViewport);
    vv.addEventListener("scroll", applyViewport);
  }
  window.addEventListener("resize", applyViewport);
  window.addEventListener("orientationchange", function () { setTimeout(applyViewport, 200); });
  applyViewport();

  // When the input gains focus (keyboard opening), snap to the bottom shortly
  // after so the composer + last messages sit right above the keyboard.
  (function () {
    var inp = document.getElementById("compose-input");
    if (inp) inp.addEventListener("focus", function () {
      setTimeout(function () { applyViewport(); scrollDown(); }, 300);
    });
  })();
})();
</script>
</body>
</html>
