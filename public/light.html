  // « … voir les messages précédents … » — le lien des logs du staff, comme au
  // bureau (box.Chat.onIamMode) : il n'apparaît qu'à ceux dont la ligne porte
  // m="1" sur ce salon, une fois par salon.
  var histoMontre = {};
  function montrerLienHisto(room, set) {
    if (histoMontre[room] || room !== state.room || estPrive(room)) return;
    var moi = null;
    for (var n in set) { if (n.toLowerCase() === state.userLower) { moi = set[n]; break; } }
    if (!moi || !moi.staff) return;
    histoMontre[room] = true;
    systemAction("", "... voir les messages précédents ...", function () {
      window.open("/api/chat/histo?sid=" + encodeURIComponent(state.sid)
        + "&g=" + encodeURIComponent(room), "fp_histo", "width=680,height=720");
    });
  }

  // Vue « tout le site ». Le lieu affiché est le salon PUBLIC où se trouve le
  // joueur ; qui n'en a rejoint aucun (il joue, il lit le forum…) est simplement
  // « en ligne ». Les discussions privées ne sont jamais nommées.
  function renderSite() {
    var list = $("#users-list");
    list.innerHTML = "";
    if (!siteListe) {
      var att = el("div", "vide"); att.textContent = "Chargement…";
      list.appendChild(att);
      return;
    }
    if (!siteListe.length) {
      var v = el("div", "vide"); v.textContent = "Personne d'autre en ligne.";
      list.appendChild(v);
      return;
    }
    siteListe.forEach(function (j) {
      var lieu = (j.salons && j.salons.length)
        ? j.salons.map(roomLabel).join(", ")
        : (j.jeu && VOYANTS_NOM[j.jeu] ? "joue à " + VOYANTS_NOM[j.jeu] : "en ligne");
      list.appendChild(ligneConnecte(j.pseudo, lieu, !!j.staff, j.jeu || ""));
    });
  }

  // Toujours redemander : la liste précédente reste affichée pendant l'appel
  // (renderSite la rend depuis siteListe), donc rafraîchir ne coûte aucun
  // clignotement — et une liste de présence périmée ne vaut rien.
  function chargerSite() {
    if (!state.sid) return;
    fetch("/api/light/online?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) return;
        siteListe = d.users || [];
        if (drawerVue === "site") renderSite();
      })
      .catch(function () {});
  }

  function drawerBascule(vue) {
    drawerVue = vue;
    Array.prototype.forEach.call(document.querySelectorAll(".dr-onglet"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-vue") === vue);
    });
    $("#users-list").scrollTop = 0;
    if (vue === "site") { renderSite(); chargerSite(); } else renderUsers();
    majRafraichissementSite();
  }
  // Tant que la vue « site » est affichée, on la garde fraîche : les allées et
  // venues sont exactement ce qu'on est venu observer. Ailleurs, on arrête —
  // interroger le serveur pour un tiroir fermé ne sert personne.
  function majRafraichissementSite() {
    var voulu = (drawerVue === "site") && $("#users-drawer").classList.contains("open");
    if (voulu && !siteTimer) siteTimer = setInterval(chargerSite, 15000);
    if (!voulu && siteTimer) { clearInterval(siteTimer); siteTimer = null; }
  }
  Array.prototype.forEach.call(document.querySelectorAll(".dr-onglet"), function (b) {
    b.addEventListener("click", function () { drawerBascule(b.getAttribute("data-vue")); });
  });

  function openDrawer(open) {
    $("#users-drawer").classList.toggle("open", open);
    $("#drawer-backdrop").classList.toggle("show", open);
    $("#users-btn").classList.toggle("on", open);
    if (open && drawerVue === "site") chargerSite();
    majRafraichissementSite();
  }
  // The "liste" icon toggles the connected-users drawer open/closed.
  $("#users-btn").addEventListener("click", function () {
    openDrawer(!$("#users-drawer").classList.contains("open"));
  });
  $("#drawer-backdrop").addEventListener("click", function () { openDrawer(false); });

  // Pink scroll buttons (top/bottom of the connected list): tap to nudge,
  // press-and-hold to keep scrolling.
  (function () {
    var list = $("#users-list");
    function bind(btn, dir) {
      if (!btn || !list) return;
      var timer = null;
      function step() { list.scrollTop += dir * 48; }
      function stop() { if (timer) { clearInterval(timer); timer = null; } }
      function start(ev) { ev.preventDefault(); step(); stop(); timer = setInterval(step, 90); }
      btn.addEventListener("mousedown", start);
      btn.addEventListener("touchstart", start, { passive: false });
      ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(function (e) { btn.addEventListener(e, stop); });
    }
    bind($("#users-scroll-up"), -1);
    bind($("#users-scroll-down"), 1);
  })();

  // ── Bouille display toggle (header) ──────────────────────────────────────
  // Some users want a very "light" experience with no bouille animations popping
  // over the chat. The icon toggles them on/off; the choice persists across loads
  // (localStorage). When turned off we also hide any overlay already on screen.
  var BOUILLE_PREF_KEY = "fp_light_bouilles";
  function applyBouillePref() {
    var btn = $("#bouille-toggle");
    if (btn) {
      btn.classList.toggle("off", !state.bouillesEnabled);

      btn.title = state.bouillesEnabled ? "Masquer les bouilles" : "Afficher les bouilles";
    }

  }
  try { if (localStorage.getItem(BOUILLE_PREF_KEY) === "0") state.bouillesEnabled = false; } catch (e) {}
  $("#bouille-toggle").addEventListener("click", function () {
    state.bouillesEnabled = !state.bouillesEnabled;
    try { localStorage.setItem(BOUILLE_PREF_KEY, state.bouillesEnabled ? "1" : "0"); } catch (e) {}
    applyBouillePref();
  });
  applyBouillePref();

  // ── Bouille overlay ──────────────────────────────────────────────────────
  // Remember each speaker's bouille state (carried by <p>/<v>/<z> frames), so
  // when they talk we can render the right avatar.
  function rememberBouille(pseudo, f) {
    if (!pseudo || !f) return;
    var clean = String(f).replace(/[^0-9A-Za-z]/g, "");
    if (clean.length >= 4) state.bouilleByUser[String(pseudo).toLowerCase()] = clean;
  }

  // ── Le voyant de jeu ──
  // Le serveur diffuse pour chaque joueur une chaîne de statut de quatre
  // caractères en base 62 : absence(1) + JEU(2) + émote(1). Les deux du milieu
  // sont le code interne du bureau — celui qui choisit l'icône à côté du
  // pseudo. On garde la même table que main.swf, traduite en PNG extraits du
  // même sprite (scripts/extract-voyants-jeux.js).
  var VOYANTS_JEU = { 6: "bandas", 7: "grapiz", 4: "swapou", 9: "miniwave", 12: "minipixiz" };
  var VOYANTS_NOM = { bandas: "Frutibandas", grapiz: "Grapiz", swapou: "Swapou",
    miniwave: "Mini-Wave", minipixiz: "Minipixiz" };
  var BASE62 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
  function decode62(s) {
    var r = 0;
    for (var i = 0; i < s.length; i++) {
      var k = BASE62.indexOf(s.charAt(i));
      if (k < 0) return 0;
      r = r * 62 + k;
    }
    return r;
  }
  function rememberStatut(pseudo, s) {
    if (!pseudo || s === null || s === undefined) return;
    var interne = decode62(String(s).substring(1, 3));
    var avant = state.jeuByUser[String(pseudo).toLowerCase()];
    var jeu = VOYANTS_JEU[interne] || "";
    state.jeuByUser[String(pseudo).toLowerCase()] = jeu;
    // Un voyant qui s'allume ou s'éteint se voit tout de suite dans la liste.
    if (avant !== jeu && drawerVue === "salon") renderUsers();
  }
  function voyantDe(pseudo) { return state.jeuByUser[String(pseudo).toLowerCase()] || ""; }

  // Emote detection — IDENTICAL to the desktop. Source of truth:
  //   _global.actionInfo (FAMILLE 0) in frutiparc/global.as : token → emote id
  //   _global.langText.chat.action[id] in frutiparc/lang_french.as : id → phrase
  // The desktop (MeMng.fbouilleActionStr) matches the WHOLE message text against
  // a trigger EXACTLY (case-sensitive — ":d" is the tongue, ":D" is laughing),
  // then renders "<pseudo> <phrase>" in italics. We reproduce that exactly: same
  // tokens, same phrases, same whole-message exact match. A sentence that merely
  // contains a trigger ("je rigole bien") stays plain text, just like desktop.
  var EMOTE_MAP = {};
  (function () {
    function add(anim, label, toks) { for (var i = 0; i < toks.length; i++) EMOTE_MAP[toks[i]] = { anim: anim, label: label }; }
    add("rire", "rigole", [":))", "rigole"]);                                  // id 2
    add("mdr", "éclate de rire", [":D", "mdr", "lol", "ptdr"]);                // id 3
    add("langue", "tire la langue", [":p", ":P", ":d"]);                       // id 4
    add("rougir", "rougit", [':">', ":#)", "rougit"]);                         // id 5
    add("regard", "regarde ailleurs", ["regard", "regarde"]);                 // id 6
    add("sifflote", "sifflote", [':-"', "siffle", "sifflote"]);               // id 7
    add("gum", "fait une bulle de chewing-gum", ["gum"]);                      // id 8
    add("question", "se pose des questions", [":?", "question", "curieux", "oO"]); // id 9
    add("miam", "se régale", ["miam", "slurp", "bave", "regale"]);            // id 10
    add("pleurer", "pleure", [':-"(', ";((", "pleure", "ouin"]);              // id 11
    add("pleurer", "laisse couler une larme", [":'(", ";(", "larme", "snif"]); // id 12
  })();
  function detectEmote(text) {
    var key = String(text == null ? "" : text).trim();   // whole-message, case-sensitive
    var hit = EMOTE_MAP[key];
    if (hit) return { isEmote: true, anim: hit.anim, label: hit.label };
    return { isEmote: false, anim: "parle", label: null };
  }

  // ── Feutres (chat pens) ──────────────────────────────────────────────────
  // The chat protocol carries a pen index in the message's p= attribute. By
  // default every user owns all 17 boutique feutres (indices 0..16). The label
  // order matches public/ft/pack-pen / the boutique FEUTRE list. Colours are the
  // standard "ISO" feutre palette; tweak FEUTRES if a shade needs to match the
  // Flash client exactly.
  var FEUTRES = [
    { i: 0,  name: "Orange",            color: "#E8732A" },
    { i: 1,  name: "Bleu",              color: "#2A6FE8" },
    { i: 2,  name: "Vert foncé",        color: "#1E6B2E" },
    { i: 3,  name: "Bordeaux",          color: "#8C1F2F" },
    { i: 4,  name: "Rose",              color: "#E84A9C" },
    { i: 5,  name: "Jaune",             color: "#E8C81E" },
    { i: 6,  name: "Vert clair",        color: "#6FBF3B" },
    { i: 7,  name: "Cyan",              color: "#1FA8C0" },
    { i: 8,  name: "Bleu foncé",        color: "#1E2F8C" },
    { i: 9,  name: "Marron",            color: "#8C5A2B" },
    { i: 10, name: "Marron foncé",      color: "#5A3A1E" },
    { i: 11, name: "Vert kaki",         color: "#7A7A3A" },
    { i: 12, name: "Bleu pétrole",      color: "#2A7A8C" },
    { i: 13, name: "Vert",              color: "#2E8C3A" },
    { i: 14, name: "Bleu pétrole foncé",color: "#1E4A55" },
    { i: 15, name: "Orange foncé",      color: "#B85518" },
    { i: 16, name: "Violet",            color: "#7A2AB8" },
  ];
  var FEUTRE_BY_INDEX = {};
  FEUTRES.forEach(function (f) { FEUTRE_BY_INDEX[f.i] = f.color; });
  // The user's currently selected pen index (default 0 = none/black-ish orange).
  // null = no pen (default site colour).
  function penColorFor(p) {
    var n = parseInt(p, 10);
    if (!Number.isFinite(n)) return null;
    return FEUTRE_BY_INDEX[n] || null;
  }

  // Build the feutre swatch row once (a "none" chip + the 17 colours). Tapping a
  // swatch sets state.pen and tints the composer text so the choice is obvious.
  function buildPenBar() {
    var bar = $("#pen-bar");
    if (!bar) return;
    bar.innerHTML = "";   // reconstruit à chaque ouverture (reflète la possession du feutre multicolore)
    var none = el("div", "pen-swatch none" + (state.pen === "" ? " sel" : ""));
    none.textContent = "✕"; none.title = "Aucun feutre";
    none.addEventListener("click", function () { selectPen(""); });
    bar.appendChild(none);
    FEUTRES.forEach(function (f) {
      var sw = el("div", "pen-swatch" + (String(state.pen) === String(f.i) ? " sel" : ""));
      sw.style.background = f.color; sw.title = f.name;
      sw.setAttribute("data-pen", f.i);
      sw.addEventListener("click", function () { selectPen(String(f.i)); });
      bar.appendChild(sw);
    });
    // Feutre multicolore (uniquement s'il est possédé) : pastille dédiée à dégradé.
    if (state.ownedFeutres && state.ownedFeutres.indexOf("mc") >= 0) {
      var mc = el("div", "pen-swatch mc" + (state.pen === "mc" ? " sel" : ""));
      mc.title = "Feutre multicolore";
      mc.setAttribute("data-pen", "mc");
      mc.addEventListener("click", function () { selectPen("mc"); });
      bar.appendChild(mc);
    }
  }
  function selectPen(idx) {
    state.pen = idx;
    Array.prototype.forEach.call(document.querySelectorAll("#pen-bar .pen-swatch"), function (sw) {
      var v = sw.getAttribute("data-pen");
      sw.classList.toggle("sel", (idx === "" && sw.classList.contains("none")) || (v != null && v === idx));
    });
    // Tint the input so you see your current feutre while typing.
    var inp = $("#compose-input");
    if (inp) inp.style.color = penColorFor(idx) || "#2C4A0F";
  }
  $("#pen-btn").addEventListener("click", function () {
    buildPenBar();
    var bar = $("#pen-bar");
    var open = bar.classList.toggle("show");
    this.classList.toggle("on", open);
    if (open && nearBottom()) scrollDown();
  });

  // anim id → playAnim index expected by bouille-preview.html (?anim=<index>).
  var ANIM_INDEX = { parle:1, rire:2, mdr:3, langue:4, rougir:5, regard:6,
    sifflote:7, gum:8, question:9, miam:10, pleurer:11 };
  // Caption phrases for the bouille overlay — the EXACT desktop wording
  // (lang_french.as chat.action). A specific emote can override this (the two
  // cry emotes share the "pleurer" animation but read differently).
  var ANIM_LABEL = { parle:"parle", rire:"rigole", mdr:"éclate de rire",
    pleurer:"pleure", langue:"tire la langue", miam:"se régale",
    question:"se pose des questions", rougir:"rougit", sifflote:"sifflote",
    gum:"fait une bulle de chewing-gum", regard:"regarde ailleurs" };
  // Live-Ruffle overlay: instead of a captured GIF (latency + raster pixelation)
  // we embed bouille-preview.html in a transparent iframe — Ruffle renders the
  // bouille as VECTORS (crisp at any size) and plays the animation directly,
  // exactly like the forum avatars. The iframe slides in from the left, holds,
  // then slides back out to the left.
  //
  // We keep ONE iframe and just reload its src per reaction; reusing it avoids a
  // fresh Ruffle/WASM boot on every message after the first.
  var overlayFrame = null;
  function overlayIframe() {
    if (overlayFrame) return overlayFrame;
    overlayFrame = document.createElement("iframe");
    overlayFrame.setAttribute("scrolling", "no");
    overlayFrame.setAttribute("aria-hidden", "true");
    // allow-scripts so Ruffle runs; allow-same-origin so it can fetch the SWF.
    overlayFrame.setAttribute("sandbox", "allow-scripts allow-same-origin");
    $("#bouille-overlay-stage").appendChild(overlayFrame);
    return overlayFrame;
  }
  function overlayUrl(pseudo, anim) {
    var f = state.bouilleByUser[String(pseudo).toLowerCase()] || DEFAULT_BOUILLE;
    var idx = ANIM_INDEX[anim] || 1; // default = parle
    return "/bouille-preview.html?s=" + encodeURIComponent(f)
      + "&e=0&anim=" + idx + "&bg=transparent";
  }

  var OVERLAY_HOLD_MS = 4200;
  function showBouilleOverlay(pseudo, anim, labelOverride) {
    if (!state.bouillesEnabled) return; // "light" mode: no bouille animations
    var box = $("#bouille-overlay");
    if (!box) return;
    var name = $("#bouille-overlay-name");
    name.textContent = pseudo + " " + (labelOverride || ANIM_LABEL[anim] || "parle");

    var frame = overlayIframe();
    // Reload the bouille (force even if the URL is identical, so a repeated emote
    // replays the animation from the start).
    var url = overlayUrl(pseudo, anim);
    frame.src = "about:blank";
    // next tick → real src, so the browser registers a navigation/replay.
    setTimeout(function () { frame.src = url; }, 20);

    box.classList.remove("leaving");
    // Force reflow so removing .show→adding works as a fresh slide-in even when
    // a previous overlay is still on screen.
    void box.offsetWidth;
    box.classList.add("show");

    if (state.overlayTimer) clearTimeout(state.overlayTimer);
    state.overlayTimer = setTimeout(hideBouilleOverlay, OVERLAY_HOLD_MS);
  }
  function hideBouilleOverlay() {
    var box = $("#bouille-overlay");
    if (!box) return;
    // Trigger the slide-out, then fully hide so the iframe stops compositing.
    box.classList.add("leaving");
    box.classList.remove("show");
    setTimeout(function () {
      box.classList.remove("leaving");
      if (overlayFrame) overlayFrame.src = "about:blank"; // stop Ruffle when idle
    }, 520);
  }

  // ── Bouille / accessory picker ───────────────────────────────────────────
  // Lets the user pick an accessory from their inventory (same model as the
  // forum): a bouille is 24 base62 chars; a normal accessory swaps the last 9
  // ("suffix") onto the user's base, while an "incarnation" (full value, family
  // ≥ 2) replaces the whole bouille. We persist the choice via /do/eb so it
  // sticks and everyone (incl. the reaction overlay) sees the new look.
  var myBase = DEFAULT_BOUILLE;           // the user's own bouille (family 00/01)
  var accList = [];                       // [{name, suffix, fullState?}]
  var accSel = { suffix: "000000000", fullState: null };

  function isIncarnation(v) {
    return typeof v === "string" && v.length === 24
      && v.substring(0, 2) !== "00" && v.substring(0, 2) !== "01";
  }
  function buildState(base, suffix9, fullState) {
    if (fullState) return String(fullState);
    var s = String(base || DEFAULT_BOUILLE); while (s.length < 24) s += "0";
    return s.substring(0, 15) + (suffix9 || s.substring(15, 24));
  }
  function previewIframe(state) {
    var s = String(state || DEFAULT_BOUILLE).replace(/[^0-9A-Za-z]/g, "");
    return '<iframe scrolling="no" sandbox="allow-scripts allow-same-origin" src="/bouille-preview.html?s='
      + encodeURIComponent(s) + '&bg=transparent"></iframe>';
  }

  function openBouilleSheet() {
    openMenu(false); // close the hamburger if it was open
    var bd = $("#bouille-sheet-backdrop"), sheet = $("#bouille-sheet");
    bd.classList.add("show"); sheet.classList.add("show");
    loadAccessories();
  }
  function closeBouilleSheet() {
    $("#bouille-sheet-backdrop").classList.remove("show");
    $("#bouille-sheet").classList.remove("show");
  }
  // Ouverture via la tuile « Inventaire » de l'accueil (cf. home-tile[data-go]).
  $("#bouille-sheet-close").addEventListener("click", closeBouilleSheet);
  $("#bouille-sheet-backdrop").addEventListener("click", closeBouilleSheet);

  function loadAccessories() {
    fetch("/api/forum/me?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.bouille) {
          // Keep the user's BASE (own family) so suffix swaps work; if their
          // saved bouille is an incarnation we still expose it as the current.
          if (!isIncarnation(d.bouille)) myBase = d.bouille;
          state.bouilleByUser[state.userLower] = d.bouille;
        }
        accList = [];
        var seen = {};
        // Defaults (Normal, Bananocle, …) — suffix-only.
        (d && d.defaultAccessories || []).forEach(function (def) {
          var sfx = def.suffix || "000000000";
          if (seen[sfx]) return; seen[sfx] = true;
          accList.push({ name: def.name, suffix: sfx, fullState: null });
        });
        if (!seen["000000000"]) accList.unshift({ name: "Normal", suffix: "000000000", fullState: null });
        // Owned accessories (value = full 24-char bouille).
        (d && d.accessories || []).forEach(function (a) {
          if (!a.value || a.value.length !== 24) return;
          if (isIncarnation(a.value)) {
            var k = "inc:" + a.value;
            if (!seen[k]) { seen[k] = true; accList.push({ name: a.name, suffix: a.value.substring(15, 24), fullState: a.value }); }
          } else {
            var sfx2 = a.value.substring(15, 24);
            if (!seen[sfx2]) { seen[sfx2] = true; accList.push({ name: a.name, suffix: sfx2, fullState: null }); }
          }
        });
        // Mark the current selection from the saved bouille.
        var cur = state.bouilleByUser[state.userLower] || DEFAULT_BOUILLE;
        if (isIncarnation(cur)) accSel = { suffix: cur.substring(15, 24), fullState: cur };
        else accSel = { suffix: cur.substring(15, 24), fullState: null };
        renderAccGrid();
        updateSheetPreview();
      })
      .catch(function () {
        $("#bouille-acc-grid").innerHTML = '<div class="sheet-hint">Inventaire indisponible.</div>';
      });
  }

  function isAccSelected(ac) {
    return ac.fullState ? (ac.fullState === accSel.fullState)
                        : (!accSel.fullState && ac.suffix === accSel.suffix);
  }
  function renderAccGrid() {
    var grid = $("#bouille-acc-grid");
    grid.innerHTML = "";
    accList.forEach(function (ac, i) {
      var st = ac.fullState ? ac.fullState : buildState(myBase, ac.suffix, null);
      var item = el("div", "acc-item" + (isAccSelected(ac) ? " sel" : ""));
      item.innerHTML = '<div class="thumb">' + previewIframe(st) + '</div><div class="lbl">' + (ac.name || "Accessoire") + '</div>';
      item.addEventListener("click", function () { pickAccessory(i); });
      grid.appendChild(item);
    });
  }
  function updateSheetPreview() {
    var st = buildState(myBase, accSel.suffix, accSel.fullState);
    $("#bouille-sheet-preview").innerHTML = previewIframe(st);
  }
  function pickAccessory(i) {
    var ac = accList[i]; if (!ac) return;
    accSel = { suffix: ac.suffix, fullState: ac.fullState || null };
    var newState = buildState(myBase, accSel.suffix, accSel.fullState);
    // Update locally first so the UI reacts instantly.
    state.bouilleByUser[state.userLower] = newState;
    homeProfile.bouille = newState;
    refreshHomeAvatar(); // l'avatar de l'accueil suit le nouvel accessoire
    renderAccGrid();
    updateSheetPreview();
    var hint = $("#bouille-sheet-hint");
    if (hint) { hint.textContent = "✓ " + (ac.name || "Accessoire") + " appliqué !"; }
    // Persist over the open WebSocket via the fbouille command — the server
    // saves it AND broadcasts a trace so peers see the new bouille live. Falls
    // back to the HTTP editor endpoint if the socket isn't ready.
    if (state.ws && state.ws.readyState === 1) {
      wsSend('<ae f="' + xmlEscape(newState) + '" />');
    } else {
      fetch("/do/eb?sid=" + encodeURIComponent(state.sid) + "&b=" + encodeURIComponent(newState), { cache: "no-store" })
        .catch(function () {});
    }
  }

  // ── "Ma Frutibouille" : éditeur de visage (chars 2-23 de l'état bouille) ───
  // Auto-affiché à la connexion tant que le serveur signale needsBouille
  // (bouille par défaut OU flag admin), comme l'editbouille de main.swf. Chaque
  // ligne fait défiler UNE PAIRE de caractères de l'état ; la preview Flash
  // (bouille-preview.html) montre le rendu réel — c'est la vérité terrain.
  // "valider" persiste via <ae>/​/do/eb, ce qui efface needsBouille côté serveur
  // → l'éditeur ne se rouvre plus (sauf réactivation admin).
  //
  // MAPPING EXACT, lu dans l'ActionScript de famille0.swf (fonction apply) :
  // chaque attribut = decode62 d'une PAIRE (s.substring(pos, pos+2)) —
  //   [0-1]=famille, [2-3]=yeux, [4-5]=iris, [6-7]=cheveux, [8-9]=bouche,
  //   [10-11]=couleur visage, [12-13]=couleur cheveux, [14-23]=accessoires.
  // "max" = _totalframes du sprite correspondant − 1 (extrait des SWF ; c'est
  // ce que l'objet `info` de l'éditeur d'époque exposait) : famille 0 = 9 yeux,
  // 18 iris, 67 cheveux, 5 bouches. Les familles ≥ 10 sont des incarnations de
  // boutique sans variantes : l'éditeur reste sur la famille 0, comme
  // l'inscription d'époque.
  //
  // IMPORTANT : les ACCESSOIRES (chars 14-23) ne se choisissent PAS ici — ils
  // se gagnent/achètent (boutique, packs) et se posent via l'inventaire.
  // L'éditeur n'édite que le visage ; les chars 14-23 de l'état initial sont
  // conservés tels quels à la validation (fbSet n'écrit que les paires listées).
  var FB_PARTS = [
    { key: "yeux",    label: "yeux",    pos: 2,  max: 8,  count: true },
    { key: "iris",    label: "iris",    pos: 4,  max: 17, count: true },
    { key: "cheveux", label: "cheveux", pos: 6,  max: 66, count: true },
    { key: "bouche",  label: "bouche",  pos: 8,  max: 4,  count: true },
    // Couleurs : sélecteur de palette (53 couleurs, cf. /js/bouille-palette.js).
    { key: "peau",    label: "couleur peau",    pos: 10, max: 52, color: true },
    { key: "colch",   label: "couleur cheveux", pos: 12, max: 52, color: true },
  ];
  var fbState = DEFAULT_BOUILLE;   // l'état 24-car. en cours d'édition
  var fbRowsBuilt = false;

  // base62 char ↔ entier, aligné sur le decode62 de bouille-preview.html
  // (0-9 → 0-9, a-z → 10-35, A-Z → 36-61).
  function fbDecChar(c) {
    if (c >= "0" && c <= "9") return c.charCodeAt(0) - 48;
    if (c >= "a" && c <= "z") return c.charCodeAt(0) - 87;
    if (c >= "A" && c <= "Z") return c.charCodeAt(0) - 29;
    return 0;
  }
  function fbEncChar(n) {
    n = ((n % 62) + 62) % 62;
    if (n < 10) return String.fromCharCode(48 + n);
    if (n < 36) return String.fromCharCode(87 + n);
    return String.fromCharCode(29 + n);
  }
  function fbPad(s) { s = String(s || ""); while (s.length < 24) s += "0"; return s.substring(0, 24); }
  // Chaque attribut occupe une PAIRE base62 (poids fort puis poids faible) —
  // indispensable au-delà de 61 (ex : coiffures 62 à 66 de la famille 0).
  function fbGet(pos) { return fbDecChar(fbState.charAt(pos) || "0") * 62 + fbDecChar(fbState.charAt(pos + 1) || "0"); }
  function fbSet(pos, val) {
    val = Math.max(0, val | 0);
    fbState = fbState.substring(0, pos) + fbEncChar(Math.floor(val / 62)) + fbEncChar(val % 62) + fbState.substring(pos + 2);
  }

  function fbRenderPreview() { $("#fb-editor-preview").innerHTML = previewIframe(fbState); }
  // Recharger l'iframe Flash recrée le player Ruffle (~lent) : on débounce pour
  // ne rendre qu'une fois le défilement stabilisé (taps rapides → 1 seul reload).
  var fbPrevTimer = null;
  function fbRenderPreviewSoon() {
    if (fbPrevTimer) clearTimeout(fbPrevTimer);
    fbPrevTimer = setTimeout(fbRenderPreview, 120);
  }
  function fbCycle(part, dir) {
    var span = (part.max || 0) + 1;
    fbSet(part.pos, ((fbGet(part.pos) + dir) % span + span) % span);
    if (part.color) fbRefreshBar(part);
    else fbRefreshLabel(part);
    fbRenderPreviewSoon();
  }
  // Ligne élément (yeux, cheveux, accessoire…) : « cheveux · 13/67 » pour se
  // repérer dans les longues listes (67 coiffures !).
  function fbRefreshLabel(part) {
    var l = document.getElementById("fb-lbl-" + part.key);
    if (l) l.textContent = part.label + (part.count ? " · " + (fbGet(part.pos) + 1) + "/" + (part.max + 1) : "");
  }
  function fbRefreshLabels() { FB_PARTS.forEach(function (p) { if (!p.color) fbRefreshLabel(p); }); }
  // Ligne couleur (peau / cheveux) = barre montrant la VRAIE couleur courante ;
  // ◄ ► font défiler la palette (53 couleurs), fidèle au modèle mobile d'origine.
  function fbRefreshBar(part) {
    var b = document.getElementById("fb-bar-" + part.key);
    if (!b) return;
    var idx = fbGet(part.pos);
    b.style.background = FPBouille.colorHex(idx);
    b.title = FPBouille.colorName(idx) + " (" + idx + ")";
  }
  function fbRefreshBars() { FB_PARTS.forEach(function (p) { if (p.color) fbRefreshBar(p); }); }
  function fbBuildRows() {
    var rows = $("#fb-editor-rows");
    rows.innerHTML = "";
    FB_PARTS.forEach(function (part) {
      var row = el("div", "fb-row");
      var left = el("button", "fb-arrow lft"); left.type = "button"; left.setAttribute("aria-label", "précédent");
      var right = el("button", "fb-arrow rgt"); right.type = "button"; right.setAttribute("aria-label", "suivant");
      var center;
      if (part.color) {
        center = el("div", "fb-bar"); center.id = "fb-bar-" + part.key;
        var idx = fbGet(part.pos);
        center.style.background = FPBouille.colorHex(idx);
        center.title = FPBouille.colorName(idx) + " (" + idx + ")";
      } else {
        center = el("div", "fb-label"); center.id = "fb-lbl-" + part.key;
        center.textContent = part.label + (part.count ? " · " + (fbGet(part.pos) + 1) + "/" + (part.max + 1) : "");
      }
      left.addEventListener("click", function () { fbCycle(part, -1); });
      right.addEventListener("click", function () { fbCycle(part, 1); });
      row.appendChild(left); row.appendChild(center); row.appendChild(right);
      rows.appendChild(row);
    });
    fbRowsBuilt = true;
  }

  function openFbEditor(initial) {
    fbState = fbPad(initial && initial.length >= 15 ? initial : DEFAULT_BOUILLE);
    if (!fbRowsBuilt) fbBuildRows();
    else { fbRefreshBars(); fbRefreshLabels(); }
    fbRenderPreview();
    $("#fb-editor-backdrop").classList.add("show");
    $("#fb-editor").classList.add("show");
  }
  function closeFbEditor() {
    $("#fb-editor-backdrop").classList.remove("show");
    $("#fb-editor").classList.remove("show");
  }
  function fbValider() {
    var st = fbPad(fbState);
    // Reflète localement (overlay chat, sheet accessoires, avatar accueil) avant
    // la persistance.
    state.bouilleByUser[state.userLower] = st;
    homeProfile.bouille = st;
    refreshHomeAvatar();
    if (!isIncarnation(st)) myBase = st;
    // Même chemin que le picker : <ae> sur le socket (broadcast + efface
    // needsBouille), fallback /do/eb. Une vraie bouille (≠ défaut) arrête le
    // ré-affichage ; revalider le défaut inchangé le repropose (= comme Flash).
    if (state.ws && state.ws.readyState === 1) {
      wsSend('<ae f="' + xmlEscape(st) + '" />');
    } else {
      fetch("/do/eb?sid=" + encodeURIComponent(state.sid) + "&b=" + encodeURIComponent(st), { cache: "no-store" })
        .catch(function () {});
    }
    closeFbEditor();
  }
  $("#fb-editor-valider").addEventListener("click", fbValider);

  // Ouvre l'éditeur si le serveur réclame une bouille (réutilise /api/forum/me).
  function maybeOpenFbEditor() {
    if (!state.sid) return;
    fetch("/api/forum/me?sid=" + encodeURIComponent(state.sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.needsBouille) openFbEditor(d.bouille); })
      .catch(function () {});
  }

  // ── Mobile keyboard handling ─────────────────────────────────────────────
  // When the on-screen keyboard opens, the browser shrinks the "visual
  // viewport" (and often scrolls the whole page so the focused input is
  // visible, pushing the header/messages off-screen). We instead size the app
  // to window.visualViewport.height and pin it to the visible region, so the
  // header stays put, the messages list keeps the input just above the
  // keyboard, and nothing scrolls off the top. Falls back gracefully where
  // visualViewport is unavailable.
  var vv = window.visualViewport || null;
  function applyViewport() {
    var h = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight);
    document.documentElement.style.setProperty("--app-h", h + "px");
    // Pin the fixed body to the top of the visual viewport (handles the case
    // where the browser offsets the layout viewport under the keyboard).
    document.body.style.transform = vv ? ("translateY(" + Math.round(vv.offsetTop) + "px)") : "";
    // Keep the latest messages in view above the keyboard.
    if (nearBottom()) scrollDown();
  }
  if (vv) {
    vv.addEventListener("resize", applyViewport);
    vv.addEventListener("scroll", applyViewport);
  }
  window.addEventListener("resize", applyViewport);
  window.addEventListener("orientationchange", function () { setTimeout(applyViewport, 200); });
  applyViewport();

  // When the input gains focus (keyboard opening), snap to the bottom shortly
  // after so the composer + last messages sit right above the keyboard.
  (function () {
    var inp = document.getElementById("compose-input");
    if (inp) inp.addEventListener("focus", function () {
      setTimeout(function () { applyViewport(); scrollDown(); }, 300);
    });
  })();

  // On load, silently resume a stored session (so an F5 / rotation reload goes
  // straight back into the chat instead of asking to log in again). Also accept
  // a ?sid=… in the URL as a resume hint (e.g. arriving from another page).
  (function () {
    var urlSid = new URLSearchParams(window.location.search).get("sid");
    if (urlSid) {
      state.sid = urlSid; saveSession();
    }
    tryResumeSession(function (resumed) {
      if (!resumed) {
        var u = $("#li-user"); if (u) u.focus();
      }
    });
  })();
})();
</script>
</body>
