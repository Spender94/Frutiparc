<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Frusion - Ruffle</title>
  <style>
    body{
      margin:0;
      background:#223300;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      overflow:hidden;
    }
    #player-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      box-shadow:0 0 0 1px rgba(255,255,255,.15);
    }
    #player{
      width:640px;
      height:480px;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      ...(window.RufflePlayer.config || {}),
      logLevel: "trace",
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player-wrap"><div id="player"></div></div>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const APP_ORIGIN = window.location.origin;
  const APP_HOST = window.location.host;
  const WS_ORIGIN = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${APP_HOST}`;

  const domainMap = {
    'www.beta.frutiparc.com': APP_ORIGIN,
    'beta.frutiparc.com': APP_ORIGIN,
    'www.frutiparc.com': APP_ORIGIN,
    'www.frutiparc.net': APP_ORIGIN,
    'swf.frutiparc.com': APP_ORIGIN,
    'swf.beta.frutiparc.com': APP_ORIGIN,
  };

  function rewriteLegacyUrl(rawUrl) {
    let url = String(rawUrl || '');
    if (!url) return url;

    // Corrige les concaténations cassées :
    // https://frutiparc-1.onrender.comanimfrusion.swf/
    if (
      url.startsWith(APP_ORIGIN) &&
      !url.startsWith(`${APP_ORIGIN}/`) &&
      !url.startsWith(`${APP_ORIGIN}:`)
    ) {
      url = url.replace(APP_ORIGIN, `${APP_ORIGIN}/`);
    }

    try {
      const parsed = new URL(url, window.location.origin);
      const host = parsed.hostname + (parsed.port ? `:${parsed.port}` : '');

      for (const [domain, target] of Object.entries(domainMap)) {
        if (parsed.hostname === domain || host === domain) {
          return target + parsed.pathname + parsed.search;
        }
      }

      if (parsed.origin === APP_ORIGIN) {
        if (parsed.pathname.startsWith('/betawww/')) {
          parsed.pathname = parsed.pathname.replace('/betawww/', '/');
        } else if (parsed.pathname.startsWith('/betaswf/')) {
          parsed.pathname = parsed.pathname.replace('/betaswf/', '/swf/');
        } else if (parsed.pathname.startsWith('/sw/')) {
          parsed.pathname = parsed.pathname.replace('/sw/', '/swf/');
        }

        // Tolérance assets Frusion
        if (parsed.pathname === '/animfrusion.swf/') parsed.pathname = '/animfrusion.swf';
        if (parsed.pathname === '/animfrusion.sw/') parsed.pathname = '/animfrusion.sw';
        if (parsed.pathname === '/skinFrusion.swf/') parsed.pathname = '/skinFrusion.swf';
        if (parsed.pathname === '/skinFrusion.sw/') parsed.pathname = '/skinFrusion.sw';

        return parsed.toString();
      }

      return parsed.toString();
    } catch (e) {
      return url;
    }
  }

  // Patch fetch une seule fois
  if (!window.__frusionFetchPatched) {
    window.__frusionFetchPatched = true;

    const originalFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      const rawUrl =
        typeof input === 'string'
          ? input
          : (input && input.url ? input.url : String(input));

      const rewritten = rewriteLegacyUrl(rawUrl);
      console.log('[FRUSION FETCH]', rawUrl, '->', rewritten);

      if (input instanceof Request) {
        return originalFetch(new Request(rewritten, input), init);
      }
      return originalFetch(rewritten, init);
    };

    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url, ...rest) {
      const rewritten = rewriteLegacyUrl(url);
      console.log('[FRUSION XHR]', url, '->', rewritten);
      return originalXhrOpen.call(this, method, rewritten, ...rest);
    };
  }

  // ExternalInterface callback for patched game SWFs (e.g. MiniWave STANDALONE mode).
  // The game calls ExternalInterface.call("saveSlotData", game, slotId, data)
  // to persist slot data via HTTP instead of the Frusion XMLSocket wire protocol.
  window.saveSlotData = function(game, slotId, data) {
    console.log('[FRUSION] saveSlotData CALLED game=' + game + ' slot=' + slotId + ' dataType=' + typeof data);
    var sid = params.get('sid') || '';
    if (!sid) { console.log('[FRUSION] saveSlotData SKIPPED: no sid'); return; }
    var jsonData;
    try { jsonData = JSON.stringify(data); } catch(e) {
      console.log('[FRUSION] saveSlotData JSON.stringify FAILED:', e);
      return;
    }
    console.log('[FRUSION] saveSlot ' + game + '/slot' + slotId + ' (' + jsonData.length + ' chars)');
    fetch('/api/saveFrutiSlot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'sid=' + encodeURIComponent(sid) +
            '&game=' + encodeURIComponent(game) +
            '&slotId=' + encodeURIComponent(String(slotId)) +
            '&data=' + encodeURIComponent(jsonData)
    }).then(function(r) {
      console.log('[FRUSION] saveSlot response:', r.status);
    }).catch(function(e) { console.log('[FRUSION] saveSlot error:', e); });
  };

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  const width = Number(params.get('width') || params.get('w') || 640) || 640;
  const height = Number(params.get('height') || params.get('h') || 480) || 480;

  const wrap = document.getElementById('player-wrap');
  const mount = document.getElementById('player');

  wrap.style.width = `${width}px`;
  wrap.style.height = `${height}px`;
  mount.style.width = `${width}px`;
  mount.style.height = `${height}px`;

  mount.appendChild(player);

  const flashVars = {};
  for (const [k, v] of params.entries()) flashVars[k] = v;

  if (!flashVars.sid) flashVars.sid = 'debug';
  if (!flashVars.domain) flashVars.domain = `${window.location.host}/./`;

  await player.load({
    url: '/frusion_client.swf',
    autoplay: 'on',
    allowScriptAccess: true,
    allowNetworking: 'all',
    openUrlMode: 'allow',
    quality: 'high',
    letterbox: 'off',
    base: `${window.location.origin}/`,
    socketProxy: [
      { host: 'localhost', port: 5000, proxyUrl: WS_ORIGIN },
      { host: window.location.hostname, port: 5000, proxyUrl: WS_ORIGIN },
      { host: 'www.beta.frutiparc.com', port: 5000, proxyUrl: WS_ORIGIN },
      { host: 'www.frutiparc.com', port: 5000, proxyUrl: WS_ORIGIN },
      { host: 'localhost', port: 5001, proxyUrl: WS_ORIGIN + '/score' },
      { host: window.location.hostname, port: 5001, proxyUrl: WS_ORIGIN + '/score' },
      { host: 'www.beta.frutiparc.com', port: 5001, proxyUrl: WS_ORIGIN + '/score' },
      { host: 'www.frutiparc.com', port: 5001, proxyUrl: WS_ORIGIN + '/score' },
      { host: 'localhost', port: 2000, proxyUrl: WS_ORIGIN },
      { host: window.location.hostname, port: 2000, proxyUrl: WS_ORIGIN },
      { host: 'www.beta.frutiparc.com', port: 2000, proxyUrl: WS_ORIGIN },
      { host: 'www.frutiparc.com', port: 2000, proxyUrl: WS_ORIGIN }
    ],
    parameters: flashVars,
  });
})();
</script>
</body>
</html>
