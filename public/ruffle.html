<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Frutiparc - Ruffle</title>
    <style>
        body {
            margin: 0;
            background: #335511;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #player-container {
            width: 1024px;
            height: 768px;
        }
    </style>

    <script>
        (function() {
            const _origFetch = window.fetch;

            const domainMap = {
                'www.beta.frutiparc.com': 'http://localhost:8888',
                'www.frutiparc.com':      'http://localhost:8888',
                'swf.beta.frutiparc.com': 'http://localhost:8888/swf',
                'swf.frutiparc.com':      'http://localhost:8888/swf',
                'localhost:5173':         'http://localhost:8888',
                'localhost:5000':         'http://localhost:8888',
            };

            function maybeAutoLaunchFrusion(requestUrl, responsePromise) {
                return Promise.resolve(responsePromise).then((resp) => {
                    try {
                        const isDoLd = /\/do\/ld(\?|$)/.test(requestUrl || '');
                        if (!isDoLd || window.__frusionAutoLaunchDone) return resp;
                        window.__frusionAutoLaunchDone = true;

                        resp.clone().text().then((xmlText) => {
                            const gameTag = xmlText.match(/<game[^>]*>/i);
                            if (!gameTag) return;
                            const tag = gameTag[0];
                            const firstSwfTag = xmlText.match(/<s[^>]*>/i);
                            const getAttr = (name) => {
                                const m = tag.match(new RegExp(name + '="([^"]*)"'));
                                return m ? m[1] : '';
                            };
                            const getSwfAttr = (name) => {
                                if (!firstSwfTag) return '';
                                const m = firstSwfTag[0].match(new RegExp(name + '="([^"]*)"'));
                                return m ? m[1] : '';
                            };
                            const sid = new URLSearchParams(window.location.search).get('sid') || 'debug';
                            const target = new URL('/frusion', window.location.origin);
                            target.searchParams.set('sid', sid);
                            target.searchParams.set('disc_type', getAttr('t') || '0');
                            target.searchParams.set('gameName', getAttr('n') || 'kaluga');
                            target.searchParams.set('u', getAttr('u'));
                            target.searchParams.set('id', getSwfAttr('u') || getAttr('u'));
                            target.searchParams.set('size', getSwfAttr('s') || '0');
                            target.searchParams.set('width', (getAttr('p').match(/w=(\d+)/) || [,'700'])[1]);
                            target.searchParams.set('height', (getAttr('p').match(/h=(\d+)/) || [,'480'])[1]);
                            target.searchParams.set('w', (getAttr('p').match(/w=(\d+)/) || [,'700'])[1]);
                            target.searchParams.set('h', (getAttr('p').match(/h=(\d+)/) || [,'480'])[1]);
                            target.searchParams.set('mode', (getAttr('p').match(/m=([a-z])/i) || [,'i'])[1]);
                            console.log('[FRUSION autolaunch] ->', target.toString());
                            setTimeout(() => { window.location.href = target.toString(); }, 50);
                        }).catch(() => {});
                    } catch (e) {}
                    return resp;
                });
            }

            window.fetch = function(input, init) {
                let url = (typeof input === 'string')
                    ? input
                    : (input instanceof Request ? input.url : String(input));

                // Some legacy URL builders concatenate host + file without "/"
                // (e.g. http://localhost:8888animfrusion.swf). Fix it here.
                if (typeof url === 'string') {
                    url = url.replace(/^http:\/\/localhost:8888(?![\/:])/, 'http://localhost:8888/');
                    url = url.replace(/^https:\/\/localhost:8888(?![\/:])/, 'https://localhost:8888/');
                }

                try {
                    const parsed = new URL(url);
                    const host = parsed.hostname + (parsed.port ? ':' + parsed.port : '');

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (host === domain || parsed.hostname === domain) {
                            const path = parsed.pathname.startsWith('/') ? parsed.pathname : ('/' + parsed.pathname);
                            const newUrl = target + path + parsed.search;
                            console.log('[FETCH rewrite]', url, '->', newUrl);
                            return maybeAutoLaunchFrusion(newUrl, _origFetch.call(this, newUrl, init));
                        }
                    }
                } catch (e) {}

                const prefixRewrites = [
                    ['/betawww/', '/'],
                    ['/betaswf/', '/swf/'],
                    ['/sw/', '/swf/'],
                ];

                try {
                    const parsed = new URL(url);
                    if (parsed.hostname === 'localhost') {
                        for (const [prefix, replacement] of prefixRewrites) {
                            if (parsed.pathname.startsWith(prefix)) {
                                parsed.pathname = replacement + parsed.pathname.substring(prefix.length);
                                const newUrl = parsed.toString();
                                console.log('[FETCH prefix]', url, '->', newUrl);
                                return maybeAutoLaunchFrusion(newUrl, _origFetch.call(this, newUrl, init));
                            }
                        }
                    }
                } catch (e) {}

                console.log('[FETCH]', url);
                return maybeAutoLaunchFrusion(url, _origFetch.call(this, input, init));
            };

            const _origXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                let rewritten = url;

                if (typeof rewritten === 'string') {
                    rewritten = rewritten.replace(/^http:\/\/localhost:8888(?![\/:])/, 'http://localhost:8888/');
                    rewritten = rewritten.replace(/^https:\/\/localhost:8888(?![\/:])/, 'https://localhost:8888/');
                }

                try {
                    const parsed = new URL(rewritten, window.location.origin);
                    const host = parsed.hostname + (parsed.port ? ':' + parsed.port : '');

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (host === domain || parsed.hostname === domain) {
                            const path = parsed.pathname.startsWith('/') ? parsed.pathname : ('/' + parsed.pathname);
                            rewritten = target + path + parsed.search;
                            console.log('[XHR rewrite]', url, '->', rewritten);
                            break;
                        }
                    }
                } catch (e) {}

                return _origXHROpen.call(this, method, rewritten, ...rest);
            };
        })();
    </script>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player-container"></div>

    <script>
        // Called by legacy SWF via getURL("javascript:fp_goURLResize(...)" ).
        // Popups are often blocked in modern browsers, so we fallback to same-tab navigation.
        window.fp_goURLResize = function(url, _mode, _w, _h) {
            try {
                const w = window.open(url, "_blank", "noopener,noreferrer");
                if (!w) window.location.href = url;
            } catch (e) {
                window.location.href = url;
            }
            return true;
        };

        function normalizeAvatarState(value) {
            let s = String(value || '').replace(/\D/g, '');

            if (s.length < 24) s = s.padEnd(24, '0');
            if (s.length > 24) s = s.slice(0, 24);

            const family = s.slice(0, 2);
            if (family !== '00' && family !== '01') {
                s = '00' + s.slice(2);
            }

            return s;
        }

        function normalizeExpression(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return '0';
            return String(Math.max(0, Math.min(12, Math.floor(n))));
        }

        window.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);

            const sid = urlParams.get('sid') || 'debug';
            const s = normalizeAvatarState(
                urlParams.get('s') || '000000000000000000000000'
            );
            const e = normalizeExpression(
                urlParams.get('e') || '0'
            );

            console.log('[Ruffle] sid =', sid);
            console.log('[Ruffle] s   =', s);
            console.log('[Ruffle] e   =', e);

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "1024px";
            player.style.height = "768px";
            document.getElementById("player-container").appendChild(player);

            await player.load({
                url: "/legacy/main.swf",
                autoplay: "on",
                allowScriptAccess: true,
                quality: "high",
                parameters: {
                    sid: sid,
                    // Keep a slash-stable suffix: some legacy concatenations
                    // drop one trailing slash before appending filenames.
                    domain: "localhost:8888/./",
                    s: s,
                    e: e
                },
                socketProxy: [
                    { host: "localhost", port: 5000, proxyUrl: "ws://localhost:8888" }
                ],
                openUrlMode: "allow",
                allowNetworking: "all",
                base: "http://localhost:8888/"
            });
        });
    </script>

    <div id="chat-overlay" style="
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        gap: 6px;
        align-items: center;
        background: rgba(0,0,0,0.75);
        padding: 6px 12px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 13px;
    ">
        <label for="chat-input" style="color: #8f8; white-space: nowrap;">Chat :</label>

        <select id="chat-channel" style="
            padding: 4px;
            background: #1a1a1a;
            color: #8f8;
            border: 1px solid #6a6;
            border-radius: 4px;
            font-size: 12px;
        "></select>

        <input
            id="chat-input"
            type="text"
            placeholder="Tape ton message ici..."
            autocomplete="off"
            spellcheck="false"
            style="
                width: 380px;
                padding: 4px 8px;
                border: 1px solid #6a6;
                border-radius: 4px;
                background: #1a1a1a;
                color: #fff;
                outline: none;
                font-size: 13px;
            "
        />

        <button id="chat-send" style="
            padding: 4px 12px;
            background: #4a4;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        ">Envoyer</button>

        <span id="chat-status" style="color: #888; font-size: 11px; margin-left: 4px;">...</span>
    </div>

<script>
(function() {
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatStatus = document.getElementById('chat-status');
    const chatChannel = document.getElementById('chat-channel');

    let chatWs = null;
    let chatLogged = false;
    let currentJoinedChannel = null;

    function decodeWsData(data) {
        if (typeof data === 'string') return Promise.resolve(data);
        if (data instanceof Blob) return data.text();
        if (data instanceof ArrayBuffer) {
            return Promise.resolve(new TextDecoder().decode(new Uint8Array(data)));
        }
        return Promise.resolve('');
    }

    function sendRaw(xml) {
        if (!chatWs || chatWs.readyState !== WebSocket.OPEN) return;
        chatWs.send(xml + '\0');
        console.log('[ChatBridge] ->', xml);
    }

    function joinChannel(channel) {
        if (!channel || !chatLogged) return;

        if (currentJoinedChannel && currentJoinedChannel !== channel) {
            sendRaw(`<y g="${currentJoinedChannel}"/>`);
        }

        currentJoinedChannel = channel;
        sendRaw(`<o g="${channel}"/>`);
        chatStatus.textContent = 'Salon : ' + channel;
    }

    function connectChat() {
        chatWs = new WebSocket('ws://localhost:8888');
        chatWs.binaryType = 'arraybuffer';
        chatStatus.textContent = 'Connexion...';

        chatWs.onopen = () => {
            console.log('[ChatBridge] Connected');
            chatStatus.textContent = 'Ident...';
            sendRaw('<c/>');
            sendRaw('<d/>');
        };

        chatWs.onmessage = async (evt) => {
            const data = await decodeWsData(evt.data);
            const msgs = data.split('\0').filter(s => s.trim());

            for (const raw of msgs) {
                console.log('[ChatBridge] <-', raw.substring(0, 300));

                if (raw.startsWith('<d>')) {
                    sendRaw('<k l="DebugBot" s="chatdebug"/>');
                    continue;
                }

                if (raw.startsWith('<k')) {
                    if (raw.includes(' k="')) {
                        chatStatus.textContent = 'Erreur auth';
                    } else {
                        chatLogged = true;
                        chatStatus.textContent = 'OK';
                        sendRaw('<q/>');
                    }
                    continue;
                }

                if (raw.startsWith('<q')) {
                    const matches = [...raw.matchAll(/g="([^"]+)"/g)];
                    chatChannel.innerHTML = '';

                    for (const m of matches) {
                        const opt = document.createElement('option');
                        opt.value = m[1];
                        opt.textContent = m[1];
                        chatChannel.appendChild(opt);
                    }

                    if (chatChannel.querySelector('option[value="pomme"]')) {
                        chatChannel.value = 'pomme';
                    }

                    if (chatChannel.value) {
                        joinChannel(chatChannel.value);
                    } else {
                        chatStatus.textContent = 'Aucun salon';
                    }
                    continue;
                }

                if (raw.startsWith('<p ')) {
                    chatStatus.textContent = 'Dans : ' + (currentJoinedChannel || '?');
                    continue;
                }

                if (raw.startsWith('<t ')) {
                    console.log('[ChatBridge][MSG]', raw);
                    continue;
                }
            }
        };

        chatWs.onclose = () => {
            chatLogged = false;
            currentJoinedChannel = null;
            chatStatus.textContent = 'Déconnecté';
            setTimeout(connectChat, 3000);
        };

        chatWs.onerror = () => {
            chatStatus.textContent = 'Erreur WS';
        };
    }

    function escapeXml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function sendMessage() {
        const text = chatInput.value.trim();
        const channel = chatChannel.value;

        if (!text || !chatLogged || !channel) return;

        sendRaw(`<t g="${channel}">${escapeXml(text)}</t>`);
        chatInput.value = '';
        chatInput.focus();
    }

    chatSend.addEventListener('click', sendMessage);

    chatChannel.addEventListener('change', () => {
        if (chatChannel.value) {
            joinChannel(chatChannel.value);
        }
    });

    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
            e.preventDefault();
        }
        e.stopPropagation();
    });

    chatInput.addEventListener('mousedown', (e) => e.stopPropagation());

    connectChat();
})();
</script>
</body>
</html>
