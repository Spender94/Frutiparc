<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Frutiparc - Ruffle</title>
    <style>
        body {
            margin: 0;
            background: #ade76b;
            overflow: hidden;
        }

        #player-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 1380px;
            height: 800px;
            transform-origin: left center;
            transform: translateY(-50%) scale(1);
        }

        /* Zoom mode (/legacy-zoom): render main.swf at its native 1380×800 and
           let the page scroll, so the browser's own zoom (Ctrl +/-) magnifies
           the client — crisply — and you can pan around. Disables the
           fit-to-viewport transform + overflow clipping the default salon uses. */
        html.zoom-mode, html.zoom-mode body { overflow: auto; }
        html.zoom-mode #player-container {
            position: static;
            top: auto;
            transform: none;
            margin: 0;
        }
    </style>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            fontSources: [
                `${window.location.origin}/legacy/fonts.swf`
            ],
            defaultFonts: {
                sans: ["Verdana", "verdana"],
                serif: ["Times New Roman", "TimesNewRoman"],
                typewriter: ["Verdana", "verdana"]
            },
            publicPath: "/ruffle/",
            scale: "noScale",
            salign: "TL",
            // ?debug=1 bumps to "info" so Ruffle logs which renderer it picked
            // ("Using WebGL/WebGPU/Canvas renderer") — a silent canvas2d
            // fallback would be 3-5× slower than GPU and is worth ruling out.
            // Default "error" (was "warn"): main.swf's AVM emits a continuous
            // WARN flood ("Cannot enumerate Undefined" / "Unable to attach
            // butDocumentResize" dozens of times per burst); formatting each +
            // the WASM→JS console call is wasted CPU in normal play. Genuine
            // errors still surface, and ?debug=1 restores full logs.
            logLevel: new URLSearchParams(window.location.search).get("debug") === "1" ? "info" : "error"
        };

        // Gate verbose legacy-bridge logs behind ?debug=1 to avoid CPU
        // pressure from console I/O during normal gameplay.
        window.__FRUSION_DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";
        window.__dlog = window.__FRUSION_DEBUG ? console.log.bind(console) : function () {};

        // Zoom mode: the page is served at /legacy-zoom (the server injects
        // window.__FP_ZOOM = true just before this script). In that mode we
        // render main.swf at its native 1380×800 and let the BROWSER's own zoom
        // (Ctrl +/-) magnify it, instead of CSS-fitting it to the viewport.
        // That means we must NOT override devicePixelRatio and NOT run the
        // fit-to-viewport transform below.
        window.__FP_ZOOM = window.__FP_ZOOM === true;

        // ── Backing-canvas resolution (effective DPR) ───────────────
        // Ruffle rasterises its canvas at (cssPixels × devicePixelRatio).
        // The salon player has a FIXED css box (1380×800, matched to the
        // SWF's patched mcw/mch) and is then CSS-transform-scaled by
        // `fit = min(winW/1380, winH/800)` to fill the viewport (see
        // fitFrutiparc below). That transform is a *bitmap* scale of Ruffle's
        // canvas, so at the browser's 100% zoom (DPR 1) on a window wider
        // than 1380 the 1380-px canvas is stretched up to ~1920 physical px
        // → visibly blurry. (At 150% OS scale DPR happened to be 1.5, giving
        // a 2070-px canvas that downscaled crisply — which is why only 100%
        // looked soft.)
        //
        // Fix: report an effective DPR of (realDPR × fit), recomputed on each
        // read, so Ruffle rasterises the canvas at the exact resolution it is
        // displayed at — crisp at any OS/browser scale, with no wasted pixels
        // (at 150% scale realDPR 1.5 × fit 0.93 ≈ 1.4, *cheaper* than the old
        // flat 1.5 cap). Clamped to MAX_EFF_DPR so 4K/retina screens don't
        // rasterise an enormous canvas — the salon's dominant cost is CPU
        // (AVM + tessellation), and past ~2× the extra GPU fill buys little.
        // LAYOUT_W/H must stay equal to the player size + fit divisors below.
        (function () {
            // In zoom mode keep the native devicePixelRatio: the browser zoom
            // already raises it, so Ruffle rasterises crisply on its own.
            if (window.__FP_ZOOM) return;
            var LAYOUT_W = 1380, LAYOUT_H = 800;
            var MAX_EFF_DPR = 2.0;
            var realDPR = window.devicePixelRatio || 1;
            function effectiveDpr() {
                var fit = Math.min(window.innerWidth / LAYOUT_W, window.innerHeight / LAYOUT_H);
                if (!(fit > 0) || !isFinite(fit)) fit = 1;
                return Math.min(MAX_EFF_DPR, Math.max(1, realDPR * fit));
            }
            try {
                Object.defineProperty(window, "devicePixelRatio", {
                    configurable: true,
                    get: effectiveDpr
                });
                window.__dlog("[Ruffle] effective DPR override active (real " + realDPR + ", now " + effectiveDpr().toFixed(3) + ")");
            } catch (e) {
                console.warn("[Ruffle] devicePixelRatio override failed:", e && e.message);
            }
        })();
    </script>

    <script src="/ruffle/ruffle.js" onerror="
        console.warn('[Ruffle] Local load failed, falling back to CDN');
        window.RufflePlayer.config.publicPath = undefined;
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/@ruffle-rs/ruffle';
        document.head.appendChild(s);
    "></script>
    <!-- Miniatures de bouilles rapides (cache PNG /bouille-img) pour le Bouilloscope. -->
    <script src="/js/bouille-thumb.js"></script>
</head>
<body>
    <div id="player-container"></div>

    <!-- Live connected-players badge (overlay, top-right). Polls /api/online-count;
         click to reveal the list of connected pseudos (/api/online-users). -->
    <div id="online-badge" style="position:fixed;top:8px;right:10px;z-index:2147483646;
        background:rgba(44,74,15,.82);color:#CFF599;font:bold 12px Verdana,sans-serif;
        padding:5px 10px;border-radius:14px;cursor:pointer;user-select:none;display:none;
        box-shadow:0 2px 6px rgba(0,0,0,.25)" title="Voir qui est connecté">
      <span id="online-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;
        background:#2ecc40;margin-right:6px;vertical-align:middle"></span><span id="online-count">…</span> en ligne <span style="opacity:.6">▾</span>
    </div>
    <!-- Liste des connectés (repliée par défaut, ouverte au clic sur le badge). -->
    <div id="online-list" style="position:fixed;top:38px;right:10px;z-index:2147483646;display:none;
        background:rgba(28,46,10,.97);color:#EAF8D2;font:12px Verdana,sans-serif;
        border:1px solid rgba(207,245,153,.35);border-radius:10px;padding:8px 0;
        max-height:60vh;overflow-y:auto;min-width:170px;max-width:240px;
        box-shadow:0 6px 18px rgba(0,0,0,.4)">
      <div id="online-list-head" style="font-weight:bold;color:#CFF599;padding:2px 14px 8px;border-bottom:1px solid rgba(207,245,153,.2);margin-bottom:4px">Connectés</div>
      <div id="online-list-body"></div>
    </div>
    <script>
        // Poll the connected-players count; click the badge to list the pseudos.
        // ── Blindtest (bureau) ──
        //
        // Le SWF est du Flash dans Ruffle : il ne saura jamais jouer YouTube.
        // C'est donc la PAGE qui s'en charge, sans qu'on touche au SWF. Elle
        // demande au serveur, toutes les deux secondes, s'il y a un extrait en
        // cours dans un salon où se trouve ce joueur, et pose un petit bandeau
        // par-dessus le bureau quand il y en a un.
        //
        // Comme sur mobile, l'iframe pointe sur /api/blindtest/embed : le titre
        // de la chanson n'apparaît nulle part, et le serveur place l'extrait à
        // la seconde où il en est — un retardataire entend la même chose que
        // les autres.
        (function () {
            var sid = new URLSearchParams(window.location.search).get("sid") || "";
            if (!sid) return;
            var etat = { jeton: "", fin: 0, arme: false, boite: null, minuteur: null };
            try { etat.arme = localStorage.getItem("fp_bt_son") === "1"; } catch (e) {}

            function poser() {
                if (etat.boite) return etat.boite;
                var b = document.createElement("div");
                b.id = "bt-bureau";
                b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:8px;"
                    + "z-index:99999;display:flex;align-items:center;gap:10px;padding:7px 14px;"
                    + "background:#1A5FD0;color:#fff;font:bold 13px Verdana,Arial,sans-serif;"
                    + "border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.35)";
                b.innerHTML = '<span>Blindtest</span><span id="bt-b-temps"></span>'
                    + '<button id="bt-b-bouton" style="border:0;border-radius:6px;padding:4px 10px;'
                    + 'cursor:pointer;background:#fff;color:#1A5FD0;font:bold 12px Verdana,Arial,sans-serif"></button>'
                    + '<div id="bt-b-cadre" style="width:1px;height:1px;overflow:hidden;opacity:.01"></div>';
                document.body.appendChild(b);
                b.querySelector("#bt-b-bouton").addEventListener("click", function () {
                    if (etat.arme) {
                        etat.arme = false;
                        try { localStorage.removeItem("fp_bt_son"); } catch (e) {}
                        var c = document.getElementById("bt-b-cadre");
                        if (c) c.innerHTML = "";
                    } else {
                        etat.arme = true;
                        try { localStorage.setItem("fp_bt_son", "1"); } catch (e) {}
                        cadre();
                    }
                    tic();
                });
                etat.boite = b;
                return b;
            }
            function cadre() {
                var c = document.getElementById("bt-b-cadre");
                if (!c || !etat.jeton) return;
                c.innerHTML = '<iframe title="extrait" allow="autoplay" frameborder="0"'
                    + ' style="width:320px;height:180px;border:0"'
                    + ' src="/api/blindtest/embed?k=' + encodeURIComponent(etat.jeton)
                    + '&r=' + Date.now() + '"></iframe>';
            }
            function retirer() {
                if (etat.boite && etat.boite.parentNode) etat.boite.parentNode.removeChild(etat.boite);
                etat.boite = null; etat.jeton = "";
            }
            function tic() {
                if (!etat.jeton) return;
                var reste = Math.max(0, Math.ceil((etat.fin - Date.now()) / 1000));
                var t = document.getElementById("bt-b-temps");
                var bo = document.getElementById("bt-b-bouton");
                if (t) t.textContent = reste + " s";
                if (bo) bo.textContent = etat.arme ? "Couper" : "Écouter";
                if (reste <= 0) retirer();
            }
            setInterval(tic, 500);
            setInterval(function () {
                fetch("/api/blindtest/state?sid=" + encodeURIComponent(sid), { cache: "no-store" })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (!d || !d.ok) return;
                        if (!d.jeton) { if (etat.jeton) retirer(); return; }
                        if (d.jeton === etat.jeton) return;     // déjà en cours
                        etat.jeton = d.jeton;
                        etat.fin = Date.now() + (Number(d.restant) || 0) * 1000;
                        poser();
                        if (etat.arme) cadre();
                        tic();
                    })
                    .catch(function () { /* le bureau continue sans */ });
            }, 2000);
        })();

        (function () {
            var badge = document.getElementById("online-badge");
            var label = document.getElementById("online-count");
            var panel = document.getElementById("online-list");
            var head = document.getElementById("online-list-head");
            var body = document.getElementById("online-list-body");
            var open = false;
            function refresh() {
                fetch("/api/online-count", { cache: "no-store" })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d && typeof d.count === "number") {
                            label.textContent = d.count;
                            badge.style.display = "block";
                        }
                    })
                    .catch(function () { /* keep last value */ });
            }
            function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
            function renderList() {
                body.innerHTML = '<div style="padding:4px 14px;color:#9fb37e">Chargement…</div>';
                fetch("/api/online-users", { cache: "no-store" })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        var list = (d && d.users) || [];
                        head.textContent = list.length + (list.length > 1 ? " connectés" : " connecté");
                        if (!list.length) { body.innerHTML = '<div style="padding:4px 14px;color:#9fb37e">Personne pour le moment.</div>'; return; }
                        body.innerHTML = list.map(function (u) {
                            return '<div style="padding:4px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(u) + '</div>';
                        }).join("");
                    })
                    .catch(function () { body.innerHTML = '<div style="padding:4px 14px;color:#f0a">Erreur de chargement.</div>'; });
            }
            function setOpen(v) { open = v; panel.style.display = v ? "block" : "none"; if (v) renderList(); }
            badge.addEventListener("click", function (e) { e.stopPropagation(); setOpen(!open); });
            panel.addEventListener("click", function (e) { e.stopPropagation(); });
            // Clic ailleurs (page, SWF) → on referme.
            document.addEventListener("click", function () { if (open) setOpen(false); });
            refresh();
            setInterval(function () { refresh(); if (open) renderList(); }, 20000);
        })();
    </script>
    <script>
        // Make the whole Frutiparc client responsive: scale it to fill the
        // viewport, left-aligned (any leftover space falls on the right),
        // preserving aspect (green letterbox bars on mismatched ratios). Scaling up softens the image a bit (bitmap
        // upscale) — a crisp fill would require a main.swf reflow patch. Small
        // screens scale down (no clipping); large screens scale up to use the
        // space. Render cost stays bounded regardless of scale.
        (function () {
            // Zoom mode: skip the fit-to-viewport transform entirely and mark
            // the document so the CSS above renders main.swf at native size
            // with page scrolling, so browser zoom (Ctrl +/-) drives the size.
            if (window.__FP_ZOOM) {
                document.documentElement.classList.add("zoom-mode");
                return;
            }
            var c = document.getElementById("player-container");
            function fitFrutiparc() {
                var s = Math.min(window.innerWidth / 1380, window.innerHeight / 800);
                c.style.transform = "translateY(-50%) scale(" + s + ")";
            }
            window.addEventListener("resize", fitFrutiparc);
            fitFrutiparc();
        })();
    </script>

    <script>
        (function () {
            const APP_ORIGIN = window.location.origin;
            const APP_HOST = window.location.host;
            const WS_ORIGIN = `${window.location.protocol === "https:" ? "wss" : "ws"}://${APP_HOST}`;
            const SWF_ORIGIN = `${APP_ORIGIN}/swf`;

            const domainMap = {
                "www.beta.frutiparc.com": APP_ORIGIN,
                "beta.frutiparc.com": APP_ORIGIN,
                "www.frutiparc.com": APP_ORIGIN,
                "www.frutiparc.net": APP_ORIGIN,
                "swf.beta.frutiparc.com": SWF_ORIGIN,
                "swf.frutiparc.com": SWF_ORIGIN,
                "localhost:5173": APP_ORIGIN,
                "localhost:5000": APP_ORIGIN
            };

            function rewriteLegacyUrl(rawUrl) {
                let url = String(rawUrl || "");
                if (!url) return url;

                if (
                    url.startsWith(APP_ORIGIN) &&
                    !url.startsWith(`${APP_ORIGIN}/`) &&
                    !url.startsWith(`${APP_ORIGIN}:`)
                ) {
                    url = url.replace(APP_ORIGIN, `${APP_ORIGIN}/`);
                }

                try {
                    const parsed = new URL(url, window.location.origin);
                    const host = parsed.hostname + (parsed.port ? ":" + parsed.port : "");

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (parsed.hostname === domain || host === domain) {
                            const path = parsed.pathname.startsWith("/") ? parsed.pathname : "/" + parsed.pathname;
                            return target + path + parsed.search;
                        }
                    }

                    if (host === APP_HOST && parsed.origin !== APP_ORIGIN) {
                        return APP_ORIGIN + parsed.pathname + parsed.search;
                    }

                    if (parsed.origin === APP_ORIGIN) {
                        if (parsed.pathname.startsWith("/games/")) {
                            return APP_ORIGIN + "/swf" + parsed.pathname + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/betawww/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/betawww/", "/") + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/betaswf/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/betaswf/", "/swf/") + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/sw/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/sw/", "/swf/") + parsed.search;
                        }
                    }

                    return parsed.toString();
                } catch (e) {
                    return url;
                }
            }

            // Parse /do/ld XML and store game info for the standalone popup
            function parseDoLdResponse(text) {
                try {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(text, "text/xml");
                    var game = doc.querySelector("game");
                    if (game && !game.getAttribute("k")) {
                        var swfUrl = game.getAttribute("u") || "";
                        var gameName = game.getAttribute("n") || "";
                        var props = game.getAttribute("p") || "";
                        var parsedProps = {};
                        props.split(";").forEach(function (p) {
                            var parts = p.split("=");
                            if (parts[0]) parsedProps[parts[0]] = parts[1] || "";
                        });
                        window.__pendingGame = {
                            swf: swfUrl,
                            name: gameName,
                            width: parseInt(parsedProps.w) || 640,
                            height: parseInt(parsedProps.h) || 480,
                            swfWidth: parseInt(parsedProps.sw) || 0,
                            swfHeight: parseInt(parsedProps.sh) || 0,
                            // ct / cb = vertical crop applied to the wrap (see
                            // game-popup.html). Used by Kaluga to hide its
                            // decorative top/bottom green borders.
                            cropTop: parseInt(parsedProps.ct) || 0,
                            cropBottom: parseInt(parsedProps.cb) || 0
                        };
                        window.__dlog("[FRUSION] Pending game:", JSON.stringify(window.__pendingGame));
                    }
                } catch (e) {
                    console.warn("[FRUSION] /do/ld parse error:", e);
                }
            }

            // --- Fetch interception (URL rewrite + /do/ld game info capture) ---
            const _origFetch = window.fetch.bind(window);

            // Forward a Request to a rewritten URL without using
            // new Request(url, existingRequest), which can lose the POST body
            // on Firefox.  Instead, read the body (if any) and rebuild an init
            // object with explicit method / headers / credentials / body.
            function forwardReq(url, req, extraInit) {
                var method = req.method;
                var headers = new Headers(req.headers);
                var creds = req.credentials;
                if (method === "GET" || method === "HEAD") {
                    var fwd = { method: method, headers: headers, credentials: creds };
                    if (extraInit) for (var k in extraInit) fwd[k] = extraInit[k];
                    return _origFetch(url, fwd);
                }
                return req.arrayBuffer().then(function (buf) {
                    var fwd = {
                        method: method,
                        headers: headers,
                        credentials: creds,
                        body: buf
                    };
                    if (extraInit) for (var k in extraInit) fwd[k] = extraInit[k];
                    return _origFetch(url, fwd);
                });
            }

            window.fetch = function (input, init) {
                const rawUrl =
                    typeof input === "string"
                        ? input
                        : (input && input.url ? input.url : String(input));

                const rewritten = rewriteLegacyUrl(rawUrl);
                window.__dlog("[FETCH]", rawUrl, "->", rewritten);

                var isDoLd = false;
                try {
                    var u = new URL(rewritten, window.location.origin);
                    isDoLd = u.pathname === "/do/ld";
                } catch (e) {}

                if (isDoLd) {
                    var doFetch = input instanceof Request
                        ? forwardReq(rewritten, input, init)
                        : _origFetch(rewritten, init);
                    return doFetch.then(function (response) {
                        var cloned = response.clone();
                        cloned.text().then(function (text) {
                            window.__dlog("[FRUSION] /do/ld fetch response:", text);
                            parseDoLdResponse(text);
                        });
                        return response;
                    });
                }

                if (input instanceof Request) {
                    return forwardReq(rewritten, input, init);
                }
                return _origFetch(rewritten, init);
            };

            // --- XHR interception (URL rewrite + /do/ld game info capture) ---
            const _origXHROpen = XMLHttpRequest.prototype.open;
            const _origXHRSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function (method, url) {
                this.__frusionUrl = url;
                var rewritten = rewriteLegacyUrl(url);
                var isDoLd = false;
                try {
                    var u = new URL(rewritten, window.location.origin);
                    isDoLd = u.pathname === "/do/ld";
                } catch (e) {}
                this.__frusionIsDoLd = isDoLd;
                window.__dlog("[FRUSION XHR]", url, "->", rewritten);
                return _origXHROpen.call(this, method, rewritten, arguments[2], arguments[3], arguments[4]);
            };
            XMLHttpRequest.prototype.send = function (body) {
                if (this.__frusionIsDoLd) {
                    var xhr = this;
                    xhr.addEventListener("load", function () {
                        if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
                            window.__dlog("[FRUSION] /do/ld XHR response:", xhr.responseText);
                            parseDoLdResponse(xhr.responseText);
                        }
                    });
                }
                return _origXHRSend.call(this, body);
            };

            // ─── Forum popup (Flash desktop "Forum" icon) ───
            // FPForumSlot.as flow:
            //   init()        → fp_goURLResize('/fb/?sid=...', 1)  // stash URL
            //   onActivate()  → fp_activatePopupForum()            // open/focus popup
            //   close()       → fp_closePopupForum()               // close popup
            //
            // Note: `fp_goURLResize` is ONLY called by FPForumSlot — games use
            // `fp_goURLNewWin`, so this code path does not affect game launching.
            var __forumUrl = null;
            var __forumPopup = null;
            // Track the standalone game popup so we can close it on disc
            // eject and prevent the previous game's SWF from racing the
            // newer one on saveSlot writes.
            window.__gamePopup = null;

            // Intercept Frusion's /ff/mv calls (file move). When a game disc
            // moves back to "disccollector" that's the eject signal — the
            // popup window is now stale and should close so it can't keep
            // writing saves that conflict with the user's next game session.
            // We wrap BOTH fetch and XMLHttpRequest — Ruffle's networking
            // layer can go through either depending on the SWF's API choice
            // (LoadVars vs getURL2 vs URLRequest etc.) and the build.
            function __maybeEject(url, body) {
                if (!url || url.indexOf("/ff/mv") === -1) return;
                var hit = url.indexOf("folder=disccollector") !== -1
                       || (body && typeof body === "string"
                           && body.indexOf("folder=disccollector") !== -1);
                if (!hit) return;
                window.__dlog("[Frusion] disc eject detected → closing game popup");
                if (window.__gamePopup && !window.__gamePopup.closed) {
                    try { window.__gamePopup.close(); } catch (e) {}
                }
                window.__gamePopup = null;
            }
            (function wrapFetchForEject() {
                var origFetch = window.fetch.bind(window);
                window.fetch = function (input, init) {
                    var url = typeof input === "string" ? input : (input && input.url) || "";
                    __maybeEject(url, init && init.body);
                    return origFetch(input, init);
                };
            })();
            (function wrapXHRForEject() {
                var origOpen = XMLHttpRequest.prototype.open;
                var origSend = XMLHttpRequest.prototype.send;
                XMLHttpRequest.prototype.open = function (method, url) {
                    this.__ejectUrl = url;
                    return origOpen.apply(this, arguments);
                };
                XMLHttpRequest.prototype.send = function (body) {
                    __maybeEject(this.__ejectUrl || "", body);
                    return origSend.apply(this, arguments);
                };
            })();

            function buildForumUrl(rawUrl) {
                var sid = new URLSearchParams(window.location.search).get("sid") || "";
                if (rawUrl) {

                //      so a single dropped connection doesn't force the
                //      user to F5 manually.
                //   2. Cross-checks Content-Length vs received bytes so a
                //      silently-truncated response is rejected and retried
                //      instead of being handed off to Ruffle (which would
                //      then surface as 0x… avm errors and character-id
                //      collisions when it tries to parse half a binary).
                //
                // The fetched bytes themselves are discarded — we hand
                // Ruffle the same URL afterwards so the SWF knows its own
                // origin (loaded-via-`data:` strips `_url`, which any AS
                // code doing `this._url + "/foo"` turns into a real
                // /undefined GET → 404). The browser cache replays the
                // pre-flight response via a fast 304 thanks to no-cache +
                // must-revalidate on the server side.
                async function preflightSwf(url, { attempts = 4, timeoutMs = 25000 } = {}) {
                    for (let i = 1; i <= attempts; i++) {
                        const controller = new AbortController();
                        const t = setTimeout(() => controller.abort(), timeoutMs);
                        try {
                            const res = await fetch(url, { cache: "no-cache", signal: controller.signal });
                            clearTimeout(t);
                            if (!res.ok) throw new Error("HTTP " + res.status);
                            const buf = await res.arrayBuffer();
                            // Validate that the body actually has the
                            // bytes the server promised. fetch() can
                            // resolve with a short body when a chunked
                            // stream is cut off without a clean error.
                            const expected = Number(res.headers.get("Content-Length") || 0);
                            if (expected > 0 && buf.byteLength !== expected) {
                                throw new Error("short body " + buf.byteLength + " / " + expected);
                            }
                            if (buf.byteLength < 65536) {
                                throw new Error("body too small " + buf.byteLength);
                            }
                            const sig = new Uint8Array(buf, 0, 3);
                            const tag = String.fromCharCode(sig[0], sig[1], sig[2]);
                            if (tag !== "CWS" && tag !== "FWS" && tag !== "ZWS") {
                                throw new Error("bad swf header: " + tag);
                            }
                            window.__dlog("[Ruffle] main.swf preflight OK (" + buf.byteLength + " bytes, attempt " + i + ")");
                            return;
                        } catch (err) {
                            clearTimeout(t);
                            console.warn("[Ruffle] main.swf preflight " + i + "/" + attempts + " failed:", err.message || err);
                            if (i === attempts) throw err;
                            // Exponential backoff: 1s, 2s, 4s. Cap so the
                            // first paint stays bounded even on slow links.
                            await new Promise((r) => setTimeout(r, Math.min(4000, 1000 * Math.pow(2, i - 1))));
                        }
                    }
                }

                try {
                    await preflightSwf("/legacy/main.swf");
                } catch (err) {
                    console.error("[Ruffle] giving up on main.swf:", err);
                    document.getElementById("player-container").innerHTML =
                        '<div style="color:#fff;font-family:Verdana;padding:24px;text-align:center">' +
                        'Le chargement de Frutiparc a échoué. Vérifie ta connexion puis ' +
                        '<a href="javascript:location.reload()" style="color:#ade76b">recharge la page</a>.' +
                        '</div>';
                    return;
                }

                // Some browsers / sessions hit a Ruffle-side WASM/worker
                // wedge that pins the loader bar around 9 % with no error
                // and no progress. We can't reliably detect or unwedge it
                // from JS — wrapping player.load() in a timeout + canvas
                // retry made it WORSE in practice. Instead, surface a
                // visible "Bloqué(e) à 9 % ? Actualise !" overlay so the
                // user can recover in one click.
                //
                // We deliberately DO NOT key the overlay's lifetime on
                // player.load() resolving: that promise resolves as soon
                // as Ruffle hands control to the SWF's own preloader
                // frame — which is exactly the moment the 9 % bar
                // appears, so removing the overlay there hides it the
                // instant the user needs it. Use a generous fixed
                // window instead (45 s after page load): long enough for
                // a stuck user to notice the freeze and click, short
                // enough that the overlay is gone by the time anyone is
                // actually playing.
                const refreshOverlay = document.createElement("div");
                refreshOverlay.style.cssText = [
                    "position:fixed",
                    "left:50%",
                    "bottom:18px",
                    "transform:translateX(-50%)",
                    "z-index:2147483647",
                    "background:rgba(0,0,0,0.78)",
                    "color:#fff",
                    "font-family:Verdana,sans-serif",
                    "font-size:12px",
                    "padding:10px 14px",
                    "border-radius:6px",
                    "box-shadow:0 2px 8px rgba(0,0,0,0.35)",
                    "display:flex",
                    "align-items:center",
                    "gap:10px",
                    "transition:opacity 0.35s ease",
                ].join(";");
                refreshOverlay.innerHTML =
                    '<span>Bloqué(e) à 9 % ? Actualise !</span>' +
                    '<button type="button" style="background:#ade76b;color:#1b2a08;border:none;border-radius:4px;padding:5px 10px;font:bold 11px Verdana,sans-serif;cursor:pointer">Actualiser</button>';
                refreshOverlay.querySelector("button").addEventListener("click", () => {
                    window.location.reload();
                });
                document.body.appendChild(refreshOverlay);
                // 15 s covers the typical wedge-detection window: the
                // 9 % bar freezes within a few seconds, so 15 is enough
                // for the user to notice + click while keeping the
                // "refresh" prompt from lingering once they're playing.
                setTimeout(() => {
                    refreshOverlay.style.opacity = "0";
                    setTimeout(() => refreshOverlay.remove(), 400);
                }, 15000);

                await player.load({
                    url: "/legacy/main.swf",
                    autoplay: "on",
                    allowScriptAccess: true,
                    quality: "high",
                    parameters: {
                        sid: sid,
                        domain: `${window.location.host}/./`,
                        s: s,
                        e: e
                    },
                    socketProxy: [
                        // FrutiChat (port % 1000 == 0 → chat cmdList).
                        { host: "localhost", port: 5000, proxyUrl: WS_ORIGIN },
                        { host: window.location.hostname, port: 5000, proxyUrl: WS_ORIGIN },
                        { host: "www.beta.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
                        { host: "www.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
                        // FrutiScore (port % 1000 == 1 → score cmdList).
                        // Uses /score path so Ruffle opens a separate WebSocket.
                        { host: "localhost", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: window.location.hostname, port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: "www.beta.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: "www.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        // Legacy port 2000 (kept for compatibility).
                        { host: "www.beta.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: "www.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: "localhost", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: window.location.hostname, port: 2000, proxyUrl: WS_ORIGIN }
                    ],
                    openUrlMode: "allow",
                    allowNetworking: "all",
                    base: `${window.location.origin}/`
                });
                // Auto-scroll for chat input is now handled inside main.swf
                // itself via an injected onEnterFrame handler in
                // scripts/patch-main-textinput-scroll.js. Synthetic
                // keyboard events from JS were rejected by Ruffle
                // (isTrusted=false), so the JS workaround that used to
                // live here is gone and the fix moved into the SWF.

                // ── Pause playback while the tab stays hidden ──
                // No point running the 30 fps AVM+render loop for a salon the
                // user can't see. We wait out a short grace so a quick glance
                // at another tab doesn't churn the chat socket — while paused
                // the client heartbeat stops, so a backgrounded tab relies on
                // the server/proxy not reaping an idle connection. Resume is
                // immediate on return.
                var HIDDEN_PAUSE_GRACE_MS = 20000;
                var __pauseTimer = null;
                function __setPlaying(on) {
                    try {
                        if (on && typeof player.play === "function") player.play();
                        else if (!on && typeof player.pause === "function") player.pause();
                    } catch (e) { window.__dlog("[Ruffle] play/pause failed:", e && e.message); }
                }
                document.addEventListener("visibilitychange", function () {
                    if (document.hidden) {
                        __pauseTimer = setTimeout(function () { __setPlaying(false); }, HIDDEN_PAUSE_GRACE_MS);
                    } else {
                        if (__pauseTimer) { clearTimeout(__pauseTimer); __pauseTimer = null; }
                        __setPlaying(true);
                    }
                });
            });
        })();
    </script>
</body>
</html>
