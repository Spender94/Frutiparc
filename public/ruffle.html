<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Frutiparc - Ruffle</title>
    <style>
        body {
            margin: 0;
            background: #ade76b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #player-container {
            width: 1920px;
            height: 1080px;
        }

        /* Floating shortcut bar for features Ruffle can't trigger via getURL */
        #fp-shortcuts {
            position: fixed;
            top: 6px;
            right: 10px;
            z-index: 100000;
            display: flex;
            gap: 6px;
        }
        #fp-shortcuts button {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 5px 14px;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
        }
        #fp-shortcuts .fp-btn-forum {
            background: #7ec43c;
        }
        #fp-shortcuts .fp-btn-forum:hover {
            background: #6cb22a;
        }
        #fp-shortcuts .fp-btn-forum.active {
            background: #E57568;
        }
    </style>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            fontSources: [
                `${window.location.origin}/legacy/fonts.swf`
            ],
            defaultFonts: {
                sans: ["Verdana", "verdana"],
                serif: ["Times New Roman", "TimesNewRoman"],
                typewriter: ["Verdana", "verdana"]
            }
        };
    </script>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="fp-shortcuts">
        <button class="fp-btn-forum" id="fp-forum-btn" onclick="toggleForum()">Forum</button>
    </div>
    <div id="player-container"></div>

    <script>
        // Intercept "javascript:" navigations from Ruffle's getURL() forwarding.
        // FPForumSlot.as fires getURL("javascript:fp_goURLResize(...)", "") with
        // an empty target — depending on Ruffle's version, the empty target can
        // route the call through window.open or through location.href.  Hooking
        // both sites makes sure fp_* helpers always run.
        (function () {
            function evalJsUrl(u) {
                try {
                    var code = decodeURIComponent(u.substring("javascript:".length));
                    console.log("[FP-hook] eval javascript: URL ->", code);
                    // eslint-disable-next-line no-eval
                    (0, eval)(code);
                } catch (e) {
                    console.error("[FP-hook] eval failed:", e, "url=", u);
                }
            }

            var _origOpen = window.open;
            window.open = function (url, target, features) {
                var u = String(url == null ? "" : url);
                if (u.indexOf("javascript:") === 0) {
                    evalJsUrl(u);
                    return null;
                }
                // Intercept logout navigation from Flash getURL
                if (u.indexOf("/light/logout") !== -1) {
                    console.log("[FP-hook] Intercepted logout, navigating:", u);
                    window.location.href = u;
                    return null;
                }
                return _origOpen.apply(window, arguments);
            };

            // Some Ruffle versions assign window.location.href = "javascript:..."
            // for empty-target getURL.  Modern browsers run the script natively,
            // but on hardened iframes (or with sandboxing) it can silently fail.
            // Override the setter as a belt-and-braces fallback.
            try {
                var locProto = Object.getPrototypeOf(window.location);
                var hrefDesc = Object.getOwnPropertyDescriptor(locProto, "href")
                    || Object.getOwnPropertyDescriptor(window.location, "href");
                if (hrefDesc && hrefDesc.set) {
                    var origHrefSet = hrefDesc.set;
                    Object.defineProperty(window.location, "href", {
                        configurable: true,
                        get: hrefDesc.get
                            ? hrefDesc.get.bind(window.location)
                            : function () { return location.toString(); },
                        set: function (v) {
                            var s = String(v == null ? "" : v);
                            if (s.indexOf("javascript:") === 0) {
                                evalJsUrl(s);
                                return;
                            }
                            origHrefSet.call(window.location, v);
                        }
                    });
                }
            } catch (e) {
                console.warn("[FP-hook] could not override location.href setter:", e);
            }
        })();

        // HTML Forum button — reliable fallback since Ruffle drops javascript: getURL.
        var _forumOpen = false;
        function toggleForum() {
            var sid = new URLSearchParams(window.location.search).get("sid") || "";
            var btn = document.getElementById("fp-forum-btn");
            if (_forumOpen) {
                // Close forum
                if (window.fp_closeFrame) window.fp_closeFrame(1);
                _forumOpen = false;
                if (btn) { btn.textContent = "Forum"; btn.classList.remove("active"); }
            } else {
                // Open forum
                if (window.fp_goURLResize) {
                    window.fp_goURLResize("/fb/?sid=" + encodeURIComponent(sid), 1);
                } else {
                    // fp_goURLResize not defined yet — open directly
                    var f = document.getElementById("fp-frame-1");
                    if (!f) {
                        f = document.createElement("iframe");
                        f.id = "fp-frame-1";
                        f.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:99001;background:#fff;display:none";
                        document.body.appendChild(f);
                        if (!window.__fpFrames) window.__fpFrames = {};
                        window.__fpFrames["1"] = f;
                    }
                    f.src = "/fb/?sid=" + encodeURIComponent(sid);
                    f.style.display = "block";
                }
                _forumOpen = true;
                if (btn) { btn.textContent = "Fermer Forum"; btn.classList.add("active"); }
            }
        }
        window.toggleForum = toggleForum;

        // Note: an auto-disconnect on beforeunload was disabled because it
        // races with popup-based game launch — some browsers/Ruffle paths
        // appear to fire beforeunload when the SWF triggers getURL, which
        // invalidates the session right before fp_goURLNewWin opens the
        // popup. Server-side session timeout handles stale sessions.

        // Also patch fp_closeFrame so the HTML button stays in sync
        // when the forum is closed from inside (via the "Fermer" button).
        var _origCloseFramePatched = false;
        function patchCloseFrame() {
            if (_origCloseFramePatched || !window.fp_closeFrame) return;
            var _origClose = window.fp_closeFrame;
            window.fp_closeFrame = function (mode) {
                _origClose(mode);
                if (Number(mode) === 1) {
                    _forumOpen = false;
                    var btn = document.getElementById("fp-forum-btn");
                    if (btn) { btn.textContent = "Forum"; btn.classList.remove("active"); }
                }
            };
            _origCloseFramePatched = true;
        }
        // Patch after the main IIFE defines fp_closeFrame
        window.addEventListener("DOMContentLoaded", function () {
            setTimeout(patchCloseFrame, 500);
        });

        (function () {
            const APP_ORIGIN = window.location.origin;
            const APP_HOST = window.location.host;
            const WS_ORIGIN = `${window.location.protocol === "https:" ? "wss" : "ws"}://${APP_HOST}`;
            const SWF_ORIGIN = `${APP_ORIGIN}/swf`;

            const domainMap = {
                "www.beta.frutiparc.com": APP_ORIGIN,
                "beta.frutiparc.com": APP_ORIGIN,
                "www.frutiparc.com": APP_ORIGIN,
                "www.frutiparc.net": APP_ORIGIN,
                "swf.beta.frutiparc.com": SWF_ORIGIN,
                "swf.frutiparc.com": SWF_ORIGIN,
                "localhost:5173": APP_ORIGIN,
                "localhost:5000": APP_ORIGIN
            };

            function rewriteLegacyUrl(rawUrl) {
                let url = String(rawUrl || "");
                if (!url) return url;

                if (
                    url.startsWith(APP_ORIGIN) &&
                    !url.startsWith(`${APP_ORIGIN}/`) &&
                    !url.startsWith(`${APP_ORIGIN}:`)
                ) {
                    url = url.replace(APP_ORIGIN, `${APP_ORIGIN}/`);
                }

                try {
                    const parsed = new URL(url, window.location.origin);
                    const host = parsed.hostname + (parsed.port ? ":" + parsed.port : "");

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (parsed.hostname === domain || host === domain) {
                            const path = parsed.pathname.startsWith("/") ? parsed.pathname : "/" + parsed.pathname;
                            return target + path + parsed.search;
                        }
                    }

                    if (parsed.origin === APP_ORIGIN) {
                        if (parsed.pathname.startsWith("/games/")) {
                            return APP_ORIGIN + "/swf" + parsed.pathname + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/betawww/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/betawww/", "/") + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/betaswf/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/betaswf/", "/swf/") + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/sw/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/sw/", "/swf/") + parsed.search;
                        }
                    }

                    return parsed.toString();
                } catch (e) {
                    return url;
                }
            }

            // Parse /do/ld XML and store game info for the standalone popup
            function parseDoLdResponse(text) {
                try {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(text, "text/xml");
                    var game = doc.querySelector("game");
                    if (game && !game.getAttribute("k")) {
                        var swfUrl = game.getAttribute("u") || "";
                        var gameName = game.getAttribute("n") || "";
                        var props = game.getAttribute("p") || "";
                        var parsedProps = {};
                        props.split(";").forEach(function (p) {
                            var parts = p.split("=");
                            if (parts[0]) parsedProps[parts[0]] = parts[1] || "";
                        });
                        window.__pendingGame = {
                            swf: swfUrl,
                            name: gameName,
                            width: parseInt(parsedProps.w) || 640,
                            height: parseInt(parsedProps.h) || 480
                        };
                        console.log("[FRUSION] Pending game:", JSON.stringify(window.__pendingGame));
                    }
                } catch (e) {
                    console.warn("[FRUSION] /do/ld parse error:", e);
                }
            }

            // --- Fetch interception (URL rewrite + /do/ld game info capture) ---
            const _origFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                const rawUrl =
                    typeof input === "string"
                        ? input
                        : (input && input.url ? input.url : String(input));

                const rewritten = rewriteLegacyUrl(rawUrl);
                console.log("[FETCH]", rawUrl, "->", rewritten);

                var isDoLd = false;
                try {
                    var u = new URL(rewritten, window.location.origin);
                    isDoLd = u.pathname === "/do/ld";
                } catch (e) {}

                if (isDoLd) {
                    var doFetch = input instanceof Request
                        ? _origFetch(new Request(rewritten, input), init)
                        : _origFetch(rewritten, init);
                    return doFetch.then(function (response) {
                        var cloned = response.clone();
                        cloned.text().then(function (text) {
                            console.log("[FRUSION] /do/ld fetch response:", text);
                            parseDoLdResponse(text);
                        });
                        return response;
                    });
                }

                if (input instanceof Request) {
                    return _origFetch(new Request(rewritten, input), init);
                }
                return _origFetch(rewritten, init);
            };

            // --- XHR interception (URL rewrite + /do/ld game info capture) ---
            const _origXHROpen = XMLHttpRequest.prototype.open;
            const _origXHRSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function (method, url) {
                this.__frusionUrl = url;
                var rewritten = rewriteLegacyUrl(url);
                var isDoLd = false;
                try {
                    var u = new URL(rewritten, window.location.origin);
                    isDoLd = u.pathname === "/do/ld";
                } catch (e) {}
                this.__frusionIsDoLd = isDoLd;
                console.log("[FRUSION XHR]", url, "->", rewritten);
                return _origXHROpen.call(this, method, rewritten, arguments[2], arguments[3], arguments[4]);
            };
            XMLHttpRequest.prototype.send = function (body) {
                if (this.__frusionIsDoLd) {
                    var xhr = this;
                    xhr.addEventListener("load", function () {
                        if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
                            console.log("[FRUSION] /do/ld XHR response:", xhr.responseText);
                            parseDoLdResponse(xhr.responseText);
                        }
                    });
                }
                return _origXHRSend.call(this, body);
            };

            // Mode-keyed iframe registry so different slots (forum=1, frusion=2)
            // each get their own overlay and never collide.  Mode 0 from
            // fp_resizeMe is a "hide everything" signal.
            window.__fpFrames = {};
            function ensureFrame(mode) {
                var key = String(Number(mode) || 1);
                var existing = window.__fpFrames[key];
                if (existing && document.body.contains(existing)) return existing;
                var iframe = document.createElement("iframe");
                iframe.id = "fp-frame-" + key;
                iframe.style.cssText = [
                    "position:fixed", "top:0", "left:0", "width:100%", "height:100%",
                    "border:none", "z-index:" + (99000 + Number(key)),
                    "background:#fff", "display:none"
                ].join(";");
                document.body.appendChild(iframe);
                window.__fpFrames[key] = iframe;
                return iframe;
            }

            window.fp_goURLResize = function (url, mode, w, h) {
                var rewritten = rewriteLegacyUrl(url);
                console.log("[FP] fp_goURLResize", url, "->", rewritten, "mode=", mode);
                var f = ensureFrame(mode);
                f.src = rewritten;
                f.style.display = "block";
                return true;
            };
            window.fp_resizeMe = function (mode) {
                var m = Number(mode);
                console.log("[FP] fp_resizeMe", mode);
                if (m === 0) {
                    Object.keys(window.__fpFrames).forEach(function (k) {
                        window.__fpFrames[k].style.display = "none";
                    });
                    return;
                }
                var f = ensureFrame(m);
                f.style.display = "block";
            };
            window.fp_closeFrame = function (mode) {
                var key = String(Number(mode) || 1);
                console.log("[FP] fp_closeFrame", mode);
                var f = window.__fpFrames[key];
                if (f) {
                    f.style.display = "none";
                    f.src = "about:blank";
                }
            };
            window.fp_activatePopupForum = function () {
                var f = ensureFrame(1);
                f.style.display = "block";
            };
            window.fp_closePopupForum = function () {
                var f = window.__fpFrames["1"];
                if (f) {
                    f.style.display = "none";
                    f.src = "about:blank";
                }
            };

            window.fp_goURLNewWin = function (url, mode, w, h) {
                const rewritten = rewriteLegacyUrl(url);
                console.log("[Frusion] fp_goURLNewWin", url, "->", rewritten);

                // Try to get game info from /do/ld interception first
                var game = window.__pendingGame;
                window.__pendingGame = null;

                // Fallback: extract game info from the URL params (e.g. /frusion?gameName=snake3&u=games/snake3/snake3.swf)
                if (!game) {
                    try {
                        var parsed = new URL(rewritten, window.location.origin);
                        var gameId = parsed.searchParams.get("u") || "";
                        var gameName = parsed.searchParams.get("gameName") || "";
                        if (gameId && gameId.endsWith(".swf")) {
                            game = {
                                swf: gameId,
                                name: gameName || gameId.split("/").pop().replace(".swf", ""),
                                width: w || 640,
                                height: h || 480
                            };
                            console.log("[Frusion] Extracted game info from URL:", JSON.stringify(game));
                        }
                    } catch (e) {}
                }

                // Open standalone game player (LocalConnection is broken in Ruffle)
                if (game) {
                    var sid = new URLSearchParams(window.location.search).get("sid") || "";
                    var popupUrl = "/game-popup.html"
                        + "?swf=" + encodeURIComponent(game.swf)
                        + "&width=" + game.width
                        + "&height=" + game.height
                        + "&game=" + encodeURIComponent(game.name)
                        + "&sid=" + encodeURIComponent(sid);
                    console.log("[Frusion] Opening standalone game:", popupUrl);
                    var gw = game.width + 32;
                    var gh = game.height + 32;
                    var feat = "width=" + gw + ",height=" + gh + ",resizable=yes,scrollbars=no,menubar=no,toolbar=no,location=no,status=no";
                    var win = window.open(popupUrl, "frutiparc_game", feat);
                    if (!win || win.closed) {
                        // Popup blocked or call returned null — fall back to a new tab.
                        console.warn("[Frusion] window.open returned null, falling back to _blank");
                        window.open(popupUrl, "_blank");
                    }
                    return true;
                }

                const features = `width=${w || 640},height=${h || 480},resizable=yes,scrollbars=no,menubar=no,toolbar=no,location=no,status=no`;
                var win2 = window.open(rewritten, "frutiparc_game", features);
                if (!win2 || win2.closed) {
                    console.warn("[Frusion] window.open returned null (no game info), falling back to _blank");
                    window.open(rewritten, "_blank");
                }
                return true;
            };

            window.fp_closePopupFrusion = function () {
                console.log("[Frusion] fp_closePopupFrusion");
                return true;
            };

            window.fp_openHisto = function (user) {
                const u = encodeURIComponent(String(user || ""));
                window.open(`/legacy?histo=${u}`, "_blank", "noopener,noreferrer");
                return true;
            };

            window.fp_openPopup = function (url, title, features) {
                const rewritten = rewriteLegacyUrl(url);
                console.log("[FP] fp_openPopup", url, "->", rewritten);
                window.open(rewritten, title || "frutiparc_popup", features || "width=700,height=500,resizable=yes,scrollbars=yes");
                return true;
            };

            function normalizeAvatarState(value) {
                let s = String(value || "").replace(/\D/g, "");

                if (s.length < 24) s = s.padEnd(24, "0");
                if (s.length > 24) s = s.slice(0, 24);

                const family = s.slice(0, 2);
                if (family !== "00" && family !== "01") {
                    s = "00" + s.slice(2);
                }

                return s;
            }

            function normalizeExpression(value) {
                const n = Number(value);
                if (!Number.isFinite(n)) return "0";
                return String(Math.max(0, Math.min(12, Math.floor(n))));
            }

            window.addEventListener("DOMContentLoaded", async () => {
                const urlParams = new URLSearchParams(window.location.search);

                const sid = urlParams.get("sid") || "";
                const s = normalizeAvatarState(urlParams.get("s") || "000000000000000000000000");
                const e = normalizeExpression(urlParams.get("e") || "0");

                console.log("[Ruffle] sid =", sid);
                console.log("[Ruffle] s   =", s);
                console.log("[Ruffle] e   =", e);

                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                player.style.width = "1024px";
                player.style.height = "768px";
                document.getElementById("player-container").appendChild(player);

                await player.load({
                    url: "/legacy/main.swf",
                    autoplay: "on",
                    allowScriptAccess: "always",
                    quality: "high",
                    parameters: {
                        sid: sid,
                        domain: `${window.location.host}/./`,
                        s: s,
                        e: e
                    },
                    socketProxy: [
                        // FrutiChat (port % 1000 == 0 → chat cmdList).
                        { host: "localhost", port: 5000, proxyUrl: WS_ORIGIN },
                        { host: window.location.hostname, port: 5000, proxyUrl: WS_ORIGIN },
                        { host: "www.beta.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
                        { host: "www.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
                        // FrutiScore (port % 1000 == 1 → score cmdList).
                        // Uses /score path so Ruffle opens a separate WebSocket.
                        { host: "localhost", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: window.location.hostname, port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: "www.beta.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: "www.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        // Legacy port 2000 (kept for compatibility).
                        { host: "www.beta.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: "www.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: "localhost", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: window.location.hostname, port: 2000, proxyUrl: WS_ORIGIN }
                    ],
                    openUrlMode: "allow",
                    allowNetworking: "all",
                    base: `${window.location.origin}/`
                });
            });
        })();
    </script>
</body>
</html>
