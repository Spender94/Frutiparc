<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Frutiparc - Ruffle</title>
    <style>
        body {
            margin: 0;
            background: #335511;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #player-container {
            width: 1024px;
            height: 768px;
        }
    </style>

    <script>
        (function() {
            const _origFetch = window.fetch;
            const APP_ORIGIN = window.location.origin;
            const APP_HOST = window.location.host;
            const WS_ORIGIN = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${APP_HOST}`;
            const SWF_ORIGIN = `${APP_ORIGIN}/swf`;

            const domainMap = {
                'www.beta.frutiparc.com': APP_ORIGIN,
                'www.frutiparc.com':      APP_ORIGIN,
                'swf.beta.frutiparc.com': SWF_ORIGIN,
                'swf.frutiparc.com':      SWF_ORIGIN,
                'localhost:5173':         APP_ORIGIN,
                'localhost:5000':         APP_ORIGIN,
            };

            function maybeAutoLaunchFrusion(requestUrl, responsePromise) {
                return Promise.resolve(responsePromise).then((resp) => {
                    try {
                        const isDoLd = /\/do\/ld(\?|$)/.test(requestUrl || '');
                        if (!isDoLd || window.__frusionAutoLaunchDone) return resp;
                        window.__frusionAutoLaunchDone = true;

                        resp.clone().text().then((xmlText) => {
                            const gameTag = xmlText.match(/<game[^>]*>/i);
                            if (!gameTag) return;
                            const tag = gameTag[0];
                            const firstSwfTag = xmlText.match(/<s[^>]*>/i);
                            const getAttr = (name) => {
                                const m = tag.match(new RegExp(name + '="([^"]*)"'));
                                return m ? m[1] : '';
                            };
                            const getSwfAttr = (name) => {
                                if (!firstSwfTag) return '';
                                const m = firstSwfTag[0].match(new RegExp(name + '="([^"]*)"'));
                                return m ? m[1] : '';
                            };
                            const sid = new URLSearchParams(window.location.search).get('sid') || '';
                            const target = new URL('/frusion', window.location.origin);
                            target.searchParams.set('sid', sid);
                            target.searchParams.set('disc_type', getAttr('t') || '0');
                            target.searchParams.set('gameName', getAttr('n') || 'kaluga');
                            target.searchParams.set('u', getAttr('u'));
                            target.searchParams.set('id', getSwfAttr('u') || getAttr('u'));
                            target.searchParams.set('size', getSwfAttr('s') || '0');
                            target.searchParams.set('width', (getAttr('p').match(/w=(\d+)/) || [,'700'])[1]);
                            target.searchParams.set('height', (getAttr('p').match(/h=(\d+)/) || [,'480'])[1]);
                            target.searchParams.set('w', (getAttr('p').match(/w=(\d+)/) || [,'700'])[1]);
                            target.searchParams.set('h', (getAttr('p').match(/h=(\d+)/) || [,'480'])[1]);
                            target.searchParams.set('mode', (getAttr('p').match(/m=([a-z])/i) || [,'i'])[1]);
                            console.log('[FRUSION autolaunch] ->', target.toString());
                            setTimeout(() => { window.location.href = target.toString(); }, 50);
                        }).catch(() => {});
                    } catch (e) {}
                    return resp;
                });
            }

            window.fetch = function(input, init) {
                let url = (typeof input === 'string')
                    ? input
                    : (input instanceof Request ? input.url : String(input));

                // Some legacy URL builders concatenate host + file without "/"
                // (e.g. http://localhost:8888animfrusion.swf). Fix it here.
                if (typeof url === 'string') {
                    if (url.startsWith(APP_ORIGIN) && !url.startsWith(`${APP_ORIGIN}/`) && !url.startsWith(`${APP_ORIGIN}:`)) {
                        url = url.replace(APP_ORIGIN, `${APP_ORIGIN}/`);
                    }
                }

                try {
                    const parsed = new URL(url);
                    const host = parsed.hostname + (parsed.port ? ':' + parsed.port : '');

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (host === domain || parsed.hostname === domain) {
                            const path = parsed.pathname.startsWith('/') ? parsed.pathname : ('/' + parsed.pathname);
                            const newUrl = target + path + parsed.search;
                            console.log('[FETCH rewrite]', url, '->', newUrl);
                            return maybeAutoLaunchFrusion(newUrl, _origFetch.call(this, newUrl, init));
                        }
                    }
                } catch (e) {}

                const prefixRewrites = [
                    ['/betawww/', '/'],
                    ['/betaswf/', '/swf/'],
                    ['/sw/', '/swf/'],
                ];

                try {
                    const parsed = new URL(url);
                    if (parsed.host === APP_HOST) {
                        for (const [prefix, replacement] of prefixRewrites) {
                            if (parsed.pathname.startsWith(prefix)) {
                                parsed.pathname = replacement + parsed.pathname.substring(prefix.length);
                                const newUrl = parsed.toString();
                                console.log('[FETCH prefix]', url, '->', newUrl);
                                return maybeAutoLaunchFrusion(newUrl, _origFetch.call(this, newUrl, init));
                            }
                        }
                    }
                } catch (e) {}

                console.log('[FETCH]', url);
                return maybeAutoLaunchFrusion(url, _origFetch.call(this, input, init));
            };

            const _origXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                let rewritten = url;

                if (typeof rewritten === 'string') {
                    if (rewritten.startsWith(APP_ORIGIN) && !rewritten.startsWith(`${APP_ORIGIN}/`) && !rewritten.startsWith(`${APP_ORIGIN}:`)) {
                        rewritten = rewritten.replace(APP_ORIGIN, `${APP_ORIGIN}/`);
                    }
                }

                try {
                    const parsed = new URL(rewritten, window.location.origin);
                    const host = parsed.hostname + (parsed.port ? ':' + parsed.port : '');

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (host === domain || parsed.hostname === domain) {
                            const path = parsed.pathname.startsWith('/') ? parsed.pathname : ('/' + parsed.pathname);
                            rewritten = target + path + parsed.search;
                            console.log('[XHR rewrite]', url, '->', rewritten);
                            break;
                        }
                    }
                } catch (e) {}

                return _origXHROpen.call(this, method, rewritten, ...rest);
            };
        })();
    </script>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player-container"></div>

    <script>
        // Disable legacy popup launch hook (keeps game launch in-place).
        window.fp_goURLResize = function(_url, _mode, _w, _h) {
            console.log("[Frusion] popup launch suppressed", _url);
            return true;
        };
        window.fp_openHisto = function(user) {
            const u = encodeURIComponent(String(user || ''));
            window.open(`/legacy?histo=${u}`, '_blank', 'noopener,noreferrer');
            return true;
        };

        function normalizeAvatarState(value) {
            let s = String(value || '').replace(/\D/g, '');

            if (s.length < 24) s = s.padEnd(24, '0');
            if (s.length > 24) s = s.slice(0, 24);

            const family = s.slice(0, 2);
            if (family !== '00' && family !== '01') {
                s = '00' + s.slice(2);
            }

            return s;
        }

        function normalizeExpression(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return '0';
            return String(Math.max(0, Math.min(12, Math.floor(n))));
        }

        window.addEventListener("DOMContentLoaded", async () => {
            const wsOrigin = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}`;
            const urlParams = new URLSearchParams(window.location.search);

            const sid = urlParams.get('sid') || '';
            const s = normalizeAvatarState(
                urlParams.get('s') || '000000000000000000000000'
            );
            const e = normalizeExpression(
                urlParams.get('e') || '0'
            );

            console.log('[Ruffle] sid =', sid);
            console.log('[Ruffle] s   =', s);
            console.log('[Ruffle] e   =', e);

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "1024px";
            player.style.height = "768px";
            document.getElementById("player-container").appendChild(player);

            await player.load({
                url: "/legacy/main.swf",
                autoplay: "on",
                allowScriptAccess: true,
                quality: "high",
                parameters: {
                    sid: sid,
                    // Keep a slash-stable suffix: some legacy concatenations
                    // drop one trailing slash before appending filenames.
                    domain: `${window.location.host}/./`,
                    s: s,
                    e: e
                },
                socketProxy: [
                    { host: "localhost", port: 5000, proxyUrl: wsOrigin },
                    { host: window.location.hostname, port: 5000, proxyUrl: wsOrigin },
                    // FrusionServer may connect to hardcoded legacy hosts for FrutiScore
                    { host: "www.beta.frutiparc.com", port: 5000, proxyUrl: wsOrigin },
                    { host: "www.frutiparc.com", port: 5000, proxyUrl: wsOrigin },
                    // Catch-all for any port (FrutiScore uses same port as FrutiChat)
                    { host: "www.beta.frutiparc.com", port: 2000, proxyUrl: wsOrigin },
                    { host: "www.frutiparc.com", port: 2000, proxyUrl: wsOrigin },
                    { host: "localhost", port: 2000, proxyUrl: wsOrigin },
                    { host: window.location.hostname, port: 2000, proxyUrl: wsOrigin }
                ],
                openUrlMode: "allow",
                allowNetworking: "all",
                base: `${window.location.origin}/`,
                // Load the legacy fonts.swf as an external font source.
                // This exposes the embedded Verdana + Times New Roman faces
                // (regular, bold, italic, bold italic) as device fonts so
                // Ruffle can render the chat with the intended typography.
                fontSources: [
                    `${window.location.origin}/legacy/fonts.swf`
                ],
                defaultFonts: {
                    sans: ["Verdana", "verdana"],
                    serif: ["Times New Roman", "TimesNewRoman"],
                    typewriter: ["Verdana", "verdana"]
                }
            });
        });
    </script>

</body>
</html>
