<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Frutiparc - Ruffle</title>
    <style>
        body {
            margin: 0;
            background: #ade76b;
            overflow: hidden;
        }

        #player-container {
            width: 1920px;
            height: 768px;
        }
    </style>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            fontSources: [
                `${window.location.origin}/legacy/fonts.swf`
            ],
            defaultFonts: {
                sans: ["Verdana", "verdana"],
                serif: ["Times New Roman", "TimesNewRoman"],
                typewriter: ["Verdana", "verdana"]
            },
            publicPath: "/ruffle/",
            scale: "noScale",
            salign: "TL",
            logLevel: "warn"
        };

        // Gate verbose legacy-bridge logs behind ?debug=1 to avoid CPU
        // pressure from console I/O during normal gameplay.
        window.__FRUSION_DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";
        window.__dlog = window.__FRUSION_DEBUG ? console.log.bind(console) : function () {};
    </script>

    <script src="/ruffle/ruffle.js" onerror="
        console.warn('[Ruffle] Local load failed, falling back to CDN');
        window.RufflePlayer.config.publicPath = undefined;
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/@ruffle-rs/ruffle';
        document.head.appendChild(s);
    "></script>
</head>
<body>
    <div id="player-container"></div>

    <script>
        (function () {
            const APP_ORIGIN = window.location.origin;
            const APP_HOST = window.location.host;
            const WS_ORIGIN = `${window.location.protocol === "https:" ? "wss" : "ws"}://${APP_HOST}`;
            const SWF_ORIGIN = `${APP_ORIGIN}/swf`;

            const domainMap = {
                "www.beta.frutiparc.com": APP_ORIGIN,
                "beta.frutiparc.com": APP_ORIGIN,
                "www.frutiparc.com": APP_ORIGIN,
                "www.frutiparc.net": APP_ORIGIN,
                "swf.beta.frutiparc.com": SWF_ORIGIN,
                "swf.frutiparc.com": SWF_ORIGIN,
                "localhost:5173": APP_ORIGIN,
                "localhost:5000": APP_ORIGIN
            };

            function rewriteLegacyUrl(rawUrl) {
                let url = String(rawUrl || "");
                if (!url) return url;

                if (
                    url.startsWith(APP_ORIGIN) &&
                    !url.startsWith(`${APP_ORIGIN}/`) &&
                    !url.startsWith(`${APP_ORIGIN}:`)
                ) {
                    url = url.replace(APP_ORIGIN, `${APP_ORIGIN}/`);
                }

                try {
                    const parsed = new URL(url, window.location.origin);
                    const host = parsed.hostname + (parsed.port ? ":" + parsed.port : "");

                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (parsed.hostname === domain || host === domain) {
                            const path = parsed.pathname.startsWith("/") ? parsed.pathname : "/" + parsed.pathname;
                            return target + path + parsed.search;
                        }
                    }

                    if (host === APP_HOST && parsed.origin !== APP_ORIGIN) {
                        return APP_ORIGIN + parsed.pathname + parsed.search;
                    }

                    if (parsed.origin === APP_ORIGIN) {
                        if (parsed.pathname.startsWith("/games/")) {
                            return APP_ORIGIN + "/swf" + parsed.pathname + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/betawww/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/betawww/", "/") + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/betaswf/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/betaswf/", "/swf/") + parsed.search;
                        }

                        if (parsed.pathname.startsWith("/sw/")) {
                            return APP_ORIGIN + parsed.pathname.replace("/sw/", "/swf/") + parsed.search;
                        }
                    }

                    return parsed.toString();
                } catch (e) {
                    return url;
                }
            }

            // Parse /do/ld XML and store game info for the standalone popup
            function parseDoLdResponse(text) {
                try {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(text, "text/xml");
                    var game = doc.querySelector("game");
                    if (game && !game.getAttribute("k")) {
                        var swfUrl = game.getAttribute("u") || "";
                        var gameName = game.getAttribute("n") || "";
                        var props = game.getAttribute("p") || "";
                        var parsedProps = {};
                        props.split(";").forEach(function (p) {
                            var parts = p.split("=");
                            if (parts[0]) parsedProps[parts[0]] = parts[1] || "";
                        });
                        window.__pendingGame = {
                            swf: swfUrl,
                            name: gameName,
                            width: parseInt(parsedProps.w) || 640,
                            height: parseInt(parsedProps.h) || 480,
                            swfWidth: parseInt(parsedProps.sw) || 0,
                            swfHeight: parseInt(parsedProps.sh) || 0
                        };
                        window.__dlog("[FRUSION] Pending game:", JSON.stringify(window.__pendingGame));
                    }
                } catch (e) {
                    console.warn("[FRUSION] /do/ld parse error:", e);
                }
            }

            // --- Fetch interception (URL rewrite + /do/ld game info capture) ---
            const _origFetch = window.fetch.bind(window);

            // Forward a Request to a rewritten URL without using
            // new Request(url, existingRequest), which can lose the POST body
            // on Firefox.  Instead, read the body (if any) and rebuild an init
            // object with explicit method / headers / credentials / body.
            function forwardReq(url, req, extraInit) {
                var method = req.method;
                var headers = new Headers(req.headers);
                var creds = req.credentials;
                if (method === "GET" || method === "HEAD") {
                    var fwd = { method: method, headers: headers, credentials: creds };
                    if (extraInit) for (var k in extraInit) fwd[k] = extraInit[k];
                    return _origFetch(url, fwd);
                }
                return req.arrayBuffer().then(function (buf) {
                    var fwd = {
                        method: method,
                        headers: headers,
                        credentials: creds,
                        body: buf
                    };
                    if (extraInit) for (var k in extraInit) fwd[k] = extraInit[k];
                    return _origFetch(url, fwd);
                });
            }

            window.fetch = function (input, init) {
                const rawUrl =
                    typeof input === "string"
                        ? input
                        : (input && input.url ? input.url : String(input));

                const rewritten = rewriteLegacyUrl(rawUrl);
                window.__dlog("[FETCH]", rawUrl, "->", rewritten);

                var isDoLd = false;
                try {
                    var u = new URL(rewritten, window.location.origin);
                    isDoLd = u.pathname === "/do/ld";
                } catch (e) {}

                if (isDoLd) {
                    var doFetch = input instanceof Request
                        ? forwardReq(rewritten, input, init)
                        : _origFetch(rewritten, init);
                    return doFetch.then(function (response) {
                        var cloned = response.clone();
                        cloned.text().then(function (text) {
                            window.__dlog("[FRUSION] /do/ld fetch response:", text);
                            parseDoLdResponse(text);
                        });
                        return response;
                    });
                }

                if (input instanceof Request) {
                    return forwardReq(rewritten, input, init);
                }
                return _origFetch(rewritten, init);
            };

            // --- XHR interception (URL rewrite + /do/ld game info capture) ---
            const _origXHROpen = XMLHttpRequest.prototype.open;
            const _origXHRSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function (method, url) {
                this.__frusionUrl = url;
                var rewritten = rewriteLegacyUrl(url);
                var isDoLd = false;
                try {
                    var u = new URL(rewritten, window.location.origin);
                    isDoLd = u.pathname === "/do/ld";
                } catch (e) {}
                this.__frusionIsDoLd = isDoLd;
                window.__dlog("[FRUSION XHR]", url, "->", rewritten);
                return _origXHROpen.call(this, method, rewritten, arguments[2], arguments[3], arguments[4]);
            };
            XMLHttpRequest.prototype.send = function (body) {
                if (this.__frusionIsDoLd) {
                    var xhr = this;
                    xhr.addEventListener("load", function () {
                        if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
                            window.__dlog("[FRUSION] /do/ld XHR response:", xhr.responseText);
                            parseDoLdResponse(xhr.responseText);
                        }
                    });
                }
                return _origXHRSend.call(this, body);
            };

            // ─── Forum popup (Flash desktop "Forum" icon) ───
            // FPForumSlot.as flow:
            //   init()        → fp_goURLResize('/fb/?sid=...', 1)  // stash URL
            //   onActivate()  → fp_activatePopupForum()            // open/focus popup
            //   close()       → fp_closePopupForum()               // close popup
            //
            // Note: `fp_goURLResize` is ONLY called by FPForumSlot — games use
            // `fp_goURLNewWin`, so this code path does not affect game launching.
            var __forumUrl = null;
            var __forumPopup = null;

            function buildForumUrl(rawUrl) {
                var sid = new URLSearchParams(window.location.search).get("sid") || "";
                if (rawUrl) {
                    var rewritten = rewriteLegacyUrl(rawUrl);
                    try {
                        var parsed = new URL(rewritten, window.location.origin);
                        if (!parsed.searchParams.get("sid") && sid) {
                            parsed.searchParams.set("sid", sid);
                        }
                        return parsed.toString();
                    } catch (e) {}
                    return rewritten;
                }
                return "/fb/?sid=" + encodeURIComponent(sid);
            }

            function openForumPopup() {
                var url = __forumUrl || buildForumUrl(null);
                if (__forumPopup && !__forumPopup.closed) {
                    try { __forumPopup.focus(); } catch (e) {}
                    return __forumPopup;
                }
                var feat = "width=860,height=640,resizable=yes,scrollbars=yes,menubar=no,toolbar=no,location=no,status=no";
                __forumPopup = window.open(url, "frutiparc_forum", feat);
                return __forumPopup;
            }

            window.fp_goURLResize = function (url, mode, w, h) {
                window.__dlog("[FP] fp_goURLResize", url, mode, w, h);
                __forumUrl = buildForumUrl(url);
                return true;
            };

            window.fp_activatePopupForum = function () {
                window.__dlog("[FP] fp_activatePopupForum");
                openForumPopup();
                return true;
            };

            window.fp_closePopupForum = function () {
                window.__dlog("[FP] fp_closePopupForum");
                if (__forumPopup && !__forumPopup.closed) {
                    try { __forumPopup.close(); } catch (e) {}
                }
                __forumPopup = null;
                return true;
            };

            // Stubs for iframe mode (cwm == "1") — not used here but called by Flash
            window.fp_resizeMe = function (mode) {
                window.__dlog("[FP] fp_resizeMe", mode);
                return true;
            };

            window.fp_closeFrame = function (id) {
                window.__dlog("[FP] fp_closeFrame", id);
                return true;
            };

            window.fp_goURLNewWin = function (url, mode, w, h) {
                const rewritten = rewriteLegacyUrl(url);
                window.__dlog("[Frusion] fp_goURLNewWin", url, "->", rewritten);

                // Try to get game info from /do/ld interception first
                var game = window.__pendingGame;
                window.__pendingGame = null;

                // Fallback: extract game info from the URL params (e.g. /frusion?gameName=snake3&u=games/snake3/snake3.swf)
                if (!game) {
                    try {
                        var parsed = new URL(rewritten, window.location.origin);
                        var gameId = parsed.searchParams.get("u") || "";
                        var gameName = parsed.searchParams.get("gameName") || "";
                        if (gameId && gameId.endsWith(".swf")) {
                            game = {
                                swf: gameId,
                                name: gameName || gameId.split("/").pop().replace(".swf", ""),
                                width: w || 640,
                                height: h || 480
                            };
                            window.__dlog("[Frusion] Extracted game info from URL:", JSON.stringify(game));
                        }
                    } catch (e) {}
                }

                // Open standalone game player (LocalConnection is broken in Ruffle)
                if (game) {
                    var sid = new URLSearchParams(window.location.search).get("sid") || "";
                    var popupUrl = "/game-popup.html"
                        + "?swf=" + encodeURIComponent(game.swf)
                        + "&width=" + game.width
                        + "&height=" + game.height
                        + "&game=" + encodeURIComponent(game.name)
                        + "&sid=" + encodeURIComponent(sid);
                    if (game.swfWidth)  popupUrl += "&sw=" + game.swfWidth;
                    if (game.swfHeight) popupUrl += "&sh=" + game.swfHeight;
                    window.__dlog("[Frusion] Opening standalone game:", popupUrl);
                    var gw = game.width + 32;
                    var gh = game.height + 32;
                    var feat = "width=" + gw + ",height=" + gh + ",resizable=yes,scrollbars=no,menubar=no,toolbar=no,location=no,status=no";
                    window.open(popupUrl, "frutiparc_game", feat);
                    return true;
                }

                const features = `width=${w || 640},height=${h || 480},resizable=yes,scrollbars=no,menubar=no,toolbar=no,location=no,status=no`;
                window.open(rewritten, "frutiparc_game", features);
                return true;
            };

            window.fp_closePopupFrusion = function () {
                window.__dlog("[Frusion] fp_closePopupFrusion");
                return true;
            };

            window.fp_openHisto = function (user) {
                const u = encodeURIComponent(String(user || ""));
                window.open(`/legacy?histo=${u}`, "_blank", "noopener,noreferrer");
                return true;
            };

            window.fp_openPopup = function (url, title, features) {
                const rewritten = rewriteLegacyUrl(url);
                window.__dlog("[FP] fp_openPopup", url, "->", rewritten);
                window.open(rewritten, title || "frutiparc_popup", features || "width=700,height=500,resizable=yes,scrollbars=yes");
                return true;
            };

            function normalizeAvatarState(value) {
                let s = String(value || "").replace(/\D/g, "");

                if (s.length < 24) s = s.padEnd(24, "0");
                if (s.length > 24) s = s.slice(0, 24);

                const family = s.slice(0, 2);
                if (family !== "00" && family !== "01") {
                    s = "00" + s.slice(2);
                }

                return s;
            }

            function normalizeExpression(value) {
                const n = Number(value);
                if (!Number.isFinite(n)) return "0";
                return String(Math.max(0, Math.min(12, Math.floor(n))));
            }

            window.addEventListener("DOMContentLoaded", async () => {
                const urlParams = new URLSearchParams(window.location.search);

                const sid = urlParams.get("sid") || "";
                // Fetch the user's saved bouille from the server so refreshes
                // never silently revert to the URL/default value.
                let savedBouille = "";
                try {
                    const r = await fetch("/api/me/bouille?sid=" + encodeURIComponent(sid));
                    if (r.ok) {
                        const data = await r.json();
                        if (data && data.fbouille) savedBouille = String(data.fbouille);
                    }
                } catch (err) {
                    console.warn("[Ruffle] bouille fetch failed:", err);
                }
                const s = normalizeAvatarState(savedBouille || urlParams.get("s") || "000000000000000000000000");
                const e = normalizeExpression(urlParams.get("e") || "0");

                window.__dlog("[Ruffle] sid =", sid);
                window.__dlog("[Ruffle] s   =", s);
                window.__dlog("[Ruffle] e   =", e);

                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                player.style.width = "1920px";
                player.style.height = "768px";
                document.getElementById("player-container").appendChild(player);

                await player.load({
                    url: "/legacy/main.swf",
                    autoplay: "on",
                    allowScriptAccess: true,
                    quality: "medium",
                    parameters: {
                        sid: sid,
                        domain: `${window.location.host}/./`,
                        s: s,
                        e: e
                    },
                    socketProxy: [
                        // FrutiChat (port % 1000 == 0 → chat cmdList).
                        { host: "localhost", port: 5000, proxyUrl: WS_ORIGIN },
                        { host: window.location.hostname, port: 5000, proxyUrl: WS_ORIGIN },
                        { host: "www.beta.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
                        { host: "www.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
                        // FrutiScore (port % 1000 == 1 → score cmdList).
                        // Uses /score path so Ruffle opens a separate WebSocket.
                        { host: "localhost", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: window.location.hostname, port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: "www.beta.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        { host: "www.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
                        // Legacy port 2000 (kept for compatibility).
                        { host: "www.beta.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: "www.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: "localhost", port: 2000, proxyUrl: WS_ORIGIN },
                        { host: window.location.hostname, port: 2000, proxyUrl: WS_ORIGIN }
                    ],
                    openUrlMode: "allow",
                    allowNetworking: "all",
                    base: `${window.location.origin}/`
                });
            });
        })();
    </script>
</body>
</html>
