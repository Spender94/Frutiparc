<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Frutiparc — Ruffle</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body { margin: 0; background: #335511; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #player-container { width: 1024px; height: 768px; }
    </style>
</head>
<body>
    <div id="player-container">
        <!--
            Use the <object> polyfill approach — Ruffle's polyfill
            intercepts this and emulates Flash.  This is more robust
            than the JS API for flashvars / loadMovie support.
        -->
        <object
            type="application/x-shockwave-flash"
            data="/legacy/main.swf"
            width="1024"
            height="768"
        >
            <param name="movie" value="/legacy/main.swf" />
            <param name="flashvars" value="sid=debug&domain=localhost:8888/" />
            <param name="quality" value="high" />
            <param name="allowScriptAccess" value="always" />
            <param name="allowNetworking" value="all" />
            <param name="base" value="/" />
        </object>
    </div>
</body>
</html>
