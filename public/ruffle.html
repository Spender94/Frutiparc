<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Frutiparc — Ruffle</title>
    <style>
        body { margin: 0; background: #335511; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #player-container { width: 1024px; height: 768px; }
        /* Ensure Ruffle's virtual-keyboard input is not hidden or blocked */
        ruffle-player {
            /* Remove any containment that might trap focus/input events */
            contain: none !important;
        }
    </style>

    <!-- Intercept fetch() BEFORE Ruffle loads so WASM picks up our override -->
    <script>
        (function() {
            const _origFetch = window.fetch;

            // Map original Frutiparc domains → local server paths
            const domainMap = {
                'www.beta.frutiparc.com': 'http://localhost:8888',
                'www.frutiparc.com':      'http://localhost:8888',
                'swf.beta.frutiparc.com': 'http://localhost:8888/swf',
                'swf.frutiparc.com':      'http://localhost:8888/swf',
                'localhost:5173':         'http://localhost:8888',     // SWF uses old CBee port for HTTP — redirect
                'localhost:5000':         'http://localhost:8888',     // SWF uses new CBee port for HTTP — redirect
            };

            window.fetch = function(input, init) {
                let url = (typeof input === 'string') ? input : (input instanceof Request ? input.url : String(input));

                // Rewrite frutiparc.com URLs to localhost
                try {
                    const parsed = new URL(url);
                    const host = parsed.hostname + (parsed.port ? ':' + parsed.port : '');
                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (host === domain || parsed.hostname === domain) {
                            const newUrl = target + parsed.pathname + parsed.search;
                            console.log('[FETCH rewrite]', url, '→', newUrl);
                            return _origFetch.call(this, newUrl, init);
                        }
                    }
                } catch(e) { /* not a valid absolute URL, pass through */ }

                // Also rewrite prefix-based URLs from SWF patching
                const prefixRewrites = [
                    ['/betawww/', '/'],
                    ['/betaswf/', '/swf/'],
                    ['/sw/', '/swf/'],
                ];
                try {
                    const parsed = new URL(url);
                    if (parsed.hostname === 'localhost') {
                        for (const [prefix, replacement] of prefixRewrites) {
                            if (parsed.pathname.startsWith(prefix)) {
                                parsed.pathname = replacement + parsed.pathname.substring(prefix.length);
                                const newUrl = parsed.toString();
                                console.log('[FETCH prefix]', url, '→', newUrl);
                                return _origFetch.call(this, newUrl, init);
                            }
                        }
                    }
                } catch(e) { /* pass through */ }

                console.log('[FETCH]', url);
                return _origFetch.call(this, input, init);
            };

            // Also intercept XMLHttpRequest (some Ruffle code paths may use it)
            const _origXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                let rewritten = url;
                try {
                    const parsed = new URL(url, window.location.origin);
                    const host = parsed.hostname + (parsed.port ? ':' + parsed.port : '');
                    for (const [domain, target] of Object.entries(domainMap)) {
                        if (host === domain || parsed.hostname === domain) {
                            rewritten = target + parsed.pathname + parsed.search;
                            console.log('[XHR rewrite]', url, '→', rewritten);
                            break;
                        }
                    }
                } catch(e) {}
                return _origXHROpen.call(this, method, rewritten, ...rest);
            };
        })();
    </script>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player-container"></div>
    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "1024px";
            player.style.height = "768px";
            document.getElementById("player-container").appendChild(player);

            await player.load({
                url: "/legacy/main.swf",
                autoplay: "on",
                allowScriptAccess: true,
                quality: "high",
                playerVersion: 8,
                wmode: "opaque",
                parameters: {
                    sid: "debug",
                    domain: "localhost:8888/"
                },
                socketProxy: [
                    { host: "localhost", port: 5000, proxyUrl: "ws://localhost:8888" }
                ],
                openUrlMode: "allow",
                allowNetworking: "all",
                base: "/"
            });

            // Ensure player gets focus on click (needed for keyboard input)
            player.addEventListener('click', () => {
                player.focus();
            });

            // ── Fix Ruffle virtual-keyboard aria-hidden issue ──
            // Ruffle adds aria-hidden to its virtual-keyboard input element which
            // blocks focus and prevents keyboard input in AVM1 text fields.
            // This MutationObserver removes it whenever Ruffle sets it.
            const observer = new MutationObserver((mutations) => {
                for (const mut of mutations) {
                    // Watch for added nodes (Ruffle creates the input lazily)
                    if (mut.type === 'childList') {
                        for (const node of mut.addedNodes) {
                            if (node.nodeType === 1) {
                                const inputs = node.querySelectorAll ? node.querySelectorAll('input#virtual-keyboard, input.virtual-keyboard') : [];
                                for (const inp of inputs) {
                                    inp.removeAttribute('aria-hidden');
                                }
                                if (node.id === 'virtual-keyboard' || node.classList?.contains('virtual-keyboard')) {
                                    node.removeAttribute('aria-hidden');
                                }
                            }
                        }
                    }
                    // Watch for attribute changes on the input itself
                    if (mut.type === 'attributes' && mut.attributeName === 'aria-hidden') {
                        mut.target.removeAttribute('aria-hidden');
                    }
                }
            });

            // Observe the player's shadow root if accessible, otherwise the player element
            const observeTarget = player.shadowRoot || player;
            observer.observe(observeTarget, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['aria-hidden']
            });

            // Also periodically check and fix (fallback for shadow DOM timing)
            setInterval(() => {
                const targets = [
                    ...document.querySelectorAll('input#virtual-keyboard, input.virtual-keyboard'),
                ];
                // Check inside shadow root
                if (player.shadowRoot) {
                    targets.push(...player.shadowRoot.querySelectorAll('input#virtual-keyboard, input.virtual-keyboard'));
                }
                for (const el of targets) {
                    if (el.hasAttribute('aria-hidden')) {
                        el.removeAttribute('aria-hidden');
                        console.log('[Ruffle fix] Removed aria-hidden from virtual-keyboard');
                    }
                }
            }, 500);
        });
    </script>
</body>
</html>
