<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Frutiparc Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ade76b;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #player-wrap {
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,.15);
      overflow: hidden;
      position: relative;
    }
    #player-wrap > * {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      publicPath: "/ruffle/",
      // logLevel was "info" — far too noisy for everyday play (the devtools
      // log pane was eating real CPU). Bump to "warn" by default; users who
      // need diagnostics can pass ?debug=1.
      logLevel: "warn",
      fontSources: [
        window.location.origin + "/legacy/fonts.swf"
      ],
      defaultFonts: {
        sans: ["Verdana", "verdana"],
        serif: ["Times New Roman", "TimesNewRoman"],
        typewriter: ["Verdana", "verdana"]
      }
    };

    // Gate verbose "[Game]" / "[FRUSION]" logs behind ?debug=1. With the
    // shim in place, idle gameplay no longer floods the JS console.
    window.__FRUSION_DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";
    window.__dlog = window.__FRUSION_DEBUG ? console.log.bind(console) : function () {};
  </script>
  <!-- ruffle.js is loaded dynamically from the main script AFTER the SharedObject
       seed runs. Ruffle snapshots localStorage into memory at engine init, so a
       static <script src> here would init (and snapshot) before we seed, and our
       injected save would be invisible to getLocal. See loadRuffleScript(). -->
</head>
<body>
  <div id="player-wrap"></div>
<script>
// Block legacy Frusion "burst disc" auto-close: some SWFs (MiniWave, etc.)
// call getURL("javascript:self.close()", "_self") on init or end-of-game,
// which Ruffle relays via window.location, closing the popup before the
// user can play. Override close() and intercept javascript: navigations.
(function() {
  var _close = window.close;
  window.close = function() {
    window.__dlog("[Game] window.close() blocked (use the X button)");
  };
  // Some Ruffle versions navigate via location.assign for getURL with target=_self.
  // Override location.assign / location.replace / href setter to block javascript:
  // URLs that would run self.close().
  try {
    var origAssign = window.location.assign.bind(window.location);
    var origReplace = window.location.replace.bind(window.location);
    window.location.assign = function(u) {
      if (/^javascript:.*close/i.test(String(u || ""))) {
        window.__dlog("[Game] javascript:self.close() navigation blocked:", u);
        return;
      }
      return origAssign(u);
    };
    window.location.replace = function(u) {
      if (/^javascript:.*close/i.test(String(u || ""))) {
        window.__dlog("[Game] javascript:self.close() navigation blocked:", u);
        return;
      }
      return origReplace(u);
    };
  } catch (e) { /* location may be readonly in some browsers */ }
})();

// Intercept getURL calls from patched game SWFs that save scores or slots.
// Ruffle routes getURL(url, target) through window.open when target is non-empty.
//
// Patterns we recognise:
//   "slot:GAME:SLOTID:PIPEDATA"                  → POST /api/saveFrutiSlot
//   "score:GAME:MODE:SCOREVAL[:DATA]"            → POST /api/saveScore
//   "s<score>"                                   → POST /api/saveScore (legacy)
//   "s<score>*<data>"                            → POST /api/saveScore (legacy w/ data)
(function() {
  var _open = window.open;
  function popupSid() {
    return new URLSearchParams(window.location.search).get("sid") || "";
  }
  function popupGame() {
    var swfPath = new URLSearchParams(window.location.search).get("swf") || "";
    var base = swfPath.substring(swfPath.lastIndexOf("/") + 1).replace(/\.swf$/, "");
    return base || (new URLSearchParams(window.location.search).get("game") || "");
  }
  function popupMode() {
    var qs = new URLSearchParams(window.location.search);
    return (qs.get("mode") === "challenge" || qs.get("c") === "2") ? 1 : 0;
  }
  function postSaveScore(game, mode, score, data) {
    var sid = popupSid();
    if (!sid) { window.__dlog("[Game] score save SKIPPED: no sid"); return; }
    var body = "sid=" + encodeURIComponent(sid) +
               "&game=" + encodeURIComponent(game) +
               "&m=" + encodeURIComponent(String(mode)) +
               "&score=" + encodeURIComponent(String(score)) +
               "&data=" + encodeURIComponent(data || "");
    window.__dlog("[Game] score save: game=" + game + " mode=" + mode + " score=" + score + " data=" + (data || ""));
    fetch("/api/saveScore", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    }).then(function(r) {
      window.__dlog("[Game] score save response:", r.status);
      return r.text();
    }).then(function(t) {
      window.__dlog("[Game] score save body:", t);
    }).catch(function(e) { window.__dlog("[Game] score save error:", e); });
  }
  window.open = function(url, target) {
    var u = String(url || "");
    // Diagnostic: log every window.open so we can tell if getURL2 from
    // patched SWFs (slot/score saves) is actually reaching the JS layer.
    window.__dlog("[Game] window.open:", u.length > 120 ? u.slice(0, 120) + "…" : u, "target=", target);
    // Block javascript:self.close() opened in a new window (defensive)
    if (/^javascript:.*close/i.test(u)) {
      window.__dlog("[Game] window.open(javascript:close) blocked");
      return null;
    }
    // Slot save via getURL: "slot:GAME:SLOTID:PIPEDATA"
    var slotMatch = u.match(/^slot:([\w]+):(\d+):(.+)/);
    if (slotMatch) {
      var slotGame = slotMatch[1];
      var slotNum = slotMatch[2];
      var slotPipe = slotMatch[3];
      window.__dlog("[Game] slot save intercepted: game=" + slotGame + " slot=" + slotNum + " data=" + slotPipe.length + " chars");
      var slotSid = popupSid();
      if (slotSid) {
        fetch("/api/saveFrutiSlot", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "sid=" + encodeURIComponent(slotSid) +
                "&game=" + encodeURIComponent(slotGame) +
                "&slotId=" + encodeURIComponent(slotNum) +
                "&data=" + encodeURIComponent(slotPipe)
        }).then(function(r) {
          window.__dlog("[Game] slot save response:", r.status);
          return r.text();
        }).then(function(t) {
          window.__dlog("[Game] slot save body:", t);
        }).catch(function(e) { window.__dlog("[Game] slot save error:", e); });
      }
      return null;
    }
    // Explicit score save: "score:GAME:MODE:SCORE[:DATA]"
    var scoreMatch = u.match(/^score:([\w]+):(\d+):(-?\d+)(?::(.*))?$/);
    if (scoreMatch) {
      postSaveScore(scoreMatch[1], Number(scoreMatch[2]) || 0, Number(scoreMatch[3]) || 0, scoreMatch[4] || "");
      return null;
    }
    // Legacy: "s<score>" or "s<score>*<data>"
    var legacyMatch = u.match(/^(?:.*\/)?s(\d+)(?:\*(.*))?$/);
    if (legacyMatch) {
      postSaveScore(popupGame(), popupMode(), Number(legacyMatch[1]) || 0, legacyMatch[2] || "");
      return null;
    }
    return _open.apply(window, arguments);
  };
})();

(async () => {
  const qs = new URLSearchParams(window.location.search);
  const APP_ORIGIN = window.location.origin;
  const APP_HOST = window.location.host;
  const WS_ORIGIN = (window.location.protocol === "https:" ? "wss" : "ws") + "://" + APP_HOST;

  // Game SWF path (e.g. /swf/games/kaluga/kaluga.swf)
  let swfPath = qs.get("swf") || "";
  if (!swfPath) {
    document.body.textContent = "Missing ?swf= parameter";
    return;
  }
  // Ensure absolute path
  if (!swfPath.startsWith("/")) swfPath = "/" + swfPath;
  if (!swfPath.startsWith("/swf/") && swfPath.startsWith("/games/")) {
    swfPath = "/swf" + swfPath;
  }

  let width  = parseInt(qs.get("width") || qs.get("w") || "640", 10) || 640;
  let height = parseInt(qs.get("height") || qs.get("h") || "480", 10) || 480;
  // Optional SWF natural stage size (e.g. MiniWave: visible 240x240 but SWF stage is 600x240
  // because the original Flash file leaves a debug log TextField permanently visible to the right
  // of the play area). When sw/sh differ from width/height, render the player at the SWF stage
  // size and let the wrap's overflow:hidden clip the non-game area.
  const swfWidth  = parseInt(qs.get("sw") || "0", 10) || width;
  const swfHeight = parseInt(qs.get("sh") || "0", 10) || height;

  // Debug mode: expand the wrap to the full SWF stage so internal _root.test logs are visible.
  if (qs.get("debug") === "1") {
    width = swfWidth;
    height = swfHeight;
    window.__dlog("[Game] Debug mode ON: showing full SWF stage", swfWidth + "x" + swfHeight);
  }

  // Challenge mode: set server-side flag so scores route to _challenge rankings
  const isChallenge = qs.get("mode") === "challenge" || qs.get("c") === "2";
  const popupSid = qs.get("sid") || "";
  if (popupSid) {
    fetch("/api/setChallengeMode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: popupSid, challenge: isChallenge })
    }).catch(function() {});
  }

  const wrap = document.getElementById("player-wrap");
  wrap.style.width  = width + "px";
  wrap.style.height = height + "px";

  document.title = "Frutiparc - " + (qs.get("game") || "Game");

  // Derive game's internal SWF name for slot persistence (e.g., "miniwave" from ".../miniwave.swf")
  var gameSwfName = swfPath.substring(swfPath.lastIndexOf("/") + 1).replace(/\.swf$/, "");

  // Poll the server for eject events. The Frusion console SWF in the
  // parent tab signals "disc ejected" by moving the disc back to
  // disccollector (server logs [FF/MV] folder=disccollector); the server
  // marks the eject in recentlyEjected and we close ourselves on the next
  // poll. Required because Ruffle's WASM networking bypasses window.fetch
  // and XMLHttpRequest wrappers in the parent tab, so we can't catch the
  // eject signal there.
  (function pollEjectStatus() {
    var sidArg = new URLSearchParams(window.location.search).get("sid") || "";
    var gameArg = new URLSearchParams(window.location.search).get("game") || gameSwfName;
    if (!sidArg || !gameArg) return;
    setInterval(function () {
      fetch("/api/check-ejected?sid=" + encodeURIComponent(sidArg)
            + "&game=" + encodeURIComponent(gameArg))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ejected) {
            window.__dlog("[Game] disc ejected by parent — closing popup");
            try { window.close(); } catch (e) {}
          }
        })
        .catch(function () {});
    }, 1500);
  })();

  // ExternalInterface callback: JSON parser for game SWFs that call client.fromJSON().
  // motionball.swf (mb2) is patched to call ExternalInterface.call("parseJSON", str)
  // via mb2.Client.prototype.fromJSON, so the menu can read slot0 ($challenge/$classic/...).
  window.parseJSON = function(str) {
    var len = (str == null) ? -1 : String(str).length;
    // Diagnostic logs use console.log directly (not __dlog) so they're
    // visible without ?debug=1 — narrowly scoped to parseJSON because
    // the slot0 → Cm.card pipeline is the #1 source of "import looked
    // fine but the game launched empty" reports.
    console.log("[parseJSON] CALLED — input length=" + len + " type=" + typeof str);
    if (str == null || len === 0) {
      console.log("[parseJSON] NULL/EMPTY input → returning null");
      return null;
    }
    try {
      var parsed = JSON.parse(str);
      var summary = "type=" + typeof parsed;
      if (parsed && typeof parsed === "object") {
        var keys = Object.keys(parsed);
        summary += " keys=" + keys.length + " [" + keys.slice(0, 8).join(",") + "]";
        if (Array.isArray(parsed.$faerie)) summary += " $faerie.length=" + parsed.$faerie.length;
        if (parsed.$pond && parsed.$pond.$fs) summary += " pond.fs=" + parsed.$pond.$fs.$name;
      }
      console.log("[parseJSON] OK — " + summary);
      return parsed;
    } catch(e) {
      console.log("[parseJSON] error:", e, "input head=", String(str).slice(0, 200));
      return null;
    }
  };

  // ExternalInterface callback for SWF save — receives AS2 objects auto-serialized to JS
  window.saveSlotData = function(game, slotId, data) {
    window.__dlog("[Game] saveSlotData CALLED game=" + game + " slot=" + slotId + " dataType=" + typeof data);
    var sid = new URLSearchParams(window.location.search).get("sid") || "";
    if (!sid) { window.__dlog("[Game] saveSlotData SKIPPED: no sid"); return; }
    var jsonData;
    // MiniWave: Ruffle's EI can't serialize AS2 objects (they arrive as null).
    // The patched SWF sends a pipe-delimited string of primitives instead.
    // Format: ship|badsKill|arcadeBestLevel|consBonus|consLetter|shop|vs
    if (game === "miniwave" && typeof data === "string" && data.indexOf("|") >= 0) {
      try {
        var parts = data.split("|");
        var obj = {
          "$ship": parts[0] ? parts[0].split(",").map(function(v) { return v === "true" || Number(v) > 0; }) : [],
          "$badsKill": parts[1] ? parts[1].split(",").map(Number) : [],
          "$arcade": { "$bestLevel": Number(parts[2]) || 0 },
          "$cons": {
            "$bonus": parts[3] ? parts[3].split(",").map(Number) : [],
            "$letter": Number(parts[4]) || 0
          },
          "$shop": parts[5] ? parts[5].split(",").map(Number) : [],
          "$vs": Number(parts[6]) || 0
        };
        jsonData = JSON.stringify(obj);
        window.__dlog("[Game] miniwave pipe-parsed → " + jsonData.length + " chars");
      } catch(e) {
        window.__dlog("[Game] miniwave pipe parse FAILED:", e);
        return;
      }
    } else if ((game === "minipixiz" || game === "minitroll") && typeof data === "string" && data.indexOf("|") >= 0) {
      // MiniPixiz: same approach — pipe-delimited string, server converts via parseMinipixizPipe
      jsonData = data;
      window.__dlog("[Game] minipixiz pipe → " + data.length + " chars");
    } else {
      try { jsonData = JSON.stringify(data); } catch(e) {
        window.__dlog("[Game] saveSlotData JSON.stringify FAILED:", e);
        return;
      }
    }
    window.__dlog("[Game] saveSlot " + game + "/slot" + slotId + " (" + jsonData.length + " chars)");
    fetch("/api/saveFrutiSlot", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "sid=" + encodeURIComponent(sid) +
            "&game=" + encodeURIComponent(game) +
            "&slotId=" + encodeURIComponent(String(slotId)) +
            "&data=" + encodeURIComponent(jsonData)
    }).then(function(r) {
      window.__dlog("[Game] saveSlot response:", r.status);
    }).catch(function(e) { window.__dlog("[Game] saveSlot error:", e); });
  };

  // Derive base URL from SWF path so relative loads resolve
  // to the game's own directory instead of the site root.
  var swfDir = swfPath.substring(0, swfPath.lastIndexOf("/") + 1);

  // Try full.swf first — it has all libs pre-merged (MovieClipLoader is broken
  // in Ruffle, so the base SWF alone can't load its lib/*.swf dependencies).
  var fullSwfPath = swfDir + "full.swf";
  try {
    var headResp = await fetch(fullSwfPath, { method: "HEAD" });
    if (headResp.ok) {
      window.__dlog("[Game] Found full.swf, using it instead of", swfPath);
      swfPath = fullSwfPath;
    }
  } catch (e) {
    window.__dlog("[Game] No full.swf available, using original SWF");
  }

  // ── Seed Ruffle's SharedObject from server data ──
  // The native game loads its slot as a NATIVE AS2 object graph from
  // SharedObject.getLocal("miniPixiz/card").data.fruticard[0] (AMF0), NOT by
  // parsing JSON. ExternalInterface.call returns undefined in this Ruffle (EI
  // is dead for AS2 SWFs here), so the SWF cannot parse the server's JSON
  // itself. Instead we encode the server's card into the EXACT .sol/AMF0 byte
  // format the game itself writes, and drop it into localStorage under Ruffle's
  // SharedObject key BEFORE the SWF starts. The native onServiceConnect then
  // reads it like any locally-saved game. Verified byte-for-byte against a real
  // Ruffle-written SharedObject dump.

  // Per-game SharedObject config: `name` = full path passed to getLocal()
  // (also the localStorage key suffix), `base` = the .sol internal name (last
  // path segment), `fields` = the data propert(ies) holding the slots array.
  // NOTE: the native minipixiz load reads `SharedObject.data["]D,mH("]` — a
  // MINIFIED field name (verified by disassembly + a Ruffle-written SOL dump),
  // NOT "fruticard". Seed exactly that one field so the SOL is byte-identical
  // to what the game itself writes.
  var SHARED_OBJECT_GAMES = {
    minipixiz: { name: "miniPixiz/card", base: "card", fields: ["]D,mH("] }
  };

  function amfRawStr(s, out) { var b = Array.from(new TextEncoder().encode(s)); out.push((b.length >> 8) & 0xff, b.length & 0xff); for (var i = 0; i < b.length; i++) out.push(b[i]); }
  function amfPushU32(n, out) { out.push((n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff); }
  function amf0Encode(v, out) {
    if (v === null) { out.push(0x05); return; }
    if (v === undefined) { out.push(0x06); return; }
    var t = typeof v;
    if (t === "number") { out.push(0x00); var b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, v, false); for (var i = 0; i < 8; i++) out.push(b[i]); return; }
    if (t === "boolean") { out.push(0x01, v ? 1 : 0); return; }
    if (t === "string") { out.push(0x02); amfRawStr(v, out); return; }
    if (Array.isArray(v)) { out.push(0x08); amfPushU32(v.length, out); for (var i = 0; i < v.length; i++) { amfRawStr(String(i), out); amf0Encode(v[i], out); } out.push(0, 0, 9); return; }
    if (t === "object") { out.push(0x03); for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) { amfRawStr(k, out); amf0Encode(v[k], out); } out.push(0, 0, 9); return; }
    out.push(0x06);
  }
  function buildSol(name, data) {
    var body = [];
    Array.from(new TextEncoder().encode("TCSO")).forEach(function (x) { body.push(x); });
    [0x00, 0x04, 0x00, 0x00, 0x00, 0x00].forEach(function (x) { body.push(x); });
    amfRawStr(name, body);
    [0, 0, 0, 0].forEach(function (x) { body.push(x); });
    // LSO format: each root-level property is terminated by a trailing 0x00.
    // Ruffle's parser is strict — omitting it makes the SOL 1 byte short and
    // Ruffle rejects the whole SharedObject (verified: with the 0x00 our bytes
    // are identical to a Ruffle-written SOL for the same data).
    for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) { amfRawStr(k, body); amf0Encode(data[k], body); body.push(0x00); }
    var head = [0x00, 0xBF]; amfPushU32(body.length, head);
    return head.concat(body);
  }
  function bytesToB64(arr) { var s = ""; for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]); return btoa(s); }

  async function seedSharedObjectFromServer(game, swfLoadPath, sid) {
    var cfg = SHARED_OBJECT_GAMES[game];
    if (!cfg || !sid) return;
    try {
      var resp = await fetch("/api/loadFrutiSlots?sid=" + encodeURIComponent(sid) + "&game=" + encodeURIComponent(game), { method: "POST" });
      if (!resp.ok) { window.__dlog("[Seed] loadFrutiSlots HTTP " + resp.status); return; }
      var params = new URLSearchParams(await resp.text());
      var slot0 = params.get("slot0");
      if (!slot0 || slot0 === "null") { window.__dlog("[Seed] no slot0 — leaving SharedObject untouched"); return; }
      var card = JSON.parse(slot0);
      var data = {}; cfg.fields.forEach(function (f) { data[f] = [card]; });
      var b64 = bytesToB64(buildSol(cfg.base, data));
      var key = window.location.host + swfLoadPath + "/#" + cfg.name;
      localStorage.setItem(key, b64);
      // console.log (not __dlog) so the seed result is visible without ?debug=1
      // during rollout — this is the load path users most often report broken.
      console.log("[Seed] OK " + key + " — " + b64.length + " b64 chars, $faerie=" + (Array.isArray(card.$faerie) ? card.$faerie.length : "?") + " $treeMax=" + (card.$stat && card.$stat.$treeMax));
    } catch (e) {
      console.log("[Seed] FAILED: " + (e && e.message ? e.message : e));
    }
  }

  // Dynamically load the Ruffle engine (with the same local→CDN fallback the
  // old static <script> tag used). Called only AFTER the seed so Ruffle's
  // localStorage snapshot includes our injected SharedObject. Resolves once
  // window.RufflePlayer.newest is actually callable (the polyfill can install
  // a tick after the script's onload fires).
  function loadRuffleScript() {
    function ready() { return window.RufflePlayer && typeof window.RufflePlayer.newest === "function"; }
    function waitReady(resolve) {
      if (ready()) { resolve(); return; }
      var tries = 0;
      var iv = setInterval(function () {
        if (ready() || ++tries > 150) { clearInterval(iv); resolve(); }
      }, 20);
    }
    return new Promise(function (resolve) {
      if (ready()) { resolve(); return; }
      var s = document.createElement("script");
      s.src = "/ruffle/ruffle.js";
      s.onload = function () { waitReady(resolve); };
      s.onerror = function () {
        console.warn("[Ruffle] Local load failed, falling back to CDN");
        window.RufflePlayer.config.publicPath = undefined;
        var c = document.createElement("script");
        c.src = "https://unpkg.com/@ruffle-rs/ruffle";
        c.onload = function () { waitReady(resolve); };
        c.onerror = function () { resolve(); };
        document.head.appendChild(c);
      };
      document.head.appendChild(s);
    });
  }

  if (qs.get("noseed") !== "1") {
    await seedSharedObjectFromServer(qs.get("game") || "", swfPath, qs.get("sid") || "");
  } else {
    console.log("[Seed] SKIPPED (noseed=1)");
  }

  // Load the Ruffle engine NOW — strictly after the SharedObject seed. Ruffle's
  // localStorage backend snapshots storage into memory at engine init; loading
  // ruffle.js before the seed (e.g. via a static <script src>) meant getLocal()
  // served the pre-seed snapshot and never saw our injected save.
  await loadRuffleScript();

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.width  = swfWidth + "px";
  player.style.height = swfHeight + "px";
  wrap.appendChild(player);

  // Load the game SWF directly (standalone mode, no Frusion wrapper).
  // We still provide socketProxy + domain so that calls to super.serviceConnect()
  // (triggered e.g. by SnakeClient before the STANDALONE branch) don't crash
  // when the game tries to set up its XMLSocket against the CBee server.
  // Append cache-buster: ensures patched SWFs are fetched fresh after a deploy.
  var loadUrl = swfPath + (swfPath.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
  await player.load({
    url: loadUrl,
    autoplay: "on",
    allowScriptAccess: true,
    allowNetworking: "all",
    openUrlMode: "allow",
    quality: "medium",
    letterbox: "off",
    base: APP_ORIGIN + swfDir,
    socketProxy: [
      { host: "localhost", port: 5000, proxyUrl: WS_ORIGIN },
      { host: window.location.hostname, port: 5000, proxyUrl: WS_ORIGIN },
