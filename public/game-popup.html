<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Frutiparc Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on"
    };
  </script>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player"></div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const wsOrigin = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}`;

      const sid = params.get("sid") || "debug";
      const game = params.get("game") || "kaluga";
      const swf = params.get("swf") || "/swf/games/kaluga/kaluga.swf";
      const width = params.get("width") || params.get("w") || "640";
      const height = params.get("height") || params.get("h") || "480";
      const mode = params.get("mode") || "i";

      const playerHost = document.getElementById("player");
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      playerHost.appendChild(player);

      await player.load({
        url: "/frusion_client.swf",
        autoplay: "on",
        allowScriptAccess: true,
        allowNetworking: "all",
        openUrlMode: "allow",
        quality: "high",
        base: `${window.location.origin}/`,
        socketProxy: [
          { host: "localhost", port: 5000, proxyUrl: wsOrigin },
          { host: window.location.hostname, port: 5000, proxyUrl: wsOrigin },
          { host: "www.beta.frutiparc.com", port: 5000, proxyUrl: wsOrigin },
          { host: "www.frutiparc.com", port: 5000, proxyUrl: wsOrigin }
        ],
        parameters: {
          sid: sid,
          domain: `${window.location.host}/./`,
          gameName: game,
          swf: swf,
          u: swf.replace(/^\/swf\//, ""),
          id: swf.replace(/^\/swf\//, ""),
          width: width,
          height: height,
          w: width,
          h: height,
          mode: mode
        }
      });
    })();
  </script>
</body>
</html>
