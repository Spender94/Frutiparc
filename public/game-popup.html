<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Frutiparc Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on"
    };
  </script>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player"></div>

 <script>
(async () => {
  const qs = new URLSearchParams(window.location.search);
  const flashvars = Object.fromEntries(qs.entries());

  const container = document.getElementById("player");
  const ruffle = window.RufflePlayer?.newest();
  if (!ruffle) throw new Error("Ruffle not loaded");

  const player = ruffle.createPlayer();
  player.style.width = (qs.get("width") || "640") + "px";
  player.style.height = (qs.get("height") || "480") + "px";
  container.appendChild(player);

  await player.load({
    url: "/frusion_client.swf?" + qs.toString(),
    parameters: flashvars,
    autoplay: "on",
    unmuteOverlay: "hidden"
  });
})();
</script>
</body>
</html>
