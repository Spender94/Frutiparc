<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <title>Frutiparc Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ade76b;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* La scène et l'éventuel panneau latéral vivent dans une rangée : c'est ELLE
       que la loupe met à l'échelle, pour que le panneau suive le zoom et reste
       collé au jeu. Sans panneau, la rangée épouse exactement #player-wrap. */
    #stage-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      transform-origin: center center;
      transition: transform .12s ease-out;
    }
    #player-wrap {
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,.15);
      overflow: hidden;
      position: relative;
      flex: 0 0 auto;
    }
    #player-wrap > * {
      position: absolute;
      left: 0;
      top: 0;
    }
    #zoom-bar {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 99999;
      display: flex;
      gap: 4px;
      align-items: center;
      font: 12px Verdana, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      padding: 4px 6px;
      border-radius: 6px;
      user-select: none;
      opacity: .35;
      transition: opacity .15s;
    }
    #zoom-bar:hover { opacity: 1; }
    #zoom-bar button {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 4px;
      background: #ade76b;
      color: #14320a;
      font: bold 14px Verdana, sans-serif;
      line-height: 1;
      cursor: pointer;
    }
    #zoom-bar button:hover { background: #c4f08a; }
    #zoom-bar .z-label {
      min-width: 40px;
      text-align: center;
      cursor: default;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      publicPath: "/ruffle/",
      // logLevel was "info" then "warn" — still noisy for everyday play (the
      // AVM's WARN spam costs CPU to format + ship to the console). Default
      // "error"; users who need diagnostics can pass ?debug=1.
      logLevel: "error",
      fontSources: [
        window.location.origin + "/legacy/fonts.swf"
      ],
      defaultFonts: {
        sans: ["Verdana", "verdana"],
        serif: ["Times New Roman", "TimesNewRoman"],
        typewriter: ["Verdana", "verdana"]
      }
    };

    // Gate verbose "[Game]" / "[FRUSION]" logs behind ?debug=1. With the
    // shim in place, idle gameplay no longer floods the JS console.
    window.__FRUSION_DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";
    window.__dlog = window.__FRUSION_DEBUG ? console.log.bind(console) : function () {};
  </script>
  <!-- ruffle.js is loaded dynamically from the main script AFTER the SharedObject
       seed runs. Ruffle snapshots localStorage into memory at engine init, so a
       static <script src> here would init (and snapshot) before we seed, and our
       injected save would be invisible to getLocal. See loadRuffleScript(). -->
</head>
<body>
  <div id="stage-row"><div id="player-wrap"></div></div>
<script>
// Block legacy Frusion "burst disc" auto-close: some SWFs (MiniWave, etc.)
// call getURL("javascript:self.close()", "_self") on init or end-of-game,
// which Ruffle relays via window.location, closing the popup before the
// user can play. Override close() and intercept javascript: navigations.
(function() {
  var _close = window.close;
  window.close = function() {
    window.__dlog("[Game] window.close() blocked (use the X button)");
  };
  // Some Ruffle versions navigate via location.assign for getURL with target=_self.
  // Override location.assign / location.replace / href setter to block javascript:
  // URLs that would run self.close().
  try {
    var origAssign = window.location.assign.bind(window.location);
    var origReplace = window.location.replace.bind(window.location);
    window.location.assign = function(u) {
      if (/^javascript:.*close/i.test(String(u || ""))) {
        window.__dlog("[Game] javascript:self.close() navigation blocked:", u);
        return;
      }
      return origAssign(u);
    };
    window.location.replace = function(u) {
      if (/^javascript:.*close/i.test(String(u || ""))) {
        window.__dlog("[Game] javascript:self.close() navigation blocked:", u);
        return;
      }
      return origReplace(u);
    };
  } catch (e) { /* location may be readonly in some browsers */ }
})();

// Intercept getURL calls from patched game SWFs that save scores or slots.
// Ruffle routes getURL(url, target) through window.open when target is non-empty.
//
// Patterns we recognise:
//   "slot:GAME:SLOTID:PIPEDATA"                  → POST /api/saveFrutiSlot
//   "score:GAME:MODE:SCOREVAL[:DATA]"            → POST /api/saveScore
//   "s<score>"                                   → POST /api/saveScore (legacy)
//   "s<score>*<data>"                            → POST /api/saveScore (legacy w/ data)
(function() {
  var _open = window.open;
  function popupSid() {
    return new URLSearchParams(window.location.search).get("sid") || "";
  }
  function popupGame() {
    var swfPath = new URLSearchParams(window.location.search).get("swf") || "";
    var base = swfPath.substring(swfPath.lastIndexOf("/") + 1).replace(/\.swf$/, "");
    return base || (new URLSearchParams(window.location.search).get("game") || "");
  }
  function popupMode() {
    var qs = new URLSearchParams(window.location.search);
    return (qs.get("mode") === "challenge" || qs.get("c") === "2") ? 1 : 0;
  }
  function postSaveScore(game, mode, score, data) {
    var sid = popupSid();
    if (!sid) { window.__dlog("[Game] score save SKIPPED: no sid"); return; }
    var body = "sid=" + encodeURIComponent(sid) +
               "&game=" + encodeURIComponent(game) +
               "&m=" + encodeURIComponent(String(mode)) +
               "&score=" + encodeURIComponent(String(score)) +
               "&data=" + encodeURIComponent(data || "");
    window.__dlog("[Game] score save: game=" + game + " mode=" + mode + " score=" + score + " data=" + (data || ""));
    fetch("/api/saveScore", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    }).then(function(r) {
      window.__dlog("[Game] score save response:", r.status);
      return r.text();
    }).then(function(t) {
      window.__dlog("[Game] score save body:", t);
    }).catch(function(e) { window.__dlog("[Game] score save error:", e); });
  }
  window.open = function(url, target) {
    var u = String(url || "");
    // Diagnostic: log every window.open so we can tell if getURL2 from
    // patched SWFs (slot/score saves) is actually reaching the JS layer.
    window.__dlog("[Game] window.open:", u.length > 120 ? u.slice(0, 120) + "…" : u, "target=", target);
    // Block javascript:self.close() opened in a new window (defensive)
    if (/^javascript:.*close/i.test(u)) {
      window.__dlog("[Game] window.open(javascript:close) blocked");
      return null;
    }
    // Compteur de coups Swapou : le SWF patché appelle
    // getURL("fpswcoup:<n>", "_fpswcoup") à chaque échange. On récupère la valeur
    // et on renvoie null : aucune fenêtre ne s'ouvre. C'est le MÊME canal que les
    // sauvegardes de slot/score ci-dessous, éprouvé et disponible dès Flash 4 —
    // d'où l'absence de tout changement de version du SWF.
    var coupMatch = u.match(/^fpswcoup:(-?\d+):(-?\d+)/);
    if (coupMatch) {
      if (typeof window.fpSwapouCoup === "function")
        window.fpSwapouCoup(Number(coupMatch[1]), Number(coupMatch[2]));
      return null;
    }
    // Fin de partie Swapou : émis par le constructeur de l'écran de game over,
    // donc à l'instant exact où la partie s'arrête, et une seule fois.
    if (u.indexOf("fpswfin:") === 0) {
      if (typeof window.fpSwapouFin === "function") window.fpSwapouFin();
      return null;
    }
    // Slot save via getURL: "slot:GAME:SLOTID:PIPEDATA"
    var slotMatch = u.match(/^slot:([\w]+):(\d+):(.+)/);
    if (slotMatch) {
      var slotGame = slotMatch[1];
      var slotNum = slotMatch[2];
      var slotPipe = slotMatch[3];
      window.__dlog("[Game] slot save intercepted: game=" + slotGame + " slot=" + slotNum + " data=" + slotPipe.length + " chars");
      var slotSid = popupSid();
      if (slotSid) {
        fetch("/api/saveFrutiSlot", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "sid=" + encodeURIComponent(slotSid) +
                "&game=" + encodeURIComponent(slotGame) +
                "&slotId=" + encodeURIComponent(slotNum) +
                "&data=" + encodeURIComponent(slotPipe)
        }).then(function(r) {
          window.__dlog("[Game] slot save response:", r.status);
          return r.text();
        }).then(function(t) {
          window.__dlog("[Game] slot save body:", t);
        }).catch(function(e) { window.__dlog("[Game] slot save error:", e); });
      }
      return null;
    }
    // Explicit score save: "score:GAME:MODE:SCORE[:DATA]"
    var scoreMatch = u.match(/^score:([\w]+):(\d+):(-?\d+)(?::(.*))?$/);
    if (scoreMatch) {
      postSaveScore(scoreMatch[1], Number(scoreMatch[2]) || 0, Number(scoreMatch[3]) || 0, scoreMatch[4] || "");
      return null;
    }
    // Legacy: "s<score>" or "s<score>*<data>"
    var legacyMatch = u.match(/^(?:.*\/)?s(\d+)(?:\*(.*))?$/);
    if (legacyMatch) {
      postSaveScore(popupGame(), popupMode(), Number(legacyMatch[1]) || 0, legacyMatch[2] || "");
      return null;
    }
    return _open.apply(window, arguments);
  };
})();

(async () => {
  const qs = new URLSearchParams(window.location.search);
  const APP_ORIGIN = window.location.origin;
  const APP_HOST = window.location.host;
  const WS_ORIGIN = (window.location.protocol === "https:" ? "wss" : "ws") + "://" + APP_HOST;

  // Game SWF path (e.g. /swf/games/kaluga/kaluga.swf)
  let swfPath = qs.get("swf") || "";
  if (!swfPath) {
    document.body.textContent = "Missing ?swf= parameter";
    return;
  }
  // Ensure absolute path
  if (!swfPath.startsWith("/")) swfPath = "/" + swfPath;
  if (!swfPath.startsWith("/swf/") && swfPath.startsWith("/games/")) {
    swfPath = "/swf" + swfPath;
  }

  let width  = parseInt(qs.get("width") || qs.get("w") || "640", 10) || 640;
  let height = parseInt(qs.get("height") || qs.get("h") || "480", 10) || 480;
  // Optional SWF natural stage size (e.g. MiniWave: visible 240x240 but SWF stage is 600x240
  // because the original Flash file leaves a debug log TextField permanently visible to the right
  // of the play area). When sw/sh differ from width/height, render the player at the SWF stage
  // size and let the wrap's overflow:hidden clip the non-game area.
  const swfWidth  = parseInt(qs.get("sw") || "0", 10) || width;
  const swfHeight = parseInt(qs.get("sh") || "0", 10) || height;
  // Optional vertical crop. Some games (e.g. Kaluga) include decorative green
  // borders at the top and bottom of their stage that the popup must hide for
  // a clean play view. The wrap is shrunk by (ct + cb) and the player is
  // shifted up by ct so the wrap "windows" into the middle of the SWF.
  const cropTop    = Math.max(0, parseInt(qs.get("ct") || "0", 10) || 0);
  const cropBottom = Math.max(0, parseInt(qs.get("cb") || "0", 10) || 0);
  const visibleHeight = Math.max(1, height - cropTop - cropBottom);

  // Debug mode: expand the wrap to the full SWF stage so internal _root.test logs are visible.
  if (qs.get("debug") === "1") {
    width = swfWidth;
    height = swfHeight;
    window.__dlog("[Game] Debug mode ON: showing full SWF stage", swfWidth + "x" + swfHeight);
  }

  // Challenge mode: set server-side flag so scores route to _challenge rankings
  const isChallenge = qs.get("mode") === "challenge" || qs.get("c") === "2";
  const popupSid = qs.get("sid") || "";
  if (popupSid) {
    fetch("/api/setChallengeMode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: popupSid, challenge: isChallenge })
    }).catch(function() {});
  }

  // ── Le pont Swapou, partagé ────────────────────────────────────────────────
  // Le SWF patché émet getURL("fpswcoup:<ncoups>:<star_counter>") à chaque échange
  // réussi et getURL("fpswfin:") à la fin de la partie ; l'aiguillage window.open
  // ci-dessus les relaie ici. Comme pour Frutisnake, le jeu les émet pour TOUS les
  // joueurs : le Pack de Swapou ne conditionne que l'affichage des cadrans, pas la
  // donnée. Deux modules s'y abonnent donc — les cadrans (derrière leur option) et
  // le relevé du Swapou Contest (ouvert à tous).
  var abonnesSwapouCoup = [], abonnesSwapouFin = [];
  function abonnerSwapou(surCoup, surFin) {
    if (surCoup) abonnesSwapouCoup.push(surCoup);
    if (surFin) abonnesSwapouFin.push(surFin);
  }
  function diffuser(liste, args) {
    for (var i = 0; i < liste.length; i++) {
      try { liste[i].apply(null, args); }
      catch (e) { window.__dlog("[Swapou] abonné en erreur :", e && e.message); }
    }
  }
  window.fpSwapouCoup = function (ncoups, star) { diffuser(abonnesSwapouCoup, [ncoups, star]); };
  window.fpSwapouFin = function () { diffuser(abonnesSwapouFin, []); };

  // ── Swapou Contest : le plus grand nombre de coups ─────────────────────────
  // Un coup = un échange réussi, donc un envoi du SWF. On les compte du début de
  // la partie jusqu'au signal de fin, puis on poste le total. Contrairement au
  // Contest de Frutisnake, pas de détection de silence à faire : le jeu annonce
  // lui-même sa fin de partie (fpswfin:), accroché au constructeur de l'écran de
  // game over.
  //
  // Réservé au mode CHALLENGE, reconnu comme pour les cadrans à la valeur de
  // départ de `ncoups` (5 en Challenge, 1 en Classique) : en Classique le
  // compteur du jeu repart à chaque niveau, un « nombre de coups » n'y serait pas
  // comparable d'un joueur à l'autre. Le quota FD, lui, n'entre pas en ligne de
  // compte : une partie Challenge jouée au-delà du quota du jour compte quand même.
  (function setupSwapouContest() {
    if (!popupSid || !/swapou/i.test(swfPath || "")) return;
    var coups = 0, ncoupsPrec = null, challenge = false;
    function url(total) {
      return "/api/contest/swapou2?sid=" + encodeURIComponent(popupSid) + "&v=" + total;
    }
    // Clôt la partie en cours et renvoie son total, ou 0 s'il n'y a rien à
    // classer. Remet le compteur à zéro dans tous les cas : la partie est finie.
    function cloturer() {
      var total = (challenge && coups >= 1) ? coups : 0;
      coups = 0; ncoupsPrec = null; challenge = false;
      return total;
    }
    abonnerSwapou(function (ncoups) {
      var n = Number(ncoups);
      if (!isFinite(n)) return;
      if (ncoupsPrec === null || n < ncoupsPrec) {
        // Nouvelle série : le Challenge initialise ncoups à 5, donc son premier
        // envoi vaut 6 ; le mode Classique part de 1 et y revient à chaque niveau.
        challenge = (n >= 6);
        coups = 1;
      } else {
        coups += 1;
      }
      ncoupsPrec = n;
    }, function () {
      var total = cloturer();
      if (!total) return;
      fetch(url(total), { method: "POST", cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && j.updated) window.__dlog("[Contest] nouveau record de coups :", j.record);
        })
        .catch(function () {});
    });
    // Fenêtre fermée en pleine partie : le total part quand même (fetch serait
    // annulé, sendBeacon non).
    window.addEventListener("pagehide", function () {
      var total = cloturer();
      if (!total) return;
      try { navigator.sendBeacon(url(total)); } catch (e) {}
    });
  })();

  // ── Cadrans Swapou (version SWF) ───────────────────────────────────────────
  // Réservés aux détenteurs du Pack de Swapou (option swapouMoves).
  //
  // Rendu : deux cadrans posés DANS la scène, juste sous le parchemin du score,
  // sur la colonne de bois de gauche — l'endroit exact où la version JavaScript
  // pose son second parchemin. Ils réutilisent l'asset du jeu lui-même (la bande
  // haute de leftPanel.png, rouleaux de cuivre et veinage compris), recopiée à
  // la même abscisse : le veinage reste aligné et le raccord ne se voit pas.
  // Cette zone est du décor, pas du jeu : rien n'est masqué.
  //
  // COUPS est compté ICI, pas lu dans le jeu : `ncoups` est le curseur de
  // difficulté (il démarre à 5 en Challenge, à 1 en Classique, et retombe à 0 à
  // chaque niveau franchi), il ne conviendrait pas à l'affichage. Un envoi = un
  // échange réussi, donc on incrémente ; `ncoups` ne sert qu'à repérer un
  // redémarrage, sa valeur repartant alors en arrière.
  (function setupSwapouCoups() {
    var panel = null, allowed = false, coups = 0, ncoupsPrec = null, debutSerie = null;
    var cipher = null;        // glyphes de la police du score (public/fb/cipher-glyphs.json)
    var CADRANS = [
      { cle: "coups", titre: "COUPS" },
      { cle: "etoile", titre: "AV. ÉTOILE" },
    ];
    var BANDE_H = 76;         // hauteur de la bande recopiée (rouleaux compris)
    var HAUT = 82;            // sous le parchemin du score
    // La bande recopiée s'arrête SUR le liseré sombre qui ferme le rouleau droit
    // du parchemin (x=132 dans leftPanel.png) : la coupe tombe donc sur un trait
    // déjà dessiné et ne se voit pas. Au-delà commence la colonne de bambou, où
    // le jeu empile les étoiles de pouvoir — elles sont centrées en x=145 et font
    // 36 px à l'échelle 0,7, soit un bord gauche à 132,4 : la bande les frôle
    // sans jamais les mordre. (La version JavaScript, elle, peut aller jusqu'à
    // 150 : chez elle les étoiles sont peintes PAR-DESSUS le panneau.)
    var LARGE = 133;

    // Les trois cotes ci-dessus sont relevées sur leftPanel.png, donc exprimées
    // en pixels de SCÈNE — pas en pixels de fenêtre. Or la scène de swapou.swf
    // fait 700x480 alors que la fenêtre l'affiche sur 640x480 : Ruffle la réduit
    // (showAll) de 640/700 ≈ 0,914 et la recentre, ce qui ajoute une bande noire
    // de ~20 px en haut et en bas. Un overlay posé en pixels de fenêtre était
    // donc ~1,09x trop grand et 21 px trop haut — d'où le débordement. On relit
    // la vraie taille de scène auprès de Ruffle et on refait SA transformation,
    // si bien que les cadrans sont dimensionnés exactement comme le parchemin du
    // score, quel que soit le cadrage demandé par la fiche du jeu.
    function transformationScene(host) {
      var lecteur = null;
      for (var i = 0; i < host.children.length; i++)
        if (host.children[i].metadata) { lecteur = host.children[i]; break; }
      var boite = lecteur || host;
      var bw = boite.offsetWidth || 0, bh = boite.offsetHeight || 0;
      var meta = (lecteur && lecteur.metadata) || {};
      var sw = Number(meta.width) || 0, sh = Number(meta.height) || 0;
      // Métadonnées indisponibles : on retombe sur l'ancien comportement (1:1).
      if (!sw || !sh || !bw || !bh) return { k: 1, x: 0, y: 0 };
      var k = Math.min(bw / sw, bh / sh);
      if (!(k > 0)) return { k: 1, x: 0, y: 0 };
      return { k: k, x: (bw - sw * k) / 2, y: (bh - sh * k) / 2 };
    }

    // Recalé à CHAQUE mise à jour, et non une fois pour toutes : si Ruffle n'a
    // pas encore publié ses métadonnées au premier coup, le cadrage se corrige
    // tout seul au coup suivant.
    function caler(p) {
      var host = p.parentNode;
      if (!host) return;
      var t = transformationScene(host);
      p.style.left = t.x + "px";
      p.style.top = (t.y + HAUT * t.k) + "px";
      p.style.transform = "scale(" + t.k + ")";
    }

    // ── Gabarit du parchemin du score, relevé DANS le SWF ────────────────────
    // (chaînage : DefineSprite « leftPanel » → sub, image 1 = Challenge ; le
    // champ scoreTxt y est posé en -9,8/9,2 avec une boîte de 18,4..138 en x et
    // -2..32 en y, police intégrée « cipher » corps 24, alignée au centre ; le
    // libellé « pts » sous le nombre est un DefineText de la même police,
    // corps 12.) Reproduire ces cotes est ce qui fait passer les cadrans pour des
    // éléments d'origine : même colonne, même ligne de base, même police, mêmes
    // teintes. Le libellé passe donc SOUS le nombre, comme « pts » — et non
    // au-dessus comme dans la version JavaScript.
    var VAL_PX = 24;                       // corps du nombre
    var VAL_X = (8.6 + 128.2) / 2;         // centre de la boîte du score : 68,4
    var VAL_HAUT_BOITE = 7.2;              // haut de la boîte dans le parchemin
    var VAL_COUL = "#aa724b";              // couleur du score
    var LAB_X = 68;                        // centre optique du parchemin
    var LAB_BASE = 55.7;                   // ligne de base du « pts » du jeu
    var LAB_COUL = "#b37851";              // sa couleur
    // NB : le « pts » du jeu est centré en 71,95, soit 3,5 px à droite du milieu
    // du parchemin. Sur trois lettres ça ne se voit pas ; sur « AV. ÉTOILE » si.
    // On garde donc sa hauteur et sa teinte, mais on recentre : mesuré au 1/8 de
    // pixel, l'encre du libellé tombe alors sur celle du nombre à 0,1 px près.
    // Flash pose la première ligne d'un champ à 2 px du haut de sa boîte, puis
    // descend de l'ascendante de la police. Vérifié au pixel en chargeant dans
    // Ruffle un SWF minimal reprenant cette police et ce champ.
    function ligneDeBase() {
      var asc = cipher ? cipher.ascendante / cipher.cadratin : 1006 / 1024;
      return VAL_HAUT_BOITE + 2 + asc * VAL_PX;      // ≈ 32,8
    }

    // Un nombre → tracés SVG de la police du jeu. Sans les glyphes (fichier
    // absent ou pas encore arrivé), <text> prend le relais : le cadran reste
    // lisible, seule la typographie diffère.
    var SVGNS = "http://www.w3.org/2000/svg";
    function svgEl(nom, attrs) {
      var e = document.createElementNS(SVGNS, nom);
      for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
      return e;
    }
    function peindre(hote, txt) {
      while (hote.firstChild) hote.removeChild(hote.firstChild);
      txt = String(txt);
      var base = ligneDeBase();
      if (!cipher) {
        var t = svgEl("text", { "class": "fp-repli", x: VAL_X, y: base });
        t.textContent = txt;
        hote.appendChild(t);
        return;
      }
      var x = 0, traces = [];
      for (var i = 0; i < txt.length; i++) {
        var g = cipher.glyphes[txt[i]];
        if (!g) continue;
        traces.push(svgEl("path", { transform: "translate(" + x + ",0)", d: g.d }));
        x += g.adv;
      }
      if (!x) return;
      // Comme le jeu : centrage sur la somme des chasses, pas sur l'encre.
      var s = VAL_PX / cipher.cadratin;
      var grp = svgEl("g", { transform: "translate(" + (VAL_X - x * s / 2) + "," + base + ") scale(" + s + ")" });
      for (var j = 0; j < traces.length; j++) grp.appendChild(traces[j]);
      hote.appendChild(grp);
    }

    function construire() {
      var host = document.getElementById("player-wrap");
      if (!host) return null;
      var p = document.createElement("div");
      p.id = "swapou-hud";
      var css = document.createElement("style");
      css.textContent =
        // Posé au bord de la scène utile (et non de la fenêtre) par caler(), puis
        // mis à la même échelle qu'elle : tout ce qui suit s'écrit donc en pixels
        // de SCÈNE, exactement comme les cotes relevées sur leftPanel.png.
        "#swapou-hud{position:absolute;left:0;top:0;transform-origin:0 0;" +
          "width:" + LARGE + "px;" +
          "z-index:5;pointer-events:none;user-select:none}" +
        "#swapou-hud .fp-cadran{display:block;width:" + LARGE + "px;height:" + BANDE_H + "px}" +
        "#swapou-hud .fp-val{fill:" + VAL_COUL + "}" +
        "#swapou-hud .fp-repli{fill:" + VAL_COUL + ";font:" + VAL_PX + "px Georgia,serif;text-anchor:middle}" +
        // Le libellé prend la place — et la teinte — du « pts » du jeu. « cipher »
        // ne contient que « .0123456789pst » : impossible d'y écrire un mot, on
        // garde donc le Verdana de l'interface, au même corps apparent.
        "#swapou-hud .fp-lab{fill:" + LAB_COUL + ";font:9px Verdana,Arial,sans-serif;" +
          "letter-spacing:.3px;text-anchor:middle}";
      p.appendChild(css);
      // Un <svg> par cadran : la bande de bois du jeu, le nombre en trac\u00e9s, le
      // libell\u00e9. Tout y est cot\u00e9 en pixels de sc\u00e8ne, donc rien \u00e0 recalculer
      // quand Ruffle change d'\u00e9chelle \u2014 l'unique scale() du conteneur suffit.
      for (var i = 0; i < CADRANS.length; i++) {
        p.insertAdjacentHTML("beforeend",
          '<svg class="fp-cadran" viewBox="0 0 ' + LARGE + " " + BANDE_H + '">' +
            '<image href="/games/swapou2/images/leftPanel.png" x="0" y="0" width="177" height="480"/>' +
            '<g class="fp-val" data-cle="' + CADRANS[i].cle + '"></g>' +
            '<text class="fp-lab" x="' + LAB_X + '" y="' + LAB_BASE + '">' + CADRANS[i].titre + "</text>" +
          "</svg>");
      }
      host.appendChild(p);
      return p;
    }

    abonnerSwapou(function (ncoups, star) {
      if (!allowed) return;
      var n = Number(ncoups);
      if (!isFinite(n)) return;            // hors partie : rien à afficher

      // Un envoi = un échange réussi, donc un coup. Si la valeur du jeu repart
      // en arrière, une nouvelle série commence (nouvelle partie, ou niveau
      // suivant en Classique) et ce coup-ci en est le premier.
      var nouvelleSerie = (ncoupsPrec === null) || (n < ncoupsPrec);
      if (nouvelleSerie) { debutSerie = n; coups = 1; } else { coups += 1; }
      ncoupsPrec = n;

      // Réservé au mode CHALLENGE, reconnu à la valeur de départ de `ncoups` :
      // le Challenge l'initialise à 5 (le premier envoi vaut donc 6), le mode
      // Classique à 1 (premier envoi 2, et 1 au début de chaque niveau).
      // Effet de bord voulu : les cadrans n'apparaissent JAMAIS sur les écrans
      // de menu, puisqu'aucun échange n'y a lieu — ils naissent au premier coup.
      if (debutSerie < 6) { if (panel) panel.style.display = "none"; return; }

      if (!panel) { panel = construire(); if (!panel) return; }
      caler(panel);
      panel.style.display = "block";
      var e = Number(star);
      var valeurs = {
        coups: String(coups),
        etoile: (isFinite(e) && e >= 0) ? String(e) : "0",
      };
      for (var i = 0; i < CADRANS.length; i++) {
        var g = panel.querySelector('[data-cle="' + CADRANS[i].cle + '"]');
        if (g) peindre(g, valeurs[CADRANS[i].cle]);
      }
    // Fin de partie : les cadrans s'effacent, et les compteurs sont remis à zéro
    // pour que la partie suivante reparte proprement. Le signal vient du SWF
    // lui-même (constructeur de l'écran de game over), pas d'un délai d'inactivité
    // — un joueur peut réfléchir longtemps entre deux échanges sans que les
    // panneaux aient à disparaître.
    }, function () {
      if (panel) panel.style.display = "none";
      coups = 0; ncoupsPrec = null; debutSerie = null;
    });

    // Ce panneau n'a de sens QUE dans Swapou : sans ce garde, il s'affichait à
    // côté de n'importe quel jeu ouvert par un joueur qui a l'option.
    var estSwapou = /swapou/i.test(swfPath || "");
    if (!popupSid || !estSwapou) return;
    fetch("/api/features?sid=" + encodeURIComponent(popupSid), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        // Les cadrans ne sont PAS créés ici : ils n'apparaissent qu'au premier
        // échange d'une partie Challenge (cf. fpSwapouCoup).
        allowed = !!(j && j.features && j.features.swapouMoves);
        if (!allowed) return null;
        return fetch("/fb/cipher-glyphs.json", { cache: "force-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (f) { if (f && f.glyphes) cipher = f; });
      })
      .catch(function () {});
  })();

  // ── Le pont Frutisnake, partagé ────────────────────────────────────────────
  // Le SWF patché (scripts/patch-snake3-hud.js) appelle fpSnakeHud à chaque tour
  // de sa boucle de jeu, pour TOUS les joueurs : le pont est dans le fichier, il
  // n'a aucune idée de qui possède quoi. Le Pack de Frutisnake ne conditionne que
  // l'AFFICHAGE du tableau de bord — pas la donnée.
  //
  // Deux modules s'y abonnent donc indépendamment : le tableau de bord (réservé
  // aux détenteurs du pack) et le relevé du Frutisnake Contest (tout le monde).
  // Un abonné qui échoue ne doit pas priver l'autre de ses appels, d'où le try.
  var abonnesSnake = [];
  function abonnerSnake(fn) { abonnesSnake.push(fn); }
  window.fpSnakeHud = function () {
    for (var i = 0; i < abonnesSnake.length; i++) {
      try { abonnesSnake[i].apply(null, arguments); }
      catch (e) { window.__dlog("[Snake] abonné en erreur :", e && e.message); }
    }
  };

  // ── Frutisnake Contest : le plus long serpent ──────────────────────────────
  // Classement à part, ouvert à tous et alimenté par TOUTES les parties —
  // challenge comme essai — puisqu'il ne mesure pas le score mais la longueur.
  // On suit le maximum atteint et on l'envoie à la fin de la partie.
  //
  // Fin de partie : le SWF cesse simplement d'appeler le pont, il n'émet aucun
  // signal. On considère donc la partie terminée après un silence de 3 s. Une
  // pause un peu longue peut déclencher un envoi anticipé : c'est sans
  // conséquence, le serveur ne retient que le maximum, et la suite de la partie
  // en enverra un plus grand. Une nouvelle partie (compteurs du jeu repartis en
  // arrière) clôt la précédente immédiatement.
  (function setupSnakeContest() {
    if (!popupSid || !/snake3/i.test(swfPath || "")) return;
    var record = 0, envoye = 0, precedent = null, silence = null;
    var SILENCE_MS = 3000;
    function url(len) {
      return "/api/contest/snake3?sid=" + encodeURIComponent(popupSid) + "&v=" + len;
    }
    function envoyer() {
      if (record <= envoye || record < 3) return;
      envoye = record;
      fetch(url(record), { method: "POST", cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && j.updated) window.__dlog("[Contest] nouveau record de longueur :", j.record);
        })
        .catch(function () {});
    }
    abonnerSnake(function (len, dyn, nbSlots, slotTime, fruits) {
      var l = Number(len) || 0, nf = Number(fruits) || 0;
      // Même détection de nouvelle partie que le tableau de bord : le serpent a
      // raccourci ET les fruits sont retombés.
      if (precedent && nf < precedent.fruits && l <= precedent.len) {
        envoyer();
        record = 0; envoye = 0;
      }
      precedent = { fruits: nf, len: l };
      if (l > record) record = l;
      if (silence) clearTimeout(silence);
      silence = setTimeout(envoyer, SILENCE_MS);
    });
    // Fenêtre fermée en pleine partie : fetch serait annulé, sendBeacon non.
    window.addEventListener("pagehide", function () {
      if (record <= envoye || record < 3) return;
      envoye = record;
      try { navigator.sendBeacon(url(record)); } catch (e) {}
    });
  })();

  // ── Tableau de bord Frutisnake ─────────────────────────────────────────────
  // Réservé aux détenteurs du Pack de Frutisnake (option snake3Hud).
  //
  // Rendu : un panneau posé À CÔTÉ de la scène, jamais par-dessus — l'aire de jeu
  // reste intégralement visible. Il s'insère dans #stage-row, la rangée que la
  // loupe met à l'échelle, donc il grandit avec le jeu et reste collé à lui.
  //
  // Habillage repris du jeu : remplissage #83CA22 (le vert du cadre de Frutisnake,
  // relevé au pixel sur une capture), bordure blanche de 2 px, libellés Verdana
  // gras blancs, et les valeurs dans la police ALBA — celle des titres « Pause »
  // et « Game over » — avec contour blanc et dégradé #E46A6A → #E7A8A8.
  //
  // Alba n'existe nulle part sur le disque : elle ne vit que dans le SWF sous
  // forme de contours. scripts/extract-alba-digits.js les convertit en tracés
  // SVG (public/fb/alba-glyphs.json), ce qui donne la typographie exacte du jeu
  // ET permet le contour + le dégradé, qu'une webfont ne saurait pas rendre
  // seule (paint-order: stroke fill peint le contour DERRIÈRE la lettre).
  (function setupSnakeHud() {
    var panel = null, allowed = false, hideTimer = null, alba = null;
    var LIGNES = [
      { cle: "len", titre: "Longueur" },
      { cle: "fruits", titre: "Fruits aval\u00e9s" },
      { cle: "dyn", titre: "Dynamites" },
      { cle: "bonus", titre: "Dur\u00e9e bonus en cours" },
      { cle: "chrono", titre: "Dur\u00e9e de la partie" },
    ];
    // Chronomètre tenu ICI, pas dans le SWF : le jeu ne compte pas le temps
    // écoulé. On cumule les intervalles entre deux envois, ce qui donne trois
    // propriétés utiles sans rien ajouter au bytecode :
    //   - un trou de plus d'une seconde (fin de partie, onglet en arrière-plan)
    //     n'est pas compté, et le chrono se FIGE sur la durée finale ;
    //   - une nouvelle partie repart de zéro, détectée à la remise à zéro des
    //     compteurs du jeu ;
    //   - la pause ne compte pas : le SWF nous transmet son drapeau `pause`.
    var chrono = 0, derniereTick = 0;
    function majChrono(enPause, redemarrage) {
      var t = Date.now();
      if (redemarrage) { chrono = 0; derniereTick = t; return; }
      var dt = derniereTick ? t - derniereTick : 0;
      derniereTick = t;
      if (!enPause && dt > 0 && dt < 1000) chrono += dt;
    }
    // Le décompte est affiché en mm:ss. Les bonus concernés sont exactement les
    // TimedSlot du jeu, seuls porteurs d'un membre `time` : les neuf potions,
    // plus le Pieu, la Rondelle et les Steroids. Les autres — ciseaux, langue,
    // bombe, et les bonus « uniques » (bague, ressort, plume, poupée…) — sont
    // permanents ou instantanés et n'ont pas de minuterie : 00:00.
    function mmss(sec) {
      var n = Math.max(0, Math.floor(sec));
      var m = Math.floor(n / 60), r = n % 60;
      return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
    }

    // Un nombre → un <svg> de tracés Alba. Sans les glyphes (fichier absent ou
    // pas encore arrivé), on retombe sur du texte : le panneau reste lisible.
    function nombre(txt) {
      txt = String(txt);
      if (!alba) return '<span class="fp-fallback">' + txt + "</span>";
      var x = 0, paths = "";
      for (var i = 0; i < txt.length; i++) {
        var g = alba.glyphes[txt[i]];
        if (!g) continue;
        paths += '<path transform="translate(' + x + ',0)" d="' + g.d + '"/>';
        x += g.adv;
      }
      if (!x) return "";
      // viewBox calé sur la boîte RÉELLE des chiffres, pas sur l'ascendante
      // déclarée par la police (qui couvre accents et hampes et rendrait les
      // nombres deux fois trop petits). On laisse une marge pour le contour.
      var m = 60;
      var haut = alba.hautChiffres - m, ht = (alba.basChiffres - alba.hautChiffres) + 2 * m;
      return '<svg class="fp-num" viewBox="' + (-m) + " " + haut + " " + (x + 2 * m) + " " + ht + '" ' +
             'preserveAspectRatio="xMaxYMid meet"><g>' + paths + "</g></svg>";
    }

    function construire() {
      var row = document.getElementById("stage-row");
      if (!row) return null;
      var p = document.createElement("div");
      p.id = "snake-hud";
      var css = document.createElement("style");
      css.textContent =
        "#snake-hud{flex:0 0 auto;width:132px;box-sizing:border-box;padding:7px 8px 9px;" +
          "background:#83CA22;border:2px solid #fff;" +
          "font:bold 11px Verdana,Geneva,sans-serif;color:#fff;user-select:none;" +
          "opacity:0;transition:opacity .3s ease-out}" +
        "#snake-hud .fp-lab{text-align:center;letter-spacing:.2px;line-height:1.25;" +
          "text-shadow:0 1px 0 rgba(0,0,0,.15)}" +
        // La pastille blanche reprend la jauge du jeu ; le nombre repose dessus
        // et la déborde, comme sur le gabarit.
        "#snake-hud .fp-slot{position:relative;height:30px;margin:3px 0 8px}" +
        "#snake-hud .fp-pill{position:absolute;left:0;right:0;top:9px;height:13px;" +
          "background:#fff;border-radius:7px}" +
        "#snake-hud .fp-val{position:absolute;inset:0;display:flex;align-items:center;" +
          "justify-content:flex-end;padding-right:2px}" +
        "#snake-hud .fp-num{display:block;height:30px;max-width:100%}" +
        "#snake-hud .fp-num g{fill:url(#fp-alba-grad);stroke:#fff;stroke-width:95;" +
          "stroke-linejoin:round;paint-order:stroke fill}" +
        "#snake-hud .fp-fallback{font:bold 26px Verdana,Geneva,sans-serif;color:#E46A6A;" +
          "-webkit-text-stroke:2px #fff;paint-order:stroke fill}" +
        "#snake-hud .fp-slot:last-child{margin-bottom:0}";
      p.appendChild(css);
      // Un seul dégradé, partagé par tous les nombres du panneau.
      p.insertAdjacentHTML("beforeend",
        '<svg width="0" height="0" style="position:absolute"><defs>' +
        '<linearGradient id="fp-alba-grad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#E7A8A8"/><stop offset="1" stop-color="#E46A6A"/>' +
        "</linearGradient></defs></svg>");
      for (var i = 0; i < LIGNES.length; i++) {
        p.insertAdjacentHTML("beforeend",
          '<div class="fp-lab">' + LIGNES[i].titre + "</div>" +
          '<div class="fp-slot"><div class="fp-pill"></div>' +
          '<div class="fp-val" data-cle="' + LIGNES[i].cle + '"></div></div>');
      }
      row.appendChild(p);
      // La rangée s'élargit : la fenêtre doit suivre, sinon le panneau serait
      // hors champ sur un popup dimensionné pour la seule scène.
      if (typeof window.__fpRelayout === "function") window.__fpRelayout();
      return p;
    }

    var precedent = null;
    abonnerSnake(function (len, dyn, nbSlots, slotTime, fruits, enPause) {
      if (!allowed) return;
      if (!panel) { panel = construire(); if (!panel) return; }
      // Nouvelle partie : les compteurs du jeu sont repartis en arrière (le
      // serpent est plus court ET les fruits sont retombés à zéro).
      var nf = Number(fruits) || 0;
      var redemarrage = !precedent ||
        (nf < precedent.fruits && Number(len) <= precedent.len);
      majChrono(!!enPause, redemarrage);
      precedent = { fruits: nf, len: Number(len) || 0 };
      // `time` est déjà un nombre de SECONDES : Const.as annote « temps en
      // secondes » le bloc TIME_* et TimedSlot.permanent() y retranche Std.deltaT.
      // Il n'existe que sur les bonus temporisés (potions, Pieu, Rondelle,
      // Steroids) ; un ciseau ou une langue en main n'a pas de minuterie, d'où
      // le 0 affiché — il n'y a alors aucun bonus chronométré en cours.
      var t = Number(slotTime);
      var valeurs = {
        len: Number(len) || 0,
        fruits: nf,
        dyn: Number(dyn) || 0,
        bonus: mmss((isFinite(t) && t > 0) ? Math.ceil(t) : 0),
        chrono: mmss(chrono / 1000),
      };
      var cases = panel.querySelectorAll(".fp-val");
      for (var i = 0; i < cases.length; i++) {
        cases[i].innerHTML = nombre(valeurs[cases[i].getAttribute("data-cle")]);
      }
      panel.style.opacity = "1";
      // Plus d'appels ⇒ la partie est terminée : on efface en fondu.
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { if (panel) panel.style.opacity = "0"; }, 2000);
    });

    if (!popupSid) return;
    fetch("/api/features?sid=" + encodeURIComponent(popupSid), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        allowed = !!(j && j.features && j.features.snake3Hud);
        if (!allowed) return null;
        return fetch("/fb/alba-glyphs.json", { cache: "force-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (f) { if (f && f.glyphes) alba = f; })
          .catch(function () {});
      })
      .catch(function () {});
  })();

  const wrap = document.getElementById("player-wrap");
  wrap.style.width  = width + "px";
  // When ct/cb are set, the wrap is shorter than the SWF — the player below
  // is positioned with top: -cropTop so the cropped band sits above the wrap
  // and gets clipped by overflow:hidden.
  wrap.style.height = visibleHeight + "px";

  document.title = "Frutiparc - " + (qs.get("game") || "Game");

  // Derive game's internal SWF name for slot persistence (e.g., "miniwave" from ".../miniwave.swf")
  var gameSwfName = swfPath.substring(swfPath.lastIndexOf("/") + 1).replace(/\.swf$/, "");

  // Poll the server for eject events. The Frusion console SWF in the
  // parent tab signals "disc ejected" by moving the disc back to
  // disccollector (server logs [FF/MV] folder=disccollector); the server
  // marks the eject in recentlyEjected and we close ourselves on the next
  // poll. Required because Ruffle's WASM networking bypasses window.fetch
  // and XMLHttpRequest wrappers in the parent tab, so we can't catch the
  // eject signal there.
  (function pollEjectStatus() {
    var sidArg = new URLSearchParams(window.location.search).get("sid") || "";
    var gameArg = new URLSearchParams(window.location.search).get("game") || gameSwfName;
    if (!sidArg || !gameArg) return;
    setInterval(function () {
      fetch("/api/check-ejected?sid=" + encodeURIComponent(sidArg)
            + "&game=" + encodeURIComponent(gameArg))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ejected) {
            window.__dlog("[Game] disc ejected by parent — closing popup");
            try { window.close(); } catch (e) {}
          }
          // Le serveur vient de refuser une partie challenge (plus de FD) :
          // le jeu est revenu à son menu ; on propose le rachat par-dessus.
          if (j && j.fd && j.fd.refused) showFdOverlay(j.fd, sidArg);
        })
        .catch(function () {});
    }, 1500);
  })();

  // ── Overlay « Plus de FD » : information uniquement ──
  // Affiché quand /do/fdclaim vient de refuser une course challenge (drapeau
  // fd.refused du poll ci-dessus). PAS d'achat ici : les parties
  // supplémentaires s'achètent dans la BOUTIQUE officielle (rubrique Pass,
  // « Pass quotidien de … ») — chaque pass est permanent et cumulable.
  // ── Pop-in « Plus de FD » — reproduction de la popin NATIVE Frutiparc ──
  // Style calqué sur la popin d'origine (cf. Boutique) : fond blanc, bordure
  // noire 1px + liseré intérieur gris, coins arrondis, ombre portée, en-tête
  // icône (/fb/icone_popin.png) + titre gras, bouton /fb/bouton_popin.png
  // (Verdana bold #660000). Un seul bouton « Fermer », centré : ouvrir la
  // Boutique du bureau main.swf depuis le popup de jeu n'est pas faisable
  // proprement — le joueur y va lui-même.
  function popinFrutiparc(id, texte) {
    if (document.getElementById(id)) return;
    var wrap = document.createElement("div");
    wrap.id = id;
    wrap.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.30)";
    wrap.innerHTML =
      '<div style="background:#fff;border:1px solid #000;border-radius:12px;padding:0;box-shadow:0 7px 8px rgba(0,0,0,.5);max-width:378px;width:calc(100% - 14px)">' +
        '<div style="border:2px solid #ccc;border-radius:11px;padding:13px 16px 16px;font-family:Verdana,Arial,sans-serif;color:#000">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">' +
            '<img src="/fb/icone_popin.png" alt="" width="19" height="24" style="display:block">' +
            '<b style="font-size:15px">Challenge</b>' +
          '</div>' +
          '<p style="font-family:Verdana,Arial,sans-serif;font-size:14px;line-height:1.5;margin:0 0 20px">' + texte + '</p>' +
          '<div style="text-align:center">' +
            '<button style="width:124px;height:30px;border:0;padding:0 0 2px;background:url(/fb/bouton_popin.png) no-repeat center/100% 100%;font-family:Verdana,Arial,sans-serif;font-weight:bold;font-size:13px;color:#660000;cursor:pointer">Fermer</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var bt = wrap.querySelector("button");
    bt.onmousedown = function () { bt.style.transform = "translateY(1px)"; };
    bt.onmouseup = function () { bt.style.transform = ""; };

  // ── Seed Ruffle's SharedObject from server data ──
  // The native game loads its slot as a NATIVE AS2 object graph from
  // SharedObject.getLocal("miniPixiz/card").data.fruticard[0] (AMF0), NOT by
  // parsing JSON. ExternalInterface.call returns undefined in this Ruffle (EI
  // is dead for AS2 SWFs here), so the SWF cannot parse the server's JSON
  // itself. Instead we encode the server's card into the EXACT .sol/AMF0 byte
  // format the game itself writes, and drop it into localStorage under Ruffle's
  // SharedObject key BEFORE the SWF starts. The native onServiceConnect then
  // reads it like any locally-saved game. Verified byte-for-byte against a real
  // Ruffle-written SharedObject dump.

  // Per-game SharedObject config: `name` = full path passed to getLocal()
  // (also the localStorage key suffix), `base` = the .sol internal name (last
  // path segment), `fields` = the data propert(ies) holding the slots array.
  // NOTE: the native minipixiz load reads `SharedObject.data["]D,mH("]` — a
  // MINIFIED field name (verified by disassembly + a Ruffle-written SOL dump),
  // NOT "fruticard". Seed exactly that one field so the SOL is byte-identical
  // to what the game itself writes.
  var SHARED_OBJECT_GAMES = {
    minipixiz: { name: "miniPixiz/card", base: "card", fields: ["]D,mH("] }
  };

  function amfRawStr(s, out) { var b = Array.from(new TextEncoder().encode(s)); out.push((b.length >> 8) & 0xff, b.length & 0xff); for (var i = 0; i < b.length; i++) out.push(b[i]); }
  function amfPushU32(n, out) { out.push((n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff); }
  function amf0Encode(v, out) {
    if (v === null) { out.push(0x05); return; }
    if (v === undefined) { out.push(0x06); return; }
    var t = typeof v;
    if (t === "number") { out.push(0x00); var b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, v, false); for (var i = 0; i < 8; i++) out.push(b[i]); return; }
    if (t === "boolean") { out.push(0x01, v ? 1 : 0); return; }
    if (t === "string") { out.push(0x02); amfRawStr(v, out); return; }
    if (Array.isArray(v)) { out.push(0x08); amfPushU32(v.length, out); for (var i = 0; i < v.length; i++) { amfRawStr(String(i), out); amf0Encode(v[i], out); } out.push(0, 0, 9); return; }
    if (t === "object") { out.push(0x03); for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) { amfRawStr(k, out); amf0Encode(v[k], out); } out.push(0, 0, 9); return; }
    out.push(0x06);
  }
  function buildSol(name, data) {
    var body = [];
    Array.from(new TextEncoder().encode("TCSO")).forEach(function (x) { body.push(x); });
    [0x00, 0x04, 0x00, 0x00, 0x00, 0x00].forEach(function (x) { body.push(x); });
    amfRawStr(name, body);
    [0, 0, 0, 0].forEach(function (x) { body.push(x); });
    // LSO format: each root-level property is terminated by a trailing 0x00.
    // Ruffle's parser is strict — omitting it makes the SOL 1 byte short and
    // Ruffle rejects the whole SharedObject (verified: with the 0x00 our bytes
    // are identical to a Ruffle-written SOL for the same data).
    for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) { amfRawStr(k, body); amf0Encode(data[k], body); body.push(0x00); }
    var head = [0x00, 0xBF]; amfPushU32(body.length, head);
    return head.concat(body);
  }
  function bytesToB64(arr) { var s = ""; for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]); return btoa(s); }

  async function seedSharedObjectFromServer(game, swfLoadPath, sid) {
    var cfg = SHARED_OBJECT_GAMES[game];
    if (!cfg || !sid) return;
    try {
      var resp = await fetch("/api/loadFrutiSlots?sid=" + encodeURIComponent(sid) + "&game=" + encodeURIComponent(game), { method: "POST" });
      if (!resp.ok) { window.__dlog("[Seed] loadFrutiSlots HTTP " + resp.status); return; }
      var params = new URLSearchParams(await resp.text());
      var slot0 = params.get("slot0");
      if (!slot0 || slot0 === "null") { window.__dlog("[Seed] no slot0 — leaving SharedObject untouched"); return; }
      var card = JSON.parse(slot0);

      // fruticard[1] ; sans lui, Cm.formatPref() réinitialise les touches du
      // moulin à CHAQUE session. On le seed quand le serveur le connaît.

      console.log("[Seed] OK " + key + " — " + b64.length + " b64 chars, $faerie=" + (Array.isArray(card.$faerie) ? card.$faerie.length : "?") + " $treeMax=" + (card.$stat && card.$stat.$treeMax));

    }

  // Dynamically load the Ruffle engine (with the same local→CDN fallback the

  // localStorage snapshot includes our injected SharedObject. Resolves once

  // a tick after the script's onload fires).
  function loadRuffleScript() {

  // ── Stuck-key fix (keyboard re-sync) ──────────────────────────────
  // Ruffle attaches its keyboard listeners to the PLAYER element (it even
  // dispatches its own synthetic KeyboardEvents on the element for the virtual
  // keyboard) and does not check event.isTrusted. So if the player element
  // loses DOM focus while a key is held — focus drifting to <body>, the zoom
  // bar, another window, etc. — the matching "keyup" never reaches Ruffle and
  // the key stays logically pressed. In Kaluga this makes the tzongre rise or
  // sink forever "as if Up/Down were held"; the same class of bug affects any
  // game that polls Key.isDown.
  //
  // Fix: mirror keyboard events from window → the player whenever the player
  // wasn't the natural target, and release everything on blur / tab-hide. App
  // shortcuts (Ctrl/Meta, e.g. the zoom keys) and form fields are left alone.
  (function keepKeysAlive(player) {
    if (!player) return;
    var held = Object.create(null);
    function isEditable(t) {
      if (!t || !t.tagName) return false;
      var n = t.tagName.toUpperCase();
      return n === "INPUT" || n === "TEXTAREA" || t.isContentEditable === true;
    }

      var targets = [player];
      try {
        var sr = player.shadowRoot;
        if (sr) { var c = sr.querySelector("canvas") || sr.querySelector("#container"); if (c) targets.push(c); }
      } catch (e) {}
      for (var i = 0; i < targets.length; i++) {
        var ev = new KeyboardEvent(type, {
          key: p.key, code: p.code, keyCode: p.keyCode, which: p.which,
          location: p.location, repeat: !!p.repeat,
          shiftKey: p.shiftKey, altKey: p.altKey, bubbles: false, cancelable: true
        });
        ev.__rfwd = true; // tag so our own window listener ignores it
        try { targets[i].dispatchEvent(ev); } catch (e) {}
      }
    }
    function onKey(e) {
      if (e.__rfwd) return;                 // ignore events we forwarded
      if (e.ctrlKey || e.metaKey) return;   // leave app shortcuts (zoom) alone
      if (isEditable(e.target)) return;     // never hijack form fields
      var p = {
        key: e.key, code: e.code, keyCode: e.keyCode, which: e.which,
        location: e.location, repeat: e.repeat, shiftKey: e.shiftKey, altKey: e.altKey
      };
      var t = e.target;
      var natural = t === player || (player.contains && t && player.contains(t));
      if (e.type === "keydown") {
        held[e.code] = p;
        if (!natural) send("keydown", p);   // keep input working if the player lost focus
      } else {
        delete held[e.code];
        send("keyup", p);                   // always guarantee the release reaches Ruffle (idempotent)
      }
    }
    function releaseAll() {
      for (var code in held) send("keyup", held[code]);
      held = Object.create(null);
    }
    window.addEventListener("keydown", onKey, true);
    window.addEventListener("keyup", onKey, true);
    window.addEventListener("blur", releaseAll);
    document.addEventListener("visibilitychange", function () { if (document.hidden) releaseAll(); });
    // Encourage the player to keep focus so it receives keys directly.
    try { if (!(player.tabIndex >= 0)) player.tabIndex = 0; } catch (e) {}
    function focusPlayer() { try { player.focus({ preventScroll: true }); } catch (e) {} }
    player.addEventListener("pointerdown", focusPlayer);
    setTimeout(focusPlayer, 0);
  })(player);

  // ── Zoom control ──────────────────────────────────────────────────
  // These games were tiny by design (period-authentic). Offer an optional
  // magnifier: we scale the clipping wrap with a CSS transform — which works
  // for every game regardless of its internal Stage.scaleMode (resizing the
  // player only zooms games that scale to stage) — and grow the popup window
  // to match, falling back to scroll once we hit the screen edge. Slightly
  // soft when upscaled, but guaranteed to enlarge any game. Remembered per game.
  (function setupZoom() {
    var ZMIN = 1, ZMAX = 4, STEP = 0.25;
    // La rangée porte la mise à l'échelle : sa taille de base est mesurée à
    // chaque fois, car un panneau latéral peut apparaître APRÈS le démarrage
    // (une fois /api/features revenu). offsetWidth ignore les transforms, donc
    // il renvoie bien la taille non zoomée.
    var row = document.getElementById("stage-row");
    var zoomKey = "frutiparc:zoom:" + gameSwfName;
    var zoom = 1;
    try {
      var saved = parseFloat(localStorage.getItem(zoomKey));
      if (saved >= ZMIN && saved <= ZMAX) zoom = saved;
    } catch (e) {}

    var bar = document.createElement("div");
    bar.id = "zoom-bar";
    bar.innerHTML =
      '<button type="button" data-z="out" title="Dézoomer (Ctrl+molette)">−</button>' +
      '<span class="z-label"></span>' +
      '<button type="button" data-z="in" title="Zoomer (Ctrl+molette)">+</button>' +
      '<button type="button" data-z="reset" title="Taille d\'origine (Ctrl+0)">1:1</button>';
    document.body.appendChild(bar);
    var label = bar.querySelector(".z-label");

    function clamp(v) { return Math.min(ZMAX, Math.max(ZMIN, Math.round(v / STEP) * STEP)); }

      try {
        var chromeW = Math.max(0, window.outerWidth - window.innerWidth);
        var chromeH = Math.max(0, window.outerHeight - window.innerHeight);
        var wantW = Math.ceil((row.offsetWidth || width) * zoom) + chromeW;
        var wantH = Math.ceil((row.offsetHeight || height) * zoom) + chromeH;
        var maxW = screen.availWidth || 1920;
        var maxH = screen.availHeight || 1080;
        window.resizeTo(Math.min(wantW, maxW), Math.min(wantH, maxH));
        var fits = wantW <= maxW && wantH <= maxH;

        document.body.style.overflow = fits ? "hidden" : "auto";

    }

    function apply(z, resizeWin) {
      zoom = clamp(z);
      row.style.transform = "scale(" + zoom + ")";
      label.textContent = Math.round(zoom * 100) + "%";
      try { localStorage.setItem(zoomKey, String(zoom)); } catch (e) {}
      if (resizeWin) fitWindow();
    }

    bar.addEventListener("click", function (ev) {
      var btn = ev.target.closest("button");
      if (!btn) return;
      var act = btn.getAttribute("data-z");
      if (act === "in") apply(zoom + STEP, true);
      else if (act === "out") apply(zoom - STEP, true);
      else if (act === "reset") apply(1, true);
    });

    window.addEventListener("wheel", function (ev) {
      if (!ev.ctrlKey) return;
      ev.preventDefault();
      apply(zoom + (ev.deltaY < 0 ? STEP : -STEP), true);
    }, { passive: false });

    window.addEventListener("keydown", function (ev) {
      if (!ev.ctrlKey) return;
      if (ev.key === "+" || ev.key === "=") { ev.preventDefault(); apply(zoom + STEP, true); }
      else if (ev.key === "-") { ev.preventDefault(); apply(zoom - STEP, true); }
      else if (ev.key === "0") { ev.preventDefault(); apply(1, true); }
    });

    apply(zoom, zoom !== 1);
    // Ré-ajuste la fenêtre quand un panneau latéral s'ajoute après coup.
    window.__fpRelayout = function () { apply(zoom, true); };
  })();
})();
</script>
</body>
</html>
