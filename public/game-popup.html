<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Frutiparc Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ade76b;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #player-wrap {
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,.15);
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      logLevel: "warn",
      fontSources: [
        window.location.origin + "/legacy/fonts.swf"
      ],
      defaultFonts: {
        sans: ["Verdana", "verdana"],
        serif: ["Times New Roman", "TimesNewRoman"],
        typewriter: ["Verdana", "verdana"]
      }
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player-wrap"></div>
<script>
// Block legacy Frusion "burst disc" auto-close: some SWFs (MiniWave, etc.)
// call getURL("javascript:self.close()", "_self") on init or end-of-game,
// which Ruffle relays via window.location, closing the popup before the
// user can play. Override close() and intercept javascript: navigations.
(function() {
  var _close = window.close;
  window.close = function() {
    console.log("[Game] window.close() blocked (use the X button)");
  };
  // Some Ruffle versions navigate via location.assign for getURL with target=_self.
  // Override location.assign / location.replace / href setter to block javascript:
  // URLs that would run self.close().
  try {
    var origAssign = window.location.assign.bind(window.location);
    var origReplace = window.location.replace.bind(window.location);
    window.location.assign = function(u) {
      if (/^javascript:.*close/i.test(String(u || ""))) {
        console.log("[Game] javascript:self.close() navigation blocked:", u);
        return;
      }
      return origAssign(u);
    };
    window.location.replace = function(u) {
      if (/^javascript:.*close/i.test(String(u || ""))) {
        console.log("[Game] javascript:self.close() navigation blocked:", u);
        return;
      }
      return origReplace(u);
    };
  } catch (e) { /* location may be readonly in some browsers */ }
})();

// Intercept getURL calls from patched game SWFs that save scores.
// Ruffle routes getURL(url, target) through window.open when target is non-empty.
// The patched SWF calls getURL("s"+score, true) — we catch that here,
// fire a background fetch to persist the score, and suppress the popup.
(function() {
  var _open = window.open;
  window.open = function(url, target) {
    var u = String(url || "");
    // Block javascript:self.close() opened in a new window (defensive)
    if (/^javascript:.*close/i.test(u)) {
      console.log("[Game] window.open(javascript:close) blocked");
      return null;
    }
    if (/(?:^|\/)s\d+$/.test(u)) {
      var full = u.startsWith("/") ? u : new URL(u, document.baseURI).href;
      try {
        var sid = new URLSearchParams(window.location.search).get("sid") || "";
        if (sid) {
          var saveUrl = new URL(full, window.location.origin);
          if (!saveUrl.searchParams.get("sid")) saveUrl.searchParams.set("sid", sid);
          full = saveUrl.toString();
        }
      } catch (e) {}
      fetch(full).catch(function() {});
      return null;
    }
    return _open.apply(window, arguments);
  };
})();

(async () => {
  const qs = new URLSearchParams(window.location.search);
  const APP_ORIGIN = window.location.origin;
  const APP_HOST = window.location.host;
  const WS_ORIGIN = (window.location.protocol === "https:" ? "wss" : "ws") + "://" + APP_HOST;

  // Game SWF path (e.g. /swf/games/kaluga/kaluga.swf)
  let swfPath = qs.get("swf") || "";
  if (!swfPath) {
    document.body.textContent = "Missing ?swf= parameter";
    return;
  }
  // Ensure absolute path
  if (!swfPath.startsWith("/")) swfPath = "/" + swfPath;
  if (!swfPath.startsWith("/swf/") && swfPath.startsWith("/games/")) {
    swfPath = "/swf" + swfPath;
  }

  const width  = parseInt(qs.get("width") || qs.get("w") || "640", 10) || 640;
  const height = parseInt(qs.get("height") || qs.get("h") || "480", 10) || 480;

  // Challenge mode: set server-side flag so scores route to _challenge rankings
  const isChallenge = qs.get("mode") === "challenge" || qs.get("c") === "2";
  const popupSid = qs.get("sid") || "";
  if (popupSid) {
    fetch("/api/setChallengeMode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: popupSid, challenge: isChallenge })
    }).catch(function() {});
  }

  const wrap = document.getElementById("player-wrap");
  wrap.style.width  = width + "px";
  wrap.style.height = height + "px";

  document.title = "Frutiparc - " + (qs.get("game") || "Game");

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.width  = width + "px";
  player.style.height = height + "px";
  wrap.appendChild(player);

  // Derive base URL from SWF path so relative loads resolve
  // to the game's own directory instead of the site root.
  var swfDir = swfPath.substring(0, swfPath.lastIndexOf("/") + 1);

  // Try full.swf first — it has all libs pre-merged (MovieClipLoader is broken
  // in Ruffle, so the base SWF alone can't load its lib/*.swf dependencies).
  var fullSwfPath = swfDir + "full.swf";
  try {
    var headResp = await fetch(fullSwfPath, { method: "HEAD" });
    if (headResp.ok) {
      console.log("[Game] Found full.swf, using it instead of", swfPath);
      swfPath = fullSwfPath;
    }
  } catch (e) {
    console.log("[Game] No full.swf available, using original SWF");
  }

  // Load the game SWF directly (standalone mode, no Frusion wrapper).
  // We still provide socketProxy + domain so that calls to super.serviceConnect()
  // (triggered e.g. by SnakeClient before the STANDALONE branch) don't crash
  // when the game tries to set up its XMLSocket against the CBee server.
  await player.load({
    url: swfPath,
    autoplay: "on",
    allowScriptAccess: true,
    allowNetworking: "all",
    openUrlMode: "allow",
    quality: "high",
    letterbox: "off",
    base: APP_ORIGIN + swfDir,
    socketProxy: [
      { host: "localhost", port: 5000, proxyUrl: WS_ORIGIN },
      { host: window.location.hostname, port: 5000, proxyUrl: WS_ORIGIN },
      { host: "www.beta.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
      { host: "www.frutiparc.com", port: 5000, proxyUrl: WS_ORIGIN },
      { host: "localhost", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
      { host: window.location.hostname, port: 5001, proxyUrl: WS_ORIGIN + "/score" },
      { host: "www.beta.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
      { host: "www.frutiparc.com", port: 5001, proxyUrl: WS_ORIGIN + "/score" },
      { host: "localhost", port: 2000, proxyUrl: WS_ORIGIN },
      { host: window.location.hostname, port: 2000, proxyUrl: WS_ORIGIN },
      { host: "www.beta.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN },
      { host: "www.frutiparc.com", port: 2000, proxyUrl: WS_ORIGIN }
    ],
    parameters: {
      sid: qs.get("sid") || "standalone",
      standalone: "1",
      domain: APP_HOST + "/./"
    }
  });

  console.log("[Game] Loaded", swfPath, "standalone at", width + "x" + height);
})();
</script>
</body>
</html>
