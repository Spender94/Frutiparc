<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minipixiz</title>
<!--
  Minipixiz (miniTroll) — portage natif JS du puzzle, fidèle aux sources d'origine
  (Games/miniTroll/src, en « .mt »).

  L'aire est haute et étroite (132 × 240) : elle tombe bien sur un téléphone tenu
  debout. On la centre, on l'agrandit d'un facteur entier tant que possible, et
  on garde le bas de l'écran pour la manette — le jeu se joue au clavier, il faut
  donc bien lui en donner un.

  ?sid= pour la persistance plateforme.
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #150f28;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  /* L'aire prend toute la place disponible : c'est elle que le client mesure. */
  #aire {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    display: block;
    border-radius: 4px;
    box-shadow: 0 0 0 2px #3a2d5e, 0 8px 30px rgba(0,0,0,.6);
  }

  /* ── Manette ──
     Gauche, tourner, droite, et « poser » qui accélère la chute. Les cibles font
     au moins 64 px : on joue au pouce. */
  #manette {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 10px 12px;
    width: 100%; max-width: 460px; box-sizing: border-box;
  }
  #manette button {
    flex: 1 1 0; height: 70px; min-width: 60px;
    border: 0; border-radius: 16px;
    background: #2e2450; color: #d9cbff;
    font-size: 24px; font-weight: bold; font-family: inherit;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .08s, transform .08s;
  }
  #manette button.tourner { background: #453177; color: #e9dcff; font-size: 22px; }
  #manette button.bas { background: #2f4a1c; color: #bff18d; font-size: 15px; letter-spacing: 1px; }
  #manette button.fee { background: #5b3a86; color: #ffe9a8; font-size: 20px; }
  #manette button.fee:active { background: #7d51b8; }
  #manette button.on { transform: scale(.95); background: #5a45a0; }
  #manette button.bas.on { background: #4b7a26; }

  #chargement {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #150f28; color: #d9cbff; font-size: 13px; letter-spacing: 2px;
  }
  #chargement .barre { width: 200px; height: 10px; border: 2px solid #d9cbff; border-radius: 6px; overflow: hidden; }
  #chargement .barre > div { height: 100%; width: 0; background: #9b7dff; transition: width .12s; }

  #fin {
    position: fixed; inset: 0; z-index: 6; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(21,15,40,.88); color: #d9cbff; text-align: center; padding: 20px;
  }
  #fin.on { display: flex; }
  #fin .t { font-size: 20px; font-weight: bold; color: #ffd76a; }
  #fin .s { font-size: 13px; }
  #fin button {
    border: 0; border-radius: 14px; padding: 14px 28px;
    background: #453177; color: #e9dcff; font: bold 15px inherit; cursor: pointer;
  }
  /* La carte de la forêt : les relais, du plus proche au plus lointain. */
  #carte {
    position: fixed; inset: 0; z-index: 7; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #150f28; color: #d9cbff; text-align: center; padding: 20px;
  }
  #carte.on { display: flex; }
  #carte .t { font-size: 20px; font-weight: bold; color: #ffd76a; letter-spacing: 2px; }
  #carte .s { font-size: 13px; color: #9b8cc9; }
  #carte-liste {
    display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 300px; max-height: 60vh; overflow-y: auto;
  }
  #carte .relais {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: 2px solid #453177; border-radius: 12px; padding: 12px 14px;
    background: #241c3a; color: #e9dcff; font: inherit; cursor: pointer; text-align: left;
  }
  #carte .relais:active { background: #453177; }
  #carte .relais .n {
    flex: 0 0 40px; text-align: center; font-weight: bold; font-size: 17px; color: #ffd76a;
  }
  #carte .relais .t { font-size: 13px; font-weight: normal; color: #d9cbff; letter-spacing: 0; }
  @media (min-width: 700px) and (pointer: fine) {
    #manette { display: none; }
    #aide { color: #7b6ba8; font-size: 12px; padding-bottom: 14px; }
  }
  #aide { display: none; }
  @media (pointer: fine) { #aide { display: block; } }

  /* ── Le menu de l'aventure ──
     La clairière d'où l'on part : le même canevas de 240 × 240 que le reste. */
  #menu {
    position: fixed; inset: 0; z-index: 9; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #0b1424;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #menu.on { display: flex; }
  #menu-aire {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #menu-stage {
    display: block; border-radius: 4px; cursor: pointer;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
  }
  #menu-pied { flex: 0 0 auto; display: flex; gap: 10px; margin-bottom: 12px; }
  #menu-pied button {
    border: 0; border-radius: 14px; padding: 12px 22px;
    background: #2b4a6b; color: #dff0ff; font: bold 14px inherit; cursor: pointer;
  }

  /* ── L'inventaire ──
     C'est l'écran d'Inventory.mt, dessiné sur ses propres images : un canevas
     de 240 × 240 comme le reste du jeu, agrandi du même facteur. */
  #sac-but {
    position: fixed; top: 8px; right: 8px; z-index: 4;
    border: 0; border-radius: 12px; padding: 8px 12px;
    background: rgba(36,28,58,.85); color: #e9dcff;
    font: bold 13px inherit; cursor: pointer;
  }
  #inventaire {
    position: fixed; inset: 0; z-index: 8; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #150f28;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #inventaire.on { display: flex; }
  #inv-aire {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #inv-stage { display: block; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #inv-fermer {
    flex: 0 0 auto; margin-bottom: 12px;
    border: 0; border-radius: 14px; padding: 12px 26px;
    background: #453177; color: #e9dcff; font: bold 15px inherit; cursor: pointer;
  }
</style>
</head>
<body>

<div id="tout">
  <div id="aire"><canvas id="stage" width="240" height="240"></canvas></div>
  <div id="manette">
    <button type="button" data-cmd="gauche" aria-label="Gauche">◀</button>
    <button type="button" class="tourner" data-cmd="tourner" aria-label="Tourner">⟳</button>
    <button type="button" class="bas" data-cmd="bas" aria-label="Poser">POSER</button>
    <button type="button" data-cmd="droite" aria-label="Droite">▶</button>
    <button type="button" class="fee" data-cmd-aide aria-label="Appeler la fée">✦</button>
  </div>
  <div id="aide">← → pour déplacer · ↑ pour tourner · ↓ pour poser · Ctrl pour appeler la fée</div>
</div>

<button type="button" id="sac-but">🎒 sac</button>

<!-- Le menu de l'aventure (Menu.mt) : l'écran d'où tout part. -->
<div id="menu">
  <div id="menu-aire"><canvas id="menu-stage" width="240" height="240"></canvas></div>
  <div id="menu-pied">
    <button type="button" id="menu-sac">🎒 sac</button>
  </div>
</div>

<!-- L'inventaire, sur les dessins du jeu (Inventory.mt). -->
<div id="inventaire">
  <div id="inv-aire"><canvas id="inv-stage" width="240" height="240"></canvas></div>
  <button type="button" id="inv-fermer">retour au jeu</button>
</div>

<div id="chargement">
  <div>MINIPIXIZ</div>
  <div class="barre"><div id="jauge"></div></div>
</div>

<div id="fin">
  <div class="t" id="fin-titre">PERDU</div>
  <div class="s" id="fin-score"></div>
  <div class="s" id="fin-note"></div>
  <button type="button" id="rejouer">Rejouer</button>
  <button type="button" id="retour-menu">retour à la clairière</button>
</div>

<!-- La carte de la forêt : un relais par vingt niveaux franchis. -->
<div id="carte">
  <div class="t">LA FORÊT</div>
  <div class="s">Où reprendre ?</div>
  <div id="carte-liste"></div>
</div>

<script src="/minipixiz/engine.js"></script>
<script src="/minipixiz/items.js"></script>
<script src="/minipixiz/faerie.js"></script>
<script src="/minipixiz/combat.js"></script>
<script src="/minipixiz/nuit.js"></script>
<script src="/minipixiz/bassin.js"></script>
<script src="/minipixiz/langue.js"></script>
<script src="/minipixiz/missions.js"></script>
<script src="/minipixiz/lieux.js"></script>
<script src="/minipixiz/sorts.js"></script>
<script src="/minipixiz/game.js"></script>
<script src="/minipixiz/plateforme.js"></script>
<script src="/minipixiz/inventaire.js"></script>
<script src="/minipixiz/menu.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var P = window.MinipixizPlateforme;
  var sid = new URLSearchParams(location.search).get('sid') || '';
  var plateforme = new P.Plateforme(sid);
  var client = null;
  // base/Forest : une COURSE est une suite de niveaux. On gagne, on passe au
  // suivant sans quitter ; on perd, ou on atteint le relais suivant, et la
  // course s'arrête. C'est elle qu'on enregistre, pas chaque niveau.
  var course = null;

  function nouvelleCourse(depart) {
    course = {
      depart: depart || 0, niveau: depart || 0, niveaux: [], objets: [], entree: true,
      // base/Forest.endGame ferme la partie au premier multiple de vingt : une
      // course, c'est vingt niveaux, pas l'infini.
      fin: P.finDeCourse(depart || 0),
      // Une copie de travail de la fiche. Base.grab agit TOUT DE SUITE : le sac
      // ramassé au niveau 3 change ce qui tombe au niveau 4, sans attendre la
      // fin de la course. La vraie fiche, elle, n'est écrite qu'à la fin.
      carte: JSON.parse(JSON.stringify(plateforme.carte)),
    };
    lancerNiveau();
  }

  function lancerNiveau() {
    $('#fin').classList.remove('on');
    client.nouvellePartie({
      niveau: course.niveau,
      fiche: P.fiche(course.carte),
      fee: feeCourante(),
      coefNuit: coefNuit(),
    });
  }

  // Cm.getCurrentFaerie : la fée que le joueur emmène. Tant que le bassin n'est
  // pas porté, on prend la première de la fiche — et un compte qui n'en a
  // aucune joue sans, ce que le jeu autorise (fi.isReadyForBattle est faux).
  function feeCourante() {
    var l = plateforme.carte.$faerie || [];
    var i = plateforme.carte.$current;
    var fs = (i !== null && i !== undefined && l[i]) ? l[i] : l[0];
    // La fiche est passée en troisième : les globes et grimoires restés dans le
    // sac du joueur profitent aussi à la fée (FaerieInfo.initItems).
    return fs ? new window.MinipixizFee.Fee(fs, null, plateforme.carte) : null;
  }

  // Cm.getNightCoef : $time.$s sur une journée. Zéro à minuit, un demi à midi.
  function coefNuit() {
    var t = plateforme.carte.$time || {};
    var s = Number(t.$s);
    if (!isFinite(s) || s < 0) s = 0;
    return (s % 86400000) / 86400000;
  }

  function resume(r) {
    if (!r.enregistre) return sid ? 'Progression non enregistrée.' : 'Partie hors compte.';
    if (!r.gagnes.length) return 'Progression enregistrée.';
    return 'Album : ' + r.gagnes.length + ' objet' + (r.gagnes.length > 1 ? 's' : '') + ' de plus !';
  }

  fetch('/minipixiz/sprites/sprites.json')
    .then(function (r) { return r.json(); })
    .then(function (sprites) {
      return Promise.all([
        window.MinipixizClient.charger(sprites, function (p) {
          $('#jauge').style.width = Math.round(p * 100) + '%';
        }),
        plateforme.charger()
      ]).then(function () { return sprites; });
    })
    .then(function (sprites) {
      $('#chargement').style.display = 'none';

      client = new window.MinipixizClient.Client({
        canvas: $('#stage'),
        sprites: sprites,
        fee: feeCourante(),
        coefNuit: coefNuit(),
        surEvenement: function (nom, info) {
          if (nom === 'objet') {
            course.objets.push(info.type);
            P.ramasser(course.carte, info.type);
            return;
          }
          if (nom !== 'finPartie') return;

          if (info.gagne) {
            course.niveaux.push(course.niveau);
            course.niveau++;
            if (course.niveau < course.fin) {
              // La course continue : niveau suivant, sans quitter la forêt.
              $('#fin-titre').textContent = 'NIVEAU ' + info.niveau + ' TERMINÉ !';
              $('#fin-score').textContent = info.score + ' points';
              $('#fin-note').textContent = 'On enchaîne sur le niveau ' + (course.niveau + 1) + '…';
              $('#fin').classList.add('on');
              setTimeout(lancerNiveau, 1400);
              return;
            }
            // Relais atteint : base/Forest.endGame ferme la partie ici.
            var neuf = course.fin === (Number(plateforme.carte.$checkpoint) + 1) * P.PAS_CHECKPOINT;
            $('#fin-titre').textContent = neuf ? 'NOUVEAU RELAIS !' : 'RELAIS ATTEINT';
            terminer(info, neuf
              ? 'Vous pourrez repartir du niveau ' + (course.fin + 1) + '.'
              : 'Vous connaissiez déjà ce passage.');
            return;
          }

          $('#fin-titre').textContent = 'PERDU';
          terminer(info, '');
        }
      });

      // Fin de course — perdue ou menée jusqu'au relais. C'est le seul endroit
      // qui enregistre.
      function terminer(info, note) {
        $('#fin-score').textContent = 'niveau ' + (course.niveau + 1)
          + ' · ' + course.niveaux.length + ' niveau' + (course.niveaux.length > 1 ? 'x' : '')
          + ' franchi' + (course.niveaux.length > 1 ? 's' : '');
        $('#fin-note').textContent = note;
        $('#fin').classList.add('on');
        plateforme.enregistrer({
          niveaux: course.niveaux, dernier: course.niveau,
          objets: course.objets, entree: course.entree,
        }).then(function (r) {
          $('#fin-note').textContent = (note ? note + ' ' : '') + resume(r);
          window.__derniereSauvegarde = r;   // utile aux vérifications automatisées
        });
        if (window.parent !== window) {
          window.parent.postMessage({ minipixiz: 'fin', score: info.score,
            niveau: course.niveau, sid: sid }, '*');
        }
      }

      // ── La carte de la forêt (base/Forest.initCheckpoint) ──
      // Elle ne s'affiche que si un relais a été gagné : sans ça, il n'y a
      // qu'un départ possible et le jeu se lance directement.
      function ouvrirCarte() {
        var relais = plateforme.carteDesRelais();
        if (relais.length < 2) { nouvelleCourse(relais[0] ? relais[0].niveau : 0); return; }
        var liste = $('#carte-liste');
        liste.innerHTML = '';
        relais.forEach(function (r) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'relais';
          b.innerHTML = '<span class="n">' + r.affiche + '</span>'
            + '<span class="t">' + r.nom + '</span>';
          b.addEventListener('click', function () {
            $('#carte').classList.remove('on');
            nouvelleCourse(r.niveau);
          });
          liste.appendChild(b);
        });
        $('#fin').classList.remove('on');
        $('#carte').classList.add('on');
      }

      $('#rejouer').addEventListener('click', ouvrirCarte);

      // ── L'inventaire ──
      // Il travaille sur la VRAIE fiche : nourrir une fée ou lui faire porter un
      // gant se voit tout de suite dans la partie suivante. Chaque changement
      // part au serveur — on ne perd pas un repas parce qu'on a fermé l'onglet.
      var inventaire = new window.MinipixizInventaire.Inventaire({
        canvas: $('#inv-stage'),
        plateforme: plateforme,
        sprites: sprites,
        surChangement: function () {
          plateforme.ecrire(plateforme.carte);
          // La fée du plateau porte peut-être autre chose depuis tout à l'heure.
          client.poserFee(feeCourante());
        },
      });
      function ouvrirSac() {
        $('#inventaire').classList.add('on');
        inventaire.ouvrir();
      }
      $('#sac-but').addEventListener('click', ouvrirSac);
      $('#menu-sac').addEventListener('click', ouvrirSac);
      $('#inv-fermer').addEventListener('click', function () {
        $('#inventaire').classList.remove('on');
      });

      // ── Le menu de l'aventure ──
      // C'est lui l'écran d'accueil : on n'entre en forêt qu'en touchant la
      // forêt, comme dans le jeu. Les autres lieux existent et se voient — le
      // bassin s'allume, le donjon apparaît, l'arbre grandit — mais ils
      // renvoient un mot honnête tant qu'ils ne sont pas portés.
      var menu = new window.MinipixizMenu.Menu({
        canvas: $('#menu-stage'),
        plateforme: plateforme,
        sprites: sprites,
        surChoix: function (lieu, etat) {
          if (lieu.va === 'foret') { fermerMenu(); ouvrirCarte(); return; }
          if (lieu.va === 'inventaire') { ouvrirSac(); return; }
          if (lieu.va === 'dungeon') {
            if (!etat.ouvert) {
              menu.dire('Il vous faut une clé pour entrer dans le donjon.');
              return;
            }
            fermerMenu(); ouvrirLieu('Donjon'); return;
          }
          if (lieu.va === 'tree') { fermerMenu(); ouvrirLieu('Arbre'); return; }
          if (lieu.va === 'rainbow') {
            if (!plateforme.carte.$rainbow.$f) {
              menu.dire('Il n\'y a pas d\'arc-en-ciel aujourd\'hui.');
              return;
            }
            fermerMenu(); ouvrirLieu('ArcEnCiel'); return;
          }
          if (lieu.va === 'mission') { fermerMenu(); ouvrirGromelin(); return; }
          if (lieu.va === 'fountain') {
            if (!etat.ouvert) {
              menu.dire('Le bassin est calme. Aucune lueur au fond.');
              return;
            }
            fermerMenu();
            ouvrirBassin();
            return;
          }
          menu.dire(lieu.titre + ' : pas encore ouvert.');
        },
      });

      /**
       * base/Fountain — la descente au bassin.
       *
       * On n'y va pas pour marquer des points : on y va pour crever la bulle et
       * repartir avec la fée. La partie se joue sur la fiche RÉELLE, sans copie
       * de travail : libérer une fée est irréversible, et le jeu l'écrit tout
       * de suite.
       */
      function ouvrirBassin() {
        $('#carte').classList.remove('on');
        $('#fin').classList.remove('on');
        var bassin = client.nouveauBassin({
          carte: plateforme.carte,
          graine: Math.floor(Math.random() * 1e9),
          surEvenement: function (nom) {
            if (nom === 'feeLiberee') {
              plateforme.ecrire(plateforme.carte);
              client.poserFee(feeCourante());
              return;
            }
            if (nom !== 'feeEnvolee' && nom !== 'finPartie') return;
            // Qu'elle s'envole ou que la grille déborde, on remonte au menu.
            setTimeout(function () { ouvrirMenu(); }, 600);
          },
        });
        client.demarrer();
        return bassin;
      }

      /**
       * Le donjon, l'arbre creux, l'arc-en-ciel. Comme le bassin, ils se jouent
       * sur la fiche RÉELLE : la clé du donjon est prise à l'entrée, le record
       * de l'arbre et l'objet de l'arc-en-ciel sont acquis sur-le-champ.
       */
      function ouvrirLieu(classe) {
        $('#carte').classList.remove('on');
        $('#fin').classList.remove('on');
        var avant = JSON.parse(JSON.stringify(plateforme.carte));
        var l = client.nouveauLieu(classe, {
          carte: plateforme.carte,
          fee: (plateforme.carte.$faerie || [])[plateforme.carte.$current] || null,
          graine: Math.floor(Math.random() * 1e9),
          surEvenement: function (nom, info) {
            if (nom === 'donjonGagne' || nom === 'record' || nom === 'prix') {
              plateforme.ecrire(avant);
              return;
            }
            if (nom !== 'finPartie') return;
            plateforme.ecrire(avant);
            setTimeout(function () { ouvrirMenu(); }, 700);
          },
        });
        client.demarrer();
        return l;
      }

      /**
       * La cabane de Gromelin. Il ne travaille pas la nuit et n'a rien à
       * proposer sans missions ; sinon il ouvre, et il faut lui amener des fées
       * EN BOCAL — c'est sa seule exigence, et il la répète.
       */
      function ouvrirGromelin() {
        var M = window.MinipixizMissions;
        var a = M.accueil(plateforme.carte, coefNuit(), plateforme.carte.$help
          && plateforme.carte.$help[2]);
        ouvrirMenu();
        for (var i = 0; i < a.dial.length; i++) {
          (function (t, n) { setTimeout(function () { menu.dire(t); }, n * 1400); })(a.dial[i], i);
        }
        if (a.ouvre && !plateforme.carte.$help[2]) {
          plateforme.carte.$help[2] = 1;
          plateforme.ecrire(plateforme.carte);
        }
        window.__gromelin = a;
        return a;
      }

      function ouvrirMenu() {
        $('#menu').classList.add('on');
        menu.demarrer();
        // Ce que les nuits passées ont à raconter : la lueur du bassin, une fée
        // qui a faim, un donjon bâti. On les donne une par une, à chaque retour
        // au menu, comme Manager.addMsg les empilait.
        var msg = plateforme.messagesDeNuit;
        if (msg && msg.length) menu.dire(msg.shift());
      }
      function fermerMenu() {
        $('#menu').classList.remove('on');
        menu.arreter();
      }

      // Quitter une course ramène au menu, comme tryToClose.
      $('#rejouer').addEventListener('click', function () { $('#fin').classList.remove('on'); });
      $('#retour-menu').addEventListener('click', function () {
        $('#fin').classList.remove('on');
        $('#carte').classList.remove('on');
        ouvrirMenu();
      });

      ouvrirMenu();
      client.demarrer();

      ouvrirCarte();
      client.demarrer();

      window.minipixizClient = client;   // utile aux vérifications automatisées
      window.__plateforme = plateforme;
      window.__inventaire = inventaire;
      window.__menu = menu;
      window.__ouvrirMenu = ouvrirMenu;
      window.__ouvrirBassin = ouvrirBassin;
      window.__ouvrirLieu = ouvrirLieu;
      window.__ouvrirGromelin = ouvrirGromelin;
      window.__course = function () { return course; };
    })
    .catch(function (e) {
      $('#chargement').innerHTML = '<div>Chargement impossible</div><div style="font-size:11px">'
        + String(e && e.message || e) + '</div>';
    });
})();
</script>
</body>
</html>
