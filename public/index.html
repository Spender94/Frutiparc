<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frutiparc Portable UI (MVP)</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="identity-card">
        <div class="avatar">🫐</div>
        <div>
          <div class="username" id="username">kasparov</div>
          <div class="stats" id="stats">Niv 17 · 688 pts</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="chip" id="refreshBtn">Rafraîchir</button>
        <a class="chip" href="/legacy">Mode legacy</a>
      </div>
    </header>

    <nav class="dock" id="dock"></nav>

    <main class="desktop" id="desktopRoot">
      <div class="icon-layer" id="iconLayer"></div>

      <section class="chat-window" id="chatWindow">
        <div class="window-title" id="chatTitleBar">
          <span>Salon — Prototype portable</span>
          <div class="window-tools">
            <span class="muted" id="statusBadge">compte test · kasparov</span>
            <button class="tool" id="minBtn">—</button>
            <button class="tool" id="closeBtn">✕</button>
          </div>
        </div>

        <div class="window-content" id="chatContent">
          <aside class="left-avatars">
            <div class="avatar-card">🧑‍🎤</div>
            <div class="avatar-card">🫐</div>
          </aside>

          <section class="chat-feed" id="chatFeed"></section>

          <aside class="user-list" id="userList"></aside>
        </div>

        <footer class="composer" id="composer">
          <input id="messageInput" type="text" placeholder="Écrire un message…" />
          <button id="sendBtn">Envoyer</button>
        </footer>
      </section>
    </main>
  </div>

  <script src="/runtime-core.js"></script>
  <script src="/app.js"></script>
</body>
</html>
