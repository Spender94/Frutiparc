<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grapiz</title>
<!--
  Client natif Grapiz (placeholders — l'art vectoriel fidèle viendra en phase 5).
  Se connecte au WebSocket existant, s'identifie via ?sid=, puis parle le
  protocole <gz> (voir public/grapiz/server/net.js). Le plateau est mis en
  miroir depuis le serveur ; les coups jouables sont calculés localement avec
  engine.js (le MÊME moteur testé que le serveur) pour la surbrillance.
-->
<style>
  :root { --bg:#2b2f1d; --card:#3a4026; --ink:#eef3df; --pink:#f3a9a9; --green:#aacf86; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:Verdana,Geneva,sans-serif; }
  #app { max-width:560px; margin:0 auto; padding:12px; }
  h1 { font-size:18px; margin:6px 2px 12px; color:var(--green); }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:12px; }
  button { font-family:inherit; cursor:pointer; border:0; border-radius:9px;
    background:var(--pink); color:#7a2b3e; font-weight:bold; padding:7px 12px; }
  button.ghost { background:#55603a; color:var(--ink); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #ffffff14; }
  .row:last-child { border-bottom:0; }
  .row .grow { flex:1; }
  .muted { color:#cdd6b4; font-size:12px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:8px; background:#55603a; }
  #status { font-size:12px; color:#cdd6b4; margin:0 2px 10px; }
  /* Plateau */
  #board-wrap { position:relative; margin:6px auto; }
  .cell, .tok { position:absolute; transform:translate(-50%,-50%); border-radius:50%; }
  .cell { width:30px; height:30px; background:#0000002e; border:1px solid #ffffff20; }
  .cell.target { background:#aacf8655; border-color:var(--green); cursor:pointer; box-shadow:0 0 0 2px var(--green); }
  .tok { width:26px; height:26px; box-shadow:0 1px 2px #0006; cursor:pointer; }
  .tok.t0 { background:radial-gradient(circle at 35% 30%, #ffd27a, #d98b16); }
  .tok.t1 { background:radial-gradient(circle at 35% 30%, #9fd0ff, #2f6fb0); }
  .tok.sel { box-shadow:0 0 0 3px #fff, 0 1px 2px #0006; }
  #players-bar { display:flex; gap:10px; justify-content:space-between; margin-bottom:8px; }
  .pl { flex:1; display:flex; align-items:center; gap:8px; background:#55603a; border-radius:9px; padding:6px 9px; font-size:13px; }
  .pl.turn { outline:2px solid var(--green); }
  .pl .av { width:40px; height:40px; flex:0 0 auto; border-radius:8px; overflow:hidden; background:#0003; }
  .pl .av iframe { width:100%; height:100%; border:0; display:block; }
  .pl .info { min-width:0; }
  .pl .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl .clock { font-variant-numeric:tabular-nums; color:#fff; }
  .hidden { display:none; }
  #end-banner { text-align:center; font-size:16px; font-weight:bold; padding:10px; color:var(--green); }
</style>
</head>
<body>
<div id="app">
  <h1>Grapiz</h1>
  <div id="status">Connexion…</div>

  <!-- Lobby -->
  <div id="lobby" class="hidden">
    <div class="card">
      <div class="row">
        <div class="grow"><b>Parties</b></div>
        <button id="btn-create">Créer une partie</button>
      </div>
      <div id="games"></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow"><b>Joueurs en ligne</b></div></div>
      <div id="players"></div>
    </div>
    <div id="challenge-box"></div>
  </div>

  <!-- Partie -->
  <div id="game" class="hidden">
    <div id="players-bar"></div>
    <div id="board-wrap"></div>
    <div id="end-banner" class="hidden"></div>
    <div class="row" style="justify-content:flex-end;border:0">
      <button id="btn-part" class="ghost">Quitter la partie</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  var E = (window.Grapiz && window.Grapiz.engine);
  var $ = function (s) { return document.querySelector(s); };
  // sid : priorité à ?sid=, sinon on réutilise la session du client light
  // (même navigateur) pour tester sans copier le sid à la main.
  var sid = new URLSearchParams(location.search).get("sid") || "";
  if (!sid) {
    try { sid = (JSON.parse(localStorage.getItem("fp_light_session") || "{}") || {}).sid || ""; } catch (e) {}
  }

  var DEFAULT_BOUILLE = "000000010000000000000000";
  var state = {
    ws: null, user: "", myBouille: "", gotLobby: false,
    inGame: false, gameId: null, myTeam: -1, turn: -1, size: 4,
    tokens: [], players: [], ended: false,
    sel: null, targets: {},     // "x,y" → direction
    helloTimer: null, clockTimer: null, lastTick: {}, _barSig: "",
  };

  function setStatus(s) { $("#status").textContent = s; }

  // ── Connexion ──────────────────────────────────────────────────────────────
  function start() {
    if (!sid) { setStatus("Session manquante (?sid=)."); return; }
    fetch("/api/forum/me?sid=" + encodeURIComponent(sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.user) { setStatus("Session invalide."); return; }
        state.user = d.user;
        state.myBouille = d.bouille || DEFAULT_BOUILLE;
        connect();
      })
      .catch(function () { setStatus("Réseau indisponible."); });
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    var ws = new WebSocket(proto + "://" + location.host + "/");
    state.ws = ws;
    ws.onopen = function () {
      setStatus("Identification…");
      send('<k l="' + xml(state.user) + '" s="' + xml(sid) + '" />');
      // hello jusqu'à recevoir le lobby (l'identify serveur est asynchrone).
      state.helloTimer = setInterval(function () {
        if (state.gotLobby) { clearInterval(state.helloTimer); return; }
        send('<gz a="hello" n="' + xml(state.user) + '" f="' + xml(state.myBouille || DEFAULT_BOUILLE) + '" />');
      }, 600);
    };
    ws.onmessage = function (ev) { onData(ev.data); };
    ws.onclose = function () { setStatus("Connexion perdue."); };
    ws.onerror = function () { setStatus("Erreur de connexion."); };
  }

  function send(s) { try { if (state.ws && state.ws.readyState === 1) state.ws.send(s + "\0"); } catch (e) {} }
  function gz(attrs) {
    var s = "<gz";
    for (var k in attrs) s += " " + k + '="' + xml(attrs[k]) + '"';
    send(s + " />");
  }
  function xml(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Trames \0-terminées ; on ne traite que les <gz ...>.
  var buf = "";
  function onData(data) {
    buf += String(data);
    var parts = buf.split("\0");
    buf = parts.pop();
    parts.forEach(function (p) {
      p = p.trim();
      if (p.indexOf("<gz") === 0) handleGz(p);
    });
  }

  function handleGz(xmlStr) {
    var doc;
    try { doc = new DOMParser().parseFromString(xmlStr, "text/xml"); } catch (e) { return; }
    var el = doc.documentElement;
    if (!el || el.nodeName !== "gz") return;
    var e = el.getAttribute("e");
    if (e === "lobby") return onLobby(el);
    if (e === "challenged") return onChallenged(el);
    if (e === "start" || e === "move" || e === "state" || e === "end") return onGameState(el);
    if (e === "err") { setStatus("⚠ " + el.getAttribute("m")); return; }
    if (e === "sent") { setStatus("Défi envoyé à " + el.getAttribute("u") + "…"); return; }
    if (e === "declined") { setStatus(el.getAttribute("u") + " a décliné."); return; }
  }

  // ── Lobby ───────────────────────────────────────────────────────────────────
  function onLobby(el) {
    state.gotLobby = true;
    if (!state.inGame) { $("#lobby").classList.remove("hidden"); setStatus("Connecté — " + state.user); }
    var players = [], games = [];
    each(el.getElementsByTagName("pl"), function (n) {
      players.push({ u: n.getAttribute("u"), n: n.getAttribute("n"), s: n.getAttribute("s") });
    });
    each(el.getElementsByTagName("game"), function (n) {
      games.push({ id: n.getAttribute("id"), host: n.getAttribute("host"), c: +n.getAttribute("c"), m: +n.getAttribute("m") });
    });
    renderGames(games);
    renderPlayers(players);
  }

  function renderGames(games) {
    var box = $("#games"); box.innerHTML = "";
    if (!games.length) { box.innerHTML = '<div class="muted" style="padding:6px 0">Aucune partie ouverte. Crée-en une !</div>'; return; }
    games.forEach(function (g) {
      var row = div("row");
      row.innerHTML = '<div class="grow">Partie de <b>' + esc(g.host) + '</b> <span class="tag">' + g.c + "/" + g.m + "</span></div>";
      var b = document.createElement("button");
      b.textContent = "Rejoindre";
      b.onclick = function () { gz({ a: "join", g: g.id }); };
      if (g.host === state.user) b.disabled = true;
      row.appendChild(b); box.appendChild(row);
    });
  }

  function renderPlayers(players) {
    var box = $("#players"); box.innerHTML = "";
    players.forEach(function (p) {
      var row = div("row");
      row.innerHTML = '<div class="grow">' + esc(p.n || p.u) + ' <span class="tag">' + statusLabel(p.s) + "</span></div>";
      if (p.u !== state.user && p.s === "idle") {
        var b = document.createElement("button");
        b.textContent = "Défier";
        b.onclick = function () { gz({ a: "challenge", u: p.u }); };
        row.appendChild(b);
      }
      box.appendChild(row);
    });
  }
  function statusLabel(s) { return s === "playing" ? "en partie" : s === "waiting" ? "en attente" : "dispo"; }

  function onChallenged(el) {
    var c = el.getAttribute("c"), from = el.getAttribute("n") || el.getAttribute("u");
    var box = $("#challenge-box");
    var card = div("card");
    card.innerHTML = '<div class="row"><div class="grow"><b>' + esc(from) + "</b> te défie !</div></div>";
    var actions = div("row"); actions.style.justifyContent = "flex-end"; actions.style.border = "0";
    var ya = document.createElement("button"); ya.textContent = "Accepter";
    ya.onclick = function () { gz({ a: "accept", c: c }); box.innerHTML = ""; };
    var no = document.createElement("button"); no.className = "ghost"; no.textContent = "Refuser";
    no.onclick = function () { gz({ a: "decline", c: c }); box.innerHTML = ""; };
    actions.appendChild(ya); actions.appendChild(no);
    card.appendChild(actions); box.innerHTML = ""; box.appendChild(card);
  }

  $("#btn-create").onclick = function () { gz({ a: "create" }); };
  $("#btn-part").onclick = function () {
    gz({ a: "part" });
    leaveGame();
  };

  // ── Partie ───────────────────────────────────────────────────────────────────
  function onGameState(el) {
    state.inGame = true; state.gameId = el.getAttribute("g");
    state.size = +el.getAttribute("sz") || 4;
    state.turn = +el.getAttribute("turn");
    state.ended = el.getAttribute("end") === "1";
    state.tokens = [];
    each(el.getElementsByTagName("t"), function (n) {
      state.tokens.push({ team: +n.getAttribute("e"), x: +n.getAttribute("x"), y: +n.getAttribute("y") });
    });
    state.players = [];
    each(el.getElementsByTagName("p"), function (n) {
      var pl = { u: n.getAttribute("u"), n: n.getAttribute("n"), e: +n.getAttribute("e"), rt: +n.getAttribute("rt"), f: n.getAttribute("f") };
      if (pl.u === state.user) state.myTeam = pl.e;
      state.players.push(pl);
    });
    state.sel = null; state.targets = {};

    $("#lobby").classList.add("hidden");
    $("#game").classList.remove("hidden");
    renderBoard();
    renderPlayersBar();
    startClocks();

    if (state.ended) {
      var w = +el.getAttribute("w");
      var mine = w === state.myTeam;
      var who = state.players.filter(function (p) { return p.e === w; })[0];
      var banner = $("#end-banner");
      banner.classList.remove("hidden");
      banner.textContent = mine ? "🏆 Victoire !" : ("Partie terminée — " + (who ? (who.n || who.u) : "équipe " + w) + " gagne");
      banner.style.color = mine ? "var(--green)" : "var(--pink)";
      stopClocks();
    }
  }

  function leaveGame() {
    state.inGame = false; state.gameId = null; state.myTeam = -1; state._barSig = "";
    stopClocks();
    $("#game").classList.add("hidden");
    $("#end-banner").classList.add("hidden");
    $("#lobby").classList.remove("hidden");
    gz({ a: "list" });
  }

  // Géométrie hexagonale : (x,y) logique → pixels. Axes : +x = SO, +y = SE,
  // S = +x+y vers le bas. px = cx + K(y-x) ; py = cy + J((x+y) - 2·size).
  var CELL = 34, K = CELL * 0.866, J = CELL * 0.5, PAD = 26;
  function px(x, y) { return PAD + K * (state.size * 2) + K * (y - x); }
  function py(x, y) { return PAD + J * ((x + y)); }
  function boardPixelSize() {
    return { w: PAD * 2 + K * (state.size * 4), h: PAD * 2 + J * (state.size * 4) };
  }

  function renderBoard() {
    var wrap = $("#board-wrap"); wrap.innerHTML = "";
    var dim = boardPixelSize(); wrap.style.width = dim.w + "px"; wrap.style.height = dim.h + "px";

    // cases valides (cliquables)
    var b = curBoard();
    for (var x = 0; x <= state.size * 2; x++) {
      for (var y = 0; y <= state.size * 2; y++) {
        if (!b.isValid(new E.Coordinate(x, y))) continue;
        var c = div("cell");
        c.style.left = px(x, y) + "px"; c.style.top = py(x, y) + "px";
        c.dataset.xy = x + "," + y;
        var key = x + "," + y;
        if (state.targets[key] !== undefined) {
          c.classList.add("target");
          (function (xx, yy) { c.onclick = function () { doMove(xx, yy); }; })(x, y);
        }
        wrap.appendChild(c);
      }
    }
    // jetons
    state.tokens.forEach(function (t) {
      var d = div("tok t" + t.team);
      d.style.left = px(t.x, t.y) + "px"; d.style.top = py(t.x, t.y) + "px";
      if (state.sel && state.sel.x === t.x && state.sel.y === t.y) d.classList.add("sel");
      if (canControl() && t.team === state.myTeam) {
        (function (tt) { d.onclick = function () { selectToken(tt.x, tt.y); }; })(t);
      }
      wrap.appendChild(d);
    });
  }

  function curBoard() {
    return E.Board.fromDefinition({
      size: state.size,
      tokens: state.tokens.map(function (t) { return { t: t.team, x: t.x, y: t.y }; }),
    });
  }
  function canControl() { return !state.ended && state.turn === state.myTeam; }

  function selectToken(x, y) {
    if (!canControl()) return;
    state.sel = { x: x, y: y };
    state.targets = {};
    var moves = curBoard().availableMoves(new E.Coordinate(x, y));
    moves.forEach(function (m) { state.targets[m.target.x + "," + m.target.y] = m.direction; });
    renderBoard();
  }

  function doMove(tx, ty) {
    if (!state.sel) return;
    var d = state.targets[tx + "," + ty];
    if (d === undefined) return;
    gz({ a: "move", x: state.sel.x, y: state.sel.y, d: d });
    state.sel = null; state.targets = {};
  }

  // On (re)construit la barre — avec l'iframe de bouille — seulement quand
  // l'ensemble des joueurs/bouilles change (sinon le Flash se rechargerait à
  // chaque coup) ; sinon on ne met à jour que la surbrillance du tour.
  function renderPlayersBar() {
    var sig = state.players.map(function (p) { return p.u + ":" + (p.f || ""); }).join("|");
    if (sig !== state._barSig) { buildPlayersBar(); state._barSig = sig; }
    updatePlayersBarTurn();
  }
  function buildPlayersBar() {
    var bar = $("#players-bar"); bar.innerHTML = "";
    state.players.forEach(function (p) {
      var fb = (p.f && p.f.length >= 15) ? p.f : DEFAULT_BOUILLE;
      var d = div("pl"); d.dataset.team = p.e;
      d.innerHTML =
        '<div class="av"><iframe scrolling="no" sandbox="allow-scripts allow-same-origin" src="/bouille-preview.html?s=' +
          encodeURIComponent(fb) + '&bg=transparent"></iframe></div>' +
        '<div class="info"><div class="nm">' + esc(p.n || p.u) + (p.e === state.myTeam ? " (toi)" : "") + "</div>" +
        '<div class="clock" data-team="' + p.e + '">' + fmt(p.rt) + "</div></div>";
      bar.appendChild(d);
    });
  }
  function updatePlayersBarTurn() {
    each(document.querySelectorAll("#players-bar .pl"), function (d) {
      d.classList.toggle("turn", +d.dataset.team === state.turn && !state.ended);
    });
  }

  // Horloge locale : on décompte visuellement le joueur actif entre deux messages.
  function startClocks() {
    stopClocks();
    state.lastTick = {}; state.players.forEach(function (p) { state.lastTick[p.e] = p.rt; });
    var t0 = Date.now();
    state.clockTimer = setInterval(function () {
      if (state.ended) { stopClocks(); return; }
      var elapsed = Date.now() - t0;
      var nodes = document.querySelectorAll("#players-bar .clock");
      each(nodes, function (n) {
        var team = +n.getAttribute("data-team");
        var base = state.lastTick[team] || 0;
        var rt = team === state.turn ? Math.max(0, base - elapsed) : base;
        n.textContent = fmt(rt);
      });
    }, 250);
  }
  function stopClocks() { if (state.clockTimer) { clearInterval(state.clockTimer); state.clockTimer = null; } }
  function fmt(ms) { ms = Math.max(0, ms | 0); var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

  // ── utils DOM ────────────────────────────────────────────────────────────────
  function div(cls) { var d = document.createElement("div"); d.className = cls; return d; }
  function esc(s) { var d = document.createElement("div"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }

  if (!E) { setStatus("Moteur indisponible (engine.js)."); }
  else start();
})();
</script>
</body>
</html>
