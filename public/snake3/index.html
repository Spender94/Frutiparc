<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Frutisnake</title>
<!--
  Frutisnake — portage natif JS du jeu Flash de 2004 (700×480, cadence
  interne 32 i/s), fidèle aux sources AS2 (Games/snake3/). Les dessins sont
  les SVG extraits du SWF, les sons ses MP3, les polices ses fontes
  embarquées (Alba, les Verdana pixel, Lithograph).

  Au clavier : flèches (gauche/droite tournent, haut = turbo, bas = certaines
  options), ESPACE utilise l'option active, ÉCHAP met en pause. Au doigt : les
  deux virages et le turbo sous le pouce gauche, la flèche bas et la pause sous
  le droit — et un appui sur l'aire de jeu utilise l'option active, ce qui
  dispense d'un bouton pour elle.

  ?sid= pour la persistance plateforme (collection de fruits, record,
  préférences, score au classement, et le pack de Frutisnake).

  La scène fait 700×480 — un format PAYSAGE. La page se replie donc selon la
  forme de la fenêtre :

    · PAYSAGE (téléphone tourné, ou bureau) : le jeu est bridé par la HAUTEUR,
      il reste du vide sur les côtés. Les commandes s'y installent en colonnes,
      une par pouce, et le jeu prend toute la hauteur.
    · PORTRAIT : le jeu est bridé par la LARGEUR ; les commandes se rangent en
      ligne dessous et s'étirent sur toute la largeur.

  Le tableau de bord du pack, lui, n'est pas autour du jeu mais DEDANS : il
  agrandit la scène du côté où le jeu ne se sert de rien (sous la frutibarre en
  portrait, à droite en paysage). Voir pack.js.

  On ne FORCE pas le paysage : screen.orientation.lock() n'existe pas sur iOS
  et n'agit ailleurs qu'en plein écran — impossible depuis le cadre de /light.
  Le portrait reste donc pleinement jouable, et un bandeau discret propose une
  fois de tourner le téléphone.
-->
<style>
  @font-face { font-family: 'Alba'; src: url('/snake3/fontes/alba.woff') format('woff'); font-display: block; }
  @font-face { font-family: 'Verdana12St'; src: url('/snake3/fontes/verdana12.woff') format('woff'); font-display: block; }
  @font-face { font-family: 'Verdana12StB'; src: url('/snake3/fontes/verdana12b.woff') format('woff'); font-display: block; }
  @font-face { font-family: 'Verdana14St'; src: url('/snake3/fontes/verdana14.woff') format('woff'); font-display: block; }
  @font-face { font-family: 'Verdana10St'; src: url('/snake3/fontes/verdana10.woff') format('woff'); font-display: block; }
  @font-face { font-family: 'Lithograph'; src: url('/snake3/fontes/lithograph.woff') format('woff'); font-display: block; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ADE76B;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    font-family: Verdana, Arial, sans-serif;
  }

  /* ── PORTRAIT (et le défaut) : le jeu, puis les commandes ───────────────
     Le jeu est bridé par la LARGEUR ; ce qui reste sous lui va aux touches,
     qui s'étirent sur toute la largeur pour ne rien laisser de vide. */
  #tout {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  /* base 0, surtout pas `auto` : la base `auto` vaut la taille du canvas, que
     le jeu calcule lui-même depuis celle de #aire — les deux se poussaient
     l'un l'autre et la manette finissait hors de l'écran. #aire prend donc
     exactement ce qui reste, et le canvas se cale dessus. */
  #aire {
    flex: 1 1 0; min-height: 0; min-width: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; image-rendering: auto; }

  /* ── Les commandes : seulement au doigt (pointer coarse) ────────────────
     Cinq touches, pas six : le bouton « option » a disparu, un appui sur
     l'aire de jeu fait déjà le travail. Le turbo (flèche haut) rejoint les
     deux virages sous le pouce gauche ; la flèche bas et la pause vont au
     droit. Toutes s'étirent : rien de fixe, donc rien qui déborde d'un
     téléphone étroit ni qui laisse du vide sur un large. */
  #commandes { display: none; width: 100%; box-sizing: border-box; padding: 0 8px 8px;
               gap: 12px; align-items: stretch; }
  @media (pointer: coarse) { #commandes { display: flex; } }
  .cote { display: flex; gap: 8px; min-width: 0; }
  #cote-gauche { flex: 3 1 0; }
  #cote-droit { flex: 2 1 0; }
  .cote .bloc { display: flex; gap: 8px; min-width: 0; flex: 1 1 auto; }
  /* Les touches reprennent le décor du jeu : l'aplat #83ca22 de son cadre,
     cerné de blanc, glyphes blancs — les mêmes couleurs que la scène, pour
     que la manette ne soit pas une pièce rapportée. */
  .btn {
    flex: 1 1 0; min-width: 0;
    height: clamp(50px, 8.5vh, 76px);
    border: 3px solid #fff; border-radius: 14px;
    background: #83ca22; color: #fff;
    font: bold 22px Verdana, sans-serif;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .18);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap;
    touch-action: none;
  }
  .btn:active, .btn.presse { background: #a7de53; }
  /* La pause n'est pas une touche de jeu : plus petite, plus sombre, elle ne
     se prend pas pour la flèche bas sous le pouce. */
  #b-pause { flex: 0 1 auto; width: 36%; font-size: 13px; background: #6ba81b; }
  #b-pause:active, #b-pause.presse { background: #8cc93a; }

  /* ── PAYSAGE : le jeu est bridé par la HAUTEUR ──────────────────────────
     Les commandes passent sur les côtés — une colonne par pouce — et le jeu
     prend toute la hauteur. `display: contents` sort les deux côtés de leur
     boîte pour qu'ils deviennent, eux aussi, des colonnes de #tout. */
  @media (orientation: landscape) {
    #tout { flex-direction: row; gap: 6px; }
    #aire { width: auto; height: 100%; order: 5; }
    .cote { height: 100%; flex-direction: column; justify-content: center;
            padding: 0 4px; flex: 0 0 auto; }
    .cote .bloc { flex-direction: column; flex: 0 0 auto; }
    /* les parts 3/2 du portrait sont posées par identifiant : il faut les
       reprendre ici, une classe ne les emporterait pas. */
    #cote-gauche { order: 0; flex: 0 0 auto; }
    #cote-droit { order: 9; flex: 0 0 auto; }
    .btn { flex: 0 0 auto; width: 54px; height: clamp(42px, 14vh, 60px); font-size: 20px; }
    #b-pause { width: 54px; height: 34px; }
  }
  @media (orientation: landscape) and (pointer: coarse) { #commandes { display: contents; } }

  /* ── Le conseil de tourner le téléphone ─────────────────────────────────
     Une seule fois, en portrait et au doigt : forcer le paysage n'est pas
     possible (screen.orientation.lock n'existe pas sur iOS et n'agit ailleurs
     qu'en plein écran, hors de portée depuis le cadre de /light). En absolu
     et non en fixe : la page ne défile pas (body overflow hidden), et le
     positionnement fixe a de mauvaises surprises dans un cadre. */
  #tourne {
    display: none; position: absolute; z-index: 5;
    left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top));
    padding: 9px 12px; border-radius: 10px; border: 2px solid #4c7f1f;
    background: rgba(255, 255, 255, .93); color: #1c3a08;
    font: bold 12px Verdana, sans-serif; text-align: center; line-height: 1.35;
  }
  @media (orientation: portrait) and (pointer: coarse) { #tourne.montre { display: block; } }

  /* ── Le salon du Battle en ligne (enligne.js) ───────────────────────────
     Un panneau HTML posé exactement sur la scène (enligne.js le cale sur le
     rectangle du canevas et lui donne l'échelle --k) : une liste qui défile
     et des boutons, aux couleurs de la manette. Tout est en unités d'échelle
     pour suivre le jeu, du téléphone au grand écran. */
  #aire { position: relative; }
  #salon {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    --k: 1;
    box-sizing: border-box;
    padding: calc(118px * var(--k)) calc(60px * var(--k)) calc(14px * var(--k));
    display: flex; flex-direction: column; gap: calc(8px * var(--k));
    font-family: Verdana, Arial, sans-serif; color: #fff;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
    pointer-events: none;
  }
  #salon[hidden] { display: none; }
  #salon > * { pointer-events: auto; }
  #salon .sl-haut { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #salon .sl-titre { font-weight: bold; font-size: calc(15px * var(--k)); }
  #salon .sl-serie { font-size: calc(12px * var(--k)); color: #ffe36b; font-weight: bold; white-space: nowrap; }
  #salon .sl-btn {
    border: calc(3px * var(--k)) solid #fff; border-radius: calc(12px * var(--k));
    background: #83ca22; color: #fff; cursor: pointer;
    font: bold calc(15px * var(--k)) Verdana, sans-serif;
    padding: calc(9px * var(--k)) calc(12px * var(--k));
    text-shadow: 0 1px 0 rgba(0, 0, 0, .18);
  }
  #salon .sl-btn:active { background: #a7de53; }
  #salon .sl-chercher.sl-attend { background: #e0a51b; }
  #salon .sl-sous { font-size: calc(10px * var(--k)); opacity: .9; }
  #salon .sl-liste {
    flex: 1 1 0; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: calc(4px * var(--k));
    padding: calc(4px * var(--k)); border-radius: calc(10px * var(--k));
    background: rgba(0, 0, 0, .18);
  }
  #salon .sl-joueur {
    display: flex; align-items: center; gap: calc(8px * var(--k));
    border: calc(2px * var(--k)) solid rgba(255, 255, 255, .7); border-radius: calc(9px * var(--k));
    background: rgba(131, 202, 34, .85); color: #fff; cursor: pointer; text-align: left;
    font: calc(12px * var(--k)) Verdana, sans-serif;
    padding: calc(6px * var(--k)) calc(10px * var(--k));
  }
  #salon .sl-joueur:disabled { cursor: default; opacity: .75; }
  #salon .sl-joueur.sl-moi { background: rgba(70, 130, 20, .9); }
  #salon .sl-joueur.sl-playing { background: rgba(200, 80, 40, .75); }
  #salon .sl-joueur.sl-waiting { background: rgba(224, 165, 27, .85); }
  #salon .sl-nom { font-weight: bold; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #salon .sl-sr { color: #ffe36b; font-weight: bold; white-space: nowrap; }
  #salon .sl-statut { font-size: calc(10px * var(--k)); opacity: .9; white-space: nowrap; }
  #salon .sl-vide { text-align: center; padding: calc(12px * var(--k)); font-size: calc(12px * var(--k)); opacity: .8; }
  #salon .sl-etat { font-size: calc(10px * var(--k)); text-align: center; opacity: .9; min-height: 1.2em; }
  #salon .sl-retour { align-self: flex-start; font-size: calc(12px * var(--k)); padding: calc(6px * var(--k)) calc(10px * var(--k)); background: #6ba81b; }
</style>
</head>
<body>
<div id="tout">
  <div id="aire"><canvas id="scene" width="700" height="480"></canvas><div id="salon" hidden></div></div>
  <!-- Les commandes, en deux côtés : un par pouce. En portrait elles font une
       ligne sous le jeu, en paysage deux colonnes de part et d'autre. -->
  <div id="commandes">
    <div class="cote" id="cote-gauche">
      <div class="bloc">
        <div class="btn" data-touche="gauche">&#8630;</div>
        <div class="btn" data-touche="droite">&#8631;</div>
        <div class="btn" data-touche="haut">&#8593;</div>
      </div>
    </div>
    <div class="cote" id="cote-droit">
      <div class="bloc">
        <div class="btn" data-touche="bas">&#8595;</div>
        <div class="btn" id="b-pause" data-touche="echap">pause</div>
      </div>
    </div>
  </div>
</div>
<div id="tourne">Tourne ton téléphone : Frutisnake est bien plus grand en paysage.</div>

<script src="/snake3/const.js"></script>
<!-- Les lots de dessins (généré par scripts/build-snake3-lots.js) : sans lui,
     les SVG se chargent un par un. -->
<script src="/snake3/lots.js"></script>
<script src="/snake3/serpent.js"></script>
<script src="/snake3/niveau.js"></script>
<script src="/snake3/bonus.js"></script>
<script src="/snake3/partie.js"></script>
<script src="/snake3/bataille.js"></script>
<script src="/snake3/sons.js"></script>
<script src="/snake3/dessin.js"></script>
<script src="/snake3/plateforme.js"></script>
<script src="/snake3/rendu.js"></script>
<script src="/snake3/menu.js"></script>
<script src="/snake3/encyclo.js"></script>
<script src="/snake3/pack.js"></script>
<script src="/snake3/game.js"></script>
<!-- Le Battle en ligne : le fil avec le serveur, puis le salon et la bataille
     miroir (après game.js, dont ils reprennent l'écran de fin et l'arène). -->
<script src="/snake3/reseau.js"></script>
<script src="/snake3/enligne.js"></script>
<script>
(function () {
  'use strict';
  // La manette écrit dans un objet partagé que le jeu lit chaque image.
  var pad = {};
  document.querySelectorAll('#commandes .btn').forEach(function (b) {
    var touche = b.dataset.touche;
    var poser = function (v, ev) {
      ev.preventDefault();
      pad[touche] = v;
      b.classList.toggle('presse', v);
    };
    b.addEventListener('pointerdown', function (ev) { poser(true, ev); });
    b.addEventListener('pointerup', function (ev) { poser(false, ev); });
    b.addEventListener('pointercancel', function (ev) { poser(false, ev); });
    b.addEventListener('pointerleave', function (ev) { if (pad[touche]) poser(false, ev); });
    // …ET SUR LA FENÊTRE. Les quatre écouteurs ci-dessus sont posés SUR LE
    // BOUTON : si le bouton cesse d'être affiché pendant qu'on appuie — le
    // light met le panneau du jeu en `display:none` quand on va discuter —
    // aucun d'eux ne se déclenche, et la touche reste enfoncée pour toujours.
    var relacher = function () {
      if (!pad[touche]) return;
      pad[touche] = false;
      b.classList.remove('presse');
    };
    window.addEventListener('pointerup', relacher);
    window.addEventListener('pointercancel', relacher);
  });

  // Le conseil de tourner le téléphone : une fois par appareil, quelques
  // secondes, et il s'efface au premier appui. La feuille de style le garde
  // invisible ailleurs qu'en portrait tactile — le tourner le fait donc
  // disparaître de lui-même, ce qui est exactement ce qu'on demande.
  var banniere = document.getElementById('tourne');
  try {
    if (!localStorage.getItem('snake3.tourne')) {
      banniere.classList.add('montre');
      var cacher = function () {
        banniere.classList.remove('montre');
        try { localStorage.setItem('snake3.tourne', '1'); } catch (e) {}
      };
      banniere.addEventListener('pointerdown', cacher);
      setTimeout(cacher, 7000);
    }
  } catch (e) { /* stockage refusé : pas de conseil, pas de gêne */ }

  window.demarrerFrutisnake({ canvas: 'scene', pad: pad }).then(function (jeu) {
    // `relacherTout` vide le pavé côté jeu ; ici on dé-enfonce les boutons,
    // pour que l'écran dise la même chose que l'état.
    jeu.padReset = function () {
      document.querySelectorAll('#commandes .btn.presse').forEach(function (b) {
        b.classList.remove('presse');
      });
    };
    return window.SnakePack.monter(jeu);
  });
})();
</script>
</body>
</html>
