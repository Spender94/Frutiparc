<svg xmlns="http://www.w3.org/2000/svg" width="40" height="24" viewBox="0 0 40 24">
  <!-- Smiley Twirl — l'article 12 du stand Miniwave (dessin du SWF d'origine). -->
  <style>
    .t { animation: vrille 1.1s linear infinite; transform-origin: 22px 13px; }
    @keyframes vrille { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <image class="t" width="40" height="24" href="data:image/png;base64," style="image-rendering:pixelated"/>
</svg>