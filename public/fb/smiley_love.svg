<svg xmlns="http://www.w3.org/2000/svg" width="40" height="23" viewBox="0 0 40 23">
  <!-- Smiley Love — l'article 10 du stand Miniwave (dessin du SWF d'origine). -->
  <style>
    .b { animation: bat 0.9s ease-in-out infinite; transform-origin: 20px 14px; }
    @keyframes bat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.12); } 45% { transform: scale(1.04); } 60% { transform: scale(1.1); } }
  </style>
  <image class="b" width="40" height="23" href="data:image/png;base64," style="image-rendering:pixelated"/>
</svg>