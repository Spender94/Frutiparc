<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <!--
    LA VIGNETTE DE L'ARTICLE « Son temps viendra ».

    Aucun dessin nouveau : ce sont les dégradés du thème lui-même (le ciel, les
    nuages, la lune — cf. scripts/nuit-retouches.css et la constante
    CIEL_DE_NUIT de bureau-frutiz.js), sortis du CSS et posés dans un fichier
    pour que la boutique ait quelque chose à montrer. La vignette EST donc le
    produit, et non son illustration.
  -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(205 10% 20%)"/>
      <stop offset="1" stop-color="hsl(140 8% 9%)"/>
    </linearGradient>
    <radialGradient id="nuage-g" cx="24%" cy="8%" r="62%">
      <stop offset="0" stop-color="hsl(200 8% 30%)"/>
      <stop offset="1" stop-color="hsl(200 8% 30%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nuage-d" cx="70%" cy="40%" r="46%">
      <stop offset="0" stop-color="hsl(200 7% 25%)"/>
      <stop offset="1" stop-color="hsl(200 7% 25%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="hsl(52 12% 86%)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="hsl(52 12% 86%)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="150" height="150" fill="url(#ciel)"/>
  <rect width="150" height="150" fill="url(#nuage-g)"/>
  <rect width="150" height="150" fill="url(#nuage-d)"/>
  <circle cx="104" cy="46" r="40" fill="url(#halo)"/>
  <circle cx="104" cy="46" r="21" fill="hsl(52 12% 86%)"/>
</svg>
