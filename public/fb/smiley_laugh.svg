<svg xmlns="http://www.w3.org/2000/svg" width="40" height="22" viewBox="0 0 40 22">
  <!-- Smiley Laugh — l'article 11 du stand Miniwave (dessin du SWF d'origine). -->
  <style>
    .r { animation: rit 0.5s ease-in-out infinite; transform-origin: 20px 20px; }
    @keyframes rit { 0%, 100% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(-4deg) translateY(-1px); } 75% { transform: rotate(4deg) translateY(-1px); } }
  </style>
  <image class="r" width="40" height="22" href="data:image/png;base64," style="image-rendering:pixelated"/>
</svg>