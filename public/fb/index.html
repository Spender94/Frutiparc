<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Forum Frutiparc.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #ADE76B;
    color: #335511;
    padding: 12px;
  }
  .forum-shell {
    background: #fff;
    border-radius: 7px;
    overflow: hidden;
    padding: 6px;
  }
  a { color: #2C4A0F; text-decoration: none; }
  a:hover { text-decoration: underline; color: #2C4A0F; }

  /* Top close bar */
  .topbar {
    background: #fff;
    padding: 4px 10px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    border-bottom: 1px solid #eee;
    font-size: 11px;
  }
  .topbar .user-info {
    margin-right: auto;
    color: #2C4A0F;
    font-weight: bold;
    font-size: 11px;
  }
  .topbar .close-btn {
    background: #E3756A;
    color: #fff;
    padding: 3px 10px;
    border: none;
    cursor: pointer;
    font-family: Verdana, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
  }
  .topbar .close-btn:hover { background: #d2645a; }

  /* Forum-header (white zone with icon + orange title — phpBB subSilver style) */
  .forum-header {
    background: #fff;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .forum-header .bc-icon {
    width: 18px;
    height: 18px;
    vertical-align: middle;
  }
  .forum-header .title-link {
    color: #E3756A;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
  }
  .forum-header .title-link:hover { text-decoration: none; }

  /* Bottom green band */
  .green-band {
    background: #D6F7B5;
    height: 6px;
    line-height: 6px;
    font-size: 1px;
  }

  /* Breadcrumb (legacy — kept for the old top-of-page breadcrumb but now hidden) */
  .breadcrumb { display: none; }

  /* Column header (coral subSilver — th.thTop / thCornerL/R) */
  .tbl-header {
    background: #E3756A;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    display: flex;
    padding: 0;
    height: 25px;
    align-items: center;
    border: none;
    border-radius: 7px 7px 0 0;
  }
  .tbl-header .col-author {
    width: 130px;
    min-width: 130px;
    text-align: center;
    padding: 0 4px;
  }
  .tbl-header .col-main { flex: 1; text-align: left; padding: 0 8px; }
  .tbl-header .col-num { width: 60px; text-align: center; padding: 0 4px; white-space: nowrap; }
  .tbl-header .col-last { width: 170px; text-align: center; padding: 0 4px; white-space: nowrap; }

  /* Category header (catLeft — green) */
  .cat-header {
    background: #ADE76B;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: bold;
    color: #2C4A0F;
    height: 28px;
    line-height: 16px;
    letter-spacing: 1px;
  }
  .cat-header a { color: #2C4A0F; text-decoration: none; }
  .cat-header a:hover { color: #2C4A0F; text-decoration: underline; }

  /* Rows — D6F7B5 default; .row.row-alt for alternation */
  .row {
    display: flex;
    align-items: center;
    padding: 0 6px;
    background: #D6F7B5;
    min-height: 50px;
  }
  .row.row-alt { background: #C3EF93; }
  .row .icon { width: 56px; min-width: 56px; text-align: center; }
  .row .icon img.peach { width: 28px; height: 28px; vertical-align: middle; }
  .row .info { flex: 1; padding: 0 10px; }
  .row .info .title { font-weight: bold; font-size: 12px; color: #2C4A0F; }
  .row .info .title a { color: #2C4A0F; text-decoration: none; }
  .row .info .title a:hover { color: #2C4A0F; text-decoration: underline; }
  .row .info .desc {
    color: #335511;
    font-size: 11px;
    margin-top: 2px;
    font-weight: normal;
  }
  .row .info .moderator {
    color: #335511;
    font-size: 10px;
    margin-top: 2px;
  }
  .row .col-num {
    width: 60px;
    text-align: center;
    font-size: 10px;
    color: #335511;
  }
  .row .col-last {
    width: 170px;
    font-size: 10px;
    color: #335511;
    text-align: center;
    line-height: 1.5;
    white-space: nowrap;
  }
  .row .col-last a { color: #2C4A0F; text-decoration: none; }
  .row .col-last a:hover { color: #2C4A0F; text-decoration: underline; }
  .row .sticky-tag { color: #2C4A0F; font-weight: bold; }
  .row .locked-tag { color: #888; }

  .topic-row .info .author {
    font-size: 10px;
    color: #335511;
    margin-top: 1px;
  }
  .topic-row .info .author a { color: #2C4A0F; text-decoration: none; }
  .topic-row .info .author a:hover { text-decoration: underline; }

  /* Posts — phpBB 2.x subSilver style */
  .post {
    display: flex;
    background: #D6F7B5;
  }
  .post .post-author {
    width: 130px;
    min-width: 130px;
    padding: 10px 4px 10px 0;
    text-align: center;
    background: #D6F7B5;
    vertical-align: top;
  }
  .post .post-author .avatar {
    width: 90px;
    height: 90px;
    margin: 0 auto 6px auto;
    background: transparent;
    overflow: hidden;
    position: relative;
  }
  .post .post-author .avatar iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    pointer-events: none;
    background: transparent;
  }
  .post .post-author .username {
    font-weight: bold;
    font-size: 11px;
    color: #2C4A0F;
    word-break: break-all;
    margin-top: 4px;
  }
  .post .post-body {
    flex: 1;
    padding: 0;
    background: #D6F7B5;
  }
  .post.post-alt,
  .post.post-alt .post-body,
  .post.post-alt .post-author,
  .post.post-alt .post-header {
    background: #C3EF93;
  }
  .post .post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    background: #D6F7B5;
    font-size: 10px;
    color: #335511;
    min-height: 28px;
  }
  .post .post-header .post-info {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .post .post-header .post-icon {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #E3756A;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .post .post-header .actions { display: flex; gap: 4px; }
  .post .post-header .actions .act-btn {
    display: inline-block;
    padding: 2px 8px;
    font-size: 9px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    line-height: 1.4;
  }
  .act-btn-red,
  .act-btn-green,
  .act-btn-blue { background: #E3756A; }
  .act-btn-red:hover,
  .act-btn-green:hover,
  .act-btn-blue:hover { background: #d2645a; color: #fff; text-decoration: none; }
  .post .post-content {
    font-size: 12px;
    line-height: 1.6;
    color: #335511;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding: 10px 12px;
  }
  .post .post-edited {
    margin-top: 6px;
    padding: 0 12px 8px;
    font-size: 10px;
    font-style: italic;
    color: #5a8030;
  }

  /* Blockquote — phpBB subSilver: light green tint, no border */
  .post-content blockquote.quote {
    background: #EDFBDD;
    border: none;
    margin: 8px 4px;
    padding: 8px 12px;
    font-size: 11px;
    color: #335511;
    line-height: 125%;
    white-space: pre-wrap;
  }
  .post-content blockquote.quote .quote-author {
    font-weight: bold;
    font-size: 11px;
    margin-bottom: 4px;
    color: #2C4A0F;
  }
  .post-content a { color: #2C4A0F; text-decoration: none; }
  .post-content a:hover { text-decoration: underline; }
  .post-author .post-count {
    font-size: 10px;
    color: #335511;
    margin-top: 2px;
  }
  .post-author .role-badge {
    display: inline-block;
    background: #E3756A;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    padding: 1px 5px;
    border-radius: 2px;
    margin-top: 3px;
    text-transform: uppercase;
  }

  /* Toolbar above textareas (formatting buttons) */
  .bbcode-toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .bbcode-toolbar button {
    background: #ADE76B;
    border: 1px solid #2C4A0F;
    color: #2C4A0F;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: Verdana, sans-serif;
    border-radius: 2px;
    min-width: 28px;
  }
  .bbcode-toolbar button:hover { background: #C3EF93; }
  .bbcode-toolbar button.b { font-weight: bold; }
  .bbcode-toolbar button.i { font-style: italic; }
  .bbcode-toolbar button.u { text-decoration: underline; }

  /* Inline edit area */
  .post-edit-area textarea {
    width: 100%;
    height: 100px;
    padding: 5px 7px;
    font-size: 12px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    font-family: Verdana, sans-serif;
    background: #C3EF93;
    color: #2C4A0F;
    margin-bottom: 6px;
  }
  .post-edit-area .form-actions { display: flex; gap: 6px; }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: bold;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, Arial, sans-serif;
  }
  .btn-green { background: #E3756A; }
  .btn-green:hover { background: #d2645a; text-decoration: none; color: #fff; }
  .btn-orange { background: #E3756A; }
  .btn-orange:hover { background: #d2645a; text-decoration: none; color: #fff; }
  .btn-sm { padding: 3px 9px; font-size: 10px; }

  /* Pagination */
  .pagination {
    font-size: 11px;
    color: #2C4A0F;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .pagination a, .pagination span {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid #2C4A0F;
    background: #D6F7B5;
    color: #2C4A0F;
    text-decoration: none;
  }
  .pagination span.current {
    background: #C3EF93;
    color: #2C4A0F;
    font-weight: bold;
  }

  /* Form */
  .form-area {
    background: #D6F7B5;
    padding: 14px;
  }
  .form-area h3 {
    color: #2C4A0F;
    margin-bottom: 10px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }
  .form-area label {
    font-weight: bold;
    font-size: 11px;
    color: #2C4A0F;
    display: block;
    margin-bottom: 4px;
  }
  .form-area input[type="text"],
  .form-area textarea {
    width: 100%;
    padding: 5px 7px;
    font-size: 12px;
    border: none;
    margin-bottom: 10px;
    font-family: Verdana, Arial, sans-serif;
    background: #C3EF93;
    color: #2C4A0F;
  }
  .form-area textarea {
    height: 130px;
    resize: vertical;
  }
  .form-area .form-actions {
    display: flex;
    gap: 8px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: #fff;
  }

  /* Bottom filter/sort bar (phpBB-style) */
  .bottom-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 10px;
    background: #ADE76B;
    font-size: 10px;
    flex-wrap: wrap;
    gap: 6px;
    color: #2C4A0F;
  }
  /* Shell zone below bottom bar: pagination + reply + mod buttons */
  .shell-actions {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 8px 10px;
    background: #fff;
    flex-wrap: wrap;
    gap: 8px;
  }
  .shell-actions .pagination {
    padding: 0;
    border: none;
    background: transparent;
  }
  .bottom-bar select {
    font-size: 10px;
    font-family: Verdana, sans-serif;
    padding: 1px 3px;
    border: none;
    background: #C3EF93;
    color: #2C4A0F;
  }
  .bottom-bar .go-btn {
    background: #E3756A;
    color: #fff;
    border: none;
    padding: 2px 10px;
    font-size: 10px;
    cursor: pointer;
    font-family: Verdana, sans-serif;
    font-weight: bold;
  }

  /* Moderation bar */
  .mod-bar {
    display: flex;
    gap: 4px;
    padding: 6px 10px;
    background: #fff;
    flex-wrap: wrap;
  }
  .mod-bar .mod-btn {
    display: inline-block;
    padding: 3px 10px;
    font-size: 9px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    background: #E3756A;
  }
  .mod-bar .mod-btn:hover { background: #d2645a; }

  .forum-footer {
    text-align: center;
    padding: 8px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    color: #2C4A0F;
    background: #CCF599;
    margin-top: 10px;
    border-radius: 7px;
  }
  .forum-footer a { color: #444; text-decoration: underline; }

  .loading, .empty {
    text-align: center;
    padding: 24px;
    color: #335511;
    font-style: italic;
    background: #fff;
  }

  /* Folder icon for listing */
  .folder-icon {
    display: inline-block;
    width: 46px;
    height: 51px;
    vertical-align: middle;
  }
  /* Topic-row folder icon (smaller) */
  .topic-folder {
    display: inline-block;
    width: 19px;
    height: 18px;
    vertical-align: middle;
  }
  /* Image-only buttons (reply.gif, post.gif) */
  .img-btn {
    display: inline-block;
    text-decoration: none;
    line-height: 0;
  }
  .img-btn:hover { text-decoration: none; opacity: 0.85; }
  .img-btn img { display: inline-block; vertical-align: middle; border: none; }

</style>
</head>
<body>

<div class="forum-shell">
  <div class="topbar">
    <div class="user-info" id="user-info"></div>
    <button class="close-btn" onclick="closeForum()">Fermer</button>
  </div>
  <div class="forum-header" id="forum-header">
    <img class="bc-icon" src="/fb/ico.gif" alt="" width="18" height="18">
    <a class="title-link" href="#" id="header-title" onclick="navigate('index');return false">Forum Frutiparc.com</a>
  </div>
  <div id="app">
    <div class="loading">Chargement du forum...</div>
  </div>
  <div class="green-band">&nbsp;</div>
  <div class="breadcrumb" id="breadcrumb"></div>
</div>
<div class="forum-footer">
  Forum cr&eacute;&eacute; par <a href="https://www.phpbb.com">phpBB</a> &copy; 2001-2007.<br>
  Design Frutiparc &copy; <a href="https://www.motiontwin.com">Motion Twin</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const SID = params.get('sid') || '';
let currentUser = null;

function closeForum() {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.fp_closeFrame === 'function') {
      window.parent.fp_closeFrame(1);
      return;
    }
  } catch (e) {}
  window.close();
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderBBCode(s) {
  let out = escapeHtml(s);
  out = out.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>');
  out = out.replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>');
  out = out.replace(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>');
  out = out.replace(/\[s\]([\s\S]*?)\[\/s\]/gi, '<s>$1</s>');
  out = out.replace(/\[color=([^\]]+)\]([\s\S]*?)\[\/color\]/gi, '<span style="color:$1">$2</span>');
  out = out.replace(/\[size=(\d+)\]([\s\S]*?)\[\/size\]/gi, function(m, sz, txt) {
    var px = Math.min(Math.max(parseInt(sz, 10), 8), 32);
    return '<span style="font-size:' + px + 'px">' + txt + '</span>';
  });
  out = out.replace(/\[url=(https?:\/\/[^\s\]]+)\]([\s\S]*?)\[\/url\]/gi,
    '<a href="$1" target="_blank" rel="noopener">$2</a>');
  out = out.replace(/\[url\](https?:\/\/[^\s\[]+)\[\/url\]/gi,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\[(?:citation|quote)=([^\]]+)\]([\s\S]*?)\[\/(?:citation|quote)\]/gi,
    '<blockquote class="quote"><div class="quote-author">$1 a dit :</div>$2</blockquote>');
  out = out.replace(/\[(?:citation|quote)\]([\s\S]*?)\[\/(?:citation|quote)\]/gi,
    '<blockquote class="quote">$1</blockquote>');
  out = out.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

function renderBouillAvatar(bouille, username) {
  var s = String(bouille || '').replace(/[^0-9a-zA-Z]/g, '');
  if (!s || s.length < 2) s = '000000010000000000000000';
  return '<iframe src="/bouille-preview.html?s=' + encodeURIComponent(s)
    + '" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>';
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function formatDateShort(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  var months = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + '<br>' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

async function apiFetch(url, opts) {
  var sep = url.includes('?') ? '&' : '?';
  var r = await fetch(url + sep + 'sid=' + encodeURIComponent(SID), opts);
  return r.json();
}

function setBreadcrumb(parts) {
  // Update the forum-header title (subSilver style: "Forum Frutiparc.com > Section > Topic")
  var titleHtml = 'Forum Frutiparc.com';
  for (var i = 0; i < parts.length; i++) {
    titleHtml += ' &gt; ' + escapeHtml(parts[i].text);
  }
  var headerTitle = document.getElementById('header-title');
  if (headerTitle) headerTitle.innerHTML = titleHtml;
  document.getElementById('breadcrumb').innerHTML = '';
}

function navigate(view, id, extra) {
  if (view === 'index') loadIndex();
  else if (view === 'board') loadBoard(id, extra);
  else if (view === 'topic') loadTopic(id, extra);
  else if (view === 'newTopic') showNewTopicForm(id);
}

function pagination(total, perPage, currentPage, onclick) {
  var pages = Math.ceil(total / perPage);
  if (pages <= 1) return '<div class="pagination">Page 1 sur 1</div>';
  var html = '<div class="pagination">';
  html += 'Page ' + currentPage + ' sur ' + pages + '&nbsp;&mdash;&nbsp;';
  if (currentPage > 1) html += '<a href="#" onclick="' + onclick + '(' + (currentPage - 1) + ');return false">&laquo;</a>';
  for (var i = 1; i <= pages; i++) {
    if (i === currentPage) html += '<span class="current">' + i + '</span>';
    else if (i <= 3 || i >= pages - 2 || Math.abs(i - currentPage) <= 2)
      html += '<a href="#" onclick="' + onclick + '(' + i + ');return false">' + i + '</a>';
    else if (i === 4 && currentPage > 6) html += '<span>...</span>';
    else if (i === pages - 3 && currentPage < pages - 5) html += '<span>...</span>';
  }
  if (currentPage < pages) html += '<a href="#" onclick="' + onclick + '(' + (currentPage + 1) + ');return false">&raquo;</a>';
  html += '</div>';
  return html;
}

async function loadIndex() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';
  setBreadcrumb([]);

  var data = await apiFetch('/api/forum/index');
  if (!data.categories || data.categories.length === 0) {
    app.innerHTML = '<div class="empty">Le forum est vide pour le moment.</div>';
    return;
  }

  var html = '<div class="tbl-header"><span class="col-main">Forums</span><span class="col-num">Sujets</span><span class="col-num">Messages</span><span class="col-last">Dernier message</span></div>';

  for (var ci = 0; ci < data.categories.length; ci++) {
    var cat = data.categories[ci];
    html += '<div class="cat-header">' + escapeHtml(cat.name) + '</div>';
    for (var bi = 0; bi < cat.boards.length; bi++) {
      var b = cat.boards[bi];
      html += '<div class="row">';
      html += '<div class="icon"><img class="folder-icon" src="/fb/folder_big.gif" alt=""></div>';
      html += '<div class="info">';
      html += '<div class="title"><a href="#" onclick="navigate(\'board\',' + b.id + ');return false">' + escapeHtml(b.name) + '</a></div>';
      html += '<div class="desc">' + escapeHtml(b.description) + '</div>';
      html += '</div>';
      html += '<div class="col-num">' + b.topicCount + '</div>';
      html += '<div class="col-num">' + b.postCount + '</div>';
      html += '<div class="col-last">';
      if (b.lastActivity) {
        html += formatDateShort(b.lastActivity);
        if (b.lastActivityBy) html += '<br><a href="#">' + escapeHtml(b.lastActivityBy) + '</a> <img src="/fb/icon_latest_reply.gif" alt="" style="vertical-align:middle">';
      } else { html += '-'; }
      html += '</div>';
      html += '</div>';
    }
  }
  app.innerHTML = html;
}

var currentBoardId = null;
async function loadBoard(boardId, page) {
  page = page || 1;
  currentBoardId = boardId;
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';

  var data = await apiFetch('/api/forum/board/' + boardId + '?page=' + page);
  if (!data.board) { app.innerHTML = '<div class="empty">Forum introuvable.</div>'; return; }

  setBreadcrumb([{ text: data.board.name }]);

  var html = '<div class="tbl-header"><span class="col-main">' + escapeHtml(data.board.name) + '</span><span class="col-num">Rép.</span><span class="col-num">Vues</span><span class="col-last">Dernier message</span></div>';

  if (data.topics.length === 0) {
    html += '<div class="empty">Aucun sujet dans ce forum.</div>';
  }
  for (var ti = 0; ti < data.topics.length; ti++) {
    var t = data.topics[ti];
    html += '<div class="row topic-row' + (ti % 2 === 1 ? ' row-alt' : '') + '">';
    var topicIcon = 'folder.gif';
    if (t.isLocked) topicIcon = 'folder_lock.gif';
    else if (t.isSticky) topicIcon = 'folder_sticky.gif';
    else if (t.isAnnounce) topicIcon = 'folder_announce.gif';
    html += '<div class="icon"><img class="topic-folder" src="/fb/' + topicIcon + '" alt=""></div>';
    html += '<div class="info">';
    html += '<div class="title">';
    if (t.isSticky) html += '<span class="sticky-tag">Post-it: </span>';
    if (t.isLocked) html += '<span class="locked-tag">[verrouillé] </span>';
    html += '<a href="#" onclick="navigate(\'topic\',' + t.id + ');return false">' + escapeHtml(t.title) + '</a>';
    html += '</div>';
    html += '<div class="author">par <a href="#">' + escapeHtml(t.author) + '</a></div>';
    html += '</div>';
    html += '<div class="col-num">' + t.replyCount + '</div>';
    html += '<div class="col-num">' + t.viewCount + '</div>';
    html += '<div class="col-last">';
    html += formatDateShort(t.lastPostAt);
    if (t.lastPostBy) html += '<br><a href="#">' + escapeHtml(t.lastPostBy) + '</a> <img src="/fb/icon_latest_reply.gif" alt="" style="vertical-align:middle">';
    html += '</div>';
    html += '</div>';
  }

  html += '<div class="shell-actions">';
  html += pagination(data.total, data.perPage, data.page, 'boardPage');
  html += '<span>';
  if (currentUser) html += '<a href="#" onclick="navigate(\'newTopic\',' + boardId + ');return false" class="img-btn"><img src="/fb/post.gif" alt="Nouveau sujet"></a>';
  else html += '<span style="font-size:10px;color:#888">Connecte-toi depuis Frutiparc pour poster</span>';
  html += '</span>';
  html += '</div>';
  app.innerHTML = html;
}
function boardPage(p) { loadBoard(currentBoardId, p); }

var currentTopicId = null;
var currentTopicData = null;
async function loadTopic(topicId, page) {
  page = page || 1;
  currentTopicId = topicId;
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';

  var data = await apiFetch('/api/forum/topic/' + topicId + '?page=' + page);
  currentTopicData = data;
  if (!data.topic) { app.innerHTML = '<div class="empty">Sujet introuvable.</div>'; return; }

  setBreadcrumb([
    { text: data.topic.boardName, href: "navigate('board'," + data.topic.boardId + ");return false" },
    { text: data.topic.title },
  ]);

  // Column header: Auteur | Message
  var html = '<div class="tbl-header"><span class="col-author">Auteur</span><span class="col-main">Message</span></div>';

  for (var pi = 0; pi < data.posts.length; pi++) {
    var p = data.posts[pi];
    var isFirstPost = (pi === 0 && data.page === 1);
    var canEdit = currentUser && (p.author === currentUser);
    var canDelete = currentUser && (p.author === currentUser || data.currentIsMod);
    html += '<div class="post' + (pi % 2 === 1 ? ' post-alt' : '') + '" id="post-' + p.id + '">';
    html += '<div class="post-author">';
    html += '<div class="avatar">' + renderBouillAvatar(p.bouille, p.author) + '</div>';
    html += '<div class="username">' + escapeHtml(p.author) + '</div>';
    if (p.isModerator) html += '<div class="role-badge">Modérateur</div>';
    if (typeof p.postCount === 'number') html += '<div class="post-count">Messages : ' + p.postCount + '</div>';
    html += '</div>';
    html += '<div class="post-body">';
    html += '<div class="post-header">';
    html += '<div class="post-info"><span class="post-icon"></span> Posté le ' + formatDate(p.createdAt);
    if (isFirstPost) html += '&nbsp;&nbsp; Sujet du message: ' + escapeHtml(data.topic.title);
    html += '</div>';
    html += '<div class="actions">';
    if (canDelete) html += '<a href="#" class="act-btn act-btn-red" onclick="deletePost(' + p.id + ');return false">supprimer</a>';
    if (canEdit) html += '<a href="#" class="act-btn act-btn-green" onclick="editPost(' + p.id + ');return false">editer</a>';
    if (currentUser && !data.topic.isLocked) html += '<a href="#" class="act-btn act-btn-blue" onclick="quotePost(' + p.id + ',\'' + escapeHtml(p.author).replace(/'/g,"\\'") + '\');return false">citer</a>';
    html += '</div>';
    html += '</div>';
    html += '<div class="post-content" id="post-content-' + p.id + '" data-raw="' + escapeHtml(p.content) + '">' + renderBBCode(p.content) + '</div>';
    if (p.updatedAt) html += '<div class="post-edited">Ce message a été édité le ' + formatDate(p.updatedAt) + '</div>';
    html += '</div>';
    html += '</div>';
  }

  // Bottom filter bar (phpBB-style) — centered on green
  html += '<div class="bottom-bar">';
  html += '<span>Montrer les messages depuis: <select><option>Tous</option></select>';
  html += ' <select><option>Le plus ancien en premier</option><option>Le plus récent en premier</option></select>';
  html += ' <button class="go-btn">Aller</button></span>';
  html += '</div>';

  // Shell zone: pagination on left, action buttons on right
  html += '<div class="shell-actions">';
  html += pagination(data.total, data.perPage, data.page, 'topicPage');
  html += '<span>';
  if (currentUser && !data.topic.isLocked) html += '<a href="#" onclick="showReplyForm();return false" class="img-btn"><img src="/fb/reply.gif" alt="Répondre"></a> ';
  if (data.currentIsMod) {
    html += '<a href="#" class="act-btn act-btn-red" onclick="toggleSticky();return false">' + (data.topic.isSticky ? 'Retirer Post-it' : 'Post-it') + '</a> ';
    html += '<a href="#" class="act-btn act-btn-red" onclick="toggleLock();return false">' + (data.topic.isLocked ? 'Déverrouiller' : 'Verrouiller') + '</a> ';
  }
  if (currentUser && (data.topic.author === currentUser || data.currentIsMod)) {
    html += '<a href="#" class="act-btn act-btn-red" onclick="deleteTopic();return false">Supprimer</a>';
  }
  html += '</span>';
  html += '</div>';

  if (currentUser && !data.topic.isLocked) {
    html += '<div class="form-area" id="reply-form" style="display:none">';
    html += '<label>Répondre :</label>';
    html += bbcodeToolbarHtml('reply-content');
    html += '<textarea id="reply-content" placeholder="Votre message..."></textarea>';
    html += '<div class="form-actions"><button class="btn btn-green" onclick="submitReply()">Envoyer</button> <button class="btn btn-orange" onclick="document.getElementById(\'reply-form\').style.display=\'none\'">Annuler</button></div>';
    html += '</div>';
  }

  app.innerHTML = html;
}
function topicPage(p) { loadTopic(currentTopicId, p); }

function showReplyForm() {
  var f = document.getElementById('reply-form');
  if (f) { f.style.display = 'block'; document.getElementById('reply-content').focus(); }
}

function quotePost(postId, author) {
  var el = document.getElementById('post-content-' + postId);
  if (!el) return;
  var raw = el.getAttribute('data-raw') || el.textContent;
  var tmp = document.createElement('textarea');
  tmp.innerHTML = raw;
  var text = tmp.value;
  showReplyForm();
  var ta = document.getElementById('reply-content');
  ta.value = '[quote=' + author + ']\n' + text.trim() + '\n[/quote]\n\n';
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

async function submitReply() {
  var content = document.getElementById('reply-content').value.trim();
  if (!content) return;
  var data = await apiFetch('/api/forum/post', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topicId: currentTopicId, content: content, sid: SID }),
  });
  if (data.ok) {
    var totalAfter = (currentTopicData ? currentTopicData.total : 0) + 1;
    var lastPage = Math.ceil(totalAfter / 15);
    loadTopic(currentTopicId, lastPage);
  } else {
    alert('Erreur : ' + (data.error || 'inconnue'));
  }
}

function bbcodeToolbarHtml(targetId) {
  return '<div class="bbcode-toolbar">'
    + '<button type="button" class="b" onclick="bbWrap(\'' + targetId + '\',\'b\')" title="Gras">B</button>'
    + '<button type="button" class="i" onclick="bbWrap(\'' + targetId + '\',\'i\')" title="Italique">I</button>'
    + '<button type="button" class="u" onclick="bbWrap(\'' + targetId + '\',\'u\')" title="Souligné">U</button>'
    + '<button type="button" onclick="bbWrap(\'' + targetId + '\',\'s\')" title="Barré">S</button>'
    + '<button type="button" onclick="bbWrap(\'' + targetId + '\',\'quote\')" title="Citation">&laquo;&raquo;</button>'
    + '<button type="button" onclick="bbInsertUrl(\'' + targetId + '\')" title="Lien">URL</button>'
    + '<button type="button" onclick="bbInsertColor(\'' + targetId + '\')" title="Couleur">Couleur</button>'
    + '<button type="button" onclick="bbInsertSize(\'' + targetId + '\')" title="Taille">Taille</button>'
    + '</div>';
}

function bbWrap(targetId, tag) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end);
  var open = '[' + tag + ']', close = '[/' + tag + ']';
  ta.value = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.focus();
  var cursor = start + open.length + sel.length;
  ta.setSelectionRange(cursor, cursor);
}

function bbInsertUrl(targetId) {
  var url = prompt('URL :', 'https://');
  if (!url) return;
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end) || url;
  var insert = '[url=' + url + ']' + sel + '[/url]';
  ta.value = ta.value.substring(0, start) + insert + ta.value.substring(end);
  ta.focus();
  ta.setSelectionRange(start + insert.length, start + insert.length);
}

function bbInsertColor(targetId) {
  var color = prompt('Couleur (ex: red, #FF0000) :', 'red');
  if (!color) return;
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end);
  var open = '[color=' + color + ']', close = '[/color]';
  ta.value = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.focus();
  var cursor = start + open.length + sel.length;
  ta.setSelectionRange(cursor, cursor);
}

function bbInsertSize(targetId) {
  var size = prompt('Taille (8-32) :', '18');
  if (!size) return;
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end);
  var open = '[size=' + size + ']', close = '[/size]';
  ta.value = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.focus();
  var cursor = start + open.length + sel.length;
  ta.setSelectionRange(cursor, cursor);
}

function editPost(postId) {
  var contentEl = document.getElementById('post-content-' + postId);
  if (!contentEl) return;
  if (document.getElementById('edit-area-' + postId)) return;
  var raw = contentEl.getAttribute('data-raw') || contentEl.textContent;
  var tmp = document.createElement('textarea');
  tmp.innerHTML = raw;
  var original = tmp.value;

  var taId = 'edit-textarea-' + postId;
  var wrap = document.createElement('div');
  wrap.className = 'post-edit-area';
  wrap.id = 'edit-area-' + postId;
  wrap.innerHTML = bbcodeToolbarHtml(taId)
    + '<textarea id="' + taId + '"></textarea>'
    + '<div class="form-actions">'
    + '<button class="btn btn-green" onclick="submitEdit(' + postId + ')">Enregistrer</button>'
    + '<button class="btn btn-orange" onclick="cancelEdit(' + postId + ')">Annuler</button>'
    + '</div>';
  contentEl.style.display = 'none';
  contentEl.parentNode.insertBefore(wrap, contentEl.nextSibling);
  document.getElementById(taId).value = original;
  document.getElementById(taId).focus();
}

function cancelEdit(postId) {
  var wrap = document.getElementById('edit-area-' + postId);
  if (wrap) wrap.remove();
  var contentEl = document.getElementById('post-content-' + postId);
  if (contentEl) contentEl.style.display = '';
}

async function submitEdit(postId) {
  var ta = document.getElementById('edit-textarea-' + postId);
  if (!ta) return;
  var newContent = ta.value.trim();
  if (!newContent) { alert('Le message ne peut pas être vide.'); return; }
  var data = await apiFetch('/api/forum/post/' + postId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: newContent, sid: SID }),
  });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function deletePost(postId) {
  if (!confirm('Supprimer ce message ?')) return;
  var data = await apiFetch('/api/forum/post/' + postId, { method: 'DELETE' });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function toggleSticky() {
  if (!currentTopicId) return;
  var data = await apiFetch('/api/forum/topic/' + currentTopicId + '/sticky', { method: 'POST' });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function toggleLock() {
  if (!currentTopicId) return;
  var data = await apiFetch('/api/forum/topic/' + currentTopicId + '/lock', { method: 'POST' });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function deleteTopic() {
  if (!currentTopicId) return;
  if (!confirm('Supprimer ce sujet et tous ses messages ?')) return;
  var data = await apiFetch('/api/forum/topic/' + currentTopicId, { method: 'DELETE' });
  if (data.ok) navigate('board', data.boardId || (currentTopicData && currentTopicData.topic.boardId));
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

function showNewTopicForm(boardId) {
  setBreadcrumb([{ text: 'Nouveau sujet' }]);
  var app = document.getElementById('app');
  var html = '<div class="form-area">';
  html += '<h3>Nouveau sujet</h3>';
  html += '<label>Titre :</label>';
  html += '<input type="text" id="new-topic-title" maxlength="200" placeholder="Titre du sujet">';
  html += '<label>Message :</label>';
  html += bbcodeToolbarHtml('new-topic-content');
  html += '<textarea id="new-topic-content" placeholder="Votre message..." style="height:160px"></textarea>';
  html += '<div class="form-actions">';
  html += '<button class="btn btn-green" onclick="submitNewTopic(' + boardId + ')">Créer le sujet</button>';
  html += ' <button class="btn btn-orange" onclick="navigate(\'board\',' + boardId + ')">Annuler</button>';
  html += '</div></div>';
  app.innerHTML = html;
  document.getElementById('new-topic-title').focus();
}

async function submitNewTopic(boardId) {
  var title = document.getElementById('new-topic-title').value.trim();
  var content = document.getElementById('new-topic-content').value.trim();
  if (!title || !content) { alert('Titre et message requis.'); return; }
  var data = await apiFetch('/api/forum/topic', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ boardId: boardId, title: title, content: content, sid: SID }),
  });
  if (data.ok) navigate('topic', data.topicId);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function init() {
  try {
    var r = await fetch('/api/forum/me?sid=' + encodeURIComponent(SID));
    var data = await r.json();
    if (data && data.user) {
      currentUser = data.user;
      document.getElementById('user-info').textContent = 'Connecté : ' + currentUser;
    } else {
      document.getElementById('user-info').textContent = 'Non connecté';
    }
  } catch (e) {
    document.getElementById('user-info').textContent = "Erreur d'authentification";
  }
  loadIndex();
}

init();
</script>
