<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Forum Frutiparc.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #ADE76B;
    color: #335511;
    padding: 12px;
  }
  .forum-shell {
    background: #fff;
    border-radius: 7px;
    overflow: hidden;
    padding: 6px;
    border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF;
  }
  a { color: #2C4A0F; text-decoration: none; }
  a:hover { text-decoration: underline; color: #2C4A0F; }

  /* Top close bar */
  .topbar { display: none; }
  .topbar .user-info {
    margin-right: auto;
    color: #2C4A0F;
    font-weight: bold;
    font-size: 11px;
  }
  .topbar .close-btn {
    background: #E3756A;
    color: #fff;
    padding: 3px 10px;
    border: none;
    cursor: pointer;
    font-family: Verdana, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
  }
  .topbar .close-btn:hover { background: #d2645a; }

  /* Forum-header (white zone with icon + orange title — phpBB subSilver style) */
  .forum-header {
    background: #fff;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .forum-header .bc-icon {
    width: 18px;
    height: 18px;
    vertical-align: middle;
  }
  .forum-header .title-link {
    color: #E3756A;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
  }
  .forum-header .title-link:hover { text-decoration: none; }
  /* Breadcrumb parts inside the header title: each level is its own link so
     you can jump back to the sub-forum, not just the forum root. */
  .forum-header .title-link a { color: #E3756A; text-decoration: none; }
  .forum-header .title-link a:hover { text-decoration: underline; }
  .forum-header .title-link .bc-sep { color: #E3756A; font-weight: bold; }
  .forum-header .title-link .bc-current { color: #555; }

  /* Breadcrumb (legacy — hidden) */
  .breadcrumb { display: none; }

  /* Column header (coral subSilver — th.thTop / thCornerL/R) */
  .tbl-header {
    background: #E3756A;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    font-family: Arial, Verdana, sans-serif;
    display: flex;
    padding: 0;
    height: 25px;
    align-items: center;
    border: none;
    border-radius: 7px 7px 0 0;
  }
  .tbl-header .col-author {
    width: 110px;
    min-width: 110px;
    text-align: center;
    padding: 0 4px;
  }
  .tbl-header .col-main { flex: 1; text-align: left; padding: 0 8px; }
  .tbl-header .col-num { width: 60px; text-align: center; padding: 0 4px; white-space: nowrap; }
  .tbl-header .col-last { width: 170px; text-align: center; padding: 0 4px; white-space: nowrap; }

  /* Category header (catLeft — green) */
  .cat-header {
    background: #ADE76B;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: bold;
    color: #2C4A0F;
    height: 28px;
    line-height: 16px;
    letter-spacing: 1px;
  }
  .cat-header a { color: #2C4A0F; text-decoration: none; }
  .cat-header a:hover { color: #2C4A0F; text-decoration: underline; }

  /* Rows — D6F7B5 default; .row.row-alt for alternation */
  .row {
    display: flex;
    align-items: center;
    padding: 0 6px;
    background: #D6F7B5;
    min-height: 35px;
  }
  .row.row-alt { background: #C3EF93; }
  .row .icon { width: 56px; min-width: 56px; text-align: center; }
  .row .icon img.peach { width: 28px; height: 28px; vertical-align: middle; }
  /* Topic rows: tight icon column, no extra padding around the folder icon. */
  .topic-row .icon {
    width: 25px;
    min-width: 25px;
    padding: 0;
    text-align: left;
  }
  .topic-row .info { padding-left: 4px; }
  .row .info { flex: 1; }
  .row .info .title { font-weight: bold; font-size: 12px; color: #2C4A0F; }
  .row .info .title a { color: #2C4A0F; text-decoration: none; }
  .row .info .title a:hover { color: #2C4A0F; text-decoration: underline; }
  .row .info .desc {
    color: #335511;
    font-size: 11px;
    margin-top: 2px;
    font-weight: normal;
  }
  .row .info .moderator {
    color: #335511;
    font-size: 10px;
    margin-top: 2px;
  }
  .row .col-num {
    width: 60px;
    text-align: center;
    font-size: 10px;
    color: #335511;
  }
  .row .col-last {
    width: 170px;
    font-size: 10px;
    color: #335511;
    text-align: center;
    line-height: 1.5;
    white-space: nowrap;
  }
  .row .col-last a { color: #2C4A0F; text-decoration: none; }
  .row .col-last a:hover { color: #2C4A0F; text-decoration: underline; }
  .row .sticky-tag { color: #2C4A0F; font-weight: bold; }
  .row .locked-tag { color: #888; }

  .topic-row .info .author {
    font-size: 10px;
    color: #335511;
    margin-top: 1px;
  }
  .topic-row .info .author a { color: #2C4A0F; text-decoration: none; }
  .topic-row .info .author a:hover { text-decoration: underline; }

  /* Posts — phpBB 2.x subSilver style */
  .post {
    display: flex;
    background: #D6F7B5;
  }
  .post .post-author {
    padding: 6px 0;
    text-align: center;
    background: #D6F7B5;
    vertical-align: top;
  }
  .post .post-author .avatar {
    width: 90px;
    height: 90px;
    margin: 0 4px 6px 4px;
    background: transparent;
    overflow: hidden;
    position: relative;
    border-radius: 10px;
  }
  .post .post-author .avatar iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    pointer-events: none;
    background: transparent;
    border-radius: 10px;
  }
  .post .post-author .username {
    font-weight: bold;
    font-size: 11px;
    color: #2C4A0F;
    word-break: break-all;
    margin-top: 4px;
  }
  .post .post-body {
    flex: 1;
    padding: 0;
    background: #D6F7B5;
  }
  .post.post-alt,
  .post.post-alt .post-body,
  .post.post-alt .post-author,
  .post.post-alt .post-header {
    background: #C3EF93;
  }
  .post .post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #D6F7B5;
    font-size: 10px;
    color: #335511;
    min-height: 20px;
  }
  .post .post-header .post-info {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .post .post-header .post-icon {
    display: inline-block;
    width: 12px;
    height: 13px;
    background: url('/fb/icon_minipost.gif') no-repeat center center;
    flex-shrink: 0;
  }
  .post .post-header .actions { display: flex; gap: 4px; margin-top: 5px; padding-right: 14px; }
  .act-btn {
    display: inline-block;
    padding: 2px 8px;
    font-size: 9px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    line-height: 1.4;
  }
  .act-btn-red,
  .act-btn-green,
  .act-btn-blue { background: #E3756A; }
  .act-btn-red:hover,
  .act-btn-green:hover,
  .act-btn-blue:hover { background: #d2645a; color: #fff; text-decoration: none; }
  .post .post-content {
    font-size: 12px;
    line-height: 1.6;
    color: #335511;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding: 6px 8px;
  }
  .post .post-edited {
    margin-top: 6px;
    padding: 0 12px 8px;
    font-size: 10px;
    font-style: italic;
    color: #5a8030;
  }
  /* Signature de l'auteur, sous le message, séparée par un filet (comme phpBB) */
  .post .post-signature {
    margin: 10px 12px 4px;
    padding-top: 8px;
    border-top: 1px solid #cfe0a8;
    font-size: 11px;
    color: #5a7030;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .post .post-signature img.bb-img { max-height: 80px; }

  /* Blockquote — light green tint, soft border, author bolded above */
  .post-content blockquote.quote {
    background: #E2FACA;
    border: 1.5px solid #B6DD8B;
    /* margin: 8px 4px; */
    padding: 8px 12px;
    font-size: 11px;
    color: #335511;
    line-height: 125%;
    white-space: pre-wrap;
    border-radius: 5px;
  }
  .post-content .quote-author {
    font-weight: bold;
    font-size: 11px;
    margin: 8px 4px 2px;
    color: #143500;
  }
  .post-content a { color: #2C4A0F; text-decoration: none; }
  .post-content a:hover { text-decoration: underline; }

  /* Toolbar above textareas (formatting buttons) */
  .bbcode-toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .bbcode-toolbar button {
    background: #ADE76B;
    border: 1px solid #2C4A0F;
    color: #2C4A0F;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: Verdana, sans-serif;
    border-radius: 2px;
    min-width: 28px;
  }
  .bbcode-toolbar button:hover { background: #C3EF93; }
  .bbcode-toolbar button.b { font-weight: bold; }
  .bbcode-toolbar button.i { font-style: italic; }
  .bbcode-toolbar button.u { text-decoration: underline; }

  /* Inline pictos in posts */
  .picto-inline {
    display: inline-block;
    vertical-align: middle;
    max-width: 40px;
    max-height: 40px;
    margin: 0 2px;
  }
  /* Picto picker popup */
  .picto-picker {
    position: absolute;
    z-index: 100;
    background: #FFF9E5;
    border: 2px solid #2C4A0F;
    border-radius: 6px;
    padding: 8px;
    max-width: 340px;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .picto-picker img {
    width: 36px;
    height: 36px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #fff;
    object-fit: contain;
  }
  .picto-picker img:hover {
    border-color: #2C4A0F;
    background: #E8F5D4;
  }
  .picto-picker .picto-empty {
    font-size: 11px;
    color: #666;
    padding: 8px;
  }

  /* Pictos gallery page */
  .picto-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 0;
  }
  .picto-card {
    width: 80px;
    text-align: center;
    background: #FFF9E5;
    border: 1px solid #C8D89D;
    border-radius: 6px;
    padding: 6px;
  }
  .picto-card img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    display: block;
    margin: 0 auto 4px;
  }
  .picto-card .picto-name {
    font-size: 10px;
    color: #2C4A0F;
    word-break: break-word;
    line-height: 1.2;
  }
  .picto-card .picto-game {
    font-size: 9px;
    color: #888;
  }
  .picto-gallery-section {
    margin-bottom: 14px;
  }
  .picto-gallery-section h4 {
    margin: 8px 0 4px;
    color: #2C4A0F;
    font-size: 12px;
    border-bottom: 1px solid #C8D89D;
    padding-bottom: 2px;
  }

  /* Consecration banner */
  .consecration-banner {
    background: linear-gradient(135deg, #f0fbe0, #d8efb1);
    border: 1px solid #8fc63f;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .consecration-banner .conse-title {
    font-size: 12px;
    font-weight: bold;
    color: #2C4A0F;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .consecration-banner .conse-pct {
    font-size: 18px;
    color: #4a7a10;
  }
  .consecration-banner .conse-bar {
    height: 10px;
    background: #fff;
    border: 1px solid #8fc63f;
    border-radius: 5px;
    overflow: hidden;
    margin: 6px 0 8px;
  }
  .consecration-banner .conse-fill {
    height: 100%;
    background: linear-gradient(90deg, #8fc63f, #4a7a10);
    transition: width .4s ease;
  }
  .consecration-banner .conse-games {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
  }
  .consecration-banner .conse-game {
    background: #fff;
    border: 1px solid #c8d89d;
    border-radius: 4px;
    padding: 4px 8px;
    color: #2C4A0F;
  }
  .consecration-banner .conse-game b {
    color: #4a7a10;
  }
  .consecration-banner .conse-note {
    font-size: 10px;
    color: #5a8a20;
    margin-top: 6px;
    font-style: italic;
  }
  .picto-bbcode-hint {
    font-size: 11px;
    color: #555;
    background: #F5F0DC;
    border: 1px solid #DDD7B5;
    border-radius: 4px;
    padding: 6px 10px;
    margin: 8px 0;
  }
  .picto-bbcode-hint code {
    background: #fff;
    padding: 1px 4px;
    border-radius: 2px;
    font-size: 11px;
  }

  /* Inline edit area */
  .post-edit-area textarea {
    width: 100%;
    height: 100px;
    padding: 5px 7px;
    font-size: 12px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    font-family: Verdana, sans-serif;
    background: #C3EF93;
    color: #2C4A0F;
    margin-bottom: 6px;
  }
  .post-edit-area .form-actions { display: flex; gap: 6px; }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: bold;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, Arial, sans-serif;
  }
  .btn-green { background: #E3756A; }
  .btn-green:hover { background: #d2645a; text-decoration: none; color: #fff; }
  .btn-orange { background: #E3756A; }
  .btn-orange:hover { background: #d2645a; text-decoration: none; color: #fff; }
  .btn-sm { padding: 3px 9px; font-size: 10px; }

  /* Pagination */
  .pagination {
    font-size: 11px;
    color: #2C4A0F;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .pagination a, .pagination span {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid #2C4A0F;
    background: #D6F7B5;
    color: #2C4A0F;
    text-decoration: none;
  }
  .pagination span.current {
    background: #C3EF93;
    color: #2C4A0F;
    font-weight: bold;
  }

  /* Form */
  .form-area {
    background: #D6F7B5;
    padding: 14px;
  }
  .form-area h3 {
    color: #2C4A0F;
    margin-bottom: 10px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }
  .form-area label {
    font-weight: bold;
    font-size: 11px;
    color: #2C4A0F;
    display: block;
    margin-bottom: 4px;
  }
  .form-area input[type="text"],
  .form-area textarea {
    width: 100%;
    padding: 5px 7px;
    font-size: 12px;
    border: 1px solid #555;
    margin-bottom: 10px;
    font-family: Verdana, Arial, sans-serif;
    background: #ffffff;
    color: #2C4A0F;
  }
  .form-area textarea {
    height: 130px;
    resize: vertical;
  }
  .form-area .form-actions {
    display: flex;
    gap: 8px;
  }

  /* Bouille selector */
  .bouille-selector {
    margin-bottom: 10px;
  }
  .bouille-selector label {
    margin-bottom: 6px;
  }
  .bouille-selector-body {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .bouille-preview-box {
    width: 90px;
    height: 90px;
    border: 1.5px solid #2E3C1E;
    border-radius: 4px;
    background: #E8F8D3;
    flex-shrink: 0;
    overflow: hidden;
  }
  .bouille-preview-box iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .bouille-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .bouille-option-group label {
    font-size: 10px;
    margin-bottom: 2px;
    font-weight: bold;
    color: #2C4A0F;
  }
  .expression-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .expression-grid .expr-btn {
    padding: 2px 7px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    background: #C3EF93;
    border: 1px solid #2E3C1E;
    color: #2C4A0F;
    cursor: pointer;
    border-radius: 3px;
  }
  .expression-grid .expr-btn:hover {
    background: #ADE76B;
  }
  .expression-grid .expr-btn.active {
    background: #E3756A;
    color: #fff;
    border-color: #c05040;
  }
  .acc-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .acc-grid .acc-btn {
    padding: 2px 7px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    background: #C3EF93;
    border: 1px solid #2E3C1E;
    color: #2C4A0F;
    cursor: pointer;
    border-radius: 3px;
  }
  .acc-grid .acc-btn:hover {
    background: #ADE76B;
  }
  .acc-grid .acc-btn.active {
    background: #E3756A;
    color: #fff;
    border-color: #c05040;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: #fff;
  }

  /* Bottom filter/sort bar (phpBB-style) */
  .bottom-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 10px;
    background: #ADE76B;
    font-size: 10px;
    flex-wrap: wrap;
    gap: 6px;
    color: #2C4A0F;
    border-radius: 0 0 7px 7px;
  }
  /* Shell zone below bottom bar: reply (left) + pagination (center) + mod buttons (right) */
  .shell-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #fff;
    flex-wrap: wrap;
    gap: 8px;
  }
  .shell-actions .shell-left,
  .shell-actions .shell-right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .shell-actions .shell-right { justify-content: flex-end; }
  .shell-actions .shell-center {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
  }
  .shell-actions .pagination {
    padding: 0;
    border: none;
    background: transparent;
  }
  .bottom-bar select {
    font-size: 10px;
    font-family: Verdana, sans-serif;
    padding: 1px 3px;
    border: none;
    background: #C3EF93;
    color: #2C4A0F;
  }
  .bottom-bar .go-btn {
    background: #E3756A;
    color: #fff;
    border: none;
    padding: 2px 10px;
    font-size: 10px;
    cursor: pointer;
    font-family: Verdana, sans-serif;
    font-weight: bold;
  }

  /* Moderation bar */
  .mod-bar {
    display: flex;
    gap: 4px;
    padding: 6px 10px;
    background: #fff;
    flex-wrap: wrap;
  }
  .mod-bar .mod-btn {
    display: inline-block;
    padding: 3px 10px;
    font-size: 9px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
    background: #E3756A;
  }
  .mod-bar .mod-btn:hover { background: #d2645a; }

  .forum-footer {
    text-align: center;
    padding: 8px;
    font-size: 10px;
    font-family: Verdana, Arial, sans-serif;
    color: #2C4A0F;
    background: #CCF599;
    margin-top: 10px;
    border-radius: 7px;
  }
  .forum-footer a { color: #444; text-decoration: underline; }

  .loading, .empty {
    text-align: center;
    padding: 24px;
    color: #335511;
    font-style: italic;
    background: #fff;
  }

  /* Folder icon for listing */
  .folder-icon {
    display: inline-block;
    width: 46px;
    height: 51px;
    vertical-align: middle;
  }
  /* Topic-row folder icon (smaller) */
  .topic-folder {
    display: inline-block;
    width: 19px;
    height: 18px;
    vertical-align: middle;
  }
  /* Image-only buttons (reply.gif, post.gif) */

<script>
const params = new URLSearchParams(window.location.search);
const SID = params.get('sid') || '';
let currentUser = null;
let myBouille = null;
let mySignature = '';   // signature de forum (BBCode), éditable via le bouton « Ma signature »
let myAccessories = [];
let myDefaultAccessories = [];
// Mute status (totoche) for the logged-in user. When true, the topic page
// and editor pre-disable the "Répondre" button so users don't compose a
// message that will be rejected on submit. Server still enforces.
let myMuted = false;
let myMutedUntilDisplay = null;
let myBanned = false;
let myBannedUntilDisplay = null;
let myBannedPermanent = false;

// Moods ("humeur") = the famille SWF's emoteList indices (0-7); see
// bouille-preview.html. Each maps to an eye+mouth combo. Labels for 3/5/6/7
// are best-guess from the shapes — adjust freely.
const EXPRESSIONS = [
  { id: 0, name: 'Neutre' },
  { id: 1, name: 'Colère' },
  { id: 2, name: 'Triste' },
  { id: 3, name: 'Sourire' },
  { id: 4, name: 'Joie' },
  { id: 5, name: 'Déterminé' },
  { id: 6, name: 'Embarrassé' },
  { id: 7, name: 'Totoché' },
];

function encode62(n, len) {
  if (!len) len = 2;
  var chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (n === 0) { var r = ''; while (r.length < len) r = '0' + r; return r; }
  var ret = '';
  while (n > 0) {
    ret = chars[n % 62] + ret;
    n = Math.floor(n / 62);
  }
  while (ret.length < len) ret = '0' + ret;
  return ret;
}

function decode62(s) {
  var r = 0, m = 1;
  for (var i = s.length - 1; i >= 0; i--) {
    var c = s.charAt(i);
    var v = c === c.toLowerCase() ? parseInt(c, 36) : parseInt(c.toLowerCase(), 36) + 26;
    r += v * m; m *= 62;
  }
  return r;
}

function buildBouilleState(base, accSuffix9) {
  var s = String(base || '000000010000000000000000');
  while (s.length < 24) s += '0';
  var prefix = s.substring(0, 15);
  var acc = accSuffix9 || s.substring(15, 24);
  return prefix + acc;
}

// An "incarnation" is an owned accessory whose stored value is a FULL 24-char
// bouille with a non-standard family (chars 0-1 ≠ "00"/"01", i.e. famille ≥ 2).
// A normal accessory only swaps the last 9 chars onto the user's own bouille;
// selecting an incarnation replaces the whole bouille — family included — so it
// renders via /fbouille_patched/famille<N>.swf.
function isIncarnationValue(v) {
  return typeof v === 'string' && v.length === 24
    && v.substring(0, 2) !== '00' && v.substring(0, 2) !== '01';
}

// State for the current selection: a full incarnation when one is picked,
// otherwise the user's base bouille + the chosen accessory suffix.
function resolveBouilleState(sel) {
  if (sel && sel.fullState) return String(sel.fullState);
  return buildBouilleState(myBouille, sel && sel.accSuffix9);
}

function getBouillePreviewHtml(state, emote) {
  var s = String(state || '').replace(/[^0-9a-zA-Z]/g, '');
  if (!s || s.length < 2) s = '000000010000000000000000';
  var q = 's=' + encodeURIComponent(s);
  if (emote != null && Number(emote) > 0) q += '&e=' + encodeURIComponent(Number(emote));
  return '<iframe src="/bouille-preview.html?' + q +
    '" sandbox="allow-scripts allow-same-origin"></iframe>';
}

var _activeBouilleSel = {};

function bouilleSetExpression(formId, mouthId) {
  _activeBouilleSel[formId] = _activeBouilleSel[formId] || {};
  _activeBouilleSel[formId].mouthId = mouthId;
  refreshBouillePreview(formId);
  // Re-render the grid so each thumbnail also shows the new mouth.
  var grid = document.getElementById('bouille-grid-' + formId);
  if (grid) grid.innerHTML = renderBouilleGrid(formId);
  // Keep the dropdown in sync (also when called programmatically).
  var sel = document.getElementById('expr-sel-' + formId);
  if (sel && sel.value !== String(mouthId)) sel.value = String(mouthId);
}

// Build the merged accessory list (defaults + custom) for a form.
function getAllAccessories() {
  var allAcc = [];
  var seen = {};
  // Make sure "Normal" appears first.
  var normal = null;
  for (var j = 0; j < myDefaultAccessories.length; j++) {
    var d = myDefaultAccessories[j];
    if (d.suffix === '000000000' || /normal/i.test(d.name)) {
      normal = { name: 'Normal', suffix: d.suffix || '000000000' };
    } else {
      allAcc.push({ name: d.name, suffix: d.suffix });
    }
    seen[d.suffix] = true;
  }
  if (!normal) normal = { name: 'Normal', suffix: '000000000' };
  for (var k = 0; k < myAccessories.length; k++) {
    var a = myAccessories[k];
    if (!a.value || a.value.length !== 24) continue;
    if (isIncarnationValue(a.value)) {
      // Keyed by the full value (not the suffix) so an incarnation isn't
      // deduped against a normal accessory that shares the same suffix.
      if (!seen['inc:' + a.value]) {
        allAcc.push({ name: a.name, suffix: a.value.substring(15, 24), fullState: a.value });
        seen['inc:' + a.value] = true;
      }
    } else {
      var sfx = a.value.substring(15, 24);
      if (!seen[sfx]) { allAcc.push({ name: a.name, suffix: sfx }); seen[sfx] = true; }
    }
  }
  return [normal].concat(allAcc);
}

// Track bouille selector pagination per-form.
var BOUILLE_PER_PAGE = 8;
var _bouillePage = {};

// The mood ("humeur") is a SEPARATE input from the bouille string — an emote
// (eye/mouth animation, 0-7) passed to bouille-preview as `e`, NOT baked into
// the avatar code. _activeBouilleSel[formId].mouthId holds the chosen emote.
function getCurrentMood(formId) {
  var m = (_activeBouilleSel[formId] || {}).mouthId;
  return (m != null && Number(m) >= 0) ? Number(m) : 0;
}

function refreshBouillePreview(formId) {
  var sel = _activeBouilleSel[formId] || {};
  var state = resolveBouilleState(sel);
  var box = document.getElementById('bouille-preview-' + formId);
  if (box) box.innerHTML = getBouillePreviewHtml(state, sel.mouthId);
  // Update inline preview avatar at the top of the editor too
  var preview = document.getElementById('editor-preview-avatar-' + formId);
  if (preview) preview.innerHTML = getBouillePreviewHtml(state, sel.mouthId);
}

function getCurrentBouilleState(formId) {
  // Just the 24-char avatar state; the mood travels separately (getCurrentMood)
  // so it can't corrupt a physical-feature slot of the string.
  return resolveBouilleState(_activeBouilleSel[formId] || {});
}

function bouilleNavPage(formId, delta) {
  var all = getAllAccessories();
  var pages = Math.max(1, Math.ceil(all.length / BOUILLE_PER_PAGE));
  var cur = _bouillePage[formId] || 0;
  cur = Math.max(0, Math.min(pages - 1, cur + delta));
  _bouillePage[formId] = cur;
  var grid = document.getElementById('bouille-grid-' + formId);
  if (grid) grid.innerHTML = renderBouilleGrid(formId);
  var nav = document.getElementById('bouille-nav-' + formId);
  if (nav) nav.innerHTML = renderBouilleNavLinks(formId);
}

function renderBouilleNavLinks(formId) {
  var all = getAllAccessories();
  var pages = Math.max(1, Math.ceil(all.length / BOUILLE_PER_PAGE));
  var cur = _bouillePage[formId] || 0;
  var prev = cur > 0
    ? '<a href="#" onclick="bouilleNavPage(\'' + formId + '\',-1);return false">&lt; bouilles précédentes</a>'
    : '<span class="disabled">&lt; bouilles précédentes</span>';
  var next = cur < pages - 1
    ? '<a href="#" onclick="bouilleNavPage(\'' + formId + '\',1);return false">bouilles suivantes &gt;</a>'
    : '<span class="disabled">bouilles suivantes &gt;</span>';
  return prev + ' | ' + next;
}

function renderBouilleGrid(formId) {
  var all = getAllAccessories();
  var cur = _bouillePage[formId] || 0;
  var slice = all.slice(cur * BOUILLE_PER_PAGE, (cur + 1) * BOUILLE_PER_PAGE);
  var sel = _activeBouilleSel[formId] || {};
  var selectedSuffix = sel.accSuffix9 != null ? sel.accSuffix9 : '000000000';
  var html = '';
  for (var i = 0; i < slice.length; i++) {
    var ac = slice[i];
    var thumbState = ac.fullState ? ac.fullState : buildBouilleState(myBouille, ac.suffix);
    var isSel = ac.fullState
      ? (ac.fullState === sel.fullState)
      : (!sel.fullState && ac.suffix === selectedSuffix);
    var checked = isSel ? ' checked' : '';
    var radioId = 'bouille-r-' + formId + '-' + i;
    html += '<label class="bouille-item" for="' + radioId + '">';
    html += '<div class="b-thumb">' + getBouillePreviewHtml(thumbState, sel.mouthId) + '</div>';
    html += '<div class="b-name">' + escapeHtml(ac.name) + '</div>';
    html += '<input type="radio" class="b-radio" id="' + radioId + '" name="bouille-' + formId + '" '
      + 'onchange="bouilleSetAccessoryRadio(\'' + formId + '\',\'' + escapeHtml(ac.suffix) + '\',\'' + escapeHtml(ac.fullState || '') + '\')"' + checked + '>';
    html += '</label>';
  }
  return html;
}

function bouilleSetAccessoryRadio(formId, suffix9, fullState) {
  _activeBouilleSel[formId] = _activeBouilleSel[formId] || {};
  _activeBouilleSel[formId].accSuffix9 = suffix9;
  _activeBouilleSel[formId].fullState = fullState || null;
  refreshBouillePreview(formId);
}

// Expression dropdown that mirrors the original "Méchant / Souriant / …" menu.
function expressionSelectHtml(formId) {
  var sel = _activeBouilleSel[formId] || {};
  var current = sel.mouthId != null ? sel.mouthId : 0;
  var html = '<select class="editor-select" id="expr-sel-' + formId + '" '
    + 'onchange="bouilleSetExpression(\'' + formId + '\', Number(this.value))">';
  for (var i = 0; i < EXPRESSIONS.length; i++) {
    var e = EXPRESSIONS[i];
    var s = (Number(current) === e.id) ? ' selected' : '';
    html += '<option value="' + e.id + '"' + s + '>' + escapeHtml(e.name) + '</option>';
  }

}

function bouilleSelHtml(formId) {
  _bouillePage[formId] = 0;
  _activeBouilleSel[formId] = { accSuffix9: '000000000', mouthId: null, fullState: null };
  var all = getAllAccessories();
  var html = '';

  // Sujet row is rendered by the caller; this returns the rows below it.
  // Bouille pagination links (separate row between Sujet and Frutibouille).

  html += '<div class="bouille-nav" id="bouille-nav-' + formId + '">' + renderBouilleNavLinks(formId) + '</div>';
  html += '</div></div>';

  // Frutibouille (N) row with grid of 8 thumbnails.
  html += '<div class="editor-row">';
  html += '<div class="editor-label-cell">Frutibouille (' + all.length + ')</div>';
  html += '<div class="editor-value-cell">';
  html += '<div class="bouille-grid" id="bouille-grid-' + formId + '">' + renderBouilleGrid(formId) + '</div>';

  html += '<div class="editor-row">';
  html += '<div class="editor-label-cell">Expression de la bouille</div>';
  html += '<div class="editor-value-cell">' + expressionSelectHtml(formId) + '</div>';
  html += '</div>';

  return html;
}

// Navigate back to the mobile chat (/light), carrying the sid so the session
// resumes without a new login. Used by the "‹ Salons" link shown when the
// forum was opened from /light.
function backToChat() {
  var sid = new URLSearchParams(window.location.search).get('sid') || '';
  window.location.href = '/light' + (sid ? ('?sid=' + encodeURIComponent(sid)) : '');
}

function closeForum() {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.fp_closeFrame === 'function') {
      window.parent.fp_closeFrame(1);
      return;
    }
  } catch (e) {}
  // If opened from the mobile chat, go back there instead of a no-op close
  // (window.close() is ignored for normally-navigated tabs on mobile).
  if (new URLSearchParams(window.location.search).get('from') === 'light') {
    backToChat();
    return;
  }
  window.close();
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderBBCode(s) {
  let out = escapeHtml(s);
  out = out.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>');
  out = out.replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>');
  out = out.replace(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>');
  out = out.replace(/\[s\]([\s\S]*?)\[\/s\]/gi, '<s>$1</s>');
  out = out.replace(/\[color=([^\]]+)\]([\s\S]*?)\[\/color\]/gi, '<span style="color:$1">$2</span>');
  // Support both English [size=N] and French [taille=N], like the original.
  var sizeReplacer = function(m, sz, txt) {
    var px = Math.min(Math.max(parseInt(sz, 10), 8), 32);
    return '<span style="font-size:' + px + 'px">' + txt + '</span>';
  };
  out = out.replace(/\[size=(\d+)\]([\s\S]*?)\[\/size\]/gi, sizeReplacer);
  out = out.replace(/\[taille=(\d+)\]([\s\S]*?)\[\/taille\]/gi, sizeReplacer);
  out = out.replace(/\[url=(https?:\/\/[^\s\]]+)\]([\s\S]*?)\[\/url\]/gi,
    '<a href="$1" target="_blank" rel="noopener">$2</a>');
  out = out.replace(/\[url\](https?:\/\/[^\s\[]+)\[\/url\]/gi,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // [img]URL[/img] → inline image. The URL is constrained to http(s) or a
  // root-relative path (our own /forum-uploads/…); the content was already
  // HTML-escaped above and the charset excludes quotes/brackets/angles, so the
  // src can't break out of the attribute or smuggle a javascript: scheme.
  out = out.replace(/\[img\]\s*((?:https?:\/\/|\/)[^\s\[\]"'<>]+?)\s*\[\/img\]/gi,
    '<img class="bb-img" src="$1" alt="image" loading="lazy">');
  // Trim the newline right after [quote] and right before [/quote] so the
  // \n→<br> pass below doesn't add an empty line at the top/bottom of the
  // blockquote. Also swallow the first newline after [/quote] so the
  // blockquote isn't followed by a hardcoded <br>.
  out = out.replace(/\[(?:citation|quote)=([^\]]+)\]\n?([\s\S]*?)\n?\[\/(?:citation|quote)\]\n?/gi,
    '<div class="quote-author">$1 a dit :</div><blockquote class="quote">$2</blockquote>');
  out = out.replace(/\[(?:citation|quote)\]\n?([\s\S]*?)\n?\[\/(?:citation|quote)\]\n?/gi,
    '<blockquote class="quote">$1</blockquote>');
  // [code] blocks — handled before linkification so URLs inside stay literal.
  out = out.replace(/\[code\]([\s\S]*?)\[\/code\]/gi, function(m, txt) {
    return '<pre class="bb-code">' + txt + '</pre>';
  });
  // [liste]...[/liste] with [*] items.
  out = out.replace(/\[liste\]([\s\S]*?)\[\/liste\]/gi, function(m, body) {
    var items = body.split(/\s*\[\*\]\s*/).map(function(s) { return s.trim(); }).filter(Boolean);
    return '<ul class="bb-list">' + items.map(function(it) { return '<li>' + it + '</li>'; }).join('') + '</ul>';
  });
  out = out.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  out = out.replace(/\[picto=([^\]]+)\]/gi, function(m, id) {
    var safeId = id.replace(/[<>"'&]/g, '');
    var url = '/api/picto/' + encodeURIComponent(safeId);
    return '<img class="picto-inline" src="' + url + '" alt="' + safeId + '" title="' + safeId + '">';
  });
  // Inline emoticons (whitespace-bounded). Built lazily from EMOTICONS so the
  // editor button row and the post renderer stay in sync. Order matters:
  // longer codes are matched first so ":smile:" doesn't get partially eaten
  // by a shorter alternative.
  out = replaceEmoticonsInline(out);
  out = out.replace(/\n/g, '<br>');
  return out;
}

function renderBouillAvatar(bouille, username, mood) {
  var s = String(bouille || '').replace(/[^0-9a-zA-Z]/g, '');
  if (!s || s.length < 2) s = '000000010000000000000000';
  var q = 's=' + encodeURIComponent(s);
  if (mood != null && Number(mood) > 0) q += '&e=' + encodeURIComponent(Number(mood));
  return '<iframe src="/bouille-preview.html?' + q
    + '" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>';
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function formatDateShort(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  var months = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

async function apiFetch(url, opts) {
  var sep = url.includes('?') ? '&' : '?';
  var r = await fetch(url + sep + 'sid=' + encodeURIComponent(SID), opts);
  return r.json();
}

function setBreadcrumb(parts) {
  // Render the forum-header title as a real breadcrumb (subSilver style:
  // "Forum Frutiparc.com > Section > Topic"). Each part that carries an href
  // is a clickable link — so clicking the sub-forum (e.g. "Frutiz") returns
  // to THAT board's listing, not the forum root. The current/last level is
  // plain text.
  var headerTitle = document.getElementById('header-title');
  if (headerTitle) {
    var html = '<a href="#" onclick="navigate(\'index\');return false">Forum Frutiparc.com</a>';
    for (var i = 0; i < parts.length; i++) {
      html += ' <span class="bc-sep">&gt;</span> ';
      if (parts[i].href) {
        html += '<a href="#" onclick="' + parts[i].href + '">' + escapeHtml(parts[i].text) + '</a>';
      } else {
        html += '<span class="bc-current">' + escapeHtml(parts[i].text) + '</span>';
      }
    }
    headerTitle.innerHTML = html;
  }
  var bc = document.getElementById('breadcrumb');
  if (bc) bc.innerHTML = '';
}

function navigate(view, id, extra) {
  if (view === 'index') loadIndex();
  else if (view === 'board') loadBoard(id, extra);
  else if (view === 'topic') loadTopic(id, extra);
  else if (view === 'newTopic') showNewTopicForm(id);
  else if (view === 'pictos') loadPictos();
}

function pagination(total, perPage, currentPage, onclick) {
  var pages = Math.ceil(total / perPage);
  if (pages <= 1) return '<div class="pagination">Page 1 sur 1</div>';
  var html = '<div class="pagination">';
  html += 'Page ' + currentPage + ' sur ' + pages + '&nbsp;&mdash;&nbsp;';
  if (currentPage > 1) html += '<a href="#" onclick="' + onclick + '(' + (currentPage - 1) + ');return false">&laquo;</a>';
  for (var i = 1; i <= pages; i++) {
    if (i === currentPage) html += '<span class="current">' + i + '</span>';
    else if (i <= 3 || i >= pages - 2 || Math.abs(i - currentPage) <= 2)
      html += '<a href="#" onclick="' + onclick + '(' + i + ');return false">' + i + '</a>';
    else if (i === 4 && currentPage > 6) html += '<span>...</span>';
    else if (i === pages - 3 && currentPage < pages - 5) html += '<span>...</span>';
  }
  if (currentPage < pages) html += '<a href="#" onclick="' + onclick + '(' + (currentPage + 1) + ');return false">&raquo;</a>';
  html += '</div>';
  return html;
}

async function loadIndex() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';
  setBreadcrumb([]);

  var data = await apiFetch('/api/forum/index');
  if (!data.categories || data.categories.length === 0) {
    app.innerHTML = '<div class="empty">Le forum est vide pour le moment.</div>';
    return;
  }

  var html = '<div class="tbl-header"><span class="col-main">Forums</span><span class="col-num">Sujets</span><span class="col-num">Messages</span><span class="col-last">Dernier message</span></div>';

  for (var ci = 0; ci < data.categories.length; ci++) {
    var cat = data.categories[ci];
    html += '<div class="cat-header">' + escapeHtml(cat.name) + '</div>';
    for (var bi = 0; bi < cat.boards.length; bi++) {
      var b = cat.boards[bi];
      html += '<div class="row">';
      var boardIcon = b.unread ? 'folder_big_new.png' : 'folder_big.gif';
      html += '<div class="icon"><img class="folder-icon" src="/fb/' + boardIcon + '" alt=""></div>';
      html += '<div class="info">';
      html += '<div class="title"><a href="#" onclick="navigate(\'board\',' + b.id + ');return false">' + escapeHtml(b.name) + '</a></div>';
      html += '<div class="desc">' + escapeHtml(b.description) + '</div>';
      html += '</div>';
      html += '<div class="col-num">' + b.topicCount + '</div>';
      html += '<div class="col-num">' + b.postCount + '</div>';
      html += '<div class="col-last">';
      if (b.lastActivity) {
        html += formatDateShort(b.lastActivity);
        if (b.lastActivityBy) html += '<br><a href="#">' + escapeHtml(b.lastActivityBy) + '</a> <img src="/fb/icon_latest_reply.gif" alt="" style="vertical-align:middle">';
      } else { html += '-'; }
      html += '</div>';
      html += '</div>';
    }
  }
  app.innerHTML = html;
}

var currentBoardId = null;
async function loadBoard(boardId, page) {
  page = page || 1;
  currentBoardId = boardId;
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';

  var data = await apiFetch('/api/forum/board/' + boardId + '?page=' + page);
  if (!data.board) { app.innerHTML = '<div class="empty">Forum introuvable.</div>'; return; }

  setBreadcrumb([{ text: data.board.name }]);

  var html = '<div class="tbl-header"><span class="col-main">' + escapeHtml(data.board.name) + '</span><span class="col-num">Rép.</span><span class="col-num">Vues</span><span class="col-last">Dernier message</span></div>';

  if (data.topics.length === 0) {
    html += '<div class="empty">Aucun sujet dans ce forum.</div>';
  }
  for (var ti = 0; ti < data.topics.length; ti++) {
    var t = data.topics[ti];
    html += '<div class="row topic-row' + (ti % 2 === 1 ? ' row-alt' : '') + '">';
    // Unread topics use folder_new.gif. Lock/sticky/announce keep their own
    // icon because there are no _new variants to swap to and the status
    // markers are more important to surface than the unread state.
    var topicIcon = t.unread ? 'folder_new.gif' : 'folder.gif';
    if (t.isLocked) topicIcon = 'folder_lock.gif';
    else if (t.isSticky) topicIcon = 'folder_sticky.gif';
    else if (t.isAnnounce) topicIcon = 'folder_announce.gif';
    html += '<div class="icon"><img class="topic-folder" src="/fb/' + topicIcon + '" alt=""></div>';
    html += '<div class="info">';
    html += '<div class="title">';
    if (t.isSticky) html += '<span class="sticky-tag">Post-it: </span>';
    if (t.isLocked) html += '<span class="locked-tag">[verrouillé] </span>';
    html += '<a href="#" onclick="navigate(\'topic\',' + t.id + ');return false">' + escapeHtml(t.title) + '</a>';
    html += '</div>';
    html += '<div class="author">par <a href="#">' + escapeHtml(t.author) + '</a></div>';
    html += '</div>';
    html += '<div class="col-num">' + t.replyCount + '</div>';
    html += '<div class="col-num">' + t.viewCount + '</div>';
    html += '<div class="col-last">';
    html += formatDateShort(t.lastPostAt);
    if (t.lastPostBy) html += '<br><a href="#">' + escapeHtml(t.lastPostBy) + '</a> <img src="/fb/icon_latest_reply.gif" alt="" style="vertical-align:middle">';
    html += '</div>';
    html += '</div>';
  }

  html += '<div class="shell-actions">';
  html += '<div class="shell-left">';
  if (currentUser) {
    if (myBanned) {
      var banTxtT = myBannedPermanent ? 'Banni définitivement' : ('Banni jusqu\'au ' + escapeHtml(myBannedUntilDisplay || ''));
      html += '<span class="reply-blocked" title="' + banTxtT + '">' + banTxtT + ' — nouveau sujet impossible</span>';
    } else if (myMuted) {
      html += '<span class="reply-blocked" title="Tu es totoché jusqu\'au ' + escapeHtml(myMutedUntilDisplay || '') + '">'
        + 'Totoché jusqu\'au ' + escapeHtml(myMutedUntilDisplay || '') + ' — nouveau sujet impossible'
        + '</span>';
    } else if (data.board.postRestricted && !data.currentIsMod) {
      html += '<span class="reply-blocked">Seuls les modérateurs peuvent publier dans ce forum.</span>';
    } else {
      html += '<a href="#" onclick="navigate(\'newTopic\',' + boardId + ');return false" class="img-btn"><img src="/fb/post.gif" alt="Nouveau sujet"></a>';
    }
  }
  else html += '<span style="font-size:10px;color:#888">Connecte-toi depuis Frutiparc pour poster</span>';
  html += '</div>';
  html += '<div class="shell-center">';
  html += pagination(data.total, data.perPage, data.page, 'boardPage');
  html += '</div>';
  html += '<div class="shell-right"></div>';
  html += '</div>';
  app.innerHTML = html;
}
function boardPage(p) { loadBoard(currentBoardId, p); }

var currentTopicId = null;
var currentTopicData = null;
async function loadTopic(topicId, page) {
  // Opening a topic without an explicit page (from a board list / breadcrumb /
  // new-topic redirect) jumps to the LAST page — where the most recent posts
  // are — like a classic forum. The server resolves "last" from the real post
  // count. Pagination clicks and post-action reloads pass a number, so they
  // keep their exact page.
  var pageParam = (page == null) ? 'last' : page;
  currentTopicId = topicId;
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';

  var data = await apiFetch('/api/forum/topic/' + topicId + '?page=' + pageParam);
  currentTopicData = data;
  if (!data.topic) { app.innerHTML = '<div class="empty">Sujet introuvable.</div>'; return; }

  setBreadcrumb([
    { text: data.topic.boardName, href: "navigate('board'," + data.topic.boardId + ");return false" },
    { text: data.topic.title },
  ]);

  // Column header: Auteur | Message
  var html = '<div class="tbl-header"><span class="col-author">Auteur</span><span class="col-main">Message</span></div>';

  // Poll ("sondage") sits at the very top of the topic, on its first page —
  // exactly like the original phpBB layout.
  if (data.poll && data.page === 1) {
    html += renderPoll(data.poll, data.canManagePoll);
  }

  for (var pi = 0; pi < data.posts.length; pi++) {
    var p = data.posts[pi];
    var isFirstPost = (pi === 0 && data.page === 1);
    var canEdit = currentUser && (p.author === currentUser);
    var canDelete = currentUser && (p.author === currentUser || data.currentIsMod);
    html += '<div class="post' + (pi % 2 === 1 ? ' post-alt' : '') + '" id="post-' + p.id + '">';
    html += '<div class="post-author">';
    html += '<div class="avatar">' + renderBouillAvatar(p.bouille, p.author, p.mood) + '</div>';
    html += '<div class="username">' + escapeHtml(p.author) + '</div>';
    html += '</div>';
    html += '<div class="post-body">';
    html += '<div class="post-header">';
    html += '<div class="post-info"><span class="post-icon"></span> Posté le ' + formatDate(p.createdAt);
    if (isFirstPost) html += '&nbsp;&nbsp; Sujet du message: ' + escapeHtml(data.topic.title);
    html += '</div>';
    html += '<div class="actions">';
    if (canDelete) html += '<a href="#" class="act-btn act-btn-red" onclick="deletePost(' + p.id + ');return false">supprimer</a>';
    if (canEdit) html += '<a href="#" class="act-btn act-btn-green" onclick="editPost(' + p.id + ');return false">editer</a>';
    if (currentUser && !data.topic.isLocked) html += '<a href="#" class="act-btn act-btn-blue" onclick="quotePost(' + p.id + ',\'' + escapeHtml(p.author).replace(/'/g,"\\'") + '\');return false">citer</a>';
    html += '</div>';
    html += '</div>';
    html += '<div class="post-content" id="post-content-' + p.id + '" data-raw="' + escapeHtml(p.content) + '">' + renderBBCode(p.content) + '</div>';
    // Signature de l'auteur (BBCode), à la fin du post — comme un forum d'époque.
    if (p.signature) html += '<div class="post-signature">' + renderBBCode(p.signature) + '</div>';
    if (p.updatedAt) html += '<div class="post-edited">Ce message a été édité le ' + formatDate(p.updatedAt) + '</div>';
    html += '</div>';
    html += '</div>';
  }

  // Bottom filter bar (phpBB-style) — centered on green
  html += '<div class="bottom-bar">';
  html += '<span>Montrer les messages depuis: <select><option>Tous</option></select>';
  html += ' <select><option>Le plus ancien en premier</option><option>Le plus récent en premier</option></select>';
  html += ' <button class="go-btn">Aller</button></span>';
  html += '</div>';

  // Shell zone: pagination on left, action buttons on right
  html += '<div class="shell-actions">';
  html += '<div class="shell-left">';
  if (currentUser && !data.topic.isLocked) {
    if (myBanned) {
      var banTxtR = myBannedPermanent ? 'Banni définitivement' : ('Banni jusqu\'au ' + escapeHtml(myBannedUntilDisplay || ''));
      html += '<span class="reply-blocked" title="' + banTxtR + '">' + banTxtR + ' — réponse impossible</span>';
    } else if (myMuted) {
      html += '<span class="reply-blocked" title="Tu es totoché jusqu\'au ' + escapeHtml(myMutedUntilDisplay || '') + '">'
        + 'Totoché jusqu\'au ' + escapeHtml(myMutedUntilDisplay || '') + ' — réponse impossible'
        + '</span>';
    } else if (data.topic.postRestricted && !data.currentIsMod) {
      html += '<span class="reply-blocked">Seuls les modérateurs peuvent répondre dans ce forum.</span>';
    } else if (data.topic.lastPostBy && currentUser
               && data.topic.lastPostBy === String(currentUser).toLowerCase()
               && !data.currentIsStaff) {
      // The current user is already the author of the most recent post on
      // this topic — hide the Répondre button silently. They can edit
      // their previous post or wait for someone else to reply.
      // Exception: moderators/animateurs may post consecutively.
    } else {
      html += '<a href="#" onclick="showReplyForm();return false" class="img-btn"><img src="/fb/reply.gif" alt="Répondre"></a>';
    }
  }
  html += '</div>';
  html += '<div class="shell-center">';
  html += pagination(data.total, data.perPage, data.page, 'topicPage');
  html += '</div>';
  html += '<div class="shell-right">';
  if (data.currentIsMod) {
    html += '<a href="#" class="act-btn act-btn-red" onclick="toggleSticky();return false">' + (data.topic.isSticky ? 'Retirer Post-it' : 'Post-it') + '</a>';
    html += '<a href="#" class="act-btn act-btn-red" onclick="toggleLock();return false">' + (data.topic.isLocked ? 'Déverrouiller' : 'Verrouiller') + '</a>';
  }
  if (currentUser && (data.topic.author === currentUser || data.currentIsMod)) {
    html += '<a href="#" class="act-btn act-btn-red" onclick="deleteTopic();return false">Supprimer</a>';
  }
  html += '</div>';
  html += '</div>';

  app.innerHTML = html;
}
function topicPage(p) { loadTopic(currentTopicId, p); }

// ── Forum polls (sondages) ──
// Per-poll "show the results without voting" toggle (client-side only).
var pollShowResults = {};

// Render the poll box for a topic. Two states:
//  - voting form: radio buttons + "Voter" (logged-in users who haven't voted)
//  - results: horizontal bars with counts/percentages, the voter's own choice
//    highlighted. Shown after voting, when the poll is closed, or on demand.
function renderPoll(poll, canManage) {
  if (!poll) return '';
  var voted = poll.myOptionId != null;
  var showResults = voted || poll.isClosed || pollShowResults[poll.id];
  var html = '<div class="poll-box" id="poll-box-' + poll.id + '">';
  html += '<div class="poll-box-header"><span class="poll-icon"></span>Sondage' + (poll.isClosed ? ' — clos' : '') + '</div>';
  html += '<div class="poll-box-body">';
  html += '<div class="poll-question">' + escapeHtml(poll.question) + '</div>';
  if (showResults) {
    var total = poll.totalVotes || 0;
    for (var i = 0; i < poll.options.length; i++) {
      var o = poll.options[i];
      var pct = total > 0 ? Math.round((o.votes / total) * 100) : 0;
      var mine = (poll.myOptionId === o.id);
      html += '<div class="poll-result-row' + (mine ? ' poll-mine' : '') + '">';
      html += '<div class="poll-result-label">' + escapeHtml(o.label)
        + (mine ? ' <span class="poll-check">(ton vote)</span>' : '') + '</div>';
      html += '<div class="poll-result-track"><div class="poll-result-fill" style="width:' + pct + '%"></div></div>';
      html += '<div class="poll-result-num">' + o.votes + ' vote' + (o.votes > 1 ? 's' : '') + ' — ' + pct + '%</div>';
      html += '</div>';
    }
    html += '<div class="poll-total">Total : ' + total + ' vote' + (total > 1 ? 's' : '') + '</div>';
    if (poll.isClosed) {
      html += '<div class="poll-closed-note">Ce sondage est clos, le vote n\'est plus possible.</div>';
    } else if (!voted) {
      html += '<div class="poll-results-peek"><a href="#" onclick="hidePollResults(' + poll.id + ');return false">&laquo; Revenir au vote</a></div>';
    }
    if (canManage && !poll.isClosed) {
      html += '<div class="poll-manage"><button type="button" class="poll-close-btn" onclick="closePoll(' + poll.id + ')">Clore le sondage</button></div>';
    }
  } else if (!currentUser) {
    html += '<div class="poll-login-note">Connecte-toi depuis Frutiparc pour participer au sondage.</div>';
    for (var j = 0; j < poll.options.length; j++) {
      html += '<div class="poll-vote-opt poll-vote-disabled">' + escapeHtml(poll.options[j].label) + '</div>';
    }
  } else {
    for (var k = 0; k < poll.options.length; k++) {
      var op = poll.options[k];
      html += '<label class="poll-vote-opt"><input type="radio" name="poll-' + poll.id + '" value="' + op.id + '"> '
        + escapeHtml(op.label) + '</label>';
    }
    html += '<div class="poll-actions">';
    html += '<button type="button" class="poll-vote-btn" onclick="votePoll(' + poll.id + ')">Voter</button>';
    html += '<a href="#" class="poll-peek-link" onclick="showPollResults(' + poll.id + ');return false">Voir les résultats</a>';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

// Re-render just the poll box in place (after a vote / close), without
// reloading the whole topic (keeps scroll position and the view count).
function refreshPollBox(poll) {
  var box = document.getElementById('poll-box-' + poll.id);
  if (box) box.outerHTML = renderPoll(poll, currentTopicData ? currentTopicData.canManagePoll : false);
}
function showPollResults(pollId) {
  pollShowResults[pollId] = true;
  var poll = currentTopicData && currentTopicData.poll;
  if (poll && poll.id === pollId) refreshPollBox(poll);
}
function hidePollResults(pollId) {
  pollShowResults[pollId] = false;
  var poll = currentTopicData && currentTopicData.poll;
  if (poll && poll.id === pollId) refreshPollBox(poll);
}

async function votePoll(pollId) {
  var sel = document.querySelector('input[name="poll-' + pollId + '"]:checked');
  if (!sel) { alert('Choisis une réponse avant de voter.'); return; }
  var data = await apiFetch('/api/forum/poll/' + pollId + '/vote', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ optionId: Number(sel.value), sid: SID }),
  });
  if (data.ok && data.poll) {
    if (currentTopicData) currentTopicData.poll = data.poll;
    refreshPollBox(data.poll);
  } else {
    alert(data.message || ('Erreur : ' + (data.error || 'inconnue')));
  }
}

async function closePoll(pollId) {
  if (!confirm('Clore ce sondage ? Plus personne ne pourra voter ensuite.')) return;
  var data = await apiFetch('/api/forum/poll/' + pollId + '/close', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ close: true, sid: SID }),
  });
  if (data.ok && data.poll) {
    if (currentTopicData) currentTopicData.poll = data.poll;
    refreshPollBox(data.poll);
  } else {
    alert(data.message || ('Erreur : ' + (data.error || 'inconnue')));
  }
}

// Render the reply editor as a dedicated page (like the original post.php?m=reply).
function showReplyForm(initialContent) {
  if (!currentTopicData || !currentTopicData.topic) return;
  var topic = currentTopicData.topic;
  setBreadcrumb([
    { text: topic.boardName, href: "navigate('board'," + topic.boardId + ");return false" },
    { text: 'Répondre à un message' },
  ]);
  var app = document.getElementById('app');
  app.innerHTML = renderEditor({
    mode: 'reply',
    formId: 'reply',
    title: 'Re: ' + topic.title,
    content: initialContent || '',
    onSubmit: 'submitReply()',
    onCancel: 'loadTopic(' + currentTopicId + ', currentTopicData ? currentTopicData.page : 1)',
    submitLabel: 'Envoyer',
  });
  var ta = document.getElementById('reply-content');
  if (ta) {
    ta.focus();
    if (initialContent) ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

function quotePost(postId, author) {
  var el = document.getElementById('post-content-' + postId);
  if (!el) return;
  var raw = el.getAttribute('data-raw') || el.textContent;
  var tmp = document.createElement('textarea');
  tmp.innerHTML = raw;
  var text = tmp.value;
  showReplyForm('[quote=' + author + ']\n' + text.trim() + '\n[/quote]\n\n');
}

async function submitReply() {
  var ta = document.getElementById('reply-content');
  if (!ta) return;
  var content = ta.value.trim();
  if (!content) { alert('Le message ne peut pas être vide.'); return; }
  var bouille = myBouille ? getCurrentBouilleState('reply') : undefined;
  var mood = myBouille ? getCurrentMood('reply') : undefined;
  var data = await apiFetch('/api/forum/post', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topicId: currentTopicId, content: content, bouille: bouille, mood: mood, sid: SID }),
  });
  if (data.ok) {
    var totalAfter = (currentTopicData ? currentTopicData.total : 0) + 1;
    var lastPage = Math.ceil(totalAfter / 15);
    loadTopic(currentTopicId, lastPage);
  } else {
    alert(data.message || ('Erreur : ' + (data.error || 'inconnue')));
  }
}

// Build the inline-replacement table once, sorted by length descending so
// `:smile:` is matched before `:s` would have a chance to clip something.
// Matches are whitespace-bounded: a code only triggers if surrounded by
// whitespace / start / end, which avoids hijacking URLs and emails.
var _emoSubsList = null;
function _buildEmoSubs() {
  var entries = [];
  for (var i = 0; i < EMOTICONS.length; i++) {
    var e = EMOTICONS[i];
    entries.push({ code: e.code, file: e.file });
    for (var j = 0; j < (e.alts || []).length; j++) {
      entries.push({ code: e.alts[j], file: e.file });
    }
  }
  entries.sort(function(a, b) { return b.code.length - a.code.length; });
  return entries;
}
function _escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function replaceEmoticonsInline(text) {
  if (!_emoSubsList) _emoSubsList = _buildEmoSubs();
  var out = text;
  for (var i = 0; i < _emoSubsList.length; i++) {
    var ent = _emoSubsList[i];
    var re = new RegExp('(^|\\s)' + _escapeRegex(ent.code) + '(?=\\s|$)', 'g');
    out = out.replace(re, '$1<img class="emo-img" src="/fb/' + ent.file + '" alt="' + ent.code.replace(/"/g, '&quot;') + '">');
  }
  return out;
}

// Track tags that were opened via single-click (no selection); used by "Fermer les balises".
var _openTagStacks = {};

function _ensureStack(targetId) {
  if (!_openTagStacks[targetId]) _openTagStacks[targetId] = [];
  return _openTagStacks[targetId];
}

function bbWrap(targetId, tag) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end);
  var open = '[' + tag + ']', close = '[/' + tag + ']';
  ta.value = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.focus();
  var cursor = start + open.length + sel.length;
  ta.setSelectionRange(cursor, cursor);
}

// Insert open tag only at cursor (push to stack) or wrap selection if any.
function bbToggleTag(targetId, tag) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  if (start !== end) {
    bbWrap(targetId, tag);
    return;
  }
  var open = '[' + tag + ']';
  ta.value = ta.value.substring(0, start) + open + ta.value.substring(end);
  ta.focus();
  ta.setSelectionRange(start + open.length, start + open.length);
  _ensureStack(targetId).push(tag);
}

// Pop all pending opened tags and append their closing tags at the cursor.
function bbCloseAllTags(targetId) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var stack = _ensureStack(targetId);
  if (stack.length === 0) {
    ta.focus();
    return;
  }
  var pos = ta.selectionStart;
  var closes = '';
  while (stack.length > 0) closes += '[/' + stack.pop() + ']';
  ta.value = ta.value.substring(0, pos) + closes + ta.value.substring(ta.selectionEnd);
  ta.focus();
  ta.setSelectionRange(pos + closes.length, pos + closes.length);
}

function bbInsertText(targetId, text) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.substring(0, start) + text + ta.value.substring(end);
  ta.focus();
  ta.setSelectionRange(start + text.length, start + text.length);
}

function bbInsertUrl(targetId) {
  var url = prompt('URL :', 'https://');
  if (!url) return;
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end) || url;
  var insert = '[url=' + url + ']' + sel + '[/url]';
  ta.value = ta.value.substring(0, start) + insert + ta.value.substring(end);
  ta.focus();
  ta.setSelectionRange(start + insert.length, start + insert.length);
}

// Color dropdown handler — applies [color=value]...[/color] to selection
// or opens a tag at cursor and pushes onto the close-tags stack.
function bbInsertColorFromSelect(targetId, sel) {
  if (!sel || !sel.value) return;
  var color = sel.value;
  var ta = document.getElementById(targetId);
  if (!ta) { sel.selectedIndex = 0; return; }
  var start = ta.selectionStart, end = ta.selectionEnd;
  var s = ta.value.substring(start, end);
  if (s) {
    var open = '[color=' + color + ']', close = '[/color]';
    ta.value = ta.value.substring(0, start) + open + s + close + ta.value.substring(end);
    var cursor = start + open.length + s.length;
    ta.setSelectionRange(cursor, cursor);
  } else {
    var open2 = '[color=' + color + ']';
    ta.value = ta.value.substring(0, start) + open2 + ta.value.substring(end);
    ta.setSelectionRange(start + open2.length, start + open2.length);
    _ensureStack(targetId).push('color');
  }
  ta.focus();
  sel.selectedIndex = 0;
}

// Size dropdown handler — uses the French [taille=N] tag like the original.
function bbInsertSizeFromSelect(targetId, sel) {
  if (!sel || !sel.value) return;
  var size = sel.value;
  var ta = document.getElementById(targetId);
  if (!ta) { sel.selectedIndex = 0; return; }
  var start = ta.selectionStart, end = ta.selectionEnd;
  var s = ta.value.substring(start, end);
  if (s) {
    var open = '[taille=' + size + ']', close = '[/taille]';
    ta.value = ta.value.substring(0, start) + open + s + close + ta.value.substring(end);
    var cursor = start + open.length + s.length;
    ta.setSelectionRange(cursor, cursor);
  } else {
    var open2 = '[taille=' + size + ']';
    ta.value = ta.value.substring(0, start) + open2 + ta.value.substring(end);
    ta.setSelectionRange(start + open2.length, start + open2.length);
    _ensureStack(targetId).push('taille');
  }
  ta.focus();
  sel.selectedIndex = 0;
}

function bbInsertList(targetId) {
  var ta = document.getElementById(targetId);

function bbInsertCode(targetId) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var sel = ta.value.substring(start, end);
  var insert = '[code]' + sel + '[/code]';
  ta.value = ta.value.substring(0, start) + insert + ta.value.substring(end);
  ta.focus();
  if (sel) {
    var cursor = start + insert.length;
    ta.setSelectionRange(cursor, cursor);
  } else {
    ta.setSelectionRange(start + 6, start + 6);
  }
}

// Image button: pick a local file, upload it to our server, then drop an
// [img]<url>[/img] tag at the cursor — so users can add a picture without
// hosting it on a third-party site first.
function bbInsertImage(targetId) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    if (file) uploadForumImage(targetId, file);
    if (input.parentNode) input.parentNode.removeChild(input);
  });
  input.click();
}

function uploadForumImage(targetId, file) {
  var ta = document.getElementById(targetId);
  if (!ta) return;
  var MAX = 3 * 1024 * 1024;
  if (file.size > MAX) {
    alert('Image trop lourde (' + (Math.round(file.size / 1048576 * 10) / 10) + ' Mo). Maximum : 3 Mo.');
    return;
  }
  // Drop a placeholder at the cursor and lock the field while it uploads.
  var placeholder = '[…envoi de l\'image…]';
  var at = ta.selectionStart;
  ta.value = ta.value.substring(0, at) + placeholder + ta.value.substring(ta.selectionEnd);
  ta.disabled = true;
  function restore(replacement) {
    ta.disabled = false;
    var i = ta.value.indexOf(placeholder);
    if (i >= 0) {
      ta.value = ta.value.substring(0, i) + replacement + ta.value.substring(i + placeholder.length);
      var caret = i + replacement.length;
      ta.focus();
      ta.setSelectionRange(caret, caret);
    } else {
      ta.focus();
    }
  }
  fetch('/api/forum/upload-image?sid=' + encodeURIComponent(SID), {
    method: 'POST',
    headers: { 'Content-Type': file.type || 'application/octet-stream' },
    body: file,
    credentials: 'same-origin'
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (res) {
    if (res.ok && res.j && res.j.ok && res.j.url) {
      restore('[img]' + res.j.url + '[/img]');
    } else {
      restore('');
      alert((res.j && res.j.message) ? res.j.message : "Échec de l'envoi de l'image.");
    }
  }).catch(function () {
    restore('');
    alert("Échec de l'envoi de l'image (problème réseau).");
  });
}

var _pictoCache = null;
async function fetchPictos() {
  if (_pictoCache) return _pictoCache;
  try {
    var data = await apiFetch('/api/pictos');
    _pictoCache = Array.isArray(data) ? data : [];
  } catch (e) {
    _pictoCache = [];
  }
  return _pictoCache;
}

async function bbTogglePictos(targetId, btn) {
  var existing = btn.parentNode.querySelector('.picto-picker');
  if (existing) { existing.remove(); return; }
  // Close any other open pickers
  document.querySelectorAll('.picto-picker').forEach(function(el) { el.remove(); });
  var picker = document.createElement('div');
  picker.className = 'picto-picker';
  picker.innerHTML = '<span class="picto-empty">Chargement...</span>';
  btn.parentNode.style.position = 'relative';
  btn.parentNode.appendChild(picker);
  var pictos = await fetchPictos();
  picker.innerHTML = '';
  if (pictos.length === 0) {
    picker.innerHTML = '<span class="picto-empty">Aucun picto. Jouez aux jeux pour en collecter !</span>';
    return;
  }
  pictos.forEach(function(p) {
    var img = document.createElement('img');
    img.src = p.url;
    img.alt = p.name;
    img.title = p.name + ' (' + p.game + ')';
    img.onclick = function() {
      var ta = document.getElementById(targetId);
      if (!ta) return;
      var tag = '[picto=' + p.id + ']';
      var start = ta.selectionStart;
      ta.value = ta.value.substring(0, start) + tag + ta.value.substring(ta.selectionEnd);
      ta.focus();
      ta.setSelectionRange(start + tag.length, start + tag.length);
      picker.remove();
    };
    picker.appendChild(img);
  });
}

// Close picto pickers on outside click
document.addEventListener('click', function(e) {

// Shared editor renderer used for new topics and replies.
// opts: { mode: 'new'|'reply', formId, title?, content?, onSubmit, onCancel, submitLabel }
function renderEditor(opts) {
  var formId = opts.formId;
  var taId = formId + '-content';
  var titleId = formId + '-title';
  var showTitle = opts.mode === 'new';
  var initialTitle = opts.title || '';
  var initialContent = opts.content || '';
  var submitLabel = opts.submitLabel || (showTitle ? 'Envoyer' : 'Envoyer');

  var html = '<div class="form-area editor-area" id="editor-' + formId + '">';

  // Preview slot (filled by previewEditor)
  html += '<div id="editor-preview-' + formId + '"></div>';

  html += '<div class="editor-form">';

  // Sujet row (always shown — read-only for replies, editable for new topics).
  html += '<div class="editor-row">';
  html += '<div class="editor-label-cell">Sujet</div>';
  html += '<div class="editor-value-cell">';
  if (showTitle) {
    html += '<input type="text" class="editor-input" id="' + titleId + '" maxlength="200" value="' + escapeHtml(initialTitle) + '">';
  } else {
    html += '<input type="text" class="editor-input" id="' + titleId + '" value="' + escapeHtml(initialTitle) + '" readonly style="background:#E8F5D4">';
  }
  html += '</div></div>';

  // Bouille selector rows (nav + grid + expression). Only if user has a bouille.
  if (myBouille) {
    html += bouilleSelHtml(formId);
  }

  // Corps du message row
  html += '<div class="editor-row">';
  html += '<div class="editor-label-cell">Corps du message</div>';
  html += '<div class="editor-value-cell">';
  html += bbcodeToolbarHtml(taId);
  html += '</div></div>';

  // Emoticons under the "Emoticons" label (left column); the body (hint +
  // textarea) fills the value cell on the right.
  html += '<div class="editor-row">';
  html += '<div class="editor-label-cell">Emoticons' + emoticonsRowHtml(taId) + '</div>';
  html += '<div class="editor-value-cell">';
  html += editorHintRowHtml(taId);
  html += '<textarea class="editor-textarea" id="' + taId + '" placeholder="Votre message...">'
    + escapeHtml(initialContent) + '</textarea>';
  html += '</div></div>';

  // Sondage (optionnel) — proposé seulement à la création d'un sujet.
  if (showTitle) {
    html += pollEditorHtml(formId);
  }

  html += '</div>'; // .editor-form

  // Action buttons
  html += '<div class="editor-actions">';
  html += '<button type="button" class="edit-btn" onclick="' + opts.onSubmit + '">' + escapeHtml(submitLabel) + '</button>';
  html += '<button type="button" class="edit-btn" onclick="previewEditor(\'' + formId + '\',' + showTitle + ')">Prévisualiser</button>';
  html += '<button type="button" class="edit-btn" onclick="openSignatureEditor()" title="Ta signature s\'affiche à la fin de tous tes messages">✍️ Ma signature</button>';
  html += '<button type="button" class="edit-btn" onclick="' + opts.onCancel + '">Annuler</button>';
  html += '</div>';

  html += '</div>'; // .editor-area
  return html;
}

// ── Éditeur de signature (modal) ───────────────────────────────────────────
// Ouvert depuis le bouton « Ma signature » de l'éditeur. Réutilise la toolbar
// BBCode (bbcodeToolbarHtml) ciblée sur le textarea 'sig-content', avec un
// aperçu live (rendu par renderBBCode). Enregistre via POST /api/forum/signature
// SANS recharger la page (le brouillon de message en cours n'est pas perdu).
function openSignatureEditor() {
  if (!currentUser) { alert('Connecte-toi pour définir une signature.'); return; }
  var old = document.getElementById('sig-modal');
  if (old) old.remove();
  var m = document.createElement('div');
  m.id = 'sig-modal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML =
    '<div style="background:#fff;border:2px solid #2C4A0F;border-radius:10px;max-width:560px;width:100%;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.35)">'
    + '<h3 style="margin:0 0 6px;color:#2C4A0F">Ma signature</h3>'
    + '<p style="margin:0 0 8px;font-size:11px;color:#5a8030">Affichée à la fin de tous tes messages. Codes utilisables&nbsp;: [b]gras[/b], [i]italique[/i], [u]souligné[/u], [color=#cc0000]couleur[/color], [size=14]taille[/size], [url]lien[/url]…</p>'
    + bbcodeToolbarHtml('sig-content')
    + '<textarea id="sig-content" class="editor-textarea" style="width:100%;min-height:84px;box-sizing:border-box" placeholder="Ta signature…" oninput="updateSigPreview()"></textarea>'
    + '<div style="font-size:11px;color:#5a8030;margin:8px 0 2px">Aperçu&nbsp;:</div>'
    + '<div id="sig-preview" class="post-signature" style="margin:0;border-top:1px solid #cfe0a8"></div>'
    + '<div style="margin-top:12px;text-align:right">'
    + '<button type="button" class="edit-btn" onclick="saveSignature()">Enregistrer</button> '
    + '<button type="button" class="edit-btn" onclick="closeSignatureEditor()">Annuler</button>'
    + '</div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function (e) { if (e.target === m) closeSignatureEditor(); });
  var ta = document.getElementById('sig-content');
  ta.value = mySignature || '';
  updateSigPreview();
  ta.focus();
  // Les boutons de la toolbar modifient la valeur sans déclencher 'input' :
  // on rafraîchit l'aperçu à intervalle court tant que la modale est ouverte.
  m._sigTimer = setInterval(updateSigPreview, 350);
}
function closeSignatureEditor() {
  var m = document.getElementById('sig-modal');
  if (m) { if (m._sigTimer) clearInterval(m._sigTimer); m.remove(); }
}
function updateSigPreview() {
  var ta = document.getElementById('sig-content'), pv = document.getElementById('sig-preview');
  if (!ta || !pv || pv._last === ta.value) return;
  pv._last = ta.value;
  pv.innerHTML = ta.value.trim() ? renderBBCode(ta.value) : '<span style="color:#aaa;font-style:italic">(vide)</span>';
}
async function saveSignature() {
  var ta = document.getElementById('sig-content');
  if (!ta) return;
  try {
    var r = await fetch('/api/forum/signature', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: SID, signature: ta.value }),
    });
    var d = await r.json();
    if (!r.ok) { alert('Erreur : ' + (d.error || 'inconnu')); return; }
    mySignature = d.signature || '';
    closeSignatureEditor();
  } catch (e) { alert('Erreur réseau : ' + e.message); }
}

function togglePollFields(formId) {

  var fields = document.getElementById(formId + '-poll-fields');
  if (fields) fields.style.display = (cb && cb.checked) ? '' : 'none';
}

function addPollOption(formId) {
  var box = document.getElementById(formId + '-poll-options');
  if (!box) return;
  var count = box.querySelectorAll('.poll-opt-row').length;
  if (count >= 10) { alert('10 réponses maximum.'); return; }
  var tmp = document.createElement('div');
  tmp.innerHTML = pollOptionRowHtml('Réponse ' + (count + 1));
  box.appendChild(tmp.firstChild);
}

function removePollOption(btn) {
  var row = btn.parentNode;           // .poll-opt-row
  var box = row.parentNode;           // #<form>-poll-options
  if (box.querySelectorAll('.poll-opt-row').length <= 2) {
    alert('Un sondage doit proposer au moins 2 réponses.');
    return;
  }
  box.removeChild(row);
}

// Gather the poll payload from the editor, or undefined when the checkbox is
// off. Blank answer rows are dropped; final validation is server-side.
function getPollPayload(formId) {
  var cb = document.getElementById(formId + '-poll-enable');
  if (!cb || !cb.checked) return undefined;
  var q = ((document.getElementById(formId + '-poll-question') || {}).value || '').trim();
  var inputs = document.querySelectorAll('#' + formId + '-poll-options .poll-opt-input');
  var options = [];
  for (var i = 0; i < inputs.length; i++) {
    var v = (inputs[i].value || '').trim();
    if (v) options.push(v);
  }
  return { question: q, options: options };
}

function previewEditor(formId, hasTitle) {

  var content = (document.getElementById(taId) || {}).value || '';
  var title = (document.getElementById(titleId) || {}).value || '';

async function submitNewTopic(boardId) {
  var title = (document.getElementById('newtopic-title') || {}).value || '';

function renderConsecrationBanner(conse) {
  if (!conse || !conse.enabledCount) return '';
  var pct = Number(conse.overall) || 0;
  var html = '<div class="consecration-banner">'
    + '<div class="conse-title"><span>Score de consécration</span>'
    + '<span class="conse-pct">' + pct.toFixed(2) + ' %</span></div>'
    + '<div class="conse-bar"><div class="conse-fill" style="width:' + Math.min(pct, 100) + '%"></div></div>'
    + '<div class="conse-games">';
  for (var i = 0; i < conse.games.length; i++) {
    var g = conse.games[i];
    var label = g.mode === 'completion'
      ? (g.unlocked ? 'joué' : 'non joué')
      : (g.unlocked + ' / ' + g.total);
    html += '<span class="conse-game">' + escapeHtml(g.name) + ' : <b>' + escapeHtml(label) + '</b> (' + g.contribution.toFixed(2) + ' %)</span>';
  }
  html += '</div>';
  html += '<div class="conse-note">Chaque jeu finalisé vaut ' + conse.perGameMax.toFixed(2) + ' % du score total.</div>';
  html += '</div>';
  return html;
}

async function loadPictos() {
  setBreadcrumb([{ text: 'Mes Pictos' }]);
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';
  _pictoCache = null;
  var pictos = await fetchPictos();
  var conse = null;
  try { conse = await apiFetch('/api/consecration'); } catch (e) {}
  var banner = renderConsecrationBanner(conse);

  if (pictos.length === 0) {
    app.innerHTML = banner + '<div class="empty">Vous n\'avez aucun picto. Jouez aux jeux pour en collecter !</div>';
    return;
  }
  var byGame = {};
  for (var i = 0; i < pictos.length; i++) {
    var g = pictos[i].game || 'Autre';
    if (!byGame[g]) byGame[g] = [];
    byGame[g].push(pictos[i]);
  }
  var html = banner + '<div class="picto-bbcode-hint">Vous avez <b>' + pictos.length + '</b> picto' + (pictos.length > 1 ? 's' : '')
    + '. Pour utiliser un picto dans un message, insérez <code>[picto=nom]</code> ou cliquez sur le bouton <b>Pictos</b> dans la barre d\'édition.</div>';
  var games = Object.keys(byGame);
  for (var gi = 0; gi < games.length; gi++) {
    var gameName = games[gi];
    var items = byGame[gameName];
    html += '<div class="picto-gallery-section"><h4>' + escapeHtml(gameName) + ' (' + items.length + ')</h4><div class="picto-gallery">';
    for (var j = 0; j < items.length; j++) {
      var p = items[j];
      html += '<div class="picto-card">'
        + '<img src="' + escapeHtml(p.url) + '" alt="' + escapeHtml(p.name) + '" title="[picto=' + escapeHtml(p.id) + ']">'
        + '<div class="picto-name">' + escapeHtml(p.name) + '</div>'
        + '</div>';
    }
    html += '</div></div>';
  }
  app.innerHTML = html;
}

async function init() {
  try {
    var r = await fetch('/api/forum/me?sid=' + encodeURIComponent(SID));
    var data = await r.json();
    if (data && data.user) {
      currentUser = data.user;
      myBouille = data.bouille || null;
      mySignature = data.signature || '';
      myAccessories = data.accessories || [];
      myDefaultAccessories = data.defaultAccessories || [];
      myMuted = !!data.muted;
      myMutedUntilDisplay = data.mutedUntilDisplay || null;
      myBanned = !!data.banned;
      myBannedUntilDisplay = data.bannedUntilDisplay || null;
      myBannedPermanent = !!data.bannedPermanent;
      document.getElementById('user-info').textContent = 'Connecté : ' + currentUser;
      var pl = document.getElementById('pictos-link');
      if (pl) pl.style.display = 'inline';
    } else {
      document.getElementById('user-info').textContent = 'Non connecté';
    }
  } catch (e) {
    document.getElementById('user-info').textContent = "Erreur d'authentification";
  }
  // Show the "‹ Salons" shortcut when the forum was opened from the mobile chat.
  if (new URLSearchParams(window.location.search).get('from') === 'light') {
    var bl = document.getElementById('back-chat-link');
    if (bl) bl.style.display = 'inline';
  }
  loadIndex();
}

init();
</script>
</body>
</html>
