<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Forum Frutiparc.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #fff;
    color: #133200;
  }
  a { color: #133200; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Top close bar */
  .topbar {
    background: #fff;
    padding: 4px 10px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    border-bottom: 1px solid #eee;
    font-size: 11px;
  }
  .topbar .user-info {
    margin-right: auto;
    color: #133200;
    font-weight: bold;
  }
  .topbar .close-btn {
    background: #E57568;
    color: #fff;
    padding: 4px 12px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-family: Verdana, sans-serif;
    font-size: 11px;
    font-weight: bold;
  }
  .topbar .close-btn:hover { background: #d56558; }

  /* Breadcrumb (subtle, integrated into the page) */
  .breadcrumb {
    padding: 6px 14px;
    font-size: 11px;
    background: #fff;
    color: #133200;
  }
  .breadcrumb a { color: #133200; font-weight: bold; }

  /* Column header (pink/coral) */
  .tbl-header {
    background: #E57568;
    color: #fff;
    font-weight: bold;
    font-size: 11px;
    display: flex;
    padding: 6px 10px;
  }
  .tbl-header .col-main { flex: 1; text-align: center; }
  .tbl-header .col-num { width: 75px; text-align: center; }
  .tbl-header .col-last { width: 180px; text-align: center; }

  /* Category header (light green) */
  .cat-header {
    background: #ADE76C;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: bold;
    color: #133200;
  }

  /* Rows */
  .row {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    background: #D7F8B6;
    border-bottom: 1px solid #c0e6a0;
    min-height: 44px;
  }
  .row .icon { width: 38px; min-width: 38px; text-align: center; }
  .row .icon img.peach { width: 28px; height: 28px; vertical-align: middle; }
  .row .info { flex: 1; padding: 0 10px; }
  .row .info .title { font-weight: bold; font-size: 12px; }
  .row .info .title a { color: #133200; }
  .row .info .desc {
    color: #133200;
    font-size: 11px;
    margin-top: 2px;
    font-weight: normal;
  }
  .row .col-num {
    width: 75px;
    text-align: center;
    font-size: 11px;
    color: #133200;
  }
  .row .col-last {
    width: 180px;
    font-size: 10px;
    color: #133200;
    text-align: center;
    line-height: 1.4;
  }
  .row .col-last a { color: #133200; text-decoration: underline; }
  .row .sticky-tag { color: #133200; font-weight: bold; }
  .row .locked-tag { color: #888; }

  .topic-row .info .author {
    font-size: 10px;
    color: #133200;
    margin-top: 1px;
  }
  .topic-row .info .author a { color: #133200; text-decoration: underline; }

  /* Posts */
  .post {
    display: flex;
    background: #D7F8B6;
    border-bottom: 1px solid #c0e6a0;
  }
  .post .post-author {
    width: 130px;
    min-width: 130px;
    padding: 12px 8px;
    text-align: center;
  }
  .post .post-author .avatar {
    width: 80px;
    height: 80px;
    margin: 0 auto 6px auto;
    border: 1px solid #8bc55a;
    border-radius: 4px;
    overflow: hidden;
    font-size: 32px;
    color: #133200;
    font-weight: bold;
  }
  .post .post-author .username {
    font-weight: bold;
    font-size: 11px;
    color: #133200;
    word-break: break-all;
  }
  .post .post-body {
    flex: 1;
    padding: 8px 12px;
    border-left: 1px solid #c0e6a0;
  }
  .post .post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 6px;
    margin-bottom: 6px;
    font-size: 10px;
    color: #133200;
  }
  .post .post-header .actions { display: flex; gap: 6px; }
  .post .post-content {
    font-size: 12px;
    line-height: 1.5;
    color: #133200;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding: 4px 0;
  }
  .post .post-edited {
    margin-top: 6px;
    font-size: 10px;
    font-style: italic;
    color: #5a8030;
  }
  .post-content blockquote.quote {
    background: #ADE76C;
    border-left: 3px solid #7ec43c;
    margin: 6px 0;
    padding: 6px 10px;
    font-size: 11px;
    color: #133200;
  }
  .post-content blockquote.quote .quote-author {
    font-weight: bold;
    font-size: 10px;
    margin-bottom: 4px;
    color: #5a8030;
  }
  .post-content a { color: #2d5e0c; text-decoration: underline; }
  .post-author .post-count {
    font-size: 10px;
    color: #5a8030;
    margin-top: 2px;
  }
  .post-author .role-badge {
    display: inline-block;
    background: #E57568;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    padding: 1px 5px;
    border-radius: 2px;
    margin-top: 3px;
    text-transform: uppercase;
  }
  /* Toolbar above textareas (formatting buttons) */
  .bbcode-toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .bbcode-toolbar button {
    background: #ADE76C;
    border: 1px solid #8bc55a;
    color: #133200;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: Verdana, sans-serif;
    border-radius: 2px;
    min-width: 28px;
  }
  .bbcode-toolbar button:hover { background: #8bc55a; }
  .bbcode-toolbar button.b { font-weight: bold; }
  .bbcode-toolbar button.i { font-style: italic; }
  .bbcode-toolbar button.u { text-decoration: underline; }
  /* Inline edit area */
  .post-edit-area textarea {
    width: 100%;
    height: 100px;
    padding: 5px 7px;
    font-size: 12px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    font-family: Verdana, sans-serif;
    background: #fff;
    color: #133200;
    margin-bottom: 6px;
  }
  .post-edit-area .form-actions { display: flex; gap: 6px; }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: bold;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-family: Verdana, sans-serif;
  }
  .btn-green { background: #7ec43c; }
  .btn-green:hover { background: #6cb22a; text-decoration: none; color: #fff; }
  .btn-orange { background: #E57568; }
  .btn-orange:hover { background: #d56558; text-decoration: none; color: #fff; }
  .btn-sm { padding: 3px 9px; font-size: 10px; }

  /* Pagination */
  .pagination {
    padding: 8px 14px;
    font-size: 11px;
    color: #133200;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    border-top: 1px solid #c0e6a0;
  }
  .pagination a, .pagination span {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #ADE76C;
    background: #fff;
    border-radius: 2px;
    color: #133200;
  }
  .pagination span.current {
    background: #ADE76C;
    color: #133200;
    font-weight: bold;
  }

  /* Form */
  .form-area {
    background: #D7F8B6;
    padding: 14px;
    margin: 10px 0;
  }
  .form-area h3 {
    color: #133200;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .form-area label {
    font-weight: bold;
    font-size: 11px;
    color: #133200;
    display: block;
    margin-bottom: 4px;
  }
  .form-area input[type="text"],
  .form-area textarea {
    width: 100%;
    padding: 5px 7px;
    font-size: 12px;
    border: 1px solid #8bc55a;
    border-radius: 3px;
    margin-bottom: 10px;
    font-family: Verdana, sans-serif;
    background: #fff;
    color: #133200;
  }
  .form-area textarea {
    height: 130px;
    resize: vertical;
  }
  .form-area .form-actions {
    display: flex;
    gap: 8px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: #fff;
  }

  .forum-footer {
    text-align: center;
    padding: 12px;
    font-size: 10px;
    color: #5a8030;
    background: #fff;
    border-top: 1px solid #ADE76C;
    margin-top: 10px;
  }

  .loading, .empty {
    text-align: center;
    padding: 24px;
    color: #5a8030;
    font-style: italic;
    background: #fff;
  }

  /* Peach icon (CSS-only fallback) */
  .peach-icon {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #f29630;
    border-radius: 50% 50% 50% 45%;
    position: relative;
  }
  .peach-icon::after {
    content: '';
    position: absolute;
    top: -3px;
    right: 4px;
    width: 8px;
    height: 6px;
    background: #5a8030;
    border-radius: 0 60% 0 60%;
    transform: rotate(-20deg);
  }
  .peach-icon.pink { background: #f29ba0; }
  /* Mini bouille in topic list */
  .row .icon .mini-bouille {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #8bc55a;
  }
  .row .icon .mini-bouille svg { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <div class="user-info" id="user-info"></div>
  <button class="close-btn" onclick="closeForum()">Fermer</button>
</div>
<div class="breadcrumb" id="breadcrumb">
  <a href="#" onclick="navigate('index');return false">Forum Frutiparc.com</a>
</div>
<div id="app">
  <div class="loading">Chargement du forum...</div>
</div>
<div class="forum-footer">Frutiparc.com &copy; Motion Twin</div>

<script>
const params = new URLSearchParams(window.location.search);
const SID = params.get('sid') || '';
let currentUser = null;

function closeForum() {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.fp_closeFrame === 'function') {
      window.parent.fp_closeFrame(1);
      return;
    }
  } catch (e) {}
  window.close();
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Minimal BBCode → HTML. Escapes first, then unescapes the recognised tags.
function renderBBCode(s) {
  let out = escapeHtml(s);
  // [b], [i], [u], [s]
  out = out.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>');
  out = out.replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>');
  out = out.replace(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>');
  out = out.replace(/\[s\]([\s\S]*?)\[\/s\]/gi, '<s>$1</s>');
  // [url=…]…[/url] and [url]…[/url]
  out = out.replace(/\[url=(https?:\/\/[^\s\]]+)\]([\s\S]*?)\[\/url\]/gi,
    '<a href="$1" target="_blank" rel="noopener">$2</a>');
  out = out.replace(/\[url\](https?:\/\/[^\s\[]+)\[\/url\]/gi,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // [citation=author]…[/citation] and [quote=author]…[/quote]
  out = out.replace(/\[(?:citation|quote)=([^\]]+)\]([\s\S]*?)\[\/(?:citation|quote)\]/gi,
    '<blockquote class="quote"><div class="quote-author">$1 a écrit :</div>$2</blockquote>');
  out = out.replace(/\[(?:citation|quote)\]([\s\S]*?)\[\/(?:citation|quote)\]/gi,
    '<blockquote class="quote">$1</blockquote>');
  // Auto-link bare URLs that weren't already caught
  out = out.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  // Newlines → <br>
  out = out.replace(/\n/g, '<br>');
  return out;
}

function decode62(s) {
  var r = 0, coef = 1;
  for (var i = s.length - 1; i >= 0; i--) {
    var c = s.charAt(i);
    var t = (c === c.toLowerCase()) ? parseInt(c, 36) : parseInt(c.toLowerCase(), 36) + 26;
    if (isNaN(t)) t = 0;
    r += t * coef;
    coef *= 62;
  }
  return r;
}

function renderBouillAvatar(bouille, username) {
  var s = String(bouille || '').replace(/[^0-9a-zA-Z]/g, '');
  if (!s || s.length < 6) s = '000000010000000000000000';
  // Parse bouille state into visual components
  var famId = decode62(s.substring(0, 2));
  var v2 = decode62(s.substring(2, 4));
  var v3 = decode62(s.substring(4, 6));
  var v4 = decode62(s.substring(6, 8));
  var v5 = decode62(s.substring(8, 10));

  // Generate colors from the bouille values
  var hue = (famId * 47 + v2 * 13) % 360;
  var bodyH = hue;
  var bodyS = 55 + (v3 % 30);
  var bodyL = 50 + (v2 % 20);
  var eyeH = (hue + 120 + v4 * 7) % 360;
  var bgH = (hue + 30) % 360;

  // Family determines base shape: 0 = round, 1+ = slightly different
  var bodyRx = famId === 0 ? 28 : 24 + (famId % 8);
  var bodyRy = famId === 0 ? 26 : 22 + (famId % 10);

  // Build SVG
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">';
  svg += '<rect width="80" height="80" fill="hsl(' + bgH + ',60%,85%)"/>';
  // Body
  svg += '<ellipse cx="40" cy="52" rx="' + bodyRx + '" ry="' + bodyRy + '" fill="hsl(' + bodyH + ',' + bodyS + '%,' + bodyL + '%)"/>';
  // Head
  var headR = 18 + (v3 % 4);
  svg += '<circle cx="40" cy="28" r="' + headR + '" fill="hsl(' + bodyH + ',' + bodyS + '%,' + (bodyL + 8) + '%)"/>';
  // Eyes
  var eyeSpan = 6 + (v4 % 3);
  svg += '<circle cx="' + (40 - eyeSpan) + '" cy="26" r="3" fill="hsl(' + eyeH + ',70%,35%)"/>';
  svg += '<circle cx="' + (40 + eyeSpan) + '" cy="26" r="3" fill="hsl(' + eyeH + ',70%,35%)"/>';
  svg += '<circle cx="' + (40 - eyeSpan) + '" cy="25.5" r="1.2" fill="#fff"/>';
  svg += '<circle cx="' + (40 + eyeSpan) + '" cy="25.5" r="1.2" fill="#fff"/>';
  // Mouth
  var mouthW = 4 + (v5 % 5);
  svg += '<ellipse cx="40" cy="34" rx="' + mouthW + '" ry="2" fill="hsl(' + bodyH + ',' + bodyS + '%,' + (bodyL - 15) + '%)"/>';
  svg += '</svg>';
  return svg;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const pad = n => n < 10 ? '0' + n : '' + n;
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function formatDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => n < 10 ? '0' + n : '' + n;
  const months = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + '<br>' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

async function apiFetch(url, opts) {
  const sep = url.includes('?') ? '&' : '?';
  const r = await fetch(url + sep + 'sid=' + encodeURIComponent(SID), opts);
  return r.json();
}

function setBreadcrumb(parts) {
  let html = '<a href="#" onclick="navigate(\'index\');return false">Forum Frutiparc.com</a>';
  for (const p of parts) {
    html += ' &raquo; ';
    if (p.href) html += '<a href="#" onclick="' + escapeHtml(p.href) + '">' + escapeHtml(p.text) + '</a>';
    else html += escapeHtml(p.text);
  }
  document.getElementById('breadcrumb').innerHTML = html;
}

function navigate(view, id, extra) {
  if (view === 'index') loadIndex();
  else if (view === 'board') loadBoard(id, extra);
  else if (view === 'topic') loadTopic(id, extra);
  else if (view === 'newTopic') showNewTopicForm(id);
}

function pagination(total, perPage, currentPage, onclick) {
  const pages = Math.ceil(total / perPage);
  if (pages <= 1) return '';
  let html = '<div class="pagination">';
  html += 'Page ' + currentPage + ' sur ' + pages + '&nbsp;&mdash;&nbsp;';
  if (currentPage > 1) html += '<a href="#" onclick="' + onclick + '(' + (currentPage - 1) + ');return false">&laquo;</a>';
  for (let i = 1; i <= pages; i++) {
    if (i === currentPage) html += '<span class="current">' + i + '</span>';
    else if (i <= 3 || i >= pages - 2 || Math.abs(i - currentPage) <= 2)
      html += '<a href="#" onclick="' + onclick + '(' + i + ');return false">' + i + '</a>';
    else if (i === 4 && currentPage > 6) html += '<span>...</span>';
    else if (i === pages - 3 && currentPage < pages - 5) html += '<span>...</span>';
  }
  if (currentPage < pages) html += '<a href="#" onclick="' + onclick + '(' + (currentPage + 1) + ');return false">&raquo;</a>';
  html += '</div>';
  return html;
}

async function loadIndex() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';
  setBreadcrumb([]);

  const data = await apiFetch('/api/forum/index');
  if (!data.categories || data.categories.length === 0) {
    app.innerHTML = '<div class="empty">Le forum est vide pour le moment.</div>';
    return;
  }

  let html = '<div class="tbl-header"><span class="col-main">Forums</span><span class="col-num">Sujets</span><span class="col-num">Messages</span><span class="col-last">Dernier message</span></div>';

  for (const cat of data.categories) {
    html += '<div class="cat-header">' + escapeHtml(cat.name) + '</div>';
    for (const b of cat.boards) {
      html += '<div class="row">';
      html += '<div class="icon"><div class="peach-icon"></div></div>';
      html += '<div class="info">';
      html += '<div class="title"><a href="#" onclick="navigate(\'board\',' + b.id + ');return false">' + escapeHtml(b.name) + '</a></div>';
      html += '<div class="desc">' + escapeHtml(b.description) + '</div>';
      html += '</div>';
      html += '<div class="col-num">' + b.topicCount + '</div>';
      html += '<div class="col-num">' + b.postCount + '</div>';
      html += '<div class="col-last">';
      if (b.lastActivity) {
        html += formatDateShort(b.lastActivity);
        if (b.lastActivityBy) html += '<br><a href="#">' + escapeHtml(b.lastActivityBy) + '</a>';
      } else { html += '-'; }
      html += '</div>';
      html += '</div>';
    }
  }
  app.innerHTML = html;
}

let currentBoardId = null;
async function loadBoard(boardId, page) {
  page = page || 1;
  currentBoardId = boardId;
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';

  const data = await apiFetch('/api/forum/board/' + boardId + '?page=' + page);
  if (!data.board) { app.innerHTML = '<div class="empty">Forum introuvable.</div>'; return; }

  setBreadcrumb([{ text: data.board.name }]);

  let html = '<div class="toolbar">';
  if (currentUser) html += '<a href="#" class="btn btn-green" onclick="navigate(\'newTopic\',' + boardId + ');return false">Nouveau sujet</a>';
  else html += '<span style="font-size:10px;color:#888">Connecte-toi depuis Frutiparc pour poster</span>';
  html += '<span style="font-size:10px;color:#5a8030">' + escapeHtml(data.board.name) + '</span>';
  html += '</div>';

  html += '<div class="tbl-header"><span class="col-main">' + escapeHtml(data.board.name) + '</span><span class="col-num">Rép.</span><span class="col-num">Vues</span><span class="col-last">Dernier message</span></div>';

  if (data.topics.length === 0) {
    html += '<div class="empty">Aucun sujet dans ce forum.</div>';
  }
  for (const t of data.topics) {
    html += '<div class="row topic-row">';
    html += '<div class="icon"><div class="mini-bouille">' + renderBouillAvatar(t.authorBouille || '', t.author) + '</div></div>';
    html += '<div class="info">';
    html += '<div class="title">';
    if (t.isSticky) html += '<span class="sticky-tag">Post-it: </span>';
    if (t.isLocked) html += '<span class="locked-tag">[verrouillé] </span>';
    html += '<a href="#" onclick="navigate(\'topic\',' + t.id + ');return false">' + escapeHtml(t.title) + '</a>';
    html += '</div>';
    html += '<div class="author">par <a href="#">' + escapeHtml(t.author) + '</a></div>';
    html += '</div>';
    html += '<div class="col-num">' + t.replyCount + '</div>';
    html += '<div class="col-num">' + t.viewCount + '</div>';
    html += '<div class="col-last">';
    html += formatDateShort(t.lastPostAt);
    if (t.lastPostBy) html += '<br><a href="#">' + escapeHtml(t.lastPostBy) + '</a>';
    html += '</div>';
    html += '</div>';
  }

  html += pagination(data.total, data.perPage, data.page, 'boardPage');
  app.innerHTML = html;
}
function boardPage(p) { loadBoard(currentBoardId, p); }

let currentTopicId = null;
let currentTopicData = null;
async function loadTopic(topicId, page) {
  page = page || 1;
  currentTopicId = topicId;
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Chargement...</div>';

  const data = await apiFetch('/api/forum/topic/' + topicId + '?page=' + page);
  currentTopicData = data;
  if (!data.topic) { app.innerHTML = '<div class="empty">Sujet introuvable.</div>'; return; }

  setBreadcrumb([
    { text: data.topic.boardName, href: "navigate('board'," + data.topic.boardId + ");return false" },
    { text: data.topic.title },
  ]);

  let html = '<div class="toolbar">';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  if (currentUser && !data.topic.isLocked) html += '<a href="#" class="btn btn-green" onclick="showReplyForm();return false">Répondre</a>';
  // Moderator tools
  if (data.currentIsMod) {
    html += '<a href="#" class="btn btn-orange btn-sm" onclick="toggleSticky();return false">' + (data.topic.isSticky ? 'Retirer Post-it' : 'Mettre en Post-it') + '</a>';
    html += '<a href="#" class="btn btn-orange btn-sm" onclick="toggleLock();return false">' + (data.topic.isLocked ? 'Déverrouiller' : 'Verrouiller') + '</a>';
  }
  // Author or moderator can delete the topic
  if (currentUser && (data.topic.author === currentUser || data.currentIsMod)) {
    html += '<a href="#" class="btn btn-orange btn-sm" onclick="deleteTopic();return false">Supprimer</a>';
  }
  html += '</div>';
  html += '<span style="font-size:11px;font-weight:bold;color:#133200">' + escapeHtml(data.topic.title) + '</span>';
  html += '</div>';

  for (const p of data.posts) {
    const canEdit = currentUser && (p.author === currentUser);
    const canDelete = currentUser && (p.author === currentUser || data.currentIsMod);
    html += '<div class="post" id="post-' + p.id + '">';
    html += '<div class="post-author">';
    html += '<div class="avatar">' + renderBouillAvatar(p.bouille, p.author) + '</div>';
    html += '<div class="username">' + escapeHtml(p.author) + '</div>';
    if (p.isModerator) html += '<div class="role-badge">Modérateur</div>';
    if (typeof p.postCount === 'number') html += '<div class="post-count">Messages : ' + p.postCount + '</div>';
    html += '</div>';
    html += '<div class="post-body">';
    html += '<div class="post-header">';
    html += '<span>Posté le ' + formatDate(p.createdAt) + '</span>';
    html += '<div class="actions">';
    if (currentUser && !data.topic.isLocked) html += '<a href="#" class="btn btn-orange btn-sm" onclick="quotePost(' + p.id + ',\'' + escapeHtml(p.author).replace(/'/g,"\\'") + '\');return false">citer</a>';
    if (canEdit) html += ' <a href="#" class="btn btn-orange btn-sm" onclick="editPost(' + p.id + ');return false">éditer</a>';
    if (canDelete) html += ' <a href="#" class="btn btn-orange btn-sm" onclick="deletePost(' + p.id + ');return false">supprimer</a>';
    html += '</div>';
    html += '</div>';
    html += '<div class="post-content" id="post-content-' + p.id + '" data-raw="' + escapeHtml(p.content) + '">' + renderBBCode(p.content) + '</div>';
    if (p.updatedAt) html += '<div class="post-edited">Ce message a été édité le ' + formatDate(p.updatedAt) + '</div>';
    html += '</div>';
    html += '</div>';
  }

  html += pagination(data.total, data.perPage, data.page, 'topicPage');

  if (currentUser && !data.topic.isLocked) {
    html += '<div class="form-area" id="reply-form" style="display:none">';
    html += '<label>Répondre :</label>';
    html += bbcodeToolbarHtml('reply-content');
    html += '<textarea id="reply-content" placeholder="Votre message..."></textarea>';
    html += '<div class="form-actions"><button class="btn btn-green" onclick="submitReply()">Envoyer</button> <button class="btn btn-orange" onclick="document.getElementById(\'reply-form\').style.display=\'none\'">Annuler</button></div>';
    html += '</div>';
  }

  app.innerHTML = html;
}
function topicPage(p) { loadTopic(currentTopicId, p); }

function showReplyForm() {
  const f = document.getElementById('reply-form');
  if (f) { f.style.display = 'block'; document.getElementById('reply-content').focus(); }
}

function quotePost(postId, author) {
  const el = document.getElementById('post-content-' + postId);
  if (!el) return;
  // Quote the raw BBCode so the original formatting is preserved.
  const raw = el.getAttribute('data-raw') || el.textContent;
  const tmp = document.createElement('textarea');
  tmp.innerHTML = raw;
  const text = tmp.value;
  showReplyForm();
  const ta = document.getElementById('reply-content');
  ta.value = '[quote=' + author + ']\n' + text.trim() + '\n[/quote]\n\n';
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

async function submitReply() {
  const content = document.getElementById('reply-content').value.trim();
  if (!content) return;
  const data = await apiFetch('/api/forum/post', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topicId: currentTopicId, content: content, sid: SID }),
  });
  if (data.ok) {
    const totalAfter = (currentTopicData ? currentTopicData.total : 0) + 1;
    const lastPage = Math.ceil(totalAfter / 15);
    loadTopic(currentTopicId, lastPage);
  } else {
    alert('Erreur : ' + (data.error || 'inconnue'));
  }
}

function bbcodeToolbarHtml(targetId) {
  return '<div class="bbcode-toolbar">'
    + '<button type="button" class="b" onclick="bbWrap(\'' + targetId + '\',\'b\')" title="Gras">B</button>'
    + '<button type="button" class="i" onclick="bbWrap(\'' + targetId + '\',\'i\')" title="Italique">I</button>'
    + '<button type="button" class="u" onclick="bbWrap(\'' + targetId + '\',\'u\')" title="Souligné">U</button>'
    + '<button type="button" onclick="bbWrap(\'' + targetId + '\',\'s\')" title="Barré">S</button>'
    + '<button type="button" onclick="bbWrap(\'' + targetId + '\',\'quote\')" title="Citation">&laquo;&raquo;</button>'
    + '<button type="button" onclick="bbInsertUrl(\'' + targetId + '\')" title="Lien">URL</button>'
    + '</div>';
}

function bbWrap(targetId, tag) {
  const ta = document.getElementById(targetId);
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const open = '[' + tag + ']', close = '[/' + tag + ']';
  ta.value = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.focus();
  const cursor = start + open.length + sel.length;
  ta.setSelectionRange(cursor, cursor);
}

function bbInsertUrl(targetId) {
  const url = prompt('URL :', 'https://');
  if (!url) return;
  const ta = document.getElementById(targetId);
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || url;
  const insert = '[url=' + url + ']' + sel + '[/url]';
  ta.value = ta.value.substring(0, start) + insert + ta.value.substring(end);
  ta.focus();
  ta.setSelectionRange(start + insert.length, start + insert.length);
}

function editPost(postId) {
  const contentEl = document.getElementById('post-content-' + postId);
  if (!contentEl) return;
  // If already in edit mode, do nothing.
  if (document.getElementById('edit-area-' + postId)) return;
  const raw = contentEl.getAttribute('data-raw') || contentEl.textContent;
  // Decode the data-raw attribute (was HTML-escaped on render).
  const tmp = document.createElement('textarea');
  tmp.innerHTML = raw;
  const original = tmp.value;

  const taId = 'edit-textarea-' + postId;
  const wrap = document.createElement('div');
  wrap.className = 'post-edit-area';
  wrap.id = 'edit-area-' + postId;
  wrap.innerHTML = bbcodeToolbarHtml(taId)
    + '<textarea id="' + taId + '"></textarea>'
    + '<div class="form-actions">'
    + '<button class="btn btn-green" onclick="submitEdit(' + postId + ')">Enregistrer</button>'
    + '<button class="btn btn-orange" onclick="cancelEdit(' + postId + ')">Annuler</button>'
    + '</div>';
  contentEl.style.display = 'none';
  contentEl.parentNode.insertBefore(wrap, contentEl.nextSibling);
  document.getElementById(taId).value = original;
  document.getElementById(taId).focus();
}

function cancelEdit(postId) {
  const wrap = document.getElementById('edit-area-' + postId);
  if (wrap) wrap.remove();
  const contentEl = document.getElementById('post-content-' + postId);
  if (contentEl) contentEl.style.display = '';
}

async function submitEdit(postId) {
  const ta = document.getElementById('edit-textarea-' + postId);
  if (!ta) return;
  const newContent = ta.value.trim();
  if (!newContent) { alert('Le message ne peut pas être vide.'); return; }
  const data = await apiFetch('/api/forum/post/' + postId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: newContent, sid: SID }),
  });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function deletePost(postId) {
  if (!confirm('Supprimer ce message ?')) return;
  const data = await apiFetch('/api/forum/post/' + postId, { method: 'DELETE' });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function toggleSticky() {
  if (!currentTopicId) return;
  const data = await apiFetch('/api/forum/topic/' + currentTopicId + '/sticky', { method: 'POST' });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function toggleLock() {
  if (!currentTopicId) return;
  const data = await apiFetch('/api/forum/topic/' + currentTopicId + '/lock', { method: 'POST' });
  if (data.ok) loadTopic(currentTopicId, currentTopicData ? currentTopicData.page : 1);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function deleteTopic() {
  if (!currentTopicId) return;
  if (!confirm('Supprimer ce sujet et tous ses messages ?')) return;
  const data = await apiFetch('/api/forum/topic/' + currentTopicId, { method: 'DELETE' });
  if (data.ok) navigate('board', data.boardId || (currentTopicData && currentTopicData.topic.boardId));
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

function showNewTopicForm(boardId) {
  setBreadcrumb([{ text: 'Nouveau sujet' }]);
  const app = document.getElementById('app');
  let html = '<div class="form-area">';
  html += '<h3>Nouveau sujet</h3>';
  html += '<label>Titre :</label>';
  html += '<input type="text" id="new-topic-title" maxlength="200" placeholder="Titre du sujet">';
  html += '<label>Message :</label>';
  html += bbcodeToolbarHtml('new-topic-content');
  html += '<textarea id="new-topic-content" placeholder="Votre message..." style="height:160px"></textarea>';
  html += '<div class="form-actions">';
  html += '<button class="btn btn-green" onclick="submitNewTopic(' + boardId + ')">Créer le sujet</button>';
  html += ' <button class="btn btn-orange" onclick="navigate(\'board\',' + boardId + ')">Annuler</button>';
  html += '</div></div>';
  app.innerHTML = html;
  document.getElementById('new-topic-title').focus();
}

async function submitNewTopic(boardId) {
  const title = document.getElementById('new-topic-title').value.trim();
  const content = document.getElementById('new-topic-content').value.trim();
  if (!title || !content) { alert('Titre et message requis.'); return; }
  const data = await apiFetch('/api/forum/topic', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ boardId: boardId, title: title, content: content, sid: SID }),
  });
  if (data.ok) navigate('topic', data.topicId);
  else alert('Erreur : ' + (data.error || 'inconnue'));
}

async function init() {
  try {
    const r = await fetch('/api/forum/me?sid=' + encodeURIComponent(SID));
    const data = await r.json();
    if (data && data.user) {
      currentUser = data.user;
      document.getElementById('user-info').textContent = 'Connecté : ' + currentUser;
    } else {
      document.getElementById('user-info').textContent = 'Non connecté';
    }
  } catch (e) {
    document.getElementById('user-info').textContent = 'Erreur d\'authentification';
  }
  loadIndex();
}

init();
</script>
