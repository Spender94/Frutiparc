<!DOCTYPE html>
<html lang="fr">
<!-- Les paris des tournois.

     Une page, comme le Club : les tournois dont l'organisateur a ouvert les
     paris, leurs matchs ouverts aux mises, ceux en cours, et les résultats.
     Pari MUTUEL : le pot d'un match va à ceux qui ont vu juste, au prorata de
     leur mise (paris.js) ; la cote affichée est celle du pot à l'instant, elle
     bouge jusqu'au début du match. La session est celle du light. -->
<head>
<meta charset="UTF-8">
<title>Paris — Frutiparc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    font-size: 11px;
    background: #ADE76B;
    color: #335511;
    padding: 12px;
  }
  .shell {
    background: #fff;
    border-radius: 7px;
    overflow: hidden;
    padding: 6px;
    border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF;
    max-width: 760px;
    margin: 0 auto;
  }
  .entete { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
  .entete .titre { color: #E3756A; font: bold 14px Arial, sans-serif; }
  .entete .solde { margin-left: auto; font-weight: bold; color: #2C4A0F; }
  .bandeau {
    background: #E3756A; color: #fff; font: bold 12px Arial, Verdana, sans-serif;
    padding: 6px 10px; border-radius: 7px 7px 0 0; margin-top: 8px;
    display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  }
  .bandeau small { font-weight: normal; opacity: .9; }
  .regle { background: #ADE76B; color: #2C4A0F; padding: 6px 10px; line-height: 1.5; }
  h3 { font: bold 12px Arial, sans-serif; color: #2C4A0F; margin: 10px 4px 6px; }
  .vide { color: #6c8f3a; padding: 6px 4px 10px; }

  .match { background: #D6F7B5; border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; }
  .match .tour { color: #6c8f3a; font-size: 10px; margin-bottom: 6px; display: flex; gap: 8px; }
  .match .tour .pot { margin-left: auto; font-weight: bold; color: #2C4A0F; }
  .duo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: stretch; }
  .duo .contre { align-self: center; color: #6c8f3a; font-weight: bold; }
  .cote {
    background: #fff; border: 2px solid #C3EF93; border-radius: 6px; padding: 6px 8px;
    display: flex; flex-direction: column; gap: 2px; text-align: left; font-family: inherit; font-size: 11px; color: #335511;
  }
  button.cote { cursor: pointer; }
  button.cote:hover:not(:disabled) { border-color: #E3756A; }
  button.cote:disabled { cursor: default; opacity: .75; }
  .cote.choisi { border-color: #E3756A; background: #fff6f4; }
  .cote.gagnant { border-color: #2f8f2f; }
  .cote .nom { font-weight: bold; font-size: 12px; color: #2C4A0F; overflow-wrap: anywhere; }
  .cote .x { font: bold 15px Arial, sans-serif; color: #E3756A; }
  .cote .x.vide { color: #9ab87a; font-size: 12px; }
  .cote .detail { color: #6c8f3a; font-size: 10px; }
  .miser { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .miser input {
    width: 80px; padding: 3px 6px; border: 1px solid #8bc55a; border-radius: 3px;
    font: 12px Verdana, sans-serif; color: #2C4A0F;
  }
  .miser .aide { color: #6c8f3a; font-size: 10px; }
  .mien { margin-top: 6px; font-weight: bold; color: #2C4A0F; }
  .mien.gagne { color: #2f8f2f; }
  .mien.perdu { color: #b31111; }
  .mien.rembourse { color: #6c8f3a; }
  .note { margin-top: 6px; color: #6c8f3a; }
  .msg { margin-top: 6px; font-weight: bold; }
  .msg.err { color: #b31111; }
  .msg.ok { color: #2f8f2f; }
  .connexion { padding: 14px 8px; text-align: center; line-height: 1.6; }
  a { color: #2C4A0F; }
  /* Le Challenge de demain */
  .reglage { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 4px; }
  .reglage input { width: 70px; padding: 3px 6px; border: 1px solid #8bc55a; border-radius: 3px; font: 12px Verdana, sans-serif; }
  .bascule { display: inline-flex; border: 2px solid #E3756A; border-radius: 12px; overflow: hidden; }
  .bascule button { border: 0; background: #fff; color: #E3756A; font: bold 11px Verdana, sans-serif; padding: 4px 10px; cursor: pointer; }
  .bascule button.on { background: #E3756A; color: #fff; }
  .jeu { background: #D6F7B5; border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; }
  .jeu summary { font: bold 12px Arial, sans-serif; color: #2C4A0F; display: flex; gap: 8px; flex-wrap: wrap; cursor: pointer; list-style: none; }
  .jeu summary::-webkit-details-marker { display: none; }
  .jeu summary::before { content: '▸'; color: #E3756A; }
  .jeu[open] summary::before { content: '▾'; }
  .jeu summary span { margin-left: auto; font-weight: normal; color: #6c8f3a; }
  .jeu summary b { color: #E3756A; }
  .cand { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid #C3EF93; }
  .cand .n { font-weight: bold; color: #2C4A0F; overflow-wrap: anywhere; }
  .cand .n small { font-weight: normal; color: #6c8f3a; }
  .cand .m { color: #6c8f3a; font-size: 10px; text-align: right; }
  /* Les cotes en colonnes fixes : l'en-tête « médaillé / or » tombe juste au-dessus. */
  .jeu .cand { grid-template-columns: 1fr 58px 58px 64px; }
  .jeu .cand .m { text-align: right; }
  .cand.tete { border-top: 0; padding-bottom: 0; }
  .cand .c { color: #6c8f3a; font: 11px Verdana, sans-serif; text-align: right; min-width: 42px; }
  .cand .c.on { color: #E3756A; font-weight: bold; font-size: 13px; }
  .btn-p { border: 0; border-radius: 10px; background: #E3756A; color: #fff; font: bold 10px Verdana, sans-serif; padding: 4px 10px; cursor: pointer; }
  .btn-p:disabled { background: #c9b1ad; cursor: default; }
  .autre { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .autre input { width: 130px; padding: 3px 6px; border: 1px solid #8bc55a; border-radius: 3px; font: 11px Verdana, sans-serif; }
  .podiums { line-height: 1.7; padding: 4px 6px; }
  @media (max-width: 420px) {
    .jeu .cand { grid-template-columns: 1fr 1fr 64px; }
    .jeu .cand .m { text-align: left; }
    .cand .n { grid-column: 1 / -1; }
    .cand .m, .cand .c { text-align: left; }
    body { padding: 6px; }
    .duo { grid-template-columns: 1fr; }
    .duo .contre { text-align: center; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="entete">
    <span>🎲</span>
    <span class="titre">Paris</span>
    <span class="solde" id="solde"></span>
  </div>
  <div id="challenge"></div>
  <div id="contenu"><p class="vide">Chargement…</p></div>
</div>
<script>
(function () {
  'use strict';
  var sid = new URLSearchParams(location.search).get('sid') || '';
  if (!sid) {
    try { sid = (JSON.parse(localStorage.getItem('fp_light_session') || '{}') || {}).sid || ''; } catch (e) { sid = ''; }
  }
  var contenu = document.getElementById('contenu');
  var etat = null;
  var messages = {};       // id du match -> { texte, ok }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nombre(n) { return Number(n || 0).toLocaleString('fr-FR'); }
  function kz(n) { return nombre(n) + ' kikooz'; }
  function cote(c) { return c == null ? null : '×' + String(c).replace('.', ','); }

  function charger() {
    return fetch('/api/paris?sid=' + encodeURIComponent(sid), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { etat = d; rendre(); })
      .catch(function () { contenu.innerHTML = '<p class="vide">Le serveur ne répond pas. Réessaie dans un instant.</p>'; });
  }

  function carteJoueur(m, j, autre, ouvert) {
    var mises = j.mises || { mises: 0, parieurs: 0, cote: null };
    var c = cote(mises.cote);
    var choisi = m.mien && m.mien.choix === j.pseudo.toLowerCase();
    var gagnant = m.vainqueur && m.vainqueur.toLowerCase() === j.pseudo.toLowerCase();
    var bloque = !ouvert || m.interdit || !etat.moi || (m.mien && m.mien.choix !== j.pseudo.toLowerCase());
    var tag = ouvert ? 'button' : 'div';
    return '<' + tag + ' class="cote' + (choisi ? ' choisi' : '') + (gagnant ? ' gagnant' : '') + '"'
      + (ouvert ? ' data-match="' + m.id + '" data-choix="' + esc(j.pseudo) + '"' + (bloque ? ' disabled' : '') : '') + '>'
      + '<span class="nom">' + (gagnant ? '🏆 ' : '') + esc(j.nom) + '</span>'
      + (c ? '<span class="x">' + c + '</span>' : '<span class="x vide">pas encore de mise</span>')
      + '<span class="detail">' + kz(mises.mises) + ' · ' + mises.parieurs + ' parieur' + (mises.parieurs > 1 ? 's' : '') + '</span>'
      + '</' + tag + '>';
  }

  function blocMatch(t, m, ouvert) {
    var h = '<div class="match" id="m' + m.id + '">'
      + '<div class="tour"><span>' + esc(m.tour) + (m.poule ? ' — poule ' + esc(m.poule) : '') + '</span>'
      + '<span class="pot">pot : ' + kz(m.pot) + '</span></div>'
      + '<div class="duo">' + carteJoueur(m, m.j1, m.j2, ouvert) + '<span class="contre">contre</span>' + carteJoueur(m, m.j2, m.j1, ouvert) + '</div>';
    if (m.mien) {
      var nomChoix = m.mien.choix === m.j1.pseudo.toLowerCase() ? m.j1.nom : m.j2.nom;
      if (m.mien.statut === 'gagne') h += '<div class="mien gagne">Gagné : ta mise de ' + kz(m.mien.mise) + ' sur ' + esc(nomChoix) + ' t’a rapporté ' + kz(m.mien.gain) + '.</div>';
      else if (m.mien.statut === 'perdu') h += '<div class="mien perdu">Perdu : ta mise de ' + kz(m.mien.mise) + ' sur ' + esc(nomChoix) + '.</div>';
      else if (m.mien.statut === 'rembourse') h += '<div class="mien rembourse">Remboursé : ' + kz(m.mien.gain) + ' (personne en face, ou match annulé).</div>';
      else h += '<div class="mien">Ta mise : ' + kz(m.mien.mise) + ' sur ' + esc(nomChoix) + '.</div>';
    }
    if (ouvert && m.interdit) {
      h += '<div class="note">C’est ton match : tu ne peux pas parier dessus. Bonne chance !</div>';
    } else if (ouvert && etat.moi) {
      var deja = m.mien ? m.mien.mise : 0;
      var reste = Math.max(0, t.plafond - deja);
      if (reste > 0) {
        h += '<div class="miser"><input type="number" min="1" max="' + reste + '" step="1" value="' + Math.min(10, reste) + '" id="mise' + m.id + '" aria-label="Mise en kikooz">'
          + '<span class="aide">kikooz — ' + (m.mien ? 'tu peux ajouter jusqu’à ' + kz(reste) + ' sur le même joueur' : 'choisis ta mise, puis touche un joueur') + '</span></div>';
      } else {
        h += '<div class="note">Tu as misé le plafond sur ce match.</div>';
      }
    } else if (!ouvert && !m.vainqueur) {
      h += '<div class="note">Le match a commencé : les mises sont fermées.</div>';
    }
    var msg = messages[m.id];
    if (msg) h += '<div class="msg ' + (msg.ok ? 'ok' : 'err') + '">' + esc(msg.texte) + '</div>';
    return h + '</div>';
  }

  function rendre() {
    var d = etat;
    if (d.solde != null) document.getElementById('solde').textContent = 'Ton solde : ' + kz(d.solde);
    if (!d.tournois || !d.tournois.length) {
      contenu.innerHTML = '<p class="vide">Aucun tournoi n’a de paris ouverts en ce moment'
        + (etatC && etatC.actif ? '.' : ' : reviens au prochain !') + '</p>';
      return;
    }
    var h = '';
    if (!d.moi) h += '<p class="connexion">Pour parier, <a href="/light.html">connecte-toi au parc</a>, puis reviens ici.</p>';
    d.tournois.forEach(function (t) {
      h += '<div class="bandeau">' + esc(t.nom) + ' <small>' + esc(t.jeu) + '</small></div>'
        + '<div class="regle">Pari mutuel : toutes les mises d’un match font un pot, que se partagent ceux qui ont vu juste, '
        + 'au prorata de leur mise. La cote (×) est celle du pot à l’instant : elle bouge jusqu’au début du match. '
        + 'Mise maximale : ' + kz(t.plafond) + ' par match. On ne parie pas sur ses propres matchs. '
        + 'Si personne n’a misé sur le vainqueur, chacun récupère sa mise.</div>';
      h += '<h3>Matchs ouverts aux paris</h3>';
      h += t.ouverts.length ? t.ouverts.map(function (m) { return blocMatch(t, m, true); }).join('')
        : '<p class="vide">Pas de match ouvert : les prochains le seront dès que leurs deux joueurs seront connus.</p>';
      if (t.enCours.length) {
        h += '<h3>Matchs en cours</h3>' + t.enCours.map(function (m) { return blocMatch(t, m, false); }).join('');
      }
      if (t.regles.length) {
        h += '<h3>Résultats</h3>' + t.regles.map(function (m) { return blocMatch(t, m, false); }).join('');
      }
    });
    contenu.innerHTML = h;
  }

  contenu.addEventListener('click', function (ev) {
    var b = ev.target.closest('button.cote');
    if (!b || b.disabled) return;
    var id = Number(b.getAttribute('data-match'));
    var choix = b.getAttribute('data-choix');
    var champ = document.getElementById('mise' + id);
    var mise = champ ? Math.floor(Number(champ.value)) : 0;
    var nom = b.querySelector('.nom').textContent;
    if (!(mise >= 1)) { messages[id] = { texte: 'Indique une mise d’au moins 1 kikooz.' }; rendre(); return; }
    if (!confirm('Miser ' + kz(mise) + ' sur ' + nom + ' ?\n\nUne mise ne se reprend pas.')) return;
    b.disabled = true;
    fetch('/api/paris', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: sid, match: id, choix: choix, mise: mise }),
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        messages[id] = j.ok ? { ok: true, texte: 'C’est parié : ' + kz(j.mise) + ' sur ' + nom + '.' }
          : { texte: j.message || 'Le pari n’a pas pu être enregistré.' };
        return charger();
      })
      .catch(function () { messages[id] = { texte: 'Le serveur ne répond pas.' }; rendre(); });
  });

  // ── LE CHALLENGE DE DEMAIN ─────────────────────────────────────────────
  // On parie la veille sur les médaillés du lendemain : « médaillé » (sur le
  // podium) ou « or ». Chaque joueur a sa cote, tirée de son historique ; une
  // mise et un type communs à toute la section.
  var zoneC = document.getElementById('challenge');
  var etatC = null, typeC = 'podium', msgC = {}, ouvertsC = {};
  function cote(c) { return c == null ? '—' : '×' + String(c).replace('.', ','); }
  function retour(mise, c) { return Math.floor(mise * c + 1e-9); }
  function chargerChallenge() {
    return fetch('/api/paris/challenge?sid=' + encodeURIComponent(sid), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        etatC = d; rendreChallenge();
        if (etat) rendre();          // le mot « pas de tournoi » dépend du Challenge
      })
      .catch(function () { zoneC.innerHTML = ''; });
  }
  function rendreChallenge() {
    var d = etatC;
    if (!d || !d.actif) { zoneC.innerHTML = ''; return; }
    if (d.solde != null) document.getElementById('solde').textContent = 'Ton solde : ' + kz(d.solde);
    var R = d.regles || { fenetre: 30, joursMin: 7, maxSoi: 3 };
    var reste = Math.max(0, d.plafond - (d.dejaMise || 0));
    var champ = document.getElementById('miseC');
    var miseCourante = champ ? champ.value : String(Math.min(10, reste || 10));
    var h = '<div class="bandeau">Challenge de ' + esc(d.jourLisible) + ' <small>les médaillés de demain</small></div>'
      + '<div class="regle">Mise sur les joueurs que tu vois sur le podium du Challenge de demain : « médaillé » (or, argent ou bronze) '
      + 'ou « or » (le premier). Chaque joueur a sa <b>cote</b>, tirée de ses ' + R.fenetre + ' derniers jours de Challenge sur le jeu : '
      + 'si tu vois juste, tu reçois ta mise multipliée par la cote, celle du moment où tu mises. Un joueur qui ne vient pas jouer fait perdre le pari. '
      + 'Seuls les joueurs venus au moins ' + R.joursMin + ' jours ont une cote. Tu peux miser sur toi, à ' + cote(R.maxSoi) + ' au plus. '
      + 'Les mises se ferment ce soir à minuit. Maximum : ' + kz(d.plafond) + ' par jour, tous jeux confondus.</div>';
    if (d.moi) {
      h += '<div class="reglage"><span class="bascule"><button data-type="podium" class="' + (typeC === 'podium' ? 'on' : '') + '">Médaillé</button>'
        + '<button data-type="or" class="' + (typeC === 'or' ? 'on' : '') + '">Médaille d’or</button></span>'
        + '<input type="number" id="miseC" min="1" max="' + reste + '" value="' + esc(miseCourante) + '" aria-label="Mise"> kikooz'
        + '<span class="aide" style="color:#6c8f3a">— déjà misé pour demain : ' + kz(d.dejaMise) + ' sur ' + kz(d.plafond) + '</span></div>';
    } else {
      h += '<p class="connexion">Pour parier, <a href="/light.html">connecte-toi au parc</a>, puis reviens ici.</p>';
    }
    // Un jeu par volet : ouverts d'office, ceux où il y a déjà du jeu (ou que
    // le joueur a ouverts lui-même) ; les autres se déplient au toucher.
    d.jeux.forEach(function (j) {
      var ouvert = ouvertsC[j.cle] !== undefined ? ouvertsC[j.cle] : (j.mises > 0 || j.mesParis.length > 0);
      h += '<details class="jeu" data-jeu="' + esc(j.cle) + '"' + (ouvert ? ' open' : '') + '><summary>' + esc(j.nom)
        + (j.mesParis.length ? ' <b>✓</b>' : '')
        + '<span>' + j.eligibles + ' joueur' + (j.eligibles > 1 ? 's' : '') + ' coté' + (j.eligibles > 1 ? 's' : '') + ' · misé : ' + kz(j.mises) + '</span></summary>';
      if (j.candidats.length) {
        h += '<div class="cand tete"><span class="n"></span><span class="m">médaillé</span><span class="m">or</span><span></span></div>';
      }
      j.candidats.forEach(function (c) {
        var ici = c.cote[typeC];
        h += '<div class="cand"><span class="n">' + esc(c.nom) + (c.soi ? ' <small>(toi)</small>' : '')
          + ' <small>' + c.podiums + ' podium' + (c.podiums > 1 ? 's' : '') + (c.ors ? ', ' + c.ors + ' en or' : '') + ' · ' + c.joues + ' j. joués</small></span>'
          + '<span class="c' + (typeC === 'podium' ? ' on' : '') + '">' + cote(c.cote.podium) + '</span>'
          + '<span class="c' + (typeC === 'or' ? ' on' : '') + '">' + cote(c.cote.or) + '</span>'
          + '<button class="btn-p" data-jeu="' + esc(j.cle) + '" data-choix="' + esc(c.pseudo) + '" data-nom="' + esc(c.nom) + '" data-cote="' + ici + '"'
          + (d.moi && reste > 0 ? '' : ' disabled') + '>Parier</button></div>';
      });
      if (!j.candidats.length) h += '<p class="vide">Personne n’a encore assez joué à ce jeu (' + R.joursMin + ' jours sur ' + R.fenetre + ') pour avoir une cote.</p>';
      if (d.moi && reste > 0 && j.eligibles > j.candidats.length) {
        h += '<div class="autre"><input placeholder="un autre joueur" id="autre-' + esc(j.cle) + '">'
          + '<button class="btn-p" data-jeu="' + esc(j.cle) + '" data-autre="1">Parier</button></div>';
      }
      if (j.mesParis.length) {
        h += '<div class="mien">Tes paris : ' + j.mesParis.map(function (p) {
          return esc(p.nom) + ' ' + (p.type === 'or' ? 'en or' : 'médaillé') + ' (' + kz(p.mise)
            + (p.retour != null ? ' à ' + cote(p.cote) + ', rapportera ' + kz(p.retour) : '') + ')';
        }).join(' · ') + '</div>';
      }
      var m = msgC[j.cle];
      if (m) h += '<div class="msg ' + (m.ok ? 'ok' : 'err') + '">' + esc(m.texte) + '</div>';
      h += '</details>';
    });
    var hier = d.hier || {};
    if ((hier.podiums && hier.podiums.length) || (hier.mesParis && hier.mesParis.length)) {
      h += '<h3>Le Challenge de ' + esc(hier.jourLisible) + '</h3><div class="podiums">';
      (hier.podiums || []).forEach(function (p) {
        h += '<div><b>' + esc(p.nom) + '</b> : 🥇 ' + esc(p.podium[0] || '—') + (p.podium[1] ? ' · 🥈 ' + esc(p.podium[1]) : '') + (p.podium[2] ? ' · 🥉 ' + esc(p.podium[2]) : '') + '</div>';
      });
      (hier.mesParis || []).forEach(function (p) {
        var cls = p.statut === 'gagne' ? 'gagne' : p.statut === 'perdu' ? 'perdu' : 'rembourse';
        var t = p.statut === 'gagne' ? 'gagné : +' + kz(p.gain) : p.statut === 'perdu' ? 'perdu' : p.statut === 'rembourse' ? 'remboursé' : 'en attente du changement de jour';
        h += '<div class="mien ' + cls + '">' + esc(p.texte) + ' — ' + kz(p.mise) + ' misés' + (p.cote != null ? ' à ' + cote(p.cote) : '') + ', ' + t + '</div>';
      });
      h += '</div>';
    }
    zoneC.innerHTML = h;
  }
  // Le volet qu'on ouvre ou ferme le reste aux rafraîchissements.
  zoneC.addEventListener('toggle', function (ev) {
    var dj = ev.target;
    if (dj && dj.classList && dj.classList.contains('jeu')) ouvertsC[dj.getAttribute('data-jeu')] = dj.open;
  }, true);
  zoneC.addEventListener('click', function (ev) {
    var t = ev.target.closest('.bascule button');
    if (t) { typeC = t.getAttribute('data-type'); rendreChallenge(); return; }
    var b = ev.target.closest('.btn-p');
    if (!b || b.disabled) return;
    var jeu = b.getAttribute('data-jeu');
    var choix = b.getAttribute('data-choix'), nom = b.getAttribute('data-nom');
    var c = b.getAttribute('data-autre') ? null : Number(b.getAttribute('data-cote'));
    if (b.getAttribute('data-autre')) {
      var champ = document.getElementById('autre-' + jeu);
      choix = nom = (champ && champ.value.trim()) || '';
      if (!choix) { msgC[jeu] = { texte: 'Indique le pseudo du joueur.' }; rendreChallenge(); return; }
    }
    var mise = Math.floor(Number((document.getElementById('miseC') || {}).value));
    if (!(mise >= 1)) { msgC[jeu] = { texte: 'Indique une mise d’au moins 1 kikooz.' }; rendreChallenge(); return; }
    var quoi = typeC === 'or' ? 'en or' : 'médaillé';
    var question = c
      ? 'Miser ' + kz(mise) + ' sur ' + nom + ' ' + quoi + ' demain, à ' + cote(c) + ' ?\n\nS’il l’est, tu reçois ' + kz(retour(mise, c)) + '. Une mise ne se reprend pas.'
      : 'Miser ' + kz(mise) + ' sur ' + nom + ' ' + quoi + ' demain, à sa cote du moment ?\n\nUne mise ne se reprend pas.';
    if (!confirm(question)) return;
    b.disabled = true;
    fetch('/api/paris/challenge', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: sid, jeu: jeu, type: typeC, choix: choix, mise: mise, cote: c }),
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        msgC[jeu] = j.ok ? { ok: true, texte: 'C’est parié : ' + kz(mise) + ' sur ' + nom + ' ' + quoi + ' à ' + cote(j.cote) + ' — tu recevras ' + kz(j.retour) + ' s’il l’est.' }
          : { texte: j.message || 'Le pari n’a pas pu être enregistré.' };
        return chargerChallenge();
      })
      .catch(function () { msgC[jeu] = { texte: 'Le serveur ne répond pas.' }; rendreChallenge(); });
  });

  chargerChallenge();
  charger();
  // Les cotes bougent : on relit toutes les trente secondes, sauf pendant
  // qu'on tape une mise.
  setInterval(function () {
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT') return;
    charger();
    chargerChallenge();
  }, 30000);
})();
</script>
</body>
</html>
