<!DOCTYPE html>
<html lang="fr">
<!-- LES PRUNOSTICS — les paris du parc.

     Trois onglets : le Challenge de demain (médaillé ou or, cote fixe tirée
     de l'historique), les tournois dont l'organisateur a ouvert les paris
     (pari MUTUEL : le pot d'un match va à ceux qui ont vu juste, au prorata
     de leur mise), et le registre — mes paris et les gros coups du parc.

     Le geste est celui d'un ticket de paris : on TOUCHE UNE COTE, un ticket
     s'ouvre sous la ligne (la mise, en un toucher ou au clavier, et ce qu'elle
     rapporterait), on valide. Pas de mise à régler en haut de page, pas de
     boîte de confirmation du navigateur.

     Le bureau du light l'ouvre dans une de ses fenêtres (?cadre=1 : la fenêtre
     fait le cadre et le titre), le mobile dans une feuille. La session est
     celle du light. -->
<head>
<meta charset="UTF-8">
<title>Prunostics — Frutiparc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 11px Verdana, Arial, Helvetica, sans-serif; background: #ADE76B; color: #335511; padding: 12px; }
  .shell {
    background: #fff; border-radius: 7px; overflow: hidden; border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF; max-width: 760px; margin: 0 auto;
  }
  a { color: #2C4A0F; }
  button { font-family: inherit; }
  .vide { color: #6c8f3a; padding: 8px 12px 12px; line-height: 1.5; }
  .connexion { padding: 14px 12px; text-align: center; line-height: 1.6; }

  /* L'en-tête : le nom (caché dans une fenêtre, qui le porte déjà) et le solde. */
  .tete { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .tete .marque { display: flex; align-items: center; gap: 6px; color: #7A3E9D; font: bold 16px Arial, sans-serif; }
  .tete .marque img { width: 20px; height: 20px; }
  .tete .solde { margin-left: auto; text-align: right; font-weight: bold; color: #2C4A0F; font-size: 12px; }
  .tete .solde small { display: block; font-weight: normal; color: #6c8f3a; font-size: 10px; }

  .onglets { display: flex; gap: 4px; padding: 0 12px; border-bottom: 2px solid #E3756A; }
  .onglets button { border: 0; border-radius: 7px 7px 0 0; background: #D6F7B5; color: #2C4A0F; font: bold 12px Arial, sans-serif; padding: 6px 14px; cursor: pointer; }
  .onglets button.on { background: #E3756A; color: #fff; }
  .onglets button i { font-style: normal; background: #fff; color: #E3756A; border-radius: 8px; padding: 0 5px; margin-left: 4px; font-size: 10px; }
  .vue[hidden] { display: none; }

  /* Le titre d'une vue, et sa règle repliée. */
  .soustitre { padding: 10px 12px 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .soustitre b { font: bold 14px Arial, sans-serif; color: #E3756A; }
  .soustitre span { color: #6c8f3a; font-size: 10px; }
  details.regle { margin: 0 12px 6px; color: #2C4A0F; }
  details.regle summary { cursor: pointer; color: #6c8f3a; font-size: 10px; list-style: none; }
  details.regle summary::before { content: '? '; display: inline-block; width: 13px; height: 13px; line-height: 13px; text-align: center; border-radius: 50%; background: #D6F7B5; color: #2C4A0F; font-weight: bold; margin-right: 4px; }
  details.regle summary::-webkit-details-marker { display: none; }
  details.regle div { background: #F2FBE8; border-radius: 6px; padding: 7px 9px; margin-top: 5px; line-height: 1.55; }

  /* Le budget du jour. */
  .budget { margin: 4px 12px 8px; background: #F2FBE8; border-radius: 6px; padding: 6px 8px; }
  .budget .l { display: flex; justify-content: space-between; font-size: 10px; color: #6c8f3a; }
  .budget .l b { color: #2C4A0F; }
  .jauge { height: 6px; background: #D6F7B5; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .jauge i { display: block; height: 100%; background: #E3756A; border-radius: 3px; transition: width .3s; }

  .toast { margin: 4px 12px 8px; background: #2f8f2f; color: #fff; border-radius: 6px; padding: 7px 10px; font-weight: bold; }
  .mes { margin: 0 12px 8px; background: #F2FBE8; border-radius: 6px; padding: 7px 9px; line-height: 1.7; }
  .mes h4 { font: bold 11px Arial, sans-serif; color: #2C4A0F; }
  .mes b { color: #2f8f2f; }

  /* Les jeux, en pastilles. */
  .jeux { display: flex; gap: 5px; padding: 6px 12px; flex-wrap: wrap; }
  .jeux button { border: 1.5px solid #8bc55a; background: #fff; border-radius: 12px; padding: 3px 9px; font: bold 11px Verdana, sans-serif; color: #2C4A0F; cursor: pointer; white-space: nowrap; }
  .jeux button.on { background: #2C4A0F; color: #fff; border-color: #2C4A0F; }
  .jeux button em { font-style: normal; font-weight: normal; opacity: .75; }
  .jeux button .pt { color: #E3756A; }
  .jeux button.on .pt { color: #F7B9B2; }

  .cherche { display: flex; gap: 6px; margin: 2px 12px 6px; }
  .cherche input { flex: 1; min-width: 0; border: 1.5px solid #8bc55a; border-radius: 12px; padding: 4px 10px; font: 11px Verdana, sans-serif; color: #2C4A0F; }
  .cherche button { border: 0; border-radius: 12px; background: #D6F7B5; color: #2C4A0F; font: bold 11px Verdana, sans-serif; padding: 4px 12px; cursor: pointer; }
  .decouv { margin: 0 12px 6px; color: #6c8f3a; font-size: 10px; line-height: 1.5; }

  /* Une ligne de joueur : son nom, ses deux cotes-boutons. */
  .ligne { display: grid; grid-template-columns: 1fr 76px 76px; gap: 6px; align-items: center; padding: 6px 12px; border-top: 1px solid #E5F8D2; }
  .ligne.sel { background: #FFF6F4; }
  .ligne.trouve { background: #FBF7E6; }
  .nom { font-weight: bold; color: #2C4A0F; font-size: 12px; overflow-wrap: anywhere; }
  .nom small { display: block; font-weight: normal; color: #6c8f3a; font-size: 10px; }
  .nom .toi { display: inline; color: #E3756A; font-size: 10px; }
  .c { border: 2px solid #C3EF93; border-radius: 7px; text-align: center; padding: 3px 0; background: #fff; cursor: pointer; font-family: inherit; }
  .c b { display: block; font: bold 14px Arial, sans-serif; color: #E3756A; }
  .c span { font-size: 9px; color: #6c8f3a; }
  .c.or { border-color: #F1D27A; } .c.or b { color: #C8860A; }
  .c:hover:not(:disabled) { border-color: #E3756A; }
  .c.choisi { background: #E3756A; border-color: #E3756A; } .c.choisi b, .c.choisi span { color: #fff; }
  .c:disabled { cursor: default; opacity: .55; }
  .plus { padding: 6px 12px 8px; color: #6c8f3a; }
  .plus button { border: 0; background: none; color: #2C4A0F; text-decoration: underline; cursor: pointer; font: 11px Verdana, sans-serif; }

  /* LE TICKET, sous la ligne choisie. */
  .ticket { margin: 0 12px 6px; border: 2px solid #E3756A; border-top: 0; border-radius: 0 0 8px 8px; background: #FFF6F4; padding: 8px 10px; }
  .ticket .qui { font-weight: bold; color: #2C4A0F; line-height: 1.4; }
  .puces { display: flex; gap: 5px; margin: 8px 0; align-items: center; flex-wrap: wrap; }
  .puces button { border: 1.5px solid #E3756A; background: #fff; color: #E3756A; border-radius: 10px; padding: 3px 10px; font: bold 11px Verdana, sans-serif; cursor: pointer; }
  .puces button.on { background: #E3756A; color: #fff; }
  .puces input { width: 60px; border: 1px solid #8bc55a; border-radius: 3px; padding: 3px 5px; font: 12px Verdana, sans-serif; color: #2C4A0F; }
  .gain { font-size: 12px; color: #2C4A0F; }
  .gain b { color: #2f8f2f; font-size: 15px; }
  .gain small { color: #6c8f3a; }
  .go { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .go .ok { flex: 1; border: 0; background: #E3756A; color: #fff; border-radius: 12px; padding: 7px; font: bold 12px Arial, sans-serif; cursor: pointer; }
  .go .ok:disabled { background: #c9b1ad; cursor: default; }
  .go .ko { border: 0; background: none; color: #6c8f3a; padding: 6px; cursor: pointer; font: 11px Verdana, sans-serif; }
  .erreur { color: #b31111; font-weight: bold; margin-top: 6px; }
  .note { color: #6c8f3a; margin-top: 6px; }

  /* Hier. */
  .hier { margin: 10px 12px 12px; border-top: 2px solid #E5F8D2; padding-top: 8px; line-height: 1.7; }
  .hier h4 { font: bold 12px Arial, sans-serif; color: #2C4A0F; margin-bottom: 2px; }
  .gagne { color: #2f8f2f; } .perdu { color: #b31111; } .rembourse { color: #6c8f3a; }

  /* Les tournois. */
  .bandeau { margin: 10px 12px 0; background: #E3756A; color: #fff; font: bold 12px Arial, sans-serif; padding: 6px 10px; border-radius: 7px 7px 0 0; }
  .bandeau small { font-weight: normal; opacity: .9; }
  h3 { font: bold 12px Arial, sans-serif; color: #2C4A0F; margin: 10px 12px 6px; }
  .match { background: #F2FBE8; border-radius: 6px; padding: 8px 10px; margin: 0 12px 8px; }
  .match.sel { background: #FFF6F4; outline: 2px solid #E3756A; }
  .match .tour { color: #6c8f3a; font-size: 10px; margin-bottom: 6px; display: flex; gap: 8px; }
  .match .tour .pot { margin-left: auto; font-weight: bold; color: #2C4A0F; }
  .duo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: stretch; }
  .duo .contre { align-self: center; color: #6c8f3a; font-weight: bold; }
  .joueur { background: #fff; border: 2px solid #C3EF93; border-radius: 7px; padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; text-align: left; font: 11px Verdana, sans-serif; color: #335511; }
  button.joueur { cursor: pointer; }
  button.joueur:hover:not(:disabled) { border-color: #E3756A; }
  button.joueur:disabled { cursor: default; opacity: .7; }
  .joueur.choisi { border-color: #E3756A; background: #E3756A; } .joueur.choisi * { color: #fff !important; }
  .joueur.gagnant { border-color: #2f8f2f; }
  .joueur .n { font-weight: bold; font-size: 12px; color: #2C4A0F; overflow-wrap: anywhere; }
  .joueur .x { font: bold 15px Arial, sans-serif; color: #E3756A; }
  .joueur .x.rien { color: #9ab87a; font-size: 11px; }
  .joueur .d { color: #6c8f3a; font-size: 10px; }
  .match .ticket { margin: 8px 0 0; border-top: 2px solid #E3756A; border-radius: 8px; }
  .mien { margin-top: 6px; font-weight: bold; color: #2C4A0F; }

  /* Le registre. */
  .bilan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 12px; }
  .bilan div { background: #D6F7B5; border-radius: 6px; padding: 6px 8px; text-align: center; }
  .bilan b { display: block; font: bold 15px Arial, sans-serif; color: #2C4A0F; }
  .bilan b.plus { color: #2f8f2f; } .bilan b.moins { color: #b31111; }
  .bilan span { color: #6c8f3a; font-size: 10px; }
  .regbloc { padding: 0 12px 10px; }
  table.reg { width: 100%; border-collapse: collapse; }
  table.reg th { text-align: left; color: #6c8f3a; font-weight: normal; font-size: 10px; padding: 3px 4px; border-bottom: 1px solid #C3EF93; }
  table.reg td { padding: 4px; border-bottom: 1px solid #E5F8D2; vertical-align: top; }
  table.reg td.n { text-align: right; white-space: nowrap; }
  .st { font-weight: bold; white-space: nowrap; }
  .st.gagne { color: #2f8f2f; } .st.perdu { color: #b31111; } .st.rembourse, .st.ouvert { color: #6c8f3a; }
  .coup { background: #fff6f4; border-left: 3px solid #E3756A; border-radius: 4px; padding: 6px 8px; margin: 0 0 6px; line-height: 1.5; }
  .coup .q { color: #6c8f3a; font-size: 10px; }
  .regbloc h3 { margin: 10px 0 6px; }

  /* Dans une fenêtre du bureau (?cadre=1) : la fenêtre fait le cadre et le titre. */
  body.cadre { padding: 0; background: #fff; }
  body.cadre .shell { border: 0; border-radius: 0; box-shadow: none; max-width: none; }
  body.cadre .tete .marque { display: none; }

  @media (max-width: 420px) {
    body { padding: 6px; }
    .ligne { grid-template-columns: 1fr 64px 64px; padding: 6px 8px; gap: 4px; }
    .duo { grid-template-columns: 1fr; }
    .duo .contre { text-align: center; }
    .bilan { grid-template-columns: repeat(2, 1fr); }
    table.reg .q-date { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="tete">
    <span class="marque"><img src="/frutiz/sprites/fruit_winDebug.svg" alt="">Prunostics</span>
    <span class="solde" id="solde"></span>
  </div>
  <div class="onglets">
    <button data-vue="challenge" class="on">Challenge</button>
    <button data-vue="tournois">Tournois</button>
    <button data-vue="registre">Registre</button>
  </div>
  <div class="vue" id="vue-challenge"><p class="vide">Chargement…</p></div>
  <div class="vue" id="vue-tournois" hidden><p class="vide">Chargement…</p></div>
  <div class="vue" id="vue-registre" hidden></div>
</div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var sid = params.get('sid') || '';
  if (!sid) {
    try { sid = (JSON.parse(localStorage.getItem('fp_light_session') || '{}') || {}).sid || ''; } catch (e) { sid = ''; }
  }
  var cadre = params.get('cadre') === '1';
  if (cadre) document.body.classList.add('cadre');
  // Dans une fenêtre du bureau, un lien sort de la fenêtre, pas dans le cadre.
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (a && cadre) a.target = '_top';
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(s) { return document.querySelector(s); }
  function nombre(n) { return Number(n || 0).toLocaleString('fr-FR'); }
  function kz(n) { return nombre(n) + ' kikooz'; }
  function cote(c) { return c == null ? '—' : '×' + String(c).replace('.', ','); }
  function retour(mise, c) { return Math.floor(mise * c + 1e-9); }
  function json(r) { return r.json(); }
  var CONNEXION = '<p class="connexion">Pour parier, <a href="/light.html">connecte-toi au parc</a>, puis reviens ici.</p>';

  // ── L'état ─────────────────────────────────────────────────────────────
  var vue = 'challenge';
  var etatC = null, etatT = null;
  var jeuActif = null;          // la pastille choisie
  var toutVoir = {};            // jeu -> la liste entière dépliée
  var trouve = {};              // jeu -> le joueur cherché (hors liste)
  var ticket = null;            // { sorte: 'c'|'t', ... } : le ticket ouvert
  var toast = null;             // { vue, texte }
  var solde = null;

  function majSolde(n) {
    if (n == null) return;
    solde = n;
    $('#solde').innerHTML = kz(n) + '<small>ton solde</small>';
  }

  // ── LE TICKET ──────────────────────────────────────────────────────────
  // Commun aux deux sortes de paris : un titre, des montants rapides, la
  // mise au clavier, ce qu'elle rapporterait, et les deux boutons.
  function ticketHtml(t) {
    var reste = Math.max(0, t.reste);
    if (!reste) {
      return '<div class="ticket"><div class="qui">' + t.titre + '</div>'
        + '<div class="note">' + esc(t.plein) + '</div>'
        + '<div class="go"><button class="ko" data-act="fermer">Fermer</button></div></div>';
    }
    var mise = Math.max(1, Math.min(reste, t.mise || Math.min(10, reste)));
    t.mise = mise;
    var puces = [5, 10, 20].filter(function (n) { return n < reste; }).map(function (n) {
      return '<button data-mise="' + n + '" class="' + (n === mise ? 'on' : '') + '">' + n + '</button>';
    }).join('') + '<button data-mise="' + reste + '" class="' + (mise === reste ? 'on' : '') + '">Max (' + reste + ')</button>';
    return '<div class="ticket">'
      + '<div class="qui">' + t.titre + '</div>'
      + '<div class="puces">' + puces + '<input type="number" min="1" max="' + reste + '" value="' + mise + '" data-saisie="1" aria-label="Mise"> kikooz</div>'
      + '<div class="gain" data-gain="1">' + t.gainHtml(mise) + '</div>'
      + (t.erreur ? '<div class="erreur">' + esc(t.erreur) + '</div>' : '')
      + '<div class="go"><button class="ko" data-act="fermer">Annuler</button>'
      + '<button class="ok" data-act="parier"' + (t.envoi ? ' disabled' : '') + '>' + (t.envoi ? 'Un instant…' : 'Parier ' + kz(mise)) + '</button></div>'
      + '</div>';
  }
  // La mise change sans redessiner la page (on garde le clavier).
  function majTicket() {
    var zone = document.querySelector('.ticket');
    if (!zone || !ticket) return;
    zone.querySelector('[data-gain]').innerHTML = ticket.gainHtml(ticket.mise);
    var ok = zone.querySelector('[data-act=parier]');
    if (ok && !ticket.envoi) ok.textContent = 'Parier ' + kz(ticket.mise);
    Array.prototype.forEach.call(zone.querySelectorAll('[data-mise]'), function (b) {
      b.classList.toggle('on', Number(b.getAttribute('data-mise')) === ticket.mise);
    });
  }
  document.addEventListener('input', function (ev) {
    if (!ticket || !ev.target.matches('[data-saisie]')) return;
    var v = Math.floor(Number(ev.target.value));
    ticket.mise = v >= 1 ? Math.min(v, ticket.reste) : 0;
    majTicket();
  });

  // ── LE CHALLENGE DE DEMAIN ─────────────────────────────────────────────
  var zoneC = $('#vue-challenge');
  function chargerChallenge() {
    return fetch('/api/paris/challenge?sid=' + encodeURIComponent(sid), { cache: 'no-store' })
      .then(json)
      .then(function (d) { etatC = d; majSolde(d.solde); rendreChallenge(); })
      .catch(function () { zoneC.innerHTML = '<p class="vide">Le serveur ne répond pas. Réessaie dans un instant.</p>'; });
  }
  function resteDuJour() { return etatC ? Math.max(0, etatC.plafond - (etatC.dejaMise || 0)) : 0; }
  function ligneJoueur(j, c, classe) {
    var actif = etatC.moi;
    var choisi = function (type) {
      return ticket && ticket.sorte === 'c' && ticket.jeu === j.cle && ticket.choix === c.pseudo && ticket.type === type;
    };
    var bouton = function (type) {
      return '<button class="c' + (type === 'or' ? ' or' : '') + (choisi(type) ? ' choisi' : '') + '" data-jeu="' + esc(j.cle) + '" data-choix="' + esc(c.pseudo)
        + '" data-type="' + type + '"' + (actif ? '' : ' disabled') + '><b>' + cote(c.cote[type]) + '</b><span>' + (type === 'or' ? 'en or' : 'médaillé') + '</span></button>';
    };
    var stats = c.joues
      ? c.podiums + ' podium' + (c.podiums > 1 ? 's' : '') + ' sur ' + c.joues + ' j.' + (c.ors ? ' · ' + c.ors + ' en or' : '')
      : 'jamais venu ces 30 jours';
    if (c.decouverte) stats += ' · cote de découverte';
    var sel = ticket && ticket.sorte === 'c' && ticket.jeu === j.cle && ticket.choix === c.pseudo;
    var h = '<div class="ligne' + (sel ? ' sel' : '') + (classe ? ' ' + classe : '') + '"><div class="nom">' + esc(c.nom)
      + (c.soi ? ' <span class="toi">(toi)</span>' : '') + '<small>' + stats + '</small></div>' + bouton('podium') + bouton('or') + '</div>';
    if (sel) h += ticketHtml(ticket);
    return h;
  }
  function rendreChallenge() {
    var d = etatC;
    if (!d) return;
    if (!d.actif) {
      zoneC.innerHTML = '<p class="vide">Les Prunostics du Challenge sont fermés pour le moment. Passe voir l’onglet Tournois !</p>';
      return;
    }
    var R = d.regles || { fenetre: 30, joursMin: 7, ecartOr: 1.5, podium: { maxSoi: 3 }, or: { maxSoi: 4.5 } };
    var reste = resteDuJour();
    var h = '<div class="soustitre"><b>Challenge de ' + esc(d.jourLisible) + '</b><span>les médaillés de demain · mises jusqu’à minuit</span></div>'
      + '<details class="regle"><summary>Comment ça marche ?</summary><div>'
      + 'Touche la cote d’un joueur : <b>médaillé</b> s’il finit sur le podium demain (or, argent ou bronze), <b>en or</b> s’il gagne. '
      + 'Choisis ta mise sur le ticket : si tu vois juste, tu reçois ta mise multipliée par la cote, celle du moment où tu mises. '
      + 'Chaque cote est tirée des ' + R.fenetre + ' derniers jours de Challenge du joueur sur le jeu. L’or est plus risqué, il paie plus : '
      + 'au moins ' + String(R.ecartOr).replace('.', ',') + ' fois le médaillé. Un joueur pas dans la liste (même toi, si tu n’y joues jamais) ? '
      + 'Cherche-le : il a la cote de découverte du jeu. Sur toi, la cote est plafonnée à ' + cote(R.podium.maxSoi) + ' en médaillé et ' + cote(R.or.maxSoi) + ' en or. '
      + 'Un joueur qui ne vient pas jouer fait perdre le pari. Maximum : ' + kz(d.plafond) + ' par jour, tous jeux confondus.</div></details>';
    if (!d.moi) h += CONNEXION;
    else {
      h += '<div class="budget"><div class="l"><span>Misé pour demain : <b>' + kz(d.dejaMise) + '</b></span><span>il te reste <b>' + nombre(reste) + '</b> sur ' + nombre(d.plafond) + '</span></div>'

          h += '<tr><td class="q-date">' + esc(date(l.quand)) + '</td><td>' + (l.sorte === 'challenge' ? '🏅 ' : '🏆 ') + esc(l.quoi) + '</td>'
            + '<td class="n">' + nombre(l.mise) + '</td><td class="n">' + (l.cote ? cote(l.cote) : '<small>mutuel</small>') + '</td>'
            + '<td><span class="st ' + l.statut + '">' + STATUTS[l.statut] + '</span>' + (res ? ' ' + res : '') + '</td></tr>';
        });
        h += '</tbody></table>';
      } else {
        h += '<p class="vide" style="padding-left:0">Tu n’as encore rien parié. Tes paris s’inscriront ici, gagnés ou perdus.</p>';
      }
      h += '</div>';
    }
    h += '<div class="regbloc"><h3>Les gros coups du parc <small style="font-weight:normal;color:#6c8f3a">— 30 derniers jours, ' + kz(d.seuil || 100) + ' de bénéfice ou plus</small></h3>';
    if (d.grosCoups && d.grosCoups.length) {
      d.grosCoups.forEach(function (c) {
        h += '<div class="coup"><b>' + esc(c.parieur) + '</b> a misé ' + kz(c.mise) + ' sur ' + esc(c.quoi)
          + (c.cote ? ', à ' + cote(c.cote) : '') + ' : <b>' + kz(c.gain) + '</b> empochés. <span class="q">' + esc(date(c.quand)) + '</span></div>';
      });
    } else {
      h += '<p class="vide" style="padding-left:0">Pas encore de gros coup : Dimitri attend le premier avec impatience.</p>';
    }
    zoneR.innerHTML = h + '</div>';
  }

  // ── Les onglets ────────────────────────────────────────────────────────
  function montrer(v) {
    vue = v;
    ticket = null; toast = null;
    Array.prototype.forEach.call(document.querySelectorAll('.onglets button'), function (x) { x.classList.toggle('on', x.getAttribute('data-vue') === v); });
    zoneC.hidden = v !== 'challenge';
    zoneT.hidden = v !== 'tournois';
    zoneR.hidden = v !== 'registre';
    if (v === 'challenge') rendreChallenge();
    if (v === 'tournois') rendreTournois();
    if (v === 'registre') { if (!zoneR.innerHTML) zoneR.innerHTML = '<p class="vide">Chargement…</p>'; chargerRegistre(); }
  }
  document.querySelector('.onglets').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-vue]');
    if (b) montrer(b.getAttribute('data-vue'));
  });

  Promise.all([chargerChallenge(), chargerTournois()]).then(function () {
    if (/registre/.test(location.hash)) montrer('registre');
    else if (/tournois/.test(location.hash) || (etatC && !etatC.actif && etatT && etatT.tournois && etatT.tournois.length)) montrer('tournois');
  });
  // Les cotes des tournois bougent : on relit toutes les trente secondes,
  // sauf quand un ticket est ouvert (on ne déplace pas la ligne sous le doigt).
  setInterval(function () {
    if (ticket) return;
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT') return;
    chargerTournois();
    chargerChallenge();
  }, 30000);
})();
</script>
</body>
</html>
