<!DOCTYPE html>
<html lang="fr">
<!-- LES PRUNOSTICS — les paris du parc.

     Quatre onglets : le Challenge de demain (médaillé ou or en pari mutuel,
     et le DÉFI MÉDAILLE : une médaille sur soi, à cote fixe tirée de son
     historique, plus haute pour l'or que pour le bronze), les tournois dont l'organisateur a ouvert les paris
     (pari MUTUEL : le pot d'un match va à ceux qui ont vu juste, au prorata
     de leur mise), et le registre — mes paris et les gros coups du parc.

     Le geste est celui d'un ticket de paris : on TOUCHE UNE COTE, un ticket
     s'ouvre sous la ligne (la mise, en un toucher ou au clavier, et ce qu'elle
     rapporterait), on valide. Pas de mise à régler en haut de page, pas de
     boîte de confirmation du navigateur.

     Le bureau du light l'ouvre dans une de ses fenêtres (?cadre=1 : la fenêtre
     fait le cadre et le titre), le mobile dans une feuille. La session est
     celle du light. -->
<head>
<meta charset="UTF-8">
<title>Prunostics — Frutiparc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Les langues du parc (voir /js/i18n.js) : en anglais, le dictionnaire des
     Prunostics arrive pendant l'analyse de la page ; en français, rien. -->
<script src="/js/i18n.js"></script>
<script>FPI18n.charger(['commun', 'paris']);</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 11px Verdana, Arial, Helvetica, sans-serif; background: #ADE76B; color: #335511; padding: 12px; }
  .shell {
    background: #fff; border-radius: 7px; overflow: hidden; border: 1.125px solid #2E3C1E;
    box-shadow: inset 0 0 0 1px #DEDEDF; max-width: 760px; margin: 0 auto;
  }
  a { color: #2C4A0F; }
  button { font-family: inherit; }
  .vide { color: #6c8f3a; padding: 8px 12px 12px; line-height: 1.5; }
  .connexion { padding: 14px 12px; text-align: center; line-height: 1.6; }

  /* L'en-tête : le nom (caché dans une fenêtre, qui le porte déjà) et le solde. */
  .tete { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .tete .marque { display: flex; align-items: center; gap: 6px; color: #7A3E9D; font: bold 16px Arial, sans-serif; }
  .tete .marque img { width: 20px; height: 20px; }
  .tete .solde { margin-left: auto; text-align: right; font-weight: bold; color: #2C4A0F; font-size: 12px; }
  .tete .solde small { display: block; font-weight: normal; color: #6c8f3a; font-size: 10px; }

  .onglets { display: flex; gap: 4px; padding: 0 12px; border-bottom: 2px solid #E3756A; }
  .onglets button { border: 0; border-radius: 7px 7px 0 0; background: #D6F7B5; color: #2C4A0F; font: bold 12px Arial, sans-serif; padding: 6px 14px; cursor: pointer; }
  .onglets button.on { background: #E3756A; color: #fff; }
  .onglets button i { font-style: normal; background: #fff; color: #E3756A; border-radius: 8px; padding: 0 5px; margin-left: 4px; font-size: 10px; }
  .vue[hidden] { display: none; }

  /* Le titre d'une vue, et sa règle repliée. */
  .soustitre { padding: 10px 12px 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .soustitre b { font: bold 14px Arial, sans-serif; color: #E3756A; }
  .soustitre span { color: #6c8f3a; font-size: 10px; }
  details.regle { margin: 0 12px 6px; color: #2C4A0F; }
  details.regle summary { cursor: pointer; color: #6c8f3a; font-size: 10px; list-style: none; }
  details.regle summary::before { content: '? '; display: inline-block; width: 13px; height: 13px; line-height: 13px; text-align: center; border-radius: 50%; background: #D6F7B5; color: #2C4A0F; font-weight: bold; margin-right: 4px; }
  details.regle summary::-webkit-details-marker { display: none; }
  details.regle div { background: #F2FBE8; border-radius: 6px; padding: 7px 9px; margin-top: 5px; line-height: 1.55; }

  /* Le budget du jour. */
  .budget { margin: 4px 12px 8px; background: #F2FBE8; border-radius: 6px; padding: 6px 8px; }
  .budget .l { display: flex; justify-content: space-between; font-size: 10px; color: #6c8f3a; }
  .budget .l b { color: #2C4A0F; }
  .jauge { height: 6px; background: #D6F7B5; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .jauge i { display: block; height: 100%; background: #E3756A; border-radius: 3px; transition: width .3s; }

  .toast { margin: 4px 12px 8px; background: #2f8f2f; color: #fff; border-radius: 6px; padding: 7px 10px; font-weight: bold; }
  .mes { margin: 0 12px 8px; background: #F2FBE8; border-radius: 6px; padding: 7px 9px; line-height: 1.7; }
  .mes h4 { font: bold 11px Arial, sans-serif; color: #2C4A0F; }
  .mes b { color: #2f8f2f; }

  /* Les jeux, en pastilles. */
  .jeux { display: flex; gap: 5px; padding: 6px 12px; flex-wrap: wrap; }
  .jeux button { border: 1.5px solid #8bc55a; background: #fff; border-radius: 12px; padding: 3px 9px; font: bold 11px Verdana, sans-serif; color: #2C4A0F; cursor: pointer; white-space: nowrap; }
  .jeux button.on { background: #2C4A0F; color: #fff; border-color: #2C4A0F; }
  .jeux button em { font-style: normal; font-weight: normal; opacity: .75; }
  .jeux button .pt { color: #E3756A; }
  .jeux button.on .pt { color: #F7B9B2; }

  .cherche { display: flex; gap: 6px; margin: 2px 12px 6px; }
  .cherche input { flex: 1; min-width: 0; border: 1.5px solid #8bc55a; border-radius: 12px; padding: 4px 10px; font: 11px Verdana, sans-serif; color: #2C4A0F; }
  .cherche button { border: 0; border-radius: 12px; background: #D6F7B5; color: #2C4A0F; font: bold 11px Verdana, sans-serif; padding: 4px 12px; cursor: pointer; }
  .decouv { margin: 0 12px 6px; color: #6c8f3a; font-size: 10px; line-height: 1.5; }

  /* Une ligne de joueur : son nom, ses deux cotes-boutons. */
  .ligne { display: grid; grid-template-columns: 1fr 76px 76px; gap: 6px; align-items: center; padding: 6px 12px; border-top: 1px solid #E5F8D2; }
  .ligne.sel { background: #FFF6F4; }
  .ligne.trouve { background: #FBF7E6; }
  .nom { font-weight: bold; color: #2C4A0F; font-size: 12px; overflow-wrap: anywhere; }
  .nom small { display: block; font-weight: normal; color: #6c8f3a; font-size: 10px; }
  .nom .toi { display: inline; color: #E3756A; font-size: 10px; }
  .c { border: 2px solid #C3EF93; border-radius: 7px; text-align: center; padding: 3px 0; background: #fff; cursor: pointer; font-family: inherit; }
  .c b { display: block; font: bold 14px Arial, sans-serif; color: #E3756A; }
  .c span { font-size: 9px; color: #6c8f3a; }
  .c.or { border-color: #F1D27A; } .c.or b { color: #C8860A; }
  .c.argent { border-color: #C9CED6; } .c.argent b { color: #6F7984; }
  .c.bronze { border-color: #E2B48A; } .c.bronze b { color: #A0612A; }
  /* Le défi médaille : sur soi, trois couleurs, trois cotes fixes. */
  .defi { margin: 10px 12px 0; border-top: 2px solid #E5F8D2; padding-top: 8px; }
  .defi .soustitre { padding: 0 0 4px; }
  .defi details.regle { margin: 0 0 6px; }
  .defi .jeux { padding: 4px 0; }
  .defi .trois { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 0; }
  .defi .stats { color: #6c8f3a; font-size: 10px; line-height: 1.5; }
  .defi .ticket { margin: 0 0 6px; border-top: 2px solid #E3756A; border-radius: 8px; }
  /* Les médailles du site (awards.swf) : les trois jetons, et celles de chaque jeu. */
  img.md { width: 13px; height: 13px; vertical-align: -2px; }
  .trio { display: inline-flex; vertical-align: -2px; }
  .trio img.md { margin-right: -5px; }
  .trio img.md:last-child { margin-right: 0; }
  img.tro { width: 9px; height: 13px; vertical-align: -2px; }
  img.mj { width: 18px; height: 18px; vertical-align: -5px; }
  .c > span { display: block; white-space: nowrap; }
  .c span img.md { width: 10px; height: 10px; vertical-align: -1px; margin-right: 2px; }
  .c span .trio img.md { margin-right: -4px; }
  .c span .trio { margin-right: 2px; }
  .c span .trio img.md:last-child { margin-right: 0; }
  .c i { display: block; font-style: normal; font-size: 9px; color: #9ab87a; line-height: 1.1; }
  .c.choisi i { color: #fff; }
  .c:hover:not(:disabled) { border-color: #E3756A; }
  .c.choisi { background: #E3756A; border-color: #E3756A; } .c.choisi b, .c.choisi span { color: #fff; }
  .c:disabled { cursor: default; opacity: .55; }
  .plus { padding: 6px 12px 8px; color: #6c8f3a; }
  .plus button { border: 0; background: none; color: #2C4A0F; text-decoration: underline; cursor: pointer; font: 11px Verdana, sans-serif; }

  /* LE TICKET, sous la ligne choisie. */
  .ticket { margin: 0 12px 6px; border: 2px solid #E3756A; border-top: 0; border-radius: 0 0 8px 8px; background: #FFF6F4; padding: 8px 10px; }
  .ticket .qui { font-weight: bold; color: #2C4A0F; line-height: 1.4; }
  .puces { display: flex; gap: 5px; margin: 8px 0; align-items: center; flex-wrap: wrap; }
  .puces button { border: 1.5px solid #E3756A; background: #fff; color: #E3756A; border-radius: 10px; padding: 3px 10px; font: bold 11px Verdana, sans-serif; cursor: pointer; }
  .puces button.on { background: #E3756A; color: #fff; }
  .puces input { width: 60px; border: 1px solid #8bc55a; border-radius: 3px; padding: 3px 5px; font: 12px Verdana, sans-serif; color: #2C4A0F; }
  .gain { font-size: 12px; color: #2C4A0F; }
  .gain b { color: #2f8f2f; font-size: 15px; }
  .gain small { color: #6c8f3a; }
  .go { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .go .ok { flex: 1; border: 0; background: #E3756A; color: #fff; border-radius: 12px; padding: 7px; font: bold 12px Arial, sans-serif; cursor: pointer; }
  .go .ok:disabled { background: #c9b1ad; cursor: default; }
  .go .ko { border: 0; background: none; color: #6c8f3a; padding: 6px; cursor: pointer; font: 11px Verdana, sans-serif; }
  .erreur { color: #b31111; font-weight: bold; margin-top: 6px; }
  .note { color: #6c8f3a; margin-top: 6px; }

  /* Hier. */
  .hier { margin: 10px 12px 12px; border-top: 2px solid #E5F8D2; padding-top: 8px; line-height: 1.7; }
  .hier h4 { font: bold 12px Arial, sans-serif; color: #2C4A0F; margin-bottom: 2px; }
  .gagne { color: #2f8f2f; } .perdu { color: #b31111; } .rembourse { color: #6c8f3a; }

  /* Les tournois. */
  .bandeau { margin: 10px 12px 0; background: #E3756A; color: #fff; font: bold 12px Arial, sans-serif; padding: 6px 10px; border-radius: 7px 7px 0 0; }
  .bandeau small { font-weight: normal; opacity: .9; }
  h3 { font: bold 12px Arial, sans-serif; color: #2C4A0F; margin: 10px 12px 6px; }
  .match { background: #F2FBE8; border-radius: 6px; padding: 8px 10px; margin: 0 12px 8px; }
  .match.sel { background: #FFF6F4; outline: 2px solid #E3756A; }
  .match .tour { color: #6c8f3a; font-size: 10px; margin-bottom: 6px; display: flex; gap: 8px; }
  .match .tour .pot { margin-left: auto; font-weight: bold; color: #2C4A0F; }
  .duo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: stretch; }
  .duo .contre { align-self: center; color: #6c8f3a; font-weight: bold; }
  .joueur { background: #fff; border: 2px solid #C3EF93; border-radius: 7px; padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; text-align: left; font: 11px Verdana, sans-serif; color: #335511; }
  button.joueur { cursor: pointer; }
  button.joueur:hover:not(:disabled) { border-color: #E3756A; }
  button.joueur:disabled { cursor: default; opacity: .7; }
  .joueur.choisi { border-color: #E3756A; background: #E3756A; } .joueur.choisi * { color: #fff !important; }
  .joueur.gagnant { border-color: #2f8f2f; }
  .joueur .n { font-weight: bold; font-size: 12px; color: #2C4A0F; overflow-wrap: anywhere; }
  .joueur .x { font: bold 15px Arial, sans-serif; color: #E3756A; }
  .joueur .x.rien { color: #9ab87a; font-size: 11px; }
  .joueur .d { color: #6c8f3a; font-size: 10px; }
  .match .ticket { margin: 8px 0 0; border-top: 2px solid #E3756A; border-radius: 8px; }
  .mien { margin-top: 6px; font-weight: bold; color: #2C4A0F; }

  /* Le registre. */
  .bilan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 12px; }
  .bilan div { background: #D6F7B5; border-radius: 6px; padding: 6px 8px; text-align: center; }
  .bilan b { display: block; font: bold 15px Arial, sans-serif; color: #2C4A0F; }
  .bilan b.plus { color: #2f8f2f; } .bilan b.moins { color: #b31111; }
  .bilan span { color: #6c8f3a; font-size: 10px; }
  .regbloc { padding: 0 12px 10px; }
  table.reg { width: 100%; border-collapse: collapse; }
  table.reg th { text-align: left; color: #6c8f3a; font-weight: normal; font-size: 10px; padding: 3px 4px; border-bottom: 1px solid #C3EF93; }
  table.reg td { padding: 4px; border-bottom: 1px solid #E5F8D2; vertical-align: top; }
  table.reg td.n { text-align: right; white-space: nowrap; }
  .st { font-weight: bold; white-space: nowrap; }
  .st.gagne { color: #2f8f2f; } .st.perdu { color: #b31111; } .st.rembourse, .st.ouvert { color: #6c8f3a; }
  .coup { background: #fff6f4; border-left: 3px solid #E3756A; border-radius: 4px; padding: 6px 8px; margin: 0 0 6px; line-height: 1.5; }
  .coup .q { color: #6c8f3a; font-size: 10px; }
  .regbloc h3 { margin: 10px 0 6px; }
  a.qui { color: #2C4A0F; font-weight: bold; text-decoration: none; border-bottom: 1px dotted #6c8f3a; }
  a.qui:hover { color: #E3756A; }
  .tout { display: block; margin: 6px auto 0; border: 0; border-radius: 6px; background: #D6F7B5; color: #2C4A0F; font: bold 11px Arial, sans-serif; padding: 5px 12px; cursor: pointer; }
  .navjour { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 12px 4px; }
  .navjour b { font-size: 13px; color: #2C4A0F; text-align: center; flex: 1; }
  .navjour button { border: 0; border-radius: 6px; background: #D6F7B5; color: #2C4A0F; font: bold 12px Arial, sans-serif; padding: 5px 10px; cursor: pointer; }
  .navjour button[disabled] { opacity: .35; cursor: default; }
  .net.plus { color: #2f8f2f; font-weight: bold; } .net.moins { color: #b31111; font-weight: bold; }

  /* Dans une fenêtre du bureau (?cadre=1) : la fenêtre fait le cadre et le titre. */
  body.cadre { padding: 0; background: #fff; }
  body.cadre .shell { border: 0; border-radius: 0; box-shadow: none; max-width: none; }
  body.cadre .tete .marque { display: none; }

  @media (max-width: 420px) {
    body { padding: 6px; }
    .ligne { grid-template-columns: 1fr 64px 64px; padding: 6px 8px; gap: 4px; }
    .duo { grid-template-columns: 1fr; }
    .duo .contre { text-align: center; }
    .bilan { grid-template-columns: repeat(2, 1fr); }
    table.reg .q-date { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="tete">
    <span class="marque"><img src="/frutiz/sprites/fruit_winDebug.svg" alt="">Prunostics</span>
    <span class="solde" id="solde"></span>
  </div>
  <div class="onglets">
    <button data-vue="challenge" class="on">Challenge</button>
    <button data-vue="tournois" data-i18n="paris.ongletTournois">Tournois</button>
    <button data-vue="registre" data-i18n="paris.ongletRegistre">Registre</button>
    <button data-vue="parc" data-i18n="paris.ongletParc">Le parc</button>
  </div>
  <div class="vue" id="vue-challenge"><p class="vide" data-i18n="paris.chargement">Chargement…</p></div>
  <div class="vue" id="vue-tournois" hidden><p class="vide" data-i18n="paris.chargement">Chargement…</p></div>
  <div class="vue" id="vue-registre" hidden></div>
  <div class="vue" id="vue-parc" hidden></div>
</div>
<script>
(function () {
  'use strict';
  // Les textes écrits en dur dans la page (data-i18n), dans la langue du joueur.
  FPI18n.appliquer(document);
  var params = new URLSearchParams(location.search);
  var sid = params.get('sid') || '';
  if (!sid) {
    try { sid = (JSON.parse(localStorage.getItem('fp_light_session') || '{}') || {}).sid || ''; } catch (e) { sid = ''; }
  }
  var cadre = params.get('cadre') === '1';
  if (cadre) document.body.classList.add('cadre');
  // Dans une fenêtre du bureau, un lien sort de la fenêtre, pas dans le cadre.
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (a && cadre) a.target = '_top';
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(s) { return document.querySelector(s); }
  // LES NOMBRES ET LES COTES, à la manière de chaque langue : « 1 250 kikooz »
  // et « ×2,5 » en français, « 1,250 kikooz » et « ×2.5 » en anglais. Le mot
  // « kikooz » ne se traduit pas (glossaire du parc).
  function nombre(n) { return T.nombre(Number(n || 0)); }
  function kz(n) { return nombre(n) + ' kikooz'; }
  // « 40 kikooz misés » : ce qui est déjà sur une cote.
  function kzMises(n) { return T('paris.kzMises', '{montant} misés', { montant: kz(n) }); }
  function cote(c) { return c == null ? '—' : '×' + String(c).replace('.', T('paris.virgule', ',')); }
  function retour(mise, c) { return Math.floor(mise * c + 1e-9); }
  /*
   * LES DATES. Le serveur écrit les jours en toutes lettres en français
   * (`jourLisible`, `lisible` : « samedi 28 novembre ») et donne aussi le jour
   * lui-même (`jour`, AAAA-MM-JJ) : c'est de lui que l'anglais tire le sien
   * (« Saturday, November 28 »). Le français reste celui du serveur.
   */
  function jourLisible(fr, jour) { return T('paris.jourLisible', fr, { jour: jour }); }
  // Le mois du registre : `lisible` en français, sinon tiré de `cle` (AAAA-MM).
  function moisLisible(m) {
    if (!m || FPI18n.langue === 'fr' || !/^\d{4}-\d{2}$/.test(String(m.cle || ''))) return (m && m.lisible) || '';
    var p = String(m.cle).split('-');
    try {
      return new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, 15))
        .toLocaleDateString(FPI18n.langue === 'en' ? 'en-US' : FPI18n.langue, { month: 'long', year: 'numeric', timeZone: 'UTC' });
    } catch (e) { return m.lisible || ''; }
  }
  // L'ordinal d'un rang au classement (« 12e », « 12th ») ; le rang affiché
  // ainsi dépasse toujours 10 (voir rendreRegistre).
  function ordinal(n) { return T('paris.ordinal', '{n}e', { n: n }); }
  // LES MÉDAILLES DU SITE — les jetons d'awards.swf (/fb/medal_*.svg), les
  // médailles de chaque jeu (/fb/medal_<métal>_<jeu>.png, celles des fiches),
  // et le trophée des tournois (/fb/trophee.svg). Pas d'emoji.
  var METAL = { or: 'gold', argent: 'silver', bronze: 'bronze' };
  function jeton(metal) { return '<img class="md" src="/fb/medal_' + METAL[metal] + '.svg" alt="">'; }
  // « en or » : le jeton d'or ; « médaillé » : les trois, l'un sur l'autre.
  // Le défi médaille : le jeton de la couleur demandée.
  var DEFI = { defi_bronze: 'bronze', defi_argent: 'argent', defi_or: 'or' };
  // Ce que demande chaque défi, dans la langue du joueur (paris.defiQuoiOr…).
  var DEFI_QUOI_FR = { bronze: 'une médaille', argent: 'l’argent ou l’or', or: 'l’or' };
  var DEFI_QUOI = {
    bronze: T('paris.defiQuoiBronze', DEFI_QUOI_FR.bronze),
    argent: T('paris.defiQuoiArgent', DEFI_QUOI_FR.argent),
    or: T('paris.defiQuoiOr', DEFI_QUOI_FR.or),
  };
  function iconePari(type) {
    if (DEFI[type]) return jeton(DEFI[type]);
    return type === 'or' ? jeton('or') : '<span class="trio">' + jeton('or') + jeton('argent') + jeton('bronze') + '</span>';
  }
  // « médaillé », « en or » : l'étiquette des deux boutons de pari du
  // Challenge. (Dans une phrase, chaque sorte de pari a sa clé entière :
  // l'anglais ne place pas ces mots au même endroit.)
  function enOrOuMedaille(type) { return type === 'or' ? T('paris.enOr', 'en or') : T('paris.medaille', 'médaillé'); }
  var TROPHEE = '<img class="tro" src="/fb/trophee.svg" alt="">';
  // jeu (clé du Challenge) → suffixe des médailles du jeu, comme sur la fiche.

  // ── LE TICKET ──────────────────────────────────────────────────────────

  function ticketHtml(t) {

      return '<button data-mise="' + n + '" class="' + (n === mise ? 'on' : '') + '">' + n + '</button>';
    }).join('') + '<button data-mise="' + reste + '" class="' + (mise === reste ? 'on' : '') + '">' + T('paris.max', 'Max ({n})', { n: reste }) + '</button>';

      + '<div class="puces">' + puces + '<input type="number" min="1" max="' + reste + '" value="' + mise + '" data-saisie="1" aria-label="' + T('paris.mise', 'Mise') + '"> kikooz</div>'

  // ── LE CHALLENGE DE DEMAIN ─────────────────────────────────────────────
  var zoneC = $('#vue-challenge');

  function rendreChallenge() {

    var defis = (d.defi && d.defi.mesDefis) || [];
    // « → 25 à ×2,5 (cote fixe) » : ce que rapporte un pari à cote fixe.
    var coteFixe = function (p) {

  // ── LE DÉFI MÉDAILLE ───────────────────────────────────────────────────
  // Sur soi, à n'importe quel jeu ouvert : une médaille (bronze ou mieux),

  function resteDefi() {

    h += '<div class="stats">' + (j.joues

    h += '<div class="trois">' + ['bronze', 'argent', 'or'].map(function (couleur) {
      var type = 'defi_' + couleur;
      var p = df.mesDefis.filter(function (x) { return x.jeu === j.cle && x.type === type; })[0];
      var choisi = ticket && ticket.sorte === 'd' && ticket.jeu === j.cle && ticket.type === type;
      return '<button class="c ' + couleur + (choisi ? ' choisi' : '') + '" data-defi="' + type + '" data-jeu="' + esc(j.cle) + '"><b>' + cote(j.cotes[couleur])

  function ouvrirTicketDefi(cleJeu, type) {

      t.envoi = false;
      if (!r.ok) { t.erreur = pariRefuse(r); rendreTournois(); return; }
      toast = { vue: 'tournois', texte: r.retour
        ? T('paris.pariMatchCote', 'C’est parié ! {mise} au total sur ce match : {retour} pour toi s’il gagne.', { mise: kz(r.mise), retour: kz(r.retour) })
        : T('paris.pariMatch', 'C’est parié ! {mise} au total sur ce match.', { mise: kz(r.mise) }) };
      ticket = null;
      return chargerTournois();
    }).catch(function () { t.envoi = false; t.erreur = SERVEUR_MUET; rendreTournois(); });
  }

  // ── LE REGISTRE ────────────────────────────────────────────────────────
  // Mes paris, tournois et Challenge, avec mon bilan ; et les gros coups du
  // parc, ceux que Dimitri annonce sur le forum.
  var zoneR = $('#vue-registre');
  var STATUTS = {
    gagne: T('paris.statutGagne', 'gagné'), perdu: T('paris.statutPerdu', 'perdu'),
    rembourse: T('paris.statutRembourse', 'remboursé'), ouvert: T('paris.statutOuvert', 'en jeu'),
  };
  // « 28 nov. » en français (le navigateur en fr-FR, comme avant), « Nov 28 »
  // en anglais (une fonction du dictionnaire, qui reçoit la date).
  function date(q) {
    var d = new Date(q);
    return T('paris.dateCourte', d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }), { d: d });
  }
  // Les en-têtes communs aux tableaux de paris.
  function entetesParis() {
    return '<th>' + T('paris.pari', 'Pari') + '</th><th>' + T('paris.mise', 'Mise') + '</th><th>' + T('paris.cote', 'Cote') + '</th>'
      + '<th>' + T('paris.resultat', 'Résultat') + '</th>';
  }
  var MUTUEL = '<small>' + T('paris.mutuel', 'mutuel') + '</small>';
  // Le bénéfice signé : « +12 », « −3 » (le signe moins vient du nombre).
  function signe(n) { return (n > 0 ? '+' : '') + nombre(n); }
  function chargerRegistre() {
    return fetch('/api/paris/registre?sid=' + encodeURIComponent(sid), { cache: 'no-store' })
      .then(json).then(rendreRegistre)
      .catch(function () { zoneR.innerHTML = MUET; });
  }
  var classementEntier = false, dernierRegistre = null;
  function lienParieur(nom, pseudo) {
    return '<a href="#" class="qui" data-parieur="' + esc(pseudo) + '" title="' + T('paris.voirSesParis', 'Voir ses paris réglés') + '">' + esc(nom) + '</a>';
  }
  function rendreRegistre(d) {
    dernierRegistre = d;
    var h = '';
    // Le Prunostiqueur du mois. Le nom du mois : celui du serveur en français
    // (`lisible`, « novembre 2026 ») ; dans une autre langue, la page le tire
    // de sa clé (`cle`, « 2026-11 »), comme les jours de leur `jour`.
    var s = d.mois;
    if (s) {
      h += '<div class="regbloc"><h3>' + TROPHEE + ' ' + T('paris.prunostiqueurDuMois', 'Prunostiqueur du mois')
        + ' <small style="font-weight:normal;color:#6c8f3a">'
        + T('paris.regleDuMois', '— {mois}, bénéfice net, {min} paris réglés au moins', { mois: esc(moisLisible(s)), min: s.minParis }) + '</small></h3>';
      if (s.passee) {
        h += '<p class="decouv" style="margin:0 0 6px">' + T('paris.moisDernier', 'Le mois dernier : <b>{nom}</b> (+{net}), sacré par Dimitri.',
          { nom: esc(s.passee.nom), net: kz(s.passee.net) }) + '</p>';
      }
      h += '<p class="decouv" style="margin:0 0 6px">' + T('paris.cagnotteEnJeu', 'Cagnotte en jeu : <b>{cagnotte}</b>{plafond}'
        + ' — les mises des pronos que personne n’a vus venir. Le Prunostiqueur du mois la remporte, avec le titre.', {
        cagnotte: kz(s.cagnotte || 0),
        plafond: s.plafondCagnotte ? T('paris.auPlus', ' (au plus {montant})', { montant: kz(s.plafondCagnotte) }) : '',
      }) + '</p>';
      if (s.classement.length) {
        var montres = classementEntier ? s.classement : s.classement.slice(0, 10);
        h += '<table class="reg"><tbody>' + montres.map(function (c) {
          return '<tr' + (c.soi ? ' style="background:#FFF6F4"' : '') + '><td class="n" style="width:24px">' + (c.rang === 1 ? jeton('or') : c.rang === 2 ? jeton('argent') : c.rang === 3 ? jeton('bronze') : c.rang) + '</td>'
            + '<td>' + lienParieur(c.nom, c.pseudo) + (c.soi ? ' <small>' + T('paris.toi', '(toi)') + '</small>' : '') + ' <small style="color:#6c8f3a">'
            + T.n('paris.gagnesSur', c.gagnes, { one: '{n} gagné sur {paris}', other: '{n} gagnés sur {paris}' }, { paris: c.paris }) + '</small></td>'
            + '<td class="n"><b class="' + (c.net >= 0 ? 'gagne' : 'perdu') + '">' + signe(c.net) + '</b></td></tr>';
        }).join('') + '</tbody></table>';
        if (s.classement.length > 10) {
          h += '<button class="tout" data-classement="' + (classementEntier ? 'haut' : 'tout') + '">'
            + (classementEntier ? T('paris.dixPremiers', 'Ne montrer que les dix premiers')
              : T('paris.toutLeClassement', 'Voir tout le classement ({n} prunostiqueurs)', { n: s.classement.length })) + '</button>';
        }
        if (d.moi && !s.moi) h += '<p class="decouv" style="margin:6px 0 0">' + T('paris.pasEncoreClasse', 'Pas encore classé ce mois-ci : il te faut {n} paris réglés.', { n: s.minParis }) + '</p>';
        else if (s.moi && s.moi.rang > 10) {
          h += '<p class="decouv" style="margin:6px 0 0">' + T('paris.toiRang', 'Toi : {rang} ({net}).', { rang: ordinal(s.moi.rang), net: signe(s.moi.net) }) + '</p>';
        }
      } else {
        h += '<p class="vide" style="padding-left:0">' + T('paris.personneClasse', 'Personne n’est encore classé ce mois-ci : {n} paris réglés pour entrer dans la course.', { n: s.minParis }) + '</p>';
      }
      h += '</div>';
    }
    if (!d.moi) {
      h += '<p class="connexion">' + T('paris.connexionRegistre', 'Pour voir tes paris, <a href="/light.html">connecte-toi au parc</a>.') + '</p>';
    } else {
      var b = d.bilan;
      h += '<div class="bilan">'
        + '<div><b>' + b.paris + '</b><span>' + T('paris.bilanParis', 'paris ({gagnes} gagnés, {perdus} perdus)', { gagnes: b.gagnes, perdus: b.perdus }) + '</span></div>'
        + '<div><b>' + nombre(b.mises) + '</b><span>' + T('paris.kikoozMises', 'kikooz misés') + '</span></div>'
        + '<div><b>' + nombre(b.gains) + '</b><span>' + T('paris.kikoozRecus', 'kikooz reçus') + '</span></div>'
        + '<div><b class="' + (b.net >= 0 ? 'plus' : 'moins') + '">' + signe(b.net) + '</b><span>' + T('paris.bilan', 'bilan')
        + (b.enJeu ? ' · ' + T('paris.enJeu', '{montant} en jeu', { montant: kz(b.enJeu) }) : '') + '</span></div></div>';
      h += '<div class="regbloc">';
      if (d.lignes.length) {
        h += '<h3>' + T('paris.mesParis', 'Mes paris') + '</h3><table class="reg"><thead><tr><th class="q-date">Date</th>' + entetesParis() + '</tr></thead><tbody>';
        d.lignes.forEach(function (l) {
          // Gagné : le bénéfice, et ce qui est revenu (mise comprise). La
          // description du pari (`quoi`) est écrite par le serveur.
          var res = l.statut === 'gagne' ? '<b>+' + nombre(l.gain - l.mise) + '</b> <small>' + T('paris.recus', '({montant} reçus)', { montant: nombre(l.gain) }) + '</small>'
            : l.statut === 'perdu' ? '<small>−' + nombre(l.mise) + '</small>'
            : l.statut === 'rembourse' ? '<small>' + T('paris.rendus', '{montant} rendus', { montant: nombre(l.gain) }) + '</small>' : '';
          h += '<tr><td class="q-date">' + esc(date(l.quand)) + '</td><td>' + (l.sorte === 'challenge' ? iconePari(l.type) : TROPHEE) + ' ' + esc(l.quoi) + '</td>'
            + '<td class="n">' + nombre(l.mise) + '</td><td class="n">' + (l.cote ? cote(l.cote) : MUTUEL) + '</td>'
            + '<td><span class="st ' + l.statut + '">' + STATUTS[l.statut] + '</span>' + (res ? ' ' + res : '') + '</td></tr>';
        });
        h += '</tbody></table>';
      } else {
        h += '<p class="vide" style="padding-left:0">' + T('paris.rienParie', 'Tu n’as encore rien parié. Tes paris s’inscriront ici, gagnés ou perdus.') + '</p>';
      }
      h += '</div>';
    }
    h += '<div class="regbloc"><h3>' + T('paris.grosCoups', 'Les gros coups du parc') + ' <small style="font-weight:normal;color:#6c8f3a">'
      + T('paris.grosCoupsSeuil', '— 30 derniers jours, {seuil} de bénéfice ou plus', { seuil: kz(d.seuil || 100) }) + '</small></h3>';
    if (d.grosCoups && d.grosCoups.length) {
      d.grosCoups.forEach(function (c) {
        // `quoi` (ce sur quoi il a misé) vient du serveur.
        h += '<div class="coup">' + T('paris.grosCoup', '{qui} a misé {mise} sur {quoi}{cote} : <b>{gain}</b> empochés.', {
          qui: c.pseudo ? lienParieur(c.parieur, c.pseudo) : '<b>' + esc(c.parieur) + '</b>',
          mise: kz(c.mise), quoi: esc(c.quoi), gain: kz(c.gain),
          cote: c.cote ? T('paris.virguleACote', ', à {cote}', { cote: cote(c.cote) }) : '',
        }) + ' <span class="q">' + esc(date(c.quand)) + '</span></div>';
      });
    } else {
      h += '<p class="vide" style="padding-left:0">' + T('paris.pasDeGrosCoup', 'Pas encore de gros coup : Dimitri attend le premier avec impatience.') + '</p>';
    }
    zoneR.innerHTML = h + '</div>';
  }

  // ── LE PARC : les paris des autres, une fois réglés ───────────────────
  // Un jour (le Challenge de ce jour, les matchs de tournoi réglés ce jour-là),
  // ou un joueur (ses paris réglés des 30 derniers jours). Les paris en jeu ne
  // se montrent jamais : on ne recopie pas les pronos du jour.
  var zoneP = $('#vue-parc');
  var parc = { jour: null, parieur: null };
  // Un pari réglé, décrit par le client à partir de ses champs : le joueur,
  // le jeu (`jeu`, son nom) et le type ; pour un tournoi, l'affiche du match
  // (`affiche`, écrite par le serveur).
  function decrirePari(l) {
    if (l.sorte === 'challenge') {
      var p = { choix: esc(l.choix), jeu: esc(l.jeu || '') };
      var quoi = DEFI[l.type] ? T('paris.decrireDefi', '{choix} décroche {quoi} à {jeu} (défi)', { choix: p.choix, jeu: p.jeu, quoi: DEFI_QUOI[DEFI[l.type]] })
        : l.type === 'or' ? T('paris.decrireOr', '{choix} en or à {jeu}', p) : T('paris.decrireMedaille', '{choix} médaillé à {jeu}', p);
      return iconePari(l.type) + ' ' + quoi;
    }
    return TROPHEE + ' ' + T('paris.victoireDe', 'la victoire de {choix}', { choix: esc(l.choix) }) + (l.affiche ? ' <small>(' + esc(l.affiche) + ')</small>' : '');
  }
  function resultatPari(l) {
    var res = l.statut === 'gagne' ? '<b>+' + nombre(l.gain - l.mise) + '</b>'
      : l.statut === 'perdu' ? '<small>−' + nombre(l.mise) + '</small>'
      : l.statut === 'rembourse' ? '<small>' + T('paris.rendu', 'rendu') + '</small>' : '';
    return '<span class="st ' + l.statut + '">' + STATUTS[l.statut] + '</span> ' + res;
  }
  function chargerParc() {
    var url = parc.parieur ? '/api/paris/parieur?u=' + encodeURIComponent(parc.parieur)
      : '/api/paris/parc' + (parc.jour ? '?jour=' + encodeURIComponent(parc.jour) : '');
    return fetch(url, { cache: 'no-store' }).then(json).then(rendreParc)
      .catch(function () { zoneP.innerHTML = MUET; });
  }
  function rendreParc(d) {
    if (!d || !d.ok) { zoneP.innerHTML = '<p class="vide">' + esc((d && d.message) || T('paris.introuvable', 'Introuvable.')) + '</p>'; return; }
    var h = '';
    if (parc.parieur) {
      var b = d.bilan;
      h += '<div class="navjour"><button data-parc-retour>' + T('paris.parcJourParJour', '‹ Le parc, jour par jour') + '</button>'
        + '<b>' + T('paris.lesParisDe', 'Les paris de {nom}', { nom: esc(d.nom) }) + '</b><span></span></div>';
      h += '<p class="decouv" style="margin:0 12px 4px">' + T('paris.sesParisRegles', 'Ses paris réglés des 30 derniers jours (ceux en jeu restent secrets).') + '</p>';
      h += '<div class="bilan">'
        + '<div><b>' + b.paris + '</b><span>' + T('paris.parisRegles', 'paris réglés ({gagnes} gagnés)', { gagnes: b.gagnes }) + '</span></div>'
        + '<div><b>' + nombre(b.mises) + '</b><span>' + T('paris.kikoozMises', 'kikooz misés') + '</span></div>'
        + '<div><b>' + nombre(b.gains) + '</b><span>' + T('paris.kikoozRecus', 'kikooz reçus') + '</span></div>'
        + '<div><b class="' + (b.net >= 0 ? 'plus' : 'moins') + '">' + signe(b.net) + '</b><span>' + T('paris.bilan', 'bilan') + '</span></div></div>';
      h += '<div class="regbloc">';
      if (d.lignes.length) {
        h += '<table class="reg"><thead><tr><th class="q-date">' + T('paris.regleLe', 'Réglé le') + '</th>' + entetesParis() + '</tr></thead><tbody>'
          + d.lignes.map(function (l) {
            return '<tr><td class="q-date">' + esc(date(l.quand)) + '</td><td>' + decrirePari(l) + '</td><td class="n">' + nombre(l.mise) + '</td>'
              + '<td class="n">' + (l.cote ? cote(l.cote) : MUTUEL) + '</td><td>' + resultatPari(l) + '</td></tr>';
          }).join('') + '</tbody></table>';
      } else h += '<p class="vide" style="padding-left:0">' + T('paris.aucunPariTrenteJours', 'Aucun pari réglé ces 30 derniers jours.') + '</p>';
      zoneP.innerHTML = h + '</div>';
      return;
    }
    parc.jour = d.jour;
    h += '<div class="navjour"><button data-parc-jour="' + esc(d.precedent) + '">' + T('paris.veille', '‹ veille') + '</button><b>' + esc(jourLisible(d.lisible, d.jour)) + '</b>'
      + '<button data-parc-jour="' + esc(d.suivant || '') + '"' + (d.suivant ? '' : ' disabled') + '>' + T('paris.lendemain', 'lendemain ›') + '</button></div>';
    h += '<p class="decouv" style="margin:0 12px 4px">' + T('paris.parcAide', 'Les paris d’un jour se dévoilent une fois réglés : le Challenge de ce jour, et les matchs de tournoi réglés ce jour-là. Touche un nom pour voir tous ses paris.') + '</p>';
    h += '<div class="regbloc">';
    if (d.bilan.length) {
      h += '<h3>' + T('paris.bilanDuJour', 'Le bilan du jour') + '</h3><table class="reg"><thead><tr><th></th><th>' + T('paris.prunostiqueur', 'Prunostiqueur') + '</th>'
        + '<th>' + T('paris.gagnes', 'Gagnés') + '</th><th>' + T('paris.miseCourt', 'Misé') + '</th><th>' + T('paris.bilanTitre', 'Bilan') + '</th></tr></thead><tbody>'
        + d.bilan.map(function (b, i) {
          return '<tr><td class="n" style="width:20px">' + (i + 1) + '</td><td>' + lienParieur(b.nom, b.pseudo) + '</td><td class="n">' + b.gagnes + '/' + b.paris + '</td>'
            + '<td class="n">' + nombre(b.mises) + '</td><td class="n"><span class="net ' + (b.net >= 0 ? 'plus' : 'moins') + '">' + signe(b.net) + '</span></td></tr>';
        }).join('') + '</tbody></table>';
    }
    if (d.lignes.length) {
      h += '<h3>' + T('paris.tousLesParis', 'Tous les paris') + '</h3><table class="reg"><thead><tr><th>' + T('paris.qui', 'Qui') + '</th>' + entetesParis() + '</tr></thead><tbody>'
        + d.lignes.map(function (l) {
          return '<tr><td>' + lienParieur(l.parieur, l.pseudo) + '</td><td>' + decrirePari(l) + '</td><td class="n">' + nombre(l.mise) + '</td>'
            + '<td class="n">' + (l.cote ? cote(l.cote) : MUTUEL) + '</td><td>' + resultatPari(l) + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else h += '<p class="vide" style="padding-left:0">' + T('paris.aucunPariCeJour', 'Aucun pari réglé ce jour-là.') + '</p>';
    zoneP.innerHTML = h + '</div>';
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-parieur],[data-parc-jour],[data-parc-retour],[data-classement]');
    if (!t) return;
    ev.preventDefault();
    if (t.hasAttribute('data-classement')) {
      classementEntier = t.getAttribute('data-classement') === 'tout';
      if (dernierRegistre) rendreRegistre(dernierRegistre);
      return;
    }
    if (t.hasAttribute('data-parieur')) { parc.parieur = t.getAttribute('data-parieur'); montrer('parc'); return; }
    if (t.hasAttribute('data-parc-retour')) { parc.parieur = null; chargerParc(); return; }
    var j = t.getAttribute('data-parc-jour');
    if (j && !t.disabled) { parc.jour = j; parc.parieur = null; chargerParc(); }
  });

  // ── Les onglets ────────────────────────────────────────────────────────
  function montrer(v) {
    vue = v;
    ticket = null; toast = null;
    Array.prototype.forEach.call(document.querySelectorAll('.onglets button'), function (x) { x.classList.toggle('on', x.getAttribute('data-vue') === v); });
    zoneC.hidden = v !== 'challenge';
    zoneT.hidden = v !== 'tournois';
    zoneR.hidden = v !== 'registre';
    zoneP.hidden = v !== 'parc';
    if (v === 'challenge') rendreChallenge();
    if (v === 'tournois') rendreTournois();
    var chargement = '<p class="vide">' + T('paris.chargement', 'Chargement…') + '</p>';
    if (v === 'registre') { if (!zoneR.innerHTML) zoneR.innerHTML = chargement; chargerRegistre(); }
    if (v === 'parc') { zoneP.innerHTML = chargement; chargerParc(); }
  }
  document.querySelector('.onglets').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-vue]');
    if (b) montrer(b.getAttribute('data-vue'));
  });

  Promise.all([chargerChallenge(), chargerTournois()]).then(function () {
    if (/registre/.test(location.hash)) montrer('registre');
    else if (/parc/.test(location.hash)) montrer('parc');
    else if (/tournois/.test(location.hash) || (etatC && !etatC.actif && etatT && etatT.tournois && etatT.tournois.length)) montrer('tournois');
  });
  // Les cotes des tournois bougent : on relit toutes les trente secondes,
  // sauf quand un ticket est ouvert (on ne déplace pas la ligne sous le doigt).
  setInterval(function () {
    if (ticket) return;
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT') return;
    chargerTournois();
    chargerChallenge();
  }, 30000);
})();
</script>
</body>
</html>
