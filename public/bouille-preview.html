<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ADE76C;
  }
  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #player-container ruffle-player,
  #player-container ruffle-embed {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
  }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    contextMenu: "off",
    showSwfDownload: false,
    upgradeToHttps: false,
    splashScreen: false,
    preferredRenderer: "canvas",
    backgroundColor: "#ADE76C"
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="player-container"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var state = String(params.get("s") || "000000010000000000000000");
  // Allow override via ?fam= for debug; otherwise decode from state.
  var explicitFam = params.get("fam");

  function decode62(s) {
    var r = 0, coef = 1;
    for (var i = s.length - 1; i >= 0; i--) {
      var c = s.charAt(i);
      var t;
      if (c === c.toLowerCase()) {
        t = parseInt(c, 36);
      } else {
        t = parseInt(c.toLowerCase(), 36) + 26;
      }
      if (isNaN(t)) t = 0;
      r += t * coef;
      coef *= 62;
    }
    return r;
  }

  var famId = explicitFam !== null && explicitFam !== ""
    ? Number(explicitFam)
    : decode62(state.substring(0, 2));
  var swfUrl = "/fbouille_auto/famille" + famId + ".swf";

  // Pre-decode every 2-char pair so the injected decode62 shim in the
  // patched SWF can look them up as _root["_dec_" + pair].
  var flashParams = { s: state };
  for (var i = 0; i < state.length; i += 2) {
    var pair = state.substring(i, i + 2);
    flashParams["_dec_" + pair] = String(decode62(pair));
  }

  window.addEventListener("DOMContentLoaded", async function () {
    try {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("player-container").appendChild(player);
      await player.load({
        url: swfUrl,
        autoplay: "on",
        allowScriptAccess: true,
        quality: "high",
        backgroundColor: "#ADE76C",
        parameters: flashParams,
        openUrlMode: "deny",
        allowNetworking: "none"
      });
    } catch (e) {
      console.warn("[bouille] Ruffle load failed:", e);
    }
  });
})();
</script>
</body>
</html>
