<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ADE76C;
  }
  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #player-container ruffle-player,
  #player-container ruffle-embed {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
  }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    contextMenu: "off",
    showSwfDownload: false,
    upgradeToHttps: false,
    splashScreen: false,
    preferredRenderer: "canvas",
    backgroundColor: "#ADE76C"
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="player-container"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var state = String(params.get("s") || "000000010000000000000000");
  // Allow override via ?fam= for debug; otherwise decode from state.
  var explicitFam = params.get("fam");

  function decode62(s) {
    var r = 0, coef = 1;
    for (var i = s.length - 1; i >= 0; i--) {
      var c = s.charAt(i);
      var t;
      if (c === c.toLowerCase()) {
        t = parseInt(c, 36);
      } else {
        t = parseInt(c.toLowerCase(), 36) + 26;
      }
      if (isNaN(t)) t = 0;
      r += t * coef;
      coef *= 62;
    }
    return r;
  }

  var famId = explicitFam !== null && explicitFam !== ""
    ? Number(explicitFam)
    : decode62(state.substring(0, 2));
  var swfUrl = "/fbouille/famille" + famId + ".swf";

  window.addEventListener("DOMContentLoaded", async function () {
    try {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("player-container").appendChild(player);
      await player.load({
        url: swfUrl,
        autoplay: "on",
        allowScriptAccess: true,
        quality: "high",
        backgroundColor: "#ADE76C",
        // Pass the full bouille state plus split parts so the SWF can read
        // them however it expects (root, _level0, FlashVars).
        parameters: {
          s: state,
          fbouille: state,
          state: state,
          family: String(famId),
          p1: state.substring(0, 2),
          p2: state.substring(2, 4),
          p3: state.substring(4, 6),
          p4: state.substring(6, 8),
          p5: state.substring(8, 10),
          p6: state.substring(10, 12),
          p7: state.substring(12, 14),
          p8: state.substring(14, 16),
          p9: state.substring(16, 18),
          p10: state.substring(18, 20),
          p11: state.substring(20, 22),
          p12: state.substring(22, 24)
        },
        openUrlMode: "deny",
        allowNetworking: "none"
      });
    } catch (e) {
      console.warn("[bouille] Ruffle load failed:", e);
    }
  });
})();
</script>
</body>
</html>
