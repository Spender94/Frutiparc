<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ADE76C;
  }
  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #player-container ruffle-player,
  #player-container ruffle-embed {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
  }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    contextMenu: "off",
    showSwfDownload: false,
    upgradeToHttps: false,
    splashScreen: false,
    preferredRenderer: "canvas",
    backgroundColor: "#ADE76C"
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="player-container"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var state = String(params.get("s") || "000000010000000000000000");

  // The patched loader_bouille_local.swf reads _root.s, sets up
  // _global.colorSet + _global.generalPalette + FEMC, loads the
  // appropriate /fbouille/familleN.swf, and calls apply(s) on it.
  var loaderUrl = "/loader_bouille_local.swf";

  window.addEventListener("DOMContentLoaded", async function () {
    try {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("player-container").appendChild(player);
      await player.load({
        url: loaderUrl,
        autoplay: "on",
        allowScriptAccess: true,
        quality: "high",
        backgroundColor: "#ADE76C",
        parameters: { s: state },
        // Allow the loader to fetch /fbouille/famille*.swf from same origin
        openUrlMode: "deny",
        allowNetworking: "internal"
      });
    } catch (e) {
      console.warn("[bouille] Ruffle load failed:", e);
    }
  });
})();
</script>
</body>
</html>
