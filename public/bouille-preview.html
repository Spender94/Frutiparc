<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Light forum-card green by default (used by the forum bouille
       thumbnails and the FBouille editor preview). The demo page passes
       ?bg=ADE76B to override with the Frutiparc green for captures. */
    background: #E8F8D3;
  }
  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #player-container ruffle-player,
  #player-container ruffle-embed,
  #player-container ruffle-object {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
  }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    contextMenu: "off",
    showSwfDownload: false,
    upgradeToHttps: false,
    splashScreen: false,
    preferredRenderer: "canvas",
    backgroundColor: "#E8F8D3"
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="player-container"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var state = String(params.get("s") || "000000010000000000000000");
  // Mood / "humeur" — a SEPARATE input from the bouille string `s`, like
  // main.swf's emote. We do the emoteList lookup HERE and hand the patched
  // famille SWF the 1-based eye/mouth frame numbers (fe/fm) to gotoAndStop, so
  // it doesn't depend on the SWF's own (non-root-callable) emote() function.
  // emoteList[e] = [eyeIndex, mouthIndex]; eye frames: 1=normal 2=mecontent
  // 3=triste 4=content. e=7 == the totoché face. Absent/0 == normal.
  var emote = String(params.get("e") || "0");
  var EMOTE_LIST = [[0,0],[1,2],[2,1],[0,3],[3,4],[1,4],[2,3],[2,6]];
  var _ei = parseInt(emote, 10);
  if (!(_ei >= 0 && _ei < EMOTE_LIST.length)) _ei = 0;
  var feFrame = String(EMOTE_LIST[_ei][0] + 1);
  var fmFrame = String(EMOTE_LIST[_ei][1] + 1);
  // anim — optional animation INDEX for the bouille's own playAnim dispatcher:
  //   1 parle · 2 rire · 3 mdr · 4 langue · 5 rougir · 6 regard
  //   7 sifflote · 8 gum · 9 question · 10 miam · 11 pleurer
  // Forwarded as a flashvar; the patched famille SWF reads _root.anim and, when
  // non-empty, calls _root.playAnim(Number(_root.anim)). playAnim is the game's
  // own routine — it plays the face reel AND drives the mouth sub-clip (rire→
  // "rire0", sifflote→"siffle", …) AND the eyes, so animations render exactly
  // like in chat (fixes the earlier "rire/sifflote bouche fermée" bug where we
  // only played the reel). Absent → fall back to the mood freeze (legacy
  // behaviour used by FBouille editor previews and chat-side thumbnails).
  var anim = String(params.get("anim") || "");
  // bg — page background colour. Default = light forum-card green
  // (#E8F8D3, used by the forum thumbnails and FBouille editor). The demo
  // page passes ?bg=ADE76B to use the brighter Frutiparc green for HD
  // captures. Hex only, no '#' in the query string.
  var bg = String(params.get("bg") || "E8F8D3").replace(/[^0-9A-Fa-f]/g, '');
  if (!bg) bg = "E8F8D3";
  var bgCss = "#" + bg;
  document.documentElement.style.background = bgCss;
  document.body.style.background = bgCss;

  function decode62(s) {
    var result = 0, mult = 1;
    for (var i = s.length - 1; i >= 0; i--) {
      var c = s.charAt(i);
      var v;
      if (c === c.toLowerCase()) {
        v = parseInt(c, 36);
      } else {
        v = parseInt(c.toLowerCase(), 36) + 26;
      }
      result += v * mult;
      mult *= 62;
    }
    return result;
  }

  window.addEventListener("DOMContentLoaded", async function () {
    if (!window.RufflePlayer || !window.RufflePlayer.newest) return;
    var familyId = decode62(state.substring(0, 2));
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    document.getElementById("player-container").appendChild(player);
    await player.load({
      // ?v=7 because the patched SWFs now route animations through the game's
      // own _root.playAnim(index) dispatcher (drives the mouth + eyes, not just
      // the face reel), fixing rire/sifflote rendering with a closed mouth.
      url: "/fbouille_patched/famille" + familyId + ".swf?v=7",
      autoplay: "on",
      allowScriptAccess: true,
      quality: "low",
      backgroundColor: bgCss,
      parameters: { s: state, e: emote, fe: feFrame, fm: fmFrame, anim: anim },
      allowNetworking: "all"
    });
  });
})();
</script>
</body>
</html>
